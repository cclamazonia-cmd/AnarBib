project_id = "anarbib"

# =============================================================================
# AnarBib — Configuration Supabase CLI
# =============================================================================
# Ce fichier est lu automatiquement par `supabase functions deploy` et impose
# par fonction des paramètres qui ne doivent PAS revenir au défaut entre
# déploiements (notamment verify_jwt).
#
# Référence : https://supabase.com/docs/guides/cli/config#functions.function_name.verify_jwt
#
# Convention :
#   - verify_jwt = false         pour les fonctions appelées par des webhooks
#                                internes (DB → Edge via x-webhook-secret) ou
#                                des intégrations qui n'utilisent pas de JWT
#                                Supabase Auth.
#   - verify_jwt non déclaré      pour les fonctions appelées par le frontend
#     (default = true)           authentifié (utilisent le JWT Supabase Auth).
#
# RÉCONCILIÉ LE 2026-08-30 (item B6). Le fichier était JUSTE ; ce sont les
# chiffres de ce commentaire qui avaient vieilli, et le backlog en avait conclu
# à tort que « 18 des 48 fonctions déployées ne sont pas déclarées du tout ».
# Ne pas déclarer une fonction n'est pas un oubli : c'est la façon de lui laisser
# le défaut de la plateforme, qui est le réglage le PLUS fermé. Déclarer les 48
# ajouterait du bruit et une seconde source de vérité à tenir à jour.
#
# Relevé du 2026-08-30 (48 fonctions déployées, `supabase functions list`) :
#   * 31 déclarées ici, toutes à false, et toutes à false en production ;
#   * 17 non déclarées, toutes à true en production (le défaut) ;
#   * AUCUN désaccord entre ce fichier et la production, dans un sens ou dans
#     l'autre — aucune déclaration orpheline, aucune valeur divergente.
# Les listes nominatives ci-dessous datent du 07/05 et n'ont pas été refaites :
# elles illustrent la règle, elles ne l'inventorient plus. La source de vérité
# est la liste des sections [functions.*] de ce fichier, pas ce commentaire.
#
# Inventaire illustratif au 2026-05-07 :
#
#   verify_jwt: false  (déclarées ci-dessous — 36 au 01/09/2026)
#     - notify-event, notify-internal-task, notify-library-request,
#       notify-weekly-report, notify-network-weekly-report,
#       notify-mid-loan-reading, notify-document-permission-request,
#       notify-interlibrary-loan, notify-oai-opening  (9 mailers via webhook secret)
#     - read-pdf, bn_isbn_lookup, process-partner-catalog-import,
#       read-digital-asset, fetch-url-metadata, oai-pmh-provider
#       (6 utilitaires publics ou avec auth interne custom ; oai-pmh-provider
#        = endpoint OAI-PMH moissonnable par des harvesters externes sans JWT,
#        gate applicatif via fn_oai_harvestable_* — paquet OAI-O2, 12/06/2026)
#
#   verify_jwt: true   (AUCUNE déclaration nécessaire — 15 au 01/09/2026)
#     - register (création de compte, JWT Supabase obligatoire)
#     - probe-partner-catalog
#     - catalog_metadata_lookup
#     - cover_lookup (recherche de capas multi-sources, appel frontend authentifié)
#     - mail-i18n-test
#     - login (Edge wrapper d'auth)
#
# =============================================================================
# Mailers (déclenchés par webhook secret depuis pg_net via fn_dispatch_*)
# =============================================================================

[functions.notify-event]
verify_jwt = false

[functions.notify-internal-task]
verify_jwt = false

[functions.notify-library-request]
verify_jwt = false

[functions.notify-weekly-report]
verify_jwt = false

[functions.notify-network-weekly-report]
verify_jwt = false

[functions.notify-rede-digest]
verify_jwt = false

[functions.notify-mid-loan-reading]
verify_jwt = false

# Les trois rappels d'echeance et l'invitation a ecrire une note de lecture.
# Remplace notify-mid-loan-reading (dont le cron est desactive par la migration
# 20260831111700). Appelee par le cron anarbib-notify-loan-cycle-daily via
# net.http_post, donc sans JWT ; l'authentification passe par x-webhook-secret.
[functions.notify-loan-cycle]
verify_jwt = false

[functions.notify-document-permission-request]
verify_jwt = false

[functions.notify-interlibrary-loan]
verify_jwt = false

# Gouvernance OAI « être source » (paquet OAI-O4) — émis depuis l'adresse fédérale
# via webhook secret WEBHOOK_SECRET_NOTIFY_OAI_OPENING (dispatch fn_oai_*).
[functions.notify-oai-opening]
verify_jwt = false

# Flux de partage numérique ILL (paquet ILL-I4) — notifs biblio↔biblio via webhook
# secret WEBHOOK_SECRET_NOTIFY_DIGITAL_SHARE (dispatch fn_ill_*).
[functions.notify-digital-share]
verify_jwt = false

# =============================================================================
# Utilitaires publics ou avec authentification custom
# =============================================================================

[functions.read-pdf]
verify_jwt = false

# Contributions ouvertes à la Gazette (réception publique, rate-limitée).
[functions.submit-gazette-contribution]
verify_jwt = false

# Auto-déclaration « ajouter ma biblio » sur la carte (MAP-J, réception publique, rate-limitée).
[functions.submit-cartography-entry]
verify_jwt = false

# Build mensuel de la Gazette (orchestré par pg_cron, protégé par X-Cron-Secret).
[functions.gazette-monthly-build]
verify_jwt = false

# Traduction des brèves réseau dans les 10 locales (orchestré par pg_cron, X-Cron-Secret).
[functions.translate-gazette-submission]
verify_jwt = false

# Pré-traduction des titres d'œuvre (lot 3 OPAC par œuvre) : appelée par pg_cron, protégée par X-Cron-Secret.
[functions.work-titles-autofill]
verify_jwt = false

# Lettre de la fédération : confirmation double opt-in + désabonnement 1-clic (publics, token-gated).
[functions.lettre-confirm]
verify_jwt = false

[functions.lettre-unsubscribe]
verify_jwt = false

[functions.bn_isbn_lookup]
verify_jwt = false

[functions.process-partner-catalog-import]
verify_jwt = false

# Réception d'un lot de fonds (paquet EX-3) : appelée server-to-server par le
# dispatch SQL (detected_format='zip') avec auth interne x-import-secret, sans JWT.
[functions.receive-fonds-bundle]
verify_jwt = false

# Moissonnage OAI-PMH (Lot 3b) : appelee server-to-server par
# ingest.fn_dispatch_oai_harvest (pg_net) avec auth interne x-import-secret,
# sans JWT — meme secret et meme en-tete que ses deux soeurs ci-dessus.
[functions.harvest-oai-pmh]
verify_jwt = false

# GC des dépôts attachés (point 2) : appelée par le cron SQL (ingest.fn_cron_gc_deposits)
# avec auth interne x-import-secret, sans JWT.
[functions.gc-deposits]
verify_jwt = false

[functions.read-digital-asset]
verify_jwt = false

[functions.fetch-url-metadata]
verify_jwt = false

# OAI-PMH provider (« etre source », paquet OAI-O2) : moissonne par des biblios
# externes sans JWT. N'expose QUE les biblios a ouverture active (gate applicatif
# fn_oai_harvestable_libraries / _records, service_role). Catalogue ferme => rien.
[functions.oai-pmh-provider]
verify_jwt = false

# Accès au reçu d'un partage numérique ILL (paquet ILL-I2) : JWT usager relayé,
# autorisation re-validée par fn_ill_signed_url ; URL signée TTL court (mode ponctuel).
[functions.read-ill-shared-asset]
verify_jwt = false

# Avis de sécurité aux membres. Appelée depuis SQL via net.http_post, sans JWT :
# l'authentification est le secret Vault WEBHOOK_SECRET_NOTIFY_SECURITY_NOTICE,
# vérifié côté base (fn_check_security_notice_secret), sans repli sur un Bearer.
[functions.notify-security-notice]
verify_jwt = false

# Supervision : sonde de disponibilité appelée par le cron anarbib-health-probe
# via net.http_post, donc sans JWT. Authentification = secret Vault
# WEBHOOK_SECRET_HEALTH_PROBE, vérifié côté base (fn_check_health_probe_secret).
[functions.health-probe]
verify_jwt = false

# Récapitulatif hebdomadaire des actions inter-bibliothèques (transparence des
# pouvoirs d'administration réseau). Appelée par le cron
# anarbib-notify-cross-library-digest-weekly via net.http_post, donc sans JWT.
[functions.notify-cross-library-digest]
verify_jwt = false

# Émet un défi de preuve de travail anti-robots. Appelée AVANT toute session,
# depuis la page d'inscription et la cartographie : publique par construction.
# N'expose rien — un défi est un aléa signé, le connaître ne donne aucun
# pouvoir. Cf. DECISION_anti_robots_2026-08-20 (AR-3).
[functions.altcha-challenge]
verify_jwt = false

# Flux OPDS 1.2 du catalogue numerique public (item H4). Anonyme par nature :
# une liseuse ne porte pas de JWT. La fonction ne sert QUE les ressources
# access_scope='publico' actives — meme predicat que documents_numeriques_tests.
[functions.opds]
verify_jwt = false

# E11 (03/09/2026) : le flux RSS des nouveautés d'une bibliothèque — anonyme par
# nature, deux gardes dans la fonction (bibliothèque publique, vue publique).
[functions.rss-novidades]
verify_jwt = false

# Les trois portes ouvertes AVANT toute session : se connecter, créer un compte,
# récupérer son mot de passe. Elles étaient en verify_jwt=true, ce qui ne
# protégeait rien : la clé qui satisfaisait ce contrôle est la clé anon,
# publique par nature et embarquée dans le bundle du front. Le contrôle réel
# est dans chaque fonction — auth_rate_limits pour login et
# request-password-reset, défi Altcha pour register (comme altcha-challenge
# ci-dessus).
#
# Le passage à false est un PRÉALABLE à la bascule du front vers la clé
# publiable : celle-ci n'est pas un JWT, la vérification de plateforme la
# rejetterait en 401 et personne ne pourrait plus se connecter (01/09/2026).
[functions.login]
verify_jwt = false

[functions.register]
verify_jwt = false

[functions.request-password-reset]
verify_jwt = false
