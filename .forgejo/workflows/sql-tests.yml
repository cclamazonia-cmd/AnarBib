# =============================================================================
# Forgejo Actions — Tests SQL d'acceptation (AnarBib)
#
# But : exécuter les suites SQL (tests/sql/*) automatiquement quand le SCHÉMA ou
# les tests changent, pour attraper les régressions des fonctions métier
# (cotisation, renouvellement, …). Complète le gate lint/vitest de ci.yml.
#
# Déclenché UNIQUEMENT sur les chemins pertinents (migrations / seed / tests/sql /
# le runner) — PAS à chaque push (un push 100 % frontend ne reconstruit pas la
# base). Cf. cadrage validé (réutilise les suites DO-block existantes + seed.sql).
#
# Mécanique (cf. scripts/ci/run-sql-suites.sh) : un `services:` postgres
# (image db du stack) fournit le serveur ; le job s'y connecte en psql, crée une
# base FRAÎCHE (TEMPLATE template0 → aucun event trigger hérité), stube le schéma
# `auth`, applique baseline + forward + seed, puis joue les suites du manifeste
# tests/sql/ci-suites.txt. 100 % isolé : NE TOUCHE JAMAIS la prod.
#
# Indépendant de ci.yml (groupe de concurrence distinct) : c'est un SIGNAL de
# régression, pas un gate du déploiement (le `supabase db push` vit dans ci.yml).
# Runner : `anarbib-local` (auto-hébergé WSL2). [skip ci]/[ci skip] = run sauté.
# =============================================================================
name: Tests SQL

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'tests/sql/**'
      - 'scripts/ci/run-sql-suites.sh'
      - '.forgejo/workflows/sql-tests.yml'
      # Classement des tables pour la sauvegarde #BG2 : le job le compare au
      # schéma reconstruit (filet, cf. run-sql-suites.sh). Le déclencheur
      # `supabase/migrations/**` couvre déjà le cas « une migration crée une
      # table » ; celui-ci couvre le cas inverse — on corrige le classement.
      - 'deploy/bg2-known-tables.txt'
  workflow_dispatch: {}

# Groupe DISTINCT de cicd-main : on ne veut pas qu'un run sql-tests et un run
# ci.yml déclenchés par le même push s'annulent mutuellement (pending superseded).
# Le runner mono-machine les sérialise de toute façon à l'exécution.
concurrency:
  group: cicd-sql-tests
  cancel-in-progress: false

jobs:
  sql-tests:
    runs-on: anarbib-local
    container:
      image: node:22
    services:
      db:
        image: public.ecr.aws/supabase/postgres:17.6.1.084  # = image db du stack local
        env:
          POSTGRES_PASSWORD: postgres
        # Health TCP : l'image lance un serveur d'amorçage (socket-only) puis le
        # serveur FINAL (TCP) — on n'est « healthy » qu'au serveur final.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    steps:
      - name: Outils système (git, psql)
        run: |
          apt-get update -qq
          apt-get install -y -qq git postgresql-client >/dev/null
          echo "✓ outils prêts ($(psql --version))"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Suites SQL d'acceptation
        env:
          PGHOST: db
          PGPASSWORD: postgres
        run: bash scripts/ci/run-sql-suites.sh

  # ── Alerte : un seul ticket par workflow, rouvert et referme ────────────
  #
  # OPS-6 ouvrait un ticket NEUF a chaque episode rouge. Deux defauts, tous
  # deux constates le 31/08 en EXECUTANT, pas en relisant.
  #
  # 1. LA FORGE REFUSE. Codeberg limite les tickets de titre semblable a DEUX
  #    par heure et par autrice : « NewIssue: posted 2 similairy named issues
  #    in the last hour: rate limited », HTTP 429. Le troisieme rouge d'une
  #    heure chargee n'alerte donc personne — l'angle mort du 17-20/08,
  #    reconstitue par la protection censee le fermer.
  #
  # 2. L'ALERTE SE TAISAIT SUR SA PROPRE PANNE. `continue-on-error` plus un
  #    `|| echo 000` rendaient le job VERT apres ce 429. DOC-SILENCE-1 viole a
  #    l'interieur meme du dispositif d'alerte. Le `continue-on-error` est
  #    donc RETIRE ici : sur le chemin de l'echec il n'y a rien a masquer, le
  #    run est deja rouge. Il reste sur `acquittement`, qui tourne sur un run
  #    vert et ne doit pas le faire rougir.
  #
  # D'OU CE MODELE : un seul ticket par workflow, pour toujours. Ouvert au
  # premier rouge, ROUVERT aux suivants, referme par `acquittement` au retour
  # au vert. Son etat est le miroir vivant de la sante de la CI ; ses
  # commentaires en sont le journal des episodes, avec leurs commits. La
  # limite de la forge ne peut plus se declencher, puisqu'on ne cree plus
  # jamais de second ticket. Et l'anti-doublon n'est plus une comparaison de
  # chaines : c'est l'etat du ticket.
  #
  # `sort=recentupdate` : le ticket est touche a chaque episode, il reste donc
  # en tete des 50 lus. S'il en sortait un jour, on retomberait sur la
  # creation — degradation, pas panne.
  alerte:
    needs: sql-tests
    if: failure()
    runs-on: anarbib-local
    container:
      image: node:22
    steps:
      - name: Ouvrir ou rouvrir le ticket de rouge
        env:
          FORGE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "::error::GITEA_TOKEN absent : ce rouge n'est signale nulle part."
            exit 1
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          MARQUEUR="[CI rouge] sql-tests"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -o /tmp/tickets.json -H "Authorization: token ${FORGE_TOKEN}" "${API}/issues?state=all&limit=50&sort=recentupdate" || { echo "::error::lecture des tickets impossible : ce rouge n'est signale nulle part."; exit 1; }

          # Titre EXACT. Le plus recemment touche gagne, et il porte son etat.
          LIGNE=$(node -e 'const fs=require("fs");let l=[];try{l=JSON.parse(fs.readFileSync("/tmp/tickets.json","utf8"))}catch(e){};const h=Array.isArray(l)?l.find(i=>i&&i.title===process.argv[1]):null;process.stdout.write(h?(h.number+" "+h.state):"")' "$MARQUEUR")
          NUM="${LIGNE%% *}"
          ETAT="${LIGNE##* }"

          if [ "$ETAT" = "open" ]; then
            echo "Ticket #${NUM} deja ouvert : cet episode rouge est deja signale, rien a faire."
            exit 0
          fi

          CORPS="Le workflow **sql-tests** a echoue sur \`${GITHUB_REF_NAME}\`.

          - Commit : ${GITHUB_SHA}
          - Run : ${RUN_URL}

          Ce ticket est le temoin unique du workflow : il s'ouvre au rouge et se
          referme au retour au vert (REGISTRE OPS-8). Le refermer a la main veut
          dire « je l'ai vu et j'accepte que ca reste rouge »."

          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/corps.json",JSON.stringify({body:process.argv[1]}))' "$CORPS"

          if [ -n "$NUM" ]; then
            C1=$(curl -sS -o /tmp/r1.json -w '%{http_code}' -X POST -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data @/tmp/corps.json "${API}/issues/${NUM}/comments" || echo 000)
            C2=$(curl -sS -o /tmp/r2.json -w '%{http_code}' -X PATCH -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data '{"state":"open"}' "${API}/issues/${NUM}" || echo 000)
            echo "Reouverture du ticket #${NUM} : commentaire HTTP ${C1}, etat HTTP ${C2}"
            case "$C2" in
              200|201) ;;
              *) echo "::error::le ticket #${NUM} n'a pas ete rouvert (HTTP ${C2}) : ce rouge n'est signale nulle part."
                 head -c 400 /tmp/r2.json; exit 1 ;;
            esac
            exit 0
          fi

          # Aucun ticket ne porte encore ce marqueur : c'est le premier de la
          # vie du workflow. Ce chemin ne devrait servir qu'une fois.
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/tmp/corps.json","utf8"));fs.writeFileSync("/tmp/issue.json",JSON.stringify({title:process.argv[1],body:c.body}))' "$MARQUEUR"
          CODE=$(curl -sS -o /tmp/r3.json -w '%{http_code}' -X POST -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data @/tmp/issue.json "${API}/issues" || echo 000)
          echo "Creation du ticket : HTTP ${CODE}"
          case "$CODE" in
            200|201) ;;
            *) echo "::error::aucun ticket cree (HTTP ${CODE}) : ce rouge n'est signale nulle part."
               head -c 400 /tmp/r3.json; exit 1 ;;
          esac

  # ── Acquittement : c'est le retour au vert qui referme, pas un clic ─────
  #
  # Le 30/08, dix tickets [CI rouge] ont ete ouverts et refermes a la main
  # dans la seule journee, pour un seul et meme rouge. L'anti-doublon ne joue
  # que tant que le ticket reste OUVERT : le refermer pour dire « j'ai vu »
  # rearme l'alarme pour l'iteration d'apres. Une alerte dont l'acquittement
  # est un geste humain repete n'est plus une alerte (REGISTRE OPS-8).
  #
  # Desormais : un episode rouge = un ticket, referme par le retour au vert.
  # Refermer a la main reprend son sens propre — « je l'ai vu et j'accepte
  # que ca reste rouge » — et doit redevenir rare.
  #
  # `continue-on-error` : un acquittement casse ne doit jamais faire rougir un
  # run qui est vert. Symetrique de la regle du job `alerte`.
  acquittement:
    needs: [sql-tests]
    if: ${{ !cancelled() && needs['sql-tests'].result == 'success' }}
    runs-on: anarbib-local
    container:
      image: node:22
    continue-on-error: true
    steps:
      - name: Refermer le ticket de rouge s'il y en a un
        env:
          FORGE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "GITEA_TOKEN absent : acquittement impossible."
            exit 0
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          MARQUEUR="[CI rouge] sql-tests"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -o /tmp/ouvertes.json -H "Authorization: token ${FORGE_TOKEN}" "${API}/issues?state=open&limit=50" || { echo "Lecture des tickets impossible : rien acquitte."; exit 0; }

          # Titre EXACT, pas une sous-chaine : « [CI rouge] ci » ne doit jamais
          # refermer « [CI rouge] sql-tests », et reciproquement. Le job
          # `alerte` peut se permettre un grep, celui-ci non : il FERME.
          NUM=$(node -e 'const fs=require("fs");let l=[];try{l=JSON.parse(fs.readFileSync("/tmp/ouvertes.json","utf8"))}catch(e){};const h=Array.isArray(l)?l.find(i=>i&&i.title===process.argv[1]):null;process.stdout.write(h?String(h.number):"")' "$MARQUEUR")

          if [ -z "$NUM" ]; then
            echo "Aucun ticket ouvert ne porte le marqueur : rien a acquitter."
            exit 0
          fi

          CORPS="Vert a nouveau sur \`${GITHUB_REF_NAME}\`.

          - Commit : ${GITHUB_SHA}
          - Run : ${RUN_URL}

          Referme automatiquement : l'acquittement d'une alerte est le retour au
          vert, pas un clic (REGISTRE OPS-8)."

          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/commentaire.json",JSON.stringify({body:process.argv[1]}))' "$CORPS"
          curl -sS -o /dev/null -X POST -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data @/tmp/commentaire.json "${API}/issues/${NUM}/comments" || echo "Commentaire non depose : on referme quand meme."

          CODE=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' -X PATCH -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data '{"state":"closed"}' "${API}/issues/${NUM}" || echo 000)
          echo "Fermeture du ticket #${NUM} : HTTP ${CODE}"
          { [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; } || head -c 400 /tmp/reponse.json
