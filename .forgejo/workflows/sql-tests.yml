# =============================================================================
# Forgejo Actions — Tests SQL d'acceptation (AnarBib)
#
# But : exécuter les suites SQL (tests/sql/*) automatiquement quand le SCHÉMA ou
# les tests changent, pour attraper les régressions des fonctions métier
# (cotisation, renouvellement, …). Complète le gate lint/vitest de ci.yml.
#
# Déclenché UNIQUEMENT sur les chemins pertinents (migrations / seed / tests/sql /
# le runner) — PAS à chaque push (un push 100 % frontend ne reconstruit pas la
# base). Cf. cadrage validé (réutilise les suites DO-block existantes + seed.sql).
#
# Mécanique (cf. scripts/ci/run-sql-suites.sh) : un `services:` postgres
# (image db du stack) fournit le serveur ; le job s'y connecte en psql, crée une
# base FRAÎCHE (TEMPLATE template0 → aucun event trigger hérité), stube le schéma
# `auth`, applique baseline + forward + seed, puis joue les suites du manifeste
# tests/sql/ci-suites.txt. 100 % isolé : NE TOUCHE JAMAIS la prod.
#
# Indépendant de ci.yml (groupe de concurrence distinct) : c'est un SIGNAL de
# régression, pas un gate du déploiement (le `supabase db push` vit dans ci.yml).
# Runner : `anarbib-local` (auto-hébergé WSL2). [skip ci]/[ci skip] = run sauté.
# =============================================================================
name: Tests SQL

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'tests/sql/**'
      - 'scripts/ci/run-sql-suites.sh'
      - '.forgejo/workflows/sql-tests.yml'
  workflow_dispatch: {}

# Groupe DISTINCT de cicd-main : on ne veut pas qu'un run sql-tests et un run
# ci.yml déclenchés par le même push s'annulent mutuellement (pending superseded).
# Le runner mono-machine les sérialise de toute façon à l'exécution.
concurrency:
  group: cicd-sql-tests
  cancel-in-progress: false

jobs:
  sql-tests:
    runs-on: anarbib-local
    container:
      image: node:20
    services:
      db:
        image: public.ecr.aws/supabase/postgres:17.6.1.084  # = image db du stack local
        env:
          POSTGRES_PASSWORD: postgres
        # Health TCP : l'image lance un serveur d'amorçage (socket-only) puis le
        # serveur FINAL (TCP) — on n'est « healthy » qu'au serveur final.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    steps:
      - name: Outils système (git, psql)
        run: |
          apt-get update -qq
          apt-get install -y -qq git postgresql-client >/dev/null
          echo "✓ outils prêts ($(psql --version))"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Suites SQL d'acceptation
        env:
          PGHOST: db
          PGPASSWORD: postgres
        run: bash scripts/ci/run-sql-suites.sh

  # ── Alerte : la forge doit DIRE qu'un workflow a echoue ─────────────────
  #
  # PLAN_DE_MARCHE §8. `sql-tests` est reste rouge du 17 au 20/08 sans que
  # personne le voie : un run rouge dans une liste ne se remarque pas. Une
  # issue, si — le depot est suivi, donc Forgejo envoie un courriel. C'est le
  # meme angle mort que les sauvegardes, et il n'etait pas couvert.
  #
  # AUCUN SECRET A CREER : Forgejo Actions injecte automatiquement GITEA_TOKEN,
  # limite a ce depot. Rien a poser dans l'interface de la forge.
  #
  # ANTI-DOUBLON : on n'ouvre rien si une issue ouverte porte deja le marqueur,
  # sinon chaque push rouge en creerait une. Refermer l'issue vaut acquittement ;
  # si le rouge revient ensuite, une nouvelle sera ouverte.
  #
  # `continue-on-error` : une alerte cassee ne doit jamais masquer l'echec reel
  # qu'elle signale.
  alerte:
    needs: sql-tests
    if: failure()
    runs-on: anarbib-local
    container:
      image: node:20
    continue-on-error: true
    steps:
      - name: Ouvrir une issue si le rouge n'est pas deja signale
        env:
          FORGE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "GITEA_TOKEN absent : alerte impossible (verifier que les Actions ont le droit d'ecrire les tickets)."
            exit 0
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          MARQUEUR="[CI rouge] sql-tests"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          OUVERTES=$(curl -sS -H "Authorization: token ${FORGE_TOKEN}"             "${API}/issues?state=open&limit=50" || echo '')
          if printf '%s' "$OUVERTES" | grep -qF "$MARQUEUR"; then
            echo "Une issue ouverte porte deja le marqueur : pas de doublon."
            exit 0
          fi

          CORPS="Le workflow **sql-tests** a echoue sur \`${GITHUB_REF_NAME}\`.

          - Commit : ${GITHUB_SHA}
          - Run : ${RUN_URL}

          Cette issue est ouverte automatiquement parce qu'un run rouge passe
          inapercu (vecu du 17 au 20/08/2026). **La refermer vaut acquittement** :
          tant qu'elle reste ouverte, aucune nouvelle ne sera creee."

          # Echappement JSON par node : l'image node:20 le garantit, pas python3.
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/issue.json",JSON.stringify({title:process.argv[1],body:process.argv[2]}))'             "$MARQUEUR" "$CORPS"

          CODE=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' -X POST             -H "Authorization: token ${FORGE_TOKEN}"             -H "Content-Type: application/json"             --data @/tmp/issue.json "${API}/issues" || echo 000)
          echo "Creation de l'issue : HTTP ${CODE}"
          [ "$CODE" = "201" ] || head -c 400 /tmp/reponse.json
