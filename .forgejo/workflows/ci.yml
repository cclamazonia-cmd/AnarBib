# =============================================================================
# Forgejo Actions — CI/CD AnarBib   (a remplacé Woodpecker hébergé instable)
#
# ⏱️  Les runners mutualisés Codeberg coupent un job à ~5 min de temps d'exécution
#     (« The runner cancelled the job because it exceeds the maximum run time »).
#     Notre pipeline monolithique frôlait les 5 min → annulations aléatoires à
#     l'étape en cours (le « podman context deadline exceeded » n'était QUE le
#     symptôme du conteneur tué à la limite). La limite étant PAR JOB, on scinde :
#       • job `app`     : install → lint(BLOQUANT) → test(BLOQUANT) → build → Pages(non bloquant)  (~4 min)
#       • job `backend` : edge functions → migrations SQL   (~2 min, PAS de npm install)
#     `backend: needs: app` → sérialise et garde le gate lint/test avant tout déploiement.
#     Durable (plus tard) : runner auto-hébergé (act_runner) = aucune limite.
#
# Runner : `anarbib-local` — runner AUTO-HÉBERGÉ (act_runner sur le WSL2 de Xavier).
# Plus de limite ~5 min ni de file mutualisée ; tourne quand sa machine est allumée
# (= quand il dev). Le découpage app/backend ci-dessous n'est donc plus imposé par
# la limite, mais on le garde (isolation + parallélisme). Si le runner local est
# hors-ligne, les runs attendent — c'est voulu (seul dev). Miroir GitHub : dual-push
# `origin` (Codeberg bloque les miroirs natifs). [skip ci]/[ci skip] = run sauté.
# Déploiements : uniquement sur push (jamais en run manuel workflow_dispatch).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    # Bypass robuste des pushes 100 % documentaires (indépendant de la casse :
    # Forgejo n'a pas honoré « [CI SKIP] » majuscule).
    #
    # ⚠️ DÉMENTI PAR L'EXPÉRIENCE (26/08/2026). Ce commentaire affirmait qu'« un push
    # MIXTE docs+code déclenche quand même, paths-ignore ne saute que si TOUS les
    # fichiers matchent » — la sémantique GitHub Actions. Forgejo ne se comporte pas
    # ainsi ici : le push f5e6fb39 contenait DEUX commits — une migration SQL
    # (20260826160000, non couverte par paths-ignore) puis un commit 100 % docs —
    # et ce workflow n'a PAS tourné. Seul sql-tests.yml, qui filtre en `paths:`
    # positif, s'est déclenché. La migration est donc restée au dépôt sans être
    # appliquée, sans qu'aucun rouge ne le signale : le déploiement n'a pas échoué,
    # il n'a pas eu lieu.
    #
    # RÈGLE PRATIQUE, jusqu'à ce que le mécanisme exact soit établi : ne jamais
    # mélanger doc et code dans un même push. Pousser le code SEUL (il déclenche
    # à coup sûr, quelle que soit la sémantique retenue), puis la doc à part.
    # Et après tout push censé appliquer une migration, VÉRIFIER en base
    # (supabase_migrations.schema_migrations) plutôt que de conclure du vert d'un job.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'notes-audit/**'
  workflow_dispatch: {}

# Sérialise les pipelines main (la « règle d'or » anti-push-concurrent, native).
concurrency:
  group: cicd-main
  cancel-in-progress: false

jobs:
  # ───────────────────────── Job 1 : app (build + Pages) ─────────────────────
  app:
    runs-on: anarbib-local
    container:
      image: node:20
    steps:
      - name: Outils système (git, curl, tar)
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl tar >/dev/null
          echo "✓ outils prêts"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install des dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint) — BLOQUANT
        run: npm run lint

      - name: Tests (vitest) — BLOQUANT
        run: npm test

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Visio d'entraide : instance Jitsi militante Autistici/Inventati (accord A/I
          # du 16/06 — « usage direct », pas d'embedding : on ouvre en onglet dédié).
          # Valeur publique (pas un secret). Repli meet.jit.si si non défini.
          VITE_JITSI_DOMAIN: vc.autistici.org
        run: |
          npm run build
          test -d dist || (echo "✗ dist/ introuvable" && exit 1)
          echo "✓ build OK"

      # ─────────── BASCULE git-pages sur app.anarbib.org (21/08/2026) ───────────
      # Remplace la poussée d'un delta sur la branche `pages` (ancien moteur v2).
      # Étape 3 de PLAN_migration_git_pages_2026-08-19, après l'essai concluant du
      # 20/08 sur test.anarbib.org (étape 0) et la pose des TXT d'autorisation sur
      # app.anarbib.org (étape 1, vérifiés sur deux résolveurs le 21/08).
      #
      # DIFFÉRENCE DE FOND : git-pages ne va plus CHERCHER la branche `pages` tout
      # seul. C'est cette action qui téléverse dist/ et le lui signale. La branche
      # `pages`, `public/.domains` et les secrets CODEBERG_TOKEN / CODEBERG_USER /
      # CUSTOM_DOMAIN n'ont donc plus d'objet ICI — nettoyage à l'étape 5, une fois
      # la bascule constatée, et seulement après avoir vérifié que `npm run deploy`
      # ne s'en sert pas.
      #
      # Les quarante lignes de contournement disparaissent avec l'ancienne étape :
      # clone shallow, delta, postBuffer, HTTP/1.1, trois tentatives, copie
      # d'index.html en 404.html. Elles compensaient les 504 et les paquets
      # corrompus de la poussée git ; il n'y a plus de poussée git.
      #
      # Le repli SPA est maintenant tenu par `public/_redirects` (`/* /index.html
      # 200`), déjà au dépôt. Gain net : une route profonde inconnue répond 200 au
      # lieu de 404-avec-le-bon-contenu — meilleur pour le référencement, les tests
      # et le service worker.
      #
      # ⚠️ `if: push` AJOUTÉ À LA BASCULE. L'étape d'essai n'en avait pas : sur
      # test.anarbib.org c'était sans conséquence, sur la production une simple
      # pull request aurait déployé.
      #
      # NON BLOQUANT (continue-on-error) : un échec Codeberg ne doit pas priver
      # `backend` (needs: app) du déploiement des migrations et des fonctions. En
      # cas d'échec le site continue de servir son contenu actuel — il cesse
      # seulement d'être mis à jour.
      #
      # `server:` est requis au premier déploiement sur un domaine personnalisé
      # (il évite la dépendance circulaire certificat ↔ site). Inoffensif ensuite.
      #
      # ⚠️ `token` : la doc Codeberg écrit ${{ forge.token }}, le README de
      # l'action écrit ${{ forgejo.token }}. Si celui-ci échoue, essayer l'autre.
      # C'est le seul point du plan laissé au tâtonnement.
      #
      # ⚠️ CONTRÔLE : ne PAS vérifier la bascule par /.git-pages/manifest.json.
      # Le repli SPA intercepte ce chemin et renvoie index.html en 200, sous
      # l'ancien moteur comme sous le nouveau — un vert qui ne prouve rien. La
      # seule preuve est qu'une modification de contenu apparaisse en ligne.
      - name: Deploy Pages (git-pages)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 10
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://app.anarbib.org/
          server: codeberg.page
          token: ${{ forge.token }}
          source: dist/

  # ──────────────────── Job 2 : backend (Supabase) — sur push ────────────────
  # needs: app → ne déploie QUE si lint/test/build ont réussi (gate préservé).
  # Pas de npm install ici (CLI Supabase autonome) → job court, bien sous 5 min.
  backend:
    needs: app
    if: github.event_name == 'push'
    runs-on: anarbib-local
    container:
      image: node:20
    steps:
      - name: Outils système (git, curl, tar)
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl tar >/dev/null
          echo "✓ outils prêts"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer la CLI Supabase
        run: |
          curl -sLo /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.98.1/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/supabase
          supabase --version

      # ─────────────────── DÉCOUPLAGE DE LA FORGE (26/08/2026) ───────────────────
      # Ces deux étapes portaient TOUT le déploiement : la boucle sur les
      # fonctions, ses garde-fous, ses retries, le `db push`. Une suspension de
      # Codeberg — ou simplement un runner hors ligne — emportait donc la capacité
      # à déployer, et il fallait rejouer les commandes de mémoire, au pire moment.
      #
      # La logique vit maintenant dans `scripts/ci/deployer-backend.sh`, rejouable
      # à la main sur n'importe quelle machine. Elle n'est PAS dupliquée ici : ce
      # fichier ne fait plus que l'appeler avec les secrets de la forge. Changer
      # de forge devient un changement d'adresse.
      #
      # ⚠️ Le garde-fou qui exclut `main` (routeur de la pile auto-hébergée, qui
      # planterait sur Supabase hébergé) a suivi dans le script. Il ne doit
      # disparaître d'aucun des deux endroits.
      #
      # Deux appels et non un seul, pour garder deux étapes distinctes dans le
      # journal de la forge : on voit du premier coup d'œil laquelle a rougi.
      # ───────── `--marqueur`, ET SURTOUT PLUS `github.event.before` ─────────
      # (incident du 27/08/2026 — le récit complet est en tête du bloc « Edge
      # Functions » du script, avec les numéros de run.)
      #
      # Cette étape passait `--depuis "${{ github.event.before }}"` : « déploie
      # si une fonction a changé depuis le push précédent ». Cela suppose que
      # CHAQUE push obtient son run. Ce n'est pas garanti — deux pushes à deux
      # minutes d'intervalle, et Forgejo n'a créé aucun run pour le premier,
      # celui qui touchait `register`. Le run suivant a comparé à un SHA dont le
      # travail n'avait jamais été fait, n'a vu aucune fonction, et a sauté
      # l'étape EN VERT. Rien n'a rougi. `register` a dû être déployée à la main.
      #
      # `--marqueur` ne demande plus rien à la forge : le script compare l'état
      # du dépôt au tag `deployed-functions`, qu'il avance lui-même sur origin
      # après chaque déploiement réussi. Un run manquant ne perd donc plus rien —
      # il reporte le travail au run suivant, qui voit tout ce qui sépare le
      # marqueur de la tête. Le même angle mort couvrait les pushes où le
      # workflow ne se déclenche pas du tout (paths-ignore, 26/08) : il est
      # refermé par la même clé.
      #
      # ⚠️ NE PAS remettre `--depuis "${{ github.event.before }}"` ici. Le script
      # accepte encore `--depuis` pour le rejeu à la main ; en CI c'est le trou.
      #
      # MARQUEUR_TOKEN : le script pousse d'abord le tag avec ce que le checkout
      # lui a laissé, et ne se rabat sur ce jeton que si cette poussée est
      # refusée. GITEA_TOKEN est injecté automatiquement par Forgejo Actions et
      # limité à ce dépôt — rien à créer dans l'interface de la forge. Si le
      # marqueur ne peut pas être poussé, le job reste VERT (le déploiement, lui,
      # a eu lieu) mais le journal porte un avertissement en toutes lettres, et
      # le run suivant redéploiera tout : on perd des minutes, jamais un
      # déploiement.
      #
      # Le tag ne redéclenche aucun workflow : les deux fichiers de .forgejo/
      # filtrent sur `branches: [main]`, qu'une poussée de tag ne satisfait pas.
      - name: Deploy Edge Functions (Supabase CLI)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MARQUEUR_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          chmod +x scripts/ci/deployer-backend.sh
          ./scripts/ci/deployer-backend.sh --fonctions --marqueur

      - name: Deploy Migrations SQL (supabase db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ./scripts/ci/deployer-backend.sh --migrations

  # ── Alerte : la forge doit DIRE qu'un workflow a echoue ─────────────────
  #
  # PLAN_DE_MARCHE §8. `sql-tests` est reste rouge du 17 au 20/08 sans que
  # personne le voie : un run rouge dans une liste ne se remarque pas. Une
  # issue, si — le depot est suivi, donc Forgejo envoie un courriel. C'est le
  # meme angle mort que les sauvegardes, et il n'etait pas couvert.
  #
  # AUCUN SECRET A CREER : Forgejo Actions injecte automatiquement GITEA_TOKEN,
  # limite a ce depot. Rien a poser dans l'interface de la forge.
  #
  # ANTI-DOUBLON : on n'ouvre rien si une issue ouverte porte deja le marqueur,
  # sinon chaque push rouge en creerait une. Refermer l'issue vaut acquittement ;
  # si le rouge revient ensuite, une nouvelle sera ouverte.
  #
  # `continue-on-error` : une alerte cassee ne doit jamais masquer l'echec reel
  # qu'elle signale.
  alerte:
    needs: [app, backend]
    if: failure()
    runs-on: anarbib-local
    container:
      image: node:20
    continue-on-error: true
    steps:
      - name: Ouvrir une issue si le rouge n'est pas deja signale
        env:
          FORGE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "GITEA_TOKEN absent : alerte impossible (verifier que les Actions ont le droit d'ecrire les tickets)."
            exit 0
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          MARQUEUR="[CI rouge] ci"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          OUVERTES=$(curl -sS -H "Authorization: token ${FORGE_TOKEN}"             "${API}/issues?state=open&limit=50" || echo '')
          if printf '%s' "$OUVERTES" | grep -qF "$MARQUEUR"; then
            echo "Une issue ouverte porte deja le marqueur : pas de doublon."
            exit 0
          fi

          CORPS="Le workflow **ci** a echoue sur \`${GITHUB_REF_NAME}\`.

          - Commit : ${GITHUB_SHA}
          - Run : ${RUN_URL}

          Cette issue est ouverte automatiquement parce qu'un run rouge passe
          inapercu (vecu du 17 au 20/08/2026). **La refermer vaut acquittement** :
          tant qu'elle reste ouverte, aucune nouvelle ne sera creee."

          # Echappement JSON par node : l'image node:20 le garantit, pas python3.
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/issue.json",JSON.stringify({title:process.argv[1],body:process.argv[2]}))'             "$MARQUEUR" "$CORPS"

          CODE=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' -X POST             -H "Authorization: token ${FORGE_TOKEN}"             -H "Content-Type: application/json"             --data @/tmp/issue.json "${API}/issues" || echo 000)
          echo "Creation de l'issue : HTTP ${CODE}"
          [ "$CODE" = "201" ] || head -c 400 /tmp/reponse.json

  # ── Acquittement : c'est le retour au vert qui referme, pas un clic ─────
  #
  # Le 30/08, dix tickets [CI rouge] ont ete ouverts et refermes a la main
  # dans la seule journee, pour un seul et meme rouge. L'anti-doublon ne joue
  # que tant que le ticket reste OUVERT : le refermer pour dire « j'ai vu »
  # rearme l'alarme pour l'iteration d'apres. Une alerte dont l'acquittement
  # est un geste humain repete n'est plus une alerte (REGISTRE OPS-8).
  #
  # Desormais : un episode rouge = un ticket, referme par le retour au vert.
  # Refermer a la main reprend son sens propre — « je l'ai vu et j'accepte
  # que ca reste rouge » — et doit redevenir rare.
  #
  # `continue-on-error` : un acquittement casse ne doit jamais faire rougir un
  # run qui est vert. Symetrique de la regle du job `alerte`.
  acquittement:
    needs: [app, backend]
    if: ${{ !cancelled() && needs.app.result == 'success' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: anarbib-local
    container:
      image: node:20
    continue-on-error: true
    steps:
      - name: Refermer le ticket de rouge s'il y en a un
        env:
          FORGE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "GITEA_TOKEN absent : acquittement impossible."
            exit 0
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          MARQUEUR="[CI rouge] ci"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -o /tmp/ouvertes.json -H "Authorization: token ${FORGE_TOKEN}" "${API}/issues?state=open&limit=50" || { echo "Lecture des tickets impossible : rien acquitte."; exit 0; }

          # Titre EXACT, pas une sous-chaine : « [CI rouge] ci » ne doit jamais
          # refermer « [CI rouge] sql-tests », et reciproquement. Le job
          # `alerte` peut se permettre un grep, celui-ci non : il FERME.
          NUM=$(node -e 'const fs=require("fs");let l=[];try{l=JSON.parse(fs.readFileSync("/tmp/ouvertes.json","utf8"))}catch(e){};const h=Array.isArray(l)?l.find(i=>i&&i.title===process.argv[1]):null;process.stdout.write(h?String(h.number):"")' "$MARQUEUR")

          if [ -z "$NUM" ]; then
            echo "Aucun ticket ouvert ne porte le marqueur : rien a acquitter."
            exit 0
          fi

          CORPS="Vert a nouveau sur \`${GITHUB_REF_NAME}\`.

          - Commit : ${GITHUB_SHA}
          - Run : ${RUN_URL}

          Referme automatiquement : l'acquittement d'une alerte est le retour au
          vert, pas un clic (REGISTRE OPS-8)."

          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/commentaire.json",JSON.stringify({body:process.argv[1]}))' "$CORPS"
          curl -sS -o /dev/null -X POST -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data @/tmp/commentaire.json "${API}/issues/${NUM}/comments" || echo "Commentaire non depose : on referme quand meme."

          CODE=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' -X PATCH -H "Authorization: token ${FORGE_TOKEN}" -H "Content-Type: application/json" --data '{"state":"closed"}' "${API}/issues/${NUM}" || echo 000)
          echo "Fermeture du ticket #${NUM} : HTTP ${CODE}"
          { [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; } || head -c 400 /tmp/reponse.json
