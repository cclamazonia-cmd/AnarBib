# =============================================================================
# Forgejo Actions — CI/CD AnarBib   (a remplacé Woodpecker hébergé instable)
#
# ⏱️  Les runners mutualisés Codeberg coupent un job à ~5 min de temps d'exécution
#     (« The runner cancelled the job because it exceeds the maximum run time »).
#     Notre pipeline monolithique frôlait les 5 min → annulations aléatoires à
#     l'étape en cours (le « podman context deadline exceeded » n'était QUE le
#     symptôme du conteneur tué à la limite). La limite étant PAR JOB, on scinde :
#       • job `app`     : install → lint(BLOQUANT) → test(BLOQUANT) → build → Pages(non bloquant)  (~4 min)
#       • job `backend` : edge functions → migrations SQL   (~2 min, PAS de npm install)
#     `backend: needs: app` → sérialise et garde le gate lint/test avant tout déploiement.
#     Durable (plus tard) : runner auto-hébergé (act_runner) = aucune limite.
#
# Runner : `anarbib-local` — runner AUTO-HÉBERGÉ (act_runner sur le WSL2 de Xavier).
# Plus de limite ~5 min ni de file mutualisée ; tourne quand sa machine est allumée
# (= quand il dev). Le découpage app/backend ci-dessous n'est donc plus imposé par
# la limite, mais on le garde (isolation + parallélisme). Si le runner local est
# hors-ligne, les runs attendent — c'est voulu (seul dev). Miroir GitHub : dual-push
# `origin` (Codeberg bloque les miroirs natifs). [skip ci]/[ci skip] = run sauté.
# Déploiements : uniquement sur push (jamais en run manuel workflow_dispatch).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    # Bypass robuste des pushes 100 % documentaires (indépendant de la casse :
    # Forgejo n'a pas honoré « [CI SKIP] » majuscule). Un push MIXTE docs+code
    # déclenche quand même (paths-ignore ne saute que si TOUS les fichiers matchent).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'notes-audit/**'
  workflow_dispatch: {}

# Sérialise les pipelines main (la « règle d'or » anti-push-concurrent, native).
concurrency:
  group: cicd-main
  cancel-in-progress: false

jobs:
  # ───────────────────────── Job 1 : app (build + Pages) ─────────────────────
  app:
    runs-on: anarbib-local
    container:
      image: node:20
    steps:
      - name: Outils système (git, curl, tar)
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl tar >/dev/null
          echo "✓ outils prêts"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install des dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint) — BLOQUANT
        run: npm run lint

      - name: Tests (vitest) — BLOQUANT
        run: npm test

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Visio d'entraide : instance Jitsi militante Autistici/Inventati (accord A/I
          # du 16/06 — « usage direct », pas d'embedding : on ouvre en onglet dédié).
          # Valeur publique (pas un secret). Repli meet.jit.si si non défini.
          VITE_JITSI_DOMAIN: vc.autistici.org
        run: |
          npm run build
          test -d dist || (echo "✗ dist/ introuvable" && exit 1)
          echo "✓ build OK"

      # ─────────── BASCULE git-pages sur app.anarbib.org (21/08/2026) ───────────
      # Remplace la poussée d'un delta sur la branche `pages` (ancien moteur v2).
      # Étape 3 de PLAN_migration_git_pages_2026-08-19, après l'essai concluant du
      # 20/08 sur test.anarbib.org (étape 0) et la pose des TXT d'autorisation sur
      # app.anarbib.org (étape 1, vérifiés sur deux résolveurs le 21/08).
      #
      # DIFFÉRENCE DE FOND : git-pages ne va plus CHERCHER la branche `pages` tout
      # seul. C'est cette action qui téléverse dist/ et le lui signale. La branche
      # `pages`, `public/.domains` et les secrets CODEBERG_TOKEN / CODEBERG_USER /
      # CUSTOM_DOMAIN n'ont donc plus d'objet ICI — nettoyage à l'étape 5, une fois
      # la bascule constatée, et seulement après avoir vérifié que `npm run deploy`
      # ne s'en sert pas.
      #
      # Les quarante lignes de contournement disparaissent avec l'ancienne étape :
      # clone shallow, delta, postBuffer, HTTP/1.1, trois tentatives, copie
      # d'index.html en 404.html. Elles compensaient les 504 et les paquets
      # corrompus de la poussée git ; il n'y a plus de poussée git.
      #
      # Le repli SPA est maintenant tenu par `public/_redirects` (`/* /index.html
      # 200`), déjà au dépôt. Gain net : une route profonde inconnue répond 200 au
      # lieu de 404-avec-le-bon-contenu — meilleur pour le référencement, les tests
      # et le service worker.
      #
      # ⚠️ `if: push` AJOUTÉ À LA BASCULE. L'étape d'essai n'en avait pas : sur
      # test.anarbib.org c'était sans conséquence, sur la production une simple
      # pull request aurait déployé.
      #
      # NON BLOQUANT (continue-on-error) : un échec Codeberg ne doit pas priver
      # `backend` (needs: app) du déploiement des migrations et des fonctions. En
      # cas d'échec le site continue de servir son contenu actuel — il cesse
      # seulement d'être mis à jour.
      #
      # `server:` est requis au premier déploiement sur un domaine personnalisé
      # (il évite la dépendance circulaire certificat ↔ site). Inoffensif ensuite.
      #
      # ⚠️ `token` : la doc Codeberg écrit ${{ forge.token }}, le README de
      # l'action écrit ${{ forgejo.token }}. Si celui-ci échoue, essayer l'autre.
      # C'est le seul point du plan laissé au tâtonnement.
      #
      # ⚠️ CONTRÔLE : ne PAS vérifier la bascule par /.git-pages/manifest.json.
      # Le repli SPA intercepte ce chemin et renvoie index.html en 200, sous
      # l'ancien moteur comme sous le nouveau — un vert qui ne prouve rien. La
      # seule preuve est qu'une modification de contenu apparaisse en ligne.
      - name: Deploy Pages (git-pages)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 10
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://app.anarbib.org/
          server: codeberg.page
          token: ${{ forge.token }}
          source: dist/

  # ──────────────────── Job 2 : backend (Supabase) — sur push ────────────────
  # needs: app → ne déploie QUE si lint/test/build ont réussi (gate préservé).
  # Pas de npm install ici (CLI Supabase autonome) → job court, bien sous 5 min.
  backend:
    needs: app
    if: github.event_name == 'push'
    runs-on: anarbib-local
    container:
      image: node:20
    steps:
      - name: Outils système (git, curl, tar)
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl tar >/dev/null
          echo "✓ outils prêts"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer la CLI Supabase
        run: |
          curl -sLo /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.98.1/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/supabase
          supabase --version

      - name: Deploy Edge Functions (Supabase CLI)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          set -e
          # ── Le push touche-t-il seulement une fonction ? ────────────────
          # Les 47 fonctions sont redeployees une par une (~5 min), meme quand le
          # push ne contient que des migrations ou de la doc. Vecu le 21/08 (run
          # 8829551) : trois migrations SQL poussees, 47 fonctions redeployees
          # pour rien. Le runner traite un job a la fois, donc ces minutes sont
          # aussi de la file d'attente pour les autres sessions.
          #
          # On ne saute QUE le cas « zero fichier modifie sous supabase/functions ».
          # Le raffinement « seulement les fonctions modifiees » est un piege :
          # _shared/ est importe par presque toutes, et un ensemble affecte mal
          # calcule deploierait une fonction avec un module partage perime — bug
          # invisible au deploiement, visible des semaines plus tard.
          #
          # `fetch-depth: 1` ne donne pas le parent : on va chercher le SHA d'avant.
          # S'il est introuvable (branche neuve, force-push, historique tronque),
          # on NE saute PAS : mieux vaut cinq minutes perdues qu'une fonction non
          # deployee. Le defaut, en cas de doute, est le comportement actuel.
          AVANT="${{ github.event.before }}"
          DEPLOYER_TOUT=1
          if [ -n "$AVANT" ] && [ "$AVANT" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=50 origin "$AVANT" >/dev/null 2>&1 || true
            if git rev-parse --verify -q "${AVANT}^{commit}" >/dev/null; then
              if [ -z "$(git diff --name-only "$AVANT" "$GITHUB_SHA" -- supabase/functions/)" ]; then
                DEPLOYER_TOUT=0
              fi
            fi
          fi
          if [ "$DEPLOYER_TOUT" = "0" ]; then
            echo "→ aucune fonction Edge modifiée dans ce push — étape sautée"
            echo "✓ Edge Functions inchangées"
            exit 0
          fi

          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            [ "$fn_name" = "_shared" ] && { echo "→ skip _shared (module partagé)"; continue; }
            # `main` est le routeur de la pile AUTO-HEBERGEE (point d'entree de
            # edge-runtime, cf. deploy/). Il n'a aucun sens sur Supabase heberge,
            # ou chaque fonction porte deja sa propre URL : deploye la, il lirait
            # un supabase/config.toml absent et planterait au demarrage.
            # Ajoute le 2026-08-19, quand main/ est entre dans le depot.
            [ "$fn_name" = "main" ] && { echo "→ skip main (routeur auto-heberge)"; continue; }
            [ -f "${fn_dir}index.ts" ] || { echo "→ skip $fn_name (pas d'index.ts)"; continue; }
            echo "→ deploy $fn_name"
            # Retry par fonction : un 502 transitoire de Supabase sur UNE fonction ne
            # doit plus abattre tout le job (set -e) — fonctions suivantes + étape
            # `db push` comprises. Vécu 16/06 (502 sur notify-interlibrary-loan a bloqué
            # le déploiement de register + l'application d'une migration). 3 essais / 8s.
            # `timeout 180` : la boucle de retry ci-dessous ne peut RIEN contre un
            # deploiement qui HANG — la commande ne rend jamais la main, donc le
            # `until` ne se re-evalue jamais et le job reste bloque jusqu'a ce que
            # le runner le tue. Vecu le 17/08 (run #605) : hang sur
            # notify-network-weekly-report, job mort apres 1 h 06, 18 fonctions non
            # deployees. Un deploiement prend 1 a 3 s en pratique -> 180 s est une
            # marge enorme. Meme motif que le `timeout 150` du push Pages ci-dessus.
            n=0
            until timeout 180 supabase functions deploy "$fn_name" --project-ref "$SUPABASE_PROJECT_REF"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "✗ deploy $fn_name échoué après 3 tentatives"; exit 1; fi
              echo "↻ deploy $fn_name KO (tentative $n/3 — 502 transitoire ?) — retry 8s…"
              sleep 8
            done
          done
          echo "✓ Edge Functions déployées"

      - name: Deploy Migrations SQL (supabase db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ ! -d supabase/migrations ] || [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "→ aucune migration, rien à déployer"; exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --include-all
          echo "✓ migrations synchronisées"

  # ── Alerte : la forge doit DIRE qu'un workflow a echoue ─────────────────
  #
  # PLAN_DE_MARCHE §8. `sql-tests` est reste rouge du 17 au 20/08 sans que
  # personne le voie : un run rouge dans une liste ne se remarque pas. Une
  # issue, si — le depot est suivi, donc Forgejo envoie un courriel. C'est le
  # meme angle mort que les sauvegardes, et il n'etait pas couvert.
  #
  # AUCUN SECRET A CREER : Forgejo Actions injecte automatiquement GITEA_TOKEN,
  # limite a ce depot. Rien a poser dans l'interface de la forge.
  #
  # ANTI-DOUBLON : on n'ouvre rien si une issue ouverte porte deja le marqueur,
  # sinon chaque push rouge en creerait une. Refermer l'issue vaut acquittement ;
  # si le rouge revient ensuite, une nouvelle sera ouverte.
  #
  # `continue-on-error` : une alerte cassee ne doit jamais masquer l'echec reel
  # qu'elle signale.
  alerte:
    needs: [app, backend]
    if: failure()
    runs-on: anarbib-local
    container:
      image: node:20
    continue-on-error: true
    steps:
      - name: Ouvrir une issue si le rouge n'est pas deja signale
        env:
          FORGE_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "GITEA_TOKEN absent : alerte impossible (verifier que les Actions ont le droit d'ecrire les tickets)."
            exit 0
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          MARQUEUR="[CI rouge] ci"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          OUVERTES=$(curl -sS -H "Authorization: token ${FORGE_TOKEN}"             "${API}/issues?state=open&limit=50" || echo '')
          if printf '%s' "$OUVERTES" | grep -qF "$MARQUEUR"; then
            echo "Une issue ouverte porte deja le marqueur : pas de doublon."
            exit 0
          fi

          CORPS="Le workflow **ci** a echoue sur \`${GITHUB_REF_NAME}\`.

          - Commit : ${GITHUB_SHA}
          - Run : ${RUN_URL}

          Cette issue est ouverte automatiquement parce qu'un run rouge passe
          inapercu (vecu du 17 au 20/08/2026). **La refermer vaut acquittement** :
          tant qu'elle reste ouverte, aucune nouvelle ne sera creee."

          # Echappement JSON par node : l'image node:20 le garantit, pas python3.
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/issue.json",JSON.stringify({title:process.argv[1],body:process.argv[2]}))'             "$MARQUEUR" "$CORPS"

          CODE=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' -X POST             -H "Authorization: token ${FORGE_TOKEN}"             -H "Content-Type: application/json"             --data @/tmp/issue.json "${API}/issues" || echo 000)
          echo "Creation de l'issue : HTTP ${CODE}"
          [ "$CODE" = "201" ] || head -c 400 /tmp/reponse.json
