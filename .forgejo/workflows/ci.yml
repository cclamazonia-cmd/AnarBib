# =============================================================================
# Forgejo Actions — CI/CD AnarBib   (a remplacé Woodpecker hébergé instable)
#
# ⏱️  Les runners mutualisés Codeberg coupent un job à ~5 min de temps d'exécution
#     (« The runner cancelled the job because it exceeds the maximum run time »).
#     Notre pipeline monolithique frôlait les 5 min → annulations aléatoires à
#     l'étape en cours (le « podman context deadline exceeded » n'était QUE le
#     symptôme du conteneur tué à la limite). La limite étant PAR JOB, on scinde :
#       • job `app`     : install → lint(BLOQUANT) → test(BLOQUANT) → build → Pages(non bloquant)  (~4 min)
#       • job `backend` : edge functions → migrations SQL   (~2 min, PAS de npm install)
#     `backend: needs: app` → sérialise et garde le gate lint/test avant tout déploiement.
#     Durable (plus tard) : runner auto-hébergé (act_runner) = aucune limite.
#
# Runner : `anarbib-local` — runner AUTO-HÉBERGÉ (act_runner sur le WSL2 de Xavier).
# Plus de limite ~5 min ni de file mutualisée ; tourne quand sa machine est allumée
# (= quand il dev). Le découpage app/backend ci-dessous n'est donc plus imposé par
# la limite, mais on le garde (isolation + parallélisme). Si le runner local est
# hors-ligne, les runs attendent — c'est voulu (seul dev). Miroir GitHub : dual-push
# `origin` (Codeberg bloque les miroirs natifs). [skip ci]/[ci skip] = run sauté.
# Déploiements : uniquement sur push (jamais en run manuel workflow_dispatch).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    # Bypass robuste des pushes 100 % documentaires (indépendant de la casse :
    # Forgejo n'a pas honoré « [CI SKIP] » majuscule). Un push MIXTE docs+code
    # déclenche quand même (paths-ignore ne saute que si TOUS les fichiers matchent).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'notes-audit/**'
  workflow_dispatch: {}

# Sérialise les pipelines main (la « règle d'or » anti-push-concurrent, native).
concurrency:
  group: cicd-main
  cancel-in-progress: false

jobs:
  # ───────────────────────── Job 1 : app (build + Pages) ─────────────────────
  app:
    runs-on: anarbib-local
    container:
      image: node:20
    steps:
      - name: Outils système (git, curl, tar)
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl tar >/dev/null
          echo "✓ outils prêts"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install des dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint) — BLOQUANT
        run: npm run lint

      - name: Tests (vitest) — BLOQUANT
        run: npm test

      - name: Build Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Visio d'entraide : instance Jitsi militante Autistici/Inventati (accord A/I
          # du 16/06 — « usage direct », pas d'embedding : on ouvre en onglet dédié).
          # Valeur publique (pas un secret). Repli meet.jit.si si non défini.
          VITE_JITSI_DOMAIN: vc.autistici.org
        run: |
          npm run build
          test -d dist || (echo "✗ dist/ introuvable" && exit 1)
          echo "✓ build OK"

      - name: Deploy Pages (branche `pages`, commit orphelin)
        if: github.event_name == 'push'
        # NON BLOQUANT : un 504 Codeberg persistant sur Pages (après les 3 retries
        # ci-dessous) ne doit PAS faire échouer le job `app` et donc priver le job
        # `backend` (needs: app) du déploiement des migrations/EF. Le gate qualité
        # reste assuré par lint/test/build (steps bloquants au-dessus).
        # timeout-minutes : backstop DUR. continue-on-error ignore les échecs, PAS les
        # hangs : un push Pages qui ne répond jamais (Codeberg muet) faisait tourner
        # l'étape à l'infini → `app` jamais fini → `backend` (migrations/EF) jamais lancé.
        continue-on-error: true
        timeout-minutes: 10
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          cd dist
          echo "$CUSTOM_DOMAIN" > .domains
          cp index.html 404.html   # fallback SPA pour le routing client
          git init -b pages
          git config user.email "ci@anarbib.codeberg.page"
          git config user.name "AnarBib CI"
          # dist/ est lourd (pdfjs/tesseract/wasm/polices vendorés). Un POST plus
          # gros que http.postBuffer (~1 Mo par défaut) part en chunked et ne peut
          # PAS être rembobiné → "unable to rewind rpc post data" sur le retry après
          # une coupure Codeberg (504, vécu le 22/06). On bufferise tout le payload
          # (500 Mo) pour que la boucle `until` ci-dessous survive réellement aux
          # 504 transitoires (sinon les retries 2/3 échouent systématiquement).
          git config http.postBuffer 524288000
          git add -A
          git commit -m "Deploy from main@${GITHUB_SHA:0:8}"
          git remote add origin "https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/AnarBib/anarbib.git"
          # Push lourd (tout le dist/ en commit orphelin) → Codeberg renvoie parfois
          # un HTTP 504 transitoire. Retry 3× au lieu de faire échouer le job.
          # `timeout 150` : un push qui HANG (Codeberg ne répond pas) est tué à 150s et
          # retourne en échec → la boucle `until` retente. Sans ça, `until` ne se
          # relançait QUE sur échec, jamais sur hang (d'où les runs bloqués 20 min+).
          # 3 tentatives × 150s + sleeps ≈ 8 min, sous le backstop timeout-minutes: 10.
          n=0
          until timeout 150 git push --force origin pages; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "✗ push Pages KO/hang après 3 tentatives"; exit 1; fi
            echo "↻ push Pages KO (tentative $n/3 — Codeberg 504/hang ?) — nouvelle tentative dans 10s…"
            sleep 10
          done
          echo "✓ Pages déployé"

  # ──────────────────── Job 2 : backend (Supabase) — sur push ────────────────
  # needs: app → ne déploie QUE si lint/test/build ont réussi (gate préservé).
  # Pas de npm install ici (CLI Supabase autonome) → job court, bien sous 5 min.
  backend:
    needs: app
    if: github.event_name == 'push'
    runs-on: anarbib-local
    container:
      image: node:20
    steps:
      - name: Outils système (git, curl, tar)
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl tar >/dev/null
          echo "✓ outils prêts"

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer la CLI Supabase
        run: |
          curl -sLo /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.98.1/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/supabase
          supabase --version

      - name: Deploy Edge Functions (Supabase CLI)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          set -e
          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            [ "$fn_name" = "_shared" ] && { echo "→ skip _shared (module partagé)"; continue; }
            [ -f "${fn_dir}index.ts" ] || { echo "→ skip $fn_name (pas d'index.ts)"; continue; }
            echo "→ deploy $fn_name"
            # Retry par fonction : un 502 transitoire de Supabase sur UNE fonction ne
            # doit plus abattre tout le job (set -e) — fonctions suivantes + étape
            # `db push` comprises. Vécu 16/06 (502 sur notify-interlibrary-loan a bloqué
            # le déploiement de register + l'application d'une migration). 3 essais / 8s.
            n=0
            until supabase functions deploy "$fn_name" --project-ref "$SUPABASE_PROJECT_REF"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "✗ deploy $fn_name échoué après 3 tentatives"; exit 1; fi
              echo "↻ deploy $fn_name KO (tentative $n/3 — 502 transitoire ?) — retry 8s…"
              sleep 8
            done
          done
          echo "✓ Edge Functions déployées"

      - name: Deploy Migrations SQL (supabase db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ ! -d supabase/migrations ] || [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "→ aucune migration, rien à déployer"; exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --include-all
          echo "✓ migrations synchronisées"
