, est que « le workflow d'invitation, jamais exercé, devient d'un coup le chemin critique ».","pt":"O ajuste `team_admission_mode = 'cosignature'` da BLMF **nunca teve efeito sobre nada**: as treze promoções ao papel de bibliotecário·a e as cinco à coordenação passaram todas pela promoção direta. O custo real da escolha adotada, escrito preto no branco, é que «o workflow de convite, jamais exercido, torna-se de repente o caminho crítico»."},"f":{"fr":["Les six pas sont passés sur `blmf-teste`, avec le résultat de chacun écrit.","Une promotion réelle a emprunté le circuit sur la BLMF.","Attention : `blmf-teste` **n'est pas une base séparée** — c'est une bibliothèque dans le même projet."],"pt":["Os seis passos foram feitos em `blmf-teste`, com o resultado de cada um escrito.","Uma promoção real percorreu o circuito na BLMF.","Atenção: `blmf-teste` **não é um banco separado** — é uma biblioteca no mesmo projeto."]},"dep":{"fr":"Dépend de **G2** si le collectif décide de revenir en arrière.","pt":"Depende de **G2** se o coletivo decidir voltar atrás."},"r":["RUNBOOK_deploiement_collegialite_coordenador_2026-08-26 étape 10","MIGRATION_collegialite_coordenador_2026-08-26"],"verif":{"fr":"31/08 — mesuré en base : la ligne d'invitation, l'event `team.invitation_ready` envoyé, et la ligne `#72` partie le jour même (voir B17).","pt":"31/08 — medido no banco: a linha do convite, o evento enviado, e a linha `#72` de B17 partida no mesmo dia."}},{"id":"G4","d":"G","p":"P1","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Exercer les quatre courriels d'équipe jamais envoyés","pt":"Exercer os quatro e-mails de equipe jamais enviados"},"v":{"fr":"Quatre courriels existent, sont câblés, et ne sont jamais passés en production : `team.self_demoted`, `team.suspended`, `team.removal_requested`, `team.inactive_warning_*`. Le mécanisme fonctionne — `team_notification_outbox` compte 21 envois et zéro échec — mais ces quatre-là n'ont jamais été déclenchés.","pt":"Quatro e-mails existem, estão ligados, e nunca passaram em produção: `team.self_demoted`, `team.suspended`, `team.removal_requested`, `team.inactive_warning_*`. O mecanismo funciona — `team_notification_outbox` conta 21 envios e zero falha — mas esses quatro nunca foram disparados."},"w":{"fr":"Provoquer chacun des quatre cas sur `blmf-teste`, lire le courriel reçu, vérifier qu'il dit ce qu'il doit dire dans les dix langues.","pt":"Provocar cada um dos quatro casos em `blmf-teste`, ler o e-mail recebido, verificar que diz o que deve dizer nas dez línguas."},"y":{"fr":"Ces courriels annoncent à quelqu'un qu'il perd un rôle, qu'il est suspendu, ou qu'on demande son retrait. Ce sont les messages les plus délicats du système, et personne ne les a jamais lus tels qu'ils arrivent. Les deux personnes en formation à la coordination BLMF seront les premières concernées.","pt":"Estes e-mails anunciam a alguém que perde um papel, que está suspenso, ou que se pede sua retirada. São as mensagens mais delicadas do sistema, e ninguém jamais as leu como chegam. As duas pessoas em formação para a coordenação BLMF serão as primeiras envolvidas."},"f":{"fr":["Les quatre courriels ont été reçus et relus.","Le ton et le contenu sont validés par quelqu'un qui n'a pas écrit les gabarits.","**D'abord sur `blmf-teste`, jamais directement sur la BLMF.**"],"pt":["Os quatro e-mails foram recebidos e relidos.","O tom e o conteúdo são validados por alguém que não escreveu os templates.","**Primeiro em `blmf-teste`, nunca diretamente na BLMF.**"]},"dep":{"fr":"Se fait avec **G3**, même bac à sable.","pt":"Faz-se com **G3**, mesmo ambiente de teste."},"r":["VERIF_etat_reel_gouvernance_et_crons_2026-08-26 §2"],"verif":{"fr":"31/08 — `team_notification_outbox` : 25 envois, 0 échec — et toujours **aucune** ligne pour `team.self_demoted`, `team.suspended`, `team.removal_requested`, `team.inactive_warning_*`. Le mécanisme continue de faire ses preuves à côté (deux events de plus depuis le 29/08) ; ces quatre-là n'ont jamais été déclenchés.","pt":"31/08 — `team_notification_outbox`: 25 envios, 0 falha — e ainda **nenhuma** linha para os quatro e-mails. Nunca disparados."}},{"id":"G5","d":"G","p":"P2","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Ce que commande vraiment `is_test_mode` sur la Biblioteca Terra Livre","pt":"O que `is_test_mode` realmente comanda na Biblioteca Terra Livre"},"v":{"fr":"**Vérifié le 30/08, et l'item se réduit de moitié.** Le constat reposait sur `library_commons.email_delivery_mode = 'test_only'`. Or **aucun chemin d'envoi ne lit cette colonne** : c'est le sélecteur inerte retiré le jour même côté interface. Le vrai commutateur est `library_mail_channels`, et il dit autre chose — la BTL y porte `delivery_mode = 'platform_shared'` et `active = true`. **Le courrier de la BTL part normalement, et depuis toujours.** Il n'y a donc rien à clarifier de ce côté : la bibliothèque n'était pas en mode d'essai, elle le paraissait.\n\nCe qui reste tient en une question : la colonne `libraries.is_test_mode`, toujours à `true` sur une bibliothèque de 2 187 exemplaires publiée au réseau. Qu'est-ce qui la lit, et qu'est-ce qu'elle change ?","pt":"**Verificado em 30/08, e o item reduz-se a metade.** O constato assentava em `library_commons.email_delivery_mode = 'test_only'`. Ora **nenhum caminho de envio lê essa coluna**: é o seletor inerte retirado no mesmo dia. O verdadeiro comutador é `library_mail_channels`, e diz outra coisa — a BTL tem `delivery_mode = 'platform_shared'` e `active = true`. **O correio da BTL parte normalmente, e sempre partiu.**\n\nResta uma pergunta: a coluna `libraries.is_test_mode`, ainda a `true` numa biblioteca de 2 187 exemplares publicada na rede. O que a lê, e o que ela muda?"},"w":{"fr":"Chercher ce qui lit `libraries.is_test_mode` — en base et dans le front. Trois issues, et il faut trancher entre elles plutôt que de laisser le champ tel quel : ou bien la colonne commande quelque chose de réel, et il faut demander à la BTL ce qu'elle veut ; ou bien elle ne commande rien, et c'est un second sélecteur inerte à retirer (`DOC-SILENCE-1`) ; ou bien elle ne sert qu'à un filtre d'affichage, et son nom ment sur sa portée.","pt":"Procurar o que lê `libraries.is_test_mode` — no banco e no front. Três saídas, e é preciso decidir entre elas: ou a coluna comanda algo real, e é preciso perguntar à BTL o que quer; ou não comanda nada, e é um segundo seletor inerte a retirar (`DOC-SILENCE-1`); ou serve apenas a um filtro de exibição, e o seu nome mente sobre o alcance."},"y":{"fr":"En mode d'essai, les courriels ne partent pas. Une bibliothèque avec 2 187 exemplaires publiés dont les lectrices ne reçoivent aucune notification, c'est soit un choix, soit une panne silencieuse depuis des mois. La BTL a rejoint le réseau avec un statut « expérimental » assumé — mais un statut politique et un réglage technique ne sont pas la même chose.","pt":"Em modo de teste, os e-mails não saem. Uma biblioteca com 2 187 exemplares publicados cujas leitoras não recebem nenhuma notificação é ou uma escolha, ou uma pane silenciosa há meses. A BTL entrou na rede com um estatuto «experimental» assumido — mas um estatuto político e um ajuste técnico não são a mesma coisa."},"f":{"fr":["La BTL a répondu, et la configuration correspond à sa réponse.","Le statut est écrit là où quelqu'un le cherchera."],"pt":["A BTL respondeu, e a configuração corresponde à sua resposta.","O estatuto está escrito onde alguém vai procurá-lo."]},"dep":{"fr":"Aucune. Une conversation.","pt":"Nenhuma. Uma conversa."},"r":["PLAN_formation_coordination_BLMF §8"],"verif":{"fr":"30/08 — `library_mail_channels` interrogée : la BTL est à `platform_shared` / `active = true`. Ce que commande `is_test_mode` n'a pas été cherché.","pt":"30/08 — `library_mail_channels` consultada: a BTL está em `platform_shared` / `active = true`. O que `is_test_mode` comanda não foi procurado."}},{"id":"G6","d":"G","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Donner un écran au prêt entre bibliothèques","pt":"Dar uma tela ao empréstimo entre bibliotecas"},"v":{"fr":"Le cycle de vie du prêt entre bibliothèques est spécifié et implémenté en base : machine à états verrouillée, quatre triggers, cron `anarbib-peb-detect-overdue-daily` actif. **Aucun écran n'existe.** La base porte 2 prêts pour 20 insertions historiques.","pt":"O ciclo de vida do empréstimo entre bibliotecas está especificado e implementado no banco: máquina de estados travada, quatro triggers, cron `anarbib-peb-detect-overdue-daily` ativo. **Nenhuma tela existe.** O banco traz 2 empréstimos para 20 inserções históricas."},"w":{"fr":"Un écran de demande côté bibliothèque emprunteuse, un écran de traitement côté prêteuse, et l'affichage de l'état pour les deux. Les vues `interlibrary_loans_painel_ui` et `interlibrary_loan_items_ui` existent déjà.","pt":"Uma tela de pedido do lado da biblioteca solicitante, uma tela de tratamento do lado da emprestadora, e a exibição do estado para as duas. As views `interlibrary_loans_painel_ui` e `interlibrary_loan_items_ui` já existem."},"y":{"fr":"Le prêt entre bibliothèques est ce qui rend un réseau fédératif utile à ses lectrices, plutôt qu'une simple juxtaposition de catalogues. Aujourd'hui il a « une amorce en base, même sans écran » — ce qui veut dire que personne ne peut s'en servir.","pt":"O empréstimo entre bibliotecas é o que torna uma rede federativa útil às suas leitoras, em vez de uma simples justaposição de catálogos. Hoje ele tem «um início no banco, mesmo sem tela» — o que quer dizer que ninguém pode usá-lo."},"f":{"fr":["Un prêt complet a été fait entre deux bibliothèques du réseau, par l'interface.","Le flux « livre perdu ou abîmé » a un traitement écrit — **aucun flux ne le couvre aujourd'hui**, il se traite hors SIGB avec remontée en coordination."],"pt":["Um empréstimo completo foi feito entre duas bibliotecas da rede, pela interface.","O fluxo «livro perdido ou danificado» tem um tratamento escrito — **nenhum fluxo o cobre hoje**, trata-se fora do SIGB com escalada à coordenação."]},"dep":{"fr":"`EA-12 phase 2` (parité PEB, environ 45 fonctions) est gelée par `BIBLIO-9` — à ne pas confondre avec cet item.","pt":"`EA-12 fase 2` (paridade EEB, cerca de 45 funções) está congelada por `BIBLIO-9` — a não confundir com este item."},"r":["spec-cycle-vie-peb.md","PLAN_formation_coordination_BLMF §5","REGISTRE §14 PEB"],"verif":{"fr":"31/08 — `interlibrary_loans_v2` : 2 prêts vivants pour 20 insertions historiques, comme au 29/08.","pt":"31/08 — `interlibrary_loans_v2`: 2 empréstimos vivos para 20 inserções, como em 29/08."}},{"id":"G7","d":"G","p":"P1","s":"bloque","e":"?","sk":["collectif"],"t":{"fr":"Décider de l'admission de la Bibliothèque SOLIDAIRES","pt":"Decidir a admissão da Biblioteca SOLIDAIRES"},"v":{"fr":"Décision fédérale **volontairement différée**, faute de pouvoir être prise à plusieurs. Échéance envisagée : octobre ou novembre, après Bologne.","pt":"Decisão federal **deliberadamente adiada**, por não poder ser tomada em conjunto. Prazo previsto: outubro ou novembro, depois de Bolonha."},"w":{"fr":"Une fois **A1** abouti, instruire la demande à plusieurs et trancher.","pt":"Uma vez concluído **A1**, instruir o pedido em conjunto e decidir."},"y":{"fr":"La contrainte est écrite noir sur blanc au collectif et elle est absolue : **ne pas créer de bibliothèque « SOLIDAIRES » en base** tant que la décision n'est pas prise, ni membre, ni partenaire, ni cible. « Créer la fiche reviendrait à inscrire en base une décision qu'on dit ne pas prendre. » **Et depuis le 29/08 la même règle vaut pour le fonds : l'import des 1 685 notices (C2) ne se fera qu'après l'admission.** Cet item ne décide donc pas seulement d'une adhésion : il débloque un chantier de catalogage entier.","pt":"A restrição está escrita preto no branco ao coletivo e é absoluta: **não criar biblioteca «SOLIDAIRES» no banco** enquanto a decisão não for tomada, nem membro, nem parceira, nem alvo. «Criar a ficha equivaleria a inscrever no banco uma decisão que se diz não tomar.» **E desde 29/08 a mesma regra vale para o acervo: a importação dos 1 685 registros (C2) só se fará depois da admissão.** Este item não decide portanto apenas uma adesão: desbloqueia um canteiro de catalogação inteiro."},"f":{"fr":["La décision est prise à trois au moins, et tracée dans `network_administrator_audit`.","Quelle qu'elle soit, elle est communiquée au collectif SOLIDAIRES avec sa raison.","Une fois l'admission prononcée, **C2** et **D3** se débloquent dans cet ordre."],"pt":["A decisão é tomada por pelo menos três, e rastreada em `network_administrator_audit`.","Seja qual for, é comunicada ao coletivo SOLIDAIRES com seu motivo.","Uma vez pronunciada a admissão, **C2** e **D3** se desbloqueiam nesta ordem."]},"dep":{"fr":"**Bloqué par A1.** Même remarque pour la demande d'adhésion belge en cours d'évaluation.","pt":"**Bloqueado por A1.** Mesma observação para o pedido de adesão belga em avaliação."},"r":["REPRISE_claude_code_2026-08-27","CALENDRIER_bologne_2026-08-27"]},{"id":"G8","d":"G","p":"P2","s":"ouvert","e":"S","sk":["biblio","aucune"],"t":{"fr":"Compléter la cartographie avec les archives repérées ailleurs","pt":"Completar a cartografia com os arquivos identificados alhures"},"v":{"fr":"`cartography_entries` porte 187 fiches et le fichier `anarbib_bibliotheques_libertaires.geojson` en compte 121. Neuf archives repérées dans le réseau NORLA n'ont pas été confrontées à cette liste.","pt":"`cartography_entries` traz 187 fichas e o arquivo `anarbib_bibliotheques_libertaires.geojson` conta 121. Nove arquivos identificados na rede NORLA não foram confrontados com essa lista."},"w":{"fr":"Vérifier lesquelles des neuf figurent déjà, et faire entrer les manquantes avec `source = \"FICEDL\"` ou `\"NORLA\"` selon leur provenance.","pt":"Verificar quais das nove já constam, e fazer entrar as ausentes com `source = \"FICEDL\"` ou `\"NORLA\"` conforme sua proveniência."},"y":{"fr":"La carte n'a d'intérêt que si elle est plus complète que ce que chacun connaît déjà. Et la traçabilité de la source est ce qui permettra plus tard de dire d'où vient chaque fiche sans avoir à redemander.","pt":"O mapa só tem interesse se for mais completo do que aquilo que cada um já conhece. E a rastreabilidade da fonte é o que permitirá mais tarde dizer de onde vem cada ficha sem ter de perguntar de novo."},"f":{"fr":["Les neuf archives ont un verdict : déjà présente, ou ajoutée avec sa source.","Rappel : `statut_public` est à `FALSE` par défaut et **aucun import en masse** n'est autorisé (`MAP-E`)."],"pt":["Os nove arquivos têm um veredicto: já presente, ou acrescentado com sua fonte.","Lembrete: `statut_public` está em `FALSE` por omissão e **nenhuma importação em massa** é autorizada (`MAP-E`)."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["VEILLE_leftovers_maydayrooms_2026-08-19 §3.4","REGISTRE §34 MAP-E"],"verif":{"fr":"31/08 — 187 fiches en base, inchangé. Le fichier public a changé d'adresse et de contenu : `data/carte-publique.geojson` du dépôt vitrine, **109** entrées (l'item en citait 121 sous l'ancien nom). Les neuf archives NORLA restent à confronter.","pt":"31/08 — 187 fichas no banco. O arquivo público mudou de endereço: `data/carte-publique.geojson` no repositório vitrine, **109** entradas (o item citava 121). As nove NORLA seguem por confrontar."}},{"id":"G9","d":"G","p":"P3","s":"gele","e":"L","sk":["front"],"t":{"fr":"Implémenter la cartographie du réseau selon la spec v1.0","pt":"Implementar a cartografia da rede segundo a spec v1.0"},"v":{"fr":"Les arbitrages sont tranchés depuis le 18/06 : table dédiée, i18n hybride, carte publique comme route de l'application, moteur Leaflet, OpenStreetMap et Nominatim auto-hébergés, entrées non membres affichées avec un filtre clair. `MAP-I` (statut du prêt entre bibliothèques sur la carte interne) et `MAP-J` (auto-déclaration « ajouter ma bibliothèque » avec modération) restent différés. **L'implémentation est calendée post-Bologne, fin 2026 ou 2027.**","pt":"As arbitragens estão decididas desde 18/06: tabela dedicada, i18n híbrida, mapa público como rota do aplicativo, motor Leaflet, OpenStreetMap e Nominatim auto-hospedados, entradas não membros exibidas com um filtro claro. `MAP-I` (estatuto do empréstimo entre bibliotecas no mapa interno) e `MAP-J` (autodeclaração «adicionar minha biblioteca» com moderação) continuam adiados."},"w":{"fr":"Reprendre la spec v1.0 quand la fenêtre s'ouvre. Attention : le REGISTRE porte **deux sections `MAP`** — le §2 est un squelette où tout est ouvert, le §34 est la version tranchée. Le §2 n'a ni tampon de supersession ni renvoi vers le §34 : **c'est le §34 qui vaut**.","pt":"Retomar a spec v1.0 quando a janela se abrir. Atenção: o REGISTRO traz **duas seções `MAP`** — a §2 é um esqueleto onde tudo está aberto, a §34 é a versão decidida. A §2 não tem carimbo de supersessão nem remissão à §34: **é a §34 que vale**."},"y":{"fr":"La carte est le premier objet qu'une bibliothèque qui découvre le réseau va regarder. Elle mérite d'être faite quand il y aura du temps pour la faire bien, et pas dans la fenêtre d'avant Bologne.","pt":"O mapa é o primeiro objeto que uma biblioteca que descobre a rede vai olhar. Merece ser feito quando houver tempo para fazê-lo bem, e não na janela anterior a Bolonha."},"f":{"fr":["La carte publique est une route de l'application, servie sans requête vers un tiers (voir **E5**).","Le §2 du REGISTRE porte un renvoi vers le §34."],"pt":["O mapa público é uma rota do aplicativo, servido sem requisição a terceiro (ver **E5**).","A §2 do REGISTRO traz uma remissão à §34."]},"dep":{"fr":"Après Bologne. Lié à **E5** et **J5**.","pt":"Depois de Bolonha. Ligado a **E5** e **J5**."},"r":["spec-cartographie-reseau.md v1.0","REGISTRE §34 MAP"]},{"id":"G10","d":"G","p":"P2","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Solder les trois questions d'onboarding marquées « au plus vite »","pt":"Liquidar as três questões de onboarding marcadas «o mais rápido possível»"},"v":{"fr":"Trois points sont marqués 🔴 « à résoudre au plus vite » depuis juin et n'ont pas bougé : `#111` (évaluation collaborative d'un·e administrateur·rice réseau, dormante), `ONBO-Q13` (transfert technique du mandat de coordination), et la finition du volet 10 de l'atelier d'onboarding.","pt":"Três pontos estão marcados 🔴 «a resolver o mais rápido possível» desde junho e não se moveram: `#111` (avaliação colaborativa de uma pessoa administradora de rede, dormente), `ONBO-Q13` (transferência técnica do mandato de coordenação), e o acabamento do módulo 10 da oficina de onboarding."},"w":{"fr":"Les trois se traitent ensemble parce qu'ils portent la même question : que se passe-t-il quand quelqu'un arrive, et quand quelqu'un part ?","pt":"Os três se tratam juntos porque carregam a mesma questão: o que acontece quando alguém chega, e quando alguém sai?"},"y":{"fr":"`ONBO-Q13` est le cas de figure d'une coordination qui change de mains. Aujourd'hui, une bibliothèque dont la personne coordinatrice disparaît n'a pas de chemin écrit. C'est exactement le risque que **A1** décrit à l'échelle du réseau, à l'échelle d'une bibliothèque cette fois.","pt":"`ONBO-Q13` é o caso de uma coordenação que muda de mãos. Hoje, uma biblioteca cuja pessoa coordenadora desaparece não tem caminho escrito. É exatamente o risco que **A1** descreve na escala da rede, desta vez na escala de uma biblioteca."},"f":{"fr":["Le transfert de mandat a un chemin écrit et éprouvé sur `blmf-teste`.","`#111` a un verdict : réveillée, ou fermée.","Le volet 10 est fini."],"pt":["A transferência de mandato tem um caminho escrito e testado em `blmf-teste`.","`#111` tem um veredicto: reativada, ou fechada.","O módulo 10 está terminado."]},"dep":{"fr":"Éclairé par **G3** (le circuit d'invitation est le même).","pt":"Esclarecido por **G3** (o circuito de convite é o mesmo)."},"r":["REGISTRE §26 ONBO-Q13","spec-onboarding-biblioteca-v2.0"]},{"id":"H1","d":"H","p":"P1","s":"ouvert","e":"S","sk":["deno","biblio"],"t":{"fr":"Réparer l'aspiration des 158 descripteurs de dates du thésaurus","pt":"Reparar a coleta dos 158 descritores de datas do tesauro"},"v":{"fr":"`parseDescriptor` sort par retour précoce avant d'atteindre le titre de page quand une fiche n'a pas de bloc de traduction. Résultat : **158 descripteurs de la facette « dates », soit un quart du thésaurus, sont enregistrés comme identifiants nus, sans libellé, donc non alignables.** Leurs liens vers les catalogues se perdent de la même façon. Le correctif `ficedl_scrape_titre_dates.patch` existe, passe `node --check`, et **n'a jamais été éprouvé contre le site**.","pt":"`parseDescriptor` sai por retorno antecipado antes de alcançar o título de página quando uma ficha não tem bloco de tradução. Resultado: **158 descritores da faceta «datas», ou seja um quarto do tesauro, são registrados como identificadores nus, sem rótulo, portanto não alinháveis.** Seus vínculos com os catálogos se perdem da mesma forma. A correção `ficedl_scrape_titre_dates.patch` existe, passa `node --check`, e **nunca foi testada contra o site**."},"w":{"fr":"Appliquer le correctif, qui relève le titre de page avant les retours précoces et le range dans un champ `title_fr` **distinct de `labels`** — une date a un libellé canonique mais pas de traduction.","pt":"Aplicar a correção, que capta o título de página antes dos retornos antecipados e o guarda num campo `title_fr` **distinto de `labels`** — uma data tem um rótulo canônico mas não uma tradução."},"y":{"fr":"Un quart du thésaurus est aujourd'hui inutilisable. Et il faut le réparer **au moment d'une aspiration déjà prévue**, pas en lançant 620 requêtes spécialement : l'hébergeur du thésaurus a signalé une charge robots excessive.","pt":"Um quarto do tesauro está hoje inutilizável. E é preciso repará-lo **no momento de uma coleta já prevista**, não lançando 620 requisições especialmente: o provedor do tesauro sinalizou uma carga de robôs excessiva."},"f":{"fr":["Les 158 descripteurs de dates portent un libellé.","La vérification s'est faite lors d'une aspiration prévue.","Deux pièges du script de synchronisation à ne pas redécouvrir : **toujours passer `--json` explicitement** (un fichier sans date trie avant les fichiers datés) et **ne jamais utiliser `--prune`** (il supprimerait des descripteurs référencés par `subject_ficedl_links`)."],"pt":["Os 158 descritores de datas trazem um rótulo.","A verificação se fez durante uma coleta prevista.","Duas armadilhas do script de sincronização a não redescobrir: **sempre passar `--json` explicitamente** (um arquivo sem data ordena antes dos arquivos datados) e **nunca usar `--prune`** (suprimiria descritores referenciados por `subject_ficedl_links`)."]},"dep":{"fr":"Prévu semaine du 14/09. Abandonnable sans regret si le temps manque avant Bologne.","pt":"Previsto para a semana de 14/09. Abandonável sem arrependimento se faltar tempo antes de Bolonha."},"r":["REPRISE_claude_code_2026-08-27 chantier 3","NOTE_export_thesaurus_questions_ouvertes_2026-08-28"],"verif":{"fr":"31/08 — précision au constat : les 158 descripteurs de la facette « dates » sont sans libellé dans le **JSON d'aspiration** (`tmp-ficedl/ficedl_thesaurus.json` : 620 termes, 158/158 nus) ; la table `ficedl_thesaurus_terms`, elle, n'en porte **aucun** — 462 lignes, facettes sujets et géo seulement. En base ils ne sont pas « nus » : ils manquent. Le correctif n'a toujours pas été éprouvé contre le site.","pt":"31/08 — precisão: os 158 descritores de datas estão sem rótulo no **JSON de aspiração** (620 termos); a tabela não traz **nenhum** deles — 462 linhas, só facetas assuntos e geo. No banco eles não estão « nus »: faltam. O corretivo segue sem prova contra o site."}},{"id":"H2","d":"H","p":"P1","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Poser à la FICEDL les sept questions qui bloquent l'export du thésaurus","pt":"Colocar à FICEDL as sete questões que bloqueiam a exportação do tesauro"},"v":{"fr":"L'export complet des 620 descripteurs dans les deux formats est **à une soirée de travail** — dès que les sept questions ont une réponse. Elles sont écrites et personne ne les a encore posées.","pt":"A exportação completa dos 620 descritores nos dois formatos está a **uma noite de trabalho** — assim que as sete questões tiverem resposta. Estão escritas e ninguém ainda as colocou."},"w":{"fr":"Les sept : la forme des identifiants ; **la hiérarchie, qui est la vraie question** ; le statut de la facette « dates » ; le sort des 2 842 liens vers six catalogues ; le grec romanisé ; la licence ; et la manière dont le fichier se régénère.","pt":"As sete: a forma dos identificadores; **a hierarquia, que é a verdadeira questão**; o estatuto da faceta «datas»; o destino dos 2 842 vínculos para seis catálogos; o grego romanizado; a licença; e a maneira como o arquivo se regenera."},"y":{"fr":"Sur 148 descripteurs à libellé arborescent, **93 parents sont retrouvés et 55 sont introuvables** : « art », « économie », « guerres », « littérature », « presse », « syndicalisme » ne sont pas des descripteurs, ou portent un autre nom. Vu de l'extérieur, **la hiérarchie n'est pas une donnée, c'est une convention d'affichage dans une chaîne de caractères** — et on ne peut pas écrire `skos:broader` honnêtement là-dessus. Seule la FICEDL peut dire si le site tient une vraie relation parent-enfant.","pt":"De 148 descritores com rótulo arborescente, **93 pais são encontrados e 55 são inencontráveis**: «arte», «economia», «guerras», «literatura», «imprensa», «sindicalismo» não são descritores, ou têm outro nome. Visto de fora, **a hierarquia não é um dado, é uma convenção de exibição numa cadeia de caracteres** — e não se pode escrever `skos:broader` honestamente sobre isso. Só a FICEDL pode dizer se o site mantém uma verdadeira relação pai-filho."},"f":{"fr":["Les sept questions sont posées, avec l'audit de qualité produit à la première aspiration en pièce jointe — **les corrections appartiennent à la source, pas aux copies**.","Quatre anomalies vues en passant sont remontées : deux sites différents sous le même intitulé « catalogue du CCL » ; les archives du *Monde libertaire* apparaissant deux fois par terme sous deux formes d'adresse ; `mot228` (« populations autochtones ») présent dans deux facettes ; 29 libellés portugais portant astérisque, point d'interrogation ou espace finale.","La question 7 est la plus rentable : un squelette SPIP qui imprime les termes en CSV règle aussi la charge robots — **une requête au lieu de 620, par consommateur et par mise à jour**, pour une demi-journée de travail côté FICEDL."],"pt":["As sete questões estão colocadas, com a auditoria de qualidade produzida na primeira coleta em anexo — **as correções pertencem à fonte, não às cópias**.","Quatro anomalias vistas de passagem são reportadas: dois sites diferentes sob o mesmo rótulo «catálogo do CCL»; os arquivos do *Monde libertaire* aparecendo duas vezes por termo sob duas formas de endereço; `mot228` («populações autóctones») presente em duas facetas; 29 rótulos portugueses com asterisco, ponto de interrogação ou espaço final.","A questão 7 é a mais rentável: um esqueleto SPIP que imprime os termos em CSV resolve também a carga de robôs — **uma requisição em vez de 620, por consumidor e por atualização**, para meia jornada de trabalho do lado da FICEDL."]},"dep":{"fr":"Bloque **H3**. À poser à Bologne ou avant.","pt":"Bloqueia **H3**. A colocar em Bolonha ou antes."},"r":["NOTE_export_thesaurus_questions_ouvertes_2026-08-28"]},{"id":"H3","d":"H","p":"P1","s":"ouvert","e":"S","sk":["biblio","deno"],"t":{"fr":"Publier les correspondances vers le thésaurus FICEDL en SKOS","pt":"Publicar as correspondências para o tesauro FICEDL em SKOS"},"v":{"fr":"98 alignements existent en base entre les sujets locaux et les descripteurs FICEDL, en `exact` ou `close`. Le vocabulaire matière d'AnarBib est déjà exposé en SKOS. **Les correspondances vers la FICEDL ne le sont pas.**","pt":"98 alinhamentos existem no banco entre os assuntos locais e os descritores FICEDL, em `exact` ou `close`. O vocabulário de assunto do AnarBib já está exposto em SKOS. **As correspondências para a FICEDL não estão.**"},"w":{"fr":"Exposer `subject_ficedl_links` en `skos:exactMatch` et `skos:closeMatch`. **Un alignement partiel vaut mieux que pas d'alignement** — c'est la convention 2 du texte d'interopérabilité, et elle s'applique d'abord à nous.","pt":"Expor `subject_ficedl_links` em `skos:exactMatch` e `skos:closeMatch`. **Um alinhamento parcial vale mais que nenhum alinhamento** — é a convenção 2 do texto de interoperabilidade, e se aplica primeiro a nós."},"y":{"fr":"C'est ce qui permet qu'un fonds catalogué avec un vocabulaire local reste trouvable par qui ne connaît pas ce vocabulaire — et dans dix langues, puisque le thésaurus est déjà traduit. Quelques heures pour un premier flux.","pt":"É o que permite que um acervo catalogado com um vocabulário local continue encontrável por quem não conhece esse vocabulário — e em dez línguas, já que o tesauro já está traduzido. Algumas horas para um primeiro fluxo."},"f":{"fr":["Un fichier SKOS est servi par l'application, à une adresse stable.","Il distingue `exactMatch` de `closeMatch`.","Il n'affirme rien sur la hiérarchie tant que **H2** n'a pas répondu."],"pt":["Um arquivo SKOS é servido pelo aplicativo, num endereço estável.","Distingue `exactMatch` de `closeMatch`.","Não afirma nada sobre a hierarquia enquanto **H2** não tiver respondido."]},"dep":{"fr":"La partie hiérarchie dépend de **H2**. La partie correspondances, non.","pt":"A parte hierarquia depende de **H2**. A parte correspondências, não."},"r":["docs/CHANTIERS_OUVERTS.md §4","CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26 convention 2"],"verif":{"fr":"31/08 — 98 alignements en base : 44 `exact`, 54 `close`. Le constat tient.","pt":"31/08 — 98 alinhamentos: 44 `exact`, 54 `close`."}},{"id":"H4","d":"H","p":"P1","s":"ouvert","e":"S","sk":["deno"],"t":{"fr":"Exposer le catalogue en OPDS","pt":"Expor o catálogo em OPDS"},"v":{"fr":"Le point d'accès OAI-PMH est déployé. **OPDS n'existe pas.** Or « les flux OPDS existent de part et d'autre mais ne pointent nulle part », et c'est la convention 1 du texte proposé aux autres catalogues.","pt":"O ponto de acesso OAI-PMH está implantado. **OPDS não existe.** Ora, «os fluxos OPDS existem de um lado e de outro mas não apontam para lugar nenhum», e é a convenção 1 do texto proposto aos outros catálogos."},"w":{"fr":"Un flux OPDS 1.2 ou 2.0 sur le catalogue public, avec les facettes déjà disponibles. Quelques heures pour un premier flux.","pt":"Um fluxo OPDS 1.2 ou 2.0 sobre o catálogo público, com as facetas já disponíveis. Algumas horas para um primeiro fluxo."},"y":{"fr":"OPDS est ce que lisent les liseuses et les applications de lecture. C'est le format par lequel un fonds numérisé devient consultable sans passer par notre interface — et c'est la première des quatre conventions qu'AnarBib propose aux autres. **Il serait difficile de la proposer sans l'appliquer.**","pt":"OPDS é o que os leitores digitais e os aplicativos de leitura leem. É o formato pelo qual um acervo digitalizado se torna consultável sem passar pela nossa interface — e é a primeira das quatro convenções que o AnarBib propõe aos outros. **Seria difícil propô-la sem aplicá-la.**"},"f":{"fr":["Un flux OPDS est servi et lisible par au moins un client réel.","Il respecte la visibilité : rien qui ne soit déjà public ne sort."],"pt":["Um fluxo OPDS é servido e legível por pelo menos um cliente real.","Respeita a visibilidade: nada que já não seja público sai."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["docs/CHANTIERS_OUVERTS.md §4","CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26 convention 1"],"verif":{"fr":"31/08 — aucune occurrence d'OPDS dans `src/` ni `supabase/functions/`. Rien n'existe, comme écrit.","pt":"31/08 — nenhuma ocorrência de OPDS em `src/` nem `supabase/functions/`."}},{"id":"H5","d":"H","p":"P2","s":"ouvert","e":"S","sk":["deno","sysadmin"],"t":{"fr":"Éprouver la moisson OAI-PMH dans les deux sens","pt":"Testar a coleta OAI-PMH nos dois sentidos"},"v":{"fr":"Le chemin est exécutable depuis le 28/08 : fonction `harvest-oai-pmh` déployée, cron `anarbib-oai-harvest-weekly` posé. **Le cron n'a jamais tourné** — première occurrence prévue mardi à 04h20. Et le point d'accès `oai-pmh-provider` **n'a jamais été moissonné depuis l'extérieur**.","pt":"O caminho está executável desde 28/08: função `harvest-oai-pmh` implantada, cron `anarbib-oai-harvest-weekly` posto. **O cron nunca rodou** — primeira ocorrência prevista para terça-feira às 04h20. E o ponto de acesso `oai-pmh-provider` **nunca foi coletado de fora**."},"w":{"fr":"Attendre le premier passage du cron et lire ce qu'il ramène. En parallèle, moissonner notre propre point d'accès depuis une machine tierce, avec un client OAI standard, et vérifier que les enregistrements sont conformes.","pt":"Esperar a primeira passagem do cron e ler o que ela traz. Em paralelo, coletar nosso próprio ponto de acesso a partir de uma máquina de terceiro, com um cliente OAI padrão, e verificar que os registros estão conformes."},"y":{"fr":"Un point d'accès jamais moissonné est un point d'accès dont on ignore s'il fonctionne. C'est le même schéma que le circuit d'invitation : construit, déclaré, jamais emprunté. Et la limitation de débit n'est pas en place — le greffon `caddy-ratelimit` n'est pas embarqué dans l'image `caddy:2`, ce qui laisse le point d'accès public non limité.","pt":"Um ponto de acesso nunca coletado é um ponto de acesso do qual se ignora se funciona. É o mesmo esquema do circuito de convite: construído, declarado, jamais percorrido. E a limitação de taxa não está em vigor — o plugin `caddy-ratelimit` não está embutido na imagem `caddy:2`, o que deixa o ponto de acesso público sem limite."},"f":{"fr":["Le cron a tourné au moins une fois et son résultat est lu.","Un moissonnage externe a réussi, avec le compte rendu écrit.","La limitation de débit a un verdict : rétablie le jour où le moissonnage gênera, ou assumée."],"pt":["O cron rodou pelo menos uma vez e seu resultado está lido.","Uma coleta externa foi bem-sucedida, com o relatório escrito.","A limitação de taxa tem um veredicto: restabelecida no dia em que a coleta incomodar, ou assumida."]},"dep":{"fr":"La limitation de débit est liée à **I2**.","pt":"A limitação de taxa está ligada a **I2**."},"r":["Relevé du 29/08/2026","REPRISE_bascule_autohebergee_2026-08-26","spec-oai-provider-gouvernance.md"],"verif":{"fr":"31/08 — le cron `anarbib-oai-harvest-weekly` (`20 4 * * 2`, actif) n'a aucune exécution à son journal. Première occurrence attendue le mardi 01/09 à 4 h 20.","pt":"31/08 — o cron (`20 4 * * 2`, ativo) não tem nenhuma execução no registro. Primeira esperada em 01/09."}},{"id":"H6","d":"H","p":"P2","s":"ouvert","e":"M","sk":["biblio","collectif"],"t":{"fr":"Aligner les vocabulaires militants qui ne se connaissent pas","pt":"Alinhar os vocabulários militantes que não se conhecem"},"v":{"fr":"NORLA a bâti son vocabulaire — avec ses facettes *Tactics* et *Social Movement* — **sans lien avec le thésaurus FICEDL**. Deux vocabulaires militants, construits en parallèle, qui s'ignorent. Par ailleurs, les 11 catégories thématiques d'AnarcosyndicalismeBOOK ne sont alignées sur rien.","pt":"A NORLA construiu seu vocabulário — com suas facetas *Tactics* e *Social Movement* — **sem vínculo com o tesauro FICEDL**. Dois vocabulários militantes, construídos em paralelo, que se ignoram. Além disso, as 11 categorias temáticas do AnarcosyndicalismeBOOK não estão alinhadas a nada."},"w":{"fr":"Commencer par le plus petit et le plus faisable : les 11 catégories d'AnarcosyndicalismeBOOK, **un premier pas concret, borné, faisable en une soirée** — et comme le thésaurus est déjà en dix langues, l'alignement vaut simultanément pour les dix. Puis ouvrir la conversation avec NORLA.","pt":"Começar pelo menor e mais viável: as 11 categorias do AnarcosyndicalismeBOOK, **um primeiro passo concreto, delimitado, viável numa noite** — e como o tesauro já está em dez línguas, o alinhamento vale simultaneamente para as dez. Depois abrir a conversa com a NORLA."},"y":{"fr":"Chaque vocabulaire construit isolément est un fonds que les autres ne trouveront pas. Réserve à garder en tête : les vocabulaires d'éphémères sont **monolingues**, l'alignement y sera plus lourd que sur des sujets.","pt":"Cada vocabulário construído isoladamente é um acervo que os outros não encontrarão. Reserva a ter em mente: os vocabulários de efêmeros são **monolíngues**, o alinhamento será mais pesado neles do que em assuntos."},"f":{"fr":["Les 11 catégories d'AnarcosyndicalismeBOOK sont alignées.","Une conversation est ouverte avec NORLA sur l'alignement des facettes.","La réciprocité est demandée : **les catalogues partenaires ne pointent pas en retour** aujourd'hui."],"pt":["As 11 categorias do AnarcosyndicalismeBOOK estão alinhadas.","Uma conversa está aberta com a NORLA sobre o alinhamento das facetas.","A reciprocidade é pedida: **os catálogos parceiros não apontam de volta** hoje."]},"dep":{"fr":"Octobre-novembre, si Bastien s'y met. Lié à **D4**.","pt":"Outubro-novembro, se Bastien topar. Ligado a **D4**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26 §6","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"H7","d":"H","p":"P1","s":"decision","e":"S","sk":["collectif"],"t":{"fr":"Décider du sort du texte de conventions d'interopérabilité","pt":"Decidir o destino do texto de convenções de interoperabilidade"},"v":{"fr":"`CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26` est un **brouillon qui n'engage personne et n'a jamais été discuté avec aucune organisation**. Il propose quatre conventions et une demande unique à la FICEDL.","pt":"`CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26` é um **rascunho que não compromete ninguém e nunca foi discutido com nenhuma organização**. Propõe quatro convenções e um pedido único à FICEDL."},"w":{"fr":"Retirer les notes de travail, porter le texte à Bologne, et le laisser être repris collectivement — ou rangé.","pt":"Retirar as notas de trabalho, levar o texto a Bolonha, e deixá-lo ser retomado coletivamente — ou arquivado."},"y":{"fr":"Deux choses sont écrites et méritent d'être tenues. D'une part, **un texte qui invite d'autres outils à s'appuyer sur le thésaurus demande une position de la fédération, pas un feu vert individuel** — c'est une question d'assemblée. D'autre part, **si le texte devient utile, il devra cesser d'être celui de qui l'a écrit**. Pas de liste de signataires : appliquer une convention se constate en regardant un catalogue, pas en consultant un registre.","pt":"Duas coisas estão escritas e merecem ser mantidas. Por um lado, **um texto que convida outras ferramentas a se apoiarem no tesauro exige uma posição da federação, não um sinal verde individual** — é uma questão de assembleia. Por outro, **se o texto se tornar útil, deverá deixar de ser o de quem o escreveu**. Sem lista de signatários: aplicar uma convenção se constata olhando um catálogo, não consultando um registro."},"f":{"fr":["Les notes de travail sont retirées.","Le texte a été présenté à Bologne et son sort est décidé.","S'attendre à ce que la **convention 4 — accepter d'être pointé en retour** — soit la plus discutée : c'est celle qui coûte le plus aux catalogues établis et rapporte le plus aux nouveaux venus. **Ne pas la retirer pour cette raison.**"],"pt":["As notas de trabalho estão retiradas.","O texto foi apresentado em Bolonha e seu destino está decidido.","Esperar que a **convenção 4 — aceitar ser apontado de volta** — seja a mais discutida: é a que mais custa aos catálogos estabelecidos e mais rende aos recém-chegados. **Não retirá-la por essa razão.**"]},"dep":{"fr":"Bologne, 12-13/09.","pt":"Bolonha, 12-13/09."},"r":["CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26"]},{"id":"I1","d":"I","p":"P1","s":"gele","e":"M","sk":["sysadmin"],"t":{"fr":"Aligner l'image GoTrue sur l'état réel des migrations d'authentification","pt":"Alinhar a imagem GoTrue com o estado real das migrações de autenticação"},"v":{"fr":"La production porte **77 migrations `auth`** (remesuré le 31/08), la dernière datée du 25/06. **Le constat sur l'épinglage est périmé : `deploy/.env` et `deploy/.env.example` portent tous deux `GOTRUE_TAG=v2.192.0` désormais.** Ce que v2.192.0 embarque comme migrations n'a pas été mesuré : l'alignement reste à prouver, et l'item reste gelé avec I2.","pt":"A produção traz **77 migrações `auth`** (remedido em 31/08). **O constato sobre a fixação caducou: `deploy/.env` e `.env.example` trazem ambos `GOTRUE_TAG=v2.192.0`.** O que a v2.192.0 embarca não foi medido: o alinhamento continua por provar."},"w":{"fr":"Une méthode qui **se mesure et ne se devine pas** : monter d'un palier, démarrer sur un volume vierge, `select count(*) from auth.schema_migrations;`, recommencer jusqu'à atteindre au moins 77.","pt":"Um método que **se mede e não se adivinha**: subir um patamar, iniciar num volume virgem, `select count(*) from auth.schema_migrations;`, recomeçar até atingir pelo menos 77."},"y":{"fr":"La règle est simple et absolue : **l'image doit être supérieure ou égale à la production, jamais l'inverse.** Une image en retard démarre sur un schéma qu'elle ne connaît pas et peut le corrompre en tentant de le migrer.","pt":"A regra é simples e absoluta: **a imagem deve ser superior ou igual à produção, nunca o contrário.** Uma imagem atrasada inicia sobre um esquema que não conhece e pode corrompê-lo ao tentar migrá-lo."},"f":{"fr":["Un tag est retenu, avec le compte mesuré à chaque palier écrit.","`deploy/.env.example` est corrigé et la documentation de `deploy/` suit.","Les douze dernières versions de production sont listées pour recoupement."],"pt":["Um tag é escolhido, com a contagem medida em cada patamar escrita.","`deploy/.env.example` está corrigido e a documentação de `deploy/` acompanha.","As doze últimas versões de produção estão listadas para conferência."]},"dep":{"fr":"**Gelé sur la production jusqu'au 14/09.** Le travail en environnement d'essai est ouvert. Premier maillon de la chaîne de bascule.","pt":"**Congelado na produção até 14/09.** O trabalho em ambiente de teste está aberto. Primeiro elo da cadeia de migração."},"r":["REPRISE_bascule_autohebergee_2026-08-26 §1"],"verif":{"fr":"31/08 — `auth.schema_migrations` : 77 ; `deploy/.env` et `.env.example` relus : `v2.192.0` des deux côtés.","pt":"31/08 — `auth.schema_migrations`: 77; `deploy/.env` e `.env.example` relidos: `v2.192.0` dos dois lados."}},{"id":"I2","d":"I","p":"P1","s":"gele","e":"L","sk":["sysadmin"],"t":{"fr":"Achever la bascule vers l'auto-hébergement","pt":"Concluir a migração para a auto-hospedagem"},"v":{"fr":"La pile est réduite de douze à **six conteneurs** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), les versions sont épinglées, `bootstrap.sh` a été exécuté pour de vrai le 26/08 avec huit défauts relevés et corrigés, et la répétition du 18/08 a rejoué 124 migrations et restauré un dump de production en 17 secondes. Reconstruction complète mesurée : **25 minutes**.","pt":"A pilha está reduzida de doze a **seis contêineres** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), as versões estão fixadas, `bootstrap.sh` foi executado de verdade em 26/08 com oito defeitos levantados e corrigidos, e o ensaio de 18/08 reexecutou 124 migrações e restaurou um dump de produção em 17 segundos. Reconstrução completa medida: **25 minutos**."},"w":{"fr":"Ce qui reste : découpler la chaîne de déploiement de l'intégration continue (**de l'extraction, pas de la création** — `scripts/ci/deployer-backend.sh` existe déjà), poser un proxy inverse avec tunnel devant la pile, passer des tags aux empreintes `sha256`, et refaire la répétition à froid un mois plus tard pour vérifier que rien n'a divergé.","pt":"O que resta: desacoplar a cadeia de implantação da integração contínua (**extração, não criação** — `scripts/ci/deployer-backend.sh` já existe), colocar um proxy reverso com túnel na frente da pilha, passar de tags para impressões `sha256`, e refazer o ensaio a frio um mês depois para verificar que nada divergiu."},"y":{"fr":"C'est l'objectif que le projet s'est donné et qu'il n'a pas encore atteint : la fin de la dépendance à un hébergeur tiers. **C'est le chantier le plus technique et le plus autonome du lot** — quelqu'un peut le prendre sans coordination.","pt":"É o objetivo que o projeto se deu e que ainda não atingiu: o fim da dependência de um provedor terceiro. **É o canteiro mais técnico e mais autônomo do lote** — alguém pode assumi-lo sem coordenação."},"f":{"fr":["La pile tourne derrière un proxy inverse, avec les versions en empreintes.","Une reconstruction complète a été refaite un mois après la première.","Garde-fou à préserver impérativement : la boucle de déploiement parcourt `supabase/functions/*/` **en excluant `_shared` et `main`** — sans quoi le routeur partirait sur le Supabase hébergé.","Piège déjà rencontré : les rôles de service n'ont pas de mot de passe dans l'image `supabase/postgres` (SQLSTATE 28P01 en boucle), `postgres` n'est pas superutilisateur (c'est `supabase_admin`), `authenticator` est réservé, et un `set -e` dans la boucle tue le script au premier rôle en échec."],"pt":["A pilha roda atrás de um proxy reverso, com as versões em impressões.","Uma reconstrução completa foi refeita um mês após a primeira.","Guarda a preservar imperativamente: o laço de implantação percorre `supabase/functions/*/` **excluindo `_shared` e `main`** — sem o que o roteador iria para o Supabase hospedado.","Armadilha já encontrada: os papéis de serviço não têm senha na imagem `supabase/postgres` (SQLSTATE 28P01 em laço), `postgres` não é superusuário (é `supabase_admin`), `authenticator` é reservado, e um `set -e` no laço mata o script no primeiro papel em falha."]},"dep":{"fr":"**Gelé sur la production jusqu'au 14/09.** Dépend de **I1**. À faire avant de louer quoi que ce soit : reprendre la connexion authentifiée en local, bloquée par une résolution IPv6 sans route — **ce blocage a probablement disparu de lui-même**, le vérifier coûte cinq minutes et peut épargner une machine montée pour rien.","pt":"**Congelado na produção até 14/09.** Depende de **I1**. A fazer antes de alugar o que quer que seja: retomar a conexão autenticada em local, bloqueada por uma resolução IPv6 sem rota — **esse bloqueio provavelmente desapareceu sozinho**, verificá-lo custa cinco minutos e pode poupar uma máquina montada à toa."},"r":["docs/CHANTIERS_OUVERTS.md §2","deploy/README.md","REPRISE_bascule_autohebergee_2026-08-26"]},{"id":"I3","d":"I","p":"P1","s":"gele","e":"S","sk":["deno"],"t":{"fr":"Tester le routeur `main` de la pile auto-hébergée","pt":"Testar o roteador `main` da pilha auto-hospedada"},"v":{"fr":"`supabase/functions/main/index.ts` existe (6,9 Ko), lit `config.toml` au démarrage, applique un **refus par défaut** — seules les dispenses `verify_jwt = false` sont lues, tout le reste exige un jeton — et refuse de démarrer si le fichier est illisible. **Les quatre tests prévus n'ont pas été passés.**","pt":"`supabase/functions/main/index.ts` existe (6,9 KB), lê `config.toml` na inicialização, aplica uma **recusa por omissão** — só as dispensas `verify_jwt = false` são lidas, todo o resto exige um token — e recusa iniciar se o arquivo for ilegível. **Os quatro testes previstos não foram feitos.**"},"w":{"fr":"Les quatre tests de l'étape 5 de `deploy/REPETITION.md` : fonction protégée sans en-tête d'autorisation → 401 ; avec un jeton valide → 200 ; `health-probe` sans jeton → 200 ; nom inexistant → 404.","pt":"Os quatro testes da etapa 5 de `deploy/REPETITION.md`: função protegida sem cabeçalho de autorização → 401; com um token válido → 200; `health-probe` sem token → 200; nome inexistente → 404."},"y":{"fr":"Le routeur est ce qui remplace la protection par défaut de la plateforme le jour de la bascule. Comme `config.toml` ne déclare que 31 fonctions sur 48, **le refus par défaut du routeur fermera dix-huit fonctions qui fonctionnent aujourd'hui** — il faut le savoir avant, pas après.","pt":"O roteador é o que substitui a proteção por omissão da plataforma no dia da migração. Como `config.toml` só declara 31 funções de 48, **a recusa por omissão do roteador fechará dezoito funções que hoje funcionam** — é preciso saber isso antes, não depois."},"f":{"fr":["Les quatre tests passent.","Le comportement pour les 18 fonctions non déclarées est connu et voulu."],"pt":["Os quatro testes passam.","O comportamento para as 18 funções não declaradas é conhecido e desejado."]},"dep":{"fr":"**Bloqué par B6.** Gelé sur la production jusqu'au 14/09 ; le test en environnement d'essai est ouvert.","pt":"**Bloqueado por B6.** Congelado na produção até 14/09; o teste em ambiente de teste está aberto."},"r":["deploy/README.md","deploy/REPETITION.md étape 5"],"verif":{"fr":"31/08 — `supabase/functions/main/index.ts` : 6 885 octets, présent ; aucun test ne le mentionne dans `src/tests/` ni `tests/`. Le constat tient.","pt":"31/08 — `main/index.ts`: 6 885 bytes, presente; nenhum teste o menciona."}},{"id":"I4","d":"I","p":"P1","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Finir le témoin de provenance des sauvegardes","pt":"Terminar a testemunha de proveniência dos backups"},"v":{"fr":"La migration `20260827180000_temoin_sauvegarde_provenance.sql` est **éprouvée sur un PostgreSQL 16 jetable, avec sept contrôles passés, mais jamais jouée contre la production**. Le correctif `health_probe_provenance.patch` **ne s'applique pas** : `patch failed … index.ts:286`. Il a été produit contre le miroir GitHub. Échéance du 28/08, donc échue.","pt":"A migração `20260827180000_temoin_sauvegarde_provenance.sql` está **testada num PostgreSQL 16 descartável, com sete controles passados, mas nunca executada contra a produção**. A correção `health_probe_provenance.patch` **não se aplica**: `patch failed … index.ts:286`. Foi produzida contra o espelho GitHub."},"w":{"fr":"Départager le conflit par `git hash-object` sur le fichier cible, comparé au blob de base `0d00dc0e016fdfb86ef314e4e707abd4a84d1d2c`. **Empreinte identique → `git apply --3way` passe. Empreinte différente → refaire le correctif à la main sur la version réelle : ne pas forcer, ne pas écraser.** Puis déployer `health-probe`.","pt":"Desempatar o conflito por `git hash-object` no arquivo alvo, comparado ao blob de base `0d00dc0e016fdfb86ef314e4e707abd4a84d1d2c`. **Impressão idêntica → `git apply --3way` passa. Impressão diferente → refazer a correção à mão sobre a versão real: não forçar, não sobrescrever.** Depois implantar `health-probe`."},"y":{"fr":"Ce que le correctif doit obtenir, quelle que soit la voie : dans le courriel, chaque flux affiche son hôte (ou « aucune ») et une mention explicite quand il s'agit d'un amorçage ; dans la raison de sauvegarde, `(dernière source : …)` ou `(aucun signal reçu)`. Sans cela, un courriel vert ne dit pas d'où vient le vert — et c'est exactement le défaut qui a laissé les sauvegardes échouer 36 heures en silence.","pt":"O que a correção deve obter, seja qual for o caminho: no e-mail, cada fluxo exibe seu host (ou «nenhum») e uma menção explícita quando se trata de uma semeadura; na razão de backup, `(última fonte: …)` ou `(nenhum sinal recebido)`. Sem isso, um e-mail verde não diz de onde vem o verde — e é exatamente o defeito que deixou os backups falharem 36 horas em silêncio."},"f":{"fr":["La migration est posée dans `supabase/migrations/` et appliquée.","`health-probe` est déployée avec le comportement de provenance.","**`temoin_sauvegarde_provenance.patch` est périmé : à ignorer, ne pas l'appliquer.**"],"pt":["A migração está em `supabase/migrations/` e aplicada.","`health-probe` está implantada com o comportamento de proveniência.","**`temoin_sauvegarde_provenance.patch` está vencido: ignorar, não aplicá-lo.**"]},"dep":{"fr":"Ne pas confondre avec le `snapshot_id` nul sur cinq lignes : le remède tient en trois lignes mais **`anarbib-bg2.sh` vit sur le poste de travail, hors dépôt** — c'est à signaler, pas à tenter depuis le dépôt.","pt":"Não confundir com o `snapshot_id` nulo em cinco linhas: o remédio cabe em três linhas mas **`anarbib-bg2.sh` vive na estação de trabalho, fora do repositório** — é para sinalizar, não para tentar a partir do repositório."},"r":["NOTE_temoin_sauvegarde_2026-08-27","REPRISE_claude_code_2026-08-27 chantier 1"],"verif":{"fr":"31/08 — la version `20260827180000` n'est ni dans `supabase/migrations/` ni au registre de production (0 ligne). Le fichier n'a pas été retrouvé dans le dépôt. Le mot « provenance » apparaît en revanche dix fois dans le `health-probe/index.ts` du dépôt : la part fonction existe au moins en partie ; la part base, nulle part. Échéance du 28/08 échue.","pt":"31/08 — a versão `20260827180000` não está nem no repositório nem no registro de produção. « provenance » aparece dez vezes no `health-probe` do repositório: a parte função existe ao menos em parte; a parte banco, em lugar nenhum."}},{"id":"I6","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Purger les relevés de la sonde de santé","pt":"Purgar os registros da sonda de saúde"},"v":{"fr":"`service_health_probes` porte **13 932 lignes** et croît de 288 par jour, sans aucun cron de purge — alors que sept autres purges existent dans les 36 jobs.","pt":"`service_health_probes` traz **13 932 linhas** e cresce 288 por dia, sem nenhum cron de purga — enquanto sete outras purgas existem nos 36 jobs."},"w":{"fr":"Un cron de purge sur le modèle de `anarbib-catalog-audit-snapshot-purge`, avec une rétention à décider — trente jours suffisent probablement, les incidents étant conservés à part dans `service_health_incidents`.","pt":"Um cron de purga no modelo de `anarbib-catalog-audit-snapshot-purge`, com uma retenção a decidir — trinta dias provavelmente bastam, já que os incidentes são conservados à parte em `service_health_incidents`."},"y":{"fr":"C'est la table la plus volumineuse de la base, et elle ne contient que du bruit dont l'utile a déjà été extrait. À ce rythme elle atteindra cent mille lignes avant la fin de l'année, ce qui alourdira chaque sauvegarde pour rien.","pt":"É a tabela mais volumosa do banco, e só contém ruído do qual o útil já foi extraído. Nesse ritmo alcançará cem mil linhas antes do fim do ano, o que pesará em cada backup à toa."},"f":{"fr":["Un cron de purge existe, avec une rétention écrite.","`service_health_incidents` n'est pas touchée par la purge."],"pt":["Um cron de purga existe, com uma retenção escrita.","`service_health_incidents` não é tocada pela purga."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026","REGISTRE §38 OPS"],"verif":{"fr":"31/08 — 16 088 relevés (13 932 au 29/08 : la croissance d'environ 288 par jour se confirme), le plus ancien du 17/08, et toujours aucun cron de purge dédié.","pt":"31/08 — 16 088 registros (13 932 em 29/08), o mais antigo de 17/08, e ainda nenhum cron de purga."}},{"id":"I8","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Mettre `deploy/README.md` en accord avec ce qui a été exécuté","pt":"Pôr `deploy/README.md` de acordo com o que foi executado"},"v":{"fr":"Le document affirme en gras : « Rien de tout ceci n'a encore tourné ». Trois commits du 26/08 décrivent des exécutions réelles avec huit défauts relevés. Par ailleurs `bootstrap.sh` a **huit étapes** plus une « 7 bis » et une vérification, là où le README en annonce sept ; et le README déclare `notify-cross-library-digest` « absente du dépôt » alors qu'elle y est.","pt":"O documento afirma em negrito: «Nada disso ainda rodou». Três commits de 26/08 descrevem execuções reais com oito defeitos levantados. Além disso `bootstrap.sh` tem **oito etapas** mais uma «7 bis» e uma verificação, onde o README anuncia sete; e o README declara `notify-cross-library-digest` «ausente do repositório» quando ela está lá."},"w":{"fr":"Réécrire la section d'état à partir des journaux d'exécution du 26/08, corriger le compte d'étapes, et retirer l'affirmation sur `notify-cross-library-digest`.","pt":"Reescrever a seção de estado a partir dos diários de execução de 26/08, corrigir a contagem de etapas, e retirar a afirmação sobre `notify-cross-library-digest`."},"y":{"fr":"`deploy/README.md` est le document que lira quelqu'un qui prend **A2** — la reconstruction par un tiers. Une phrase qui dit « rien n'a tourné » va lui faire croire qu'il essuie les plâtres alors que huit défauts ont déjà été trouvés et corrigés pour lui.","pt":"`deploy/README.md` é o documento que lerá quem assumir **A2** — a reconstrução por um terceiro. Uma frase que diz «nada rodou» vai fazê-lo crer que está abrindo caminho quando oito defeitos já foram encontrados e corrigidos para ele."},"f":{"fr":["La section d'état décrit ce qui a tourné et ce qui n'a pas tourné.","Les quatre points « à confirmer avant bascule » ont un verdict : GoTrue et le courriel, `PGRST_DB_SCHEMAS` mis à `public,api,storage` par déduction, le cas `notify-cross-library-digest` (clos), et le rejeu des migrations.","`CADDY_TAG=2` est un tag majeur flottant dans un fichier qui proclame « aucun `latest`, jamais » : à épingler ou à justifier."],"pt":["A seção de estado descreve o que rodou e o que não rodou.","Os quatro pontos «a confirmar antes da migração» têm um veredicto: GoTrue e o e-mail, `PGRST_DB_SCHEMAS` posto em `public,api,storage` por dedução, o caso `notify-cross-library-digest` (encerrado), e a reexecução das migrações.","`CADDY_TAG=2` é um tag maior flutuante num arquivo que proclama «nenhum `latest`, jamais»: a fixar ou a justificar."]},"dep":{"fr":"Prérequis moral de **A2**.","pt":"Pré-requisito moral de **A2**."},"r":["deploy/README.md","Commits 57321385, 35c03dd5, 90266600"],"verif":{"fr":"31/08 — `deploy/README.md` affirme toujours « Rien de tout ceci n'a encore tourné » et déclare toujours `notify-cross-library-digest` absente du dépôt. Le constat tient mot pour mot.","pt":"31/08 — `deploy/README.md` ainda afirma que nada rodou e ainda declara `notify-cross-library-digest` ausente do repositório."}},{"id":"I10","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Nettoyer les traces de Turnstile et les fichiers de rebut","pt":"Limpar os rastros do Turnstile e os arquivos de refugo"},"v":{"fr":"Turnstile a été entièrement retiré du code le 20/08 — sa réapparition serait une régression. Mais des **clés de test subsistent** dans `.env.example` (deux entrées), `.env.local`, `deploy/functions.env`, une référence dans `package.json`, et un secret au Vault. Par ailleurs `tmp-ficedl/` (754 Ko, doublon exact d'un fichier versionné) traîne à la racine, et `docs/drafts/` est versionné sans règle.","pt":"O Turnstile foi inteiramente retirado do código em 20/08 — sua reaparição seria uma regressão. Mas **chaves de teste subsistem** em `.env.example` (duas entradas), `.env.local`, `deploy/functions.env`, uma referência em `package.json`, e um segredo no Vault. Além disso `tmp-ficedl/` (754 KB, duplicata exata de um arquivo versionado) fica na raiz, e `docs/drafts/` está versionado sem regra."},"w":{"fr":"Retirer les cinq traces, supprimer `tmp-ficedl/` (ignoré par git depuis le 28/08, donc sans risque), et décider du statut de `docs/drafts/` : soit c'est un sas et il s'ignore, soit c'est du contenu et il se documente.","pt":"Retirar os cinco rastros, suprimir `tmp-ficedl/` (ignorado pelo git desde 28/08, portanto sem risco), e decidir o estatuto de `docs/drafts/`: ou é uma antecâmara e se ignora, ou é conteúdo e se documenta."},"y":{"fr":"Une clé de test dans un fichier d'exemple est ce que copiera la prochaine personne qui installe le projet. Et `docs/drafts/` est exactement l'endroit où le SQL des sujets SOLIDAIRES s'est perdu (voir **C1**) : un dossier sans règle est un dossier où les choses restent.","pt":"Uma chave de teste num arquivo de exemplo é o que copiará a próxima pessoa que instalar o projeto. E `docs/drafts/` é exatamente o lugar onde o SQL dos assuntos SOLIDAIRES se perdeu (ver **C1**): uma pasta sem regra é uma pasta onde as coisas ficam."},"f":{"fr":["Aucune trace de Turnstile hors historique git.","`tmp-ficedl/` a disparu du disque.","`docs/drafts/` a une règle écrite : ce qui y entre en sort, ou n'y entre pas."],"pt":["Nenhum rastro do Turnstile fora do histórico git.","`tmp-ficedl/` desapareceu do disco.","`docs/drafts/` tem uma regra escrita: o que entra sai, ou não entra."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["RUNBOOK_exploitation_v0.3 §9.8","PLAN_DE_MARCHE §7.4","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — le ménage a avancé sans que l'item le sache : plus aucune trace Turnstile dans `package.json`, `.env.local`, `deploy/functions.env` ni au Vault ; `.env.example` n'en garde qu'une mention historique en commentaire. Restent : le secret de fonction `TURNSTILE_SECRET_KEY` (posé le 05/05), `tmp-ficedl/` (740 Ko) à la racine, et `docs/drafts/` sans règle (2 fichiers).","pt":"31/08 — a limpeza avançou: nenhum traço Turnstile em `package.json`, `.env.local`, `functions.env` nem no Vault. Restam: o segredo de função `TURNSTILE_SECRET_KEY`, `tmp-ficedl/` (740 KB) e `docs/drafts/` sem regra."}},{"id":"I11","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Sortir de `node:20`, en fin de maintenance","pt":"Sair do `node:20`, em fim de manutenção"},"v":{"fr":"Les trois jobs d'intégration continue tournent dans un conteneur `node:20`, dont la fenêtre de maintenance à long terme s'est achevée en avril 2026. C'est le point de fin de vie le plus net de la chaîne.","pt":"Os três jobs de integração contínua rodam num contêiner `node:20`, cuja janela de manutenção de longo prazo terminou em abril de 2026. É o ponto de fim de vida mais claro da cadeia."},"w":{"fr":"Passer à la version en maintenance longue suivante, vérifier que le build, les tests et le lint passent, et que la CLI Supabase épinglée `v2.98.1` s'y installe.","pt":"Passar para a versão em manutenção longa seguinte, verificar que o build, os testes e o lint passam, e que a CLI Supabase fixada `v2.98.1` se instala nela."},"y":{"fr":"Une image sans mises à jour de sécurité fait tourner tout le déploiement. Le changement est mécanique et se vérifie en une exécution.","pt":"Uma imagem sem atualizações de segurança faz rodar toda a implantação. A mudança é mecânica e se verifica numa execução."},"f":{"fr":["Les trois jobs tournent sur une version maintenue.","Le lint reste à zéro erreur (environ cent avertissements est l'état normal)."],"pt":["Os três jobs rodam numa versão mantida.","O lint continua com zero erro (cerca de cem avisos é o estado normal)."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":[".forgejo/workflows/ci.yml","package.json"],"verif":{"fr":"31/08 — 7 occurrences de `node:20` dans les deux workflows. Rien n'a bougé.","pt":"31/08 — 7 ocorrências de `node:20` nos dois workflows. Nada mudou."}},{"id":"I12","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Automatiser le rafraîchissement du miroir froid","pt":"Automatizar a atualização do espelho frio"},"v":{"fr":"Le miroir froid `anarbib-mirror.git` existe sur le poste de travail et son rafraîchissement est manuel. Les unités systemd `anarbib-mirror-refresh.service` et `.timer` sont versionnées dans `deploy/ops/` mais leur mise en service n'est pas confirmée.","pt":"O espelho frio `anarbib-mirror.git` existe na estação de trabalho e sua atualização é manual. As unidades systemd `anarbib-mirror-refresh.service` e `.timer` estão versionadas em `deploy/ops/` mas sua entrada em serviço não está confirmada."},"w":{"fr":"Vérifier que le minuteur tourne, et sinon le mettre en service. Consigner la fraîcheur du miroir quelque part de lisible.","pt":"Verificar se o temporizador roda, e senão colocá-lo em serviço. Registrar o frescor do espelho em algum lugar legível."},"y":{"fr":"Une reconstruction demande **trois** choses et non deux : le dépôt, une sauvegarde, **et les secrets du Vault**. Le miroir froid est la troisième copie du dépôt, après Codeberg et le miroir GitHub. Il ne sert que s'il est à jour — et le miroir GitHub a déjà accumulé 6 878 objets de retard une fois.","pt":"Uma reconstrução exige **três** coisas e não duas: o repositório, um backup, **e os segredos do Vault**. O espelho frio é a terceira cópia do repositório, depois do Codeberg e do espelho GitHub. Só serve se estiver atualizado — e o espelho GitHub já acumulou 6 878 objetos de atraso uma vez."},"f":{"fr":["Le rafraîchissement est automatique et son échec alerte.","La fraîcheur du miroir apparaît dans le témoin de sauvegarde."],"pt":["A atualização é automática e sua falha alerta.","O frescor do espelho aparece na testemunha de backup."]},"dep":{"fr":"Lié à **I4**.","pt":"Ligado a **I4**."},"r":["RUNBOOK_exploitation_v0.3 §4 §9.1"],"verif":{"fr":"31/08 — les unités sont bien versionnées, dans `deploy/ops/systemd/` (`anarbib-mirror-refresh.service` + `.timer`, avec toute la famille sauvegardes). Le miroir froid porte un HEAD du 30/08 à 16 h — au plus un jour de retard — mais rien d'ici ne distingue un timer actif d'un rafraîchissement manuel, et `systemctl` ment sur ce poste : mise en service toujours non confirmée.","pt":"31/08 — as unidades estão versionadas em `deploy/ops/systemd/`. O espelho frio traz um HEAD de 30/08 às 16h — no máximo um dia de atraso — mas nada daqui distingue um timer ativo de um refresh manual."}},{"id":"I13","d":"I","p":"P3","s":"ouvert","e":"M","sk":["sysadmin"],"t":{"fr":"Finir la bascule vers le nouveau moteur de pages","pt":"Terminar a migração para o novo motor de páginas"},"v":{"fr":"L'étape 0 est concluante depuis le 20/08 : `test.anarbib.org` est servi par le nouveau moteur en parallèle. La chaîne d'intégration continue utilise déjà l'action `git-pages`. **Codeberg Pages en version historique est en mode maintenance, pas en fin de vie** — la documentation dit qu'il continuera de fonctionner indéfiniment. D'où la priorité basse.","pt":"A etapa 0 é conclusiva desde 20/08: `test.anarbib.org` é servido pelo novo motor em paralelo. A cadeia de integração contínua já usa a ação `git-pages`. **O Codeberg Pages em versão histórica está em modo de manutenção, não em fim de vida** — a documentação diz que continuará funcionando indefinidamente."},"w":{"fr":"Poser l'enregistrement TXT de liste blanche, créer `public/_redirects` avec la règle de réécriture, vérifier qu'une route inconnue renvoie 200 avec le bon contenu, puis nettoyer **seulement après** vérification verte.","pt":"Colocar o registro TXT de lista branca, criar `public/_redirects` com a regra de reescrita, verificar que uma rota desconhecida retorna 200 com o conteúdo certo, depois limpar **somente após** verificação verde."},"y":{"fr":"Deux points de vigilance sont écrits. **Ne pas toucher aux enregistrements A et AAAA**, qui sont bons. Et **vérifier la casse de l'URL** : le workflow écrit `AnarBib`, la documentation écrit `anarbib` — en cas de doute, poser les deux enregistrements TXT.","pt":"Dois pontos de vigilância estão escritos. **Não tocar nos registros A e AAAA**, que estão bons. E **verificar a caixa do URL**: o workflow escreve `AnarBib`, a documentação escreve `anarbib` — na dúvida, colocar os dois registros TXT."},"f":{"fr":["Le site est servi par le nouveau moteur, avec les routes inconnues en 200.","Le nettoyage est fait après vérification : `public/.domains`, la branche `pages`, les secrets devenus inutiles.","**Laisser `public/CNAME`** — il sert au miroir GitHub.","Incertitudes assumées : la réversibilité de la bascule n'est documentée nulle part, aucune limite chiffrée n'est publiée (taille, bande passante, délai), et les fichiers vendorisés pèsent lourd — **point à surveiller au premier déploiement**."],"pt":["O site é servido pelo novo motor, com as rotas desconhecidas em 200.","A limpeza é feita após verificação: `public/.domains`, o branch `pages`, os segredos que se tornaram inúteis.","**Deixar `public/CNAME`** — serve ao espelho GitHub.","Incertezas assumidas: a reversibilidade da migração não está documentada em lugar nenhum, nenhum limite numérico está publicado (tamanho, banda, prazo), e os arquivos vendorizados pesam — **ponto a vigiar na primeira implantação**."]},"dep":{"fr":"P1, pas P0 — la version historique n'a pas de date d'arrêt annoncée.","pt":"P1, não P0 — a versão histórica não tem data de encerramento anunciada."},"r":["PLAN_migration_git_pages_2026-08-19","RUNBOOK_exploitation_v0.3"],"verif":{"fr":"31/08 — une partie du nettoyage est déjà faite : la branche `pages` n'existe plus sur la forge, `public/.domains` a disparu, et `public/CNAME` est bien préservé. Restent à confirmer le service lui-même et les secrets devenus inutiles.","pt":"31/08 — parte da limpeza já está feita: o branch `pages` não existe mais, `public/.domains` sumiu, `public/CNAME` preservado."}},{"id":"B17","d":"B","p":"P1","s":"en-cours","e":"M","sk":["deno","i18n"],"t":{"fr":"L'avertissement qui devait rendre visibles les actions d'un administrateur réseau n'existe pas","pt":"O aviso que devia tornar visíveis as ações de um administrador de rede não existe"},"v":{"fr":"**Trouvé le 31/08 en instruisant B12, et le constat était faux par excès.** La spec `spec-administrateur-reseau-v0.4` §6.3 l'écrit : « *Si action critique → INSERT dans outbox d'event `network.cross_library_critical_action` → **mail immédiat aux coordenadores actifs de la biblio*** ». Ce mail-là n'est jamais parti. Le déclencheur SQL fonctionne — quatre lignes en file, la dernière du **30/08/2026** — mais `_shared/domain/network.ts` connaissait onze events `network.*` et pas celui-là : il tombait dans le `else` final, marqué `skipped`.\n\n**Ce qui manquait au constat, trouvé le soir même.** Le dispositif a **deux étages**, et l'autre marche. `notify-cross-library-digest`, écrite le 17/08, envoie chaque lundi à 8 h 30 le récapitulatif hebdomadaire des actions inter-bibliothèques — **aux mêmes destinataires** (les coordenador·es actif·ves de chaque biblio touchée), dans leur langue, avec des libellés humains pour les dix types d'action. Le cron a tourné le 31/08 à 8 h 30 comme les lundis précédents.\n\nLe premier relevé ne l'avait pas vue parce qu'il cherchait le **nom de l'event** : le récapitulatif ne lit pas l'outbox, il lit la table de journal `network_admin_cross_library_actions_log`. Aucun `grep` sur `cross_library_critical_action` ne pouvait le trouver — d'où `DOC-RECENS-1`.\n\n**Le manque réel n'était donc pas la visibilité, mais le délai** : jusqu'à sept jours entre une action décidée du dehors et le moment où la bibliothèque l'apprend. Pour une promotion, l'attente est tenable ; pour `team_suspend_member` ou `team_request_remove_member`, elle ne l'est pas.\n\n**Et l'en-tête de `notify-cross-library-digest` affirmait depuis le 17/08 que l'étage immédiat fonctionnait.** Un commentaire qui décrit un mécanisme absent est exactement ce qui fait qu'on ne le cherche pas.\n\n**Livré le 31/08.** `_shared/domain/cross_library.ts` (handler, destinataires = coordenador·es actif·ves hors acteur·rice, identité d'expéditeur *réseau* et non *bibliothèque*), branché dans `handleNetworkEvent`. Les libellés des dix actions et six objets **ne sont pas réécrits** : le fichier de chaînes du récapitulatif a quitté `notify-cross-library-digest/` pour `_shared/i18n/cross-library-strings.ts`, lu par les deux étages — trois nouvelles clés × dix locales au lieu de cent vingt, et surtout aucune divergence possible entre ce que les deux étages appellent le même geste. Le qualifiant « proposition, N ratifications requises — rien n'est encore fait » est partagé lui aussi.\n\n**Neuf types d'action, pas sept.** `fn_is_critical_action_type()` en énumère sept ; deux RPC de réattribution d'ouvrage passent `p_is_critical := true` en dur. Les dix libellés couvrent les neuf.\n\n**Éprouvé le 31/08 à 15 h 23 : le courriel est parti et il a été lu.** La ligne `#72` rejouée, `notify-event` a répondu `200` avec `recipients_count: 3` et trois `ok: true` — les trois coordenador·es actif·ves de la Terra Livre. Le message reçu porte l'identité **AnarBib**, pas celle de la bibliothèque (à comparer avec l'invitation à endosser de la veille, qui porte le logo de la Terra Livre : la distinction se voit à l'œil nu, et c'est tout l'objet). Il dit *« Promoção ao papel de coordenação (proposta, 2 ratificação(ões) necessária(s) — nada feito ainda) »* : le qualifiant partagé avec le récapitulatif fait son travail, l'avertissement n'annonce pas un fait accompli. La ligne est passée à `sent`, `sent_at` rempli, `skip_reason` revenu à `NULL`.\n\n**Deux choses vues en éprouvant, qui ne sont pas dans le code.**\n\n*(a)* **Un recouvrement partiel, pour ce seul type d'action.** La destinataire a reçu le même jour le récapitulatif hebdomadaire à 10 h 30 et l'avertissement immédiat à 15 h 23, tous deux sur la même promotion — plus, la veille, l'invitation à endosser, qui nommait déjà Xavier comme proposeur. C'est un artefact du rejeu (en régime normal l'immédiat précède le lundi de plusieurs jours), mais il montre que pour `team_promote_to_coordenador` **trois canaux parlent du même geste**. Les six autres types critiques n'en ont qu'un : `team_suspend_member`, `team_request_remove_member`, `update_library`, les deux réattributions d'ouvrage et les changements de politique n'envoient rien à personne avant le lundi. **C'est là que l'étage immédiat gagne ses sept jours** — et c'est là qu'il faudra l'éprouver ensuite. Question ouverte, une occurrence ne suffit pas à trancher : faut-il taire l'immédiat quand une invitation a déjà été émise pour la même entité ? Relève d'`OPS-8`, pas d'un correctif.\n\n*(b)* **Le courriel a été trouvé dans la corbeille** de la boîte Hotmail destinataire. Peut-être un geste de la personne, peut-être un classement automatique. À vérifier avant de compter sur ce canal pour une alerte de gouvernance : un avertissement qui arrive dans la corbeille est un avertissement qui n'arrive pas. **C'est un item à ouvrir, pas une retouche de B17.**","pt":"**Encontrado em 31/08 ao instruir B12, e o constato estava errado por excesso.** A spec §6.3 prevê um **e-mail imediato** aos coordenadores da biblioteca quando um administrador de rede age nela. Esse e-mail nunca partiu: o gatilho SQL enfileirava desde 8 de junho, mas nenhum handler tratava o evento.\n\n**O que faltava ao constato.** O dispositivo tem **dois andares**, e o outro funciona: `notify-cross-library-digest`, escrita em 17/08, envia toda segunda-feira o resumo semanal **aos mesmos destinatários**. O primeiro levantamento não a viu porque procurava o **nome do evento**: o resumo lê a tabela de registro, não a outbox. Daí `DOC-RECENS-1`.\n\n**A falta real não era a visibilidade, mas o prazo**: até sete dias. Para uma promoção, é tolerável; para `team_suspend_member`, não.\n\n**Entregue em 31/08.** `_shared/domain/cross_library.ts`, ligado a `handleNetworkEvent`. Os rótulos das dez ações não foram reescritos: o ficheiro de cadeias mudou-se para `_shared/i18n/cross-library-strings.ts` e é lido pelos dois andares.\n\n**Provado em 31/08 às 15h23: o e-mail partiu e foi lido.** A linha `#72` reproduzida, `notify-event` respondeu `200` com `recipients_count: 3`. A mensagem traz a identidade **AnarBib**, não a da biblioteca, e diz *«Promoção ao papel de coordenação (proposta, 2 ratificação(ões) necessária(s) — nada feito ainda)»*. A linha passou a `sent`, `skip_reason` de volta a `NULL`.\n\n**Duas coisas vistas ao provar.** *(a)* Para este único tipo de ação, **três canais falam do mesmo gesto** — o convite a endossar na véspera, o resumo semanal às 10h30 e o aviso imediato às 15h23. Os outros seis tipos críticos não têm nenhum antes de segunda-feira: é aí que o andar imediato ganha os seus sete dias. Questão em aberto. *(b)* O e-mail foi encontrado **na lixeira** da caixa destinatária. A verificar: um aviso que chega ao lixo é um aviso que não chega."},"w":{"fr":"**Il reste une chose, et une seule** : éprouver sur un type d'action qui n'a pas d'autre canal. La promotion collégiale en a trois ; une suspension n'en a aucun avant le lundi. Tant que l'étage immédiat n'a été vu qu'au seul endroit où il fait doublon, on n'a pas éprouvé ce pour quoi il a été écrit.\n\n**Les trois lignes de juin ne sont pas retouchées.** Leur `skip_reason` dit `unknown_network_event`, et c'est exact : ce jour-là, l'event était inconnu du handler. Le réécrire en septembre falsifierait un journal au lieu de le compléter.","pt":"**Resta uma coisa, e uma só**: provar sobre um tipo de ação sem outro canal — uma suspensão não tem nenhum antes de segunda-feira.\n\n**As três linhas de junho não são retocadas**: o seu `skip_reason` é exato."},"y":{"fr":"Un pouvoir transverse sans trace visible par celles qui le subissent n'est pas un pouvoir contrôlé. La spec l'avait compris et l'avait écrit ; le code ne l'a jamais fait. À Bologne, c'est exactement le genre d'écart qu'on ne peut pas présenter comme acquis.","pt":"Um poder transversal sem rasto visível para quem o sofre não é um poder controlado. A spec entendeu-o e escreveu-o; o código nunca o fez."},"f":[{"fr":"~~L'event a un handler~~ — `_shared/domain/cross_library.ts`, branché le 31/08.","pt":"~~O evento tem um handler~~ — entregue em 31/08."},{"fr":"~~Les dix locales ont leurs chaînes~~ — trois clés de cadre ajoutées ; les libellés d'action et d'objet sont ceux du récapitulatif, désormais partagés.","pt":"~~As dez locales têm as suas cadeias~~ — partilhadas com o resumo semanal."},{"fr":"~~Un courriel est vu partir~~ — 31/08 à 15 h 23, trois destinataires réels, message reçu et lu.","pt":"~~Um e-mail é visto partir~~ — 31/08 às 15h23, três destinatárias reais."},{"fr":"~~Le courriel dit « proposition, deux ratifications requises »~~ — vérifié sur le message reçu.","pt":"~~O e-mail diz «proposta, duas ratificações necessárias»~~ — verificado."},{"fr":"~~L'en-tête de `notify-cross-library-digest` ne décrit plus comme acquis un étage absent~~.","pt":"~~O cabeçalho de `notify-cross-library-digest` deixa de afirmar o que não existia~~."},{"fr":"Éprouvé sur un type d'action **qui n'a pas d'autre canal** — `team_suspend_member` de préférence. C'est le cas où les sept jours comptent, et le seul non couvert.","pt":"Provado sobre um tipo de ação **sem outro canal** — de preferência `team_suspend_member`."}],"dep":{"fr":"Éclairé par **B12** (la raison du saut est écrite). Résonne avec **A1** : un seul administrateur réseau, donc un seul émetteur possible de ces actions. Partage son vocabulaire avec le récapitulatif hebdomadaire, ce qui **allège F6** d'un fichier au lieu de l'alourdir.","pt":"Esclarecido por **B12**. Ressoa com **A1**. Partilha o vocabulário com o resumo semanal, o que **alivia F6**."},"r":["docs/specs/spec-administrateur-reseau-v0.4.md §6.3","supabase/functions/_shared/domain/cross_library.ts","supabase/functions/_shared/i18n/cross-library-strings.ts","supabase/functions/notify-cross-library-digest/","public.team_notification_outbox lignes 56, 58, 61, 72","public.fn_is_critical_action_type","REGISTRE DOC-RECENS-1","item B12","item F6"],"verif":{"fr":"31/08 — instruit, **corrigé**, livré et **éprouvé en envoi réel le jour même**. Cinq sources : la base (4 lignes en file ; `#72` passée à `sent` à 15 h 23 h 35, `skip_reason` à `NULL`), la réponse HTTP de `notify-event` (`200`, `recipients_count: 3`, trois `ok: true`), **le courriel reçu et relu** (identité réseau, qualifiant de proposition correct), le code (aucune branche pour cet event avant ce jour ; un récapitulatif hebdomadaire qui sert les mêmes destinataires depuis le 17/08), et le déclencheur `trg_team_outbox_dispatch`, `AFTER INSERT` sans rejeu. **Reste à éprouver sur un type d'action sans autre canal.**","pt":"31/08 — instruído, **corrigido**, entregue e **provado em envio re
