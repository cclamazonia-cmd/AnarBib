paires de fixtures de formation exclues). Les 333 secondes personnes restent : lot par contributeur à écrire, après l'homonymie.","pt":"**B, entregue na mesma tarde — e a dívida era o dobro do que a ficha dizia.** O render «autoridade senão transcrição» já era a regra do OPAC ; o formulário só preenche a transcrição, rótulo «autor tal como impresso» em dez locales ; o lote `autor_sans_autorite` existe (`7618ccfc`) : aplicar **põe uma ligação** em vez de reescrever um texto, com anti-sobreposição CONV-O6. **464 livros semeados em produção, não 226** : a ficha lia `book_authors`, tabela derivada ; a verdade vive em `book_contributors`. Suite SQL de 8 testes. O trabalho dos 464 é manual, na Oficina, sem prazo. **Na mesma noite, Xavier decidiu os 464** na Oficina: 446 validados e aplicados (446 ligações, **227 autoridades criadas**), 18 descartados. As 227 autoridades novas são o primeiro objeto da auditoria cadrada em `docs/journal/cadrages/REPRISE_audit_autorites_en_profondeur_2026-09-03.md`. **03/09, noite — a auditoria está feita**: as 227 estão classificadas (98 formas invertidas corretas, 60 formas diretas, 35 mononímios, 48 em maiúsculas, ~20 coletividades sem tipo, 7 menções de função, 8 fichas duplas, `??`, `identificado, Não`); **9 são duplicatas** de fichas corrigidas em 21/08 — a busca de homônimo do lote comparava letra a letra. Corrigido (busca `fn_conv_autorite_homonyme`, sem caixa nem acentos, forma derivada; proposta que lê « identificado, Não »); as 227 vão para os lotes `autorite_casse`, `autorite_collectivite` e para o novo `autorite_forme`; 8 duplicatas exatas são sinalizadas ao Ateliê (os 5 pares de fixtures de formação excluídos). As 333 segundas pessoas ficam: lote por contribuidor a escrever, depois da homonímia."}],["D2","2026-09-03",{"fr":"**A, les cinq — et le seul geste de code est livré.** Verdicts inscrits (spec périodiques v1.0 §13, `5f63e75f`) en accord avec le code : `periodicidade` libre, deux liens de filiation, pas de `library_id`, promotion = un geste, page dédiée. La liste de suggestions non contraignante de `periodicidade` (huit valeurs, `datalist`, dix locales) est dans `SerialDetailEditor` depuis `5f43a247` ; elle ne se fermera que le jour où un fonds réel (Anarchief) en fera apparaître le besoin. 4 titres en base, `periodicidade` jamais renseignée : la liste arrive avant le premier usage.","pt":"**A, as cinco — e o único gesto de código está entregue.** Vereditos inscritos em acordo com o código ; lista de sugestões de `periodicidade` (oito valores, dez locales) em `SerialDetailEditor` desde `5f43a247`."}],["E11","2026-09-03",{"fr":"**A — les tags fermés, le flux requalifié et livré le jour même.** `OPAC-TAG1` fermé au REGISTRE (un tag signé dit qui a lu quoi ; un tag anonyme ne se modère pas ; le besoin est couvert par l'autorité matière et le thésaurus). `OPAC-RSS1` requalifié puis **livré** (`e7a8acab`) : Edge Function `rss-novidades` — `GET /functions/v1/rss-novidades/<slug>`, **deux gardes et rien d'autre** (la bibliothèque est publique via `api.libraries_public_v1` ; les notices viennent de `v_books_public_catalog_v2`, la vue que l'OPAC anonyme lit déjà), RSS 2.0, autorité sinon transcription, lien vers la notice, cache d'une heure ; banc d'essai de 5 tests (même recette que gazette, `@vitest-environment node`) ; lien « Nouveautés (RSS) » sur la page publique et en tête du catalogue de chaque bibliothèque, dix locales. Sans requête, sans compte : rien à pister. **Ce que le banc ne voit pas, la production l'a montré** : à la première requête, 500 « permission denied for view libraries_public_v1 » — la vue `security_invoker` n'était accordée qu'à `anon` et `authenticated`, pas au rôle de service de la fonction ; un grant `SELECT` (`3677442a`, `20260903150755`) a suffi, le prédicat de publicité reste dans la vue. Vérifié ensuite en production : `/rss-novidades/blmf` répond un flux valide.","pt":"**A — tags fechadas, feed requalificado e entregue no mesmo dia.** `OPAC-TAG1` fechado ; `OPAC-RSS1` requalificado e **entregue** (`e7a8acab`) : Edge Function `rss-novidades`, duas guardas e nada mais (biblioteca pública, vista pública), RSS 2.0, banco de 5 testes, link «Novidades (RSS)» na página pública de cada biblioteca. Sem consulta, sem conta : nada a rastrear."}],["B4","2026-09-04",{"fr":"**Verdict écrit le 04/09 (`04b5c298`, migration `20260904184501`) : les quatre sont fermées exprès.** `author_name_aliases` (1 644 lignes) est lue par six fonctions `SECURITY DEFINER` (`merge_author`, `preview_merge_author`, `suggest_author_duplicates`, `suggest_authority_duplicates`, `fn_conv_fusionner_doublon_exact`, `api.search_catalog_v1`) et deux vues (`v_author_alias_candidates_unique`, `v_author_alias_worklist`) — rien ne la lit directement, et rien ne devrait. `library_themes` (7 lignes) et `library_theme_configs` (vide) passent par `get/set_library_theme_config*` et `fn_ensure_library_theme` ; `interlibrary_loan_events` (vide) n'est écrite que par `fn_v2_log_emprestimo_interbibliotecas_event` — le PEB n'a pas d'écran (G6). Chaque table porte le verdict en `COMMENT ON TABLE`, avec les noms. **Le second critère était déjà rempli** : `deploy/bootstrap.sh` liste nommément les 15 tables fermées attendues (`SANS_POLICY_ATTENDUES`) et échoue si l'une manque ou s'il y en a une de trop — `DOC-RECENS-1`.","pt":"**Veredicto escrito em 04/09 (`04b5c298`, migração `20260904184501`) : as quatro estão fechadas de propósito.** `author_name_aliases` é lida por seis funções DEFINER e duas vistas ; `library_themes` / `library_theme_configs` passam por `get/set_library_theme_config*` ; `interlibrary_loan_events` só é escrita por `fn_v2_log_emprestimo_interbibliotecas_event`. Cada tabela leva o veredicto em `COMMENT ON TABLE`. O segundo critério já estava cumprido : `bootstrap.sh` lista as 15 tabelas fechadas esperadas."}],["I11","2026-09-04",{"fr":"**`node:22` depuis le 04/09 (`04b5c298`)** — sept occurrences dans `ci.yml` et `sql-tests.yml`. La CLI Supabase `v2.98.1` est un binaire téléchargé par `curl`, pas un paquet npm : rien à réinstaller. Preuve en deux runs : le run 1191 (premier sur `node:22`) a passé `app` (lint, tests, build, 2 min 41) et `sql-tests`, et `backend` est allé jusqu'au `db push` — qui a échoué sur le garde de **B9**, pas sur l'image ; le run suivant (`ea813837`) a passé `backend` de bout en bout, migrations appliquées en production.","pt":"**`node:22` desde 04/09 (`04b5c298`)** — sete ocorrências nos dois workflows. A CLI Supabase é um binário descarregado por `curl`, nada a reinstalar. Prova : o run 1191 passou `app` e `sql-tests`, `backend` chegou ao `db push` (falhou na guarda de B9, não na imagem) ; o run seguinte (`ea813837`) passou `backend` até ao fim."}],["I8","2026-09-04",{"fr":"**Réécrit le 04/09 (`04b5c298`).** L'en-tête de `deploy/README.md` dit désormais ce qui a tourné le 26/08 — trois passes de `bootstrap.sh` (volumes vierges : 183/183 migrations en 12 s, 184 tables, 0 sans RLS, 77 migrations GoTrue ; dump factice ; **dump réel de la production**, objet Storage servi octet pour octet), **huit défauts** trouvés et corrigés (collision du nom de projet Docker, `--wait`, faux vert de l'étape 8, buckets qu'aucune migration ne crée, Storage démarré après la restauration, image Storage `v1.60.4` → `v1.70.7`, disposition des fichiers Storage ≠ sauvegarde), la doctrine d'ordre qui en sort, **huit étapes plus une « 7 bis »** — et ce qui n'a pas tourné (la bascule, le routeur `main` en conditions réelles, un vrai domaine). Les quatre points « à confirmer » ont leur verdict : `notify-cross-library-digest` **clos** (elle est au dépôt), le rejeu des migrations **fait** (étape 5 à deux branches), `CADDY_TAG=2` **justifié** dans `.env.example` (seule entorse au « jamais de `latest` », à épingler le jour de la répétition finale) ; GoTrue/courriel et `PGRST_DB_SCHEMAS` restent marqués à vérifier, honnêtement.","pt":"**Reescrito em 04/09 (`04b5c298`).** O cabeçalho diz o que correu em 26/08 — três passagens de `bootstrap.sh`, oito defeitos corrigidos, oito etapas mais uma «7 bis» — e o que não correu. `notify-cross-library-digest` fechado (está no repositório), rejogo das migrações feito, `CADDY_TAG=2` justificado ; GoTrue/correio e `PGRST_DB_SCHEMAS` continuam a verificar."}],["E8","2026-09-04",{"fr":"**Clos le 04/09 sur mesure consignée — le travail datait du 06/05 (`dba21cd3`).** Avant : deux TTF bloquants, `titre.ttf` 1 Mo + `accent.ttf` 484 Ko, soit **≈ 1,5 Mo** avant tout texte. Après : **19 fichiers woff2 auto-hébergés, 1 296 308 octets en tout** (Bitter + Fira Sans, graphies latine, grecque, cyrillique), chargés à la demande par face et par graphie, **tous en `font-display: swap`** (10 déclarations dans `src/styles/fonts.css`) ; **seuls deux fichiers sont préchargés** au premier rendu (`index.html:47-48`) : `FiraSans-Regular.woff2` 44 904 octets + `Bitter-Regular.woff2` 36 516 octets = **81 420 octets**. Sur une connexion de comptoir, le texte s'affiche avec la police de substitution puis bascule ; rien ne bloque. Le sous-ensemblage (troisième idée du constat) n'a pas lieu d'être : le découpage par graphie fait déjà ce travail. Mesuré dans le dépôt le 04/09.","pt":"**Fechado em 04/09 com a medida registada — o trabalho era de 06/05.** Antes : dois TTF bloqueantes, ≈ 1,5 MB. Depois : 19 woff2 auto-alojados, 1 296 308 bytes no total, por face e por escrita, todos em `font-display: swap` ; só dois pré-carregados no primeiro render : 81 420 bytes. Nada bloqueia."}],["J6","2026-09-04",{"fr":"**Le constat était faux depuis le 17/05 — `DOC-RECENS-1`.** Les cinq doctrines sont **au dépôt depuis la refonte bilingue du README** (`fbe8969b`, 17/05/2026), section « Doctrines internalisées / Internalized doctrines », en français et en anglais, avec quatre autres (traçabilité R8, proposeur silencieux, qui notifier, compte auth en SQL direct). Ce qui manquait tenait en une ligne : **aucun chemin depuis `CONTRIBUTING.md`**. Ajouté le 04/09 (`04b5c298`) dans la table « selon ce que vous touchez » : une RPC qui écrit plusieurs tables, un courriel sortant, l'auth côté front, un script sous Windows → le README. Les incidents d'origine sont dans le code lui-même là où ils existent (`AuthContext.jsx` : la boucle de re-fetch qui saturait le pool ; baseline `paquet 141.2.E`, fix B3 du 16/05).","pt":"**O constato era falso desde 17/05 — `DOC-RECENS-1`.** As cinco doutrinas estão no README (FR/EN) desde `fbe8969b`. Faltava um caminho a partir de `CONTRIBUTING.md` : acrescentado em 04/09 (`04b5c298`) na tabela «conforme o que toca»."}],["I10","2026-09-04",{"fr":"**Clos le 04/09 (`04b5c298`).** `tmp-ficedl/` supprimé du disque (740 Ko, ignoré par git depuis le 28/08). Le secret de fonction `TURNSTILE_SECRET_KEY` — dernière trace hors historique — **retiré** (`supabase secrets unset`, après vérification que les sept mentions restantes dans le code sont des commentaires « remplace Turnstile »). `docs/drafts/` a sa règle, écrite dans `docs/drafts/README.md` : **un sas, pas une réserve** — ce qui y entre en sort dans le mois, promu, tranché par décision ou supprimé ; `archive/` garde la trace. Et le sas est vidé dans le même geste : le brouillon de recherche par accents, **périmé depuis le 03/07** (remplacé par `api.catalog_search_ids_v1`, son en-tête le disait), rejoint `archive/` sous sa date d'entrée. `.env.example` garde une mention historique en commentaire, à dessein.","pt":"**Fechado em 04/09 (`04b5c298`).** `tmp-ficedl/` apagado ; segredo `TURNSTILE_SECRET_KEY` retirado ; `docs/drafts/` tem regra (`README.md` : um sas, não uma reserva — o que entra sai no mês) e foi esvaziado : o rascunho de pesquisa, obsoleto desde 03/07, passou para `archive/`."}],["B9","2026-09-05",{"fr":"**Purgé le 04/09 au soir, par décision de Xavier après relecture** (`6295f256`, migration `20260904223000`, session voisine) : le schéma portait les vingt opérations d'essai de la circulation v2 (mars–avril 2026, deux comptes), pas « zéro ligne » — le constat du 30/08 lisait `pg_stat_user_tables`, remis à zéro par le redémarrage du 02/09. Ma première migration (`04b5c298`) avait refusé la purge et fait tomber le job `backend` ; la version différée (`ea813837`) a passé, puis la purge relue a suivi le soir même. Vérifié le 05/09 : `to_regnamespace('backup_2026_05_07')` est nul. `deploy/bg2-known-tables.txt` n'avait rien à changer (il ne classe que `public`). Six avis « pas de clé primaire » en moins.","pt":"**Purgado em 04/09 à noite, por decisão de Xavier após releitura** (`6295f256`, migração `20260904223000`) : o esquema tinha as vinte operações de ensaio da circulação v2, não «zero linhas» — o constato lia `pg_stat_user_tables`, reposto a zero em 02/09. Verificado em 05/09 : o esquema já não existe."}],["B11","2026-09-05",{"fr":"**Trouvé le 05/09 : c'est le harnais de test de charge, pas une boucle du front.** `scripts/loadtest/anarbib-loadtest.mjs` (versé au dépôt le 17/08, campagne des plafonds de capacité) écrit exprès dans `user_wishlist` — étape `w_wishlist`, `POST /rest/v1/user_wishlist?on_conflict=user_id,book_id` puis retrait — parce que c'est l'une des deux tables sans déclencheur de courriel (le README du harnais le dit : « ne jamais mettre dans le volume une opération qui déclenche un e-mail »). Neuf mille allers-retours pour une ligne survivante, c'est la signature d'une campagne de charge, et le compte de la base ne connaît aucune autre écriture : les six fonctions qui touchent la table sont des fusions, des suppressions et l'export RGPD. **Contre-épreuve** : depuis la remise à zéro des compteurs le 02/09, zéro insertion, zéro suppression, une ligne vivante. La ligne est retirée du constat, comme la fiche le prévoyait.","pt":"**Encontrado em 05/09 : é o arnês de teste de carga, não um laço do front.** `scripts/loadtest/anarbib-loadtest.mjs` (17/08) escreve de propósito em `user_wishlist`, uma das duas tabelas sem gatilho de e-mail. Desde 02/09 : zero escritas. A linha sai do constato."}],["E7","2026-09-05",{"fr":"**Clos le 05/09 (`7434c1b6`) — le constat avait déjà été corrigé le 31/08, il restait à compter.** Compté sur `App.jsx` : 31 routes ; toutes les pages routées portent `useDocumentTitle`, y compris celles servies par `ContaRouter` (compte, compte contributeur·rice, écrans d'attente et de refus) et l'atelier de constitution. Deux manquaient : la **page 404** (définie dans `App.jsx`) et la page d'essai OCR (`/dev/ocr`, jetable). Posées le 05/09 avec deux clés (`pageTitle.notFound`, `pageTitle.ocrDev`) dans les dix locales — 6 395 clés, parité stricte. Le test `documentTitle.test.js` (31/08) couvre le hook ; les 35 fichiers de `src/pages/` sans hook sont des onglets et composants, pas des routes.","pt":"**Fechado em 05/09 (`7434c1b6`).** 31 rotas em `App.jsx`, todas com `useDocumentTitle` salvo duas : a página 404 e a página de ensaio OCR. Postas em 05/09 com duas chaves nas dez locales (6 395 chaves, paridade estrita)."}],["B7","2026-09-05",{"fr":"**Départagés le 05/09 (`7434c1b6`, migration `20260905132602`, suite `homonymes_ingest_public_tests.sql`).** Mesuré en production : tous les appels vivants sont **qualifiés par schéma** et visent `ingest.*` (`fn_import_promote`, `fn_import_set_editorial`, `fn_import_reconcile_duplicates`) — le risque du `search_path` décrit par la fiche n'avait pas de chemin réel. Les trois de `public` n'étaient appelées par **rien** : ni fonction (hors elles-mêmes, en chaîne fermée), ni vue, ni trigger, ni Edge Function, ni fichier du front — et elles étaient `SECURITY DEFINER`, exécutables par `authenticated` : trois entrées de plus au lint 0029 (399 → 396). Supprimées, avec un garde qui refuse si un corps ou une vue cite encore `public.<nom>` ; les versions `ingest` portent leur commentaire. `set_updated_at` reste, comme prévu. Six tests : plus d'homonyme, un seul exemplaire par nom, `ingest.*` DEFINER à `search_path` figé, fermées à `anon` et `authenticated`, appelants qualifiés, aucune citation résiduelle.","pt":"**Desambiguadas em 05/09 (`7434c1b6`, migração `20260905132602`).** Todos os apelos vivos são qualificados e visam `ingest.*` ; as três de `public` não eram chamadas por nada e eram DEFINER executáveis por `authenticated` (lint 0029 : 399 → 396). Suprimidas com guarda ; seis testes."}],[{"fr":"OPAC par œuvre","pt":"OPAC por obra"},"2026-09-05",{"fr":"**Livré les 04-05/09** (`cac464fd` → `06b928ed`, douze migrations `20260904095317` → `20260905154500`, quatre suites SQL, Edge Function `work-titles-autofill`) : une ligne par œuvre à l'OPAC, éditions puis exemplaires par bibliothèque dépliables, titre dans la langue de la lectrice (`work_titles`, pré-traduction « corrige-moi »), rattachement et fusion d'œuvres au catalogage, onglets « Œuvres scindées » et « Volumes » de l'assistant, champ « Tome / volume », titre uniforme dans la langue de l'œuvre. Trente groupes scindés arbitrés à la main et appliqués ; 2 125 notes d'import effacées ; 68 « Assuntos importados » convertis vers des matières existantes. Doctrine au REGISTRE : `OPAC-OEU1..6`, `DEDUP-10`, `THES-4`. Ce qui reste à arbitrer est l'item **C11**.","pt":"**Entregue em 04-05/09** (`cac464fd` → `06b928ed`, doze migrações, quatro suítes SQL, Edge Function `work-titles-autofill`): uma linha por obra no OPAC, edições e exemplares por biblioteca desdobráveis, título na língua da leitora (`work_titles`, pré-tradução «corrija-me»), vínculo e fusão de obras na catalogação, abas «Obras cindidas» e «Volumes» do assistente, campo «Tomo / volume», título uniforme na língua da obra. Doutrina no REGISTRO: `OPAC-OEU1..6`, `DEDUP-10`, `THES-4`. O que resta arbitrar é o item **C11**."}],["H8","2026-09-07",{"fr":"**Clos le 07/09, le jour même du constat** (migration `20260907120000_getrecord_sert_la_notice_demandee`, suite `oai_getrecord_tests.sql` au manifeste). `fn_oai_harvestable_records` appliquait `p_book_id` au comptage et pas aux notices : `GetRecord` servait la première notice de la bibliothèque quel que soit l'identifiant demandé, et une notice pour un identifiant inexistant. La fonction est réécrite **depuis sa définition lue en production** (identique à la migration de juin, vérifié), avec le même prédicat dans les deux requêtes ; grants et liste T10 inchangés. La suite demande la **seconde** notice d'une bibliothèque ouverte à deux notices (T3) et un identifiant inconnu (T4) — la seule forme de test qui voit le défaut, puisque l'essai du 02/09 (H5) portait sur la première notice. Sans effet en production : aucune bibliothèque n'est ouverte au moissonnage, aucune source enregistrée. Reste à faire à la prochaine ouverture réelle : rejouer `GetRecord` sur un identifiant qui n'est pas le premier.","pt":"**Encerrado em 07/09, no mesmo dia do constato** (migração `20260907120000`, suíte `oai_getrecord_tests.sql` no manifesto). `fn_oai_harvestable_records` aplicava `p_book_id` à contagem e não aos registros: `GetRecord` servia o primeiro registro da biblioteca fosse qual fosse o identificador pedido. A função é reescrita **a partir da definição lida na produção**, com o mesmo predicado nas duas consultas; grants e lista T10 inalterados. A suíte pede o **segundo** registro de uma biblioteca aberta com dois registros (T3) e um identificador desconhecido (T4) — a única forma de teste que vê o defeito. Sem efeito na produção: nenhuma biblioteca aberta, nenhuma fonte registrada. Falta, na próxima abertura real: repetir `GetRecord` num identificador que não seja o primeiro."}],["I20","2026-09-07",{"fr":"**Clos le 07/09, le jour même du constat** (migration `20260907123000_l_adresse_des_fonctions_n_est_plus_codee_en_dur`, suite `adresse_des_fonctions_tests.sql`, garde `src/tests/migrations-sans-url-cloud.test.js`, `bootstrap.sh` étape 5 bis + contrôle (g), note dans `.env.example`). Une source de vérité : le réglage de base `anarbib.functions_base_url` (`ALTER DATABASE … SET`, lu à l'ouverture de chaque session par PostgREST, pg_cron et psql), servi par `private.fn_functions_base_url()` — INVOKER, fermé à anon/authenticated — qui se replie sur le projet cloud quand le réglage manque : **la production ne change pas de comportement**. Les douze fonctions (relevé `pg_proc`, toutes à `postgres`) sont réécrites **par motif sur leur définition réelle** au moment de l'application, depuis une liste nominative et fermée (une absente fait échouer la migration) — c'est ce qui permet de repartir de la définition réelle sur douze corps sans les recopier, et le nom de chaque fonction reste trouvable au grep. Le job cron `anarbib-health-probe`, qui portait l'URL dans sa commande même, est replanifié par `cron.schedule` (idempotent par nom). Le vitest n'accepte le littéral `supabase.co/functions/v1/` que dans les huit migrations historiques et celle-ci. `bootstrap.sh` pose le réglage depuis `API_EXTERNAL_URL` **dans les deux modes** (un dump de production ne l'emporte pas) et le vérifie en fin de course dans une session neuve. Non exercé sur une pile réelle : le domaine I est gelé sur la production jusqu'au 14/09 ; c'est le premier contrôle à regarder à la prochaine répétition (I2).","pt":"**Encerrado em 07/09, no mesmo dia do constato** (migração `20260907123000`, suíte `adresse_des_fonctions_tests.sql`, guarda `migrations-sans-url-cloud.test.js`, `bootstrap.sh` etapa 5 bis + controle (g)). Uma fonte de verdade: o ajuste de banco `anarbib.functions_base_url` (`ALTER DATABASE … SET`, lido na abertura de cada sessão), servido por `private.fn_functions_base_url()` — INVOKER, fechado a anon/authenticated — com fallback no projeto cloud quando o ajuste falta: **a produção não muda de comportamento**. As doze funções são reescritas **por padrão sobre a sua definição real** no momento da aplicação, a partir de uma lista nominativa e fechada. O job cron `anarbib-health-probe` é replanejado por `cron.schedule`. O vitest só aceita o literal nas oito migrações históricas e nesta. `bootstrap.sh` põe o ajuste a partir de `API_EXTERNAL_URL` **nos dois modos** e verifica-o no fim. Não exercido numa pilha real: o domínio I está congelado na produção até 14/09; é o primeiro controle a olhar na próxima repetição (I2)."}],["I17","2026-09-07",{"fr":"**Clos le 07/09 sur le constat de l'expérience du §7** (`journal/operations/NOTE_experience-I17-rejeu-fidele_2026-09-07`), pas sur le code. Sur `main` à `c28baac0`, sans la PR #28, image `supabase/postgres:17.6.1.136`, volume vierge : avec A.1 (`anon` retiré du défaut *fonctions* des **deux** rôles dans `01-roles.sh`, entrées vérifiées non vides) et A.2 (migrations sous `postgres`), **310/310 migrations vertes**, dont celles du 29/08, 30/08, 02/09 et 04/09 sans aucun `REVOKE` ni tolérance ajoutés ; 676 fonctions possédées par `postgres` ; **133 fonctions exécutables par `anon`, empreinte MD5 identique à la production** interrogée en lecture seule à la même minute ; `pg_default_acl` sans `anon=` pour les deux rôles, l'entrée `postgres` rétablie par le socle puis refermée par `20260831105114` ; T8-T11 verts. L'option B n'a pas eu à être considérée. Appris en chemin : l'entrypoint traite `initdb.d/*` dans l'ordre du glob, `99-roles.sh` passe **avant** `migrate.sh` (le commentaire de `compose.yml` est faux, `bootstrap.sh` rejoue le script à l'étape 2) ; `cron.job` absent à la 288e, `CREATE EXTENSION pg_cron` sous `postgres` réussit (→ `I19`). Reste **T7** rouge : cinq vues du socle lisibles par `anon` au rejeu, `anon=m` en prod, `REVOKE SELECT` écrit nulle part — versé à `B22`. Le code A.1/A.2 reste à proposer au camarade après la fusion de la #28 (D7). **15/09 : A.1/A.2 sont dans `main`** — repris tels quels par le camarade dans la #28 (`f179f1ff`), mesurés sur sa tête : 133 fonctions `anon`, empreinte identique à la prod.","pt":"**Encerrado em 07/09 sobre o constato da experiência do §7** (`journal/operations/NOTE_experience-I17-rejeu-fidele_2026-09-07`), não sobre o código. Em `main` (`c28baac0`), sem a PR #28, imagem `supabase/postgres:17.6.1.136`, volume virgem: com A.1 (`anon` retirado do padrão de *funções* dos **dois** papéis em `01-roles.sh`, entradas verificadas não vazias) e A.2 (migrações sob `postgres`), **310/310 migrações verdes**, incluindo as de 29/08, 30/08, 02/09 e 04/09 sem nenhum `REVOKE` nem tolerância adicionados; 676 funções de `postgres`; **133 funções executáveis por `anon`, hash MD5 idêntico à produção** consultada em leitura no mesmo minuto; `pg_default_acl` sem `anon=` nos dois papéis; T8-T11 verdes. A opção B não precisou ser considerada. Aprendido: o entrypoint processa `initdb.d/*` na ordem do glob, `99-roles.sh` passa **antes** de `migrate.sh`; `cron.job` ausente na 288ª, `CREATE EXTENSION pg_cron` sob `postgres` funciona (→ `I19`). Resta **T7** vermelho: cinco vistas da base legíveis por `anon` no replay, `anon=m` em produção — levado a `B22`. O código A.1/A.2 fica para propor ao companheiro após a fusão da #28 (D7). **15/09: A.1/A.2 estão em `main`** — retomados tal e qual pelo companheiro na #28 (`f179f1ff`), medidos: 133 funções `anon`, MD5 idêntico à produção."}],["E18","2026-09-07",{"fr":"**Constaté et clos le 07/09 par Xavier, sur `/obra/133` (« L'Homme et la Terre », Reclus)** : six « éditions » strictement identiques à l'écran — « 1905 · Librairie Universelle · Français » six fois, dans l'ordre VI, V, IV, I, III, II. Les données étaient justes (les six notices portent `volume` = I à VI et le sous-titre « Tome N ») : `api.work_public_detail` ne servait pas `volume` et triait par année puis titre, six clés égales. La liste du catalogue, elle, servait déjà le tome par édition avec son badge « Tome N » (`catalog.works.volumeLabel`, dix locales) — la page Œuvre était la seule surface à l'ignorer. Migration `20260907220000_la_page_oeuvre_dit_le_tome` (RPC reprise de sa définition en production : `volume` dans chaque édition, tri année → `fn_volume_rank` → titre, grants conservés), badge « Tome N » dans `WorkPage.jsx` avec la clé existante, suite `oeuvre_tomes_page_tests.sql` au manifeste (trois tomes insérés III, I, II qui doivent sortir I, II, III ; une édition sans tome garde `volume` NULL). Vérifié à l'écran sur `/obra/133` après déploiement. **Second geste le soir même, sur remarque de Xavier** (« c'est pas six éditions, c'est six tomes d'une seule édition ») : l'en-tête disait encore « 6 édition(s) ». Migration `20260907233000` : la RPC sert `edition_count` (une notice sans tome = 1 ; les tomes d'une même année/éditeur/langue = 1) et `volume_count` (tomes distincts, même règle que la liste), l'en-tête compose « 1 édition · 6 volumes » avec les clés plurielles existantes ; T6-T7 ajoutés à la suite.","pt":"**Constatado e encerrado em 07/09 por Xavier, em `/obra/133`** : seis «edições» idênticas na tela, na ordem VI, V, IV, I, III, II. Os dados estavam certos (`volume` = I a VI): `api.work_public_detail` não servia `volume` e ordenava por ano e título. A lista do catálogo já servia o tomo com o seu badge «Tomo N» — a página Obra era a única superfície a ignorá-lo. Migração `20260907220000` (RPC retomada da definição em produção: `volume` em cada edição, ordem ano → `fn_volume_rank` → título, grants conservados), badge em `WorkPage.jsx` com a chave existente, suíte `oeuvre_tomes_page_tests.sql` (três tomos inseridos III, I, II que devem sair I, II, III). Verificado na tela em `/obra/133` após o deploy. **Segundo gesto na mesma noite, por observação de Xavier** («não são seis edições, são seis tomos de uma só edição»): o cabeçalho ainda dizia «6 edição(ões)». Migração `20260907233000`: a RPC serve `edition_count` e `volume_count` (mesma regra que a lista), o cabeçalho compõe «1 edição · 6 volumes»; T6-T7 na suíte."}],["E5","2026-09-07",{"fr":"**Livré et en production le soir même — la dernière exception anti-pistage tombe, et pas par la voie que la fiche proposait.** La fiche voulait un *relais* de `tile.openstreetmap.org` avec cache ; la politique des tuiles d'OSM déconseille les proxys et interdit tout préchargement, et un relais aurait gardé la dépendance. Fait à la place : **un seul fichier PMTiles** (planet Protomaps du 07/09, dérivé d'OpenStreetMap, ODbL) extrait à **z12 = 18 Go** (`pmtiles extract --maxzoom=12`, mesures à vide : z10 3,7 Go, z11 7,9, z13 36, z14 68, z15 138), déposé dans le bucket public **`map-tiles`** (créé en base + migration `20260907234500` inerte ensuite, plafond global Storage monté de 500 Mo à 20 Gio par l'API de gestion, les cinq buckets sans plafond propre figés à leurs 500 Mo de fait) et lu par le navigateur **par requêtes Range** (Storage répond 206 + CORS `*`, vérifié). Rendu dans le Leaflet vendorisé par **`protomaps-leaflet` 4.0.1** (vendorisé, BSD-3, canvas + polices web, pas de serveur de glyphes) via `src/lib/mapTiles.js` ; les trois cartes (`CartographyMap`, `CartographyEditModal`, `CartografiaAjouterPage`) n'ont plus une ligne `L.tileLayer`. Garde CI `src/tests/carte-sans-domaine-tiers.test.js` (aucun `tile.openstreetmap.org` dans `src/`, toute `L.map(` passe par `addBasemap`). `privacy.s6.maptiles` et `federacao.carte.attribution` réécrits dans les dix locales. Recette et rythme de rafraîchissement : `scripts/maptiles/README.md` + `extraire-planet.sh` (mesure par défaut, n'agit que sur demande). **Deux limites écrites** : (1) le fichier est sur le Storage Supabase — la fuite d'IP vers un tiers est close, pas le périmètre Cloud Act, qui tombe avec **I2** (copier le fichier là où Caddy le sert, poser `VITE_MAPTILES_URL`, et compter ces 18 Go dans le disque demandé aux Herbes Folles — **I21**) ; (2) `map-tiles` est volontairement hors du flux storage de **BG2** (reconstructible en 30 min). Étiquettes : `ca` et `eo` absents du fond → noms locaux, sans repli vers une autre langue. Accessoirement : l'échec de juin 2026 dont tout le monde se souvenait comme « les fonds de carte » était **Nominatim** (géocodage, MAP-F), qui reste non configuré. Incident de méthode : la mesure à vide de z15 (177 M d'entrées) lancée en même temps que l'extraction a figé WSL à son plafond de 15 Go — `wsl --shutdown` avec l'accord de Xavier, aucune autre session active, rien perdu ; mesurer seul, ou pas z15.","pt":"**Entregue e em produção na mesma noite — a última exceção antirrastreamento cai, e não pela via que a ficha propunha.** A ficha queria um *relé* de `tile.openstreetmap.org` com cache; a política de ladrilhos do OSM desaconselha proxies e proíbe qualquer pré-carregamento, e um relé manteria a dependência. Feito em vez disso: **um único arquivo PMTiles** (planet Protomaps de 07/09, derivado do OpenStreetMap, ODbL) extraído em **z12 = 18 GB** (medidas a seco: z10 3,7 GB, z11 7,9, z13 36, z14 68, z15 138), depositado no bucket público **`map-tiles`** (criado na base + migração `20260907234500` inerte depois, teto global do Storage subido de 500 MB para 20 GiB pela API de gestão) e lido pelo navegador **por requisições Range** (Storage responde 206 + CORS `*`, verificado). Renderizado no Leaflet vendorizado por **`protomaps-leaflet` 4.0.1** via `src/lib/mapTiles.js`; os três mapas não têm mais nenhuma linha `L.tileLayer`. Guarda CI `src/tests/carte-sans-domaine-tiers.test.js`. `privacy.s6.maptiles` e `federacao.carte.attribution` reescritos nas dez locales. Receita: `scripts/maptiles/README.md`. **Dois limites escritos**: (1) o arquivo está no Storage Supabase — o vazamento de IP para terceiro está fechado, não o perímetro Cloud Act, que cai com **I2** (contar estes 18 GB no disco pedido às Herbes Folles — **I21**); (2) `map-tiles` fica fora do fluxo storage do **BG2**. `ca` e `eo` ausentes do fundo → nomes locais. O fracasso de junho de 2026 lembrado como «os fundos de mapa» era o **Nominatim** (geocodificação), que segue não configurado. Incidente de método: a medida a seco de z15 travou o WSL no teto de 15 GB — `wsl --shutdown` com acordo de Xavier, nada perdido."}],["IMP-20","2026-09-15",{"fr":"**Un lot importé appartient à une bibliothèque de destination — livré et en production le soir même** (registre §17 `IMP-20`, migration `20260915184154`, commit `60e0580a`). Ce n'était pas un item : c'est une question de Xavier du 15/09 — « comment attribuer les 1 673 brouillons du lot Solidaires à cette bibliothèque ? » — dont la réponse honnête était « par un UPDATE à la main, que chaque admin aurait à refaire à chaque admission ». La chaîne d'import ne posait jamais `owner_library_id` ; la publication retombait sur la bibliothèque de qui publie. Fait : `destination_library_id` sur la source (la bibliothèque qui *détient* les livres, distincte de la bibliothèque importatrice), tampon de `owner_library_id` à la promotion selon la provenance, `fn_batch_reassign_library` (administration du réseau : brouillons en cours seulement, fiches publiées intactes, source alignée, trace dans les notes, refus si révision approuvée), `fn_batch_owner_libraries` et la colonne « Bibliothèque » dans Catalogação › Lots (« sans bibliothèque » en ambre avant de publier), bibliothèque de destination optionnelle sur une nouvelle source de dépôt dans Importações, 21 clés en dix locales, suite SQL de 12 tests. **Le lot Solidaires est attribué** (essai à blanc annulé, puis réel sous l'identité de Xavier) ; la fonction a rendu ses deux avertissements — bibliothèque sans série de tombos, inactive — d'où **E21**. Reste derrière **G7** (admission) et la révision de lot.","pt":"**Um lote importado pertence a uma biblioteca de destino — entregue e em produção na mesma noite** (registo §17 `IMP-20`, migração `20260915184154`). Não era um item : era uma pergunta de Xavier de 15/09 — como atribuir os 1 673 rascunhos de Solidaires à sua biblioteca — cuja resposta honesta era « um UPDATE à mão, a refazer a cada admissão ». Feito : `destination_library_id` na fonte, carimbo de `owner_library_id` na promoção, `fn_batch_reassign_library` (administração da rede), coluna « Biblioteca » nos lotes, 21 chaves em dez locales, suite SQL de 12 testes. **O lote Solidaires está atribuído** ; os avisos (sem série de tombos, inativa) dão **E21**. Continua atrás de **G7** e da revisão do lote."}],["I19","2026-09-15",{"fr":"**Clos le 15/09, sur mesure.** *(1)* L'extension : `deploy/init-db/01-roles.sh` crée `pg_cron` (`CREATE EXTENSION IF NOT EXISTS` + `GRANT` à `postgres` et `service_role`) et **s'arrête** si ça échoue ; au premier passage de l'entrypoint, où le rôle `postgres` n'existe pas encore, il le dit (« différé au prochain passage ») et le rejeu par `bootstrap.sh` (étape 2) fait le travail — livré par la PR #28 du camarade (`f179f1ff`), garde `to_regnamespace('cron')` sortie de `20260904130100`. *(2)* Le contrôle de santé : `deploy.sh --controle` vérifie que l'extension existe puis **rejoue `tests/sql/crons_planifies_tests.sql` sur le vrai `cron.job` de l'instance** — la même liste nommée que la CI, sans copie (DOC-RECENS-1) ; ✓ « N jobs planifiés — OK : n/n » sinon ⚠ et code de retour 1. Éprouvé sur pile vierge le 15/09 : 38 jobs, suite verte ; un job retiré à la main → ⚠ et rc 1 ; extension supprimée → ⚠ « extension ABSENTE » et rc 1. Reste hors item : la suite dit ce que le dépôt planifie, pas ce que la prod fait — relevé prod à refaire de temps en temps (38 au 15/09, mêmes noms).","pt":"**Encerrado em 15/09, sobre medição.** *(1)* `01-roles.sh` cria `pg_cron` e **para** se falhar; na primeira passagem do entrypoint diz que adia (PR #28, `f179f1ff`). *(2)* `deploy.sh --controle` verifica a extensão e **reproduz `tests/sql/crons_planifies_tests.sql` no `cron.job` real** — a mesma lista da CI, sem cópia; ✓ ou ⚠ com código de retorno 1. Provado em pilha virgem: 38 jobs, suíte verde; job removido → ⚠ rc 1; extensão removida → ⚠ rc 1."}],["E21","2026-09-15",{"fr":"**La série de numéros d'inventaire et la cote d'une bibliothèque se règlent depuis l'écran ; un lot reçoit ses cotes et ses classes de rangement en un geste — livré et en production le soir même** (registre §12 `CAT-E17`, migration `20260915201252`, commit `f7bf927c`). Ouvert et clos le même jour, sur la question de Xavier « comment font-ils pour s'y retrouver avec des numéros d'inventaire dans l'ordre d'apparition ? ». Trois gestes, dans le patron proposé pour les numéros d'inventaire — une convention, un aperçu, une application, une trace : **(1)** bloc « Numérotation » dans Biblioteca › Identité et, pour l'admin, sous chaque bibliothèque de la page Réseau — préfixe, année, séparateur, remplissage, cote, exemple rendu en direct, prochain et dernier numéro ; gardes serveur : préfixe obligatoire sans `%` ni `_`, **unique dans le réseau** (préfixes déclarés et séries héritées des exemplaires, « SOL » et « SOL- » refusés l'un pour l'autre), **figé** dès qu'un exemplaire l'a utilisé ; **(2)** « Cotes manquantes » sur un lot ouvert : aperçu puis application, dans l'ordre du lot, à la suite des cotes existantes (notices, holdings, brouillons vivants), sous verrou par préfixe ; **(3)** « Classer par rubriques » : la rubrique lue là où l'import l'a laissée — pour Solidaires, `assunto_local` de la charge utile brute, puisque le run 29 n'a lié aucun sujet —, table rubrique → code relue par la coordination, `cdd` écrit sur les brouillons sans classe. Suite SQL de 14 tests, 101 suites vertes, 486 tests JS, 57 clés en dix locales. **Reste aux personnes** : choisir le préfixe de Solidaires (Réseau › Numérotation), attribuer les 1 673 cotes, remplir la table des 35 rubriques, activer la bibliothèque, puis la révision du lot (`catalog_batch_reviews`).","pt":"**A série de tombos e a cota de uma biblioteca configuram-se no ecrã ; um lote recebe as suas cotas e as suas classes de arrumação num só gesto — entregue e em produção na mesma noite** (registo §12 `CAT-E17`, migração `20260915201252`). Três gestos, no padrão proposto para os tombos — convenção, pré-visualização, aplicação, rasto : bloco « Numeração » (Biblioteca e Rede ; prefixo único na rede, congelado após uso), « Cotas em falta » num lote (na ordem do lote, a seguir às existentes), « Classificar por rubricas » (rubrica lida onde a importação a deixou — `assunto_local` para Solidaires —, tabela rubrica → código relida pela coordenação). 14 testes SQL, 101 suites verdes. **Fica às pessoas** : o prefixo de Solidaires, as 1 673 cotas, a tabela das 35 rubricas, a ativação, depois a revisão do lote."}],["G7","2026-09-15",{"fr":"**Solidaires est admise** — décision de Xavier du 15/09/2026 au soir, en mode « seul·e admin » (spec-onboarding §2.6), à défaut de co-administrateur·rices trouvé·es à Bologne (registre §1 `RES-D12` amendé, v0.34). Ce que la fiche attendait de l'admission est arrivé le même soir par `IMP-20` et `CAT-E17` : bibliothèque active, série d'inventaire `SOL-` + millésime, 1 673 brouillons attribués et cotés, coordination Christian. Le périmètre d'admission (`RES-Q13`) reste à porter en AG : Solidaires y entre comme cas, pas comme règle.","pt":"**Solidaires está admitida** — decisão de Xavier em 15/09/2026, em modo « só admin », à falta de co-administradores encontrados em Bolonha (registo `RES-D12` alterado, v0.34). Biblioteca ativa, série de tombo `SOL-`, 1 673 rascunhos atribuídos e cotados. O perímetro de admissão (`RES-Q13`) continua para a AG."}],["B19","2026-09-16",{"fr":"**La HS256 est révoquée** — geste de Xavier le 15/09 à 22 h 14 (20 h 14 UTC), Settings → JWT Keys → Revoke. **Premier contrôle, 24 h après** (tâche `anarbib-trafic-cles-legacy`, relevé du 16/09) : aucun 401 sur une connexion utilisateur — 1 144 réponses 200, 20 en 204, 12 en 206, tous les jetons de session en ES256 avant comme après ; recoupé sur les logs edge : 0 × 401 sur `/rest/v1/` en 24 h hors les quatre de bingbot du 16/09 à 15 h 19 (robot sans clé, ni ancienne ni nouvelle). Seul reste en HS256 le compte `supabase_admin` de `@supabase-infra/mgmt-api` sur `/admin/v1/network-bans/retrieve`, toujours en 200 — l'infrastructure de Supabase, pas l'application. Les trois anomalies vues au passage ne viennent pas de la révocation et ont chacune leur cause : les `403` sur `DELETE auth_rate_limits` (**B25**, depuis mai), les `400` sur `GET gazette_submissions` du 15/09 à 21 h 09–21 h 11 UTC (le front de GAZ-9 publié par le job `app` quelques minutes **avant** que le job `backend` applique la migration qui ajoute `staff_edited_at`/`original_*` — l'ordre normal de la CI, transitoire), et les `400` sur `POST auth_rate_limits` (**B26**). **Les quatre parcours (connexion, inscription, récupération du mot de passe, document numérique) ont été testés par Xavier le 16/09 : ils fonctionnent.** La tâche `anarbib-trafic-cles-legacy` a été supprimée le même jour.","pt":"**A HS256 está revogada** — gesto de Xavier em 15/09 às 22h14 (20h14 UTC), Settings → JWT Keys → Revoke. **Primeiro controlo, 24 h depois** (tarefa `anarbib-trafic-cles-legacy`, levantamento de 16/09): nenhum 401 numa conexão de usuário — 1 144 respostas 200, 20 em 204, 12 em 206, todos os tokens de sessão em ES256 antes como depois; cruzado com os logs edge: 0 × 401 em `/rest/v1/` em 24 h fora os quatro do bingbot de 16/09 às 15h19 (robô sem chave, nem antiga nem nova). Só resta em HS256 a conta `supabase_admin` de `@supabase-infra/mgmt-api` em `/admin/v1/network-bans/retrieve`, sempre em 200 — a infraestrutura da Supabase, não a aplicação. As três anomalias vistas de passagem não vêm da revogação e têm cada uma a sua causa: os `403` em `DELETE auth_rate_limits` (**B25**, desde maio), os `400` em `GET gazette_submissions` de 15/09 às 21h09–21h11 UTC (o front de GAZ-9 publicado pelo job `app` alguns minutos **antes** de o job `backend` aplicar a migração que acrescenta `staff_edited_at`/`original_*` — a ordem normal da CI, transitório) e os `400` em `POST auth_rate_limits` (**B26**). **Os quatro percursos (conexão, inscrição, recuperação de senha, documento digital) foram testados por Xavier em 16/09: funcionam.** A tarefa `anarbib-trafic-cles-legacy` foi apagada no mesmo dia."}],["B25","2026-09-16",{"fr":"**Livré le 16/09 au soir** (`af60bc49`, Edge Function `login` redéployée par la CI à 22 h 27, marqueur `deployed-functions` sur ce commit). Deux clients : celui de la clé secrète ne se connecte jamais (il lit, écrit et supprime les compteurs), un second, créé pour `signInWithPassword` seul, porte la session de la personne — le `DELETE` de `clearFailures` repart en `service_role`. Les clés sont des empreintes `sha256Hex` (IP, courriel en minuscules) : plus d'adresse ni de courriel dans la table, ni dans la query string du `DELETE` que traversent les journaux edge. Chaque erreur du magasin est journalisée ; un compteur illisible ferme (500). Banc `login-compteurs-haches` (6 tests : client à part, empreintes partout, `42501` journalisé, porte fermée). **Vérifié en production** : `auth_rate_limits` purgée (52 lignes brutes → 0), contrainte `auth_rate_limits_key_empreinte` posée. Reste à voir passer la première connexion réelle : un `DELETE` en 204 dans les logs edge, plus aucun `42501` dans `postgres_logs`.","pt":"**Entregue em 16/09 à noite** (`af60bc49`, Edge Function `login` reimplantada pela CI às 22h27). Dois clientes: o da chave secreta nunca se conecta (lê, escreve e apaga os contadores), um segundo, criado só para `signInWithPassword`, leva a sessão da pessoa — o `DELETE` de `clearFailures` volta a partir em `service_role`. As chaves são impressões `sha256Hex` (IP, e-mail em minúsculas): mais nenhum endereço nem e-mail na tabela, nem na query string do `DELETE` que atravessa os registos edge. Cada erro do armazém é registado; um contador ilegível fecha (500). Bancada `login-compteurs-haches` (6 testes). **Verificado em produção**: `auth_rate_limits` purgada (52 linhas em claro → 0), restrição `auth_rate_limits_key_empreinte` posta. Falta ver passar a primeira conexão real: um `DELETE` em 204 nos registos edge, mais nenhum `42501` em `postgres_logs`."}],["B26","2026-09-16",{"fr":"**Livré le 16/09 au soir** (`af60bc49`, migration `20260916201249` appliquée par la CI : prod 321 = dépôt 321). `_shared/core/rate-limit.ts` remplace le `hit()` copié trois fois : fenêtre fixe qui repart de 1 (l'ancien, une fois la limite atteinte, re-bloquait à chaque frappe — pour toujours), clé obligatoirement une empreinte, **échec fermé** (`frapper` lève, `freiner` répond 500 `rate_limit_unavailable`). `geocode`, `submit-cartography-entry` et `submit-gazette-contribution` l'utilisent ; `gazette_email` est haché. **Vérifié en production** : la `CHECK` de `kind` liste les sept kinds réels (`ip`, `email`, `geocode_ip`, `carto_ip`, `gazette_ip`, `gazette_email`, `gazette_prefill`), une seconde `CHECK` exige une empreinte de 64 hexadécimaux, la table est vide (lignes brutes purgées). Suite `compteurs_d_abus_tests` (4 tests, en CI) et banc `compteurs-d-abus-partages` (7 tests) ; 509 tests JS verts. Première ligne `geocode_ip` ou `gazette_ip` à voir apparaître au premier usage réel.","pt":"**Entregue em 16/09 à noite** (`af60bc49`, migração `20260916201249` aplicada pela CI: prod 321 = repositório 321). `_shared/core/rate-limit.ts` substitui o `hit()` copiado três vezes: janela fixa que recomeça em 1, chave obrigatoriamente uma impressão, **falha fechada** (`frapper` lança, `freiner` responde 500). `geocode`, `submit-cartography-entry` e `submit-gazette-contribution` usam-no; `gazette_email` passa por hash. **Verificado em produção**: a `CHECK` de `kind` lista os sete kinds reais, uma segunda `CHECK` exige uma impressão de 64 hexadecimais, a tabela está vazia (linhas em claro purgadas). Suíte `compteurs_d_abus_tests` (4 testes, na CI) e bancada `compteurs-d-abus-partages` (7 testes); 509 testes JS verdes."}],["F9","2026-09-16",{"fr":"**Relevé le 16/09/2026 à 22 h 30 (UTC+2), depuis le poste (`nslookup`)** — les trois enregistrements existent. **SPF** : `send.notifications.anarbib.org` TXT `v=spf1 include:amazonses.com ~all` (Resend envoie depuis le sous-domaine `send.`, c'est là que vit le SPF ; `notifications.anarbib.org` lui-même n'a pas de TXT, ce qui est attendu), MX `10 feedback-smtp.eu-west-1.amazonses.com`. **DKIM** : `resend._domainkey.notifications.anarbib.org` TXT `p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC5Uxzm…` (clé RSA publiée, sélecteur `resend`). **DMARC** : `_dmarc.notifications.anarbib.org` TXT `v=DMARC1; p=none; rua=mailto:admins@anarbib.org` — politique d'observation avec rapports vers les admins, la forme prudente que l'item demandait avant de durcir. Rien à poser ; durcir vers `p=quarantine` est une décision à part, après lecture des rapports `rua`.","pt":"**Levantado em 16/09/2026 às 22h30 (UTC+2), a partir do posto (`nslookup`)** — os três registos existem. **SPF**: `send.notifications.anarbib.org` TXT `v=spf1 include:amazonses.com ~all` (a Resend envia a partir do subdomínio `send.`, é lá que vive o SPF), MX `10 feedback-smtp.eu-west-1.amazonses.com`. **DKIM**: `resend._domainkey.notifications.anarbib.org` TXT `p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC5Uxzm…` (chave RSA publicada, seletor `resend`). **DMARC**: `_dmarc.notifications.anarbib.org` TXT `v=DMARC1; p=none; rua=mailto:admins@anarbib.org` — política de observação com relatórios para as admins, a forma prudente que o item pedia antes de endurecer. Nada a pôr; endurecer para `p=quarantine` é uma decisão à parte, depois de ler os relatórios `rua`."}],["I6","2026-09-16",{"fr":"**Prouvé le 16/09/2026, à la date que l'item fixait.** `service_health_probes` : 34 568 lignes, la plus ancienne du **17/08 à 20 h 30 UTC**, la plus récente du 16/09 à 20 h 25 — et **zéro ligne de plus de trente jours**. La borne basse a avancé de trente jours en trente jours : la purge intégrée à `health-probe` supprime pour de vrai (le compteur `n_tup_del` de `pg_stat`, remis à zéro le 02/09, ne pouvait pas le dire ; le comptage direct le dit). `service_health_incidents` n'est pas touchée. Aucun cron à ajouter.","pt":"**Provado em 16/09/2026, na data que o item fixava.** `service_health_probes`: 34 568 linhas, a mais antiga de **17/08 às 20h30 UTC**, a mais recente de 16/09 às 20h25 — e **zero linhas com mais de trinta dias**. O limite inferior avançou trinta dias em trinta dias: a purga integrada em `health-probe` apaga de verdade (o contador `n_tup_del` do `pg_stat`, reposto a zero em 02/09, não podia dizê-lo; a contagem direta diz). `service_health_incidents` não é tocada. Nenhum cron a acrescentar."}],["A2","2026-09-16",{"fr":"**Clos le 16/09/2026, décision de Xavier.** La reconstruction par quelqu'un d'autre que le mainteneur a eu lieu : **un camarade de l'ASR** (compte `ASR2026`, première contribution extérieure) a monté la pile chez lui depuis le dépôt seul, en a écrit l'installateur (`install.sh`, PR #28, **fusionnée le 15/09** — `f179f1ff`) et consigné ce qui cassait dans ses commits (`pg_cron` absent au démarrage, schéma à initialiser sous `supabase_admin`, `GRANT` sur `supabase_migrations`, `LANG_CODE`, port 5173…), puis le mainteneur a relu et fusionné **depuis cette installation** — ses forks partent d'un AnarBib qui tourne chez lui. Les écarts structurels trouvés en chemin ont leurs notes (`CONSTAT_PR28_rejeu_vs_production_revoke_anon_2026-09-06`, `NOTE_experience-I17-rejeu-fidele_2026-09-07`, `DOC-GRANT-2/3`). Ce que la fiche voulait en plus — le journal d'exécution comme section de `deploy/README.md` — est posé le 16/09 (§ « Première reconstruction extérieure »). L'entrée 1 de `CHANTIERS_OUVERTS` reste à réécrire par le mainteneur : **J4**.","pt":"**Encerrado em 16/09/2026, decisão de Xavier.** A reconstrução por alguém que não o mantenedor aconteceu: **um companheiro da ASR** (conta `ASR2026`, primeira contribuição exterior) montou a pilha em casa a partir do repositório só, escreveu-lhe o instalador (`install.sh`, PR #28, **fundida em 15/09** — `f179f1ff`) e registou o que quebrava nos seus commits (`pg_cron` ausente no arranque, esquema a inicializar sob `supabase_admin`, `GRANT` em `supabase_migrations`, `LANG_CODE`, porta 5173…), depois o mantenedor releu e fundiu **a partir dessa instalação**. Os desvios estruturais encontrados têm as suas notas (`CONSTAT_PR28…`, `NOTE_experience-I17…`, `DOC-GRANT-2/3`). O diário de execução como secção de `deploy/README.md` é posto em 16/09. A entrada 1 de `CHANTIERS_OUVERTS` fica a reescrever pelo mantenedor: **J4**."}],["B22","2026-09-16",{"fr":"**Clos le 16/09, sur mesure.** Relevé prod du jour : 133 fonctions exécutables par `anon` (public, api, ingest, private), 47 sans `GRANT … TO anon/PUBLIC` écrit — le compte du 07/09. Appelants cherchés avant tout REVOKE (vues et leur `security_invoker`, policies, corps + `prosecdef`, triggers, expressions d'index, défauts générés). Migration `20260916223000_b22_ouvertures_a_anon_ecrites` : **4 ouvertures qui servent, écrites** (`private.fn_book_work_id` lue par les vues invoker du catalogue anonyme ; `fn_book_restricted_pdf_state*` : page publique du livre et EF read-pdf ; `fn_volume_rank` : `api.catalog_works_v1`/`work_public_detail`) ; **43 fermées** (10 RPC de circulation + 2 à ACL nulle, 17 d'ingest avec `authenticated` gardé pour les 3 lues par les vues invoker de l'import et les 2 en expression d'index, 5 triggers/helpers des périodiques + `fn_serial_issue_key`, 4 helpers, 3 `fn_assert_*`, et deux DEFINER de T10 qui changent de camp) ; **5 vues de T7** : `REVOKE SELECT` écrit. `grants_herites_tests.sql` : T10 à 26, **T12 = liste fermée des 90 fonctions exécutables par anon**, dans les deux sens. Déployé par la CI (`21a98d0e`) ; **mesuré en prod à 22 h 40 : 90 fonctions, 30 DEFINER, empreinte `1852f6b2…` identique au rejeu sur image, lint 0028 = 26** (0029 = 420, hors item). Règle désormais : une fonction que anon doit appeler = un GRANT écrit dans sa migration ET une ligne dans T12, sinon T12 rougit. Hors item : `private.fn_book_work_id` reste DEFINER exposée à anon par deux vues invoker (voulu, catalogue public) — hors `public`/`api`, le lint 0028 ne la compte pas.","pt":"**Encerrado em 16/09, sobre medição.** 133 funções executáveis por `anon`, 47 sem GRANT escrito. Chamadores procurados antes de qualquer REVOKE. Migração `20260916223000`: 4 aberturas que servem, escritas; 43 fechadas; 5 vistas de T7 com `REVOKE SELECT` escrito. T10 a 26, **T12 = lista fechada das 90 funções executáveis por anon**. Implantado pela CI (`21a98d0e`); **medido em prod: 90 funções, 30 DEFINER, MD5 idêntico ao replay, lint 0028 = 26**. Regra: função que anon deve chamar = GRANT escrito na migração E linha em T12."}],["E12","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — les trois lots étaient livrés depuis le 02/09 (bandeau du jour : « page Importations restructurée, lots A-C : deux onglets, export trié, plus un code brut ») et la page porte ses onglets (`importacoes.tab.history`, `.reception`, `.rss`) ; l'item était resté « en cours » faute de clôture, pas faute de livraison. Constat corrigé le 16/09.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — os três lotes estavam entregues desde 02/09 (página Importações reestruturada, lotes A-C: dois separadores, exportação ordenada, sem código bruto) e a página tem os seus separadores; o item ficara « em curso » por falta de fecho, não de entrega."}],["C2","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — le fonds Solidaires **est passé par l'outil d'import du dépôt** (source 17, run 29, lot 63 : 1 673 brouillons), pas par des `INSERT` ; l'admission a été prononcée avant de toucher au lot pour de bon (G7, 15/09 — la fiche voulait « à plusieurs », c'est le mode « seul·e admin » de `RES-D12` qui s'est appliqué, faute de co-admins) ; la clé `assunto_local_sugerido` est présente dans la charge brute des 1 673 brouillons (mesuré le 20/09) — que les corrections d'accents y vivent, et qu'aucune n'ait été faite en silence ailleurs, **n'a pas été vérifié** : à regarder dans la révision du lot. Ce qui a cassé est consigné : `library_without_tombo_pattern` → E21, 91 fascicules et 87 monographies suspectes → **D3**, aucun sujet lié par le run → rubriques (E21). La relecture d'un échantillon se fait dans la révision du lot (`fn_batch_review_report`, rapport admin obligatoire avant `publish_catalog_batch(63)`) : elle n'a pas besoin d'un item à part.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — o fundo Solidaires **passou pela ferramenta de importação do repositório** (fonte 17, run 29, lote 63: 1 673 rascunhos), não por `INSERT`; a admissão foi pronunciada antes de tocar no lote de verdade (G7, 15/09, modo « só admin » de `RES-D12`); a chave `assunto_local_sugerido` está presente na carga bruta dos 1 673 rascunhos (medido em 20/09) — que as correções de acentos lá vivam, e que nenhuma tenha sido feita em silêncio noutro lado, **não foi verificado**: a ver na revisão do lote. O que quebrou está registado: `library_without_tombo_pattern` → E21, 91 fascículos e 87 monografias suspeitas → **D3**, nenhum assunto ligado pelo run → rubricas (E21). A releitura de uma amostra faz-se na revisão do lote (`fn_batch_review_report`, relatório admin obrigatório antes de `publish_catalog_batch(63)`)."}],["K5","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »).** **Rectifié le 20/09/2026** : la première rédaction de cette ligne affirmait des faits que la session qui l'a écrite n'avait pas sous les yeux. Ce qui est établi : l'échéance de Bologne (13/09) est passée, et la suite technique est ouverte à part (H10-H13 ; K9 clos sans objet). Ce qui **n'est attesté par aucune pièce lue** : que l'intervention a eu lieu et que l'appel a été porté, et la liste des contacts pris avec ce que chacun a proposé — la note mémoire de Bologne date du 20/08 et ne dit rien du 13/09, aucun fichier du journal n'est daté des 12-14/09. Les « notes de session du 13-14/09 » citées d'abord n'existent pas ; « CIRA incertain » était périmé (bibliothèque retirée le 31/08). La clôture repose sur la décision de Xavier, qui y était ; le compte rendu reste à verser par lui s'il veut que la ligne dise ce qui s'est passé. Sur l'accessibilité, E1 reste.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »).** **Retificado em 20/09/2026**: a primeira redação desta linha afirmava factos que a sessão que a escreveu não tinha à vista. O que está estabelecido: o prazo de Bolonha (13/09) passou, e a sequência técnica está aberta à parte (H10-H13; K9 fechado sem objeto). O que **não é atestado por nenhuma peça lida**: que a intervenção aconteceu e que o apelo foi levado, e a lista dos contactos com o que cada um propôs — a nota de memória de Bolonha é de 20/08 e nada diz de 13/09, nenhum ficheiro do diário tem data de 12-14/09. As « notas de sessão de 13-14/09 » citadas primeiro não existem; « CIRA incerto » estava ultrapassado (biblioteca retirada em 31/08). O fecho assenta na decisão de Xavier, que lá esteve. Sobre a acessibilidade, E1 fica."}],["K6","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »).** **Rectifié le 20/09/2026** : la première rédaction de cette ligne affirmait des faits que la session qui l'a écrite n'avait pas sous les yeux. Ce qui est établi : des fichiers de travail existent sur le disque `F:` dans un dossier nommé « Rencontre Leftove.rs », et l'esquisse SKOS du thésaurus a été régénérée le 09/09 **sur les réponses de la FICEDL du 07/09** (H13 la verse au dépôt) — pas « avec » leftove.rs, comme il avait été écrit. Ce qui **n'est attesté par aucune pièce lue** : que la rencontre s'est tenue, que les trois questions ont reçu une réponse, et que le point licence (CC BY-NC-SA) a été regardé avant — les seules traces « leftove » du dépôt datent des 26-27/08. La clôture repose sur la décision de Xavier ; le sujet de la numérisation et de NORLA reste ouvert dans H6/G8.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »).** **Retificado em 20/09/2026**: a primeira redação desta linha afirmava factos que a sessão que a escreveu não tinha à vista. O que está estabelecido: existem ficheiros de trabalho no disco `F:` numa pasta chamada « Rencontre Leftove.rs », e o esboço SKOS do tesauro foi regenerado em 09/09 **sobre as respostas da FICEDL de 07/09** (H13 leva-o ao repositório) — não « com » leftove.rs, como fora escrito. O que **não é atestado por nenhuma peça lida**: que o encontro se realizou, que as três perguntas tiveram resposta, e que o ponto da licença (CC BY-NC-SA) foi visto antes — os únicos vestígios « leftove » do repositório são de 26-27/08. O fecho assenta na decisão de Xavier; a digitalização e a NORLA ficam abertas em H6/G8."}],["K9","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — **sans objet** : les quatre textes de Bologne ont servi le 13/09 ; corriger des chiffres dans un dossier d'intervention passé n'a plus de destinataire. Les chiffres vivants (623 descripteurs au 03/09, 138 rattachés sur 148, la question `guerres`/`art : courants`) sont ceux de H10-H13, qui restent ouverts.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — **sem objeto**: os quatro textos de Bolonha serviram em 13/09; corrigir números num dossiê de intervenção passado já não tem destinatário. Os números vivos são os de H10-H13, que ficam abertos."}],["I12","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — l'automatisation est faite et prouvée depuis le 05/09 (minuteur systemd utilisateur, 18 h 02 chaque jour, passages lus dans `journalctl --user`, +32 commits le 04/09). Ce qui restait — donner un destinataire au `die` du script et écrire la date du dernier rafraîchissement dans le témoin — est **le même problème que I24** (une alerte qui ne survit pas au poste) : il y est versé, pour être réglé une seule fois avec le flux `storage`.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — a automatização está feita e provada desde 05/09 (timer systemd de utilizador, 18h02 cada dia, passagens lidas em `journalctl --user`). O que restava — dar um destinatário ao `die` do script e escrever a data no testemunho — é **o mesmo problema que I24**: é lá vertido, para ser resolvido uma só vez com o fluxo `storage`."}],["I13","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — mesuré le 16/09 : le site est servi par git-pages, une route inconnue (`/une-route-qui-n-existe-pas`) rend **200 `text/html`** ; `public/_redirects` existe, `public/.domains` n'existe plus, la branche `pages` n'existe plus sur Codeberg, `public/CNAME` est gardé pour le miroir GitHub. Le nettoyage des secrets Forgejo devenus inutiles est un geste de Xavier dans les réglages de la forge, hors dépôt — il n'a pas besoin d'un item. Les incertitudes assumées (réversibilité, limites non publiées) restent vraies et n'ont pas mordu depuis le 21/08.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — medido em 16/09: o site é servido por git-pages, uma rota desconhecida devolve **200 `text/html`**; `public/_redirects` existe, `public/.domains` já não existe, o ramo `pages` já não existe na Codeberg, `public/CNAME` mantido para o espelho GitHub. A limpeza dos segredos Forgejo tornados inúteis é um gesto de Xavier nos ajustes da forja, fora do repositório."}],["I1","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — `deploy/.env.example` porte `GOTRUE_TAG=v2.192.0` avec la règle « image ≥ production » et l'historique de la montée (v2.189.0 → v2.192.0 le 20/08) ; les passes du 26/08 ont mesuré **77 migrations GoTrue = la production exactement** ; la PR #28 a rejoué la pile sur cette image. Le troisième « fini quand » (lister les douze dernières versions de production) est levé : la mesure directe vaut mieux que la liste.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — `deploy/.env.example` tem `GOTRUE_TAG=v2.192.0` com a regra « imagem ≥ produção » e o histórico; as passagens de 26/08 mediram **77 migrações GoTrue = a produção exatamente**; a PR #28 reproduziu a pilha nessa imagem. O terceiro « acabado quando » é levantado: a medida direta vale mais do que a lista."}],["G11","2026-09-16",{"fr":"**Clos le 16/09/2026 sur décision de Xavier (« clos tout ce qui peut l'être à bon droit »)** — la règle d'amorçage est **actée au registre** : `GOUV-19`, « ✅ tranché 06/09 (Xavier, Q1 : A + B + C + D′) » — amorçage unique hors circuit, refusé dès qu'un admin actif existe ; mot de passe aléatoire dans tous les modes, affiché une fois ; premier compte = coordination de la première bibliothèque **et** admin réseau ; bibliothèque `demo` créée si la table est vide. `deploy/scripts/seed-admin.mjs` (PR #28, fusionnée le 15/09) applique les quatre (`crypto.randomBytes` en tout mode, rôles `coordenador` + `librarian` + ligne `network_administrators`, refus si un admin existe), et `deploy/README.md` § « Compte administrateur initial » le présente comme l'amorçage d'une base vierge. Constat corrigé : la fiche disait « à écrire », c'était écrit.","pt":"**Encerrado em 16/09/2026 por decisão de Xavier (« fecha tudo o que pode sê-lo com razão »)** — a regra de arranque está **registada**: `GOUV-19`, « ✅ decidido 06/09 (Xavier, Q1: A + B + C + D′) » — arranque único fora do circuito, recusado assim que exista um admin ativo; palavra-passe aleatória em todos os modos, mostrada uma vez; primeira conta = coordenação da primeira biblioteca **e** admin de rede; biblioteca `demo` criada se a tabela estiver vazia. `deploy/scripts/seed-admin.mjs` (PR #28) aplica as quatro, e `deploy/README.md` apresenta-o como o arranque de uma base virgem."}],["J3","2026-09-17",{"fr":" *(second item portant l'identifiant J3 — celui de la PR #28, 06/09 ; le premier est clos plus haut)* **Clos le 17/09/2026 sur les faits, décision de Xavier du 16/09 (« clos tout ce qui peut l'être à bon droit ») ; signalé par la session voisine le 16/09 au soir.** La PR pages #2 (guide d'auto-hébergement du site vitrine, dix langues) est **fusionnée le 16/09 à 22 h 00** (API Codeberg : `merged: true`), après la PR #28 (15/09) comme la fiche l'exigeait ; les quatre phrases sont corrigées et l'avertissement posé ; la relecture D4 (la simulation en option 3, jamais en option 1) est prise, et `install.sh` ne promet plus que Resend (`035853eb`, 16/09 23 h 12 : SMTP et simulation annoncés « à venir », rien de silencieux).","pt":" *(segundo item com o identificador J3 — o da PR #28, 06/09; o primeiro está fechado mais acima)* **Encerrado em 17/09/2026 sobre os factos, decisão de Xavier de 16/09; assinalado pela sessão vizinha em 16/09 à noite.** A PR pages #2 (guia de auto-hospedagem do site vitrine, dez línguas) está **fundida em 16/09 às 22h00** (API Codeberg: `merged: true`), depois da PR #28 (15/09) como a ficha exigia; as quatro frases estão corrigidas e o aviso posto; a releitura D4 foi tomada, e `install.sh` já só promete a Resend (`035853eb`)."}],["A4","2026-09-17",{"fr":" *(second item portant l'identifiant A4 — celui de la PR #28, 06/09 ; le premier est clos plus haut)* **Clos le 17/09/2026 sur les faits, décision de Xavier du 16/09 (« clos tout ce qui peut l'être à bon droit ») ; signalé par la session voisine le 16/09 au soir.** `CONTRIBUTING.md` porte les trois règles (une PR = un sujet ; le code de production dans une PR à part ; des commits, jamais de réécriture pendant la relecture) et la promesse du mainteneur (un premier retour sous une semaine), en français (§ « Le rythme du travail ») et en anglais (§ « Working rhythm ») ; `DOC-CONTRIB-1` au registre. La PR #28 a été **scindée selon ces règles** (installateur dans #28, code applicatif dans #29, guide vitrine dans pages #2) puis fusionnée le 15/09 en connaissance de cause. L'exigence d'une version portugaise est levée : le fichier est bilingue FR/EN par construction, comme le README.","pt":" *(segundo item com o identificador A4 — o da PR #28, 06/09; o primeiro está fechado mais acima)* **Encerrado em 17/09/2026 sobre os factos, decisão de Xavier de 16/09; assinalado pela sessão vizinha em 16/09 à noite.** `CONTRIBUTING.md` tem as três regras e a promessa do mantenedor, em francês e em inglês; `DOC-CONTRIB-1` no registo. A PR #28 foi **dividida segundo estas regras** (instalador em #28, código aplicativo em #29, guia vitrine em pages #2) e fundida em 15/09 com conhecimento de causa. A exigência de uma versão portuguesa é levantada: o ficheiro é bilingue FR/EN por construção."}],["I16","2026-09-17",{"fr":" *(second item portant l'identifiant I16 — celui de la PR #28, 06/09 ; le premier est clos plus haut)* **Clos le 17/09/2026 sur les faits, décision de Xavier du 16/09 (« clos tout ce qui peut l'être à bon droit ») ; signalé par la session voisine le 16/09 au soir.** L'objet de l'item — **suivre la PR #28 jusqu'à sa fusion** — est atteint : scission faite (#28 installateur, #29 code applicatif ouverte à part, pages #2 guide vitrine), les quatre points bloquants réglés, gel du 08 au 14/09 tenu, **fusion le 15/09** (`f179f1ff`), pages #2 le 16/09, `GOUV-19` acté (G11 clos). Le troisième « fini quand » (`install.sh` exécuté une fois sur une machine qui n'est pas celle de son auteur) n'est pas une condition de la fusion : c'est une épreuve de la pile, versée à **I21** (les conditions avant la bascule) — `deploy/README.md` § « Première reconstruction extérieure » la nomme. La relecture de #29 comme du code de production se poursuit sous son propre numéro de PR, avec F7 et B20.","pt":" *(segundo item com o identificador I16 — o da PR #28, 06/09; o primeiro está fechado mais acima)* **Encerrado em 17/09/2026 sobre os factos, decisão de Xavier de 16/09; assinalado pela sessão vizinha em 16/09 à noite.** O objeto do item — **seguir a PR #28 até à fusão** — está atingido: divisão feita (#28 instalador, #29 código aplicativo aberta à parte, pages #2 guia vitrine), os quatro pontos bloqueantes resolvidos, congelamento de 08 a 14/09 mantido, **fusão em 15/09** (`f179f1ff`), pages #2 em 16/09, `GOUV-19` registado (G11 fechado). O terceiro « acabado quando » (`install.sh` executado numa máquina que não é a do autor) não é uma condição da fusão: é uma prova da pilha, vertida em **I21**. A releitura de #29 continua sob o seu próprio número de PR, com F7 e B20."}],["B23","2026-09-20",{"fr":"**Clos le 20/09/2026 sur pièce — constat corrigé : il n'y avait rien à faire.** Le « fini quand » disait « la vue est en invoker, **ou** porte le commentaire qui dit pourquoi elle ne l'est pas ». `obj_description('api.library_email_identity')` rend un `COMMENT ON VIEW` complet, signé « Paquet API-VUES-DEFINER du 29/08/2026 » et amendé le 30/08 : identité d'expédition lue par les fonctions de courriel, `service_role` uniquement, « n'est accordée ni à anon ni à authenticated, et ne doit jamais l'être », et « si un GRANT applicatif lui était accordé un jour, il faudrait la passer en security_invoker dans le même mouvement ». Mesuré le 20/09 : propriétaire `postgres`, `reloptions` vides, seul `service_role` a `SELECT`, aucune fonction ni vue ne la cite, un seul lecteur au dépôt (`register`, par le client admin). Le relevé du 07/09 n'avait lu que `reloptions`, pas le commentaire ; la session du 20/09 l'avait d'abord annoncé « petit, en SQL » sur la même lecture partielle. On ne bascule pas en invoker : le commentaire dit pourquoi.","pt":"**Encerrado em 20/09/2026 sobre peça — constato corrigido: não havia nada a fazer.** O « acabado quando » dizia « a vista está em invoker, **ou** tem o comentário que diz por que não está ». `obj_description('api.library_email_identity')` devolve um `COMMENT ON VIEW` completo, assinado « Paquet API-VUES-DEFINER du 29/08/2026 » e emendado em 30/08: identidade de expedição lida pelas funções de e-mail, só `service_role`, nunca concedida a anon nem a authenticated, e a passar a security_invoker no mesmo movimento se um GRANT aplicativo lhe fosse dado. Medido em 20/09: proprietário `postgres`, `reloptions` vazias, só `service_role` tem `SELECT`, nenhuma função nem vista a cita, um único leitor no repositório (`register`, pelo cliente admin). O levantamento de 07/09 só lera `reloptions`, não o comentário."}],["G12","2026-09-20",{"fr":"**Clos le 20/09, sur pièces.** *(1)* La phrase : REGISTRE `FED-O11` (✅ tranché le 06/09, Q2 : A) ; le guide d'auto-hébergement de la vitrine la dit dans ces termes depuis `b9c85e6` (20/09) — la ligne « Partage de catalogue » (clé `s1_adv4` du générateur, dix langues), qui disait « votre catalogue peut être partagé avec le réseau », devient « Une instance, un réseau » : seul le catalogue traverse, par OAI-PMH, sur décision des admins ; comptes, appartenances, prêts entre bibliothèques, gouvernance et gazette ne traversent pas ; `deploy/README.md` porte la même phrase dans une section « Une instance = un réseau ». Contrôlé sur les dix pages régénérées : une mention d'OAI-PMH chacune, l'ancienne formule absente. *(2)* L'annuaire : décision datée dans `journal/arbitrages/QUESTIONS_pr28_contribution_exterieure_2026-09-06.md` (l. 47, verdict A du 06/09 : « l'annuaire n'est pas ouvert »). Aucun code.","pt":"**Encerrado em 20/09, sobre peças.** *(1)* A frase: REGISTRO `FED-O11` (decidido em 06/09); o guia de auto-hospedagem da vitrine diz isso nesses termos desde `b9c85e6` (dez línguas: «Uma instância, uma rede»), e `deploy/README.md` traz a mesma frase. *(2)* O anuário: decisão datada em `journal/arbitrages/QUESTIONS_pr28_contribution_exterieure_2026-09-06.md` (veredito A de 06/09: não aberto). Nenhum código."}],["B20","2026-09-20",{"fr":"**Clos le 20/09, sur mesure.** Relevé du jour dans `supabase/functions/**` : deux fonctions lisaient encore `SUPABASE_SERVICE_ROLE_KEY` par `Deno.env.get`, hors du chemin de `_shared/core/secret-key.ts` — `opds` (l. 28) et `rss-novidades` (l. 28), écrites après B18 sur le modèle d
