<style>
/* Identite AnarBib : fond bordeaux sombre, Bitter en labeur, Big Shoulders
   en titraille (la police de la brochure manifeste), rouge AnarBib reserve
   aux signaux semantiques. Concu en sombre d'abord ; la variante claire
   garde le meme biais bordeaux plutot qu'un gris neutre. */
:root{
  color-scheme:light dark;
  /* clair */
  --bg:#f6f1ef; --panel:#fffdfc; --ink:#1a1012; --mut:#6d5b58; --line:#e3d6d2;
  --rule:#cbb8b3; --accent:#a81c1c; --accent-soft:#f5e7e6; --chip:#ece1de;
  --p0:#a81c1c; --p1:#9a6410; --p2:#4d6136; --p3:#6d5b58;
  --sp:clamp(16px,3vw,22px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}}
:root[data-theme="dark"]{
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.62 Bitter,Georgia,"Times New Roman",serif;
  -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--sp) 96px}
header{padding:52px 0 20px;border-bottom:2px solid var(--rule);margin-bottom:0}
.eyebrow{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px}
h1{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:.005em;
  text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.sub{color:var(--ink);font-size:clamp(16px,2.1vw,19px);margin:0;max-width:60ch}
.mta{margin:14px 0 0;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:11px 0;margin:0 0 8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--mut);border:1px solid var(--line);
  border-radius:2px;padding:4px 11px;cursor:pointer;line-height:1.4}
button:hover{color:var(--ink);border-color:var(--rule)}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
input[type=search]{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--line);
  border-radius:2px;background:var(--panel);color:var(--ink);min-width:170px;flex:1 1 170px}
h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;

h3{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;

p{margin:0 0 14px;max-width:74ch}
.note{color:var(--mut);font-size:15px;font-style:italic;max-width:70ch}
.tbl{overflow-x:auto;margin:0 0 22px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.photo td:nth-child(1){width:32%}
.photo td:nth-child(2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--accent);padding-right:18px}
.photo td:nth-child(3){color:var(--mut)}
.clot td:nth-child(1){width:24%;font-weight:600}
.clot td:nth-child(2){width:30%;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--p2);
  border-radius:2px;padding:18px 20px;margin:0 0 12px}
.card.P0{border-left-color:var(--p0)}.card.P1{border-left-color:var(--p1)}
.card.P2{border-left-color:var(--p2)}.card.P3{border-left-color:var(--p3)}
.card h4{margin:0 0 10px;font-size:18.5px;line-height:1.32;font-weight:600;text-wrap:balance}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400;
  color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:2px;margin-right:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.07em;text-transform:uppercase;background:var(--chip);color:var(--mut);
  padding:2px 9px;border-radius:2px;line-height:1.5}
.chip.pr{color:var(--bg);background:var(--p2)}
.card.P0 .chip.pr{background:var(--p0)}.card.P1 .chip.pr{background:var(--p1)}
.card.P3 .chip.pr{background:var(--p3)}
.f{margin:14px 0 0}
.f dt{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:14px}
.f dd{margin:2px 0 0;max-width:74ch}
.f ul{margin:4px 0 0;padding-left:19px}
.f li{margin:4px 0;max-width:72ch}
.refs{font-size:12.5px;color:var(--mut);margin-top:15px;font-style:italic;max-width:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--chip);padding:1px 5px;border-radius:2px;word-break:break-word}
.count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);
  font-size:14px;font-weight:400;letter-spacing:0;text-transform:none}
.ecart{border-left:2px solid var(--line);padding-left:16px;margin:0 0 18px;max-width:80ch}
.ecart b{display:block;margin-bottom:5px;font-weight:600}
.ecart span{display:block;font-size:15px;color:var(--mut);margin-bottom:4px}
.empty{color:var(--mut);font-style:italic;padding:26px 0}
@media (max-width:640px){
  header{padding-top:34px}
  .card{padding:14px 15px}
  .photo td:nth-child(1),.clot td:nth-child(1),.clot td:nth-child(2){width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

sur une seule machine.","pt":"É a resposta à única pergunta que decide todo o resto: *este projeto é retomável por outra pessoa além de quem o escreveu?* Um relatório de falha detalhado vale aqui mais que uma correção: é a lista do que só funciona numa única máquina."},"f":{"fr":["La pile démarre sur une machine qui n'a jamais vu le projet, en suivant la documentation seule.","Chaque écart entre la documentation et la réalité est consigné, avec sa commande et son message d'erreur.","Le journal d'exécution devient une section de `deploy/README.md`."],"pt":["A pilha sobe numa máquina que nunca viu o projeto, seguindo apenas a documentação.","Cada divergência entre a documentação e a realidade é registrada, com seu comando e sua mensagem de erro.","O diário de execução vira uma seção de `deploy/README.md`."]},"dep":{"fr":"Aucune. **C'est le meilleur premier pas pour quelqu'un qui arrive.**","pt":"Nenhuma. **É o melhor primeiro passo para quem chega.**"},"r":["docs/CHANTIERS_OUVERTS.md §1","deploy/REPETITION.md"]},{"id":"A3","d":"A","p":"P0","s":"ouvert","e":"L","sk":["sysadmin"],"t":{"fr":"Sortir le runner d'intégration continue de la machine du mainteneur","pt":"Tirar o runner de integração contínua da máquina do mantenedor"},"v":{"fr":"`.forgejo/workflows/ci.yml` et `sql-tests.yml` portent tous deux `runs-on: anarbib-local` — un `act_runner` auto-hébergé sur le WSL2 du mainteneur. Machine éteinte, **rien ne se déploie**, et l'échec est parfois silencieux.","pt":"`.forgejo/workflows/ci.yml` e `sql-tests.yml` trazem ambos `runs-on: anarbib-local` — um `act_runner` auto-hospedado no WSL2 do mantenedor. Máquina desligada, **nada se implanta**, e a falha às vezes é silenciosa."},"w":{"fr":"Faire tourner le runner ailleurs que sur un poste de travail personnel : machine de l'hébergeur, seconde machine du réseau, ou runner partagé. La logique de déploiement est déjà extraite dans `scripts/ci/deployer-backend.sh` et rejouable à la main — la moitié du travail est faite.","pt":"Rodar o runner em outro lugar que não uma estação de trabalho pessoal: máquina do provedor, segunda máquina da rede, ou runner compartilhado. A lógica de implantação já está extraída em `scripts/ci/deployer-backend.sh` e é reexecutável à mão — metade do trabalho está feita."},"y":{"fr":"Tant que le runner est unique et personnel, aucune procédure ne peut rendre le déploiement fiable, et personne d'autre ne peut fusionner une contribution. C'est la seconde moitié de la dépendance à une seule personne, après **A1**.","pt":"Enquanto o runner for único e pessoal, nenhum procedimento pode tornar a implantação confiável, e ninguém mais pode integrar uma contribuição. É a segunda metade da dependência de uma só pessoa, depois de **A1**."},"f":{"fr":["Un push sur `main` déclenche un déploiement sans que la machine du mainteneur soit allumée.","Le garde-fou d'exclusion du routeur `main` est préservé aux deux endroits (workflow et script).","La procédure de remise en route du runner est écrite pour quelqu'un qui ne l'a pas installé."],"pt":["Um push em `main` dispara uma implantação sem que a máquina do mantenedor esteja ligada.","A guarda de exclusão do roteador `main` é preservada nos dois lugares (workflow e script).","O procedimento de recolocação do runner em funcionamento está escrito para quem não o instalou."]},"dep":{"fr":"Lié à **I2** (bascule auto-hébergée). Peut se faire avant, sur l'infrastructure actuelle.","pt":"Ligado a **I2** (migração auto-hospedada). Pode ser feito antes, na infraestrutura atual."},"r":["CLAUDE.md, piège connu n°1","REPRISE_bascule_autohebergee_2026-08-26"]},{"id":"A4","d":"A","p":"P1","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Écrire une porte d'entrée pour qui veut aider sans savoir coder","pt":"Escrever uma porta de entrada para quem quer ajudar sem saber programar"},"v":{"fr":"`CONTRIBUTING.md` (28/08) s'adresse à quelqu'un qui code : fork, branche, `npm ci`, préfixes de commit. `docs/CHANTIERS_OUVERTS.md` fait mieux et signale trois entrées sans compétence technique, mais reste rangé dans un dossier `docs/`.","pt":"`CONTRIBUTING.md` (28/08) se dirige a quem programa: fork, branch, `npm ci`, prefixos de commit. `docs/CHANTIERS_OUVERTS.md` faz melhor e sinaliza três entradas sem competência técnica, mas continua guardado numa pasta `docs/`."},"w":{"fr":"Une page courte, en tête de dépôt et sur anarbib.org, qui dit ce qu'on peut faire pour AnarBib **sans écrire une ligne de code** : relire une langue, indexer des matières, tenir un rôle d'administration réseau, tester une reconstruction, relire une convention. Chaque entrée avec ce qu'elle demande et à qui écrire.","pt":"Uma página curta, no topo do repositório e em anarbib.org, dizendo o que se pode fazer pelo AnarBib **sem escrever uma linha de código**: revisar uma língua, indexar assuntos, exercer um papel de administração de rede, testar uma reconstrução, revisar uma convenção. Cada entrada com o que exige e para quem escrever."},"y":{"fr":"Les trois chantiers les plus utiles du projet aujourd'hui — administrateur·rices réseau, conventions néerlandaise et grecque, indexation matière — ne demandent **aucune compétence technique**. Une porte d'entrée qui parle de `npm ci` les rend invisibles.","pt":"Os três canteiros mais úteis do projeto hoje — administradores·as de rede, convenções neerlandesa e grega, indexação de assunto — não exigem **nenhuma competência técnica**. Uma porta de entrada que fala de `npm ci` os torna invisíveis."},"f":{"fr":["Une page existe, en français et en portugais au minimum.","Elle est atteignable depuis anarbib.org et depuis la racine du dépôt.","Elle nomme une adresse de contact réelle par entrée."],"pt":["Uma página existe, em francês e português no mínimo.","É alcançável a partir de anarbib.org e da raiz do repositório.","Nomeia um endereço de contato real por entrada."]},"dep":{"fr":"Utile avant Bologne (**K5**) : c'est là que l'appel se fait.","pt":"Útil antes de Bolonha (**K5**): é lá que o chamado se faz."},"r":["CONTRIBUTING.md","docs/CHANTIERS_OUVERTS.md"]},{"id":"B1","d":"B","p":"P1","s":"ouvert","e":"M","sk":["sql"],"t":{"fr":"Activer RLS sur les huit tables non protégées du schéma `ingest`","pt":"Ativar RLS nas oito tabelas desprotegidas do esquema `ingest`"},"v":{"fr":"Vérifié le 29/08 : sur les 10 tables de `ingest`, **8 n'ont pas RLS activé**. Les deux plus grosses sont `partner_catalog_staging_rows` (2 172 lignes) et `partner_catalog_row_to_draft` (2 084 lignes). Aucun document du corpus ne mentionne ce point ; l'affirmation « 0 table sans RLS » ne vaut que pour `public`.","pt":"Verificado em 29/08: das 10 tabelas de `ingest`, **8 não têm RLS ativado**. As duas maiores são `partner_catalog_staging_rows` (2 172 linhas) e `partner_catalog_row_to_draft` (2 084 linhas). Nenhum documento do corpus menciona esse ponto; a afirmação «0 tabela sem RLS» só vale para `public`."},"w":{"fr":"Activer RLS sur les huit tables, puis pour chacune : soit écrire la policy qui reproduit la garde déjà appliquée en amont par les RPC, soit laisser sans policy si l'accès ne doit passer que par des fonctions `SECURITY DEFINER` — mais en l'écrivant.","pt":"Ativar RLS nas oito tabelas, depois para cada uma: ou escrever a policy que reproduz a guarda já aplicada a montante pelas RPC, ou deixar sem policy se o acesso só deve passar por funções `SECURITY DEFINER` — mas escrevendo isso."},"y":{"fr":"`ingest` porte des données d'import de catalogues partenaires, donc du contenu de tiers. Le hook `pre-commit` interdit depuis mai toute `CREATE TABLE public.*` sans RLS — la règle n'a jamais été étendue à `ingest`, et personne ne s'en est aperçu parce que les audits ne regardaient que `public`.","pt":"`ingest` carrega dados de importação de catálogos parceiros, portanto conteúdo de terceiros. O hook `pre-commit` proíbe desde maio todo `CREATE TABLE public.*` sem RLS — a regra nunca foi estendida a `ingest`, e ninguém percebeu porque as auditorias só olhavam `public`."},"f":{"fr":["Les 10 tables de `ingest` ont RLS activé.","Chacune a soit une policy, soit une ligne de commentaire SQL disant pourquoi elle n'en a pas.","Le hook `pre-commit` est étendu à `CREATE TABLE ingest.*`.","Les tests SQL couvrent au moins la table la plus exposée."],"pt":["As 10 tabelas de `ingest` têm RLS ativado.","Cada uma tem ou uma policy, ou uma linha de comentário SQL dizendo por que não tem.","O hook `pre-commit` é estendido a `CREATE TABLE ingest.*`.","Os testes SQL cobrem ao menos a tabela mais exposta."]},"dep":{"fr":"Aucune. Se fait sans toucher au front.","pt":"Nenhuma. Faz-se sem tocar no front."},"r":["Relevé du 29/08/2026","CHANTIER_doctrine_creation_objets_securises_2026-05-12"]},{"id":"B2","d":"B","p":"P1","s":"ouvert","e":"L","sk":["sql"],"t":{"fr":"Trier les 142 fonctions `SECURITY DEFINER` du schéma `api`","pt":"Triar as 142 funções `SECURITY DEFINER` do esquema `api`"},"v":{"fr":"L'audit du 20/08 a passé en revue les fonctions de `public` une par une et fermé cinq failles réelles. **Il ne portait pas sur `api`.** Le schéma `api` compte 184 fonctions dont **142 en `SECURITY DEFINER`**, toutes appelables par le rôle `authenticated` via `/rest/v1/rpc/`.","pt":"A auditoria de 20/08 revisou as funções de `public` uma a uma e fechou cinco falhas reais. **Não abrangia `api`.** O esquema `api` conta 184 funções das quais **142 em `SECURITY DEFINER`**, todas chamáveis pelo papel `authenticated` via `/rest/v1/rpc/`."},"w":{"fr":"Reprendre le critère d'audit déjà établi — *que renvoie-t-elle, à partir de quel paramètre, et qu'est-ce qui interdit à un tiers de le demander ?* — et l'appliquer aux 142. Chercher `auth.uid()` dans le corps ne prouve rien.","pt":"Retomar o critério de auditoria já estabelecido — *o que ela retorna, a partir de qual parâmetro, e o que impede um terceiro de pedi-lo?* — e aplicá-lo às 142. Procurar `auth.uid()` no corpo não prova nada."},"y":{"fr":"C'est la moitié non auditée de la surface d'API du projet. Les cinq failles trouvées dans `public` étaient des oracles — numéro vers courriel, identifiant vers nom — et rien ne dit que `api` n'en porte pas.","pt":"É a metade não auditada da superfície de API do projeto. As cinco falhas encontradas em `public` eram oráculos — número para e-mail, identificador para nome — e nada diz que `api` não carregue outros."},"f":{"fr":["Les 142 fonctions ont un verdict écrit : légitime, à restreindre, ou à supprimer.","Les fonctions à restreindre ont perdu leur `EXECUTE` par migration.","Le compte rendu vit dans `docs/journal/audits/`, au format de celui du 20/08.","Attention : cinq fonctions portent 106 policies RLS et ne doivent **jamais** perdre leur `EXECUTE`, `anon` compris."],"pt":["As 142 funções têm um veredicto escrito: legítima, a restringir, ou a suprimir.","As funções a restringir perderam seu `EXECUTE` por migração.","O relatório vive em `docs/journal/audits/`, no formato do de 20/08.","Atenção: cinco funções carregam 106 policies RLS e **nunca** devem perder seu `EXECUTE`, inclusive `anon`."]},"dep":{"fr":"Se fait par lots. Un lot de vingt fonctions est déjà utile.","pt":"Faz-se por lotes. Um lote de vinte funções já é útil."},"r":["PLAN_DE_MARCHE §8","PLAN_DE_MARCHE règle 13.3","AUDIT_securite_fonctions_privees_2026-05-18"]},{"id":"B3","d":"B","p":"P1","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Passer les sept vues `api` restées en SECURITY DEFINER","pt":"Passar as sete views `api` que continuam em SECURITY DEFINER"},"v":{"fr":"61 des 68 vues de `api` portent `security_invoker = true`. Sept ne l'ont pas : `collective_removal_proposals_current_v1`, `cooptation_proposals_current_v1`, `gazette_issues_public_v1`, `gazette_locales_public_v1`, `lettre_locales_public_v1`, `lettre_public_v1`, `library_email_identity`. Le hook `pre-commit` interdit pourtant depuis mai toute vue nouvelle sans cet attribut.","pt":"61 das 68 views de `api` trazem `security_invoker = true`. Sete não têm: `collective_removal_proposals_current_v1`, `cooptation_proposals_current_v1`, `gazette_issues_public_v1`, `gazette_locales_public_v1`, `lettre_locales_public_v1`, `lettre_public_v1`, `library_email_identity`. O hook `pre-commit` proíbe no entanto desde maio toda view nova sem esse atributo."},"w":{"fr":"Pour chacune : vérifier ce que la vue expose, décider si l'attribut manquant est un oubli ou un choix, puis soit poser `security_invoker = true` par migration, soit écrire pourquoi elle doit rester en DEFINER.","pt":"Para cada uma: verificar o que a view expõe, decidir se o atributo ausente é um esquecimento ou uma escolha, depois ou pôr `security_invoker = true` por migração, ou escrever por que ela deve permanecer em DEFINER."},"y":{"fr":"Une vue `security_invoker = false` contourne les policies RLS de ses tables sources : c'est exactement le même piège que la policy manquante. `library_email_identity` est la plus préoccupante — elle porte le mot « identity » et le mot « email ».","pt":"Uma view `security_invoker = false` contorna as policies RLS de suas tabelas de origem: é exatamente a mesma armadilha da policy ausente. `library_email_identity` é a mais preocupante — carrega a palavra «identity» e a palavra «email»."},"f":{"fr":["Les sept vues ont un verdict écrit et appliqué.","Le hook `pre-commit` couvre aussi `CREATE OR REPLACE VIEW`.","Un test SQL vérifie qu'aucune vue de `api` n'est en DEFINER sans dérogation nommée."],"pt":["As sete views têm um veredicto escrito e aplicado.","O hook `pre-commit` cobre também `CREATE OR REPLACE VIEW`.","Um teste SQL verifica que nenhuma view de `api` está em DEFINER sem derrogação nomeada."]},"dep":{"fr":"Indépendant de **B2**, même famille de risque.","pt":"Independente de **B2**, mesma família de risco."},"r":["Relevé du 29/08/2026","PLAN_DE_MARCHE règle 13.2"]},{"id":"B4","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Examiner les quatre tables à RLS sans policy qui ne sont pas du transit","pt":"Examinar as quatro tabelas com RLS sem policy que não são de trânsito"},"v":{"fr":"15 tables ont RLS activé et zéro policy. Onze sont des tables de transit ou vides. Quatre ne le sont pas : `author_name_aliases` (**1 647 lignes**), `library_themes` (3 lignes), `library_theme_configs`, `interlibrary_loan_events`.","pt":"15 tabelas têm RLS ativado e zero policy. Onze são tabelas de trânsito ou vazias. Quatro não são: `author_name_aliases` (**1 647 linhas**), `library_themes` (3 linhas), `library_theme_configs`, `interlibrary_loan_events`."},"w":{"fr":"Pour chacune, trancher : soit l'accès passe par une RPC et l'absence de policy est correcte — l'écrire en commentaire SQL —, soit une lecture légitime est aujourd'hui impossible et il manque une policy ou une fonction.","pt":"Para cada uma, decidir: ou o acesso passa por uma RPC e a ausência de policy está correta — escrevê-lo em comentário SQL —, ou uma leitura legítima é hoje impossível e falta uma policy ou uma função."},"y":{"fr":"Une table avec RLS et sans policy est fermée à tout le monde sauf aux fonctions `DEFINER`. C'est parfois exactement ce qu'on veut, et parfois une fonctionnalité qui ne marche pas sans que personne l'ait remarqué — `author_name_aliases` porte 1 647 lignes que rien ne lit peut-être.","pt":"Uma tabela com RLS e sem policy está fechada para todos exceto para as funções `DEFINER`. Às vezes é exatamente o que se quer, e às vezes é uma funcionalidade que não funciona sem que ninguém tenha percebido — `author_name_aliases` carrega 1 647 linhas que talvez nada leia."},"f":{"fr":["Les quatre tables ont un verdict écrit.","Le contrôle de restauration du runbook liste nommément les tables sans policy attendues."],"pt":["As quatro tabelas têm um veredicto escrito.","O controle de restauração do runbook lista nominalmente as tabelas sem policy esperadas."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["PLAN_DE_MARCHE §8","MATRICE_rls_deny_all_2026-06-23"]},{"id":"B5","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Résorber les neuf policies qui réévaluent `auth.*()` par ligne","pt":"Resolver as nove policies que reavaliam `auth.*()` por linha"},"v":{"fr":"La migration `20260703203953_perf_rls_initplan_wrap_auth_calls` a traité les policies d'alors. Neuf policies écrites depuis y échappent : `book_reading_notes` (4), `book_reading_note_reports` (2), `catalog_duplicate_reports` (1), `authority_duplicate_reports` (1), `author_not_duplicate` (1).","pt":"A migração `20260703203953_perf_rls_initplan_wrap_auth_calls` tratou as policies de então. Nove policies escritas desde então escapam: `book_reading_notes` (4), `book_reading_note_reports` (2), `catalog_duplicate_reports` (1), `authority_duplicate_reports` (1), `author_not_duplicate` (1)."},"w":{"fr":"Envelopper les appels `auth.uid()` / `auth.jwt()` dans un sous-select, comme la migration de juillet l'a fait pour les autres.","pt":"Envolver as chamadas `auth.uid()` / `auth.jwt()` num sub-select, como a migração de julho fez para as outras."},"y":{"fr":"Sans cet enveloppement, la fonction est appelée une fois par ligne examinée. Les cinq tables concernées sont vides aujourd'hui, donc le coût est nul — et c'est précisément le bon moment pour corriger, avant que les notes de lecture servent.","pt":"Sem esse envolvimento, a função é chamada uma vez por linha examinada. As cinco tabelas envolvidas estão vazias hoje, então o custo é nulo — e é precisamente o bom momento para corrigir, antes que as notas de leitura sirvam."},"f":{"fr":["Le lint `auth_rls_initplan` ne remonte plus aucun avis.","Le patron d'enveloppement est rappelé dans le modèle de migration."],"pt":["O lint `auth_rls_initplan` não retorna mais nenhum aviso.","O padrão de envolvimento é lembrado no modelo de migração."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Advisors performance, relevé du 29/08/2026"]},{"id":"B6","d":"B","p":"P1","s":"ouvert","e":"S","sk":["deno","sysadmin"],"t":{"fr":"Réconcilier `config.toml` avec les 48 fonctions réellement déployées","pt":"Reconciliar `config.toml` com as 48 funções realmente implantadas"},"v":{"fr":"`supabase/config.toml` porte **31 sections `[functions.*]`, toutes à `verify_jwt = false`, aucune à `true`**. Les commentaires du fichier annoncent « 17 en `false` et 6 en `true` » ; `CLAUDE.md` annonce « 36 dont 5 à `true` ». Les trois se contredisent, et **18 des 48 fonctions déployées ne sont pas déclarées du tout**.","pt":"`supabase/config.toml` traz **31 seções `[functions.*]`, todas em `verify_jwt = false`, nenhuma em `true`**. Os comentários do arquivo anunciam «17 em `false` e 6 em `true`»; `CLAUDE.md` anuncia «36 das quais 5 em `true`». Os três se contradizem, e **18 das 48 funções implantadas não estão declaradas de forma alguma**."},"w":{"fr":"Établir la liste réelle des 48 fonctions et, pour chacune, ce qui doit la protéger : JWT de la plateforme, secret de webhook, ou rien parce qu'elle est publique par nature. Écrire cette liste dans `config.toml` et corriger les commentaires et `CLAUDE.md`.","pt":"Estabelecer a lista real das 48 funções e, para cada uma, o que deve protegê-la: JWT da plataforma, segredo de webhook, ou nada porque é pública por natureza. Escrever essa lista em `config.toml` e corrigir os comentários e o `CLAUDE.md`."},"y":{"fr":"C'est la seule ligne de la documentation qui décrit une protection **qui n'existe pas**. Les 18 fonctions non déclarées reposent sur le comportement par défaut de la plateforme — un comportement qui disparaîtra le jour de la bascule auto-hébergée, où c'est le routeur `main` qui décidera, en refus par défaut.","pt":"É a única linha da documentação que descreve uma proteção **que não existe**. As 18 funções não declaradas dependem do comportamento padrão da plataforma — um comportamento que desaparecerá no dia da migração auto-hospedada, onde é o roteador `main` que decidirá, em recusa por omissão."},"f":{"fr":["`config.toml` déclare les 48 fonctions déployées, sans exception.","Chaque `verify_jwt = false` porte une ligne de commentaire disant ce qui protège la fonction à la place.","Le routeur `main` a été relu contre cette liste."],"pt":["`config.toml` declara as 48 funções implantadas, sem exceção.","Cada `verify_jwt = false` traz uma linha de comentário dizendo o que protege a função no lugar.","O roteador `main` foi relido contra essa lista."]},"dep":{"fr":"Prérequis de **I3** (test du routeur `main`).","pt":"Pré-requisito de **I3** (teste do roteador `main`)."},"r":["Relevé du 29/08/2026","deploy/README.md","supabase/functions/main/index.ts"]},{"id":"B7","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Départager les homonymes de fonctions entre `ingest` et `public`","pt":"Desambiguar os homônimos de funções entre `ingest` e `public`"},"v":{"fr":"Quatre noms de fonction existent dans les deux schémas avec des signatures et des sémantiques différentes : `fn_bulk_create_book_drafts_from_run`, `fn_bulk_set_partner_catalog_editorial_decision`, `fn_set_partner_catalog_editorial_decision`, et `set_updated_at()`. Aucun doublon de signature dans un même schéma — le problème est le nom partagé.","pt":"Quatro nomes de função existem nos dois esquemas com assinaturas e semânticas diferentes: `fn_bulk_create_book_drafts_from_run`, `fn_bulk_set_partner_catalog_editorial_decision`, `fn_set_partner_catalog_editorial_decision`, e `set_updated_at()`. Nenhuma duplicata de assinatura num mesmo esquema — o problema é o nome compartilhado."},"w":{"fr":"Vérifier laquelle des deux est appelée par le front et par les RPC, renommer celle qui ne l'est pas, ou supprimer la version morte. `set_updated_at()` est un trigger banal et peut rester.","pt":"Verificar qual das duas é chamada pelo front e pelas RPC, renomear a que não é, ou suprimir a versão morta. `set_updated_at()` é um trigger banal e pode ficar."},"y":{"fr":"Un `search_path` qui change d'ordre suffit à faire appeler l'autre fonction, avec des paramètres qui ne correspondent pas. C'est une panne difficile à diagnostiquer, et le projet a déjà payé une fois pour un `search_path` mal épinglé.","pt":"Um `search_path` que muda de ordem basta para chamar a outra função, com parâmetros que não correspondem. É uma pane difícil de diagnosticar, e o projeto já pagou uma vez por um `search_path` mal fixado."},"f":{"fr":["Les trois fonctions métier homonymes sont départagées.","Aucune ne dépend de l'ordre du `search_path` pour être résolue correctement."],"pt":["As três funções de negócio homônimas estão desambiguadas.","Nenhuma depende da ordem do `search_path` para ser resolvida corretamente."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026"]},{"id":"B8","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Départager les vues qui existent en double entre `public` et `api`","pt":"Desambiguar as views que existem em duplicata entre `public` e `api`"},"v":{"fr":"Quatre paires de vues homonymes ou quasi : `public.my_access` / `api.my_access`, `public.my_session_context` / `api.my_session_context`, `public.v_library_service_public` / `api.library_service_public`, `public.v_book_detail_public_v2` / `api.catalog_book_detail_public_v2`. Et dans `public`, `catalog_partners_policy_flags` coexiste avec `catalog_partners_policy_flags_v2`.","pt":"Quatro pares de views homônimas ou quase: `public.my_access` / `api.my_access`, `public.my_session_context` / `api.my_session_context`, `public.v_library_service_public` / `api.library_service_public`, `public.v_book_detail_public_v2` / `api.catalog_book_detail_public_v2`. E em `public`, `catalog_partners_policy_flags` coexiste com `catalog_partners_policy_flags_v2`."},"w":{"fr":"Vérifier laquelle est lue par le front — le schéma exposé par PostgREST est `public,api,storage` — et supprimer les autres, ou expliciter que la vue `public` est le socle et la vue `api` l'exposition.","pt":"Verificar qual é lida pelo front — o esquema exposto pelo PostgREST é `public,api,storage` — e suprimir as outras, ou explicitar que a view `public` é a base e a view `api` a exposição."},"y":{"fr":"Deux vues du même nom dans deux schémas tous deux exposés par PostgREST, c'est une ambiguïté à l'appel. Et une vue `_v2` qui n'a jamais remplacé sa `v1` est du code mort qui ressemble à du code vivant.","pt":"Duas views do mesmo nome em dois esquemas ambos expostos pelo PostgREST é uma ambiguidade na chamada. E uma view `_v2` que nunca substituiu sua `v1` é código morto que se parece com código vivo."},"f":{"fr":["Chaque paire a un verdict : socle + exposition assumés, ou suppression de la morte.","La vue `_v2` a remplacé sa devancière, ou l'inverse."],"pt":["Cada par tem um veredicto: base + exposição assumidas, ou supressão da morta.","A view `_v2` substituiu a antecessora, ou o contrário."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026"]},{"id":"B9","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Purger le schéma `backup_2026_05_07`","pt":"Purgar o esquema `backup_2026_05_07`"},"v":{"fr":"Six tables, **toutes à zéro ligne et zéro insertion depuis leur création**, sans clé primaire, sans RLS : `emprestimos_v2`, `emprestimo_itens_v2`, `reservas_v2`, `reserva_linhas_v2`, `reserva_item_workflow_v2`, `loan_midpoint_message_log`. La décision `BG2-9` prescrit cette purge depuis juin.","pt":"Seis tabelas, **todas com zero linha e zero inserção desde a criação**, sem chave primária, sem RLS: `emprestimos_v2`, `emprestimo_itens_v2`, `reservas_v2`, `reserva_linhas_v2`, `reserva_item_workflow_v2`, `loan_midpoint_message_log`. A decisão `BG2-9` prescreve essa purga desde junho."},"w":{"fr":"`DROP SCHEMA backup_2026_05_07 CASCADE` par migration, après avoir confirmé une dernière fois que les six tables sont vides.","pt":"`DROP SCHEMA backup_2026_05_07 CASCADE` por migração, após confirmar uma última vez que as seis tabelas estão vazias."},"y":{"fr":"Six tables de sauvegarde vides polluent chaque relevé d'advisors — elles portent à elles seules six des quatorze avis « pas de clé primaire ». Et un schéma nommé `backup_` qui ne contient rien est un piège pour qui reprendra le projet.","pt":"Seis tabelas de backup vazias poluem cada levantamento de advisors — carregam sozinhas seis dos catorze avisos «sem chave primária». E um esquema chamado `backup_` que não contém nada é uma armadilha para quem retomar o projeto."},"f":{"fr":["Le schéma n'existe plus.","`deploy/bg2-known-tables.txt` a été mis à jour dans le même mouvement."],"pt":["O esquema não existe mais.","`deploy/bg2-known-tables.txt` foi atualizado no mesmo movimento."]},"dep":{"fr":"Ne pas confondre avec `conv_backup`, qui porte des données de revue humaine et **ne se purge pas** (voir **C4**).","pt":"Não confundir com `conv_backup`, que carrega dados de revisão humana e **não se purga** (ver **C4**)."},"r":["REGISTRE §BG2 BG2-9"]},{"id":"B10","d":"B","p":"P3","s":"ouvert","e":"M","sk":["sql"],"t":{"fr":"Hygiène de performance : 170 index inutilisés, 38 clés étrangères non indexées, 24 policies permissives en double","pt":"Higiene de performance: 170 índices não usados, 38 chaves estrangeiras não indexadas, 24 policies permissivas duplicadas"},"v":{"fr":"256 avis de performance au 29/08. Les tables les plus chargées en index inutilisés sont `library_partnerships` (6), `books` (5), `membership_payments` (4). Les 24 policies permissives en double portent toutes sur le rôle `authenticated` en `SELECT`, sur des tables centrales (`books`, `authors`, `exemplares`, `subjects`, `works`).","pt":"256 avisos de performance em 29/08. As tabelas mais carregadas de índices não usados são `library_partnerships` (6), `books` (5), `membership_payments` (4). As 24 policies permissivas duplicadas incidem todas sobre o papel `authenticated` em `SELECT`, em tabelas centrais (`books`, `authors`, `exemplares`, `subjects`, `works`)."},"w":{"fr":"Trois passes distinctes, à ne pas mélanger : fusionner les paires de policies permissives ; indexer les clés étrangères qui servent réellement ; ne supprimer un index inutilisé que si l'on comprend pourquoi il avait été créé.","pt":"Três passagens distintas, a não misturar: fundir os pares de policies permissivas; indexar as chaves estrangeiras que realmente servem; só suprimir um índice não usado se se compreender por que foi criado."},"y":{"fr":"À la volumétrie actuelle — 2 676 notices, 16 comptes — **rien de ceci ne se voit**. C'est un chantier de pré-montée en charge, différé à dessein depuis juillet. Le noter permet de ne pas le redécouvrir en urgence le jour où une bibliothèque arrive avec 100 000 notices.","pt":"Na volumetria atual — 2 676 registros, 16 contas — **nada disso se vê**. É um canteiro de pré-crescimento, adiado de propósito desde julho. Anotá-lo permite não redescobri-lo às pressas no dia em que uma biblioteca chegar com 100 000 registros."},"f":{"fr":["Les 24 avis de policies en double sont résorbés — c'est la passe la plus rentable.","Les clés étrangères des tables réellement écrites sont indexées.","Les index supprimés le sont avec la raison écrite."],"pt":["Os 24 avisos de policies duplicadas estão resolvidos — é a passagem mais rentável.","As chaves estrangeiras das tabelas realmente escritas estão indexadas.","Os índices suprimidos o são com o motivo escrito."]},"dep":{"fr":"À reprendre si une bibliothèque à gros fonds rejoint le réseau.","pt":"A retomar se uma biblioteca de grande acervo entrar na rede."},"r":["ETAT-lancement-consolide-2026-07-03 §2 item 7","Advisors performance du 29/08/2026"]},{"id":"B11","d":"B","p":"P2","s":"a-verifier","e":"S","sk":["sql"],"t":{"fr":"Comprendre `user_wishlist` : une ligne vivante pour 9 092 insertions","pt":"Compreender `user_wishlist`: uma linha viva para 9 092 inserções"},"v":{"fr":"La table `public.user_wishlist` porte **1 ligne vivante** pour **9 092 insertions cumulées**. C'est le rapport écriture/suppression le plus extrême de la base, de deux ordres de grandeur.","pt":"A tabela `public.user_wishlist` carrega **1 linha viva** para **9 092 inserções acumuladas**. É a relação escrita/exclusão mais extrema do banco, por duas ordens de grandeza."},"w":{"fr":"Trouver ce qui écrit et efface : un test rejoué, un chargement de page qui insère puis annule, un composant React qui appelle la RPC à chaque rendu. Regarder `OPAC-W1`, dont la note dit « reste `WITH CHECK` ».","pt":"Encontrar o que escreve e apaga: um teste reexecutado, um carregamento de página que insere e depois cancela, um componente React que chama a RPC a cada renderização. Olhar `OPAC-W1`, cuja nota diz «resta `WITH CHECK`»."},"y":{"fr":"Neuf mille écritures pour une ligne, ce n'est pas un usage : c'est une boucle. Elle coûte peu aujourd'hui et coûtera exactement autant par utilisatrice le jour où il y en aura cent.","pt":"Nove mil escritas para uma linha não é um uso: é um laço. Custa pouco hoje e custará exatamente o mesmo por usuária no dia em que houver cem."},"f":{"fr":["La cause est identifiée et écrite.","Si c'est une boucle du front, elle est corrigée ; si c'est un test, la ligne est retirée du constat."],"pt":["A causa está identificada e escrita.","Se for um laço do front, está corrigido; se for um teste, a linha é retirada da constatação."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["REGISTRE §18 OPAC-W1","Relevé du 29/08/2026"]},{"id":"B12","d":"B","p":"P2","s":"a-verifier","e":"S","sk":["sql","deno"],"t":{"fr":"Élucider les trois actions critiques inter-bibliothèques restées en `skipped`","pt":"Elucidar as três ações críticas interbibliotecas que ficaram em `skipped`"},"v":{"fr":"Trois lignes de `network.cross_library_critical_action` sont en `status = 'skipped'` depuis le 08/06/2026, avec `attempts = 1`, `last_error` nul et un `pg_net_request_id` présent. Le signalement date du 26/08 et n'a pas été instruit.","pt":"Três linhas de `network.cross_library_critical_action` estão em `status = 'skipped'` desde 08/06/2026, com `attempts = 1`, `last_error` nulo e um `pg_net_request_id` presente. O apontamento é de 26/08 e não foi instruído."},"w":{"fr":"Croiser les `pg_net_request_id` avec les journaux de `notify-event` pour savoir si l'appel est parti, s'il a échoué, ou s'il a été volontairement ignoré. Puis décider : rejouer, ou clore avec la raison.","pt":"Cruzar os `pg_net_request_id` com os logs de `notify-event` para saber se a chamada saiu, se falhou, ou se foi deliberadamente ignorada. Depois decidir: reexecutar, ou encerrar com o motivo."},"y":{"fr":"Ces lignes tracent des actions d'administration réseau qui touchent une bibliothèque autre que celle de la personne qui agit. Un statut `skipped` sans erreur, c'est soit une notification qui n'est jamais partie, soit une trace mal posée. Les deux méritent d'être sues.","pt":"Estas linhas rastreiam ações de administração de rede que tocam uma biblioteca diferente da pessoa que age. Um status `skipped` sem erro é ou uma notificação que nunca saiu, ou um rastro mal registrado. Ambos merecem ser sabidos."},"f":{"fr":["Les trois lignes ont une explication écrite.","Si le mécanisme peut sauter une notification en silence, il est corrigé."],"pt":["As três linhas têm uma explicação escrita.","Se o mecanismo pode pular uma notificação em silêncio, está corrigido."]},"dep":{"fr":"Lié à **F1** (audit de la chaîne de courriel).","pt":"Ligado a **F1** (auditoria da cadeia de e-mail)."},"r":["VERIF_etat_reel_gouvernance_et_crons_2026-08-26 §4"]},{"id":"B13","d":"B","p":"P3","s":"ouvert","e":"L","sk":["sql","sysadmin"],"t":{"fr":"Décider du sort des 221 migrations : squash ou pas","pt":"Decidir o destino das 221 migrações: squash ou não"},"v":{"fr":"221 migrations appliquées, dont la première est un `baseline_live` de **2,4 Mo** — le plus gros fichier du dépôt. Le squash est marqué « décidé, non commencé » depuis le 20/08, à une époque où le compte était de 146.","pt":"221 migrações aplicadas, das quais a primeira é um `baseline_live` de **2,4 MB** — o maior arquivo do repositório. O squash está marcado «decidido, não iniciado» desde 20/08, numa época em que a contagem era de 146."},"w":{"fr":"Soit reconstruire un `baseline` à partir du schéma courant et archiver les migrations antérieures, soit assumer la chaîne longue et documenter pourquoi. Le rejeu complet prend aujourd'hui environ 25 minutes, mesuré.","pt":"Ou reconstruir um `baseline` a partir do esquema atual e arquivar as migrações anteriores, ou assumir a cadeia longa e documentar por quê. A reexecução completa leva hoje cerca de 25 minutos, medido."},"y":{"fr":"Le risque du squash est entier : il réécrit la seule trace ordonnée de ce qui a été fait, et le harnais de tests SQL rejoue toute la chaîne à chaque fois. Ne pas le faire coûte du temps de CI ; le faire mal coûte la capacité à reconstruire. **Ne pas s'y engager avant que A2 ait réussi au moins une fois.**","pt":"O risco do squash é inteiro: reescreve o único rastro ordenado do que foi feito, e o arnês de testes SQL reexecuta toda a cadeia a cada vez. Não fazê-lo custa tempo de CI; fazê-lo mal custa a capacidade de reconstruir. **Não se comprometer antes que A2 tenha sido bem-sucedido pelo menos uma vez.**"},"f":{"fr":["Une décision écrite au REGISTRE, dans un sens ou dans l'autre.","Si squash : la reconstruction depuis le nouveau baseline a été éprouvée sur une machine tierce."],"pt":["Uma decisão escrita no REGISTRO, num sentido ou no outro.","Se squash: a reconstrução a partir do novo baseline foi testada numa máquina de terceiro."]},"dep":{"fr":"**Bloqué par A2.** Ne pas commencer avant.","pt":"**Bloqueado por A2.** Não começar antes."},"r":["ETAT-AVANCEMENT-multisessions","docs/schema/baseline_schema_2026-06-11.sql"]},{"id":"C1","d":"C","p":"P1","s":"ouvert","e":"S","sk":["sql","biblio"],"t":{"fr":"Faire entrer les 35 sujets SOLIDAIRES dans les migrations","pt":"Fazer os 35 assuntos SOLIDAIRES entrarem nas migrações"},"v":{"fr":"Vérifié le 29/08 : **35 sujets ont été créés en base le 27/08** et les alignements FICEDL sont passés de 51 à **98**. Mais `docs/drafts/20260828_sujets_solidaires_ficedl.sql` est toujours dans `docs/drafts/`, hors de `supabase/migrations/`. Une instance neuve n'aura donc pas ces sujets.","pt":"Verificado em 29/08: **35 assuntos foram criados no banco em 27/08** e os alinhamentos FICEDL passaram de 51 para **98**. Mas `docs/drafts/20260828_sujets_solidaires_ficedl.sql` continua em `docs/drafts/`, fora de `supabase/migrations/`. Uma instância nova, portanto, não terá esses assuntos."},"w":{"fr":"Comparer le contenu du brouillon à l'état réel de la base, en faire une migration idempotente qui ne recrée pas ce qui existe, et la ranger dans `supabase/migrations/`. Ou décider que ces sujets sont propres à une bibliothèque et n'ont pas à embarquer — mais l'écrire.","pt":"Comparar o conteúdo do rascunho ao estado real do banco, transformá-lo numa migração idempotente que não recrie o que existe, e guardá-la em `supabase/migrations/`. Ou decidir que esses assuntos são próprios de uma biblioteca e não devem embarcar — mas escrevê-lo."},"y":{"fr":"C'est exactement la question tranchée le 26/08 pour le thésaurus FICEDL : le vocabulaire fédéral embarque, les sujets locaux et leur alignement n'embarquent pas, parce que ce sont le fonds et l'acte de chaque collectif. Si cette règle vaut ici, il faut le dire ; sinon, la migration manque. Dans les deux cas, l'écart entre `docs/drafts/` et la base est une dette de traçabilité.","pt":"É exatamente a questão decidida em 26/08 para o tesauro FICEDL: o vocabulário federal embarca, os assuntos locais e seu alinhamento não embarcam, porque são o acervo e o ato de cada coletivo. Se essa regra vale aqui, é preciso dizê-lo; senão, a migração falta. Nos dois casos, o desvio entre `docs/drafts/` e o banco é uma dívida de rastreabilidade."},"f":{"fr":["`docs/drafts/20260828_sujets_solidaires_ficedl.sql` a disparu : soit devenu migration, soit archivé avec la raison.","Le compte de contrôle est écrit : 89 sujets, 98 alignements au 29/08.","Rappel : `subject_ficedl_links.match_type` n'accepte que `exact` et `close` — il n'y a pas de `broad`."],"pt":["`docs/drafts/20260828_sujets_solidaires_ficedl.sql` desapareceu: ou virou migração, ou foi arquivado com o motivo.","A contagem de controle está escrita: 89 assuntos, 98 alinhamentos em 29/08.","Lembrete: `subject_ficedl_links.match_type` só aceita `exact` e `close` — não existe `broad`."]},"dep":{"fr":"Lié à **C2** (import du fonds SOLIDAIRES).","pt":"Ligado a **C2** (importação do acervo SOLIDAIRES)."},"r":["REPRISE_claude_code_2026-08-27 chantier 2","REGISTRE §30 THES"]},{"id":"C2","d":"C","p":"P1","s":"ouvert","e":"M","sk":["biblio","sql"],"t":{"fr":"Importer le fonds SOLIDAIRES par l'outil d'import, et consigner ce qui casse","pt":"Importar o acervo SOLIDAIRES pela ferramenta de importação, e registrar o que quebra"},"v":{"fr":"1 685 notices dans `SOLIDAIRES_import_test.csv`. Les en-têtes suivent `spec-catalogacao-fiche-et-paliers` et **n'ont jamais été confrontés à l'importeur**. Engagement pris auprès du collectif, échéance fin août — donc échue.","pt":"1 685 registros em `SOLIDAIRES_import_test.csv`. Os cabeçalhos seguem `spec-catalogacao-fiche-et-paliers` e **nunca foram confrontados com o importador**. Compromisso assumido com o coletivo, prazo fim de agosto — portanto vencido."},"w":{"fr":"Adapter les en-têtes au format réellement attendu (environ une heure), faire passer le fichier **par l'outil d'import du dépôt et non par des `INSERT` à la main**, relire une vingtaine de fiches au hasard, puis faire une démonstration en visio écran partagé.","pt":"Adaptar os cabeçalhos ao formato realmente esperado (cerca de uma hora), passar o arquivo **pela ferramenta de importação do repositório e não por `INSERT` à mão**, revisar umas vinte fichas ao acaso, e depois fazer uma demonstração em videoconferência com tela compartilhada."},"y":{"fr":"L'objet est autant d'éprouver l'importeur que d'obtenir les notices. **Le livrable le plus utile du chantier est la liste de ce qui casse, de ce qui est mal deviné et de ce qui se perd** — pas les 1 685 fiches.","pt":"O objetivo é tanto testar o importador quanto obter os registros. **A entrega mais útil do canteiro é a lista do que quebra, do que é mal adivinhado e do que se perde** — não as 1 685 fichas."},"f":{"fr":["Le lot vit en `book_drafts` avec un marqueur de provenance.","Un compte rendu écrit dit ce qui a cassé, ligne par ligne quand c'est possible.","Vingt fiches tirées au hasard ont été relues.","**Aucune bibliothèque « SOLIDAIRES » n'a été créée** — ni membre, ni partenaire, ni cible.","**Aucune coquille d'accent de la source n'a été corrigée en silence** : les corrections vivent dans `assunto_local_sugerido`."],"pt":["O lote vive em `book_drafts` com um marcador de proveniência.","Um relatório escrito diz o que quebrou, linha por linha quando possível.","Vinte fichas sorteadas ao acaso foram revisadas.","**Nenhuma biblioteca «SOLIDAIRES» foi criada** — nem membro, nem parceira, nem alvo.","**Nenhum erro de acento da fonte foi corrigido em silêncio**: as correções vivem em `assunto_local_sugerido`."]},"dep":{"fr":"L'admission de SOLIDAIRES au réseau est **G7**, bloquée par **A1**. Les deux ne se mélangent pas : on importe un lot, on n'admet pas une composante.","pt":"A admissão de SOLIDAIRES na rede é **G7**, bloqueada por **A1**. As duas não se misturam: importa-se um lote, não se admite um componente."},"r":["REPRISE_claude_code_2026-08-27 chantier 2","CALENDRIER_bologne_2026-08-27"]},{"id":"C3","d":"C","p":"P1","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Mener la revue humaine des autorités : patronymes, casse, titres","pt":"Conduzir a revisão humana das autoridades: sobrenomes, caixa, títulos"},"v":{"fr":"Les 19 migrations `conventions_*` sont appliquées depuis le 21/08 : les référentiels sont normalisés, les mécaniques sûres ont été passées, la file de vérification existe et l'application permet d'y travailler. **Ce qui reste est la part qu'aucune machine ne fait.**","pt":"As 19 migrações `conventions_*` estão aplicadas desde 21/08: os referenciais estão normalizados, as mecânicas seguras foram passadas, a fila de verificação existe e o aplicativo permite trabalhar nela. **O que resta é a parte que nenhuma máquina faz.**"},"w":{"fr":"Reprendre les trois tables de revue du schéma `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — et les traiter fiche par fiche depuis l'Atelier autorités.","pt":"Retomar as três tabelas de revisão do esquema `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — e tratá-las ficha por ficha a partir da Oficina de autoridades."},"y":{"fr":"Sur les 22 doubles patronymes hispaniques signalés automatiquement, **trois sont des faux positifs connus** (Mechoso, Borges, Marcos) : 14 % d'erreur. Et sur les 13 points d'accès sur particule, **quatre sont corrects** (Van der Walt, De Amicis, Di Paolo, De Greef). Un script qui « finirait » ce travail introduirait des fautes dans un catalogue qui n'en a pas.","pt":"Dos 22 duplos sobrenomes hispânicos apontados automaticamente, **três são falsos positivos conhecidos** (Mechoso, Borges, Marcos): 14 % de erro. E dos 13 pontos de acesso sobre partícula, **quatro estão corretos** (Van der Walt, De Amicis, Di Paolo, De Greef). Um script que «terminasse» esse trabalho introduziria erros num catálogo que não os tem."},"f":{"fr":["Les trois tables sont vidées par validation humaine, pas par script.","**Interdiction absolue** : décommenter le SQL d'application, le compléter, ou passer `valide = true` en masse.","Les 9 points d'accès posés sur un suffixe de filiation — type `FILHO, Fábio Luz` — sont traités en premier : l'audit les donne pour **le défaut le plus grave du lot**."],"pt":["As três tabelas são esvaziadas por validação humana, não por script.","**Proibição absoluta**: descomentar o SQL de aplicação, completá-lo, ou passar `valide = true` em massa.","Os 9 pontos de acesso postos sobre um sufixo de filiação — tipo `FILHO, Fábio Luz` — são tratados primeiro: a auditoria os dá como **o defeito mais grave do lote**."]},"dep":{"fr":"Se fait dans l'application, sans migration. C'est un chantier de bibliothéconomie, ouvert à qui sait cataloguer.","pt":"Faz-se no aplicativo, sem migração. É um canteiro de biblioteconomia, aberto a quem sabe catalogar."},"r":["AUDIT_conventions_catalographiques_2026-08-20","REGISTRE §37 CONV"]},{"id":"C4","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Renseigner les pays manquants sur 722 fiches d'autorité","pt":"Preencher os países ausentes em 722 fichas de autoridade"},"v":{"fr":"**722 fiches sur 1 305 (55 %) n'ont pas de `country`.** Or c'est `country` qui pilote la règle d'entrée du nom : sans lui, la détection des doubles patronymes hispaniques ne voit qu'une fraction des cas. Les 22 signalements sont un **plancher**, pas un total.","pt":"**722 fichas de 1 305 (55 %) não têm `country`.** Ora, é `country` que comanda a regra de entrada do nome: sem ele, a detecção dos duplos sobrenomes hispânicos só vê uma fração dos casos. Os 22 apontamentos são um **piso**, não um total."},"w":{"fr":"Renseigner `country` par lots, à partir des notices, des sources externes déjà branchées (Wikidata, VIAF) et de la connaissance du fonds. Puis rejouer la détection des patronymes.","pt":"Preencher `country` por lotes, a partir dos registros, das fontes externas já conectadas (Wikidata, VIAF) e do conhecimento do acervo. Depois reexecutar a detecção dos sobrenomes."},"y":{"fr":"C'est le prérequis dur de toute la chaîne de conventions : `CONV-7` fait de `country` en ISO 3166-1 α-2 une condition, et `CONV-3` fait piloter la casse par la langue. Un catalogue à 55 % sans pays applique ses propres règles à moitié.","pt":"É o pré-requisito duro de toda a cadeia de convenções: `CONV-7` faz de `country` em ISO 3166-1 α-2 uma condição, e `CONV-3` faz a caixa ser comandada pela língua. Um catálogo com 55 % sem país aplica as próprias regras pela metade."},"f":{"fr":["La proportion de fiches sans `country` est descendue sous 20 %.","La détection des doubles patronymes a été rejouée et la nouvelle liste est passée en revue humaine."],"pt":["A proporção de fichas sem `country` caiu abaixo de 20 %.","A detecção dos duplos sobrenomes foi reexecutada e a nova lista passou por revisão humana."]},"dep":{"fr":"Prérequis de la seconde passe de **C3**.","pt":"Pré-requisito da segunda passagem de **C3**."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A5","REGISTRE §37 CONV-7"]},{"id":"C5","d":"C","p":"P2","s":"decision","e":"S","sk":["biblio","sql"],"t":{"fr":"Trancher le sort du champ libre `books.autor`","pt":"Decidir o destino do campo livre `books.autor`"},"v":{"fr":"`CONV-O3` est ouvert : déprécier `books.autor` maintenant, ou à l'Atelier ? Le champ coexiste avec la table `authors` et porte les mêmes défauts **en pire** — on y trouve `identificado, Não`, `REICH, Hilhem`, `Rosamund Bartlett (Org.)`. L'audit du 20/08 l'a explicitement laissé hors périmètre : sa dette n'est pas chiffrée.","pt":"`CONV-O3` está aberto: depreciar `books.autor` agora, ou na Oficina? O campo coexiste com a tabela `authors` e carrega os mesmos defeitos **piores** — encontram-se lá `identificado, Não`, `REICH, Hilhem`, `Rosamund Bartlett (Org.)`. A auditoria de 20/08 o deixou explicitamente fora do perímetro: sua dívida não está quantificada."},"w":{"fr":"D'abord chiffrer : combien de notices ont un `autor` sans contributeur lié, et à quoi ressemble le contenu. Puis trancher : dépréciation immédiate avec migration des valeurs récupérables, ou conservation comme forme transcrite au sens de `P3` des périodiques.","pt":"Primeiro quantificar: quantos registros têm um `autor` sem contribuidor vinculado, e como é o conteúdo. Depois decidir: depreciação imediata com migração dos valores recuperáveis, ou conservação como forma transcrita no sentido do `P3` dos periódicos."},"y":{"fr":"Deux vérités concurrentes sur l'auteur d'un livre, c'est le contraire de `DOC-CONV-1` (« une seule vérité en base, plusieurs rendus »). Tant que le champ vit, chaque écran doit choisir lequel afficher, et les deux divergent.","pt":"Duas verdades concorrentes sobre o autor de um livro é o contrário de `DOC-CONV-1` («uma só verdade no banco, várias renderizações»). Enquanto o campo viver, cada tela precisa escolher qual exibir, e os dois divergem."},"f":{"fr":["La dette est chiffrée.","Une décision est inscrite au REGISTRE, dans un sens ou dans l'autre.","Si dépréciation : le champ n'est plus écrit par aucun formulaire."],"pt":["A dívida está quantificada.","Uma decisão está inscrita no REGISTRO, num sentido ou no outro.","Se depreciação: o campo não é mais escrito por nenhum formulário."]},"dep":{"fr":"Renvoie à `INV-4`.","pt":"Remete a `INV-4`."},"r":["REGISTRE §37 CONV-O3","AUDIT_conventions_catalographiques_2026-08-20"]},{"id":"C6","d":"C","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Livrer les trois assistances de saisie prévues par la spec des conventions","pt":"Entregar as três assistências de digitação previstas pela spec das convenções"},"v":{"fr":"La base sait normaliser ; l'interface de saisie n'assiste pas encore. Trois dispositifs sont spécifiés et non livrés : l'assistant de découpage du nom (§7.1), le bouton « Normalizar maiúsculas » avec aperçu (§7.2), et la file de contrôles de cohérence en arrière-plan (§7.3).","pt":"O banco sabe normalizar; a interface de digitação ainda não assiste. Três dispositivos estão especificados e não entregues: o assistente de separação do nome (§7.1), o botão «Normalizar maiúsculas» com pré-visualização (§7.2), e a fila de controles de coerência em segundo plano (§7.3)."},"w":{"fr":"Trois écrans, dans cet ordre de valeur : le bouton de normalisation de casse (le plus simple, actif seulement si la langue est renseignée) ; l'assistant de découpage, qui propose mot par mot avec un bouton « Corrigir » et une explication d'une ligne ; la file de contrôles, qui signale sans bloquer.","pt":"Três telas, nesta ordem de valor: o botão de normalização de caixa (o mais simples, ativo só se a língua estiver preenchida); o assistente de separação, que propõe palavra por palavra com um botão «Corrigir» e uma explicação de uma linha; a fila de controles, que sinaliza sem bloquear."},"y":{"fr":"C'est la contrainte de conception la plus ferme du projet : **toute règle doit être soit invisible parce que calculée, soit assistée parce que proposée et confirmée, jamais un savoir préalable exigé à la saisie.** Les personnes qui cataloguent ne sont ni bibliothécaires ni informaticiennes. Sans ces trois écrans, les conventions restent une doctrine que seul leur auteur sait appliquer.","pt":"É a restrição de concepção mais firme do projeto: **toda regra deve ser ou invisível porque calculada, ou assistida porque proposta e confirmada, nunca um saber prévio exigido na digitação.** As pessoas que catalogam não são bibliotecárias nem informáticas. Sem essas três telas, as convenções continuam uma doutrina que só seu autor sabe aplicar."},"f":{"fr":["Les trois dispositifs existent et **aucun n'est bloquant**.","Chaque proposition est refusable, avec l'original conservé.","Les libellés existent dans les dix locales en une seule passe."],"pt":["Os três dispositivos existem e **nenhum é bloqueante**.","Cada proposta é recusável, com o original conservado.","Os rótulos existem nas dez locales numa só passagem."]},"dep":{"fr":"S'appuie sur les migrations `conventions_*` déjà en place.","pt":"Apoia-se nas migrações `conventions_*` já em vigor."},"r":["spec-conventions-catalographiques-v0.1 §7"]},{"id":"C7","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio","aucune"],"t":{"fr":"Indexer par matière les 1 549 notices qui n'ont aucun sujet","pt":"Indexar por assunto os 1 549 registros que não têm nenhum assunto"},"v":{"fr":"Vérifié le 29/08 : **1 127 notices indexées sur 2 676**, soit 42 %. 1 284 affectations réparties sur 89 sujets locaux. Côté public anonyme, la couverture est encore plus basse.","pt":"Verificado em 29/08: **1 127 registros indexados de 2 676**, ou seja 42 %. 1 284 atribuições distribuídas em 89 assuntos locais. Do lado público anônimo, a cobertura é ainda mais baixa."},"w":{"fr":"Indexer, notice par notice, avec le vocabulaire local et le thésaurus FICEDL déjà chargé. Aucune compétence technique : c'est un travail de bibliothèque, fait depuis l'application.","pt":"Indexar, registro por registro, com o vocabulário local e o tesauro FICEDL já carregado. Nenhuma competência técnica: é um trabalho de biblioteca, feito a partir do aplicativo."},"y":{"fr":"Un catalogue à 42 % d'indexation ne se parcourt pas : il se cherche par titre, ce qui suppose de savoir ce qu'on cherche. Le sujet est le seul chemin d'entrée pour quelqu'un qui vient voir ce qu'il y a sur une question. Et le thésaurus étant traduit en dix langues, chaque affectation vaut simultanément pour les dix.","pt":"Um catálogo com 42 % de indexação não se percorre: busca-se por título, o que pressupõe saber o que se procura. O assunto é o único caminho de entrada para quem vem ver o que há sobre uma questão. E, como o tesauro está traduzido em dez línguas, cada atribuição vale simultaneamente para as dez."},"f":{"fr":["La couverture dépasse 70 % des notices publiques.","Le sujet parasite `pierre-joseph-proudhon` (0 livre) est supprimé, et `anarcocomunismo` est vérifié.","Les huit sujets AnarBib sans équivalent FICEDL restent rattachés à un terme plus large et sont **portés à la fédération comme contribution, pas comme plainte** : éducation libertaire (64 livres), abolitionnisme pénal (13), écologie sociale (10), anarcha-féminisme, communisme libertaire, anarcho-punk, especifismo, cabanagem."],"pt":["A cobertura passa de 70 % dos registros públicos.","O assunto parasita `pierre-joseph-proudhon` (0 livro) é suprimido, e `anarcocomunismo` é verificado.","Os oito assuntos AnarBib sem equivalente FICEDL continuam vinculados a um termo mais amplo e são **levados à federação como contribuição, não como queixa**: educação libertária (64 livros), abolicionismo penal (13), ecologia social (10), anarcafeminismo, comunismo libertário, anarcopunk, especifismo, cabanagem."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["AnarBib-Backlog-2026-06-17-v33 §5","ETAT-lancement-consolide-2026-07-03 §2 item 6"]},{"id":"C8","d":"C","p":"P3","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Enrichir les autorités : dates, identifiants externes, formes variantes","pt":"Enriquecer as autoridades: datas, identificadores externos, formas variantes"},"v":{"fr":"Sur 1 305 autorités : **726 (56 %) sans date de naissance**, environ **1 272 (98 %) sans identifiant VIAF, ISNI ou Wikidata**, environ **1 275 (98 %) sans `variant_forms`**. Le code d'enrichissement existe et fonctionne ; la couverture est de l'ordre de 1 à 2 %.","pt":"De 1 305 autoridades: **726 (56 %) sem data de nascimento**, cerca de **1 272 (98 %) sem identificador VIAF, ISNI ou Wikidata**, cerca de **1 275 (98 %) sem `variant_forms`**."},"w":{"fr":"Passes d'enrichissement par les sources déjà branchées, avec relecture. Les pseudonymes militants sont un cas à part : l'entrée se fait à la forme la plus connue du mouvement, avec renvoi depuis le nom civil, **jamais l'inverse**.","pt":"Passagens de enriquecimento pelas fontes já conectadas, com revisão. Os pseudônimos militantes são um caso à parte: a entrada se faz pela forma mais conhecida do movimento, com remissão a partir do nome civil, **nunca o contrário**."},"y":{"fr":"Les identifiants externes sont ce qui permettra à un autre catalogue de reconnaître nos autorités sans les redécrire. Les formes variantes sont ce qui permet de trouver quelqu'un sous le nom qu'on connaît. Et pour un pseudonyme militant, la forme d'usage **porte souvent la seule trace d'une répression** : elle ne s'écrase pas.","pt":"Os identificadores externos são o que permitirá a outro catálogo reconhecer nossas autoridades sem redescrevê-las. As formas variantes são o que permite encontrar alguém sob o nome que se conhece. E para um pseudônimo militante, a forma de uso **carrega frequentemente o único rastro de uma repressão**: não se sobrescreve."},"f":{"fr":["La couverture en identifiants externes dépasse 20 % sur les autorités les plus citées.","Aucun pseudonyme militant n'a été remplacé par un nom civil."],"pt":["A cobertura em identificadores externos passa de 20 % nas autoridades mais citadas.","Nenhum pseudônimo militante foi substituído por um nome civil."]},"dep":{"fr":"Après **C4** (les pays aident les alignements).","pt":"Depois de **C4** (os países ajudam os alinhamentos)."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A7-A9","REGISTRE §12 CAT-D6"]},{"id":"C9","d":"C","p":"P2","s":"decision","e":"S","sk":["biblio"],"t":{"fr":"Fermer les huit questions ouvertes des conventions catalographiques","pt":"Fechar as oito questões abertas das convenções catalográficas"},"v":{"fr":"`CONV-6` reste « à confirmer » et `CONV-O1` à `CONV-O8` sont ouverts. Deux d'entre eux portent du travail chiffré : `CONV-O7` (le type d'autorité existe mais reste illisible par le SQL — **16 verdicts de collectivités restent à poser**) et `CONV-O8` (la scission d'autorité n'existe pas — **3 découpages restent**).","pt":"`CONV-6` continua «a confirmar» e `CONV-O1` a `CONV-O8` estão abertos. Dois deles carregam trabalho quantificado: `CONV-O7` (o tipo de autoridade existe mas continua ilegível pelo SQL — **16 vereditos de coletividades faltam**) e `CONV-O8` (a cisão de autoridade não existe — **3 separações faltam**)."},"w":{"fr":"Trancher les huit en une session, en s'aidant du fonds réel : `name_lang` distinct de `country` ou non, conventions des collectivités, sort de `books.autor` (voir **C5**), critère de bascule EDTF, périmètre de l'écran de vérification, et les deux lots manuels.","pt":"Decidir as oito numa sessão, apoiando-se no acervo real: `name_lang` distinto de `country` ou não, convenções das coletividades, destino de `books.autor` (ver **C5**), critério de mudança para EDTF, perímetro da tela de verificação, e os dois lotes manuais."},"y":{"fr":"La colonne `name_lang` a été créée nullable et sans contrainte validée : **la créer n'engage rien, l'utiliser oui**. Tant que la question reste ouverte, chaque nouvelle règle d'entrée doit se demander sur quoi elle s'appuie.","pt":"A coluna `name_lang` foi criada anulável e sem restrição validada: **criá-la não compromete nada, usá-la sim**. Enquanto a questão ficar aberta, cada nova regra de entrada precisa se perguntar em que se apoia."},"f":{"fr":["Les huit ont un verdict au REGISTRE.","Les 16 collectivités et les 3 découpages sont traités à la main — ils sont explicitement **non automatisables**."],"pt":["As oito têm um veredicto no REGISTRO.","As 16 coletividades e as 3 separações são tratadas à mão — são explicitamente **não automatizáveis**."]},"dep":{"fr":"Éclaire **C6**.","pt":"Esclarece **C6**."},"r":["REGISTRE §37 CONV-6, CONV-O1..O8"]},{"id":"C10","d":"C","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Renommer l'une des deux colonnes `rights_status`","pt":"Renomear uma das duas colunas `rights_status`"},"v":{"fr":"`digital_assets.rights_status` est un **état de workflow** (`to_review`, `public_domain_confirmed`) qui commande la visibilité. Le vocabulaire des droits d'auteur porte le même nom depuis la migration `20260820235000_vocabulaire_rights_status`. Deux sens, un nom.","pt":"`digital_assets.rights_status` é um **estado de workflow** (`to_review`, `public_domain_confirmed`) que comanda a visibilidade. O vocabulário de direitos autorais leva o mesmo nome desde a migração `20260820235000_vocabulaire_rights_status`. Dois sentidos, um nome."},"w":{"fr":"Renommer la colonne de workflow — `review_state` par exemple — et propager au front et aux RPC. Le vocabulaire des droits garde le nom, puisque c'est lui qui parle de droits.","pt":"Renomear a coluna de workflow — `review_state` por exemplo — e propagar ao front e às RPC. O vocabulário de direitos guarda o nome, já que é ele que fala de direitos."},"y":{"fr":"Confusion garantie sinon, et sur un sujet où la confusion se paie : c'est l'état des droits qui décide si un document est visible du public. Un piège documenté s'y ajoute — `access_scope` vaut `conta_ativa` **par défaut**, si bien qu'un document du domaine public reste réservé aux comptes actifs tant que personne n'a posé `publico` explicitement.","pt":"Confusão garantida do contrário, e num assunto em que a confusão se paga: é o estado dos direitos que decide se um documento é visível ao público. Uma armadilha documentada se acrescenta — `access_scope` vale `conta_ativa` **por omissão**, de modo que um documento de domínio público continua reservado às contas ativas enquanto ninguém tiver posto `publico` explicitamente."},"f":{"fr":["Les deux notions portent deux noms distincts, en base et à l'écran.","Le piège `access_scope` est rappelé dans le formulaire de catalogage, pas seulement dans une note."],"pt":["As duas noções levam dois nomes distintos, no banco e na tela.","A armadilha `access_scope` é lembrada no formulário de catalogação, não só numa nota."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["PLAN_DE_MARCHE §8","DECISION_profil_numerisation_2026-08-20"]},{"id":"D1","d":"D","p":"P1","s":"a-verifier","e":"S","sk":["biblio","sql"],"t":{"fr":"Réviser la spec des périodiques contre ce qui a été livré","pt":"Revisar a spec dos periódicos contra o que foi entregue"},"v":{"fr":"`spec-periodiques-v0.1` (27/08) annonce « neuf paquets à livrer ». **Les neuf ont été livrés les 27 et 28/08**, en une journée : `serials`, RPC, anti-faux-doublons, état de collection, entrée dans l'Atelier, reprise des notices existantes, UI de catalogage, page publique, et les libellés dans les dix langues. La base porte 4 titres et 7 fascicules rattachés.","pt":"`spec-periodiques-v0.1` (27/08) anuncia «nove pacotes a entregar». **Os nove foram entregues em 27 e 28/08**, num dia: `serials`, RPC, anti-falsos-duplicados, estado de coleção, entrada na Oficina, retomada dos registros existentes, UI de catalogação, página pública, e os rótulos nas dez línguas."},"w":{"fr":"Relire la spec, marquer les neuf paquets comme livrés, puis vérifier une par une les six gardes annoncées — anti-cycle de filiation borné à 20 sauts, réciprocité prédécesseur/successeur par trigger, interdiction de `serial_id` sur un non-fascicule, symétrie de l'importeur face à la colonne générée, fusion des états de collection sans écrasement, ordre de tri.","pt":"Reler a spec, marcar os nove pacotes como entregues, depois verificar uma a uma as seis guardas anunciadas — anticiclo de filiação limitado a 20 saltos, reciprocidade predecessor/sucessor por trigger, proibição de `serial_id` num não-fascículo, simetria do importador diante da coluna gerada, fusão dos estados de coleção sem sobrescrita, ordem de classificação."},"y":{"fr":"Une spec qui dit « à livrer » sur du code livré fait exactement le dégât inverse d'une spec en retard : elle fait refaire. Et les six gardes sont ce qui distingue un sous-système qui tient d'un sous-système qui casse au premier import de masse.","pt":"Uma spec que diz «a entregar» sobre código entregue causa exatamente o dano inverso de uma spec atrasada: faz refazer. E as seis guardas são o que distingue um subsistema que aguenta de um subsistema que quebra na primeira importação em massa."},"f":{"fr":["La spec passe en v1.0 et décrit l'état livré.","Les six gardes sont vérifiées en base, avec le résultat écrit.","La garde `G2` (réciprocité) est bien un trigger : « la discipline ne survit pas à six mois »."],"pt":["A spec passa a v1.0 e descreve o estado entregue.","As seis guardas estão verificadas no banco, com o resultado escrito.","A guarda `G2` (reciprocidade) é de fato um trigger: «a disciplina não sobrevive a seis meses»."]},"dep":{"fr":"Prérequis de **D2**.","pt":"Pré-requisito de **D2**."},"r":["spec-periodiques-v0.1 §11 §14","Migrations 20260827163000 à 20260827210000"]},{"id":"D2","d":"D","p":"P2","s":"decision","e":"S","sk":["biblio"],"t":{"fr":"Trancher les cinq questions restées ouvertes sur les périodiques","pt":"Decidir as cinco questões que ficaram abertas sobre os periódicos"},"v":{"fr":"Cinq arbitrages étaient laissés en attente dans la spec, avec un penchant écrit pour chacun : vocabulaire de `periodicidade` libre ou fermé ; filiation n-n ou deux liens simples ; `serials` doit-elle porter un `library_id` ; promotion automatique d'un titre proposé ; page publique dédiée ou facette.","pt":"Cinco arbitragens ficaram pendentes na spec, com uma inclinação escrita para cada uma: vocabulário de `periodicidade` livre ou fechado; filiação n-n ou dois vínculos simples; `serials` deve levar um `library_id`; promoção automática de um título proposto; página pública dedicada ou faceta."},"w":{"fr":"Les trancher sur des cas réels plutôt que dans l'abstrait — le fonds Anarchief (une centaine de titres depuis 1860) et le fonds SOLIDAIRES (12 titres, 91 fascicules) sont la matière à éprouver.","pt":"Decidi-las sobre casos reais em vez de no abstrato — o acervo Anarchief (cerca de cem títulos desde 1860) e o acervo SOLIDAIRES (12 títulos, 91 fascículos) são a matéria para testar."},"y":{"fr":"Deux des cinq sont déjà tranchés de fait par le code livré (page dédiée `/periodico/<slug>`, pas de `library_id`). Les laisser « ouverts » au REGISTRE alors que le code a choisi crée exactement le genre d'écart que ce backlog corrige.","pt":"Duas das cinco já estão decididas de fato pelo código entregue (página dedicada `/periodico/<slug>`, sem `library_id`). Deixá-las «abertas» no REGISTRO enquanto o código escolheu cria exatamente o tipo de desvio que este backlog corrige."},"f":{"fr":["Les cinq ont un verdict inscrit, en accord avec le code livré ou en le corrigeant.","La promotion d'un titre reste **un geste et non un seuil** — c'était le penchant, et il vaut d'être confirmé."],"pt":["As cinco têm um veredicto inscrito, de acordo com o código entregue ou corrigindo-o.","A promoção de um título continua **um gesto e não um limiar** — era a inclinação, e vale confirmá-la."]},"dep":{"fr":"Après **D1**.","pt":"Depois de **D1**."},"r":["spec-periodiques-v0.1 §13"]},{"id":"D3","d":"D","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Rattacher les 91 fascicules et les 87 monographies suspectes de SOLIDAIRES","pt":"Vincular os 91 fascículos e as 87 monografias suspeitas de SOLIDAIRES"},"v":{"fr":"Le fichier SOLIDAIRES porte déjà des colonnes `revue` et `numero` : **12 titres à créer, 91 fascicules à lier**. En plus, **87 monographies portent « n° » dans leur titre** et sont marquées par un drapeau `numero_dans_titre` : ce sont des candidates au rattachement.","pt":"O arquivo SOLIDAIRES já traz colunas `revue` e `numero`: **12 títulos a criar, 91 fascículos a vincular**. Além disso, **87 monografias trazem «n°» no título** e estão marcadas por uma flag `numero_dans_titre`: são candidatas ao vínculo."},"w":{"fr":"Créer les 12 titres, lier les 91 fascicules, puis **soumettre** les 87 candidates à quelqu'un qui connaît le fonds. Ne pas les rattacher automatiquement.","pt":"Criar os 12 títulos, vincular os 91 fascículos, depois **submeter** as 87 candidatas a alguém que conheça o acervo. Não vinculá-las automaticamente."},"y":{"fr":"Un titre qui contient « n° » n'est pas toujours un fascicule — c'est parfois un titre de collection, parfois une coquille. Le drapeau signale, il ne décide pas. Et le réseau ne compte aujourd'hui que 4 titres de périodiques : ce lot les multiplierait par quatre, et éprouverait le sous-système pour de bon.","pt":"Um título que contém «n°» nem sempre é um fascículo — às vezes é um título de coleção, às vezes um erro de digitação. A flag sinaliza, não decide. E a rede conta hoje apenas 4 títulos de periódicos: este lote os multiplicaria por quatro, e testaria o subsistema de verdade."},"f":{"fr":["Les 12 titres existent et les 91 fascicules y sont rattachés.","Les 87 candidates ont été soumises, et chaque verdict est humain.","Le comportement observé sur les quatre notices *Encontros com a Civilização brasileira* confirme la règle anti-faux-doublons : deux paires en sortent, deux y restent."],"pt":["Os 12 títulos existem e os 91 fascículos estão vinculados.","As 87 candidatas foram submetidas, e cada veredicto é humano.","O comportamento observado nos quatro registros *Encontros com a Civilização brasileira* confirma a regra antifalsos-duplicados: dois pares saem, dois ficam."]},"dep":{"fr":"Après **C2** et **D1**.","pt":"Depois de **C2** e **D1**."},"r":["spec-periodiques-v0.1 §10","REPRISE_claude_code_2026-08-27"]},{"id":"D4","d":"D","p":"P1","s":"ouvert","e":"XL","sk":["biblio","front","collectif"],"t":{"fr":"Le matériel éphémère : tracts, affiches, autocollants, zines","pt":"O material efêmero: panfletos, cartazes, adesivos, fanzines"},"v":{"fr":"Rien n'existe. Le modèle de notice hérité de la bibliothéconomie du livre ne sait pas décrire ce matériel, et AnarBib ne fait pas exception. C'est le besoin **le plus mal couvert**, pour une part énorme de nos fonds.","pt":"Nada existe. O modelo de registro herdado da biblioteconomia do livro não sabe descrever esse material, e o AnarBib não é exceção. É a necessidade **pior atendida**, para uma parte enorme dos nossos acervos."},"w":{"fr":"Ce matériel n'a ni ISBN, ni éditeur, souvent ni auteur ni titre. Il est visuel autant que textuel : une affiche ne se résume pas à son océrisation. Le chantier commence par de la réflexion documentaire — que décrit-on, avec quoi, et pour qui — avant toute table.","pt":"Este material não tem ISBN, nem editora, frequentemente nem autor nem título. É visual tanto quanto textual: um cartaz não se resume à sua ocerização. O canteiro começa por reflexão documental — o que se descreve, com quê, e para quem — antes de qualquer tabela."},"y":{"fr":"C'est ce que les bibliothèques militantes ont de plus spécifique et de moins outillé. Les vocabulaires d'éphémères construits ailleurs — NORLA, avec ses facettes *Tactics* et *Social Movement* — sont **monolingues** et sans lien avec le thésaurus FICEDL : il y a là un travail commun à faire, pas un module à écrire seul.","pt":"É o que as bibliotecas militantes têm de mais específico e menos aparelhado. Os vocabulários de efêmeros construídos alhures — NORLA, com suas facetas *Tactics* e *Social Movement* — são **monolíngues** e sem vínculo com o tesauro FICEDL: há aí um trabalho comum a fazer, não um módulo a escrever sozinho."},"f":{"fr":["Un cadrage documentaire écrit, discuté avec au moins un autre fonds.","Un modèle minimal éprouvé sur cinquante pièces réelles.","**Ce n'est pas un chantier pour quelqu'un qui veut seulement écrire des fonctions.**"],"pt":["Um enquadramento documental escrito, discutido com pelo menos um outro acervo.","Um modelo mínimo testado em cinquenta peças reais.","**Não é um canteiro para quem só quer escrever funções.**"]},"dep":{"fr":"À relier à **H6** (alignement des vocabulaires militants) et à la rencontre de Bologne.","pt":"A ligar a **H6** (alinhamento dos vocabulários militantes) e ao encontro de Bolonha."},"r":["docs/CHANTIERS_OUVERTS.md §3","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"D5","d":"D","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Éprouver la chaîne de numérisation sur dix ouvrages avant d'équiper qui que ce soit","pt":"Testar a cadeia de digitalização em dez obras antes de equipar quem quer que seja"},"v":{"fr":"La règle est actée et tient en une phrase : « on capture en niveaux de gris, on livre en bitonal, on ne garde en ligne que ce qui est livré ». Les plafonds de buckets sont posés en production. **L'outil de dérivation n'est pas choisi**, et la fiche pratique d'une page n'est pas écrite.","pt":"A regra está registrada e cabe numa frase: «captura-se em tons de cinza, entrega-se em bitonal, só se mantém on-line o que é entregue». Os tetos dos buckets estão em produção. **A ferramenta de derivação n
