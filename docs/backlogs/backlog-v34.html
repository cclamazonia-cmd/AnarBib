 et deux personnes ne peuvent pas y travailler en même temps sans conflit. C'est un obstacle à la contribution avant d'être un problème de performance.","pt":"Um arquivo de 197 KB não é relegível por quem chega, e duas pessoas não podem trabalhar nele ao mesmo tempo sem conflito. É um obstáculo à contribuição antes de ser um problema de performance."},"f":{"fr":["Aucun fichier de `src/` ne dépasse 60 Ko.","Le comportement est inchangé, vérifié écran par écran.","Découpage par lots, un écran à la fois, jamais une refonte."],"pt":["Nenhum arquivo de `src/` passa de 60 KB.","O comportamento está inalterado, verificado tela por tela.","Divisão por lotes, uma tela por vez, nunca uma refundação."]},"dep":{"fr":"Reprend `#PERF-accountpage-split`, hérité du v32.","pt":"Retoma `#PERF-accountpage-split`, herdado do v32."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.5","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — les cinq mêmes fichiers, aux tailles voisines : `BookDraftForm.jsx` 197 Ko, `BibliotecaPage.jsx` 186 Ko, `AccountPage.jsx` 155 Ko, `PanelPage.jsx` 116 Ko, `ImportacoesPage.jsx` 111 Ko.","pt":"31/08 — os cinco mesmos arquivos, com tamanhos vizinhos (197, 186, 155, 116 e 111 KB)."}},{"id":"E9","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Finir la mise en page mobile : trois lots identifiés","pt":"Terminar o layout móvel: três lotes identificados"},"v":{"fr":"Les phases A, B et C sont livrées et la doctrine graduée est actée. Trois questions restent ouvertes au REGISTRE : `MOB-Q1` (24 grilles déclarées en ligne dans le JSX avec des pistes `fr` nues), `MOB-Q2` (20 requêtes de média héritées à rapatrier dans `src/styles/mobile.css`), `MOB-Q3` (les onglets Validações et Inventário à convertir en cartes).","pt":"As fases A, B e C estão entregues e a doutrina graduada está registrada. Três questões continuam abertas no REGISTRO: `MOB-Q1` (24 grades declaradas em linha no JSX com trilhas `fr` nuas), `MOB-Q2` (20 media queries herdadas a repatriar em `src/styles/mobile.css`), `MOB-Q3` (as abas Validações e Inventário a converter em cartões)."},"w":{"fr":"Trois passes mécaniques, dans cet ordre de valeur : les 24 grilles (`minmax(0, Nfr)` partout, c'est la règle `MOB-1`), les deux onglets en cartes selon le patron livré, puis le rapatriement des requêtes de média.","pt":"Três passagens mecânicas, nesta ordem de valor: as 24 grades (`minmax(0, Nfr)` em toda parte, é a regra `MOB-1`), as duas abas em cartões segundo o padrão entregue, depois o repatriamento das media queries."},"y":{"fr":"Une piste `fr` nue déborde dès que son contenu est plus large que la colonne, et un débordement **se constate par la mesure, jamais à l'œil** (`MOB-9`). Les 24 grilles sont autant de débordements en attente d'un titre long.","pt":"Uma trilha `fr` nua transborda assim que seu conteúdo é mais largo que a coluna, e um transbordamento **se constata pela medida, nunca a olho** (`MOB-9`). As 24 grades são outros tantos transbordamentos à espera de um título longo."},"f":{"fr":["~~Aucune grille du JSX ne porte de piste `fr` nue~~ — 31/08 : plus une seule, la dernière occurrence est un commentaire qui rappelle la règle.","Les deux onglets sont en cartes sous 640 px.","~~Les requêtes de média héritées vivent dans `mobile.css`~~ — les 20 héritées y sont ; les 8 restantes ont chacune une raison d'être ailleurs (4 dans des documents engendrés — étiquettes, gazette, impression du catalogue — dont le CSS d'impression voyage avec le document ; 1 dans `breakpoints.css`, la source canonique des paliers ; 1 dans le CSS du composant tabbar, aligné sur le palier 640). Verdict du 31/08."],"pt":["~~Nenhuma grade do JSX traz trilha `fr` nua~~ — 31/08: nenhuma resta, a última ocorrência é um comentário.","As duas abas estão em cartões abaixo de 640 px.","~~As media queries herdadas vivem em `mobile.css`~~ — as 20 herdadas estão lá; as 8 restantes têm cada uma razão de estar onde estão (documentos gerados, fonte canônica dos breakpoints, componente tabbar). Veredito de 31/08."]},"dep":{"fr":"Aucune. Chantier découpable en trois.","pt":"Nenhuma. Canteiro divisível em três."},"r":["REGISTRE §36 MOB-Q1..Q3"],"verif":{"fr":"31/08 — `MOB-Q1` est soldée dans le code : sur 49 pistes `1fr` du JSX, toutes sont en `minmax(0,1fr)` sauf un commentaire qui énonce la règle (`AtelierAutoridadesPage.jsx:278`). `MOB-Q2` a fondu : 8 requêtes de média hors `mobile.css` (2 dans `breakpoints.css`, 1 dans `tabbar.css`, 5 dans le JSX) au lieu des 20 citées. `MOB-Q3` non mesuré. Verdict posé le soir même sur `MOB-Q2` : rien à rapatrier, chaque requête restante est à sa place (voir le critère barré). Reste `MOB-Q3`.","pt":"31/08 — `MOB-Q1` está saldada no código: das 49 trilhas `1fr` do JSX, todas em `minmax(0,1fr)` salvo um comentário. `MOB-Q2` derreteu: 8 media queries fora de `mobile.css` em vez de 20. `MOB-Q3` não medido. Veredito posto na mesma noite sobre `MOB-Q2`: nada a repatriar. Resta `MOB-Q3`."}},{"id":"E10","d":"E","p":"P3","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Le reste du socle terrain : permanence mobile, notification poussée, planche de codes","pt":"O resto da base de campo: plantão móvel, notificação push, prancha de códigos"},"v":{"fr":"Le socle terrain est livré : application installable, lecture de codes QR et ISBN, récolement, mise en page adaptative. Trois éléments restent, hérités du v32 et non revérifiés depuis : la permanence mobile (P3), la notification poussée (P5), et la planche de codes QR au format A4.","pt":"A base de campo está entregue: aplicativo instalável, leitura de códigos QR e ISBN, inventário, layout adaptativo. Três elementos restam, herdados do v32 e não reverificados desde então: o plantão móvel (P3), a notificação push (P5), e a prancha de códigos QR em formato A4."},"w":{"fr":"Commencer par vérifier lequel des trois est encore un manque réel. La notification poussée pose une question de fond avant une question de code : elle suppose un service tiers, ce que la doctrine anti-pistage regarde de près.","pt":"Começar verificando qual dos três ainda é uma falta real. A notificação push levanta uma questão de fundo antes de uma questão de código: pressupõe um serviço de terceiro, o que a doutrina antirrastreamento examina de perto."},"y":{"fr":"La planche A4 est la plus simple et la plus utile au comptoir : elle permet d'étiqueter un fonds sans imprimante à étiquettes. Les deux autres méritent d'abord une conversation.","pt":"A prancha A4 é a mais simples e a mais útil no balcão: permite etiquetar um acervo sem impressora de etiquetas. As outras duas merecem primeiro uma conversa."},"f":{"fr":["La planche A4 existe et s'imprime correctement.","Pour la notification poussée, un verdict écrit : faisable sans tiers, ou renoncement assumé."],"pt":["A prancha A4 existe e imprime corretamente.","Para a notificação push, um veredicto escrito: viável sem terceiro, ou renúncia assumida."]},"dep":{"fr":"Hérité de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`.","pt":"Herdado de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.1"]},{"id":"F1","d":"F","p":"P1","s":"ouvert","e":"M","sk":["deno","sql"],"t":{"fr":"Auditer la chaîne de courriel de bout en bout","pt":"Auditar a cadeia de e-mail de ponta a ponta"},"v":{"fr":"**14 fonctions `notify-*` déployées**, cinq files d'attente, six déclencheurs de dépêche. Trois files n'ont jamais reçu la moindre insertion : `authority_proposal_notification_outbox`, `membership_expiry_notifications`, `painel_internal_task_invitation_outbox`. Une quatrième, `painel_internal_task_notification_outbox`, est vide après 34 insertions dont la dernière date du 04/06. Personne n'a jamais audité l'ensemble.","pt":"**14 funções `notify-*` implantadas**, cinco filas, seis gatilhos de despacho. Três filas nunca receberam uma única inserção: `authority_proposal_notification_outbox`, `membership_expiry_notifications`, `painel_internal_task_invitation_outbox`. Uma quarta, `painel_internal_task_notification_outbox`, está vazia após 34 inserções cuja última é de 04/06. Ninguém jamais auditou o conjunto."},"w":{"fr":"Dresser la carte : pour chaque événement métier, quel déclencheur, quelle file, quelle fonction, quel gabarit, quelles dix langues. Puis marquer les branches mortes et les branches jamais empruntées.","pt":"Traçar o mapa: para cada evento de negócio, qual gatilho, qual fila, qual função, qual template, quais dez línguas. Depois marcar os ramos mortos e os ramos nunca percorridos."},"y":{"fr":"Une notification qui ne part pas ne fait aucun bruit. C'est le même angle mort que les sauvegardes, et il a déjà mordu deux fois : les mails `retirada_efetivada`, `retirada_reagendada`, `retirada_no_show` et `liberada_para_circulacao` ont été signalés comme ne partant pas, sans que le diagnostic soit mené à son terme.","pt":"Uma notificação que não sai não faz barulho nenhum. É o mesmo ponto cego dos backups, e já mordeu duas vezes: os e-mails `retirada_efetivada`, `retirada_reagendada`, `retirada_no_show` e `liberada_para_circulacao` foram apontados como não saindo, sem que o diagnóstico fosse levado a termo."},"f":{"fr":["Une carte écrite, événement par événement.","Les quatre mails signalés comme non partants ont un verdict : corrigés, ou expliqués.","Les branches mortes sont supprimées ou documentées comme dormantes."],"pt":["Um mapa escrito, evento por evento.","Os quatro e-mails apontados como não enviados têm um veredicto: corrigidos, ou explicados.","Os ramos mortos são suprimidos ou documentados como dormentes."]},"dep":{"fr":"Prérequis de **F2** et **F3**.","pt":"Pré-requisito de **F2** e **F3**."},"r":["Mémoire de projet, reliquats de la chaîne courriel","AUDITORIA_NOTIFY_FUNCTIONS_2026-05-06"],"verif":{"fr":"31/08 — **15** fonctions `notify-*` déployées désormais, la quinzième (`notify-loan-cycle`) née le matin même avec F4. Les trois files jamais servies sont toujours à zéro insertion, et `painel_internal_task_notification_outbox` toujours vide après 34. Le périmètre grossit plus vite que l'audit.","pt":"31/08 — **15** funções `notify-*` implantadas, a décima quinta nascida no mesmo dia com F4. As três filas nunca servidas seguem a zero. O perímetro cresce mais rápido que a auditoria."}},{"id":"F3","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno"],"t":{"fr":"Consolider les fonctions de notification redondantes","pt":"Consolidar as funções de notificação redundantes"},"v":{"fr":"Quatre fonctions font des récapitulatifs : `notify-weekly-report`, `notify-network-weekly-report`, `notify-cross-library-digest`, `notify-rede-digest`. Trois fonctions servent des documents : `read-pdf`, `read-digital-asset`, `read-ill-shared-asset`. Deux exportent des lots : `export-catalog-lote`, `export-fonds-bundle`. Et `mail-i18n-test`, fonction de test, est déployée en production en version 1553.","pt":"Quatro funções fazem resumos: `notify-weekly-report`, `notify-network-weekly-report`, `notify-cross-library-digest`, `notify-rede-digest`. Três funções servem documentos: `read-pdf`, `read-digital-asset`, `read-ill-shared-asset`. Duas exportam lotes: `export-catalog-lote`, `export-fonds-bundle`. E `mail-i18n-test`, função de teste, está implantada em produção na versão 1553."},"w":{"fr":"Vérifier ce que chacune fait vraiment avant de conclure à la redondance — elles ont probablement des destinataires et des portées différentes. Puis fusionner ce qui doit l'être, et retirer `mail-i18n-test` de la production.","pt":"Verificar o que cada uma faz de fato antes de concluir pela redundância — provavelmente têm destinatários e alcances diferentes. Depois fundir o que deve sê-lo, e retirar `mail-i18n-test` da produção."},"y":{"fr":"48 fonctions déployées, c'est beaucoup à maintenir pour un projet à un mainteneur. Chacune porte son propre gabarit, ses propres dix langues, ses propres secrets. Ce n'est pas un problème de performance, c'est un problème de surface à relire.","pt":"48 funções implantadas é muito para manter num projeto com um mantenedor. Cada uma carrega seu próprio template, suas próprias dez línguas, seus próprios segredos. Não é um problema de performance, é um problema de superfície a revisar."},"f":{"fr":["Chaque groupe a un verdict : fusion, ou raison écrite de la séparation.","`mail-i18n-test` n'est plus déployée en production.","Le compte de fonctions déployées est à jour dans `CLAUDE.md` et dans `config.toml`."],"pt":["Cada grupo tem um veredicto: fusão, ou motivo escrito da separação.","`mail-i18n-test` não está mais implantada em produção.","A contagem de funções implantadas está atualizada em `CLAUDE.md` e em `config.toml`."]},"dep":{"fr":"Après **F1**. Attention : le déploiement de `notify-event` ne passe pas par MCP, son paquet est trop gros.","pt":"Depois de **F1**. Atenção: a implantação de `notify-event` não passa por MCP, seu pacote é grande demais."},"r":["PLAN_DE_MARCHE §8","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — `mail-i18n-test` est toujours déployée en production (version 1 566, retouchée le jour même par un déploiement groupé). Le dépôt compte 50 dossiers de fonctions hors `_shared`, et `config.toml` porte 38 déclarations `verify_jwt`.","pt":"31/08 — `mail-i18n-test` continua implantada (versão 1 566). O repositório tem 50 pastas de funções e 38 declarações `verify_jwt`."}},{"id":"F4","d":"F","p":"P1","s":"en-cours","e":"M","sk":["sql"],"t":{"fr":"Trois bibliothèques avaient activé des rappels que personne n'envoyait","pt":"Três bibliotecas tinham ativado lembretes que ninguém enviava"},"v":{"fr":"`spec-flux-emprunts.md` §10.2 prévoit des rappels à J-5, J-3 et le jour même, puis des relances à J+1, J+7 et J+30. **Aucun job dédié n'est identifiable** parmi les 36 crons ; le seul voisin est `anarbib-notify-mid-loan-reading-daily`, qui fait autre chose. `membership_expiry_notifications` n'a jamais reçu la moindre ligne.\n\n**Vérifié le 30/08 : le manque est confirmé.** Les onze crons dont le nom évoque une échéance ou une relance ont été relus un par un — cooptation, adhésions, invitations d'équipe, votes OAI, réservations, autorités, cercles, et `anarbib-peb-detect-overdue-daily` qui concerne le **prêt entre bibliothèques**, pas le prêt aux lectrices. **Aucun ne rappelle une échéance d'emprunt ni ne relance un retard.** Le doute est levé : ce n'est plus un item à vérifier, c'est une décision à prendre.\n\n**Instruit et livré le 31/08 — et le constat était encore trop petit.** Les rappels n'existaient pas, c'était établi. Ce qui ne l'était pas : **les interrupteurs qui les commandent, eux, existent**. `library_notification_policies` porte `loan_reminders_enabled` et `loan_overdue_enabled`, exposés dans `v_library_notification_context` — la vue que lit la pile courriel. En production, **les trois bibliothèques dotées d'une politique les ont à `true`** : non parce qu'elles les ont activés, mais parce qu'ils naissent activés (« Default : tous à `true` », §2.4). Trois bibliothèques se croyaient couvertes par un dispositif absent — cas *(a)* de `DOC-SILENCE-1`, et même mécanique que le privilège `anon` retourné le même jour.\n\n**La référence de l'item était fausse** : la règle n'est pas au §10.2 — qui dit « hors périmètre, dette à confirmer » — mais au **§2.4**. Les deux sections sont amendées.\n\n**Six moments deviennent trois** (`DOC-RAPPEL-1`) : J-3, le jour de l'échéance, J+7. Motif `OPS-8` — un signal qui se répète cesse d'être lu, et une lectrice émoussée ne referme pas un ticket, elle cesse d'emprunter.\n\n**Un quatrième envoi en remplace un autre.** `notify-mid-loan-reading` demandait « Como vai a leitura? » — une question à laquelle un courriel ne permet pas de répondre — **en portugais en dur**, quelle que soit la langue de la lectrice. À mi-parcours, on invite désormais à déposer une **note de lecture sous pseudonyme** dans le catalogue : `book_reading_notes` est construite, déployée, et n'avait jamais reçu une seule ligne, et l'écran d'écriture existe déjà sur la page de l'œuvre. Son cron est désactivé — garder les deux, ce serait deux courriels le même jour.\n\n**Livré** : EF `notify-loan-cycle` (quatre moments, dix locales, 120 chaînes), table `loan_cycle_notifications` avec unicité (item, moment) — sans elle un cron rejoué enverrait deux fois le même rappel —, interrupteur `reading_notes_invite_enabled` né en même temps que l'envoi qu'il gouverne, cron quotidien à 9h15 UTC, suite `rappels_echeance_tests.sql` (7 tests, dont un qui écrit).","pt":"`spec-flux-emprunts.md` §10.2 prevê lembretes em D-5, D-3 e no próprio dia, depois cobranças em D+1, D+7 e D+30. **Nenhum job dedicado é identificável** entre os 36 crons; o único vizinho é `anarbib-notify-mid-loan-reading-daily`, que faz outra coisa.\n\n**Verificado em 30/08: a falta está confirmada.** Os onze crons cujo nome evoca um vencimento ou uma cobrança foram relidos um a um. **Nenhum lembra um vencimento de empréstimo nem cobra um atraso.** A dúvida está levantada: já não é um item a verificar, é uma decisão a tomar.\n\n**Instruído e entregue em 31/08.** Os lembretes não existiam — mas **os interruptores que os comandam existiam**, e as três bibliotecas com política tinham-nos a `true` sem o saber. Seis momentos passam a **três** (`DOC-RAPPEL-1`). Um quarto envio substitui `notify-mid-loan-reading`, que perguntava «Como vai a leitura?» **em português fixo**: agora convida a deixar uma **nota de leitura sob pseudónimo** no catálogo. **Entregue**: EF `notify-loan-cycle`, tabela `loan_cycle_notifications` com unicidade (item, momento), suíte `rappels_echeance_tests.sql`."},"w":{"fr":"Voir la CI verte, déployer, puis **éprouver pour de bon** : créer un emprunt dont l'échéance tombe à J-3 et vérifier qu'un courriel part, dans la bonne langue, une seule fois. C'est la leçon d'`I5` : ne pas livrer un envoi sans l'avoir vu partir.","pt":"Ver a CI verde, implantar, depois **provar a sério**: criar um empréstimo com vencimento a J-3 e verificar que um e-mail parte, na língua certa, uma só vez."},"y":{"fr":"Le suivi de huit semaines de la formation BLMF prévoit qu'une consulta soit menée de bout en bout avec négociation réelle : c'est le moment où l'absence de rappel se verra. Autant le savoir avant.","pt":"O acompanhamento de oito semanas da formação BLMF prevê que uma consulta seja conduzida de ponta a ponta com negociação real: é o momento em que a ausência de lembrete aparecerá. Melhor saber antes."},"f":[{"fr":"~~Un verdict écrit~~ — ils n'existaient pas, et trois bibliothèques croyaient le contraire.","pt":"~~Um veredicto escrito~~."},{"fr":"~~Soit implémentés, soit la spec amendée~~ — les deux : spec ramenée à trois moments, puis implémentés.","pt":"~~Implementados ou spec emendada~~ — ambos."},{"fr":"Chaque interrupteur commande un envoi réel, et chaque envoi a son interrupteur.","pt":"Cada interruptor comanda um envio real."},{"fr":"Un rappel ne part **qu'une fois** par item et par moment.","pt":"Um lembrete parte **uma só vez**."},{"fr":"Un envoi a été **vu partir**, dans la langue de la destinataire.","pt":"Um envio foi **visto partir**, na língua da destinatária."}],"dep":{"fr":"Se vérifie en même temps que **F1**.","pt":"Verifica-se ao mesmo tempo que **F1**."},"r":["spec-flux-emprunts §2.4 et §10.2","REGISTRE DOC-RAPPEL-1, OPS-8, DOC-SILENCE-1","supabase/functions/notify-loan-cycle/","migration 20260831111700","tests/sql/rappels_echeance_tests.sql","public.book_reading_notes"],"verif":[{"fr":"31/08 — relevé en base (36 crons relus, aucun pour le prêt aux lectrices ; 3 bibliothèques avec les deux interrupteurs à `true` ; `book_reading_notes` à zéro ligne) et dans le dépôt (l'ancien mi-parcours écrit en portugais en dur, aucune colonne de blog nulle part). Livré le jour même ; **pas encore éprouvé en envoi réel**.","pt":"31/08 — levantamento em base e no repositório. Entregue no mesmo dia; **ainda não provado em envio real**."},{"fr":"16/09 — `loan_cycle_notifications` porte **un** envoi en septembre 2026 : le circuit a envoyé une fois pour de vrai. Reste à dire lequel (`moment`) et si c'est l'épreuve J-3 que l'item demandait.","pt":"16/09 — `loan_cycle_notifications` tem **um** envio em setembro de 2026: o circuito enviou uma vez de verdade. Falta dizer qual (`moment`) e se é a prova J-3 que o item pedia."}]},{"id":"G1","d":"G","p":"P0","s":"ouvert","e":"L","sk":["collectif","aucune"],"t":{"fr":"Emprunter les circuits construits et jamais utilisés","pt":"Percorrer os circuitos construídos e jamais usados"},"v":{"fr":"Vérifié le 29/08 : **62 tables métier n'ont jamais reçu la moindre insertion.** Sept blocs entiers sont concernés — assemblées du réseau (3 tables), notes de lecture (2), propositions et objections d'autorité (3), référentiels de catalogage `catalog_ref_*` (8 sur 9), gouvernance des profils de bibliothèque (4, **alors que deux crons tournent dessus toutes les quinze minutes**), délibération sur les demandes d'adhésion (5, dont `library_request_votes` et `library_request_messages`).\n\n**Remesuré le 31/08 : toujours 62, et ce n'est pas une bonne nouvelle.** Le compte n'a pas bougé en deux jours — 62 tables de `public` sur 189 n'ont jamais reçu la moindre insertion. Mais ce n'est pas la même liste : `loan_cycle_notifications`, née ce matin avec les rappels d'échéance, y est entrée **le jour de sa création**. Un circuit livré aujourd'hui rejoint aussitôt la colonne des circuits jamais empruntés — c'est exactement le mécanisme que cet item nomme, et il continue de tourner pendant qu'on le décrit.\n\n**Un premier livre circule.** L'emprunt **#69** a été ouvert ce matin à 11 h 43 à la BLMF — item 84, *O Anarquismo na Escola, no Teatro, na Poesia* d'Edgar Rodrigues, échéance **21/09**. Il donne au bloc *notes de lecture* sa première chance réelle : le mi-parcours calculé par `notify-loan-cycle` tombe le **10 septembre**, et l'invitation à déposer une note sous pseudonyme partira ce jour-là (item **F4**). `book_reading_notes` est encore à zéro ligne ; si elle en porte une le 11, un des sept blocs sera sorti de cette liste pour de bon — et pas parce qu'on l'aura décidé, parce que quelqu'un l'aura emprunté.\n\nLes six autres blocs sont inchangés au 31/08, vérifiés table par table : assemblées du réseau (3), propositions et objections d'autorité (3), référentiels `catalog_ref_*` (8), gouvernance des profils de bibliothèque (4, **et les deux crons tournent toujours dessus toutes les quinze minutes**), délibération des demandes d'adhésion (5). Tous à zéro insertion.","pt":"Verificado em 29/08: **62 tabelas de negócio nunca receberam uma única inserção.** Sete blocos inteiros são atingidos — assembleias da rede (3 tabelas), notas de leitura (2), propostas e objeções de autoridade (3), referenciais de catalogação `catalog_ref_*` (8 de 9), governança dos perfis de biblioteca (4, **enquanto dois crons rodam sobre elas a cada quinze minutos**), deliberação sobre os pedidos de adesão (5, incluindo `library_request_votes` e `library_request_messages`).\n\n**Remedido em 31/08: ainda 62, e não é boa notícia.** A conta não mudou em dois dias — 62 tabelas de `public` em 189 nunca receberam uma inserção. Mas não é a mesma lista: `loan_cycle_notifications`, nascida esta manhã com os lembretes de vencimento, entrou nela **no dia da sua criação**. Um circuito entregue hoje junta-se de imediato à coluna dos circuitos jamais percorridos.\n\n**Um primeiro livro circula.** O empréstimo **#69** foi aberto esta manhã na BLMF — item 84, *O Anarquismo na Escola, no Teatro, na Poesia*, de Edgar Rodrigues, vencimento **21/09**. Dá ao bloco *notas de leitura* a sua primeira hipótese real: o meio-percurso calculado por `notify-loan-cycle` cai em **10 de setembro**, e o convite a deixar uma nota sob pseudónimo parte nesse dia (item **F4**). `book_reading_notes` continua a zero linhas.\n\nOs seis outros blocos estão inalterados em 31/08, verificados tabela a tabela: assembleias da rede (3), propostas e objeções de autoridade (3), referenciais `catalog_ref_*` (8), governança dos perfis (4, **e os dois crons continuam a rodar sobre elas a cada quinze minutos**), deliberação dos pedidos de adesão (5). Todos a zero inserções."},"w":{"fr":"Choisir un bloc et l'emprunter pour de vrai, du premier geste au dernier : tenir une assemblée du réseau, déposer une note de lecture, proposer une autorité et laisser quelqu'un objecter, faire délibérer une demande d'adhésion. Consigner ce qui manque, ce qui surprend, ce qui bloque.","pt":"Escolher um bloco e percorrê-lo de verdade, do primeiro ao último gesto: realizar uma assembleia da rede, depositar uma nota de leitura, propor uma autoridade e deixar alguém objetar, fazer deliberar um pedido de adesão. Registrar o que falta, o que surpreende, o que trava."},"y":{"fr":"C'est le principal enseignement du relevé du 29 août, et il ne figure dans aucun document du corpus. **Le projet ne souffre pas d'un manque de fonctionnalités : il souffre d'un manque d'usage.** Un circuit jamais emprunté n'est pas livré — il est seulement écrit. Et le jour où il devient le chemin critique, comme le circuit d'invitation vient de le devenir pour les promotions, il casse sur des choses qu'un seul passage aurait révélées.","pt":"É o principal ensinamento do levantamento de 29 de agosto, e não consta em nenhum documento do corpus. **O projeto não sofre de falta de funcionalidades: sofre de falta de uso.** Um circuito jamais percorrido não está entregue — está apenas escrito. E no dia em que se torna o caminho crítico, como o circuito de convite acaba de se tornar para as promoções, ele quebra em coisas que uma única passagem teria revelado."},"f":{"fr":["Au moins trois des sept blocs ont été empruntés de bout en bout, sur `blmf-teste` puis en réel.","Chaque passage a produit un compte rendu écrit de ce qui manque.","Les blocs dont l'usage n'est pas souhaité aujourd'hui sont marqués **dormants**, avec la raison — ce n'est pas un échec, c'est une information."],"pt":["Pelo menos três dos sete blocos foram percorridos de ponta a ponta, em `blmf-teste` e depois no real.","Cada passagem produziu um relatório escrito do que falta.","Os blocos cujo uso não é desejado hoje são marcados **dormentes**, com o motivo — não é um fracasso, é uma informação."]},"dep":{"fr":"Le bloc « assemblée » dépend de **A1**. Les autres non.","pt":"O bloco «assembleia» depende de **A1**. Os outros não."},"r":["Relevé du 29/08/2026","REGISTRE §32 AG, §28 ATE, §26 ONBO","emprunt #69 (BLMF, item 84, échéance 21/09)","item F4","public.book_reading_notes"],"verif":{"fr":"31/08 — remesuré en production : **62 tables de `public` sur 189** à zéro insertion (`pg_stat_user_tables.n_tup_ins`, croisé avec un décompte de lignes sur les tables citées). Le compte est stable, la liste ne l'est pas — `loan_cycle_notifications` y est entrée le jour de sa naissance. Emprunt **#69** ouvert à la BLMF ; l'invitation à écrire une note de lecture est attendue le **10/09**, et c'est la première sortie possible de cette liste. **06/09** — deux circuits de plus sont construits sans être empruntés : **l'atelier ouvert aux œuvres** (05/09 soir, cinq types de proposition, file « corrige-moi » de 1 452 titres) compte **0 proposition** ; la **révision des lots importés** (05/09) compte **0 révision** (`catalog_batch_reviews` vide) ; et `network_contributors` est toujours à **0** — l'atelier des autorités lui-même n'avait jamais reçu une proposition avant le 05/09. La liste des circuits jamais empruntés s'allonge plus vite qu'elle ne se vide.","pt":"31/08 — remedido em produção: **62 tabelas de `public` em 189** a zero inserções. A conta é estável, a lista não. Empréstimo **#69** aberto na BLMF; o convite a escrever uma nota de leitura é esperado em **10/09**. **06/09** — dois circuitos a mais construídos sem uso : a oficina aberta às obras (0 proposta) e a revisão dos lotes importados (0 revisão) ; `network_contributors` continua a 0."}},{"id":"G6","d":"G","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Donner un écran au prêt entre bibliothèques","pt":"Dar uma tela ao empréstimo entre bibliotecas"},"v":{"fr":"Le cycle de vie du prêt entre bibliothèques est spécifié et implémenté en base : machine à états verrouillée, quatre triggers, cron `anarbib-peb-detect-overdue-daily` actif. **Aucun écran n'existe.** La base porte 2 prêts pour 20 insertions historiques.","pt":"O ciclo de vida do empréstimo entre bibliotecas está especificado e implementado no banco: máquina de estados travada, quatro triggers, cron `anarbib-peb-detect-overdue-daily` ativo. **Nenhuma tela existe.** O banco traz 2 empréstimos para 20 inserções históricas."},"w":{"fr":"Un écran de demande côté bibliothèque emprunteuse, un écran de traitement côté prêteuse, et l'affichage de l'état pour les deux. Les vues `interlibrary_loans_painel_ui` et `interlibrary_loan_items_ui` existent déjà.","pt":"Uma tela de pedido do lado da biblioteca solicitante, uma tela de tratamento do lado da emprestadora, e a exibição do estado para as duas. As views `interlibrary_loans_painel_ui` e `interlibrary_loan_items_ui` já existem."},"y":{"fr":"Le prêt entre bibliothèques est ce qui rend un réseau fédératif utile à ses lectrices, plutôt qu'une simple juxtaposition de catalogues. Aujourd'hui il a « une amorce en base, même sans écran » — ce qui veut dire que personne ne peut s'en servir.","pt":"O empréstimo entre bibliotecas é o que torna uma rede federativa útil às suas leitoras, em vez de uma simples justaposição de catálogos. Hoje ele tem «um início no banco, mesmo sem tela» — o que quer dizer que ninguém pode usá-lo."},"f":{"fr":["Un prêt complet a été fait entre deux bibliothèques du réseau, par l'interface.","Le flux « livre perdu ou abîmé » a un traitement écrit — **aucun flux ne le couvre aujourd'hui**, il se traite hors SIGB avec remontée en coordination."],"pt":["Um empréstimo completo foi feito entre duas bibliotecas da rede, pela interface.","O fluxo «livro perdido ou danificado» tem um tratamento escrito — **nenhum fluxo o cobre hoje**, trata-se fora do SIGB com escalada à coordenação."]},"dep":{"fr":"`EA-12 phase 2` (parité PEB, environ 45 fonctions) est gelée par `BIBLIO-9` — à ne pas confondre avec cet item.","pt":"`EA-12 fase 2` (paridade EEB, cerca de 45 funções) está congelada por `BIBLIO-9` — a não confundir com este item."},"r":["spec-cycle-vie-peb.md","PLAN_formation_coordination_BLMF §5","REGISTRE §14 PEB"],"verif":{"fr":"31/08 — `interlibrary_loans_v2` : 2 prêts vivants pour 20 insertions historiques, comme au 29/08.","pt":"31/08 — `interlibrary_loans_v2`: 2 empréstimos vivos para 20 inserções, como em 29/08."}},{"id":"G8","d":"G","p":"P2","s":"ouvert","e":"S","sk":["biblio","aucune"],"t":{"fr":"Compléter la cartographie avec les archives repérées ailleurs","pt":"Completar a cartografia com os arquivos identificados alhures"},"v":{"fr":"`cartography_entries` porte 187 fiches et le fichier `anarbib_bibliotheques_libertaires.geojson` en compte 121. Neuf archives repérées dans le réseau NORLA n'ont pas été confrontées à cette liste.","pt":"`cartography_entries` traz 187 fichas e o arquivo `anarbib_bibliotheques_libertaires.geojson` conta 121. Nove arquivos identificados na rede NORLA não foram confrontados com essa lista."},"w":{"fr":"Vérifier lesquelles des neuf figurent déjà, et faire entrer les manquantes avec `source = \"FICEDL\"` ou `\"NORLA\"` selon leur provenance.","pt":"Verificar quais das nove já constam, e fazer entrar as ausentes com `source = \"FICEDL\"` ou `\"NORLA\"` conforme sua proveniência."},"y":{"fr":"La carte n'a d'intérêt que si elle est plus complète que ce que chacun connaît déjà. Et la traçabilité de la source est ce qui permettra plus tard de dire d'où vient chaque fiche sans avoir à redemander.","pt":"O mapa só tem interesse se for mais completo do que aquilo que cada um já conhece. E a rastreabilidade da fonte é o que permitirá mais tarde dizer de onde vem cada ficha sem ter de perguntar de novo."},"f":{"fr":["Les neuf archives ont un verdict : déjà présente, ou ajoutée avec sa source.","Rappel : `statut_public` est à `FALSE` par défaut et **aucun import en masse** n'est autorisé (`MAP-E`)."],"pt":["Os nove arquivos têm um veredicto: já presente, ou acrescentado com sua fonte.","Lembrete: `statut_public` está em `FALSE` por omissão e **nenhuma importação em massa** é autorizada (`MAP-E`)."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["VEILLE_leftovers_maydayrooms_2026-08-19 §3.4","REGISTRE §34 MAP-E"],"verif":{"fr":"31/08 — 187 fiches en base, inchangé. Le fichier public a changé d'adresse et de contenu : `data/carte-publique.geojson` du dépôt vitrine, **109** entrées (l'item en citait 121 sous l'ancien nom). Les neuf archives NORLA restent à confronter.","pt":"31/08 — 187 fichas no banco. O arquivo público mudou de endereço: `data/carte-publique.geojson` no repositório vitrine, **109** entradas (o item citava 121). As nove NORLA seguem por confrontar."}},{"id":"G9","d":"G","p":"P3","s":"gele","e":"L","sk":["front"],"t":{"fr":"Implémenter la cartographie du réseau selon la spec v1.0","pt":"Implementar a cartografia da rede segundo a spec v1.0"},"v":{"fr":"Les arbitrages sont tranchés depuis le 18/06 : table dédiée, i18n hybride, carte publique comme route de l'application, moteur Leaflet, OpenStreetMap et Nominatim auto-hébergés, entrées non membres affichées avec un filtre clair. `MAP-I` (statut du prêt entre bibliothèques sur la carte interne) et `MAP-J` (auto-déclaration « ajouter ma bibliothèque » avec modération) restent différés. **L'implémentation est calendée post-Bologne, fin 2026 ou 2027.**","pt":"As arbitragens estão decididas desde 18/06: tabela dedicada, i18n híbrida, mapa público como rota do aplicativo, motor Leaflet, OpenStreetMap e Nominatim auto-hospedados, entradas não membros exibidas com um filtro claro. `MAP-I` (estatuto do empréstimo entre bibliotecas no mapa interno) e `MAP-J` (autodeclaração «adicionar minha biblioteca» com moderação) continuam adiados."},"w":{"fr":"Reprendre la spec v1.0 quand la fenêtre s'ouvre. Attention : le REGISTRE porte **deux sections `MAP`** — le §2 est un squelette où tout est ouvert, le §34 est la version tranchée. Le §2 n'a ni tampon de supersession ni renvoi vers le §34 : **c'est le §34 qui vaut**.","pt":"Retomar a spec v1.0 quando a janela se abrir. Atenção: o REGISTRO traz **duas seções `MAP`** — a §2 é um esqueleto onde tudo está aberto, a §34 é a versão decidida. A §2 não tem carimbo de supersessão nem remissão à §34: **é a §34 que vale**."},"y":{"fr":"La carte est le premier objet qu'une bibliothèque qui découvre le réseau va regarder. Elle mérite d'être faite quand il y aura du temps pour la faire bien, et pas dans la fenêtre d'avant Bologne.","pt":"O mapa é o primeiro objeto que uma biblioteca que descobre a rede vai olhar. Merece ser feito quando houver tempo para fazê-lo bem, e não na janela anterior a Bolonha."},"f":{"fr":["La carte publique est une route de l'application, servie sans requête vers un tiers (voir **E5**).","Le §2 du REGISTRE porte un renvoi vers le §34."],"pt":["O mapa público é uma rota do aplicativo, servido sem requisição a terceiro (ver **E5**).","A §2 do REGISTRO traz uma remissão à §34."]},"dep":{"fr":"Après Bologne. Lié à **E5** et **J5**.","pt":"Depois de Bolonha. Ligado a **E5** e **J5**."},"r":["spec-cartographie-reseau.md v1.0","REGISTRE §34 MAP"]},{"id":"G10","d":"G","p":"P2","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Solder les trois questions d'onboarding marquées « au plus vite »","pt":"Liquidar as três questões de onboarding marcadas «o mais rápido possível»"},"v":{"fr":"Trois points sont marqués 🔴 « à résoudre au plus vite » depuis juin et n'ont pas bougé : `#111` (évaluation collaborative d'un·e administrateur·rice réseau, dormante), `ONBO-Q13` (transfert technique du mandat de coordination), et la finition du volet 10 de l'atelier d'onboarding.","pt":"Três pontos estão marcados 🔴 «a resolver o mais rápido possível» desde junho e não se moveram: `#111` (avaliação colaborativa de uma pessoa administradora de rede, dormente), `ONBO-Q13` (transferência técnica do mandato de coordenação), e o acabamento do módulo 10 da oficina de onboarding."},"w":{"fr":"Les trois se traitent ensemble parce qu'ils portent la même question : que se passe-t-il quand quelqu'un arrive, et quand quelqu'un part ?","pt":"Os três se tratam juntos porque carregam a mesma questão: o que acontece quando alguém chega, e quando alguém sai?"},"y":{"fr":"`ONBO-Q13` est le cas de figure d'une coordination qui change de mains. Aujourd'hui, une bibliothèque dont la personne coordinatrice disparaît n'a pas de chemin écrit. C'est exactement le risque que **A1** décrit à l'échelle du réseau, à l'échelle d'une bibliothèque cette fois.","pt":"`ONBO-Q13` é o caso de uma coordenação que muda de mãos. Hoje, uma biblioteca cuja pessoa coordenadora desaparece não tem caminho escrito. É exatamente o risco que **A1** descreve na escala da rede, desta vez na escala de uma biblioteca."},"f":{"fr":["Le transfert de mandat a un chemin écrit et éprouvé sur `blmf-teste`.","`#111` a un verdict : réveillée, ou fermée.","Le volet 10 est fini."],"pt":["A transferência de mandato tem um caminho escrito e testado em `blmf-teste`.","`#111` tem um veredicto: reativada, ou fechada.","O módulo 10 está terminado."]},"dep":{"fr":"Éclairé par **G3** (le circuit d'invitation est le même).","pt":"Esclarecido por **G3** (o circuito de convite é o mesmo)."},"r":["REGISTRE §26 ONBO-Q13","spec-onboarding-biblioteca-v2.0"],"verif":{"fr":"07/09 — dans le dépôt : `fn_activate_approved_library_request` n'est appelée par **aucun** composant de `src/` — « Concluir a constituição » ne vaut donc pas activation, comme le manuel v5 l'avait relevé le 01/09. C'est la quatrième question d'onboarding, ou la première.","pt":"07/09 — no repositório: `fn_activate_approved_library_request` não é chamada por **nenhum** componente de `src/` — «Concluir a constituição» não vale, portanto, ativação, como o manual v5 tinha levantado em 01/09. É a quarta questão de onboarding, ou a primeira."}},{"id":"H2","d":"H","p":"P1","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Poser à la FICEDL les sept questions qui bloquent l'export du thésaurus","pt":"Colocar à FICEDL as sete questões que bloqueiam a exportação do tesauro"},"v":{"fr":"L'export complet des 620 descripteurs dans les deux formats est **à une soirée de travail** — dès que les sept questions ont une réponse. Elles sont écrites et personne ne les a encore posées.","pt":"A exportação completa dos 620 descritores nos dois formatos está a **uma noite de trabalho** — assim que as sete questões tiverem resposta. Estão escritas e ninguém ainda as colocou."},"w":{"fr":"Les sept : la forme des identifiants ; **la hiérarchie, qui est la vraie question** ; le statut de la facette « dates » ; le sort des 2 842 liens vers six catalogues ; le grec romanisé ; la licence ; et la manière dont le fichier se régénère.","pt":"As sete: a forma dos identificadores; **a hierarquia, que é a verdadeira questão**; o estatuto da faceta «datas»; o destino dos 2 842 vínculos para seis catálogos; o grego romanizado; a licença; e a maneira como o arquivo se regenera."},"y":{"fr":"Sur 148 descripteurs à libellé arborescent, **93 parents sont retrouvés et 55 sont introuvables** : « art », « économie », « guerres », « littérature », « presse », « syndicalisme » ne sont pas des descripteurs, ou portent un autre nom. Vu de l'extérieur, **la hiérarchie n'est pas une donnée, c'est une convention d'affichage dans une chaîne de caractères** — et on ne peut pas écrire `skos:broader` honnêtement là-dessus. Seule la FICEDL peut dire si le site tient une vraie relation parent-enfant.","pt":"De 148 descritores com rótulo arborescente, **93 pais são encontrados e 55 são inencontráveis**: «arte», «economia», «guerras», «literatura», «imprensa», «sindicalismo» não são descritores, ou têm outro nome. Visto de fora, **a hierarquia não é um dado, é uma convenção de exibição numa cadeia de caracteres** — e não se pode escrever `skos:broader` honestamente sobre isso. Só a FICEDL pode dizer se o site mantém uma verdadeira relação pai-filho."},"f":{"fr":["Les sept questions sont posées, avec l'audit de qualité produit à la première aspiration en pièce jointe — **les corrections appartiennent à la source, pas aux copies**.","Quatre anomalies vues en passant sont remontées : deux sites différents sous le même intitulé « catalogue du CCL » ; les archives du *Monde libertaire* apparaissant deux fois par terme sous deux formes d'adresse ; `mot228` (« populations autochtones ») présent dans deux facettes ; 29 libellés portugais portant astérisque, point d'interrogation ou espace finale.","La question 7 est la plus rentable : un squelette SPIP qui imprime les termes en CSV règle aussi la charge robots — **une requête au lieu de 620, par consommateur et par mise à jour**, pour une demi-journée de travail côté FICEDL."],"pt":["As sete questões estão colocadas, com a auditoria de qualidade produzida na primeira coleta em anexo — **as correções pertencem à fonte, não às cópias**.","Quatro anomalias vistas de passagem são reportadas: dois sites diferentes sob o mesmo rótulo «catálogo do CCL»; os arquivos do *Monde libertaire* aparecendo duas vezes por termo sob duas formas de endereço; `mot228` («populações autóctones») presente em duas facetas; 29 rótulos portugueses com asterisco, ponto de interrogação ou espaço final.","A questão 7 é a mais rentável: um esqueleto SPIP que imprime os termos em CSV resolve também a carga de robôs — **uma requisição em vez de 620, por consumidor e por atualização**, para meia jornada de trabalho do lado da FICEDL."]},"dep":{"fr":"Bloque **H3**. À poser à Bologne ou avant.","pt":"Bloqueia **H3**. A colocar em Bolonha ou antes."},"r":["NOTE_export_thesaurus_questions_ouvertes_2026-08-28"],"verif":[{"fr":"07/09, soir — **deux réponses de plus de la source.** (1) `X (généralités)` **est** la tête de hiérarchie : les 45 parents « introuvables » sont 45 `broader` réels ; 138 descripteurs sur 148 sont rattachés, 10 ne le sont pas — et la question restante est devenue : `guerres` et `art : courants` sont-ils des **groupes de mots-clés SPIP** ? (2) Identifiants : la forme canonique SPIP est `?motNN` quel que soit le type d'URL affiché ; les « URL propres » sont des adresses, pas des identités. La question 1 tombe — URI `https://thesaurus.ficedl.info/?motNN`, `skos:notation` = le numéro, proposition `/id/motNN` retirée. Restent : la question des groupes, le format (un fichier à deux schémas ou deux), les liens vers les catalogues, le grec, la licence, la régénération.\n\n07/09 — **Réponse partielle reçue de la source** : « guerre » est dans les deux thésaurus qu'elle tient séparés, *liste commune* et *géo-histo* ; les listes de communes (Bettini, Bianco) sont hors thésaurus. Ça répond à la question 3 (dates) et déplace la question 2 : les sept deviennent trois — `X` = `X (généralités)` ? ; `guerres`, `art : courants` = regroupements ou termes ? ; un fichier à deux schémas ou deux fichiers ? Les autres (identifiants, liens, grec, licence, régénération) restent posées. Le même jour, `thesaurus.ficedl.info` est **hors service** (« problème technique (serveur SQL) »).","pt":"07/09, noite — **mais duas respostas da fonte.** (1) `X (généralités)` **é** a cabeça da hierarquia: os 45 pais «não encontrados» são 45 `broader` reais; 138 descritores de 148 estão vinculados, 10 não — e a pergunta restante virou: `guerres` e `art : courants` são **grupos de palavras-chave SPIP**? (2) Identificadores: a forma canônica SPIP é `?motNN` seja qual for o tipo de URL exibido; as «URL propres» são endereços, não identidades. A questão 1 cai — URI `https://thesaurus.ficedl.info/?motNN`, `skos:notation` = o número, proposta `/id/motNN` retirada. Restam: a questão dos grupos, o formato (um arquivo com dois esquemas ou dois), os vínculos aos catálogos, o grego, a licença, a regeneração.\n\n07/09 — **Resposta parcial recebida da fonte**: «guerre» está nos dois tesauros que ela mantém separados, *lista comum* e *geo-histo*; as listas de municípios (Bettini, Bianco) estão fora do tesauro. Isso responde à questão 3 (datas) e desloca a questão 2: as sete viram três — `X` = `X (généralités)`?; `guerres`, `art : courants` = agrupamentos ou termos?; um arquivo com dois esquemas ou dois arquivos? As outras (identificadores, vínculos, grego, licença, regeneração) continuam postas. No mesmo dia, `thesaurus.ficedl.info` está **fora do ar** («problema técnico (servidor SQL)»)."},{"fr":"16/09 — non clos : la rencontre de Bologne et les échanges avec Ludwig (28 sujets nl validés le 09/09) ont ouvert le canal, mais rien n'atteste que **les sept questions** ont été posées avec l'audit en pièce jointe. À poser par écrit, maintenant que le contact existe.","pt":"16/09 — não fechado: o encontro de Bolonha e as trocas com Ludwig abriram o canal, mas nada atesta que **as sete perguntas** foram feitas com a auditoria em anexo. A fazer por escrito, agora que o contacto existe."}]},{"id":"H6","d":"H","p":"P2","s":"ouvert","e":"M","sk":["biblio","collectif"],"t":{"fr":"Aligner les vocabulaires militants qui ne se connaissent pas","pt":"Alinhar os vocabulários militantes que não se conhecem"},"v":{"fr":"NORLA a bâti son vocabulaire — avec ses facettes *Tactics* et *Social Movement* — **sans lien avec le thésaurus FICEDL**. Deux vocabulaires militants, construits en parallèle, qui s'ignorent. Par ailleurs, les 11 catégories thématiques d'AnarcosyndicalismeBOOK ne sont alignées sur rien.","pt":"A NORLA construiu seu vocabulário — com suas facetas *Tactics* e *Social Movement* — **sem vínculo com o tesauro FICEDL**. Dois vocabulários militantes, construídos em paralelo, que se ignoram. Além disso, as 11 categorias temáticas do AnarcosyndicalismeBOOK não estão alinhadas a nada."},"w":{"fr":"Commencer par le plus petit et le plus faisable : les 11 catégories d'AnarcosyndicalismeBOOK, **un premier pas concret, borné, faisable en une soirée** — et comme le thésaurus est déjà en dix langues, l'alignement vaut simultanément pour les dix. Puis ouvrir la conversation avec NORLA.","pt":"Começar pelo menor e mais viável: as 11 categorias do AnarcosyndicalismeBOOK, **um primeiro passo concreto, delimitado, viável numa noite** — e como o tesauro já está em dez línguas, o alinhamento vale simultaneamente para as dez. Depois abrir a conversa com a NORLA."},"y":{"fr":"Chaque vocabulaire construit isolément est un fonds que les autres ne trouveront pas. Réserve à garder en tête : les vocabulaires d'éphémères sont **monolingues**, l'alignement y sera plus lourd que sur des sujets.","pt":"Cada vocabulário construído isoladamente é um acervo que os outros não encontrarão. Reserva a ter em mente: os vocabulários de efêmeros são **monolíngues**, o alinhamento será mais pesado neles do que em assuntos."},"f":{"fr":["Les 11 catégories d'AnarcosyndicalismeBOOK sont alignées.","Une conversation est ouverte avec NORLA sur l'alignement des facettes.","La réciprocité est demandée : **les catalogues partenaires ne pointent pas en retour** aujourd'hui."],"pt":["As 11 categorias do AnarcosyndicalismeBOOK estão alinhadas.","Uma conversa está aberta com a NORLA sobre o alinhamento das facetas.","A reciprocidade é pedida: **os catálogos parceiros não apontam de volta** hoje."]},"dep":{"fr":"Octobre-novembre, si le camarade s'y met. Lié à **D4**.","pt":"Outubro-novembro, se o companheiro topar. Ligado a **D4**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26 §6","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"I2","d":"I","p":"P1","s":"gele","e":"L","sk":["sysadmin"],"t":{"fr":"Achever la bascule vers l'auto-hébergement","pt":"Concluir a migração para a auto-hospedagem"},"v":{"fr":"La pile est réduite de douze à **six conteneurs** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), les versions sont épinglées, `bootstrap.sh` a été exécuté pour de vrai le 26/08 avec huit défauts relevés et corrigés, et la répétition du 18/08 a rejoué 124 migrations et restauré un dump de production en 17 secondes. Reconstruction complète mesurée : **25 minutes**.","pt":"A pilha está reduzida de doze a **seis contêineres** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), as versões estão fixadas, `bootstrap.sh` foi executado de verdade em 26/08 com oito defeitos levantados e corrigidos, e o ensaio de 18/08 reexecutou 124 migrações e restaurou um dump de produção em 17 segundos. Reconstrução completa medida: **25 minutos**."},"w":{"fr":"Ce qui reste : découpler la chaîne de déploiement de l'intégration continue (**de l'extraction, pas de la création** — `scripts/ci/deployer-backend.sh` existe déjà), poser un proxy inverse avec tunnel devant la pile, passer des tags aux empreintes `sha256`, et refaire la répétition à froid un mois plus tard pour vérifier que rien n'a divergé. **Ajouté le 08/09/2026, à poser à l'hébergeur pressenti (Les Herbes Folles), ou à un ou plusieurs autres** : **un Jitsi à nous.** La visio d'entraide et d'assemblées vivait chez Autistici/Inventati ; A/I a été désigné « SDGT » par les États-Unis le 26/08 et a fermé ; le 08/09 on a basculé sur Framatalk (Framasoft, Hetzner en Allemagne) — un tiers de confiance, mais un tiers, et sur une infrastructure qu'une mesure du même genre peut atteindre. Un Jitsi hébergé par nous (ou par un collectif d'hébergement allié, ou réparti entre plusieurs) est la seule sortie complète. Ce n'est pas la même charge que le reste de la pile : le videobridge consomme de la bande passante montante à proportion des participantes, et une assemblée de vingt personnes n'est pas une aide à deux. **Questions à poser** : la VM peut-elle tenir un Jitsi (RAM, bande passante, ports UDP 10000) ; préfèrent-ils une seconde machine ; un autre hébergeur allié (Chapril, Systemli, une instance amie) accepterait-il de porter la visio pour le réseau, quitte à ce qu'elle ne vive pas au même endroit que la base ? Le même jour, **le fichier de fond de carte** (`map-tiles/planet-z12.pmtiles`, 18 Go, à réextraire en z15 depuis la VM : 138 Go) est entré dans ce qui déménage — à compter dans le disque demandé (I21).","pt":"O que resta: desacoplar a cadeia de implantação da integração contínua (**extração, não criação** — `scripts/ci/deployer-backend.sh` já existe), colocar um proxy reverso com túnel na frente da pilha, passar de tags para impressões `sha256`, e refazer o ensaio a frio um mês depois para verificar que nada divergiu. **Acrescentado em 08/09/2026, a colocar ao hospedeiro previsto (Les Herbes Folles), ou a um ou vários outros**: **um Jitsi nosso.** A videoconferência de apoio mútuo e de assembleias vivia na Autistici/Inventati; a A/I foi designada «SDGT» pelos Estados Unidos em 26/08 e fechou; em 08/09 mudámos para o Framatalk (Framasoft, Hetzner na Alemanha) — um terceiro de confiança, mas um terceiro, numa infraestrutura que uma medida do mesmo tipo pode atingir. Um Jitsi hospedado por nós (ou por um coletivo de hospedagem aliado, ou repartido entre vários) é a única saída completa. Não é a mesma carga que o resto da pilha: o videobridge consome largura de banda de subida na proporção das participantes. **Perguntas a fazer**: a VM aguenta um Jitsi (RAM, banda, porta UDP 10000); preferem uma segunda máquina; outro hospedeiro aliado (Chapril, Systemli, uma instância amiga) aceitaria carregar a videoconferência da rede, mesmo que não viva no mesmo lugar que a base? No mesmo dia, **o arquivo de fundo de mapa** (`map-tiles/planet-z12.pmtiles`, 18 GB, a reextrair em z15 a partir da VM: 138 GB) entrou no que se muda — a contar no disco pedido (I21)."},"y":{"fr":"C'est l'objectif que le projet s'est donné et qu'il n'a pas encore atteint : la fin de la dépendance à un hébergeur tiers. **C'est le chantier le plus technique et le plus autonome du lot** — quelqu'un peut le prendre sans coordination.","pt":"É o objetivo que o projeto se deu e que ainda não atingiu: o fim da dependência de um provedor terceiro. **É o canteiro mais técnico e mais autônomo do lote** — alguém pode assumi-lo sem coordenação."},"f":{"fr":["La pile tourne derrière un proxy inverse, avec les versions en empreintes.","Une reconstruction complète a été refaite un mois après la première.","Garde-fou à préserver impérativement : la boucle de déploiement parcourt `supabase/functions/*/` **en excluant `_shared` et `main`** — sans quoi le routeur partirait sur le Supabase hébergé.","Piège déjà rencontré : les rôles de service n'ont pas de mot de passe dans l'image `supabase/postgres` (SQLSTATE 28P01 en boucle), `postgres` n'est pas superutilisateur (c'est `supabase_admin`), `authenticator` est réservé, et un `set -e` dans la boucle tue le script au premier rôle en échec.","La question d'un Jitsi (chez l'hébergeur, chez un allié, ou réparti) a été posée, et la réponse est consignée ici — même si c'est « non »."],"pt":["A pilha roda atrás de um proxy reverso, com as versões em impressões.","Uma reconstrução completa foi refeita um mês após a primeira.","Guarda a preservar imperativamente: o laço de implantação percorre `supabase/functions/*/` **excluindo `_shared` e `main`** — sem o que o roteador iria para o Supabase hospedado.","Armadilha já encontrada: os papéis de serviço não têm senha na imagem `supabase/postgres` (SQLSTATE 28P01 em laço), `postgres` não é superusuário (é `supabase_admin`), `authenticator` é reservado, e um `set -e` no laço mata o script no primeiro papel em falha.","A pergunta de um Jitsi (no hospedeiro, num aliado, ou repartido) foi feita, e a resposta está registada aqui — mesmo que seja «não»."]},"dep":{"fr":"**Gelé sur la production jusqu'au 14/09.** Dépend de **I1**. À faire avant de louer quoi que ce soit : reprendre la connexion authentifiée en local, bloquée par une résolution IPv6 sans route — **ce blocage a probablement disparu de lui-même**, le vérifier coûte cinq minutes et peut épargner une machine montée pour rien.","pt":"**Congelado na produção até 14/09.** Depende de **I1**. A fazer antes de alugar o que quer que seja: retomar a conexão autenticada em local, bloqueada por uma resolução IPv6 sem rota — **esse bloqueio provavelmente desapareceu sozinho**, verificá-lo custa cinco minutos e pode poupar uma máquina montada à toa."},"r":["docs/CHANTIERS_OUVERTS.md §2","deploy/README.md","REPRISE_bascule_autohebergee_2026-08-26","SETUP_fonds_de_carte_pmtiles_2026-09-07","REGISTRE FED-O9 (08/09)"],"verif":[{"fr":"08/09 — l'hôte de la visio est Framatalk depuis ce jour (commits `88bba888`, `b75d4b2a`, REGISTRE FED-O9/AG-7) ; aucune réponse d'hébergeur sur un Jitsi n'a encore été demandée. Le fond de carte est un fichier de 18 Go dans le Storage (`map-tiles`), à faire suivre.","pt":"08/09 — o hospedeiro da videoconferência é o Framatalk desde este dia; nenhuma resposta de hospedeiro sobre um Jitsi foi ainda pedida. O fundo de mapa é um arquivo de 18 GB no Storage (`map-tiles`), a fazer seguir."},{"fr":"21/09 — **relu sur pièces et remesuré ; le « comment » de la fiche est en partie fait, et la journée a trouvé trois choses qu'aucune relecture ne pouvait voir.** *(a) Découpler la CI* : fait pour le backend depuis le 01/09 (`scripts/ci/deployer-backend.sh`, que `ci.yml` appelle) ; **fait ce jour pour le front** — `scripts/ci/publier-front.sh` rejoue hors forge le job `app` (l'action git-pages n'est qu'une image Docker, `git-pages-cli`), garde `publier-front-coherence` ; construction, `--simulation` et `--vers-dossier` exécutés, **publication réelle par ce chemin jamais faite** (`--essai` existe pour le premier tir). Et `deploy/deploy.sh` ne reconstruisait **jamais** le front d'une instance auto-hébergée (`install.sh` le construit une fois) : étape « Front » ajoutée, éprouvée sur une pile restaurée. *(b) Les pins d'images périmaient en silence* : la production était passée à GoTrue v2.197.0 (82 migrations) et Storage 1.73.1 (68) sous des pins à 77 et 65 ; remesurés au banc (`deploy/banc-paliers.sh`), puis **Storage a remonté le soir même** (1.77.5, 73 migrations, 20 h 43) — vu cette fois par la sonde `images_pins` de `health-probe`, livrée dans la journée (migrations `20260921181812` et `20260921190301`, incident ouvert, courriel reçu par Xavier à 20 h 45). Pins retenus : `v2.197.0` et `v1.77.0`, 344 colonnes `auth`+`storage` concordantes avec la production. *(c) Passe `--depuis-une-sauvegarde` sur un dump RÉEL sous ces images* : restauration en 62 s, huit décomptes identiques à la production (5 bibliothèques, 2 656 notices, 2 758 exemplaires, 20 comptes, 17 buckets, 833 objets), 831 fichiers reversés, deux objets servis octet pour octet, connexion par l'Edge Function `login`. Le dump, lui, a coûté 301 s (schéma) + 439 s (données, 37,6 Mo — le double du 26/08). **Trouvé en chemin** : `supabase db dump` n'emporte pas `supabase_migrations` — une instance restaurée ne pouvait plus jamais être mise à jour par `deploy.sh` (il rejouait le socle) ; **réparé** (troisième fichier `migrations.sql`, étape « 3 bis » de `restore.sh`, `restore-historique.sh`, garde-fou dans `apply-pending-migrations.sh`). Il n'emporte pas `cron.job` non plus : **I26**. Et un `pg_dump` lancé pendant qu'une migration attend en CI la fait mourir sur le statement timeout (run 1288, rouge d'une demi-heure, aucune écriture partielle). Pièce : `journal/operations/NOTE_pins-images-remesures_2026-09-21`. Restent au « comment » : le proxy inverse avec tunnel, les empreintes `sha256`, la répétition à froid, la question du Jitsi.","pt":"21/09 — **relido sobre peças e remedido; o « como » da ficha está em parte feito, e o dia achou três coisas que nenhuma releitura podia ver.** *(a) Desacoplar a CI*: feito para o backend desde 01/09 (`scripts/ci/deployer-backend.sh`); **feito hoje para o front** — `scripts/ci/publier-front.sh` repete fora da forja o job `app` (a ação git-pages é só uma imagem Docker, `git-pages-cli`), guarda `publier-front-coherence`; construção, `--simulation` e `--vers-dossier` executados, **publicação real por este caminho nunca feita** (`--essai` existe para o primeiro tiro). E `deploy/deploy.sh` **nunca** reconstruía o front de uma instância auto-hospedada: etapa « Front » acrescentada, provada numa pilha restaurada. *(b) Os pins de imagens caducavam em silêncio*: a produção tinha passado a GoTrue v2.197.0 (82 migrações) e Storage 1.73.1 (68) sob pins a 77 e 65; remedidos na bancada (`deploy/banc-paliers.sh`), e **o Storage subiu de novo na mesma noite** (1.77.5, 73 migrações, 20h43) — visto desta vez pela sonda `images_pins` do `health-probe`, entregue no mesmo dia (migrações `20260921181812` e `20260921190301`, incidente aberto, e-mail recebido por Xavier às 20h45). Pins retidos: `v2.197.0` e `v1.77.0`, 344 colunas `auth`+`storage` concordantes com a produção. *(c) Passagem `--depuis-une-sauvegarde` num dump REAL sob estas imagens*: restauração em 62 s, oito contagens idênticas à produção, 831 ficheiros repostos, dois objetos servidos byte a byte, login pela Edge Function `login`. O dump custou 301 s (esquema) + 439 s (dados, 37,6 MB — o dobro de 26/08). **Achado pelo caminho**: `supabase db dump` não leva `supabase_migrations` — uma instância restaurada nunca mais podia ser atualizada por `deploy.sh`; **reparado** (terceiro ficheiro `migrations.sql`, etapa « 3 bis » de `restore.sh`, `restore-historique.sh`, guarda em `apply-pending-migrations.sh`). Também não leva `cron.job`: **I26**. E um `pg_dump` lançado enquanto uma migração espera na CI fá-la morrer no statement timeout (run 1288, vermelho de meia hora, nenhuma escrita parcial). Peça: `journal/operations/NOTE_pins-images-remesures_2026-09-21`. Restam no « como »: o proxy inverso com túnel, as impressões `sha256`, a repetição a frio, a questão do Jitsi."}]},{"id":"I3","d":"I","p":"P1","s":"gele","e":"S","sk":["deno"],"t":{"fr":"Tester le routeur `main` de la pile auto-hébergée","pt":"Testar o roteador `main` da pilha auto-hospedada"},"v":{"fr":"`supabase/functions/main/index.ts` existe (6,9 Ko), lit `config.toml` au démarrage, applique un **refus par défaut** — seules les dispenses `verify_jwt = false` sont lues, tout le reste exige un jeton — et refuse de démarrer si le fichier est illisible. **Les quatre tests prévus n'ont pas été passés.**","pt":"`supabase/functions/main/index.ts` existe (6,9 KB), lê `config.toml` na inicialização, aplica uma **recusa por omissão** — só as dispensas `verify_jwt = false` são lidas, todo o resto exige um token — e recusa iniciar se o arquivo for ilegível. **Os quatro testes previstos não foram feitos.**"},"w":{"fr":"Les quatre tests de l'étape 5 de `deploy/REPETITION.md` : fonction protégée sans en-tête d'autorisation → 401 ; avec un jeton valide → 200 ; `health-probe` sans jeton → 200 ; nom inexistant → 404.","pt":"Os quatro testes da etapa 5 de `deploy/REPETITION.md`: função protegida sem cabeçalho de autorização → 401; com um token válido → 200; `health-probe` sem token → 200; nome inexistente → 404."},"y":{"fr":"Le routeur est ce qui remplace la protection par défaut de la plateforme le jour de la bascule. Comme `config.toml` ne déclare que 31 fonctions sur 48, **le refus par défaut du routeur fermera dix-huit fonctions qui fonctionnent aujourd'hui** — il faut le savoir avant, pas après.","pt":"O roteador é o que substitui a proteção por omissão da plataforma no dia da migração. Como `config.toml` só declara 31 funções de 48, **a recusa por omissão do roteador fechará dezoito funções que hoje funcionam** — é preciso saber isso antes, não depois."},"f":{"fr":["Les quatre tests passent.","Le comportement pour les 18 fonctions non déclarées est connu et voulu."],"pt":["Os quatro testes passam.","O comportamento para as 18 funções não declaradas é conhecido e desejado."]},"dep":{"fr":"**Bloqué par B6.** Gelé sur la production jusqu'au 14/09 ; le test en environnement d'essai est ouvert.","pt":"**Bloqueado por B6.** Congelado na produção até 14/09; o teste em ambiente de teste está aberto."},"r":["deploy/README.md","deploy/REPETITION.md étape 5"],"verif":{"fr":"31/08 — `supabase/functions/main/index.ts` : 6 885 octets, présent ; aucun test ne le mentionne dans `src/tests/` ni `tests/`. Le constat tient.","pt":"31/08 — `main/index.ts`: 6 885 bytes, presente; nenhum teste o menciona."}},{"id":"I15","d":"I","p":"P3","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Le secret Forgejo de la clé publiable porte encore son ancien nom","pt":"O secret do Forgejo da chave publicável ainda carrega seu nome antigo"},"v":{"fr":"Depuis le 01/09, le code lit `VITE_SUPABASE_PUBLISHABLE_KEY` et sa valeur est bien la clé publiable — mais en CI, cette variable est alimentée par le secret Forgejo au nom historique `VITE_SUPABASE_ANON_KEY`. Découplage voulu : il évitait d'exiger un renommage de secret et un merge au même instant. Le piège est documenté dans `ci.yml` : `prebuild` fait `exit 0` si la variable manque, un nom désaccordé ne casse pas le build, il publie un instantané de catalogue périmé en silence.","pt":"Desde 01/09, o código lê `VITE_SUPABASE_PUBLISHABLE_KEY` e seu valor é mesmo a chave publicável — mas na CI essa variável é alimentada pelo secret do Forgejo com o nome histórico `VITE_SUPABASE_ANON_KEY`. Desacoplamento proposital: evitava exigir a renomeação do secret e o merge no mesmo instante. A armadilha está documentada no `ci.yml`: o `prebuild` faz `exit 0` se a variável faltar, um nome desalinhado não quebra o build, publica um instantâneo de catálogo vencido em silêncio."},"w":{"fr":"Créer le secret `VITE_SUPABASE_PUBLISHABLE_KEY` dans les réglages Forgejo (même valeur), aligner la ligne de `ci.yml`, vérifier un build complet — la fraîcheur du `catalogue-snapshot.json` fait preuve — puis supprimer l'ancien secret.","pt":"Criar o secret `VITE_SUPABASE_PUBLISHABLE_KEY` nas configurações do Forgejo (mesmo valor), alinhar a linha do `ci.yml`, verificar um build completo — o frescor do `catalogue-snapshot.json` serve de prova — e então apagar o secret antigo."},"f":{"fr":["La ligne de `ci.yml` lit un secret du même nom que la variable, l'ancien secret n'existe plus, et un build postérieur a produit un snapshot daté du jour."],"pt":["A linha do `ci.yml` lê um secret com o mesmo nome da variável, o secret antigo não existe mais, e um build posterior produziu um snapshot com a data do dia."]},"y":{"fr":"Le chantier des clés a payé deux fois le prix d'un nom qui ment — une variable de plateforme dont le contenu avait changé sans prévenir, et un contrôle `verify_jwt` que satisfaisait une clé publique. Autant ne pas en laisser un troisième en place, même bénin.","pt":"O canteiro das chaves pagou duas vezes o preço de um nome que mente — uma variável de plataforma cujo conteúdo mudou sem avisar, e um controle `verify_jwt` satisfeito por uma chave pública. Melhor não deixar um terceiro no lugar, mesmo benigno."},"dep":{"fr":"Accès aux réglages du dépôt Forgejo (Settings → Actions → Secrets).","pt":"Acesso às configurações do repositório Forgejo (Settings → Actions → Secrets)."},"verif":{"fr":"01/09 — `ci.yml` relu après la bascule : mappage `VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}` en place, commenté.","pt":"01/09 — `ci.yml` relido depois da virada: mapeamento `VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}` no lugar, comentado."},"r":[".forgejo/workflows/ci.yml","item B18"]},{"id":"J2","d":"J","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Réparer l'index des backlogs et trancher la convention d'archivage","pt":"Reparar o índice dos backlogs e decidir a convenção de arquivamento"},"v":{"fr":"**Corrigé le 31/08 : la ligne du v32 est rétablie depuis le 29/08** (`INDEX.md`, avec la note « elle manquait à ce tableau depuis juin »). Restent : les deux conventions de nommage qui coexistent — 9 archives avec le préfixe `-archive-`, 27 sans — et un en-tête d'INDEX qui dérive déjà : « 90 items » puis « les items restent 84 » dans le même paragraphe, quand le JSON en compte 83.","pt":"**Corrigido em 31/08: a linha do v32 está restabelecida desde 29/08.** Restam: as duas convenções de nomenclatura (9 arquivos com prefixo `-archive-`, 27 sem) e um cabeçalho do INDEX que já deriva (« 90 itens », « restam 84 », quando o JSON conta 83)."},"w":{"fr":"Ajouter la ligne du v32, celles du v33 et du v34, et trancher la convention d'archivage en une phrase inscrite au REGISTRE.","pt":"Acrescentar a linha do v32, as do v33 e do v34, e decidir a convenção de arquivamento numa frase inscrita no REGISTRO."},"y":{"fr":"L'index des backlogs est ce qui permet de savoir quelle version fait foi. Une lignée avec un trou et deux conventions concurrentes ne remplit pas cet office.","pt":"O índice dos backlogs é o que permite saber qual versão faz fé. Uma linhagem com um buraco e duas convenções concorrentes não cumpre esse ofício."},"f":{"fr":["Le tableau est complet du v8 au v34.","Une seule convention de nommage est inscrite au REGISTRE."],"pt":["A tabela está completa do v8 ao v34.","Uma única convenção de nomenclatura está inscrita no REGISTRO."]},"dep":{"fr":"Se fait en posant ce backlog.","pt":"Faz-se ao depositar este backlog."},"r":["docs/backlogs/INDEX.md"],"verif":[{"fr":"31/08 — `INDEX.md` relu, archives comptées : 9 avec le préfixe `-archive-`, 27 sans.","pt":"31/08 — `INDEX.md` relido, arquivos contados: 9 com prefixo `-archive-`, 27 sem."},{"fr":"21/09 — **premier critère tenu, second en attente d'une phrase de Xavier.** `INDEX.md` relu : le tableau nomme toutes les versions du v8 au v34 sans trou ; les archives vivent dans `docs/backlogs/archive/` (36 fichiers, dont 8 au préfixe `-archive-`). Aucune entrée du REGISTRE ne fixe la convention de nommage : c'est le seul reste.","pt":"21/09 — **primeiro critério cumprido, segundo à espera de uma frase de Xavier.** `INDEX.md` relido: a tabela nomeia todas as versões de v8 a v34; os arquivos vivem em `docs/backlogs/archive/` (36 ficheiros, 8 com o prefixo `-archive-`). Nenhuma entrada do REGISTO fixa a convenção de nomes."}]},{"id":"K1","d":"K","p":"P0","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Faire adopter l'acte de création du Fonds AnarBib","pt":"Fazer adotar a ata de criação do Fundo AnarBib"},"v":{"fr":"Un projet d'acte est rédigé et archivé. Il n'a pas été adopté. **C'est le préalable politique à l'ouverture de tout canal d'encaissement : rien ne bouge avant.**","pt":"Um projeto de ata está redigido e arquivado. Não foi adotado. **É o preliminar político à abertura de qualquer canal de arrecadação: nada se move antes.**"},"w":{"fr":"L'acte doit faire quatre choses : créer le fonds, désigner nommément la personne qui tient la clé Pix, désigner la personne dépositaire de la part européenne, et fixer le principe du rapport annuel.","pt":"A ata deve fazer quatro coisas: criar o fundo, designar nominalmente a pessoa que detém a chave Pix, designar a pessoa depositária da parte europeia, e fixar o princípio do relatório anual."},"y":{"fr":"Les frais de fonctionnement — environ **36 € par mois, 430 € par an**, intégralement adossés à des factures — sortent aujourd'hui de la poche d'une seule personne. Deux caisses sont prévues, avec un seul registre : la caisse brésilienne finance les dépenses locales, la caisse européenne finance l'infrastructure. **L'argent doit atterrir là où les factures se paient.**","pt":"As despesas de funcionamento — cerca de **36 € por mês, 430 € por ano**, integralmente lastreadas em faturas — saem hoje do bolso de uma só pessoa. Duas caixas estão previstas, com um único registro: a caixa brasileira financia as despesas locais, a caixa europeia financia a infraestrutura. **O dinheiro deve pousar onde as faturas se pagam.**"},"f":{"fr":["L'acte est adopté et archivé.","La personne qui tient la clé Pix l'accepte en connaissance de cause.","Le nom public de la caisse est arrêté.","**Son article 1 suffit à lui seul à publier un canal honnêtement, si l'assemblée tarde.**"],"pt":["A ata está adotada e arquivada.","A pessoa que detém a chave Pix aceita com pleno conhecimento.","O nome público da caixa está definido.","**Seu artigo 1 basta sozinho para publicar um canal honestamente, se a assembleia demorar.**"]},"dep":{"fr":"Bloque **K2**.","pt":"Bloqueia **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25 §9","MINUTA_ata_fundo_anarbib_CCLA_2026-08-26"]},{"id":"K2","d":"K","p":"P1","s":"bloque","e":"M","sk":["collectif"],"t":{"fr":"Ouvrir les canaux d'encaissement dormants","pt":"Abrir os canais de arrecadação dormentes"},"v":{"fr":"Liberapay est en ligne et a reçu son premier don le 27/08. L'encart « soutenir financièrement » est publié dans les dix locales et nomme Liberapay comme unique canal ouvert. **Pix et IBAN dorment** dans un bloc de commentaire HTML entre les marqueurs `ENCART-DORMANT-START` et `ENCART-DORMANT-END`. Wero est en attente d'une réponse de l'établissement bancaire.","pt":"O Liberapay está no ar e recebeu sua primeira doação em 27/08. O encarte «apoiar financeiramente» está publicado nas dez locales e nomeia o Liberapay como único canal aberto. **Pix e IBAN dormem** num bloco de comentário HTML entre os marcadores `ENCART-DORMANT-START` e `ENCART-DORMANT-END`."},"w":{"fr":"Côté Brésil : une clé aléatoire dédiée créée par la personne mandatée, et l'ouverture d'un compte au numéro d'entreprise — une coopérative de crédit est plus cohérente qu'une banque commerciale. Côté Europe : décider quel compte reçoit. Puis remplir les gabarits, retirer les deux marqueurs de commentaire, et supprimer les deux paragraphes « en cours d'ouverture ».","pt":"Lado Brasil: uma chave aleatória dedicada criada pela pessoa mandatada, e a abertura de uma conta no CNPJ — uma cooperativa de crédito é mais coerente que um banco comercial. Lado Europa: decidir qual conta recebe. Depois preencher os modelos, retirar os dois marcadores de comentário, e suprimir os dois parágrafos «em abertura»."},"y":{"fr":"Le Pix ne peut pas être créé depuis la France — l'élargissement d'août 2026 ne vaut que pour envoyer. Et une clé posée sur le numéro fiscal personnel d'un compa l'expose au contrôle fiscal : d'où l'urgence du compte au numéro d'entreprise. Sur l'IBAN, la recommandation écrite est de le publier **en clair** — un « demander par courriel » fera perdre plus de dons qu'il n'évitera d'ennuis.","pt":"O Pix não pode ser criado desde a França — a ampliação de agosto de 2026 só vale para enviar. E uma chave posta no CPF pessoal de um compa o expõe à malha fina: daí a urgência da conta no CNPJ. Sobre o IBAN, a recomendação escrita é publicá-lo **em claro** — um «pedir por e-mail» fará perder mais doações do que evitará aborrecimentos."},"f":{"fr":["Au moins un canal supplémentaire est ouvert et publié dans les dix locales.","Le générateur des pages de comptes a été relancé après chaque édition de `FINANCES.md`.","Si la réponse sur Wero est négative, **la phrase Wero est retirée du bloc dormant des dix fichiers** — le gabarit y est encore.","Rappel : le hook `pre-push` refuse la poussée tant qu'un gabarit est visible hors du bloc dormant."],"pt":["Pelo menos um canal adicional está aberto e publicado nas dez locales.","O gerador das páginas de contas foi reexecutado após cada edição de `FINANCES.md`.","Se a resposta sobre o Wero for negativa, **a frase Wero é retirada do bloco dormente dos dez arquivos** — o modelo ainda está lá.","Lembrete: o hook `pre-push` recusa o push enquanto um modelo estiver visível fora do bloco dormente."]},"dep":{"fr":"**Bloqué par K1.**","pt":"**Bloqueado por K1.**"},"r":["PLAN_financement_AnarBib_2026-08-25","FINANCES.md"],"verif":{"fr":"31/08 — les marqueurs `ENCART-DORMANT-START` sont en place dans les dix fichiers du dépôt vitrine. Rien de neuf mesurable d'ici sur Pix, IBAN ou Wero.","pt":"31/08 — os marcadores `ENCART-DORMANT-START` estão nos dez arquivos do repositório vitrine."}},{"id":"K3","d":"K","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Tenir le registre public des comptes","pt":"Manter o registro público das contas"},"v":{"fr":"`FINANCES.md` est à la racine du dépôt vitrine et dix pages publiques en sont engendrées, par langue. Le générateur signale nommément toute cellule non traduite. Un tableau distinct porte ce qu'une personne a avancé avant que le fonds existe — environ **228 € de mars à août 2026** — et la question de savoir si c'est une dette à rembourser est laissée à l'assemblée.","pt":"`FINANCES.md` está na raiz do repositório vitrine e dez páginas públicas são geradas a partir dele, por língua. O gerador sinaliza nominalmente toda célula não traduzida. Uma tabela distinta traz o que uma pessoa adiantou antes de o fundo existir — cerca de **228 € de março a agosto de 2026** — e a questão de saber se é uma dívida a reembolsar fica para a assembleia."},"w":{"fr":"Consigner chaque recette et chaque dépense au fil de l'eau, et relancer le générateur après chaque édition.","pt":"Registrar cada receita e cada despesa continuamente, e reexecutar o gerador após cada edição."},"y":{"fr":"**Consigner les avances passées dès maintenant, avant la délibération** — dans un an, personne ne se souviendra des montants. Le régime de transparence choisi est le rapport annuel plus les comptes sur demande ; il ne tient que si le registre est à jour.","pt":"**Registrar os adiantamentos passados desde já, antes da deliberação** — daqui a um ano, ninguém se lembrará dos valores. O regime de transparência escolhido é o relatório anual mais as contas sob pedido; só se sustenta se o registro estiver atualizado."},"f":{"fr":["Le registre est à jour et les dix pages reflètent son contenu.","Anticipation notée : le renouvellement du domaine en mars 2027 coûtera plus cher, la promotion de première année ne se reconduisant pas."],"pt":["O registro está atualizado e as dez páginas refletem seu conteúdo.","Antecipação anotada: a renovação do domínio em março de 2027 custará mais caro, a promoção do primeiro ano não se renovando."]},"dep":{"fr":"Indépendant de **K1** et **K2**.","pt":"Independente de **K1** e **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25","tools/build-finances-pages.cjs"]},{"id":"K7","d":"K","p":"P1","s":"en-cours","e":"L","sk":["collectif"],"t":{"fr":"Mener la formation des deux coordinations BLMF jusqu'à l'autonomie","pt":"Conduzir a formação das duas coordenações BLMF até a autonomia"},"v":{"fr":"Le matériel est livré : 89 diapositives en portugais du Brésil, six modules, trois rencontres, six exercices pratiques, notes d'animation dans chaque diapositive. Ni l'une ni l'autre des deux personnes n'est bibliothécaire ou informaticienne.","pt":"O material está entregue: 89 slides em português do Brasil, seis módulos, três encontros, seis exercícios práticos, notas de animação em cada slide. Nenhuma das duas pessoas é bibliotecária ou informática."},"w":{"fr":"Avant la première séance : créer sur `blmf-teste` les deux comptes de coordination, un ou deux comptes de lecture fictifs, et les cinq fiches fautives de l'exercice 2. Puis le suivi de huit semaines : cinq fiches par semaine **toutes avec leur provenance**, un jour de comptoir par semaine, une consultation menée de bout en bout avec négociation réelle, et le vote du profil de la bibliothèque porté en assemblée.","pt":"Antes do primeiro encontro: criar em `blmf-teste` as duas contas de coordenação, uma ou duas contas de leitura fictícias, e as cinco fichas defeituosas do exercício 2. Depois o acompanhamento de oito semanas: cinco fichas por semana **todas com sua proveniência**, um dia de balcão por semana, uma consulta conduzida de ponta a ponta com negociação real, e o voto do perfil da biblioteca levado à assembleia."},"y":{"fr":"Deux personnes autonomes sur la coordination d'une bibliothèque, c'est **A1** à l'échelle locale. Le principe pédagogique tient en trois mots — *« cliqua, não vai quebrar nada ! »* — et il est tenable parce que les transitions impossibles ne s'affichent pas, les boutons bloqués sont pré-désactivés avec une explication, et la base refuse les combinaisons impossibles. Les neuf gestes irréversibles sont nommés explicitement.","pt":"Duas pessoas autônomas na coordenação de uma biblioteca é **A1** na escala local. O princípio pedagógico cabe em três palavras — *«cliqua, não vai quebrar nada!»* — e é sustentável porque as transições impossíveis não aparecem, os botões travados vêm pré-desativados com uma explicação, e o banco recusa as combinações impossíveis. Os nove gestos irreversíveis são nomeados explicitamente."},"f":{"fr":["Les huit semaines sont faites, avec le rituel hebdomadaire de trente minutes et ses trois questions fixes.","La feuille de lacunes alimentée par ce rituel devient l'ordre du jour suivant **et un matériau de contribution au projet**.","L'engagement chiffré est tenu : **aucune fiche nouvelle sans mode d'acquisition** — le rattrapage rétroactif des 2 450 fiches sans donnée d'acquisition n'est pas demandé, seul l'arrêt de la dette l'est."],"pt":["As oito semanas estão feitas, com o ritual semanal de trinta minutos e suas três perguntas fixas.","A folha de lacunas alimentada por esse ritual vira a pauta seguinte **e um material de contribuição ao projeto**.","O compromisso quantificado é cumprido: **nenhuma ficha nova sem modo de aquisição** — a recuperação retroativa das 2 450 fichas sem dado de aquisição não é pedida, só a parada da dívida é."]},"dep":{"fr":"S'appuie sur **G3** et **G4** pour le bac à sable.","pt":"Apoia-se em **G3** e **G4** para o ambiente de teste."},"r":["docs/journal/chantiers/formation-BLMF/PLAN_formation_coordination_BLMF_2026-09-01.docx","docs/journal/chantiers/formation-BLMF/CONDUCTEUR_seance1_BLMF.pdf","docs/journal/chantiers/formation-BLMF/ROTEIRO_capsula_sessao1_BLMF.pdf","docs/journal/chantiers/formation-BLMF/Formacao_coordenacao_BLMF_AnarBib.pptx","docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md"],"verif":{"fr":"07/09 — en base : la lectrice fictive « Voltairine de Teste » n'a **jamais** ouvert de session (`auth.users.last_sign_in_at` nul) ; aucun exemplaire créé depuis le 01/09, donc l'engagement « aucun exempla
