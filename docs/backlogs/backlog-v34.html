<head>

<style>
/* Identite AnarBib : fond bordeaux sombre, Bitter en labeur, Big Shoulders
   en titraille (la police de la brochure manifeste), rouge AnarBib reserve
   aux signaux semantiques. Concu en sombre d'abord ; la variante claire
   garde le meme biais bordeaux plutot qu'un gris neutre. */
:root{
  color-scheme:light dark;
  /* clair */
  --bg:#f6f1ef; --panel:#fffdfc; --ink:#1a1012; --mut:#6d5b58; --line:#e3d6d2;
  --rule:#cbb8b3; --accent:#a81c1c; --accent-soft:#f5e7e6; --chip:#ece1de;
  --p0:#a81c1c; --p1:#9a6410; --p2:#4d6136; --p3:#6d5b58;
  --sp:clamp(16px,3vw,22px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}}
:root[data-theme="dark"]{
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.62 Bitter,Georgia,"Times New Roman",serif;
  -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--sp) 96px}
header{padding:52px 0 20px;border-bottom:2px solid var(--rule);margin-bottom:0}
.eyebrow{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px}
h1{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:.005em;
  text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.sub{color:var(--ink);font-size:clamp(16px,2.1vw,19px);margin:0;max-width:60ch}
.mta{margin:14px 0 0;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:11px 0;margin:0 0 8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--mut);border:1px solid var(--line);
  border-radius:2px;padding:4px 11px;cursor:pointer;line-height:1.4}
button:hover{color:var(--ink);border-color:var(--rule)}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
input[type=search]{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--line);
  border-radius:2px;background:var(--panel);color:var(--ink);min-width:170px;flex:1 1 170px}
h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;
  font-size:clamp(26px,3.6vw,34px);letter-spacing:.02em;text-transform:uppercase;
  margin:52px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--rule);text-wrap:balance}
h3{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:23px;letter-spacing:.05em;text-transform:uppercase;margin:34px 0 6px}
p{margin:0 0 14px;max-width:74ch}
.note{color:var(--mut);font-size:15px;font-style:italic;max-width:70ch}
.tbl{overflow-x:auto;margin:0 0 22px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.photo td:nth-child(1){width:32%}
.photo td:nth-child(2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--accent);padding-right:18px}
.photo td:nth-child(3){color:var(--mut)}
.clot td:nth-child(1){width:24%;font-weight:600}
.clot td:nth-child(2){width:30%;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--p2);
  border-radius:2px;padding:18px 20px;margin:0 0 12px}
.card.P0{border-left-color:var(--p0)}.card.P1{border-left-color:var(--p1)}
.card.P2{border-left-color:var(--p2)}.card.P3{border-left-color:var(--p3)}
.card h4{margin:0 0 10px;font-size:18.5px;line-height:1.32;font-weight:600;text-wrap:balance}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400;
  color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:2px;margin-right:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.07em;text-transform:uppercase;background:var(--chip);color:var(--mut);
  padding:2px 9px;border-radius:2px;line-height:1.5}
.chip.pr{color:var(--bg);background:var(--p2)}
.card.P0 .chip.pr{background:var(--p0)}.card.P1 .chip.pr{background:var(--p1)}
.card.P3 .chip.pr{background:var(--p3)}
.f{margin:14px 0 0}
.f dt{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:14px}
.f dd{margin:2px 0 0;max-width:74ch}
.f dd p{margin:0 0 9px}
.f dd p:last-child{margin-bottom:0}
.f ul,.f ol{margin:4px 0 9px;padding-left:19px}
.f dd>ol:last-child,.f dd>ul:last-child{margin-bottom:0}
.f li{margin:4px 0;max-width:72ch}
pre{background:var(--chip);border-left:2px solid var(--line);padding:10px 13px;
  margin:9px 0;overflow-x:auto;max-width:74ch}
pre code{background:none;padding:0;font-size:.84em;line-height:1.5;
  white-space:pre;word-break:normal}
.refs{font-size:12.5px;color:var(--mut);margin-top:15px;font-style:italic;max-width:none}
.prov{font-size:12.5px;color:var(--mut);font-style:italic;margin:6px 0 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--chip);padding:1px 5px;border-radius:2px;word-break:break-word}
.count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);
  font-size:14px;font-weight:400;letter-spacing:0;text-transform:none}
.ecart{border-left:2px solid var(--line);padding-left:16px;margin:0 0 18px;max-width:80ch}
.ecart b{display:block;margin-bottom:5px;font-weight:600}
.ecart span{display:block;font-size:15px;color:var(--mut);margin-bottom:4px}
.empty{color:var(--mut);font-style:italic;padding:26px 0}
@media (max-width:640px){
  header{padding-top:34px}
  .card{padding:14px 15px}
  .photo td:nth-child(1),.clot td:nth-child(1),.clot td:nth-child(2){width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 7 281 chaves cada (05/10), verificadas na integração contínua."}},{"key":"F","label":{"fr":"Courriel et notifications","pt":"E-mail e notificações"},"note":{"fr":"14 fonctions `notify-*`. La chaîne a sa carte depuis le 30/09, mesurée en production (F1, clos le 03/10) : environ 96 chaînes, 41 vivantes, 31 jamais empruntées.","pt":"14 funções `notify-*`. A cadeia tem seu mapa desde 30/09, medido em produção (F1): cerca de 96 cadeias, 41 vivas, 31 nunca percorridas."}},{"key":"G","label":{"fr":"Réseau, gouvernance, fédération","pt":"Rede, governança, federação"},"note":{"fr":"Beaucoup de circuits construits, très peu empruntés. C'est le principal enseignement du relevé.","pt":"Muitos circuitos construídos, pouquíssimos percorridos. É o principal ensinamento do levantamento."}},{"key":"H","label":{"fr":"Interopérabilité, thésaurus, moisson","pt":"Interoperabilidade, tesauro, coleta"},"note":{"fr":"Sortir vers les autres catalogues, et accepter d'être pointé en retour.","pt":"Sair em direção aos outros catálogos, e aceitar ser apontado de volta."}},{"key":"I","label":{"fr":"Auto-hébergement, exploitation, sauvegardes, CI","pt":"Auto-hospedagem, operação, backups, CI"},"note":{"fr":"Dégelé depuis le 14/09/2026. Le runner de la CI vit encore sur le poste du mainteneur (A3).","pt":"Descongelado desde 14/09/2026. O runner da CI ainda vive na máquina do mantenedor (A3)."}},{"key":"J","label":{"fr":"Documentation et corpus","pt":"Documentação e corpus"},"note":{"fr":"Le corpus est vaste et sa dérive est mesurée. Ce backlog en fait partie.","pt":"O corpus é vasto e sua deriva é medida. Este backlog faz parte dele."}},{"key":"K","label":{"fr":"Caisse, communication, formation","pt":"Caixa, comunicação, formação"},"note":{"fr":"Ce qui décide si le projet a des moyens et des bras, et non seulement du code.","pt":"O que decide se o projeto tem meios e braços, e não apenas código."}}],"priorities":[{"key":"P0","label":{"fr":"Structurel","pt":"Estrutural"},"desc":{"fr":"Le projet reste fragile tant que ce n'est pas fait. Aucun code ne le remplace.","pt":"O projeto continua frágil enquanto isso não for feito. Nenhum código substitui."}},{"key":"P1","label":{"fr":"Prioritaire","pt":"Prioritário"},"desc":{"fr":"Corrige un défaut réel, ou débloque plusieurs autres chantiers.","pt":"Corrige um defeito real, ou desbloqueia vários outros canteiros."}},{"key":"P2","label":{"fr":"Courant","pt":"Corrente"},"desc":{"fr":"Utile, non bloquant, à prendre quand un créneau se libère.","pt":"Útil, não bloqueante, a pegar quando abrir uma janela."}},{"key":"P3","label":{"fr":"Différé","pt":"Adiado"},"desc":{"fr":"Différé volontairement, avec la raison écrite. Ne pas le reprendre sans rouvrir la raison.","pt":"Adiado deliberadamente, com o motivo escrito. Não retomar sem reabrir o motivo."}}],"states":[{"key":"ouvert","label":{"fr":"Ouvert","pt":"Aberto"}},{"key":"en-cours","label":{"fr":"En cours","pt":"Em curso"}},{"key":"a-verifier","label":{"fr":"À vérifier","pt":"A verificar"}},{"key":"bloque","label":{"fr":"Bloqué","pt":"Bloqueado"}},{"key":"gele","label":{"fr":"Gelé","pt":"Congelado"}},{"key":"decision","label":{"fr":"Décision collective","pt":"Decisão coletiva"}}],"efforts":[{"key":"S","label":{"fr":"une soirée","pt":"uma noite"}},{"key":"M","label":{"fr":"quelques jours","pt":"alguns dias"}},{"key":"L","label":{"fr":"plusieurs semaines","pt":"várias semanas"}},{"key":"XL","label":{"fr":"un chantier long","pt":"um canteiro longo"}},{"key":"?","label":{"fr":"non chiffré","pt":"não estimado"}}],"skills":[{"key":"aucune","label":{"fr":"aucune compétence technique","pt":"nenhuma competência técnica"}},{"key":"biblio","label":{"fr":"bibliothéconomie","pt":"biblioteconomia"}},{"key":"langue","label":{"fr":"langue maternelle","pt":"língua materna"}},{"key":"sql","label":{"fr":"SQL / PostgreSQL","pt":"SQL / PostgreSQL"}},{"key":"front","label":{"fr":"React / JavaScript","pt":"React / JavaScript"}},{"key":"deno","label":{"fr":"Deno / TypeScript","pt":"Deno / TypeScript"}},{"key":"sysadmin","label":{"fr":"administration système","pt":"administração de sistemas"}},{"key":"powershell","label":{"fr":"PowerShell (hooks Windows)","pt":"PowerShell (hooks Windows)"}},{"key":"collectif","label":{"fr":"délibération collective","pt":"deliberação coletiva"}}],"items":[{"id":"A1","d":"A","p":"P0","s":"decision","e":"?","sk":["collectif","aucune"],"t":{"fr":"Obtenir au moins deux autres administrateur·rices réseau","pt":"Obter pelo menos duas outras pessoas administradoras de rede"},"v":{"fr":"Vérifié en base le 29/08 : le réseau compte **un seul administrateur**. Les tables `network_administrators`, `network_administrator_cooptation_proposals` et `network_administrator_cooptation_votes` sont vides après quelques insertions historiques.","pt":"Verificado no banco em 29/08: a rede conta com **um único administrador**. As tabelas `network_administrators`, `network_administrator_cooptation_proposals` e `network_administrator_cooptation_votes` estão vazias após algumas inserções históricas."},"w":{"fr":"Trouver et coopter deux personnes de plus, dans deux collectifs différents, disposées à porter les décisions fédérales : admission d'une bibliothèque, arbitrage entre bibliothèques, ouverture de la moisson.","pt":"Encontrar e cooptar mais duas pessoas, em dois coletivos diferentes, dispostas a carregar as decisões federais: admissão de uma biblioteca, arbitragem entre bibliotecas, abertura da coleta."},"y":{"fr":"C'est l'item qui commande tous les autres. Des décisions fédérales sont **volontairement différées** faute de pouvoir être prises à plusieurs — l'admission de la Bibliothèque SOLIDAIRES au premier chef. Tant qu'il n'y a qu'une personne, le mécanisme de cooptation reste un dispositif sans usage, et le réseau reste suspendu à quelqu'un qui peut tomber malade.","pt":"É o item que comanda todos os outros. Decisões federais são **deliberadamente adiadas** por não poderem ser tomadas em conjunto — a admissão da Biblioteca SOLIDAIRES em primeiro lugar. Enquanto houver uma só pessoa, o mecanismo de cooptação continua um dispositivo sem uso, e a rede continua suspensa a alguém que pode adoecer."},"f":{"fr":["Deux personnes supplémentaires portent le rôle `network_administrator` en base.","Une décision fédérale a été prise à trois de bout en bout, avec sa trace dans `network_administrator_audit`.","Le circuit de cooptation a été emprunté au moins une fois : proposition, délai, ratification."],"pt":["Duas pessoas a mais carregam o papel `network_administrator` no banco.","Uma decisão federal foi tomada em três, de ponta a ponta, com seu rastro em `network_administrator_audit`.","O circuito de cooptação foi percorrido pelo menos uma vez: proposta, prazo, ratificação."]},"dep":{"fr":"Bloque **G7** (décision sur SOLIDAIRES) et conditionne **A2**.","pt":"Bloqueia **G7** (decisão sobre SOLIDAIRES) e condiciona **A2**."},"r":["docs/CHANTIERS_OUVERTS.md §7","REGISTRE §1 RES-D11","CALENDRIER_bologne_2026-08-27"],"verif":{"fr":"31/08 — `network_administrators` : 1 ligne. Rien n'a bougé. **05/10 — le camarade (`ASR2026`) est coopté** par Xavier : deux admins réseau actifs (vérifié en base). Le circuit de cooptation a servi pour la première fois — proposition, vote implicite du proposeur, ratification immédiate puisque Xavier était seul admin (pas de délai). En chemin, un défaut corrigé (G17 : la fenêtre ne trouvait pas un compte sans bibliothèque). Les deux courriels au camarade sont partis (acceptés par Resend à 14 h 03) ; il ne les avait pas reçus à 14 h 10, mais ils lui sont parvenus ensuite : ce sont leurs liens qui menaient à des 404 (signalé par Xavier le jour même, corrigé par `43f8481e`) — rien à regarder côté Resend. **Reste** : une troisième personne, et une décision fédérale prise à trois. **05/10, soir — la PR #32 du camarade** (`ad5fb042`, fusionnée par `300b1a69`), puis son suivi (`206b7b77`) : `AppIcon` et ses règles (REGISTRE `IDENT-5` à `IDENT-8`, `0b2b0e14`), un nom accessible au badge « restreint », `AppIcon` en `role=\"img\"` quand il a un titre, `stripEmojiDeep` retiré. Les icônes encore en emoji : item E32.","pt":"31/08 — `network_administrators`: 1 linha. Nada mudou. **05/10 — o camarada (`ASR2026`) foi cooptado**: dois administradores ativos. Primeiro uso do circuito de cooptação. **Falta**: uma terceira pessoa. **05/10, à noite — a PR #32 do camarada** (`ad5fb042`, merge `300b1a69`; seguimento `206b7b77`): `AppIcon` e suas regras (REGISTRE `IDENT-5` a `IDENT-8`). Ícones ainda em emoji: item E32."}},{"id":"A3","d":"A","p":"P0","s":"en-cours","e":"L","sk":["sysadmin"],"t":{"fr":"Sortir le runner d'intégration continue de la machine du mainteneur","pt":"Tirar o runner de integração contínua da máquina do mantenedor"},"v":{"fr":"`.forgejo/workflows/ci.yml` et `sql-tests.yml` portent tous deux `runs-on: anarbib-local` — un `act_runner` auto-hébergé sur le WSL2 du mainteneur. Machine éteinte, **rien ne se déploie**, et l'échec est parfois silencieux. **28/09 — ce que l'échec silencieux vaut, mesuré : le 27/09 à 22 h 40 min 30 s le portable s'est mis en veille pendant le job `app` de 911ad1db** (journal WSL : fin du boot à cette seconde ; à 22 h 37 déjà `ReportLog error: deadline_exceeded`). Codeberg a déclaré la tâche en échec à 23 h 45 ; le `backend` n'a jamais tourné ; la migration de ce commit a attendu le push suivant, le lendemain à 11 h 37 — sans qu'un mot ne parte. Les runners hébergés par Codeberg ne conviennent pas (mesuré sur `codeberg.org/actions/meta` : 10 min par job au plus, pas de Docker ; `sql-tests` et `rejeu-image` en ont besoin et durent 6 à 12 min). **Trois gestes faits sans machine, sur décision de Xavier** : (1) `deploy/ops/RUNNER.md` — ce que c'est, où il vit (relu sur la machine : binaire v12.10.2, `~/.runner`, unités = liens vers `deploy/ops/systemd/`), le savoir vivant en deux minutes (`journalctl`, jamais `systemctl`), la remise en route, l'installation sur une autre machine avec **le même label** (deux runners peuvent coexister, la bascule se fait sans coupure) et un drop-in local pour l'utilisateur ; (2) la sonde **`ci_en_retard`** de `health-probe` (`_shared/ci/forgejo-tasks.ts`, migration `20260928095045`) : une fois par heure, la liste des tâches de la forge — une tâche non terminée depuis plus de 2 h, ou le dernier `app`/`backend` en échec depuis plus de 30 min sans run plus récent, ouvre l'incident et envoie « que faire : allumer, vérifier, **relancer** » ; un `[skip ci]` n'est pas une fausse alerte (on ne compare pas au marqueur), un 504 de l'API ne change rien ; banc de 15 cas dont la vraie soirée du 27/09 ; (3) `deploy/runner/compose.yml` — le runner en conteneur (`code.forgejo.org/forgejo/runner:12.10.2`, socket Docker partagée), `compose config` valide et image éprouvée ; l'enregistrement demande le jeton du dépôt. **Reste la machine** : Xavier essaie son autre portable ; la VM des Herbes Folles attend I21. Et le runner reste unique, en série : sortir du poste règle la disponibilité, pas la lenteur (`rejeu-image` la nuit, ou un second runner). **Déployé en prod le 28/09 à 12 h 48** (migration `20260928095045` par la CI, CHECK élargie, aucun incident `ci_en_retard`) — après deux pushes de code que Forgejo a sautés sans un rouge parce qu'un commit du lot portait `[skip ci]` (le backlog par-dessus, puis un commit voisin ramené par le rebase) ; le hook `.githooks/pre-push` refuse désormais ce lot mixte vers Codeberg (le miroir GitHub, sans CI, passe).","pt":"`.forgejo/workflows/ci.yml` e `sql-tests.yml` trazem ambos `runs-on: anarbib-local` — um `act_runner` auto-hospedado no WSL2 do mantenedor. Máquina desligada, **nada se implanta**, e a falha às vezes é silenciosa. **28/09 —** medido: em 27/09 às 22h40 o portátil entrou em suspensão durante um job `app`; a tarefa foi dada como falha às 23h45, o `backend` nunca correu, uma migração esperou até ao push do dia seguinte, sem aviso. Os runners hospedados da Codeberg não servem (10 min por job, sem Docker). Três gestos sem máquina: `deploy/ops/RUNNER.md` (procedimento para quem não o instalou, mudança de máquina sem corte), a sonda `ci_en_retard` do `health-probe` (uma leitura por hora das tarefas da forja, e-mail «o que fazer: religar, verificar, relançar»), `deploy/runner/compose.yml` (runner em contêiner). Falta a máquina: Xavier tenta o outro portátil. **Implantado em produção em 28/09 às 12h48** (migração pela CI, nenhum incidente) — depois de dois pushes de código que a Forgejo saltou sem um vermelho porque um commit do lote trazia `[skip ci]`; o hook `.githooks/pre-push` recusa agora esse lote misto para a Codeberg."},"w":{"fr":"Faire tourner le runner ailleurs que sur un poste de travail personnel : machine de l'hébergeur, seconde machine du réseau, ou runner partagé. La logique de déploiement est déjà extraite dans `scripts/ci/deployer-backend.sh` et rejouable à la main — la moitié du travail est faite.","pt":"Rodar o runner em outro lugar que não uma estação de trabalho pessoal: máquina do provedor, segunda máquina da rede, ou runner compartilhado. A lógica de implantação já está extraída em `scripts/ci/deployer-backend.sh` e é reexecutável à mão — metade do trabalho está feita."},"y":{"fr":"Tant que le runner est unique et personnel, aucune procédure ne peut rendre le déploiement fiable, et personne d'autre ne peut fusionner une contribution. C'est la seconde moitié de la dépendance à une seule personne, après **A1**.","pt":"Enquanto o runner for único e pessoal, nenhum procedimento pode tornar a implantação confiável, e ninguém mais pode integrar uma contribuição. É a segunda metade da dependência de uma só pessoa, depois de **A1**."},"f":{"fr":["Un push sur `main` déclenche un déploiement sans que la machine du mainteneur soit allumée.","Le garde-fou d'exclusion du routeur `main` est préservé aux deux endroits (workflow et script).","La procédure de remise en route du runner est écrite pour quelqu'un qui ne l'a pas installé. — **fait le 28/09 : `deploy/ops/RUNNER.md`.**","Une panne du runner se voit : un courriel « chaîne de déploiement en retard » part dans les trois heures (sonde `ci_en_retard`, 28/09)."],"pt":["Um push em `main` dispara uma implantação sem que a máquina do mantenedor esteja ligada.","A guarda de exclusão do roteador `main` é preservada nos dois lugares (workflow e script).","O procedimento de recolocação do runner em funcionamento está escrito para quem não o instalou.","Uma falha do runner é vista: e-mail «cadeia de implantação atrasada» em até três horas (sonda `ci_en_retard`, 28/09)."]},"dep":{"fr":"Lié à **I2** (bascule auto-hébergée). Peut se faire avant, sur l'infrastructure actuelle.","pt":"Ligado a **I2** (migração auto-hospedada). Pode ser feito antes, na infraestrutura atual."},"r":["CLAUDE.md, piège connu n°1","REPRISE_bascule_autohebergee_2026-08-26"],"verif":{"fr":"31/08 — 7 occurrences de `runs-on: anarbib-local` dans `.forgejo/workflows/`. Rien n'a bougé. **28/09, prod** : migration `20260928095045` appliquée par la CI (`created_by` vide), CHECK des incidents élargie à `ci_en_retard`, health-probe déployé (marqueur `11da0df8`) ; premier tick horaire à 13 h 05 UTC+2 : la sonde a lu les incidents ouverts, n'en a trouvé ni ouvert aucun — la chaîne était à l'heure. `deploy/ops/RUNNER.md` et `deploy/runner/compose.yml` au dépôt. Trois des quatre critères tenus ; reste le premier (la machine), à la main de Xavier. **27-28/09** — `4ac70cc0` : la suite `ci_en_retard_kind_tests` exerce la CHECK des incidents contre la base (le kind `ci_en_retard` admis, un kind inconnu refusé, les anciens gardés) — la garde vitest ne lisait que le texte de la migration ; et les journaux Docker du runner en conteneur tournent (3 × 10 Mo). Le hook `.githooks/pre-push` vient de `1737bee9`, limité à Codeberg par `8bf62c1d`. `51f6dcd9` (27/09) : le banc du script de déploiement (`deployer-backend-marqueur.test.js`) rougissait à chaque `npm test` sous Windows (9 cas, code 127), parce que `bash` y lance WSL ; il prend Git Bash, ou se saute sans lui, et la CI Linux garde `bash`. **01/10** — preuve par l'usage : deux runs cassés par l'arrêt du poste. Le 30/09 au soir, le `backend` de F16 a bloqué une heure (Codeberg lent, marqueur non repoussé) — tout était pourtant déployé ; le 01/10 à 7 h 55, le poste s'est arrêté une minute après le départ du `sql-tests` de F17 : Docker injoignable, runner coupé, Codeberg a affiché le job « en cours » pendant 11 heures, jusqu'au retour du poste à 18 h 47 ; deux conteneurs orphelins relancés par Docker au redémarrage, retirés à la main. F17 n'a été déployé qu'à 18 h 55. La CI vit et meurt avec la machine du mainteneur. Le commit de la sonde `ci_en_retard`, de `deploy/ops/RUNNER.md` et de `deploy/runner/compose.yml` (28/09) est `afdb81a2`.","pt":"31/08 — 7 ocorrências de `runs-on: anarbib-local`. Nada mudou. **28/09, produção** : migração `20260928095045` aplicada pela CI, CHECK alargada a `ci_en_retard`, health-probe implantado; primeiro tique horário às 13h05: a sonda não abriu incidente — a cadeia estava em dia. Três dos quatro critérios cumpridos; falta a máquina, decisão de Xavier. **27-28/09** — `4ac70cc0`: a suíte `ci_en_retard_kind_tests` testa a CHECK dos incidentes contra o banco (o kind `ci_en_retard` aceito, um kind desconhecido recusado, os antigos mantidos), e os logs Docker do runner em contêiner giram (3 × 10 MB). O hook `.githooks/pre-push` vem de `1737bee9`, limitado à Codeberg por `8bf62c1d`. `51f6dcd9` (27/09): o teste do script de implantação (`deployer-backend-marqueur.test.js`) ficava vermelho a cada `npm test` no Windows (9 casos, código 127), porque ali `bash` abre o WSL; agora usa o Git Bash, ou é pulado sem ele, e a CI Linux mantém `bash`. **01/10** — dois runs quebrados pela parada do posto (o de F17 ficou « em curso » 11 horas). A CI vive e morre com a máquina do mantenedor. O commit da sonda `ci_en_retard`, de `RUNNER.md` e de `compose.yml` (28/09) é `afdb81a2`."}},{"id":"B36","d":"B","p":"P3","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Relire aux compteurs de production les index gardés sous réserve","pt":"Reler, com os contadores de produção, os índices mantidos com ressalva"},"v":{"fr":"B10 (27/09) a retiré 22 index et en a gardé d'autres sous réserve. **22 redondants encore empruntés** (jusqu'à 10,8 millions de parcours pour `book_holdings_book_id_idx`) sont nommés avec leurs compteurs dans `index_redondants_garde_tests.sql` (`af98dee8`) : les retirer déplacerait des plans chauds vers l'index couvrant, à mesurer avant de décider. **108 index étaient à zéro parcours**, hors clés étrangères et redondants : 12 retirés (`3ac1c910`), les autres gardés, verdict par verdict, dans `docs/journal/audits/AUDIT_performance_B10_2026-09-27.md`. B32 (28/09) a rendu empruntables les index des vues matérialisées du catalogue ; trois restent sans parcours à son relevé (`autor_norm_trgm_idx`, `library_slug_idx`, `titulo_trgm_idx`), et `autor_norm_trgm_idx` n'a pas de lecteur connu dans le code. Ces rendez-vous ne vivaient que dans les clôtures de B10 et B32.","pt":"O B10 (27/09) retirou 22 índices e manteve outros com ressalva. **22 redundantes ainda usados** (até 10,8 milhões de varreduras em `book_holdings_book_id_idx`) estão nomeados com seus contadores em `index_redondants_garde_tests.sql` (`af98dee8`): retirá-los deslocaria planos quentes para o índice que os cobre, a medir antes de decidir. **108 índices estavam a zero varreduras**, fora chaves estrangeiras e redundantes: 12 retirados (`3ac1c910`), os outros mantidos, com veredito, em `docs/journal/audits/AUDIT_performance_B10_2026-09-27.md`. O B32 (28/09) tornou usáveis os índices das visões materializadas do catálogo; três continuam sem varredura no seu levantamento (`autor_norm_trgm_idx`, `library_slug_idx`, `titulo_trgm_idx`). Esses encontros só viviam nos fechamentos do B10 e do B32."},"w":{"fr":"Vers le 28/10, relire `pg_stat_user_indexes` en production — compteurs remis à zéro au redémarrage du 02/09 (B9) : dater le relevé et noter tout redémarrage depuis. Pour chaque index nommé ci-dessus : le garder, raison écrite, ou le retirer par migration, raison écrite, comme B10 et B33. Pour les 22 redondants empruntés, comparer les plans des requêtes qui les empruntent avec l'index couvrant avant tout retrait.","pt":"Por volta de 28/10, reler `pg_stat_user_indexes` em produção — contadores zerados no reinício de 02/09 (B9): datar o levantamento e anotar qualquer reinício desde então. Para cada índice nomeado acima: mantê-lo, com motivo escrito, ou retirá-lo por migração, com motivo escrito, como no B10 e no B33. Para os 22 redundantes usados, comparar os planos das consultas que os usam com o índice que os cobre antes de qualquer retirada."},"y":{"fr":"Un index sans lecteur coûte une écriture à chaque insertion ; un index retiré à tort fait basculer une requête chaude en parcours séquentiel. Trancher sur un mois de lectures en production, pas sur un banc.","pt":"Um índice sem leitor custa uma escrita a cada inserção; um índice retirado por engano faz uma consulta quente cair em varredura sequencial. Decidir sobre um mês de leituras em produção, não sobre uma bancada."},"f":{"fr":["Chaque index nommé dans v a son verdict écrit, daté du relevé.","Les index retirés le sont par migration ; aucune clé étrangère ne perd son index, et `index_redondants_garde_tests` est à jour."],"pt":["Cada índice nomeado em v tem seu veredito escrito, datado do levantamento.","Os índices retirados o são por migração; nenhuma chave estrangeira perde seu índice, e `index_redondants_garde_tests` está atualizado."]},"dep":{"fr":"Différé à dessein : un mois de compteurs de production après B32 (déployé le 28/09), pas avant le 28/10.","pt":"Adiado de propósito: um mês de contadores de produção depois do B32 (implantado em 28/09), não antes de 28/10."},"r":["docs/journal/audits/AUDIT_performance_B10_2026-09-27.md","docs/journal/audits/AUDIT_catalogue_grande_echelle_B32_2026-09-28.md","tests/sql/index_redondants_garde_tests.sql","clôtures B10 et B32"],"verif":[{"fr":"**05/10, inventaire** — un temps qu'aucun item ne portait : l'appel complet que B33 a mesuré reste à 183 ms sous `anon`, dont 4,5 ms pour le BitmapOr sur les deux index trigramme des autorités (« le temps est ailleurs », clôture B33) ; B32 a traité la recherche du catalogue sans dire s'il couvre cet appel. À relire avec les compteurs.","pt":"**05/10, inventário** — um tempo sem item: a chamada medida por B33 fica em 183 ms sob `anon` (4,5 ms no BitmapOr dos índices trigrama). Reler com os contadores."},{"fr":"**07/10 — compteurs remis à zéro par la panne.** Le redémarrage de la base (I32, 20:19) a remis `pg_stat_user_indexes` à zéro : l'avis « index inutilisé » compte 440 index le 07/10 au soir, et l'avis de performance monte de 257 à 466 sans qu'une seule ligne de la base ait changé. La relecture prévue vers le 28/10 compte donc depuis le 07/10 — trois semaines d'usage, pas quatre.","pt":"**07/10 — contadores zerados pela queda.** O reinício do banco (I32, 20h19) zerou `pg_stat_user_indexes`: o aviso « índice não usado » conta 440 índices em 07/10 à noite. A releitura prevista por volta de 28/10 conta desde 07/10 — três semanas de uso."}]},{"id":"C3","d":"C","p":"P1","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Mener la revue humaine des autorités : patronymes, casse, titres","pt":"Conduzir a revisão humana das autoridades: sobrenomes, caixa, títulos"},"v":{"fr":"Les 19 migrations `conventions_*` sont appliquées depuis le 21/08 : les référentiels sont normalisés, les mécaniques sûres ont été passées, la file de vérification existe et l'application permet d'y travailler. **Ce qui reste est la part qu'aucune machine ne fait.**","pt":"As 19 migrações `conventions_*` estão aplicadas desde 21/08: os referenciais estão normalizados, as mecânicas seguras foram passadas, a fila de verificação existe e o aplicativo permite trabalhar nela. **O que resta é a parte que nenhuma máquina faz.**"},"w":{"fr":"Reprendre les trois tables de revue du schéma `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — et les traiter fiche par fiche depuis l'Atelier autorités.","pt":"Retomar as três tabelas de revisão do esquema `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — e tratá-las ficha por ficha a partir da Oficina de autoridades."},"y":{"fr":"Sur les 22 doubles patronymes hispaniques signalés automatiquement, **trois sont des faux positifs connus** (Mechoso, Borges, Marcos) : 14 % d'erreur. Et sur les 13 points d'accès sur particule, **quatre sont corrects** (Van der Walt, De Amicis, Di Paolo, De Greef). Un script qui « finirait » ce travail introduirait des fautes dans un catalogue qui n'en a pas.","pt":"Dos 22 duplos sobrenomes hispânicos apontados automaticamente, **três são falsos positivos conhecidos** (Mechoso, Borges, Marcos): 14 % de erro. E dos 13 pontos de acesso sobre partícula, **quatro estão corretos** (Van der Walt, De Amicis, Di Paolo, De Greef). Um script que «terminasse» esse trabalho introduziria erros num catálogo que não os tem."},"f":{"fr":["Les trois tables sont vidées par validation humaine, pas par script.","**Interdiction absolue** : décommenter le SQL d'application, le compléter, ou passer `valide = true` en masse.","Les 9 points d'accès posés sur un suffixe de filiation — type `FILHO, Fábio Luz` — sont traités en premier : l'audit les donne pour **le défaut le plus grave du lot**."],"pt":["As três tabelas são esvaziadas por validação humana, não por script.","**Proibição absoluta**: descomentar o SQL de aplicação, completá-lo, ou passar `valide = true` em massa.","Os 9 pontos de acesso postos sobre um sufixo de filiação — tipo `FILHO, Fábio Luz` — são tratados primeiro: a auditoria os dá como **o defeito mais grave do lote**."]},"dep":{"fr":"Se fait dans l'application, sans migration. C'est un chantier de bibliothéconomie, ouvert à qui sait cataloguer.","pt":"Faz-se no aplicativo, sem migração. É um canteiro de biblioteconomia, aberto a quem sabe catalogar."},"r":["AUDIT_conventions_catalographiques_2026-08-20","REGISTRE §37 CONV"],"verif":[{"fr":"31/08 — la file `catalog_review_queue` mesurée, 310 lignes : le lot **patronymes est terminé** (20 validés, 2 écartés, 0 à revoir — les 9 suffixes de filiation, donnés pour le défaut le plus grave, sont derrière), `autorite_casse` presque (3 à revoir sur 61), `titre_casse` porte le gros du reste (174 à revoir sur 211), et un quatrième lot `autorite_collectivite` s'est ajouté (2 à revoir sur 16). **179 verdicts humains restent.** **03/09** — 1 532 autorités (1 305 à midi : +227 créées par le lot C5 le soir même, jamais relues, non typées), 1 468 non typées, `name_lang` sur 22, 6 orphelines, 2 doublons de forme de tri sans casse ; `conv_backup` : titres 211, casse 1 274, patronymes 22, inchangés. **Xavier demande un audit en profondeur des autorités et une correction propre, en nouvelle session** : cadrage écrit, `docs/journal/cadrages/REPRISE_audit_autorites_en_profondeur_2026-09-03.md` — recompter d'abord, rejouer l'audit du 20/08, corriger par lots de la file ou migrations testées, jamais en masse. **03/09, nuit — audit fait** (`journal/audits/AUDIT_autorites_2026-09-03.md`) : 1 532 autorités, 23 livres sans autorité (18 écartés + 5 à `autor` NULL), 3 orphelines (pas 6), **13 paires de doublons exacts** dont 9 nées du lot C5, 17 `preferred_name` en capitales après la correction du 21/08, 14 collectivités inversées ratées par le motif, 12 fiches doubles (O8). **Livré** : cinq migrations testées (CONV-2 sur 17 fiches ; homonymie sans casse ni accents + 8 signalements (les 5 paires de fixtures de formation exclues) ; motif des collectivités + re-semis ~36 ; second semis casse ~40 ; nouveau lot `autorite_forme` ~95). **La file porte désormais ~170 verdicts de plus**, tous humains : lots `autorite_collectivite`, `autorite_casse`, `autorite_forme` dans `/atelier-autoridades`. **Puis, le soir même, sur décision de Xavier (« corrige ce qui est évident ») : quatre migrations d'évidences** — 10 doublons exacts fusionnés, 4 non-agents retirés, 24 contributeurs liés à leur fiche homonyme exacte, 43 lignes évidentes de la file tranchées et appliquées (Xavier en avait posé 87 lui-même entre 20 h 00 et 20 h 07). Restent à la main : les fiches doubles (décision O8), les périodiques et l'éditeur logés dans `authors`, les pseudonymes et les formes hispaniques ambiguës.","pt":"31/08 — a fila `catalog_review_queue` medida, 310 linhas: o lote de **patronímicos está terminado** (0 a rever), `autorite_casse` quase (3 a rever), `titre_casse` carrega o grosso (174 a rever), e um quarto lote `autorite_collectivite` (2 a rever). **Restam 179 vereditos humanos.** **03/09** — 1 532 autoridades (+227 criadas pelo lote C5, não relidas), 1 468 sem tipo. **Auditoria em profundidade pedida, em nova sessão** : cadramento em `docs/journal/cadrages/REPRISE_audit_autorites_en_profondeur_2026-09-03.md`. **03/09, noite — auditoria feita** (`journal/audits/AUDIT_autorites_2026-09-03.md`): 1 532 autoridades, 23 livros sem autoridade (18 descartados + 5 com `autor` NULL), 3 órfãs (não 6), **13 pares de duplicatas exatas**, 9 delas nascidas do lote C5, 17 `preferred_name` em maiúsculas após a correção de 21/08, 14 coletividades invertidas que o padrão não via, 12 fichas duplas (O8). **Entregue**: cinco migrações testadas (CONV-2 em 17 fichas; homonímia sem caixa nem acentos + 8 sinalizações (os 5 pares de fixtures de formação excluídos); padrão das coletividades + nova semeadura ~36; segunda semeadura do lote caixa ~40; novo lote `autorite_forme` ~95). **A fila carrega agora ~170 vereditos a mais**, todos humanos: lotes `autorite_collectivite`, `autorite_casse`, `autorite_forme` em `/atelier-autoridades`. **Depois, na mesma noite, por decisão de Xavier (« corrige o que é evidente »): quatro migrações de evidências** — 10 duplicatas exatas fundidas, 4 não-agentes retirados, 24 contribuidores vinculados à sua ficha homônima exata, 43 linhas evidentes da fila decididas e aplicadas (Xavier havia posto 87 vereditos ele mesmo entre 20h00 e 20h07). Ficam à mão: as fichas duplas (decisão O8), os periódicos e a editora alojados em `authors`, os pseudônimos e as formas hispânicas ambíguas."},{"fr":"24/09 — file `catalog_review_queue` mesurée : **203 lignes « à revoir »** (652 validées, 36 écartées, 35 corrigées), dont **174 de casse de titres**, 36 de forme d autorité, 5 de casse d autorité, 4 de collectivités, 2 de patronymes ; 18 du lot `autor_sans_autorite` restent non appliquées. Toujours de la main, dans l Atelier.","pt":"24/09 — fila medida: **203 linhas « a rever »**, das quais **174 de caixa de títulos**."},{"fr":"27-28/09 — la file ne dépend plus des semis à la main : le cron du lundi `anarbib-conv-file-alimenter` (`7eb72630`, `20260927121437`) passe les cinq semeurs sans jamais reproposer un verdict posé (premier passage : 4 lignes). Les 171 propositions « titre_casse » encore valides (173 en file) ont été refaites selon la casse de la langue, noms propres attestés gardés (`20260927154351`, `20260927163827`), et restent à trancher une à une. `name_lang` se saisit et pilote la découpe des particules (`f4e765c5`, `20260927160008`). Détail dans la clôture de C6. **28/09** : 808 fiches d'autorité sur 1 509 sans type en production (1 468 le 03/09 ; revue de H25, `a692a75e`). Le compte « à revoir » après le passage du lundi 28/09 reste à relever.","pt":"27-28/09 — a fila não depende mais de semeaduras manuais: o cron de segunda-feira `anarbib-conv-file-alimenter` (`7eb72630`, `20260927121437`) passa os cinco semeadores sem nunca repropor um veredito já dado (primeira passagem: 4 linhas). As 171 propostas «titre_casse» ainda válidas foram refeitas pela caixa da língua, nomes próprios atestados mantidos (`20260927154351`, `20260927163827`), e continuam a decidir uma a uma. `name_lang` se preenche e guia o corte das partículas (`20260927160008`). Detalhes no fechamento do C6. **28/09**: 808 fichas de autoridade de 1 509 sem tipo em produção (1 468 em 03/09; revisão do H25, `a692a75e`). A contagem «a rever» depois da passagem de segunda 28/09 ainda precisa ser levantada."},{"fr":"**05/10, inventaire** — quatre restes d'autres chantiers relèvent de cette revue. (1) Le brouillon 4955 du lot 63, « Daniele et Emmanuelle Flamant-Paparatti » : deux personnes, ou Danielle Flamant-Paparatti seule ? Laissé tel quel par C9 (« tout, sauf 4955 »), toujours `draft` au 05/10. (2) E. M. Cioran, `writing_language = 'ro'`, posé par `20260926193111` — il écrit en français après 1949 ; toujours `ro` au 05/10 (clôture C8). (3) Quatre transcriptions de contributeurs non liés restées en capitales : Catanuto, Satrapi, Fučík, Alleg (clôture E28). (4) Compléter les autorités non liées, que « Publié — et maintenant ? » ne propose pas : la liaison ne se fait qu'à la publication (clôture C22).","pt":"**05/10, inventário** — quatro restos de outros canteiros pertencem a esta revisão: (1) rascunho 4955 do lote 63 (uma ou duas pessoas?), ainda `draft`; (2) E. M. Cioran, `writing_language = 'ro'` (escreve em francês depois de 1949), ainda `ro`; (3) quatro transcrições em maiúsculas (Catanuto, Satrapi, Fučík, Alleg); (4) completar as autoridades não ligadas (C22)."}]},{"id":"C4","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Renseigner les pays manquants des fiches d'autorité (674 sur 1 505 au 27/09)","pt":"Preencher os países ausentes das fichas de autoridade (674 de 1 505 em 27/09)"},"v":{"fr":"**Au 29/08, 722 fiches sur 1 305 (55 %) n'avaient pas de `country` ; au 27/09, après trois passes (Wikidata `b418e149`, Library of Congress `abaa4755`, IdRef `62553dc6`), 674 sur 1 505 (45 %).** Or c'est `country` qui pilote la règle d'entrée du nom : sans lui, la détection des doubles patronymes hispaniques ne voit qu'une fraction des cas. Les 22 signalements sont un **plancher**, pas un total.","pt":"**Em 29/08, 722 fichas de 1 305 (55 %) não tinham `country`; em 27/09, depois de três passagens (Wikidata `b418e149`, Library of Congress `abaa4755`, IdRef `62553dc6`), 674 de 1 505 (45 %).** Ora, é `country` que comanda a regra de entrada do nome: sem ele, a detecção dos duplos sobrenomes hispânicos só vê uma fração dos casos. Os 22 apontamentos são um **piso**, não um total."},"w":{"fr":"**Décision de Xavier du 08/10 : enrichissement Wikidata / Library of Congress / IdRef, proposé en revue** — le pays vient d'une autorité externe quand l'identité est sûre (des dates concordantes, OU deux signaux indépendants : un titre du catalogue et une forme du nom, un identifiant déjà lié…), et il est posé en **proposition** dans l'Atelier des autorités (`authority_proposals`), jamais d'office. Les trois passes automatiques de septembre (`decisions*.csv`) sont la matière : rejouer avec le seuil « deux signaux » sur les 674 restantes, verser les candidates en propositions, et laisser l'Atelier les accepter ou les refuser une à une ; les bibliothèques nationales du Brésil et d'Argentine restent fermées, on ne les contourne pas.","pt":"**Decisão de Xavier em 08/10: enriquecimento Wikidata / LC / IdRef, proposto em revisão** — país de autoridade externa quando a identidade é segura, posto como proposta na Oficina, nunca de ofício."},"y":{"fr":"C'est le prérequis dur de toute la chaîne de conventions : `CONV-7` fait de `country` en ISO 3166-1 α-2 une condition, et `CONV-3` fait piloter la casse par la langue. Un catalogue à 45 % sans pays (27/09) applique ses propres règles à moitié.","pt":"É o pré-requisito duro de toda a cadeia de convenções: `CONV-7` faz de `country` em ISO 3166-1 α-2 uma condição, e `CONV-3` faz a caixa ser comandada pela língua. Um catálogo com 45 % sem país (27/09) aplica as próprias regras pela metade."},"f":{"fr":["La proportion de fiches sans `country` est descendue sous 20 %.","La détection des doubles patronymes a été rejouée et la nouvelle liste est passée en revue humaine."],"pt":["A proporção de fichas sem `country` caiu abaixo de 20 %.","A detecção dos duplos sobrenomes foi reexecutada e a nova lista passou por revisão humana."]},"dep":{"fr":"Prérequis de la seconde passe de **C3**.","pt":"Pré-requisito da segunda passagem de **C3**."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A5","REGISTRE §37 CONV-7"],"verif":[{"fr":"31/08 — 726 fiches sur 1 305 sans `country` (55,6 %) : quatre de plus qu'au 29/08. La dette avance plus vite que sa résorption.","pt":"31/08 — 726 de 1 305 fichas sem `country` (55,6 %): quatro a mais que em 29/08."},{"fr":"24/09 — **925 autorités sur 1 505 sans `country` (61 %)**, contre 726 sur 1 305 le 31/08 (55,6 %) : la dette avance toujours plus vite que sa résorption, et le lot C5 (227 autorités créées le 03/09) y est pour beaucoup.","pt":"24/09 — **925 autoridades em 1 505 sem `country` (61 %)**, contra 55,6 % em 31/08."},{"fr":"26/09 — **mesuré après l'enrichissement des autorités** (Wikidata puis Library of Congress, voir la clôture de C8) : 185 pays posés, **740 fiches sur 1 505 (49 %) toujours sans pays**. Le critère « sous 20 % » n'est **pas atteignable par des sources d'autorité** : 668 des 735 fiches restantes (copie de banc) ont un seul livre au catalogue — brochures, travaux universitaires brésiliens (371 en portugais) et hispano-américains (155) — et ne figurent ni dans Wikidata ni, avec une preuve, à la LC. Déduire la nationalité de la langue ou du lieu d'édition serait une supposition : non fait. **Décision à prendre par Xavier** : réécrire le critère (par exemple « sous 20 % parmi les autorités à deux livres ou plus »), ou garder l'item pour une relecture humaine sur `decisions.csv`. Le second critère (rejouer la détection des doubles patronymes) peut se faire dès maintenant sur les 185 pays neufs.","pt":"26/09 — medido após o enriquecimento das autoridades: 185 países postos, 740 de 1 505 fichas (49 %) ainda sem país; o critério « abaixo de 20 % » não é alcançável por fontes de autoridade (668 das restantes têm um só livro no catálogo). Decisão de Xavier: reescrever o critério ou manter para revisão humana."},{"fr":"27/09 — **troisième phase, IdRef** (`20260927091555`, `62553dc6`) : les bibliothèques nationales du Brésil (403 à toute requête) et d'Argentine (X-Services refusés au public) ferment l'accès automatisé — non contourné ; IdRef (ABES) porte la nationalité (102) et couvre beaucoup d'auteurs brésiliens et hispano-américains étudiés en France. 187 fiches liées, **66 pays**, 150 langues, 33 naissances, 9 morts, chacune prouvée par un titre du catalogue ou des dates concordantes (`decisions-idref.csv`). **En production : 674 fiches sur 1 505 sans pays (45 %)**, 683 sans année de naissance, 820 liées à au moins une source (Wikidata, VIAF, ISNI, LC ou IdRef). Le critère « sous 20 % » reste hors de portée des sources d'autorité ; la décision de Xavier reste ouverte (réécrire le critère ou relecture humaine).","pt":"27/09 — terceira fase, IdRef: as bibliotecas nacionais do Brasil (403) e da Argentina (X-Services recusados) fecham o acesso automatizado — não contornado; 187 fichas ligadas, 66 países, 150 línguas. Em produção: 674 de 1 505 fichas sem país (45 %). O critério « abaixo de 20 % » continua fora do alcance; decisão de Xavier em aberto."},{"fr":"**08/10 — tranché par Xavier : « enrichissement Wikidata/LC, proposé en revue ».** L'item passe de la décision au travail (ci-dessus) ; le critère 1 (sous 20 %) se mesure après les acceptations de l'Atelier.","pt":"**08/10 — decidido por Xavier: enriquecimento proposto em revisão.** O item passa da decisão ao trabalho."},{"fr":"**09/10 — la règle rejouée, quatorze propositions dans l'Atelier.** 675 fiches sans pays (hors fixtures de formation). Les trois passes de septembre relues sous la règle « dates concordantes ou deux signaux » (`c4-candidats.mjs`, dans la trace `enrichissement-autorites-2026-09-26`, Wikidata interrogé pour la nationalité) : 424 introuvables, 121 sans second signal, 62 fiches postérieures au 26/09 jamais passées, 22 homonymies à deux signaux, 19 acceptées sans nationalité connue, 17 candidates Wikidata avec pays, 4 LC par lieu de naissance. Flor O'Squarr exclu (relecture de septembre), six homonymes probables écartés par Xavier. **Quatorze propositions ouvertes** (`api.fn_authority_propose`, `edition`, `fields.country` + `wikidata_id`, sous le compte de Xavier, échéance 16/10) : Berman US, Berthelot FR, de Campos BR, Carton FR, Dubief FR, Jackson GB, de Oliveira PT, Stein US, Duval FR, Jaguar BR, Albornoz ES, Ferrari AR, Rodríguez MX, Rudy BR. **Reste** : la revue des quatorze dans l'Atelier ; une passe Wikidata pour les 62 fiches nées depuis le 26/09 (en propositions) ; le critère 1 (sous 20 %) est hors de portée des sources ouvertes (45 % → 44 % si tout est accepté) : à retrancher ou à confier à la revue humaine de C3.","pt":"**09/10 — regra reaplicada, catorze propostas no Ateliê.** 675 fichas sem país ; passes de setembro relidas (datas concordantes ou dois sinais) : 424 não encontradas, 121 sem segundo sinal, 62 fichas posteriores a 26/09 nunca passadas ; 14 propostas abertas (edition, país + Wikidata), prazo 16/10. Resta a revisão no Ateliê e uma passagem Wikidata para as 62 fichas novas ; o critério « menos de 20 % » está fora do alcance das fontes abertas."}]},{"id":"C15","d":"C","p":"P2","s":"ouvert","e":"S","sk":["biblio"],"t":{"fr":"Corriger huit notices BTL, livre en main","pt":"Corrigir oito registros da BTL, com o livro na mão"},"v":{"fr":"La recherche de couvertures a fait remonter des données fautives, relevées en production le 28/09 (`docs/journal/chantiers/LIVRAISON_capas_2026-09-27.md`). **Six années impossibles** : BTL-TL-002174 `0187`, BTL-TL-002032 `0193`, BTL-TL-000065 et BTL-TL-001935 `0200`, BTL-TL-002053 `8000`, BTL-TL-002278 `2200` — cette dernière a aussi un lieu où s'est collée une ligne de colophon, avec un ISBN incomplet. **Un ISBN à clé de contrôle fausse** : BTL-TL-000503. S'y ajoute BTL-TL-002335, relevée à l'écran le 27/09 : elle décrit l'édition Ramparts Press de 1971 et porte l'ISBN de l'édition AK Press de 2004 (`027e6903`). Les deux « ISBN partagés » du même relevé ne sont pas des fautes : ce sont des paires BTL/BLMF d'une même édition, dont la fusion est une mutualisation (`DEDUP-8`).","pt":"A busca de capas trouxe à tona dados errados, levantados em produção em 28/09 (`docs/journal/chantiers/LIVRAISON_capas_2026-09-27.md`). **Seis anos impossíveis**: BTL-TL-002174 `0187`, BTL-TL-002032 `0193`, BTL-TL-000065 e BTL-TL-001935 `0200`, BTL-TL-002053 `8000`, BTL-TL-002278 `2200` — este último também tem um local onde grudou uma linha de colofão, com um ISBN incompleto. **Um ISBN com dígito verificador errado**: BTL-TL-000503. Soma-se BTL-TL-002335, vista na tela em 27/09: descreve a edição Ramparts Press de 1971 e traz o ISBN da edição AK Press de 2004 (`027e6903`). Os dois «ISBN compartilhados» do mesmo levantamento não são erros: são pares BTL/BLMF de uma mesma edição (`DEDUP-8`)."},"w":{"fr":"Notice par notice, dans le formulaire, livre en main : lire la valeur sur le livre, corriger, publier. **Jamais par migration** : une migration devinerait (décision de Xavier du 28/09). Les valeurs « probables » de la note de livraison sont des pistes, pas des corrections.","pt":"Registro por registro, no formulário, com o livro na mão: ler o valor no livro, corrigir, publicar. **Nunca por migração**: uma migração adivinharia (decisão de Xavier de 28/09). Os valores «prováveis» da nota de entrega são pistas, não correções."},"y":{"fr":"Une année `8000` ou `0187` fausse le tri par année et le filtre par date de l'OPAC ; un ISBN d'une autre édition fait proposer la couverture de cette autre édition. Seule une personne qui a le livre en main peut trancher, et la liste ne vit aujourd'hui que dans une note de livraison : rien ne dirait quand elle est soldée.","pt":"Um ano `8000` ou `0187` distorce a ordenação por ano e o filtro por data do OPAC; um ISBN de outra edição faz propor a capa dessa outra edição. Só quem tem o livro na mão pode decidir, e a lista hoje só vive numa nota de entrega: nada diria quando ela está resolvida."},"f":{"fr":["Chacune des huit notices est corrigée, ou sa valeur confirmée sur le livre.","Aucune correction n'est faite par migration."],"pt":["Cada um dos oito registros está corrigido, ou seu valor confirmado no livro.","Nenhuma correção é feita por migração."]},"dep":{"fr":"Avoir les livres en main (fonds de la BTL) ; Xavier, au formulaire.","pt":"Ter os livros na mão (acervo da BTL); Xavier, no formulário."},"r":["docs/journal/chantiers/LIVRAISON_capas_2026-09-27.md (« à corriger dans le formulaire, livre en main »)","REGISTRE §43 CAPAS","commit 027e6903 (BTL-TL-002335)"]},{"id":"C16","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio","sql"],"t":{"fr":"Attribuer les couvertures posées avant le 27/09","pt":"Atribuir as capas postas antes de 27/09"},"v":{"fr":"La spec des capas (§4.3) fait de l'attribution — la source et la licence de chaque couverture — une exigence éthique et de conformité. **Mesuré le 27/09 en production : 0 couverture attribuée sur les 250 notices publiées qui en ont une, et 0 sur les 132 brouillons dans le même cas.** Le formulaire ne mettait pas la paire dans le brouillon (`fd5d2f0e`), et ni la publication ni la reprise ne la recopiaient (`76c6ae3f`, migration `20260927130518`). Depuis, provenance et licence suivent l'image par paire (`CAPAS-4`) — pour les couvertures posées après le 27/09 seulement : aucune migration ne reprend le stock. Et Inventaire ne dit pas la licence de ses images : elle est posée à null, « à vérifier » (`2a80d43b`).","pt":"A spec das capas (§4.3) faz da atribuição — a fonte e a licença de cada capa — uma exigência ética e de conformidade. **Medido em 27/09 em produção: 0 capa atribuída entre os 250 registros publicados que têm uma, e 0 entre os 132 rascunhos no mesmo caso.** O formulário não punha o par no rascunho (`fd5d2f0e`), e nem a publicação nem a retomada o copiavam (`76c6ae3f`, migração `20260927130518`). Desde então, procedência e licença seguem a imagem em par (`CAPAS-4`) — só para as capas postas depois de 27/09: nenhuma migração retoma o estoque. E o Inventaire não diz a licença das suas imagens: fica nula, «a verificar» (`2a80d43b`)."},"w":{"fr":"Relever combien de couvertures publiées restent sans provenance. Puis écrire une règle pour le stock, décidée par Xavier : une provenance retrouvée là où une trace la donne, sinon « inconnue », posée et assumée par écrit. Pour les images d'Inventaire, vérifier la licence à la source, ou assumer son absence par écrit.","pt":"Levantar quantas capas publicadas continuam sem procedência. Depois escrever uma regra para o estoque, decidida por Xavier: uma procedência recuperada onde um rastro a dá, senão «desconhecida», posta e assumida por escrito. Para as imagens do Inventaire, verificar a licença na fonte, ou assumir sua ausência por escrito."},"y":{"fr":"Une couverture est l'image d'un tiers : sans sa source, on ne peut ni la créditer ni la retirer si on nous le demande. La règle par paire tient les poses nouvelles ; le stock d'avant le 27/09 reste muet, et aucun item ne le portait.","pt":"Uma capa é a imagem de um terceiro: sem a fonte, não se pode nem creditá-la nem retirá-la se pedirem. A regra em par vale para as capas novas; o estoque de antes de 27/09 continua mudo, e nenhum item o carregava."},"f":{"fr":["Chaque couverture publiée a une provenance, ou une raison écrite de n'en pas avoir.","La licence des images d'Inventaire est vérifiée, ou son absence assumée par écrit."],"pt":["Cada capa publicada tem uma procedência, ou um motivo escrito para não ter.","A licença das imagens do Inventaire está verificada, ou sua ausência assumida por escrito."]},"dep":{"fr":"Aucune : la règle par paire (`20260927130518`) est en production.","pt":"Nenhuma: a regra em par (`20260927130518`) está em produção."},"r":["docs/specs/archive/spec-module-capas.md §4.3","REGISTRE §43 CAPAS-4","docs/journal/chantiers/LIVRAISON_capas_2026-09-27.md","commits fd5d2f0e, 76c6ae3f, 2a80d43b"]},{"id":"C17","d":"C","p":"P2","s":"a-verifier","e":"S","sk":["biblio","sql"],"t":{"fr":"Décider si un numéro d'inventaire supprimé peut être redonné","pt":"Decidir se um número de tombo apagado pode ser dado de novo"},"v":{"fr":"`CCLA.2026.93`, créé par erreur le 27/09 depuis un poste BLMF sur BTL-TL-000881, a été retiré le 28/09 (`96b4a104`, migration `20260928111729`, exemplaire 2796). Le 29/09, l'exemplaire initial de la notice d'essai « Je suis une légende » a reçu le même numéro, `CCLA.2026.93` (verif d'E6). Ce n'est pas une panne : `fn_next_tombo` rend le plus grand numéro sous le préfixe, plus un (`20260815145252`), et la contrainte `exemplares_unique_tombo` ne vaut qu'entre exemplaires présents. Supprimer le dernier exemplaire d'une série libère donc son numéro. Rien n'écrit si c'est voulu : ni le REGISTRE, ni les specs.","pt":"`CCLA.2026.93`, criado por engano em 27/09 a partir de um posto da BLMF em BTL-TL-000881, foi retirado em 28/09 (`96b4a104`, migração `20260928111729`, exemplar 2796). Em 29/09, o exemplar inicial do registro de ensaio «Je suis une légende» recebeu o mesmo número, `CCLA.2026.93` (verif do E6). Não é uma falha: `fn_next_tombo` devolve o maior número sob o prefixo, mais um (`20260815145252`), e a restrição `exemplares_unique_tombo` só vale entre exemplares presentes. Apagar o último exemplar de uma série libera o seu número. Nada diz se isso é desejado: nem o REGISTRO, nem as specs."},"w":{"fr":"**Décision de Xavier du 08/10 : un numéro donné ne se redonne jamais** (règle a). À écrire au REGISTRE, puis : `fn_next_tombo` rend le plus grand numéro **jamais attribué** sous le préfixe, journal compris — un compteur par préfixe (table `tombo_series`, ou la lecture du journal des exemplaires supprimés `catalog_audit_log`), par une migration testée ; suite SQL : supprimer le dernier exemplaire d'une série, en créer un, le numéro est le suivant, pas le même. Vérifier que l'import (H19, tombos par série) et la création à N exemplaires passent par le même compteur.","pt":"**Decisão de Xavier em 08/10: um número dado nunca se devolve.** Escrever no REGISTRE; `fn_next_tombo` devolve o maior número já atribuído sob o prefixo, diário incluído; suíte SQL."},"y":{"fr":"Un numéro d'inventaire s'écrit sur le livre et dans les registres papier. S'il se redonne après une suppression, deux livres peuvent porter le même numéro — l'un sorti de la base, l'autre dedans — et un prêt, un récolement ou une étiquette peuvent les confondre.","pt":"Um número de tombo se escreve no livro e nos registros em papel. Se ele é dado de novo depois de uma exclusão, dois livros podem ter o mesmo número — um fora do banco, o outro dentro — e um empréstimo, um inventário ou uma etiqueta podem confundi-los."},"f":{"fr":["La règle est écrite au REGISTRE.","Si un numéro ne doit jamais se redonner, une suite SQL le prouve : supprimer le dernier exemplaire d'une série, puis en créer un."],"pt":["A regra está escrita no REGISTRO.","Se um número nunca deve ser dado de novo, uma suíte SQL o prova: apagar o último exemplar de uma série, depois criar um."]},"dep":{"fr":"Décision de Xavier.","pt":"Decisão de Xavier."},"r":["supabase/migrations/20260815145252_tombo_collision_robustness.sql","supabase/migrations/20260928111729_btl_tl_000881_exemplaire_blmf_retire_et_tirages_notes.sql","item E6 (verif du 29/09)"],"verif":[{"fr":"**08/10 — tranché par Xavier : « Jamais redonné ».** L'item passe de la décision au travail : compteur par préfixe et suite SQL (ci-dessus).","pt":"**08/10 — decidido por Xavier: « nunca devolvido ».** O item passa da decisão ao trabalho."},{"fr":"**09/10 — livré, déployé et vérifié à 21 h 59** (`5a5a94d6`, REGISTRE `CAT-E21`). `public.tombos_attribues`, le registre de tous les numéros jamais portés par un exemplaire, repris du stock (2 762) et du journal des suppressions (13 numéros, dont les cinq déjà redonnés — l'histoire reste écrite, elle ne se répète plus) ; deux déclencheurs sur `exemplares` : un numéro déjà donné que plus aucun exemplaire présent ne porte est refusé (`error.catalog.tombo.deja_attribue`, dix locales), un numéro porté par un exemplaire présent reste à l'unicité que la publication sait rejouer, tout numéro posé entre au registre ; `fn_next_tombo` (réécrite sur sa définition vivante, md5 vérifié) rend le plus grand numéro jamais attribué, stock et registre. Suite `tombo_jamais_redonne` (6 : 001/002 au registre ; 002 supprimé → le prochain est 003 ; 002 redonné à la main : refusé ; changement vers un numéro libéré : refusé, vers un neuf : accepté, retour au sien : accepté ; numéro d'un exemplaire présent : 23505 ; registre et déclencheurs fermés), mutant sans le registre rouge (4/6). Critère 1 (règle au REGISTRE) et critère 2 (la suite) tenus ; **reste à voir à l'écran** : saisir à la main, dans le formulaire d'exemplaire, un numéro d'un exemplaire supprimé et lire le refus traduit (E31).","pt":"**09/10 — entregue e verificado às 21 h 59** (`5a5a94d6`, `CAT-E21`). Registro de todos os tombos já dados (`tombos_attribues`), recusa de um tombo liberado por uma exclusão, `fn_next_tombo` sobre o maior tombo já dado. Suíte 6/6, mutante vermelho. Resta ver na tela a recusa traduzida (E31)."}]},{"id":"C18","d":"C","p":"P2","s":"bloque","e":"M","sk":["biblio"],"t":{"fr":"Relire quatorze rapprochements d'œuvres : une même œuvre scindée en deux fiches ?","pt":"Revisar catorze aproximações de obras: uma mesma obra dividida em duas fichas?"},"v":{"fr":"Relevé le 01/10 (lecture seule, production), en cherchant d'autres cas comme l'œuvre 1163 (E26) : un titre « auto » d'une œuvre A qui est le titre réel — d'édition ou saisi — d'une autre œuvre B du même auteur·rice. Quatorze paires, douze œuvres A. La plupart ne sont pas des titres faux mais des **traductions d'une même œuvre rangées sous deux fiches** : Reclus, *L'Homme et la Terre* (133) / *O Homem e a Terra* (880) / *El Hombre y la Tierra* (1131) ; Reclus, *Evolución, Revolución y el Ideal anárquico* (268) / 1387 (fr) / 1203 (pt) ; Kropotkine, *A Conquista do Pão* (19) / 2381, *El Apoyo Mutuo* (79) / *Ajuda Mútua* (396), *A Grande Revolução* (1) / 1084, *Em Tôrno de uma Vida* (115) / 386 ; Tolstoï, *A insubmissão* (28) / 1297 ; Gori (48) / 873 ; Safón (99) / 2428 ; Horowitz (74) / 2484. **À trancher au cas par cas, comme 1163** : Nettlau, *La Anarquía a través de los tiempos* (2036) / *História da Anarquia* (196) — même texte ou non ? — et Kropotkine, *Moral anarquista* (1366) / *La Moral Anarquista y otros escritos* (2064), recueil contre texte seul.","pt":"Levantado em 01/10 (somente leitura): catorze pares de obras do mesmo autor·a em que um título «auto» de uma é o título real da outra. Em geral, traduções de uma mesma obra em duas fichas (Reclus 133/880/1131, 268/1387/1203; Kropotkin 19/2381, 79/396, 1/1084, 115/386; Tolstói 28/1297; Gori 48/873; Safón 99/2428; Horowitz 74/2484). Casos a decidir: Nettlau 2036/196 e Kropotkin 1366/2064 (coletânea contra texto único)."},"w":{"fr":"Relire chaque paire avec les éditions en main ; réunir celles qui sont la même œuvre, depuis l'application ; pour les autres, faire comme pour 1163 : titres « auto » remplacés, note d'œuvre qui dit pourquoi elles restent distinctes.","pt":"Revisar cada par com as edições; reunir as que são a mesma obra; para as outras, fazer como para 1163."},"y":{"fr":"Une œuvre scindée s'affiche deux fois au catalogue par œuvre, et chaque fiche ne montre qu'une partie des éditions ; un abrégé fondu dans l'intégrale ferait réserver l'un pour l'autre.","pt":"Uma obra dividida aparece duas vezes no catálogo por obra; um resumo fundido na íntegra faria reservar um pelo outro."},"f":{"fr":["Les quatorze paires sont tranchées par une personne qui catalogue, pas par script ; la requête de relevé ne renvoie plus que des paires décidées distinctes, chacune avec sa note."],"pt":["Os catorze pares decididos por quem cataloga, não por script; cada par mantido distinto tem sua nota."]},"dep":{"fr":"Se fait dans l'application. La requête de relevé est dans la session du 01/10 (titres `auto` d'une œuvre = titre d'édition ou `edition`/`manual` d'une autre œuvre de même `primary_author_id`).","pt":"Faz-se no aplicativo."},"r":[],"verif":{"fr":"01/10 — relevé en production : 14 paires, 12 œuvres A ; aucune modification faite. **05/10 — arbitré par Xavier, appliqué** (`c923fdc0`, migration `20261005071913`, CI verte, joué à blanc en production avant) : huit réunions d'œuvres entières — Kropotkine 1084→1 (la notice italienne 2209 reçoit sa langue), 2381→19, 396→79, 386→115 ; Gori 873→48 ; Safón 2428→99 ; Horowitz 2484→74 ; Reclus 268 et 1203→1387 (œuvre de langue originale). *L'Homme et la Terre* : les six tomes Maucci rejoignent ceux de 1905 (œuvre 133, « 2 éditions · 12 volumes » à l'écran) ; FCE 1986 (1131, sélection — à confirmer sur l'exemplaire) et les volumes Imaginário (880, extraits) restent à part, avec une note et leur titre propre dans toutes les langues, comme 1163. La notice 143 (*La Moral anarquista y otros escritos*) rejoint le recueil 2064. Aucune fusion décidée par script. **Reste** : Tolstoï 28/1297 (recueil ou texte seul ? sommaire de l'édition Madre Tierra 1991) ; Nettlau 2036/196 (proposé « distinctes », puis retenu : les titres de 2036 — *A Short History of Anarchism*, *Histoire de l'anarchie* — sont ceux des traductions de *La Anarquía a través de los tiempos*, et l'éd. Hedra pourrait l'être aussi) ; notices en double, à l'assistant de doublons : 2601/1195 (Júcar 1978), 143/138 (Anarres 2008). **05/10, suite — les deux doublons de notices fusionnés** (`176e6894`, migration `20261005092727`, poussée par Xavier, CI verte) : 1195 → 2601 (Nettlau, Júcar 1978 : notice MLEG gardée pour que son fonds garde la cote MLEG-0144 ; titre, éditeur, ISBN, langue et CDD repris de 1195 ; le fonds BTL garde BTL-TL-001276) ; 143 → 138 (Kropotkine, Anarres/Terramar 2008 : deux exemplaires BTL d'une même édition — BTL-TL-EX-000142 garde son numéro d'inventaire et prend la cote BTL-TL-000137, **étiquette à refaire** ; éditeur repris, pas le sous-titre). Fusions journalisées sous l'identité de Xavier, à sa demande explicite (en-tête de la migration). **Reste** : Tolstoï 28/1297 et Nettlau 2036/196 (désormais une seule notice, 2601), à trancher livres en main. **05/10, fin de journée — bloqué, en attente de lectures sur les livres** : Tolstoï 28/1297 attend la BTL (seule détentrice de *La Insumisión*, Madre Tierra 1991, BTL-TL-000156 : texte seul ou recueil ?) — message préparé pour elle, avec deux autres points BTL : la nature de *El Hombre y la Tierra* FCE 1986 (BTL-TL-001131, sélection ou intégrale) et l'étiquette de l'exemplaire BTL-TL-EX-000142 à refaire. Nettlau 2036/196 attend la page de crédits (« Título original ») de *História da Anarquia*, Hedra 2008 — un exemplaire est à la BLMF (0000083), Xavier la lit ; la fiche AnarBib ne le dit pas. **05/10, après-midi — Nettlau tranché : deux œuvres distinctes** (`a6dec157`, migration `20261005102619`, CI verte). Pièce : la page de crédits de l'éd. Hedra 2008, lue par Xavier sur l'exemplaire BLMF 0000083 — pas de « Título original », CIP « Frank Mintz (org. e intro). Plínio Augusto Coêlho (trad.) » : un recueil choisi et présenté par Mintz, pas la traduction d'un livre (précédent Thoreau). Le titre pt-BR « auto » de 2036 (« História da Anarquia ») devient son titre propre ; une note sur 2036 et sur 196 les départage. À compléter au catalogage (hors C18) : la notice 2287 ne nomme ni Frank Mintz (org., intro.) ni Plínio Augusto Coêlho (trad.). **Reste seulement Tolstoï 28/1297, en attente de la BTL** (sommaire de *La Insumisión*, BTL-TL-000156). **05/10, soir** — le brouillon périmé 6393 de la notice 2287 est écarté (`e60e34a7`, migration `20261005115704`) : il portait l'ancienne liste de contributeurs et aurait défait la correction de Xavier (brouillon 6398, publié). Relevé en production le soir même : la notice 2287 nomme Max Nettlau (auteur), Frank Mintz (organisation) et Plínio Augusto Coelho (traduction) — la note « ne nomme ni Frank Mintz ni Plínio Augusto Coêlho » est soldée.","pt":"01/10 — levantamento em produção: 14 pares; nada modificado. **05/10 — arbitrado por Xavier, aplicado** (`c923fdc0`, migração `20261005071913`): oito obras reunidas (Kropotkin ×4, Gori, Safón, Horowitz, Reclus); os seis tomos Maucci juntam-se aos de 1905 (obra 133); FCE 1986 e Imaginário ficam à parte com nota; notícia 143 no recueil 2064. Resta: Tolstói 28/1297, Nettlau 2036/196, notícias duplicadas 2601/1195 e 143/138. **05/10 — duas notícias duplicadas fundidas** (`176e6894`): 1195 → 2601 (Nettlau, cota MLEG-0144 mantida), 143 → 138 (Kropotkin, dois exemplares BTL; etiqueta do BTL-TL-EX-000142 a refazer). Resta: Tolstói 28/1297 e Nettlau 2036/196. **05/10 — bloqueado**: Tolstói 28/1297 aguarda a BTL (sumário de *La Insumisión*, BTL-TL-000156); também FCE 1986 (BTL-TL-001131) e etiqueta do BTL-TL-EX-000142. Nettlau 2036/196 aguarda a página de créditos (« Título original ») do exemplar BLMF 0000083 da Hedra. **05/10 — Nettlau resolvido: obras distintas** (`a6dec157`): a ed. Hedra é uma seleção organizada por Frank Mintz (página de créditos, exemplar BLMF 0000083); notas em 2036 e 196. Resta só Tolstói 28/1297, aguardando a BTL. **05/10, à noite** — o rascunho obsoleto 6393 da notícia 2287 é descartado (`e60e34a7`, migração `20261005115704`): desfaria a correção de Xavier (rascunho 6398, publicado). Em produção, a 2287 nomeia Max Nettlau, Frank Mintz (organização) e Plínio Augusto Coelho (tradução) — a nota correspondente está resolvida."}},{"id":"D3","d":"D","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Rattacher les 91 fascicules et les 87 monographies suspectes de SOLIDAIRES","pt":"Vincular os 91 fascículos e as 87 monografias suspeitas de SOLIDAIRES"},"v":{"fr":"Le fichier SOLIDAIRES porte déjà des colonnes `revue` et `numero` : **12 titres à créer, 91 fascicules à lier**. En plus, **87 monographies portent « n° » dans leur titre** et sont marquées par un drapeau `numero_dans_titre` : ce sont des candidates au rattachement.","pt":"O arquivo SOLIDAIRES já traz colunas `revue` e `numero`: **12 títulos a criar, 91 fascículos a vincular**. Além disso, **87 monografias trazem «n°» no título** e estão marcadas por uma flag `numero_dans_titre`: são candidatas ao vínculo."},"w":{"fr":"Créer les 12 titres, lier les 91 fascicules, puis **soumettre** les 87 candidates à quelqu'un qui connaît le fonds. Ne pas les rattacher automatiquement.","pt":"Criar os 12 títulos, vincular os 91 fascículos, depois **submeter** as 87 candidatas a alguém que conheça o acervo. Não vinculá-las automaticamente."},"y":{"fr":"Un titre qui contient « n° » n'est pas toujours un fascicule — c'est parfois un titre de collection, parfois une coquille. Le drapeau signale, il ne décide pas. Et le réseau ne compte aujourd'hui que 4 titres de périodiques : ce lot les multiplierait par quatre, et éprouverait le sous-système pour de bon.","pt":"Um título que contém «n°» nem sempre é um fascículo — às vezes é um título de coleção, às vezes um erro de digitação. A flag sinaliza, não decide. E a rede conta hoje apenas 4 títulos de periódicos: este lote os multiplicaria por quatro, e testaria o subsistema de verdade."},"f":{"fr":["Les 12 titres existent et les 91 fascicules y sont rattachés.","Les 87 candidates ont été soumises, et chaque verdict est humain.","Le comportement observé sur les quatre notices *Encontros com a Civilização brasileira* confirme la règle anti-faux-doublons : deux paires en sortent, deux y restent."],"pt":["Os 12 títulos existem e os 91 fascículos estão vinculados.","As 87 candidatas foram submetidas, e cada veredicto é humano.","O comportamento observado nos quatro registros *Encontros com a Civilização brasileira* confirma a regra antifalsos-duplicados: dois pares saem, dois ficam."]},"dep":{"fr":"**Bloqué par C2**, donc par **G7** et **A1**. La révision de la spec (**D1**) peut se faire sans attendre.","pt":"**Bloqueado por C2**, portanto por **G7** e **A1**. A revisão da spec (**D1**) pode ser feita sem esperar."},"r":["spec-periodiques-v0.1 §10","REPRISE_claude_code_2026-08-27"],"verif":[{"fr":"31/08 — les 1 673 brouillons SOLIDAIRES sont en base (voir C2) et **aucun ne porte de `serial_id`** : le rattachement des fascicules n'a pas commencé. Toujours derrière G7. **15/09** — la bibliothèque de destination existe (Solidaires, 14/09) et le lot lui est attribué ; le rattachement des 91 fascicules et des 87 monographies suspectes reste à faire dans le lot, avant la promotion, et reste bloqué par C2/G7.","pt":"31/08 — os 1 673 rascunhos SOLIDAIRES estão no banco (ver C2) e **nenhum traz `serial_id`**: o vínculo dos fascículos não começou. **15/09** — a biblioteca de destino existe e o lote está-lhe atribuído ; o resto continua bloqueado por C2/G7."},{"fr":"24/09 — **débloqué** : la fiche disait « bloqué par C2, donc G7 et A1 » ; C2 et G7 sont clos (Solidaires admise le 15/09, lot 63 attribué). Mesuré : 0 brouillon sur 1 673 porte un `serial_id`. Le rattachement des 91 fascicules et l examen des 87 candidates sont à faire dans le lot, avant sa promotion — bibliothéconomie, dans l application.","pt":"24/09 — **desbloqueado**: C2 e G7 estão fechados (Solidaires admitida em 15/09). Medido: 0 rascunhos em 1 673 com `serial_id`. A ligar antes da promoção do lote."}]},{"id":"D4","d":"D","p":"P1","s":"ouvert","e":"XL","sk":["biblio","front","collectif"],"t":{"fr":"Le matériel éphémère : tracts, affiches, autocollants, zines","pt":"O material efêmero: panfletos, cartazes, adesivos, fanzines"},"v":{"fr":"Rien n'existe. Le modèle de notice hérité de la bibliothéconomie du livre ne sait pas décrire ce matériel, et AnarBib ne fait pas exception. C'est le besoin **le plus mal couvert**, pour une part énorme de nos fonds.","pt":"Nada existe. O modelo de registro herdado da biblioteconomia do livro não sabe descrever esse material, e o AnarBib não é exceção. É a necessidade **pior atendida**, para uma parte enorme dos nossos acervos."},"w":{"fr":"Ce matériel n'a ni ISBN, ni éditeur, souvent ni auteur ni titre. Il est visuel autant que textuel : une affiche ne se résume pas à son océrisation. Le chantier commence par de la réflexion documentaire — que décrit-on, avec quoi, et pour qui — avant toute table.","pt":"Este material não tem ISBN, nem editora, frequentemente nem autor nem título. É visual tanto quanto textual: um cartaz não se resume à sua ocerização. O canteiro começa por reflexão documental — o que se descreve, com quê, e para quem — antes de qualquer tabela."},"y":{"fr":"C'est ce que les bibliothèques militantes ont de plus spécifique et de moins outillé. Les vocabulaires d'éphémères construits ailleurs — NORLA, avec ses facettes *Tactics* et *Social Movement* — sont **monolingues** et sans lien avec le thésaurus FICEDL : il y a là un travail commun à faire, pas un module à écrire seul.","pt":"É o que as bibliotecas militantes têm de mais específico e menos aparelhado. Os vocabulários de efêmeros construídos alhures — NORLA, com suas facetas *Tactics* e *Social Movement* — são **monolíngues** e sem vínculo com o tesauro FICEDL: há aí um trabalho comum a fazer, não um módulo a escrever sozinho."},"f":{"fr":["Un cadrage documentaire écrit, discuté avec au moins un autre fonds.","Un modèle minimal éprouvé sur cinquante pièces réelles.","**Ce n'est pas un chantier pour quelqu'un qui veut seulement écrire des fonctions.**"],"pt":["Um enquadramento documental escrito, discutido com pelo menos um outro acervo.","Um modelo mínimo testado em cinquenta peças reais.","**Não é um canteiro para quem só quer escrever funções.**"]},"dep":{"fr":"À relier à **H6** (alignement des vocabulaires militants) et à la rencontre de Bologne.","pt":"A ligar a **H6** (alinhamento dos vocabulários militantes) e ao encontro de Bolonha."},"r":["docs/CHANTIERS_OUVERTS.md §3","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"D5","d":"D","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Éprouver la chaîne de numérisation sur dix ouvrages avant d'équiper qui que ce soit","pt":"Testar a cadeia de digitalização em dez obras antes de equipar quem quer que seja"},"v":{"fr":"La règle est actée et tient en une phrase : « on capture en niveaux de gris, on livre en bitonal, on ne garde en ligne que ce qui est livré ». Les plafonds de buckets sont posés en production. **L'outil de dérivation n'est pas choisi**, et la fiche pratique d'une page n'est pas écrite.","pt":"A regra está registrada e cabe numa frase: «captura-se em tons de cinza, entrega-se em bitonal, só se mantém on-line o que é entregue». Os tetos dos buckets estão em produção. **A ferramenta de derivação não foi escolhida**, e a ficha prática de uma página não está escrita."},"w":{"fr":"Comparer ScanTailor + `img2pdf` avec `unpaper` ou ImageMagick sur dix ouvrages réels et variés, mesurer le poids et la lisibilité, choisir. Puis écrire la fiche : trois réglages, cinq contrôles, rien d'autre.","pt":"Comparar ScanTailor + `img2pdf` com `unpaper` ou ImageMagick em dez obras reais e variadas, medir o peso e a legibilidade, escolher. Depois escrever a ficha: três ajustes, cinco controles, nada mais."},"y":{"fr":"Équiper une bibliothèque avec une chaîne non éprouvée, c'est lui faire scanner deux cents pages qu'il faudra refaire. Et le seuillage bitonal est **destructeur et irréversible** : on ne scanne jamais directement en bitonal, jamais.","pt":"Equipar uma biblioteca com uma cadeia não testada é fazê-la escanear duzentas páginas que será preciso refazer. E a limiarização bitonal é **destrutiva e irreversível**: nunca se escaneia diretamente em bitonal, nunca."},"f":{"fr":["Un outil est choisi, avec les mesures qui ont décidé.","La fiche pratique d'une page existe, en portugais et en français.","Le sort des images de capture est écrit : archivage hors ligne systématique ou effacement après validation — **la réponse appartient à chaque bibliothèque, mais elle doit être écrite quelque part**."],"pt":["Uma ferramenta é escolhida, com as medidas que decidiram.","A ficha prática de uma página existe, em português e francês.","O destino das imagens de captura está escrito: arquivamento off-line sistemático ou apagamento após validação — **a resposta pertence a cada biblioteca, mas precisa estar escrita em algum lugar**."]},"dep":{"fr":"Le dimensionnement annoncé (20 Go pour démarrer, jusqu'à 50 Go sur 3-5 ans) dépend du choix d'outil.","pt":"O dimensionamento anunciado (20 GB para começar, até 50 GB em 3-5 anos) depende da escolha da ferramenta."},"r":["DECISION_profil_numerisation_2026-08-20 §9"]},{"id":"E1","d":"E","p":"P1","s":"ouvert","e":"M","sk":["aucune","front"],"t":{"fr":"Faire auditer l'accessibilité par quelqu'un qui n'a pas écrit le code","pt":"Fazer auditar a acessibilidade por alguém que não escreveu o código"},"v":{"fr":"Des fonctionnalités d'accessibilité sont implémentées : panneau de réglages sur toutes les pages depuis le 26/08, `html lang` qui suit la langue affichée (WCAG 3.1.1) avec son test, champs à 16 px minimum, cibles tactiles à 44 px, `viewport-fit=cover`. **Aucun audit d'accessibilité indépendant n'a jamais été mené.**","pt":"Funcionalidades de acessibilidade estão implementadas: painel de ajustes em todas as páginas desde 26/08, `html lang` que segue a língua exibida (WCAG 3.1.1) com seu teste, campos de 16 px no mínimo, alvos táteis de 44 px, `viewport-fit=cover`. **Nenhuma auditoria de acessibilidade independente foi jamais conduzida.**"},"w":{"fr":"Faire parcourir les parcours principaux — chercher, ouvrir une notice, réserver, s'inscrire — par une personne qui utilise un lecteur d'écran ou une navigation au clavier seul, et écrire ce qui bloque.","pt":"Fazer percorrer os percursos principais — buscar, abrir um registro, reservar, cadastrar-se — por uma pessoa que use um leitor de tela ou navegação só por teclado, e escrever o que
