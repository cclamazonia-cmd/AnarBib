sta é recusável, com o original conservado.","Os rótulos existem nas dez locales numa só passagem."]},"dep":{"fr":"S'appuie sur les migrations `conventions_*` déjà en place.","pt":"Apoia-se nas migrações `conventions_*` já em vigor."},"r":["spec-conventions-catalographiques-v0.1 §7"]},{"id":"C7","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio","aucune"],"t":{"fr":"Indexer par matière les 1 549 notices qui n'ont aucun sujet","pt":"Indexar por assunto os 1 549 registros que não têm nenhum assunto"},"v":{"fr":"Vérifié le 29/08 : **1 127 notices indexées sur 2 676**, soit 42 %. 1 284 affectations réparties sur 89 sujets locaux. Côté public anonyme, la couverture est encore plus basse.","pt":"Verificado em 29/08: **1 127 registros indexados de 2 676**, ou seja 42 %. 1 284 atribuições distribuídas em 89 assuntos locais. Do lado público anônimo, a cobertura é ainda mais baixa."},"w":{"fr":"Indexer, notice par notice, avec le vocabulaire local et le thésaurus FICEDL déjà chargé. Aucune compétence technique : c'est un travail de bibliothèque, fait depuis l'application.","pt":"Indexar, registro por registro, com o vocabulário local e o tesauro FICEDL já carregado. Nenhuma competência técnica: é um trabalho de biblioteca, feito a partir do aplicativo."},"y":{"fr":"Un catalogue à 42 % d'indexation ne se parcourt pas : il se cherche par titre, ce qui suppose de savoir ce qu'on cherche. Le sujet est le seul chemin d'entrée pour quelqu'un qui vient voir ce qu'il y a sur une question. Et le thésaurus étant traduit en dix langues, chaque affectation vaut simultanément pour les dix.","pt":"Um catálogo com 42 % de indexação não se percorre: busca-se por título, o que pressupõe saber o que se procura. O assunto é o único caminho de entrada para quem vem ver o que há sobre uma questão. E, como o tesauro está traduzido em dez línguas, cada atribuição vale simultaneamente para as dez."},"f":{"fr":["La couverture dépasse 70 % des notices publiques.","Le sujet parasite `pierre-joseph-proudhon` (0 livre) est supprimé, et `anarcocomunismo` est vérifié.","Les huit sujets AnarBib sans équivalent FICEDL restent rattachés à un terme plus large et sont **portés à la fédération comme contribution, pas comme plainte** : éducation libertaire (64 livres), abolitionnisme pénal (13), écologie sociale (10), anarcha-féminisme, communisme libertaire, anarcho-punk, especifismo, cabanagem."],"pt":["A cobertura passa de 70 % dos registros públicos.","O assunto parasita `pierre-joseph-proudhon` (0 livro) é suprimido, e `anarcocomunismo` é verificado.","Os oito assuntos AnarBib sem equivalente FICEDL continuam vinculados a um termo mais amplo e são **levados à federação como contribuição, não como queixa**: educação libertária (64 livros), abolicionismo penal (13), ecologia social (10), anarcafeminismo, comunismo libertário, anarcopunk, especifismo, cabanagem."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["AnarBib-Backlog-2026-06-17-v33 §5","ETAT-lancement-consolide-2026-07-03 §2 item 6"],"verif":{"fr":"31/08 — 1 122 notices indexées sur 2 659 (42,2 %), 1 279 affectations, 89 sujets. Les quatre comptes ont légèrement baissé depuis le 29/08 : les fusions de doublons du 31/08 ont retiré des notices, pas des indexations.","pt":"31/08 — 1 122 de 2 659 registros indexados (42,2 %), 1 279 atribuições, 89 assuntos. As fusões de duplicatas de 31/08 explicam a leve queda."}},{"id":"C8","d":"C","p":"P3","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Enrichir les autorités : dates, identifiants externes, formes variantes","pt":"Enriquecer as autoridades: datas, identificadores externos, formas variantes"},"v":{"fr":"Sur 1 305 autorités : **726 (56 %) sans date de naissance**, environ **1 272 (98 %) sans identifiant VIAF, ISNI ou Wikidata**, environ **1 275 (98 %) sans `variant_forms`**. Le code d'enrichissement existe et fonctionne ; la couverture est de l'ordre de 1 à 2 %.","pt":"De 1 305 autoridades: **726 (56 %) sem data de nascimento**, cerca de **1 272 (98 %) sem identificador VIAF, ISNI ou Wikidata**, cerca de **1 275 (98 %) sem `variant_forms`**."},"w":{"fr":"Passes d'enrichissement par les sources déjà branchées, avec relecture. Les pseudonymes militants sont un cas à part : l'entrée se fait à la forme la plus connue du mouvement, avec renvoi depuis le nom civil, **jamais l'inverse**.","pt":"Passagens de enriquecimento pelas fontes já conectadas, com revisão. Os pseudônimos militantes são um caso à parte: a entrada se faz pela forma mais conhecida do movimento, com remissão a partir do nome civil, **nunca o contrário**."},"y":{"fr":"Les identifiants externes sont ce qui permettra à un autre catalogue de reconnaître nos autorités sans les redécrire. Les formes variantes sont ce qui permet de trouver quelqu'un sous le nom qu'on connaît. Et pour un pseudonyme militant, la forme d'usage **porte souvent la seule trace d'une répression** : elle ne s'écrase pas.","pt":"Os identificadores externos são o que permitirá a outro catálogo reconhecer nossas autoridades sem redescrevê-las. As formas variantes são o que permite encontrar alguém sob o nome que se conhece. E para um pseudônimo militante, a forma de uso **carrega frequentemente o único rastro de uma repressão**: não se sobrescreve."},"f":{"fr":["La couverture en identifiants externes dépasse 20 % sur les autorités les plus citées.","Aucun pseudonyme militant n'a été remplacé par un nom civil."],"pt":["A cobertura em identificadores externos passa de 20 % nas autoridades mais citadas.","Nenhum pseudônimo militante foi substituído por um nome civil."]},"dep":{"fr":"Après **C4** (les pays aident les alignements).","pt":"Depois de **C4** (os países ajudam os alinhamentos)."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A7-A9","REGISTRE §12 CAT-D6"],"verif":{"fr":"31/08 — sur 1 305 autorités : 728 sans année de naissance (56 %), 1 276 sans identifiant VIAF, ISNI ou Wikidata (98 %), 1 280 sans `variant_forms` (98 %). Le constat tient.","pt":"31/08 — de 1 305 autoridades: 728 sem ano de nascimento, 1 276 sem identificador externo, 1 280 sem `variant_forms`. O constato se mantém."}},{"id":"C9","d":"C","p":"P2","s":"decision","e":"S","sk":["biblio"],"t":{"fr":"Fermer les huit questions ouvertes des conventions catalographiques","pt":"Fechar as oito questões abertas das convenções catalográficas"},"v":{"fr":"`CONV-6` reste « à confirmer » et `CONV-O1` à `CONV-O8` sont ouverts. Deux d'entre eux portent du travail chiffré : `CONV-O7` (le type d'autorité existe mais reste illisible par le SQL — **16 verdicts de collectivités restent à poser**) et `CONV-O8` (la scission d'autorité n'existe pas — **3 découpages restent**).","pt":"`CONV-6` continua «a confirmar» e `CONV-O1` a `CONV-O8` estão abertos. Dois deles carregam trabalho quantificado: `CONV-O7` (o tipo de autoridade existe mas continua ilegível pelo SQL — **16 vereditos de coletividades faltam**) e `CONV-O8` (a cisão de autoridade não existe — **3 separações faltam**)."},"w":{"fr":"Trancher les huit en une session, en s'aidant du fonds réel : `name_lang` distinct de `country` ou non, conventions des collectivités, sort de `books.autor` (voir **C5**), critère de bascule EDTF, périmètre de l'écran de vérification, et les deux lots manuels.","pt":"Decidir as oito numa sessão, apoiando-se no acervo real: `name_lang` distinto de `country` ou não, convenções das coletividades, destino de `books.autor` (ver **C5**), critério de mudança para EDTF, perímetro da tela de verificação, e os dois lotes manuais."},"y":{"fr":"La colonne `name_lang` a été créée nullable et sans contrainte validée : **la créer n'engage rien, l'utiliser oui**. Tant que la question reste ouverte, chaque nouvelle règle d'entrée doit se demander sur quoi elle s'appuie.","pt":"A coluna `name_lang` foi criada anulável e sem restrição validada: **criá-la não compromete nada, usá-la sim**. Enquanto a questão ficar aberta, cada nova regra de entrada precisa se perguntar em que se apoia."},"f":{"fr":["Les huit ont un verdict au REGISTRE.","Les 16 collectivités et les 3 découpages sont traités à la main — ils sont explicitement **non automatisables**."],"pt":["As oito têm um veredicto no REGISTRO.","As 16 coletividades e as 3 separações são tratadas à mão — são explicitamente **não automatizáveis**."]},"dep":{"fr":"Éclaire **C6**.","pt":"Esclarece **C6**."},"r":["REGISTRE §37 CONV-6, CONV-O1..O8"]},{"id":"C10","d":"C","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Renommer l'une des deux colonnes `rights_status`","pt":"Renomear uma das duas colunas `rights_status`"},"v":{"fr":"`digital_assets.rights_status` est un **état de workflow** (`to_review`, `public_domain_confirmed`) qui commande la visibilité. Le vocabulaire des droits d'auteur porte le même nom depuis la migration `20260820235000_vocabulaire_rights_status`. Deux sens, un nom.","pt":"`digital_assets.rights_status` é um **estado de workflow** (`to_review`, `public_domain_confirmed`) que comanda a visibilidade. O vocabulário de direitos autorais leva o mesmo nome desde a migração `20260820235000_vocabulaire_rights_status`. Dois sentidos, um nome."},"w":{"fr":"Renommer la colonne de workflow — `review_state` par exemple — et propager au front et aux RPC. Le vocabulaire des droits garde le nom, puisque c'est lui qui parle de droits.","pt":"Renomear a coluna de workflow — `review_state` por exemplo — e propagar ao front e às RPC. O vocabulário de direitos guarda o nome, já que é ele que fala de direitos."},"y":{"fr":"Confusion garantie sinon, et sur un sujet où la confusion se paie : c'est l'état des droits qui décide si un document est visible du public. Un piège documenté s'y ajoute — `access_scope` vaut `conta_ativa` **par défaut**, si bien qu'un document du domaine public reste réservé aux comptes actifs tant que personne n'a posé `publico` explicitement.","pt":"Confusão garantida do contrário, e num assunto em que a confusão se paga: é o estado dos direitos que decide se um documento é visível ao público. Uma armadilha documentada se acrescenta — `access_scope` vale `conta_ativa` **por omissão**, de modo que um documento de domínio público continua reservado às contas ativas enquanto ninguém tiver posto `publico` explicitamente."},"f":{"fr":["Les deux notions portent deux noms distincts, en base et à l'écran.","Le piège `access_scope` est rappelé dans le formulaire de catalogage, pas seulement dans une note."],"pt":["As duas noções levam dois nomes distintos, no banco e na tela.","A armadilha `access_scope` é lembrada no formulário de catalogação, não só numa nota."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["PLAN_DE_MARCHE §8","DECISION_profil_numerisation_2026-08-20"],"verif":{"fr":"31/08 — le nom vit désormais dans **trois** tables, pas deux : `digital_assets`, `book_digital_resources` et `book_draft_digital_resources` portent chacune une colonne `rights_status`, en plus du vocabulaire homonyme. Le télescopage s'étend au lieu de se résorber.","pt":"31/08 — o nome vive agora em **três** tabelas: `digital_assets`, `book_digital_resources` e `book_draft_digital_resources`, além do vocabulário homônimo."}},{"id":"D1","d":"D","p":"P1","s":"a-verifier","e":"S","sk":["biblio","sql"],"t":{"fr":"Réviser la spec des périodiques contre ce qui a été livré","pt":"Revisar a spec dos periódicos contra o que foi entregue"},"v":{"fr":"`spec-periodiques-v0.1` (27/08) annonce « neuf paquets à livrer ». **Les neuf ont été livrés les 27 et 28/08**, en une journée : `serials`, RPC, anti-faux-doublons, état de collection, entrée dans l'Atelier, reprise des notices existantes, UI de catalogage, page publique, et les libellés dans les dix langues. La base porte 4 titres et 7 fascicules rattachés.","pt":"`spec-periodiques-v0.1` (27/08) anuncia «nove pacotes a entregar». **Os nove foram entregues em 27 e 28/08**, num dia: `serials`, RPC, anti-falsos-duplicados, estado de coleção, entrada na Oficina, retomada dos registros existentes, UI de catalogação, página pública, e os rótulos nas dez línguas."},"w":{"fr":"Relire la spec, marquer les neuf paquets comme livrés, puis vérifier une par une les six gardes annoncées — anti-cycle de filiation borné à 20 sauts, réciprocité prédécesseur/successeur par trigger, interdiction de `serial_id` sur un non-fascicule, symétrie de l'importeur face à la colonne générée, fusion des états de collection sans écrasement, ordre de tri.","pt":"Reler a spec, marcar os nove pacotes como entregues, depois verificar uma a uma as seis guardas anunciadas — anticiclo de filiação limitado a 20 saltos, reciprocidade predecessor/sucessor por trigger, proibição de `serial_id` num não-fascículo, simetria do importador diante da coluna gerada, fusão dos estados de coleção sem sobrescrita, ordem de classificação."},"y":{"fr":"Une spec qui dit « à livrer » sur du code livré fait exactement le dégât inverse d'une spec en retard : elle fait refaire. Et les six gardes sont ce qui distingue un sous-système qui tient d'un sous-système qui casse au premier import de masse.","pt":"Uma spec que diz «a entregar» sobre código entregue causa exatamente o dano inverso de uma spec atrasada: faz refazer. E as seis guardas são o que distingue um subsistema que aguenta de um subsistema que quebra na primeira importação em massa."},"f":{"fr":["La spec passe en v1.0 et décrit l'état livré.","Les six gardes sont vérifiées en base, avec le résultat écrit.","La garde `G2` (réciprocité) est bien un trigger : « la discipline ne survit pas à six mois »."],"pt":["A spec passa a v1.0 e descreve o estado entregue.","As seis guardas estão verificadas no banco, com o resultado escrito.","A guarda `G2` (reciprocidade) é de fato um trigger: «a disciplina não sobrevive a seis meses»."]},"dep":{"fr":"Prérequis de **D2**.","pt":"Pré-requisito de **D2**."},"r":["spec-periodiques-v0.1 §11 §14","Migrations 20260827163000 à 20260827210000"],"verif":{"fr":"31/08 — toujours 4 titres de périodiques et 7 fascicules rattachés en base. Rien n'a bougé depuis la livraison ; la révision de la spec reste à faire.","pt":"31/08 — ainda 4 títulos e 7 fascículos no banco. A revisão da spec continua por fazer."}},{"id":"D2","d":"D","p":"P2","s":"decision","e":"S","sk":["biblio"],"t":{"fr":"Trancher les cinq questions restées ouvertes sur les périodiques","pt":"Decidir as cinco questões que ficaram abertas sobre os periódicos"},"v":{"fr":"Cinq arbitrages étaient laissés en attente dans la spec, avec un penchant écrit pour chacun : vocabulaire de `periodicidade` libre ou fermé ; filiation n-n ou deux liens simples ; `serials` doit-elle porter un `library_id` ; promotion automatique d'un titre proposé ; page publique dédiée ou facette.","pt":"Cinco arbitragens ficaram pendentes na spec, com uma inclinação escrita para cada uma: vocabulário de `periodicidade` livre ou fechado; filiação n-n ou dois vínculos simples; `serials` deve levar um `library_id`; promoção automática de um título proposto; página pública dedicada ou faceta."},"w":{"fr":"Les trancher sur des cas réels plutôt que dans l'abstrait — le fonds Anarchief (une centaine de titres depuis 1860) et le fonds SOLIDAIRES (12 titres, 91 fascicules) sont la matière à éprouver.","pt":"Decidi-las sobre casos reais em vez de no abstrato — o acervo Anarchief (cerca de cem títulos desde 1860) e o acervo SOLIDAIRES (12 títulos, 91 fascículos) são a matéria para testar."},"y":{"fr":"Deux des cinq sont déjà tranchés de fait par le code livré (page dédiée `/periodico/<slug>`, pas de `library_id`). Les laisser « ouverts » au REGISTRE alors que le code a choisi crée exactement le genre d'écart que ce backlog corrige.","pt":"Duas das cinco já estão decididas de fato pelo código entregue (página dedicada `/periodico/<slug>`, sem `library_id`). Deixá-las «abertas» no REGISTRO enquanto o código escolheu cria exatamente o tipo de desvio que este backlog corrige."},"f":{"fr":["Les cinq ont un verdict inscrit, en accord avec le code livré ou en le corrigeant.","La promotion d'un titre reste **un geste et non un seuil** — c'était le penchant, et il vaut d'être confirmé."],"pt":["As cinco têm um veredicto inscrito, de acordo com o código entregue ou corrigindo-o.","A promoção de um título continua **um gesto e não um limiar** — era a inclinação, e vale confirmá-la."]},"dep":{"fr":"Après **D1**.","pt":"Depois de **D1**."},"r":["spec-periodiques-v0.1 §13"]},{"id":"D3","d":"D","p":"P2","s":"bloque","e":"M","sk":["biblio"],"t":{"fr":"Rattacher les 91 fascicules et les 87 monographies suspectes de SOLIDAIRES","pt":"Vincular os 91 fascículos e as 87 monografias suspeitas de SOLIDAIRES"},"v":{"fr":"Le fichier SOLIDAIRES porte déjà des colonnes `revue` et `numero` : **12 titres à créer, 91 fascicules à lier**. En plus, **87 monographies portent « n° » dans leur titre** et sont marquées par un drapeau `numero_dans_titre` : ce sont des candidates au rattachement.","pt":"O arquivo SOLIDAIRES já traz colunas `revue` e `numero`: **12 títulos a criar, 91 fascículos a vincular**. Além disso, **87 monografias trazem «n°» no título** e estão marcadas por uma flag `numero_dans_titre`: são candidatas ao vínculo."},"w":{"fr":"Créer les 12 titres, lier les 91 fascicules, puis **soumettre** les 87 candidates à quelqu'un qui connaît le fonds. Ne pas les rattacher automatiquement.","pt":"Criar os 12 títulos, vincular os 91 fascículos, depois **submeter** as 87 candidatas a alguém que conheça o acervo. Não vinculá-las automaticamente."},"y":{"fr":"Un titre qui contient « n° » n'est pas toujours un fascicule — c'est parfois un titre de collection, parfois une coquille. Le drapeau signale, il ne décide pas. Et le réseau ne compte aujourd'hui que 4 titres de périodiques : ce lot les multiplierait par quatre, et éprouverait le sous-système pour de bon.","pt":"Um título que contém «n°» nem sempre é um fascículo — às vezes é um título de coleção, às vezes um erro de digitação. A flag sinaliza, não decide. E a rede conta hoje apenas 4 títulos de periódicos: este lote os multiplicaria por quatro, e testaria o subsistema de verdade."},"f":{"fr":["Les 12 titres existent et les 91 fascicules y sont rattachés.","Les 87 candidates ont été soumises, et chaque verdict est humain.","Le comportement observé sur les quatre notices *Encontros com a Civilização brasileira* confirme la règle anti-faux-doublons : deux paires en sortent, deux y restent."],"pt":["Os 12 títulos existem e os 91 fascículos estão vinculados.","As 87 candidatas foram submetidas, e cada veredicto é humano.","O comportamento observado nos quatro registros *Encontros com a Civilização brasileira* confirma a regra antifalsos-duplicados: dois pares saem, dois ficam."]},"dep":{"fr":"**Bloqué par C2**, donc par **G7** et **A1**. La révision de la spec (**D1**) peut se faire sans attendre.","pt":"**Bloqueado por C2**, portanto por **G7** e **A1**. A revisão da spec (**D1**) pode ser feita sem esperar."},"r":["spec-periodiques-v0.1 §10","REPRISE_claude_code_2026-08-27"],"verif":{"fr":"31/08 — les 1 673 brouillons SOLIDAIRES sont en base (voir C2) et **aucun ne porte de `serial_id`** : le rattachement des fascicules n'a pas commencé. Toujours derrière G7.","pt":"31/08 — os 1 673 rascunhos SOLIDAIRES estão no banco (ver C2) e **nenhum traz `serial_id`**: o vínculo dos fascículos não começou."}},{"id":"D4","d":"D","p":"P1","s":"ouvert","e":"XL","sk":["biblio","front","collectif"],"t":{"fr":"Le matériel éphémère : tracts, affiches, autocollants, zines","pt":"O material efêmero: panfletos, cartazes, adesivos, fanzines"},"v":{"fr":"Rien n'existe. Le modèle de notice hérité de la bibliothéconomie du livre ne sait pas décrire ce matériel, et AnarBib ne fait pas exception. C'est le besoin **le plus mal couvert**, pour une part énorme de nos fonds.","pt":"Nada existe. O modelo de registro herdado da biblioteconomia do livro não sabe descrever esse material, e o AnarBib não é exceção. É a necessidade **pior atendida**, para uma parte enorme dos nossos acervos."},"w":{"fr":"Ce matériel n'a ni ISBN, ni éditeur, souvent ni auteur ni titre. Il est visuel autant que textuel : une affiche ne se résume pas à son océrisation. Le chantier commence par de la réflexion documentaire — que décrit-on, avec quoi, et pour qui — avant toute table.","pt":"Este material não tem ISBN, nem editora, frequentemente nem autor nem título. É visual tanto quanto textual: um cartaz não se resume à sua ocerização. O canteiro começa por reflexão documental — o que se descreve, com quê, e para quem — antes de qualquer tabela."},"y":{"fr":"C'est ce que les bibliothèques militantes ont de plus spécifique et de moins outillé. Les vocabulaires d'éphémères construits ailleurs — NORLA, avec ses facettes *Tactics* et *Social Movement* — sont **monolingues** et sans lien avec le thésaurus FICEDL : il y a là un travail commun à faire, pas un module à écrire seul.","pt":"É o que as bibliotecas militantes têm de mais específico e menos aparelhado. Os vocabulários de efêmeros construídos alhures — NORLA, com suas facetas *Tactics* e *Social Movement* — são **monolíngues** e sem vínculo com o tesauro FICEDL: há aí um trabalho comum a fazer, não um módulo a escrever sozinho."},"f":{"fr":["Un cadrage documentaire écrit, discuté avec au moins un autre fonds.","Un modèle minimal éprouvé sur cinquante pièces réelles.","**Ce n'est pas un chantier pour quelqu'un qui veut seulement écrire des fonctions.**"],"pt":["Um enquadramento documental escrito, discutido com pelo menos um outro acervo.","Um modelo mínimo testado em cinquenta peças reais.","**Não é um canteiro para quem só quer escrever funções.**"]},"dep":{"fr":"À relier à **H6** (alignement des vocabulaires militants) et à la rencontre de Bologne.","pt":"A ligar a **H6** (alinhamento dos vocabulários militantes) e ao encontro de Bolonha."},"r":["docs/CHANTIERS_OUVERTS.md §3","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"D5","d":"D","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Éprouver la chaîne de numérisation sur dix ouvrages avant d'équiper qui que ce soit","pt":"Testar a cadeia de digitalização em dez obras antes de equipar quem quer que seja"},"v":{"fr":"La règle est actée et tient en une phrase : « on capture en niveaux de gris, on livre en bitonal, on ne garde en ligne que ce qui est livré ». Les plafonds de buckets sont posés en production. **L'outil de dérivation n'est pas choisi**, et la fiche pratique d'une page n'est pas écrite.","pt":"A regra está registrada e cabe numa frase: «captura-se em tons de cinza, entrega-se em bitonal, só se mantém on-line o que é entregue». Os tetos dos buckets estão em produção. **A ferramenta de derivação não foi escolhida**, e a ficha prática de uma página não está escrita."},"w":{"fr":"Comparer ScanTailor + `img2pdf` avec `unpaper` ou ImageMagick sur dix ouvrages réels et variés, mesurer le poids et la lisibilité, choisir. Puis écrire la fiche : trois réglages, cinq contrôles, rien d'autre.","pt":"Comparar ScanTailor + `img2pdf` com `unpaper` ou ImageMagick em dez obras reais e variadas, medir o peso e a legibilidade, escolher. Depois escrever a ficha: três ajustes, cinco controles, nada mais."},"y":{"fr":"Équiper une bibliothèque avec une chaîne non éprouvée, c'est lui faire scanner deux cents pages qu'il faudra refaire. Et le seuillage bitonal est **destructeur et irréversible** : on ne scanne jamais directement en bitonal, jamais.","pt":"Equipar uma biblioteca com uma cadeia não testada é fazê-la escanear duzentas páginas que será preciso refazer. E a limiarização bitonal é **destrutiva e irreversível**: nunca se escaneia diretamente em bitonal, nunca."},"f":{"fr":["Un outil est choisi, avec les mesures qui ont décidé.","La fiche pratique d'une page existe, en portugais et en français.","Le sort des images de capture est écrit : archivage hors ligne systématique ou effacement après validation — **la réponse appartient à chaque bibliothèque, mais elle doit être écrite quelque part**."],"pt":["Uma ferramenta é escolhida, com as medidas que decidiram.","A ficha prática de uma página existe, em português e francês.","O destino das imagens de captura está escrito: arquivamento off-line sistemático ou apagamento após validação — **a resposta pertence a cada biblioteca, mas precisa estar escrita em algum lugar**."]},"dep":{"fr":"Le dimensionnement annoncé (20 Go pour démarrer, jusqu'à 50 Go sur 3-5 ans) dépend du choix d'outil.","pt":"O dimensionamento anunciado (20 GB para começar, até 50 GB em 3-5 anos) depende da escolha da ferramenta."},"r":["DECISION_profil_numerisation_2026-08-20 §9"]},{"id":"D6","d":"D","p":"P3","s":"ouvert","e":"M","sk":["front","deno"],"t":{"fr":"Reprendre ou remplacer le lecteur EPUB","pt":"Retomar ou substituir o leitor EPUB"},"v":{"fr":"`epubjs ^0.3.93` est la seule dépendance clairement pré-1.0 sur un chemin critique — le lecteur EPUB, `src/lib/reader/epubEngine.js` et `src/components/viewers/EpubReader.jsx`. La bibliothèque n'a pas connu de publication majeure depuis des années.","pt":"`epubjs ^0.3.93` é a única dependência claramente pré-1.0 num caminho crítico — o leitor EPUB, `src/lib/reader/epubEngine.js` e `src/components/viewers/EpubReader.jsx`. A biblioteca não teve publicação maior há anos."},"w":{"fr":"Évaluer ce qui casse aujourd'hui, ce qui cassera avec les navigateurs à venir, et s'il existe une alternative libre maintenue. Décider entre épingler et assumer, ou remplacer.","pt":"Avaliar o que quebra hoje, o que quebrará com os navegadores futuros, e se existe uma alternativa livre mantida. Decidir entre fixar e assumir, ou substituir."},"y":{"fr":"Le lecteur est ce qui rend un fonds numérisé consultable sans téléchargement. S'il tombe, ce n'est pas un confort qui disparaît, c'est l'accès. Rien ne presse aujourd'hui — mais il vaut mieux savoir.","pt":"O leitor é o que torna um acervo digitalizado consultável sem download. Se cair, não é um conforto que desaparece, é o acesso. Nada urge hoje — mas é melhor saber."},"f":{"fr":["Un verdict écrit : conserver et épingler, ou remplacer par quoi.","Si conservation : un test qui vérifie l'ouverture d'un EPUB réel."],"pt":["Um veredicto escrito: conservar e fixar, ou substituir por quê.","Se conservação: um teste que verifica a abertura de um EPUB real."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["package.json","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — `package.json` : `epubjs ^0.3.93`, inchangé.","pt":"31/08 — `package.json`: `epubjs ^0.3.93`, sem mudança."}},{"id":"E1","d":"E","p":"P1","s":"ouvert","e":"M","sk":["aucune","front"],"t":{"fr":"Faire auditer l'accessibilité par quelqu'un qui n'a pas écrit le code","pt":"Fazer auditar a acessibilidade por alguém que não escreveu o código"},"v":{"fr":"Des fonctionnalités d'accessibilité sont implémentées : panneau de réglages sur toutes les pages depuis le 26/08, `html lang` qui suit la langue affichée (WCAG 3.1.1) avec son test, champs à 16 px minimum, cibles tactiles à 44 px, `viewport-fit=cover`. **Aucun audit d'accessibilité indépendant n'a jamais été mené.**","pt":"Funcionalidades de acessibilidade estão implementadas: painel de ajustes em todas as páginas desde 26/08, `html lang` que segue a língua exibida (WCAG 3.1.1) com seu teste, campos de 16 px no mínimo, alvos táteis de 44 px, `viewport-fit=cover`. **Nenhuma auditoria de acessibilidade independente foi jamais conduzida.**"},"w":{"fr":"Faire parcourir les parcours principaux — chercher, ouvrir une notice, réserver, s'inscrire — par une personne qui utilise un lecteur d'écran ou une navigation au clavier seul, et écrire ce qui bloque.","pt":"Fazer percorrer os percursos principais — buscar, abrir um registro, reservar, cadastrar-se — por uma pessoa que use um leitor de tela ou navegação só por teclado, e escrever o que trava."},"y":{"fr":"« Implémenté » et « audité » ne sont pas le même mot, et les confondre est la faute la plus facile à commettre dans une présentation publique. Dire les deux, toujours : des fonctionnalités existent, personne d'extérieur ne les a éprouvées.","pt":"«Implementado» e «auditado» não são a mesma palavra, e confundi-los é a falta mais fácil de cometer numa apresentação pública. Dizer os dois, sempre: funcionalidades existem, ninguém de fora as testou."},"f":{"fr":["Un parcours complet a été fait au lecteur d'écran, avec un compte rendu écrit.","Les blocages sont dans le backlog avec leur écran.","Le discours public dit désormais « implémenté et audité par X », ou continue de dire les deux séparément."],"pt":["Um percurso completo foi feito com leitor de tela, com relatório escrito.","Os travamentos estão no backlog com sua tela.","O discurso público passa a dizer «implementado e auditado por X», ou continua dizendo os dois separadamente."]},"dep":{"fr":"**Entrée sans compétence technique** pour la partie parcours.","pt":"**Entrada sem competência técnica** para a parte de percurso."},"r":["Mémoire de projet, 25/08/2026","Commits 69af3cf5, df472bed"]},{"id":"E2","d":"E","p":"P1","s":"ouvert","e":"M","sk":["langue"],"t":{"fr":"Trancher les conventions néerlandaise et grecque","pt":"Decidir as convenções neerlandesa e grega"},"v":{"fr":"Les dix locales sont à parité stricte de clés — 6 177 chacune, vérifiée en intégration continue depuis le 27/08. Mais les **conventions** de deux d'entre elles ne sont pas tranchées : le néerlandais est à l'état de brouillon, le grec reste à définir. Le test de parité ne voit pas ça : il compte les clés, pas leur justesse.","pt":"As dez locales estão em paridade estrita de chaves — 6 177 cada uma, verificada na integração contínua desde 27/08. Mas as **convenções** de duas delas não estão decididas: o neerlandês está em estado de rascunho, o grego resta a definir. O teste de paridade não vê isso: conta as chaves, não a justeza delas."},"w":{"fr":"Une locutrice ou un locuteur natif reprend la charte de langage inclusif, décide de la forme neutre pour sa langue, et relit les 6 177 chaînes en priorité sur les écrans les plus vus.","pt":"Uma falante ou um falante nativo retoma a carta de linguagem inclusiva, decide a forma neutra para sua língua, e revisa as 6 177 cadeias com prioridade nas telas mais vistas."},"y":{"fr":"Deux langues qui cessent d'être des traductions approximatives. C'est un des trois chantiers qui **ne demandent aucune compétence technique** — et le seul que personne d'autre ne peut faire à la place.","pt":"Duas línguas que deixam de ser traduções aproximativas. É um dos três canteiros que **não exigem nenhuma competência técnica** — e o único que ninguém mais pode fazer no lugar."},"f":{"fr":["Les conventions `nl` et `el` sont écrites dans `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","Les chaînes des écrans principaux sont relues.","La liste néerlandaise est déjà partie chez Ludwig — le suivi en fait partie."],"pt":["As convenções `nl` e `el` estão escritas em `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","As cadeias das telas principais estão revisadas.","A lista neerlandesa já foi enviada a Ludwig — o acompanhamento faz parte."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["docs/CHANTIERS_OUVERTS.md §5","docs/notes-audit/anarbib-charte-langage-inclusif-v2.md"],"verif":{"fr":"31/08 — les dix fichiers `anarbib-charte-langage-inclusif-v2-*.md` existent depuis le 05/06, `nl` et `el` compris ; mais dedans, la convention `nl` est marquée « provisoire » et la `el` « à définir avec une personne locutrice grecque militante ». Les documents existent, les décisions non : le constat tient sur le fond.","pt":"31/08 — os dez arquivos da carta v2 existem desde 05/06, `nl` e `el` incluídos; mas dentro deles a convenção `nl` está marcada « provisória » e a `el` « a definir com uma pessoa falante de grego militante ». Os documentos existem, as decisões não."}},{"id":"E3","d":"E","p":"P2","s":"decision","e":"M","sk":["langue","collectif"],"t":{"fr":"Uniformiser le registre d'adresse entre les dix locales","pt":"Uniformizar o registro de tratamento entre as dez locales"},"v":{"fr":"`DOC-ADDR-1` fixe le tutoiement comme registre de l'interface. En pratique, **`nl` et `el` tutoient, les huit autres vouvoient**. L'écart est documenté et assumé comme « un chantier à décider, pas à subir au détour d'un correctif ».","pt":"`DOC-ADDR-1` fixa o tratamento informal como registro da interface. Na prática, **`nl` e `el` tratam por «tu», as outras oito por «você» formal**. A divergência está documentada e assumida como «um canteiro a decidir, não a sofrer de passagem numa correção»."},"w":{"fr":"Décider une fois pour les dix, en tenant compte du fait que la valeur politique du tutoiement n'est pas la même dans chaque langue, puis passer les locales concernées en une seule opération.","pt":"Decidir uma vez para as dez, levando em conta que o valor político do tratamento informal não é o mesmo em cada língua, depois passar as locales envolvidas numa única operação."},"y":{"fr":"AnarBib propose à d'autres catalogues des conventions d'interopérabilité, dont l'une dit explicitement que le vocabulaire commun n'impose pas l'écriture inclusive de chacun. **La cohérence interne se règle avant de prêcher la convention.**","pt":"O AnarBib propõe a outros catálogos convenções de interoperabilidade, uma das quais diz explicitamente que o vocabulário comum não impõe a escrita inclusiva de cada um. **A coerência interna se resolve antes de pregar a convenção.**"},"f":{"fr":["Une décision au REGISTRE, avec la raison.","Les dix locales appliquent le même registre, ou l'écart est justifié langue par langue."],"pt":["Uma decisão no REGISTRO, com o motivo.","As dez locales aplicam o mesmo registro, ou a divergência é justificada língua por língua."]},"dep":{"fr":"À faire après **E2** (les conventions décident du registre).","pt":"A fazer depois de **E2** (as convenções decidem o registro)."},"r":["REGISTRE §0 DOC-ADDR-1","VERIF_confidentialite_tiers_2026-08-20"]},{"id":"E4","d":"E","p":"P2","s":"ouvert","e":"S","sk":["langue"],"t":{"fr":"Régler les paires irrégulières de l'italien","pt":"Resolver os pares irregulares do italiano"},"v":{"fr":"`it.json` n'est pas conforme à la convention de l'astérisque final : les paires irrégulières comme `lettore` / `lettrice` ne se réduisent pas à `lettor*`. Le test de charte vérifie une seule chose sur l'italien — que `camerata` et `camerati` n'y figurent jamais, terme fasciste, échec dur — et rien d'autre.","pt":"`it.json` não está conforme à convenção do asterisco final: os pares irregulares como `lettore` / `lettrice` não se reduzem a `lettor*`. O teste de carta verifica uma só coisa no italiano — que `camerata` e `camerati` nunca apareçam, termo fascista, falha dura — e nada mais."},"w":{"fr":"Décider du traitement des paires irrégulières avec un locuteur natif, puis l'appliquer aux chaînes concernées. C'est un travail de langue, pas de code.","pt":"Decidir o tratamento dos pares irregulares com um falante nativo, depois aplicá-lo às cadeias envolvidas. É um trabalho de língua, não de código."},"y":{"fr":"L'italien est la langue de la présentation de Bologne. Une interface qui applique sa convention à moitié se voit à l'écran partagé.","pt":"O italiano é a língua da apresentação de Bolonha. Uma interface que aplica sua convenção pela metade se vê na tela compartilhada."},"f":{"fr":["Le traitement des paires irrégulières est écrit dans la charte italienne.","Les chaînes concernées sont corrigées.","Les trois chaînes restées en français dans l'interface italienne sont traduites (716 chaînes vues, 3 fautives)."],"pt":["O tratamento dos pares irregulares está escrito na carta italiana.","As cadeias envolvidas estão corrigidas.","As três cadeias que ficaram em francês na interface italiana estão traduzidas (716 cadeias vistas, 3 defeituosas)."]},"dep":{"fr":"Avant le 08/09 si possible, sinon octobre.","pt":"Antes de 08/09 se possível, senão outubro."},"r":["CLAUDE.md, piège connu n°9","CALENDRIER_bologne_2026-08-27"]},{"id":"E5","d":"E","p":"P2","s":"ouvert","e":"S","sk":["front"],"t":{"fr":"Relayer les tuiles OpenStreetMap par le serveur","pt":"Retransmitir os ladrilhos OpenStreetMap pelo servidor"},"v":{"fr":"C'est la **seule exception anti-pistage restante** : les tuiles de `tile.openstreetmap.org` sont chargées par le navigateur de la visiteuse, qui livre donc son adresse IP à un tiers. L'intention de relayer est **déjà annoncée publiquement** dans la clé `privacy.s6.maptiles` des dix locales.","pt":"É a **única exceção antirrastreamento restante**: os ladrilhos de `tile.openstreetmap.org` são carregados pelo navegador da visitante, que entrega portanto seu endereço IP a um terceiro. A intenção de retransmitir já está **anunciada publicamente** na chave `privacy.s6.maptiles` das dez locales."},"w":{"fr":"Reprendre le modèle déjà en place pour Nominatim : un relais côté serveur, avec cache, et l'adresse du relais dans la configuration du front.","pt":"Retomar o modelo já em vigor para o Nominatim: um relé do lado servidor, com cache, e o endereço do relé na configuração do front."},"y":{"fr":"La règle de conformité du projet est écrite et générale : **toute dépendance qui reçoit une adresse IP de visiteuse doit être déclarée, y compris quand elle n'est pas un sous-traitant au sens du RGPD.** Le raisonnement inverse est précisément ce qui avait laissé Turnstile invisible pendant des mois. Ici la dépendance est déclarée — il reste à la supprimer, comme annoncé.","pt":"A regra de conformidade do projeto está escrita e é geral: **toda dependência que recebe um endereço IP de visitante deve ser declarada, mesmo quando não é um operador no sentido do RGPD.** O raciocínio inverso é precisamente o que deixara o Turnstile invisível durante meses. Aqui a dependência está declarada — falta suprimi-la, como anunciado."},"f":{"fr":["Aucune requête ne part du navigateur vers un domaine tiers sur les pages de carte.","La clé `privacy.s6.maptiles` est mise à jour dans les dix locales pour décrire le nouvel état."],"pt":["Nenhuma requisição sai do navegador para um domínio de terceiro nas páginas de mapa.","A chave `privacy.s6.maptiles` é atualizada nas dez locales para descrever o novo estado."]},"dep":{"fr":"Plus simple après **I2** (pile auto-hébergée), mais faisable avant.","pt":"Mais simples depois de **I2** (pilha auto-hospedada), mas viável antes."},"r":["VERIF_confidentialite_tiers_2026-08-20","PLAN_DE_MARCHE §8","scripts/nominatim/"],"verif":{"fr":"31/08 — trois fichiers chargent encore `tile.openstreetmap.org` côté client : `CartographyEditModal.jsx:70`, `CartographyMap.jsx:181`, `CartografiaAjouterPage.jsx:66`.","pt":"31/08 — três arquivos ainda carregam `tile.openstreetmap.org` do lado do navegador."}},{"id":"E6","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Découper les cinq écrans qui pèsent plus de cent kilooctets","pt":"Dividir as cinco telas que pesam mais de cem quilobytes"},"v":{"fr":"`BookDraftForm.jsx` fait **197 Ko**, `BibliotecaPage.jsx` 184 Ko, `AccountPage.jsx` 154 Ko, `PanelPage.jsx` 114 Ko, `ImportacoesPage.jsx` 109 Ko. 29 des 38 routes sont déjà en chargement paresseux, et `vite.config.js` déclare quatre lots de dépendances — le problème n'est pas le chargement initial, c'est la taille d'un fichier unique.","pt":"`BookDraftForm.jsx` tem **197 KB**, `BibliotecaPage.jsx` 184 KB, `AccountPage.jsx` 154 KB, `PanelPage.jsx` 114 KB, `ImportacoesPage.jsx` 109 KB. 29 das 38 rotas já estão em carregamento preguiçoso, e `vite.config.js` declara quatro lotes de dependências — o problema não é o carregamento inicial, é o tamanho de um arquivo único."},"w":{"fr":"Extraire les sous-formulaires et les onglets en composants séparés, sans changer le comportement. Commencer par `BookDraftForm`, le plus gros et le plus édité.","pt":"Extrair os subformulários e as abas em componentes separados, sem mudar o comportamento. Começar por `BookDraftForm`, o maior e o mais editado."},"y":{"fr":"Un fichier de 197 Ko n'est pas relisible par quelqu'un qui arrive, et deux personnes ne peuvent pas y travailler en même temps sans conflit. C'est un obstacle à la contribution avant d'être un problème de performance.","pt":"Um arquivo de 197 KB não é relegível por quem chega, e duas pessoas não podem trabalhar nele ao mesmo tempo sem conflito. É um obstáculo à contribuição antes de ser um problema de performance."},"f":{"fr":["Aucun fichier de `src/` ne dépasse 60 Ko.","Le comportement est inchangé, vérifié écran par écran.","Découpage par lots, un écran à la fois, jamais une refonte."],"pt":["Nenhum arquivo de `src/` passa de 60 KB.","O comportamento está inalterado, verificado tela por tela.","Divisão por lotes, uma tela por vez, nunca uma refundação."]},"dep":{"fr":"Reprend `#PERF-accountpage-split`, hérité du v32.","pt":"Retoma `#PERF-accountpage-split`, herdado do v32."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.5","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — les cinq mêmes fichiers, aux tailles voisines : `BookDraftForm.jsx` 197 Ko, `BibliotecaPage.jsx` 186 Ko, `AccountPage.jsx` 155 Ko, `PanelPage.jsx` 116 Ko, `ImportacoesPage.jsx` 111 Ko.","pt":"31/08 — os cinco mesmos arquivos, com tamanhos vizinhos (197, 186, 155, 116 e 111 KB)."}},{"id":"E7","d":"E","p":"P2","s":"ouvert","e":"S","sk":["front"],"t":{"fr":"Corriger le titre de page qui ne suit pas la navigation","pt":"Corrigir o título de página que não segue a navegação"},"v":{"fr":"**Constat corrigé le 31/08 : il était faux depuis mai.** Le hook `src/lib/useDocumentTitle.js` met à jour `document.title` à la navigation depuis le **05/05/2026** (commit `c4865278`), et 32 pages sur 79 l'utilisent. Ce qui reste n'est pas « le titre ne suit pas » : c'est la couverture des 47 pages sans hook — dont il faut d'abord dire combien sont des routes réelles — et le test promis, qui n'existe pas.","pt":"**Constato corrigido em 31/08: estava errado desde maio.** O hook `src/lib/useDocumentTitle.js` atualiza `document.title` na navegação desde **05/05/2026**, e 32 páginas de 79 o usam. O que resta é a cobertura das 47 páginas sem hook e o teste prometido, que não existe."},"w":{"fr":"Poser le titre à chaque changement de route, à partir des clés i18n existantes.","pt":"Definir o título a cada mudança de rota, a partir das chaves i18n existentes."},"y":{"fr":"Le titre de page est ce que lisent les lecteurs d'écran à l'arrivée, ce qui s'inscrit dans l'historique du navigateur, et ce qui apparaît dans un onglet épinglé. Un titre figé rend les trois inutilisables.","pt":"O título de página é o que os leitores de tela leem na chegada, o que se inscreve no histórico do navegador, e o que aparece numa aba fixada. Um título congelado torna os três inutilizáveis."},"f":{"fr":["Le titre suit la route, dans les dix langues.","Un test le vérifie, sur le modèle de `documentLanguage.test.js`."],"pt":["O título segue a rota, nas dez línguas.","Um teste o verifica, no modelo de `documentLanguage.test.js`."]},"dep":{"fr":"Complément naturel de **E1**.","pt":"Complemento natural de **E1**."},"r":["Mémoire de projet, dette technique"],"verif":{"fr":"31/08 — mesuré dans le dépôt : hook présent depuis le 05/05, 32 usages sous `src/pages/`, aucun test de titre dans `src/tests/`.","pt":"31/08 — medido no repositório: hook presente desde 05/05, 32 usos, nenhum teste de título."}},{"id":"E8","d":"E","p":"P2","s":"ouvert","e":"S","sk":["front"],"t":{"fr":"Charger les deux polices sans bloquer l'affichage","pt":"Carregar as duas fontes sem bloquear a exibição"},"v":{"fr":"**Constat corrigé le 31/08 : il décrivait un état mort depuis mai.** `titre.ttf` (1 Mo) et `accent.ttf` (484 Ko) ont disparu le **06/05/2026** (commit `dba21cd3`, auto-hébergement Bitter + Fira Sans) — il n'en reste qu'un commentaire dans `src/lib/theme.js:198`. Depuis : 19 fichiers woff2 auto-hébergés dans `public/fonts/` (1,3 Mo en tout), `font-display: swap` sur toutes les faces de `src/styles/fonts.css`, préchargement des deux fichiers du premier rendu dans `index.html`. Il ne reste de l'item que la mesure avant/après jamais consignée — candidat à la clôture.","pt":"**Constato corrigido em 31/08: descrevia um estado morto desde maio.** `titre.ttf` e `accent.ttf` desapareceram em **06/05/2026** — resta só um comentário em `theme.js:198`. Desde então: 19 arquivos woff2 auto-hospedados (1,3 MB), `font-display: swap` em todas as faces, pré-carregamento dos dois arquivos críticos. Resta só a medição antes/depois nunca consignada — candidato a encerramento."},"w":{"fr":"Ajouter `font-display: swap`, précharger la police de titre seule, sous-ensembler les fichiers aux caractères réellement utilisés — dix langues dont le grec, donc le sous-ensemble n'est pas trivial.","pt":"Adicionar `font-display: swap`, pré-carregar apenas a fonte de título, subconjuntar os arquivos aos caracteres realmente usados — dez línguas incluindo o grego, então o subconjunto não é trivial."},"y":{"fr":"1,5 Mo de polices sur une connexion de comptoir, c'est plusieurs secondes d'écran blanc. Le public d'AnarBib inclut des bibliothèques qui n'ont pas la fibre.","pt":"1,5 MB de fontes numa conexão de balcão são vários segundos de tela branca. O público do AnarBib inclui bibliotecas que não têm fibra."},"f":{"fr":["~~Le texte s'affiche avant les polices, avec une substitution acceptable~~ — `font-display: swap` sur toutes les faces depuis le 06/05 (`src/styles/fonts.css`).","Le poids total des polices chargées à la première visite est mesuré avant et après."],"pt":["~~O texto aparece antes das fontes, com uma substituição aceitável~~ — `font-display: swap` em todas as faces desde 06/05.","O peso total das fontes carregadas na primeira visita é medido antes e depois."]},"dep":{"fr":"Ne pas toucher à l'identité visuelle : `IDENT-1` à `IDENT-4` sont actés.","pt":"Não tocar na identidade visual: `IDENT-1` a `IDENT-4` estão registrados."},"r":["Mémoire de projet, dette technique","REGISTRE §39 IDENT"],"verif":{"fr":"31/08 — mesuré dans le dépôt : fichiers de `public/fonts/`, `src/styles/fonts.css`, `index.html:47-48`, historique git.","pt":"31/08 — medido no repositório: arquivos, CSS, `index.html`, histórico git."}},{"id":"E9","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Finir la mise en page mobile : trois lots identifiés","pt":"Terminar o layout móvel: três lotes identificados"},"v":{"fr":"Les phases A, B et C sont livrées et la doctrine graduée est actée. Trois questions restent ouvertes au REGISTRE : `MOB-Q1` (24 grilles déclarées en ligne dans le JSX avec des pistes `fr` nues), `MOB-Q2` (20 requêtes de média héritées à rapatrier dans `src/styles/mobile.css`), `MOB-Q3` (les onglets Validações et Inventário à convertir en cartes).","pt":"As fases A, B e C estão entregues e a doutrina graduada está registrada. Três questões continuam abertas no REGISTRO: `MOB-Q1` (24 grades declaradas em linha no JSX com trilhas `fr` nuas), `MOB-Q2` (20 media queries herdadas a repatriar em `src/styles/mobile.css`), `MOB-Q3` (as abas Validações e Inventário a converter em cartões)."},"w":{"fr":"Trois passes mécaniques, dans cet ordre de valeur : les 24 grilles (`minmax(0, Nfr)` partout, c'est la règle `MOB-1`), les deux onglets en cartes selon le patron livré, puis le rapatriement des requêtes de média.","pt":"Três passagens mecânicas, nesta ordem de valor: as 24 grades (`minmax(0, Nfr)` em toda parte, é a regra `MOB-1`), as duas abas em cartões segundo o padrão entregue, depois o repatriamento das media queries."},"y":{"fr":"Une piste `fr` nue déborde dès que son contenu est plus large que la colonne, et un débordement **se constate par la mesure, jamais à l'œil** (`MOB-9`). Les 24 grilles sont autant de débordements en attente d'un titre long.","pt":"Uma trilha `fr` nua transborda assim que seu conteúdo é mais largo que a coluna, e um transbordamento **se constata pela medida, nunca a olho** (`MOB-9`). As 24 grades são outros tantos transbordamentos à espera de um título longo."},"f":{"fr":["~~Aucune grille du JSX ne porte de piste `fr` nue~~ — 31/08 : plus une seule, la dernière occurrence est un commentaire qui rappelle la règle.","Les deux onglets sont en cartes sous 640 px.","Les requêtes de média héritées vivent dans `mobile.css`."],"pt":["~~Nenhuma grade do JSX traz trilha `fr` nua~~ — 31/08: nenhuma resta, a última ocorrência é um comentário.","As duas abas estão em cartões abaixo de 640 px.","As media queries herdadas vivem em `mobile.css`."]},"dep":{"fr":"Aucune. Chantier découpable en trois.","pt":"Nenhuma. Canteiro divisível em três."},"r":["REGISTRE §36 MOB-Q1..Q3"],"verif":{"fr":"31/08 — `MOB-Q1` est soldée dans le code : sur 49 pistes `1fr` du JSX, toutes sont en `minmax(0,1fr)` sauf un commentaire qui énonce la règle (`AtelierAutoridadesPage.jsx:278`). `MOB-Q2` a fondu : 8 requêtes de média hors `mobile.css` (2 dans `breakpoints.css`, 1 dans `tabbar.css`, 5 dans le JSX) au lieu des 20 citées. `MOB-Q3` non mesuré.","pt":"31/08 — `MOB-Q1` está saldada no código: das 49 trilhas `1fr` do JSX, todas em `minmax(0,1fr)` salvo um comentário. `MOB-Q2` derreteu: 8 media queries fora de `mobile.css` em vez de 20. `MOB-Q3` não medido."}},{"id":"E10","d":"E","p":"P3","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Le reste du socle terrain : permanence mobile, notification poussée, planche de codes","pt":"O resto da base de campo: plantão móvel, notificação push, prancha de códigos"},"v":{"fr":"Le socle terrain est livré : application installable, lecture de codes QR et ISBN, récolement, mise en page adaptative. Trois éléments restent, hérités du v32 et non revérifiés depuis : la permanence mobile (P3), la notification poussée (P5), et la planche de codes QR au format A4.","pt":"A base de campo está entregue: aplicativo instalável, leitura de códigos QR e ISBN, inventário, layout adaptativo. Três elementos restam, herdados do v32 e não reverificados desde então: o plantão móvel (P3), a notificação push (P5), e a prancha de códigos QR em formato A4."},"w":{"fr":"Commencer par vérifier lequel des trois est encore un manque réel. La notification poussée pose une question de fond avant une question de code : elle suppose un service tiers, ce que la doctrine anti-pistage regarde de près.","pt":"Começar verificando qual dos três ainda é uma falta real. A notificação push levanta uma questão de fundo antes de uma questão de código: pressupõe um serviço de terceiro, o que a doutrina antirrastreamento examina de perto."},"y":{"fr":"La planche A4 est la plus simple et la plus utile au comptoir : elle permet d'étiqueter un fonds sans imprimante à étiquettes. Les deux autres méritent d'abord une conversation.","pt":"A prancha A4 é a mais simples e a mais útil no balcão: permite etiquetar um acervo sem impressora de etiquetas. As outras duas merecem primeiro uma conversa."},"f":{"fr":["La planche A4 existe et s'imprime correctement.","Pour la notification poussée, un verdict écrit : faisable sans tiers, ou renoncement assumé."],"pt":["A prancha A4 existe e imprime corretamente.","Para a notificação push, um veredicto escrito: viável sem terceiro, ou renúncia assumida."]},"dep":{"fr":"Hérité de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`.","pt":"Herdado de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.1"]},{"id":"E11","d":"E","p":"P3","s":"decision","e":"S","sk":["collectif","front"],"t":{"fr":"Les deux différés assumés de l'OPAC : tags contributifs et flux RSS","pt":"Os dois adiamentos assumidos do OPAC: tags contributivas e feed RSS"},"v":{"fr":"`#OPAC5` (folksonomie, tags posés par les lectrices) est bloqué sur une décision de communauté et de vie privée. `#OPAC11` (flux RSS de recherche) est différé pour raison anti-pistage. Les deux sont ouverts depuis mai et n'ont jamais été instruits.","pt":"`#OPAC5` (folksonomia, tags postas pelas leitoras) está bloqueado numa decisão de comunidade e de privacidade. `#OPAC11` (feed RSS de busca) está adiado por razão antirrastreamento. Os dois estão abertos desde maio e nunca foram instruídos."},"w":{"fr":"Les instruire une bonne fois : qu'est-ce qu'un tag public révèle de qui l'a posé, et qu'est-ce qu'un flux RSS révèle de qui le suit ? Puis trancher, ou fermer.","pt":"Instruí-los de uma vez: o que uma tag pública revela sobre quem a pôs, e o que um feed RSS revela sobre quem o segue? Depois decidir, ou fechar."},"y":{"fr":"Un item différé sans instruction reste à l'ordre du jour de chaque relecture et coûte de l'attention à chaque fois. Fermer un item est une décision aussi valable que le livrer.","pt":"Um item adiado sem instrução continua na pauta de cada releitura e custa atenção a cada vez. Fechar um item é uma decisão tão válida quanto entregá-lo."},"f":{"fr":["Les deux ont un verdict au REGISTRE : livré, ou fermé avec la raison.","`OPAC-RSS1` est mis à jour en conséquence."],"pt":["Os dois têm um veredicto no REGISTRO: entregue, ou fechado com o motivo.","`OPAC-RSS1` é atualizado em consequência."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["REGISTRE §18 OPAC-RSS1","AnarBib-Backlog-2026-06-17-v33 §2.4"]},{"id":"F1","d":"F","p":"P1","s":"ouvert","e":"M","sk":["deno","sql"],"t":{"fr":"Auditer la chaîne de courriel de bout en bout","pt":"Auditar a cadeia de e-mail de ponta a ponta"},"v":{"fr":"**14 fonctions `notify-*` déployées**, cinq files d'attente, six déclencheurs de dépêche. Trois files n'ont jamais reçu la moindre insertion : `authority_proposal_notification_outbox`, `membership_expiry_notifications`, `painel_internal_task_invitation_outbox`. Une quatrième, `painel_internal_task_notification_outbox`, est vide après 34 insertions dont la dernière date du 04/06. Personne n'a jamais audité l'ensemble.","pt":"**14 funções `notify-*` implantadas**, cinco filas, seis gatilhos de despacho. Três filas nunca receberam uma única inserção: `authority_proposal_notification_outbox`, `membership_expiry_notifications`, `painel_internal_task_invitation_outbox`. Uma quarta, `painel_internal_task_notification_outbox`, está vazia após 34 inserções cuja última é de 04/06. Ninguém jamais auditou o conjunto."},"w":{"fr":"Dresser la carte : pour chaque événement métier, quel déclencheur, quelle file, quelle fonction, quel gabarit, quelles dix langues. Puis marquer les branches mortes et les branches jamais empruntées.","pt":"Traçar o mapa: para cada evento de negócio, qual gatilho, qual fila, qual função, qual template, quais dez línguas. Depois marcar os ramos mortos e os ramos nunca percorridos."},"y":{"fr":"Une notification qui ne part pas ne fait aucun bruit. C'est le même angle mort que les sauvegardes, et il a déjà mordu deux fois : les mails `retirada_efetivada`, `retirada_reagendada`, `retirada_no_show` et `liberada_para_circulacao` ont été signalés comme ne partant pas, sans que le diagnostic soit mené à son terme.","pt":"Uma notificação que não sai não faz barulho nenhum. É o mesmo ponto cego dos backups, e já mordeu duas vezes: os e-mails `retirada_efetivada`, `retirada_reagendada`, `retirada_no_show` e `liberada_para_circulacao` foram apontados como não saindo, sem que o diagnóstico fosse levado a termo."},"f":{"fr":["Une carte écrite, événement par événement.","Les quatre mails signalés comme non partants ont un verdict : corrigés, ou expliqués.","Les branches mortes sont supprimées ou documentées comme dormantes."],"pt":["Um mapa escrito, evento por evento.","Os quatro e-mails apontados como não enviados têm um veredicto: corrigidos, ou explicados.","Os ramos mortos são suprimidos ou documentados como dormentes."]},"dep":{"fr":"Prérequis de **F2** et **F3**.","pt":"Pré-requisito de **F2** e **F3**."},"r":["Mémoire de projet, reliquats de la chaîne courriel","AUDITORIA_NOTIFY_FUNCTIONS_2026-05-06"],"verif":{"fr":"31/08 — **15** fonctions `notify-*` déployées désormais, la quinzième (`notify-loan-cycle`) née le matin même avec F4. Les trois files jamais servies sont toujours à zéro insertion, et `painel_internal_task_notification_outbox` toujours vide après 34. Le périmètre grossit plus vite que l'audit.","pt":"31/08 — **15** funções `notify-*` implantadas, a décima quinta nascida no mesmo dia com F4. As três filas nunca servidas seguem a zero. O perímetro cresce mais rápido que a auditoria."}},{"id":"F2","d":"F","p":"P1","s":"ouvert","e":"S","sk":["deno"],"t":{"fr":"Corriger le gabarit des courriels d'alerte d'exploitation","pt":"Corrigir o template dos e-mails de alerta de operação"},"v":{"fr":"Les courriels d'alerte d'exploitation — sauvegarde en échec, incident de sonde — utilisent le gabarit destiné aux lectrices. Ils finissent donc par « contacte la bibliothèque » suivi d'un numéro de téléphone.","pt":"Os e-mails de alerta de operação — backup em falha, incidente de sonda — usam o template destinado às leitoras. Terminam portanto com «entre em contato com a biblioteca» seguido de um número de telefone."},"w":{"fr":"Un gabarit d'exploitation distinct : pas de pied de page destiné au public, la commande à lancer, et le lien vers la section du runbook.","pt":"Um template de operação distinto: sem rodapé destinado ao público, o comando a executar, e o link para a seção do runbook."},"y":{"fr":"**À corriger avant qu'un second administrateur réseau existe.** Aujourd'hui une seule personne reçoit ces alertes et sait les lire ; le jour où **A1** aboutit, elles partent à quelqu'un qui découvrira un courriel d'incident lui conseillant d'appeler la bibliothèque.","pt":"**A corrigir antes que um segundo administrador de rede exista.** Hoje uma só pessoa recebe esses alertas e sabe lê-los; no dia em que **A1** for concluído, eles chegarão a alguém que descobrirá um e-mail de incidente aconselhando a ligar para a biblioteca."},"f":{"fr":["Un gabarit d'exploitation existe, distinct du gabarit lectrice.","Une alerte de test a été reçue et relue par quelqu'un qui n'a pas écrit le code."],"pt":["Um template de operação existe, distinto do template de leitora.","Um alerta de teste foi recebido e relido por alguém que não escreveu o código."]},"dep":{"fr":"Doit précéder l'aboutissement de **A1**.","pt":"Deve preceder a conclusão de **A1**."},"r":["RUNBOOK_exploitation_v0.3 §7","PLAN_DE_MARCHE §8"],"verif":{"fr":"31/08 — lu dans le code : `health-probe/index.ts` passe par `renderEmail` + `footerPadrao` de `_shared/mail/layout.ts` — le gabarit lectrice, qui pousse le libellé téléphone (`layout.ts:28`). Aucun gabarit d'exploitation dans `_shared/mail/`.","pt":"31/08 — lido no código: `health-probe` usa o gabarito de leitora (`renderEmail` + `footerPadrao`, com telefone). Nenhum gabarito de operação existe."}},{"id":"F3","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno"],"t":{"fr":"Consolider les fonctions de notification redondantes","pt":"Consolidar as funções de notificação redundantes"},"v":{"fr":"Quatre fonctions font des récapitulatifs : `notify-weekly-report`, `notify-network-weekly-report`, `notify-cross-library-digest`, `notify-rede-digest`. Trois fonctions servent des documents : `read-pdf`, `read-digital-asset`, `read-ill-shared-asset`. Deux exportent des lots : `export-catalog-lote`, `export-fonds-bundle`. Et `mail-i18n-test`, fonction de test, est déployée en production en version 1553.","pt":"Quatro funções fazem resumos: `notify-weekly-report`, `notify-network-weekly-report`, `notify-cross-library-digest`, `notify-rede-digest`. Três funções servem documentos: `read-pdf`, `read-digital-asset`, `read-ill-shared-asset`. Duas exportam lotes: `export-catalog-lote`, `export-fonds-bundle`. E `mail-i18n-test`, função de teste, está implantada em produção na versão 1553."},"w":{"fr":"Vérifier ce que chacune fait vraiment avant de conclure à la redondance — elles ont probablement des destinataires et des portées différentes. Puis fusionner ce qui doit l'être, et retirer `mail-i18n-test` de la production.","pt":"Verificar o que cada uma faz de fato antes de concluir pela redundância — provavelmente têm destinatários e alcances diferentes. Depois fundir o que deve sê-lo, e retirar `mail-i18n-test` da produção."},"y":{"fr":"48 fonctions déployées, c'est beaucoup à maintenir pour un projet à un mainteneur. Chacune porte son propre gabarit, ses propres dix langues, ses propres secrets. Ce n'est pas un problème de performance, c'est un problème de surface à relire.","pt":"48 funções implantadas é muito para manter num projeto com um mantenedor. Cada uma carrega seu próprio template, suas próprias dez línguas, seus próprios segredos. Não é um problema de performance, é um problema de superfície a revisar."},"f":{"fr":["Chaque groupe a un verdict : fusion, ou raison écrite de la séparation.","`mail-i18n-test` n'est plus déployée en production.","Le compte de fonctions déployées est à jour dans `CLAUDE.md` et dans `config.toml`."],"pt":["Cada grupo tem um veredicto: fusão, ou motivo escrito da separação.","`mail-i18n-test` não está mais implantada em produção.","A contagem de funções implantadas está atualizada em `CLAUDE.md` e em `config.toml`."]},"dep":{"fr":"Après **F1**. Attention : le déploiement de `notify-event` ne passe pas par MCP, son paquet est trop gros.","pt":"Depois de **F1**. Atenção: a implantação de `notify-event` não passa por MCP, seu pacote é grande demais."},"r":["PLAN_DE_MARCHE §8","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — `mail-i18n-test` est toujours déployée en production (version 1 566, retouchée le jour même par un déploiement groupé). Le dépôt compte 50 dossiers de fonctions hors `_shared`, et `config.toml` porte 38 déclarations `verify_jwt`.","pt":"31/08 — `mail-i18n-test` continua implantada (versão 1 566). O repositório tem 50 pastas de funções e 38 declarações `verify_jwt`."}},{"id":"F4","d":"F","p":"P1","s":"en-cours","e":"M","sk":["sql"],"t":{"fr":"Trois bibliothèques avaient activé des rappels que personne n'envoyait","pt":"Três bibliotecas tinham ativado lembretes que ninguém enviava"},"v":{"fr":"`spec-flux-emprunts.md` §10.2 prévoit des rappels à J-5, J-3 et le jour même, puis des relances à J+1, J+7 et J+30. **Aucun job dédié n'est identifiable** parmi les 36 crons ; le seul voisin est `anarbib-notify-mid-loan-reading-daily`, qui fait autre chose. `membership_expiry_notifications` n'a jamais reçu la moindre ligne.\n\n**Vérifié le 30/08 : le manque est confirmé.** Les onze crons dont le nom évoque une échéance ou une relance ont été relus un par un — cooptation, adhésions, invitations d'équipe, votes OAI, réservations, autorités, cercles, et `anarbib-peb-detect-overdue-daily` qui concerne le **prêt entre bibliothèques**, pas le prêt aux lectrices. **Aucun ne rappelle une échéance d'emprunt ni ne relance un retard.** Le doute est levé : ce n'est plus un item à vérifier, c'est une décision à prendre.\n\n**Instruit et livré le 31/08 — et le constat était encore trop petit.** Les rappels n'existaient pas, c'était établi. Ce qui ne l'était pas : **les interrupteurs qui les commandent, eux, existent**. `library_notification_policies` porte `loan_reminders_enabled` et `loan_overdue_enabled`, exposés dans `v_library_notification_context` — la vue que lit la pile courriel. En production, **les trois bibliothèques dotées d'une politique les ont à `true`** : non parce qu'elles les ont activés, mais parce qu'ils naissent activés (« Default : tous à `true` », §2.4). Trois bibliothèques se croyaient couvertes par un dispositif absent — cas *(a)* de `DOC-SILENCE-1`, et même mécanique que le privilège `anon` retourné le même jour.\n\n**La référence de l'item était fausse** : la règle n'est pas au §10.2 — qui dit « hors périmètre, dette à confirmer » — mais au **§2.4**. Les deux sections sont amendées.\n\n**Six moments deviennent trois** (`DOC-RAPPEL-1`) : J-3, le jour de l'échéance, J+7. Motif `OPS-8` — un signal qui se répète cesse d'être lu, et une lectrice émoussée ne referme pas un ticket, elle cesse d'emprunter.\n\n**Un quatrième envoi en remplace un autre.** `notify-mid-loan-reading` demandait « Como vai a leitura? » — une question à laquelle un courriel ne permet pas de répondre — **en portugais en dur**, quelle que soit la langue de la lectrice. À mi-parcours, on invite désormais à déposer une **note de lecture sous pseudonyme** dans le catalogue : `book_reading_notes` est construite, déployée, et n'avait jamais reçu une seule ligne, et l'écran d'écriture existe déjà sur la page de l'œuvre. Son cron est désactivé — garder les deux, ce serait deux courriels le même jour.\n\n**Livré** : EF `notify-loan-cycle` (quatre moments, dix locales, 120 chaînes), table `loan_cycle_notifications` avec unicité (item, moment) — sans elle un cron rejoué enverrait deux fois le même rappel —, interrupteur `reading_notes_invite_enabled` né en même temps que l'envoi qu'il gouverne, cron quotidien à 9h15 UTC, suite `rappels_echeance_tests.sql` (7 tests, dont un qui écrit).","pt":"`spec-flux-emprunts.md` §10.2 prevê lembretes em D-5, D-3 e no próprio dia, depois cobranças em D+1, D+7 e D+30. **Nenhum job dedicado é identificável** entre os 36 crons; o único vizinho é `anarbib-notify-mid-loan-reading-daily`, que faz outra coisa.\n\n**Verificado em 30/08: a falta está confirmada.** Os onze crons cujo nome evoca um vencimento ou uma cobrança foram relidos um a um. **Nenhum lembra um vencimento de empréstimo nem cobra um atraso.** A dúvida está levantada: já não é um item a verificar, é uma decisão a tomar.\n\n**Instruído e entregue em 31/08.** Os lembretes não existiam — mas **os interruptores que os comandam existiam**, e as três bibliotecas com política tinham-nos a `true` sem o saber. Seis momentos passam a **três** (`DOC-RAPPEL-1`). Um quarto envio substitui `notify-mid-loan-reading`, que perguntava «Como vai a leitura?» **em português fixo**: agora convida a deixar uma **nota de leitura sob pseudónimo** no catálogo. **Entregue**: EF `notify-loan-cycle`, tabela `loan_cycle_notifications` com unicidade (item, momento), suíte `rappels_echeance_tests.sql`."},"w":{"fr":"Voir la CI verte, déployer, puis **éprouver pour de bon** : créer un emprunt dont l'échéance tombe à J-3 et vérifier qu'un courriel part, dans la bonne langue, une seule fois. C'est la leçon d'`I5` : ne pas livrer un envoi sans l'avoir vu partir.","pt":"Ver a CI verde, implantar, depois **provar a sério**: criar um empréstimo com vencimento a J-3 e verificar que um e-mail parte, na língua certa, uma só vez."},"y":{"fr":"Le suivi de huit semaines de la formation BLMF prévoit qu'une consulta soit menée de bout en bout avec négociation réelle : c'est le moment où l'absence de rappel se verra. Autant le savoir avant.","pt":"O acompanhamento de oito semanas da formação BLMF prevê que uma consulta seja conduzida de ponta a ponta com negociação real: é o momento em que a ausência de lembrete aparecerá. Melhor saber antes."},"f":[{"fr":"~~Un verdict écrit~~ — ils n'existaient pas, et trois bibliothèques croyaient le contraire.","pt":"~~Um veredicto escrito~~."},{"fr":"~~Soit implémentés, soit la spec amendée~~ — les deux : spec ramenée à trois moments, puis implémentés.","pt":"~~Implementados ou spec emendada~~ — ambos."},{"fr":"Chaque interrupteur commande un envoi réel, et chaque envoi a son interrupteur.","pt":"Cada interruptor comanda um envio real."},{"fr":"Un rappel ne part **qu'une fois** par item et par moment.","pt":"Um lembrete parte **uma só vez**."},{"fr":"Un envoi a été **vu partir**, dans la langue de la destinataire.","pt":"Um envio foi **visto partir**, na língua da destinatária."}],"dep":{"fr":"Se vérifie en même temps que **F1**.","pt":"Verifica-se ao mesmo tempo que **F1**."},"r":["spec-flux-emprunts §2.4 et §10.2","REGISTRE DOC-RAPPEL-1, OPS-8, DOC-SILENCE-1","supabase/functions/notify-loan-cycle/","migration 20260831111700","tests/sql/rappels_echeance_tests.sql","public.book_reading_notes"],"verif":{"fr":"31/08 — relevé en base (36 crons relus, aucun pour le prêt aux lectrices ; 3 bibliothèques avec les deux interrupteurs à `true` ; `book_reading_notes` à zéro ligne) et dans le dépôt (l'ancien mi-parcours écrit en portugais en dur, aucune colonne de blog nulle part). Livré le jour même ; **pas encore éprouvé en envoi réel**.","pt":"31/08 — levantamento em base e no repositório. Entregue no mesmo dia; **ainda não provado em envio real**."}},{"id":"G1","d":"G","p":"P0","s":"ouvert","e":"L","sk":["collectif","aucune"],"t":{"fr":"Emprunter les circuits construits et jamais utilisés","pt":"Percorrer os circuitos construídos e jamais usados"},"v":{"fr":"Vérifié le 29/08 : **62 tables métier n'ont jamais reçu la moindre insertion.** Sept blocs entiers sont concernés — assemblées du réseau (3 tables), notes de lecture (2), propositions et objections d'autorité (3), référentiels de catalogage `catalog_ref_*` (8 sur 9), gouvernance des profils de bibliothèque (4, **alors que deux crons tournent dessus toutes les quinze minutes**), délibération sur les demandes d'adhésion (5, dont `library_request_votes` et `library_request_messages`).\n\n**Remesuré le 31/08 : toujours 62, et ce n'est pas une bonne nouvelle.** Le compte n'a pas bougé en deux jours — 62 tables de `public` sur 189 n'ont jamais reçu la moindre insertion. Mais ce n'est pas la même liste : `loan_cycle_notifications`, née ce matin avec les rappels d'échéance, y est entrée **le jour de sa création**. Un circuit livré aujourd'hui rejoint aussitôt la colonne des circuits jamais empruntés — c'est exactement le mécanisme que cet item nomme, et il continue de tourner pendant qu'on le décrit.\n\n**Un premier livre circule.** L'emprunt **#69** a été ouvert ce matin à 11 h 43 à la BLMF — item 84, *O Anarquismo na Escola, no Teatro, na Poesia* d'Edgar Rodrigues, échéance **21/09**. Il donne au bloc *notes de lecture* sa première chance réelle : le mi-parcours calculé par `notify-loan-cycle` tombe le **10 septembre**, et l'invitation à déposer une note sous pseudonyme partira ce jour-là (item **F4**). `book_reading_notes` est encore à zéro ligne ; si elle en porte une le 11, un des sept blocs sera sorti de cette liste pour de bon — et pas parce qu'on l'aura décidé, parce que quelqu'un l'aura emprunté.\n\nLes six autres blocs sont inchangés au 31/08, vérifiés table par table : assemblées du réseau (3), propositions et objections d'autorité (3), référentiels `catalog_ref_*` (8), gouvernance des profils de bibliothèque (4, **et les deux crons tournent toujours dessus toutes les quinze minutes**), délibération des demandes d'adhésion (5). Tous à zéro insertion.","pt":"Verificado em 29/08: **62 tabelas de negócio nunca receberam uma única inserção.** Sete blocos inteiros são atingidos — assembleias da rede (3 tabelas), notas de leitura (2), propostas e objeções de autoridade (3), referenciais de catalogação `catalog_ref_*` (8 de 9), governança dos perfis de biblioteca (4, **enquanto dois crons rodam sobre elas a cada quinze minutos**), deliberação sobre os pedidos de adesão (5, incluindo `library_request_votes` e `library_request_messages`).\n\n**Remedido em 31/08: ainda 62, e não é boa notícia.** A conta não mudou em dois dias — 62 tabelas de `public` em 189 nunca receberam uma inserção. Mas não é a mesma lista: `loan_cycle_notifications`, nascida esta manhã com os lembretes de vencimento, entrou nela **no dia da sua criação**. Um circuito entregue hoje junta-se de imediato à coluna dos circuitos jamais percorridos.\n\n**Um primeiro livro circula.** O empréstimo **#69** foi aberto esta manhã na BLMF — item 84, *O Anarquismo na Escola, no Teatro, na Poesia*, de Edgar Rodrigues, vencimento **21/09**. Dá ao bloco *notas de leitura* a sua primeira hipótese real: o meio-percurso calculado por `notify-loan-cycle` cai em **10 de setembro**, e o convite a deixar uma nota sob pseudónimo parte nesse dia (item **F4**). `book_reading_notes` continua a zero linhas.\n\nOs seis outros blocos estão inalterados em 31/08, verificados tabela a tabela: assembleias da rede (3), propostas e objeções de autoridade (3), referenciais `catalog_ref_*` (8), governança dos perfis (4, **e os dois crons continuam a rodar sobre elas a cada quinze minutos**), deliberação dos pedidos de adesão (5). Todos a zero inserções."},"w":{"fr":"Choisir un bloc et l'emprunter pour de vrai, du premier geste au dernier : tenir une assemblée du réseau, déposer une note de lecture, proposer une autorité et laisser quelqu'un objecter, faire délibérer une demande d'adhésion. Consigner ce qui manque, ce qui surprend, ce qui bloque.","pt":"Escolher um bloco e percorrê-lo de verdade, do primeiro ao último gesto: realizar uma assembleia da rede, depositar uma nota de leitura, propor uma autoridade e deixar alguém objetar, fazer deliberar um pedido de adesão. Registrar o que falta, o que surpreende, o que trava."},"y":{"fr":"C'est le principal enseignement du relevé du 29 août, et il ne figure dans aucun document du corpus. **Le projet ne souffre pas d'un manque de fonctionnalités : il souffre d'un manque d'usage.** Un circuit jamais emprunté n'est pas livré — il est seulement écrit. Et le jour où il devient le chemin critique, comme le circuit d'invitation vient de le devenir pour les promotions, il casse sur des choses qu'un seul passage aurait révélées.","pt":"É o principal ensinamento do levantamento de 29 de agosto, e não consta em nenhum documento do corpus. **O projeto não sofre de falta de funcionalidades: sofre de falta de uso.** Um circuito jamais percorrido não está entregue — está apenas escrito. E no dia em que se torna o caminho crítico, como o circuito de convite acaba de se tornar para as promoções, ele quebra em coisas que uma única passagem teria revelado."},"f":{"fr":["Au moins trois des sept blocs ont été empruntés de bout en bout, sur `blmf-teste` puis en réel.","Chaque passage a produit un compte rendu écrit de ce qui manque.","Les blocs dont l'usage n'est pas souhaité aujourd'hui sont marqués **dormants**, avec la raison — ce n'est pas un échec, c'est une information."],"pt":["Pelo menos três dos sete blocos foram percorridos de ponta a ponta, em `blmf-teste` e depois no real.","Cada passagem produziu um relatório escrito do que falta.","Os blocos cujo uso não é desejado hoje são marcados **dormentes**, com o motivo — não é um fracasso, é uma informação."]},"dep":{"fr":"Le bloc « assemblée » dépend de **A1**. Les autres non.","pt":"O bloco «assembleia» depende de **A1**. Os outros não."},"r":["Relevé du 29/08/2026","REGISTRE §32 AG, §28 ATE, §26 ONBO","emprunt #69 (BLMF, item 84, échéance 21/09)","item F4","public.book_reading_notes"],"verif":{"fr":"31/08 — remesuré en production : **62 tables de `public` sur 189** à zéro insertion (`pg_stat_user_tables.n_tup_ins`, croisé avec un décompte de lignes sur les tables citées). Le compte est stable, la liste ne l'est pas — `loan_cycle_notifications` y est entrée le jour de sa naissance. Emprunt **#69** ouvert à la BLMF ; l'invitation à écrire une note de lecture est attendue le **10/09**, et c'est la première sortie possible de cette liste.","pt":"31/08 — remedido em produção: **62 tabelas de `public` em 189** a zero inserções. A conta é estável, a lista não. Empréstimo **#69** aberto na BLMF; o convite a escrever uma nota de leitura é esperado em **10/09**."}},{"id":"G2","d":"G","p":"P1","s":"decision","e":"S","sk":["collectif"],"t":{"fr":"Trancher politiquement l'écart entre P2 et P8 sur la promotion à coordenador·a","pt":"Decidir politicamente o desvio entre P2 e P8 sobre a promoção a coordenador·a"},"v":{"fr":"La migration `20260826120000` **est en production** et tranche dans le sens de P2 : collégialité obligatoire, ratification préalable, repli à une signature quand il n'y a qu'une seule personne coordinatrice, consentement explicite de la personne promue, exclusion de cette personne du décompte du quorum. **Mais la décision politique n'a jamais été prise.**","pt":"A migração `20260826120000` **está em produção** e decide no sentido de P2: colegialidade obrigatória, ratificação prévia, recuo a uma assinatura quando há uma só pessoa coordenadora, consentimento explícito da pessoa promovida, exclusão dessa pessoa da contagem do quórum. **Mas a decisão política nunca foi tomada.**"},"w":{"fr":"Porter la question au collectif. Trois options sont écrites : ne rien changer au code et corriger le texte de P2 ; étendre le chemin A comme le code l'a fait ; ou garder la promotion directe mais la rendre visible avec un délai d'objection.","pt":"Levar a questão ao coletivo. Três opções estão escritas: não mudar nada no código e corrigir o texto de P2; estender o caminho A como o código fez; ou manter a promoção direta mas torná-la visível com um prazo de objeção."},"y":{"fr":"Il y a aujourd'hui **du code en production qui anticipe une décision collective non prise**. Le rollback est écrit et testé, ce qui rend l'anticipation réversible — mais l'autre lecture, *le SIGB ne modélise pas l'assemblée générale*, reste entièrement défendable. **Ce n'est pas un arbitrage technique.**","pt":"Há hoje **código em produção que antecipa uma decisão coletiva não tomada**. O rollback está escrito e testado, o que torna a antecipação reversível — mas a outra leitura, *o SIGB não modela a assembleia geral*, continua inteiramente defensável. **Não é uma arbitragem técnica.**"},"f":{"fr":["Le collectif a tranché, et la décision est inscrite au REGISTRE.","Le code est aligné sur la décision, ou le texte de P2 est amendé.","Rappel : le fichier de rollback porte un tiret bas initial qui empêche la CLI de l'appliquer — **ne pas le renommer**."],"pt":["O coletivo decidiu, e a decisão está inscrita no REGISTRO.","O código está alinhado com a decisão, ou o texto de P2 é emendado.","Lembrete: o arquivo de rollback traz um sublinhado inicial que impede a CLI de aplicá-lo — **não renomeá-lo**."]},"dep":{"fr":"Question ouverte depuis le 26/08. Bloque **G3** si la réponse est « revenir en arrière ».","pt":"Questão aberta desde 26/08. Bloqueia **G3** se a resposta for «voltar atrás»."},"r":["ECART_cosignature_promotion_coordenador_2026-08-26 §5","REGISTRE §41 GOUV-1"],"verif":{"fr":"31/08 — la migration `20260826120000` figure bien au registre de production. Rien de neuf mesurable sur la décision politique elle-même.","pt":"31/08 — a migração `20260826120000` está no registro de produção. Nada de novo mensurável sobre a decisão política."}},{"id":"G3","d":"G","p":"P1","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Éprouver le circuit de promotion collégiale sur `blmf-teste`","pt":"Testar o circuito de promoção colegiada em `blmf-teste`"},"v":{"fr":"**Constat corrigé le 31/08 : le circuit est en train d'être emprunté pour la première fois — en réel, pas en répétition.** `library_team_invitations` porte une ligne : l'invitation `ebd78fb9` au rôle `coordenador` sur la **BTL**, proposée le 30/08, ratifiée (statut `ready`, courriel `team.invitation_ready` parti le 30/08), non encore acceptée, expiration le 29/09. C'est elle qui a produit la ligne `#72` de B17. La répétition en six pas sur `blmf-teste`, elle, n'a toujours pas eu lieu : une promotion réelle essuie les plâtres à sa place.","pt":"**Constato corrigido em 31/08: o circuito está sendo percorrido pela primeira vez — em real, não em ensaio.** `library_team_invitations` traz uma linha: convite `ebd78fb9` ao papel `coordenador` na **BTL**, proposto em 30/08, ratificado (status `ready`, e-mail enviado), ainda não aceito, expira em 29/09. Foi ele que produziu a linha `#72` de B17. O ensaio em seis passos em `blmf-teste` continua por fazer: uma promoção real está estreando o circuito em seu lugar."},"w":{"fr":"Les six pas sur la bibliothèque d'essai `blmf-teste`, dont les courriels sont coupés (`email_delivery_mode = 'disabled'`). **Si un pas échoue, ne rien faire sur la BLMF.**","pt":"Os seis passos na biblioteca de teste `blmf-teste`, cujos e-mails estão cortados (`email_delivery_mode = 'disabled'`). **Se um passo falhar, não fazer nada na BLMF.**"},"y":{"fr":"Le réglage `team_admission_mode = 'cosignature'` de la BLMF **n'a jamais eu d'effet sur quoi que ce soit** : les treize promotions au rôle bibliothécaire et les cinq à la coordination sont toutes passées par la promotion directe. Le coût réel du choix retenu, écrit noir sur blanc
