 de signatários: aplicar uma convenção se constata olhando um catálogo, não consultando um registro."},"f":{"fr":["Les notes de travail sont retirées.","Le texte a été présenté à Bologne et son sort est décidé.","S'attendre à ce que la **convention 4 — accepter d'être pointé en retour** — soit la plus discutée : c'est celle qui coûte le plus aux catalogues établis et rapporte le plus aux nouveaux venus. **Ne pas la retirer pour cette raison.**"],"pt":["As notas de trabalho estão retiradas.","O texto foi apresentado em Bolonha e seu destino está decidido.","Esperar que a **convenção 4 — aceitar ser apontado de volta** — seja a mais discutida: é a que mais custa aos catálogos estabelecidos e mais rende aos recém-chegados. **Não retirá-la por essa razão.**"]},"dep":{"fr":"Bologne, 12-13/09.","pt":"Bolonha, 12-13/09."},"r":["CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26"]},{"id":"I1","d":"I","p":"P1","s":"gele","e":"M","sk":["sysadmin"],"t":{"fr":"Aligner l'image GoTrue sur l'état réel des migrations d'authentification","pt":"Alinhar a imagem GoTrue com o estado real das migrações de autenticação"},"v":{"fr":"La production porte **77 migrations `auth`**, la dernière datée du 25/06. L'image épinglée dans `deploy/.env` est `GOTRUE_TAG=v2.189.0`, qui en porte **69**. `deploy/.env.example` indique `v2.192.0`. L'écart est un **bloquant de correction**, pas de confort.","pt":"A produção traz **77 migrações `auth`**, a última datada de 25/06. A imagem fixada em `deploy/.env` é `GOTRUE_TAG=v2.189.0`, que traz **69**. `deploy/.env.example` indica `v2.192.0`. A diferença é um **bloqueio de correção**, não de conforto."},"w":{"fr":"Une méthode qui **se mesure et ne se devine pas** : monter d'un palier, démarrer sur un volume vierge, `select count(*) from auth.schema_migrations;`, recommencer jusqu'à atteindre au moins 77.","pt":"Um método que **se mede e não se adivinha**: subir um patamar, iniciar num volume virgem, `select count(*) from auth.schema_migrations;`, recomeçar até atingir pelo menos 77."},"y":{"fr":"La règle est simple et absolue : **l'image doit être supérieure ou égale à la production, jamais l'inverse.** Une image en retard démarre sur un schéma qu'elle ne connaît pas et peut le corrompre en tentant de le migrer.","pt":"A regra é simples e absoluta: **a imagem deve ser superior ou igual à produção, nunca o contrário.** Uma imagem atrasada inicia sobre um esquema que não conhece e pode corrompê-lo ao tentar migrá-lo."},"f":{"fr":["Un tag est retenu, avec le compte mesuré à chaque palier écrit.","`deploy/.env.example` est corrigé et la documentation de `deploy/` suit.","Les douze dernières versions de production sont listées pour recoupement."],"pt":["Um tag é escolhido, com a contagem medida em cada patamar escrita.","`deploy/.env.example` está corrigido e a documentação de `deploy/` acompanha.","As doze últimas versões de produção estão listadas para conferência."]},"dep":{"fr":"**Gelé sur la production jusqu'au 14/09.** Le travail en environnement d'essai est ouvert. Premier maillon de la chaîne de bascule.","pt":"**Congelado na produção até 14/09.** O trabalho em ambiente de teste está aberto. Primeiro elo da cadeia de migração."},"r":["REPRISE_bascule_autohebergee_2026-08-26 §1"]},{"id":"I2","d":"I","p":"P1","s":"gele","e":"L","sk":["sysadmin"],"t":{"fr":"Achever la bascule vers l'auto-hébergement","pt":"Concluir a migração para a auto-hospedagem"},"v":{"fr":"La pile est réduite de douze à **six conteneurs** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), les versions sont épinglées, `bootstrap.sh` a été exécuté pour de vrai le 26/08 avec huit défauts relevés et corrigés, et la répétition du 18/08 a rejoué 124 migrations et restauré un dump de production en 17 secondes. Reconstruction complète mesurée : **25 minutes**.","pt":"A pilha está reduzida de doze a **seis contêineres** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), as versões estão fixadas, `bootstrap.sh` foi executado de verdade em 26/08 com oito defeitos levantados e corrigidos, e o ensaio de 18/08 reexecutou 124 migrações e restaurou um dump de produção em 17 segundos. Reconstrução completa medida: **25 minutos**."},"w":{"fr":"Ce qui reste : découpler la chaîne de déploiement de l'intégration continue (**de l'extraction, pas de la création** — `scripts/ci/deployer-backend.sh` existe déjà), poser un proxy inverse avec tunnel devant la pile, passer des tags aux empreintes `sha256`, et refaire la répétition à froid un mois plus tard pour vérifier que rien n'a divergé.","pt":"O que resta: desacoplar a cadeia de implantação da integração contínua (**extração, não criação** — `scripts/ci/deployer-backend.sh` já existe), colocar um proxy reverso com túnel na frente da pilha, passar de tags para impressões `sha256`, e refazer o ensaio a frio um mês depois para verificar que nada divergiu."},"y":{"fr":"C'est l'objectif que le projet s'est donné et qu'il n'a pas encore atteint : la fin de la dépendance à un hébergeur tiers. **C'est le chantier le plus technique et le plus autonome du lot** — quelqu'un peut le prendre sans coordination.","pt":"É o objetivo que o projeto se deu e que ainda não atingiu: o fim da dependência de um provedor terceiro. **É o canteiro mais técnico e mais autônomo do lote** — alguém pode assumi-lo sem coordenação."},"f":{"fr":["La pile tourne derrière un proxy inverse, avec les versions en empreintes.","Une reconstruction complète a été refaite un mois après la première.","Garde-fou à préserver impérativement : la boucle de déploiement parcourt `supabase/functions/*/` **en excluant `_shared` et `main`** — sans quoi le routeur partirait sur le Supabase hébergé.","Piège déjà rencontré : les rôles de service n'ont pas de mot de passe dans l'image `supabase/postgres` (SQLSTATE 28P01 en boucle), `postgres` n'est pas superutilisateur (c'est `supabase_admin`), `authenticator` est réservé, et un `set -e` dans la boucle tue le script au premier rôle en échec."],"pt":["A pilha roda atrás de um proxy reverso, com as versões em impressões.","Uma reconstrução completa foi refeita um mês após a primeira.","Guarda a preservar imperativamente: o laço de implantação percorre `supabase/functions/*/` **excluindo `_shared` e `main`** — sem o que o roteador iria para o Supabase hospedado.","Armadilha já encontrada: os papéis de serviço não têm senha na imagem `supabase/postgres` (SQLSTATE 28P01 em laço), `postgres` não é superusuário (é `supabase_admin`), `authenticator` é reservado, e um `set -e` no laço mata o script no primeiro papel em falha."]},"dep":{"fr":"**Gelé sur la production jusqu'au 14/09.** Dépend de **I1**. À faire avant de louer quoi que ce soit : reprendre la connexion authentifiée en local, bloquée par une résolution IPv6 sans route — **ce blocage a probablement disparu de lui-même**, le vérifier coûte cinq minutes et peut épargner une machine montée pour rien.","pt":"**Congelado na produção até 14/09.** Depende de **I1**. A fazer antes de alugar o que quer que seja: retomar a conexão autenticada em local, bloqueada por uma resolução IPv6 sem rota — **esse bloqueio provavelmente desapareceu sozinho**, verificá-lo custa cinco minutos e pode poupar uma máquina montada à toa."},"r":["docs/CHANTIERS_OUVERTS.md §2","deploy/README.md","REPRISE_bascule_autohebergee_2026-08-26"]},{"id":"I3","d":"I","p":"P1","s":"gele","e":"S","sk":["deno"],"t":{"fr":"Tester le routeur `main` de la pile auto-hébergée","pt":"Testar o roteador `main` da pilha auto-hospedada"},"v":{"fr":"`supabase/functions/main/index.ts` existe (6,9 Ko), lit `config.toml` au démarrage, applique un **refus par défaut** — seules les dispenses `verify_jwt = false` sont lues, tout le reste exige un jeton — et refuse de démarrer si le fichier est illisible. **Les quatre tests prévus n'ont pas été passés.**","pt":"`supabase/functions/main/index.ts` existe (6,9 KB), lê `config.toml` na inicialização, aplica uma **recusa por omissão** — só as dispensas `verify_jwt = false` são lidas, todo o resto exige um token — e recusa iniciar se o arquivo for ilegível. **Os quatro testes previstos não foram feitos.**"},"w":{"fr":"Les quatre tests de l'étape 5 de `deploy/REPETITION.md` : fonction protégée sans en-tête d'autorisation → 401 ; avec un jeton valide → 200 ; `health-probe` sans jeton → 200 ; nom inexistant → 404.","pt":"Os quatro testes da etapa 5 de `deploy/REPETITION.md`: função protegida sem cabeçalho de autorização → 401; com um token válido → 200; `health-probe` sem token → 200; nome inexistente → 404."},"y":{"fr":"Le routeur est ce qui remplace la protection par défaut de la plateforme le jour de la bascule. Comme `config.toml` ne déclare que 31 fonctions sur 48, **le refus par défaut du routeur fermera dix-huit fonctions qui fonctionnent aujourd'hui** — il faut le savoir avant, pas après.","pt":"O roteador é o que substitui a proteção por omissão da plataforma no dia da migração. Como `config.toml` só declara 31 funções de 48, **a recusa por omissão do roteador fechará dezoito funções que hoje funcionam** — é preciso saber isso antes, não depois."},"f":{"fr":["Les quatre tests passent.","Le comportement pour les 18 fonctions non déclarées est connu et voulu."],"pt":["Os quatro testes passam.","O comportamento para as 18 funções não declaradas é conhecido e desejado."]},"dep":{"fr":"**Bloqué par B6.** Gelé sur la production jusqu'au 14/09 ; le test en environnement d'essai est ouvert.","pt":"**Bloqueado por B6.** Congelado na produção até 14/09; o teste em ambiente de teste está aberto."},"r":["deploy/README.md","deploy/REPETITION.md étape 5"]},{"id":"I4","d":"I","p":"P1","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Finir le témoin de provenance des sauvegardes","pt":"Terminar a testemunha de proveniência dos backups"},"v":{"fr":"La migration `20260827180000_temoin_sauvegarde_provenance.sql` est **éprouvée sur un PostgreSQL 16 jetable, avec sept contrôles passés, mais jamais jouée contre la production**. Le correctif `health_probe_provenance.patch` **ne s'applique pas** : `patch failed … index.ts:286`. Il a été produit contre le miroir GitHub. Échéance du 28/08, donc échue.","pt":"A migração `20260827180000_temoin_sauvegarde_provenance.sql` está **testada num PostgreSQL 16 descartável, com sete controles passados, mas nunca executada contra a produção**. A correção `health_probe_provenance.patch` **não se aplica**: `patch failed … index.ts:286`. Foi produzida contra o espelho GitHub."},"w":{"fr":"Départager le conflit par `git hash-object` sur le fichier cible, comparé au blob de base `0d00dc0e016fdfb86ef314e4e707abd4a84d1d2c`. **Empreinte identique → `git apply --3way` passe. Empreinte différente → refaire le correctif à la main sur la version réelle : ne pas forcer, ne pas écraser.** Puis déployer `health-probe`.","pt":"Desempatar o conflito por `git hash-object` no arquivo alvo, comparado ao blob de base `0d00dc0e016fdfb86ef314e4e707abd4a84d1d2c`. **Impressão idêntica → `git apply --3way` passa. Impressão diferente → refazer a correção à mão sobre a versão real: não forçar, não sobrescrever.** Depois implantar `health-probe`."},"y":{"fr":"Ce que le correctif doit obtenir, quelle que soit la voie : dans le courriel, chaque flux affiche son hôte (ou « aucune ») et une mention explicite quand il s'agit d'un amorçage ; dans la raison de sauvegarde, `(dernière source : …)` ou `(aucun signal reçu)`. Sans cela, un courriel vert ne dit pas d'où vient le vert — et c'est exactement le défaut qui a laissé les sauvegardes échouer 36 heures en silence.","pt":"O que a correção deve obter, seja qual for o caminho: no e-mail, cada fluxo exibe seu host (ou «nenhum») e uma menção explícita quando se trata de uma semeadura; na razão de backup, `(última fonte: …)` ou `(nenhum sinal recebido)`. Sem isso, um e-mail verde não diz de onde vem o verde — e é exatamente o defeito que deixou os backups falharem 36 horas em silêncio."},"f":{"fr":["La migration est posée dans `supabase/migrations/` et appliquée.","`health-probe` est déployée avec le comportement de provenance.","**`temoin_sauvegarde_provenance.patch` est périmé : à ignorer, ne pas l'appliquer.**"],"pt":["A migração está em `supabase/migrations/` e aplicada.","`health-probe` está implantada com o comportamento de proveniência.","**`temoin_sauvegarde_provenance.patch` está vencido: ignorar, não aplicá-lo.**"]},"dep":{"fr":"Ne pas confondre avec le `snapshot_id` nul sur cinq lignes : le remède tient en trois lignes mais **`anarbib-bg2.sh` vit sur le poste de travail, hors dépôt** — c'est à signaler, pas à tenter depuis le dépôt.","pt":"Não confundir com o `snapshot_id` nulo em cinco linhas: o remédio cabe em três linhas mas **`anarbib-bg2.sh` vive na estação de trabalho, fora do repositório** — é para sinalizar, não para tentar a partir do repositório."},"r":["NOTE_temoin_sauvegarde_2026-08-27","REPRISE_claude_code_2026-08-27 chantier 1"]},{"id":"I5","d":"I","p":"P1","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Faire savoir qu'un workflow a échoué","pt":"Fazer saber que um workflow falhou"},"v":{"fr":"Un job d'alerte existe dans les deux workflows : il ouvre une issue sur la forge, avec anti-doublon. Pourtant `sql-tests` **est resté rouge du 17 au 20 août sans que personne le voie**. Le constat écrit est clair : « même angle mort que les sauvegardes, et il n'est pas couvert ».","pt":"Um job de alerta existe nos dois workflows: abre uma issue na forja, com antiduplicação. No entanto `sql-tests` **ficou vermelho de 17 a 20 de agosto sem que ninguém visse**. A constatação escrita é clara: «mesmo ponto cego dos backups, e não está coberto»."},"w":{"fr":"Faire sortir l'alerte de la forge : un courriel, ou le même canal que les alertes de sauvegarde. Une issue ouverte sur un dépôt que personne ne surveille n'alerte personne.","pt":"Fazer o alerta sair da forja: um e-mail, ou o mesmo canal dos alertas de backup. Uma issue aberta num repositório que ninguém vigia não alerta ninguém."},"y":{"fr":"Le principe est déjà écrit pour les sauvegardes : **une alarme jamais déclenchée n'est pas une alarme.** Et un pipeline qui échoue une fois sur deux cesse d'être lu — ce qui est exactement ce qui s'est passé.","pt":"O princípio já está escrito para os backups: **um alarme jamais disparado não é um alarme.** E um pipeline que falha uma vez em duas deixa de ser lido — que é exatamente o que aconteceu."},"f":{"fr":["Un échec de workflow produit un signal hors de la forge.","Le signal a été éprouvé en le déclenchant volontairement.","Leçon de méthode déjà payée : **ne pas livrer de CI sans l'avoir vue passer au vert et au rouge.**"],"pt":["Uma falha de workflow produz um sinal fora da forja.","O sinal foi testado disparando-o deliberadamente.","Lição de método já paga: **não entregar CI sem tê-la visto passar em verde e em vermelho.**"]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["RUNBOOK_exploitation_v0.3 §7 §9.3","REGISTRE §38 OPS-6"]},{"id":"I6","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Purger les relevés de la sonde de santé","pt":"Purgar os registros da sonda de saúde"},"v":{"fr":"`service_health_probes` porte **13 932 lignes** et croît de 288 par jour, sans aucun cron de purge — alors que sept autres purges existent dans les 36 jobs.","pt":"`service_health_probes` traz **13 932 linhas** e cresce 288 por dia, sem nenhum cron de purga — enquanto sete outras purgas existem nos 36 jobs."},"w":{"fr":"Un cron de purge sur le modèle de `anarbib-catalog-audit-snapshot-purge`, avec une rétention à décider — trente jours suffisent probablement, les incidents étant conservés à part dans `service_health_incidents`.","pt":"Um cron de purga no modelo de `anarbib-catalog-audit-snapshot-purge`, com uma retenção a decidir — trinta dias provavelmente bastam, já que os incidentes são conservados à parte em `service_health_incidents`."},"y":{"fr":"C'est la table la plus volumineuse de la base, et elle ne contient que du bruit dont l'utile a déjà été extrait. À ce rythme elle atteindra cent mille lignes avant la fin de l'année, ce qui alourdira chaque sauvegarde pour rien.","pt":"É a tabela mais volumosa do banco, e só contém ruído do qual o útil já foi extraído. Nesse ritmo alcançará cem mil linhas antes do fim do ano, o que pesará em cada backup à toa."},"f":{"fr":["Un cron de purge existe, avec une rétention écrite.","`service_health_incidents` n'est pas touchée par la purge."],"pt":["Um cron de purga existe, com uma retenção escrita.","`service_health_incidents` não é tocada pela purga."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026","REGISTRE §38 OPS"]},{"id":"I7","d":"I","p":"P1","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Remettre en intégration continue les six suites SQL oubliées","pt":"Recolocar na integração contínua as seis suítes SQL esquecidas"},"v":{"fr":"43 suites de tests SQL existent dans `tests/sql/`. Le manifeste `ci-suites.txt` n'en active que **37**. Les six absentes sont les plus anciennes : `paquet19_loan_wrappers_tests.sql` (32 Ko), `paquet24_consulta_helpers_tests.sql`, `paquet25_consulta_wrappers_tests.sql` (25 Ko), `paquet26_consulta_notification_triggers_tests.sql`, `paquetA1_cancel_note_required_tests.sql`, `paquetA_profils_tests.sql`.","pt":"43 suítes de testes SQL existem em `tests/sql/`. O manifesto `ci-suites.txt` só ativa **37**. As seis ausentes são as mais antigas: `paquet19_loan_wrappers_tests.sql` (32 KB), `paquet24_consulta_helpers_tests.sql`, `paquet25_consulta_wrappers_tests.sql` (25 KB), `paquet26_consulta_notification_triggers_tests.sql`, `paquetA1_cancel_note_required_tests.sql`, `paquetA_profils_tests.sql`."},"w":{"fr":"Les rejouer une par une, réparer celles qui échouent, et les remettre au manifeste. Si l'une est obsolète, la supprimer plutôt que la laisser en place non exécutée.","pt":"Reexecutá-las uma a uma, reparar as que falham, e recolocá-las no manifesto. Se uma estiver obsoleta, suprimi-la em vez de deixá-la no lugar sem execução."},"y":{"fr":"Ce sont précisément les suites qui couvrent les emprunts et les consultations — le cœur de la circulation. Une suite présente mais non exécutée est pire qu'une suite absente : elle donne l'impression que le domaine est couvert.","pt":"São precisamente as suítes que cobrem os empréstimos e as consultas — o coração da circulação. Uma suíte presente mas não executada é pior que uma suíte ausente: dá a impressão de que o domínio está coberto."},"f":{"fr":["`ci-suites.txt` liste 43 suites, ou moins avec les suppressions justifiées.","Le harnais passe au vert avec l'ensemble.","Poser aussi le stub `storage` manquant à côté des stubs `auth` et `vault` — sans lui, toute migration touchant `storage.*` doit se garder elle-même."],"pt":["`ci-suites.txt` lista 43 suítes, ou menos com as supressões justificadas.","O arnês passa em verde com o conjunto.","Colocar também o stub `storage` ausente ao lado dos stubs `auth` e `vault` — sem ele, toda migração que toca `storage.*` precisa se guardar sozinha."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026","PLAN_DE_MARCHE §8 §9"]},{"id":"I8","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Mettre `deploy/README.md` en accord avec ce qui a été exécuté","pt":"Pôr `deploy/README.md` de acordo com o que foi executado"},"v":{"fr":"Le document affirme en gras : « Rien de tout ceci n'a encore tourné ». Trois commits du 26/08 décrivent des exécutions réelles avec huit défauts relevés. Par ailleurs `bootstrap.sh` a **huit étapes** plus une « 7 bis » et une vérification, là où le README en annonce sept ; et le README déclare `notify-cross-library-digest` « absente du dépôt » alors qu'elle y est.","pt":"O documento afirma em negrito: «Nada disso ainda rodou». Três commits de 26/08 descrevem execuções reais com oito defeitos levantados. Além disso `bootstrap.sh` tem **oito etapas** mais uma «7 bis» e uma verificação, onde o README anuncia sete; e o README declara `notify-cross-library-digest` «ausente do repositório» quando ela está lá."},"w":{"fr":"Réécrire la section d'état à partir des journaux d'exécution du 26/08, corriger le compte d'étapes, et retirer l'affirmation sur `notify-cross-library-digest`.","pt":"Reescrever a seção de estado a partir dos diários de execução de 26/08, corrigir a contagem de etapas, e retirar a afirmação sobre `notify-cross-library-digest`."},"y":{"fr":"`deploy/README.md` est le document que lira quelqu'un qui prend **A2** — la reconstruction par un tiers. Une phrase qui dit « rien n'a tourné » va lui faire croire qu'il essuie les plâtres alors que huit défauts ont déjà été trouvés et corrigés pour lui.","pt":"`deploy/README.md` é o documento que lerá quem assumir **A2** — a reconstrução por um terceiro. Uma frase que diz «nada rodou» vai fazê-lo crer que está abrindo caminho quando oito defeitos já foram encontrados e corrigidos para ele."},"f":{"fr":["La section d'état décrit ce qui a tourné et ce qui n'a pas tourné.","Les quatre points « à confirmer avant bascule » ont un verdict : GoTrue et le courriel, `PGRST_DB_SCHEMAS` mis à `public,api,storage` par déduction, le cas `notify-cross-library-digest` (clos), et le rejeu des migrations.","`CADDY_TAG=2` est un tag majeur flottant dans un fichier qui proclame « aucun `latest`, jamais » : à épingler ou à justifier."],"pt":["A seção de estado descreve o que rodou e o que não rodou.","Os quatro pontos «a confirmar antes da migração» têm um veredicto: GoTrue e o e-mail, `PGRST_DB_SCHEMAS` posto em `public,api,storage` por dedução, o caso `notify-cross-library-digest` (encerrado), e a reexecução das migrações.","`CADDY_TAG=2` é um tag maior flutuante num arquivo que proclama «nenhum `latest`, jamais»: a fixar ou a justificar."]},"dep":{"fr":"Prérequis moral de **A2**.","pt":"Pré-requisito moral de **A2**."},"r":["deploy/README.md","Commits 57321385, 35c03dd5, 90266600"]},{"id":"I9","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Corriger les trois migrations horodatées dans le futur","pt":"Corrigir as três migrações datadas no futuro"},"v":{"fr":"`20260830090000`, `20260830110000` et `20260830130000` sont appliquées en production alors que la date du jour est le **29/08**. Elles portent un horodatage du lendemain.","pt":"`20260830090000`, `20260830110000` e `20260830130000` estão aplicadas em produção enquanto a data de hoje é **29/08**. Trazem um carimbo do dia seguinte."},"w":{"fr":"Rien à défaire — les migrations sont appliquées et fonctionnent. Ce qu'il faut, c'est comprendre d'où vient le décalage (fuseau horaire du poste, ou choix manuel) et poser un garde-fou.","pt":"Nada a desfazer — as migrações estão aplicadas e funcionam. O que é preciso é compreender de onde vem o descompasso (fuso horário da estação, ou escolha manual) e colocar uma guarda."},"y":{"fr":"Le nom d'une migration est aussi sa position dans l'ordre de rejeu. Un horodatage en avance sur l'horloge crée une fenêtre où une migration écrite plus tard trie avant elle. La doctrine dit déjà de vérifier l'horodatage UTC avant de choisir — le garde-fou manque.","pt":"O nome de uma migração é também sua posição na ordem de reexecução. Um carimbo adiantado em relação ao relógio cria uma janela em que uma migração escrita depois ordena antes dela. A doutrina já diz para verificar o carimbo UTC antes de escolher — a guarda falta."},"f":{"fr":["La cause est identifiée.","Le hook `pre-commit` refuse une migration dont l'horodatage est dans le futur."],"pt":["A causa está identificada.","O hook `pre-commit` recusa uma migração cujo carimbo esteja no futuro."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026","REPRISE_claude_code_conventions_2026-08-20"]},{"id":"I10","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Nettoyer les traces de Turnstile et les fichiers de rebut","pt":"Limpar os rastros do Turnstile e os arquivos de refugo"},"v":{"fr":"Turnstile a été entièrement retiré du code le 20/08 — sa réapparition serait une régression. Mais des **clés de test subsistent** dans `.env.example` (deux entrées), `.env.local`, `deploy/functions.env`, une référence dans `package.json`, et un secret au Vault. Par ailleurs `tmp-ficedl/` (754 Ko, doublon exact d'un fichier versionné) traîne à la racine, et `docs/drafts/` est versionné sans règle.","pt":"O Turnstile foi inteiramente retirado do código em 20/08 — sua reaparição seria uma regressão. Mas **chaves de teste subsistem** em `.env.example` (duas entradas), `.env.local`, `deploy/functions.env`, uma referência em `package.json`, e um segredo no Vault. Além disso `tmp-ficedl/` (754 KB, duplicata exata de um arquivo versionado) fica na raiz, e `docs/drafts/` está versionado sem regra."},"w":{"fr":"Retirer les cinq traces, supprimer `tmp-ficedl/` (ignoré par git depuis le 28/08, donc sans risque), et décider du statut de `docs/drafts/` : soit c'est un sas et il s'ignore, soit c'est du contenu et il se documente.","pt":"Retirar os cinco rastros, suprimir `tmp-ficedl/` (ignorado pelo git desde 28/08, portanto sem risco), e decidir o estatuto de `docs/drafts/`: ou é uma antecâmara e se ignora, ou é conteúdo e se documenta."},"y":{"fr":"Une clé de test dans un fichier d'exemple est ce que copiera la prochaine personne qui installe le projet. Et `docs/drafts/` est exactement l'endroit où le SQL des sujets SOLIDAIRES s'est perdu (voir **C1**) : un dossier sans règle est un dossier où les choses restent.","pt":"Uma chave de teste num arquivo de exemplo é o que copiará a próxima pessoa que instalar o projeto. E `docs/drafts/` é exatamente o lugar onde o SQL dos assuntos SOLIDAIRES se perdeu (ver **C1**): uma pasta sem regra é uma pasta onde as coisas ficam."},"f":{"fr":["Aucune trace de Turnstile hors historique git.","`tmp-ficedl/` a disparu du disque.","`docs/drafts/` a une règle écrite : ce qui y entre en sort, ou n'y entre pas."],"pt":["Nenhum rastro do Turnstile fora do histórico git.","`tmp-ficedl/` desapareceu do disco.","`docs/drafts/` tem uma regra escrita: o que entra sai, ou não entra."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["RUNBOOK_exploitation_v0.3 §9.8","PLAN_DE_MARCHE §7.4","Relevé du 29/08/2026"]},{"id":"I11","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Sortir de `node:20`, en fin de maintenance","pt":"Sair do `node:20`, em fim de manutenção"},"v":{"fr":"Les trois jobs d'intégration continue tournent dans un conteneur `node:20`, dont la fenêtre de maintenance à long terme s'est achevée en avril 2026. C'est le point de fin de vie le plus net de la chaîne.","pt":"Os três jobs de integração contínua rodam num contêiner `node:20`, cuja janela de manutenção de longo prazo terminou em abril de 2026. É o ponto de fim de vida mais claro da cadeia."},"w":{"fr":"Passer à la version en maintenance longue suivante, vérifier que le build, les tests et le lint passent, et que la CLI Supabase épinglée `v2.98.1` s'y installe.","pt":"Passar para a versão em manutenção longa seguinte, verificar que o build, os testes e o lint passam, e que a CLI Supabase fixada `v2.98.1` se instala nela."},"y":{"fr":"Une image sans mises à jour de sécurité fait tourner tout le déploiement. Le changement est mécanique et se vérifie en une exécution.","pt":"Uma imagem sem atualizações de segurança faz rodar toda a implantação. A mudança é mecânica e se verifica numa execução."},"f":{"fr":["Les trois jobs tournent sur une version maintenue.","Le lint reste à zéro erreur (environ cent avertissements est l'état normal)."],"pt":["Os três jobs rodam numa versão mantida.","O lint continua com zero erro (cerca de cem avisos é o estado normal)."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":[".forgejo/workflows/ci.yml","package.json"]},{"id":"I12","d":"I","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Automatiser le rafraîchissement du miroir froid","pt":"Automatizar a atualização do espelho frio"},"v":{"fr":"Le miroir froid `anarbib-mirror.git` existe sur le poste de travail et son rafraîchissement est manuel. Les unités systemd `anarbib-mirror-refresh.service` et `.timer` sont versionnées dans `deploy/ops/` mais leur mise en service n'est pas confirmée.","pt":"O espelho frio `anarbib-mirror.git` existe na estação de trabalho e sua atualização é manual. As unidades systemd `anarbib-mirror-refresh.service` e `.timer` estão versionadas em `deploy/ops/` mas sua entrada em serviço não está confirmada."},"w":{"fr":"Vérifier que le minuteur tourne, et sinon le mettre en service. Consigner la fraîcheur du miroir quelque part de lisible.","pt":"Verificar se o temporizador roda, e senão colocá-lo em serviço. Registrar o frescor do espelho em algum lugar legível."},"y":{"fr":"Une reconstruction demande **trois** choses et non deux : le dépôt, une sauvegarde, **et les secrets du Vault**. Le miroir froid est la troisième copie du dépôt, après Codeberg et le miroir GitHub. Il ne sert que s'il est à jour — et le miroir GitHub a déjà accumulé 6 878 objets de retard une fois.","pt":"Uma reconstrução exige **três** coisas e não duas: o repositório, um backup, **e os segredos do Vault**. O espelho frio é a terceira cópia do repositório, depois do Codeberg e do espelho GitHub. Só serve se estiver atualizado — e o espelho GitHub já acumulou 6 878 objetos de atraso uma vez."},"f":{"fr":["Le rafraîchissement est automatique et son échec alerte.","La fraîcheur du miroir apparaît dans le témoin de sauvegarde."],"pt":["A atualização é automática e sua falha alerta.","O frescor do espelho aparece na testemunha de backup."]},"dep":{"fr":"Lié à **I4**.","pt":"Ligado a **I4**."},"r":["RUNBOOK_exploitation_v0.3 §4 §9.1"]},{"id":"I13","d":"I","p":"P3","s":"ouvert","e":"M","sk":["sysadmin"],"t":{"fr":"Finir la bascule vers le nouveau moteur de pages","pt":"Terminar a migração para o novo motor de páginas"},"v":{"fr":"L'étape 0 est concluante depuis le 20/08 : `test.anarbib.org` est servi par le nouveau moteur en parallèle. La chaîne d'intégration continue utilise déjà l'action `git-pages`. **Codeberg Pages en version historique est en mode maintenance, pas en fin de vie** — la documentation dit qu'il continuera de fonctionner indéfiniment. D'où la priorité basse.","pt":"A etapa 0 é conclusiva desde 20/08: `test.anarbib.org` é servido pelo novo motor em paralelo. A cadeia de integração contínua já usa a ação `git-pages`. **O Codeberg Pages em versão histórica está em modo de manutenção, não em fim de vida** — a documentação diz que continuará funcionando indefinidamente."},"w":{"fr":"Poser l'enregistrement TXT de liste blanche, créer `public/_redirects` avec la règle de réécriture, vérifier qu'une route inconnue renvoie 200 avec le bon contenu, puis nettoyer **seulement après** vérification verte.","pt":"Colocar o registro TXT de lista branca, criar `public/_redirects` com a regra de reescrita, verificar que uma rota desconhecida retorna 200 com o conteúdo certo, depois limpar **somente após** verificação verde."},"y":{"fr":"Deux points de vigilance sont écrits. **Ne pas toucher aux enregistrements A et AAAA**, qui sont bons. Et **vérifier la casse de l'URL** : le workflow écrit `AnarBib`, la documentation écrit `anarbib` — en cas de doute, poser les deux enregistrements TXT.","pt":"Dois pontos de vigilância estão escritos. **Não tocar nos registros A e AAAA**, que estão bons. E **verificar a caixa do URL**: o workflow escreve `AnarBib`, a documentação escreve `anarbib` — na dúvida, colocar os dois registros TXT."},"f":{"fr":["Le site est servi par le nouveau moteur, avec les routes inconnues en 200.","Le nettoyage est fait après vérification : `public/.domains`, la branche `pages`, les secrets devenus inutiles.","**Laisser `public/CNAME`** — il sert au miroir GitHub.","Incertitudes assumées : la réversibilité de la bascule n'est documentée nulle part, aucune limite chiffrée n'est publiée (taille, bande passante, délai), et les fichiers vendorisés pèsent lourd — **point à surveiller au premier déploiement**."],"pt":["O site é servido pelo novo motor, com as rotas desconhecidas em 200.","A limpeza é feita após verificação: `public/.domains`, o branch `pages`, os segredos que se tornaram inúteis.","**Deixar `public/CNAME`** — serve ao espelho GitHub.","Incertezas assumidas: a reversibilidade da migração não está documentada em lugar nenhum, nenhum limite numérico está publicado (tamanho, banda, prazo), e os arquivos vendorizados pesam — **ponto a vigiar na primeira implantação**."]},"dep":{"fr":"P1, pas P0 — la version historique n'a pas de date d'arrêt annoncée.","pt":"P1, não P0 — a versão histórica não tem data de encerramento anunciada."},"r":["PLAN_migration_git_pages_2026-08-19","RUNBOOK_exploitation_v0.3"]},{"id":"J1","d":"J","p":"P1","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Mettre à jour les chiffres de `CLAUDE.md` et du `README.md`","pt":"Atualizar os números de `CLAUDE.md` e do `README.md`"},"v":{"fr":"`CLAUDE.md` se trompe sur sept chiffres — dont la ligne `verify_jwt`, qui décrit une protection inexistante (voir **B6**). La section d'état du `README.md` est **datée du 7 juillet 2026**, soit 345 commits en arrière.","pt":"`CLAUDE.md` erra em sete números — entre eles a linha `verify_jwt`, que descreve uma proteção inexistente (ver **B6**). A seção de estado do `README.md` está **datada de 7 de julho de 2026**, ou seja 345 commits atrás."},"w":{"fr":"Reprendre la photo chiffrée de ce backlog et l'y reporter, en datant chaque chiffre. Puis décider si ces chiffres ont leur place dans un document qu'on ne relit pas : peut-être un renvoi vers le backlog vaut-il mieux qu'une copie.","pt":"Retomar a foto numérica deste backlog e transpô-la, datando cada número. Depois decidir se esses números têm lugar num documento que não se relê: talvez uma remissão ao backlog valha mais que uma cópia."},"y":{"fr":"`CLAUDE.md` n'est pas versionné — il vit sur une seule machine, retiré du dépôt le 07/07. Ses chiffres faux ne sont donc corrigibles que par une personne, et invisibles pour toutes les autres. C'est un cas particulier de **A2**.","pt":"`CLAUDE.md` não é versionado — vive numa única máquina, retirado do repositório em 07/07. Seus números falsos só são corrigíveis por uma pessoa, e invisíveis para todas as outras. É um caso particular de **A2**."},"f":{"fr":["Les sept chiffres sont corrigés et datés.","La section d'état du `README.md` porte une date récente.","Une décision est prise sur l'endroit où ces chiffres doivent vivre — un seul."],"pt":["Os sete números estão corrigidos e datados.","A seção de estado do `README.md` traz uma data recente.","Uma decisão é tomada sobre o lugar onde esses números devem viver — um só."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026","CLAUDE.md"]},{"id":"J2","d":"J","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Réparer l'index des backlogs et trancher la convention d'archivage","pt":"Reparar o índice dos backlogs e decidir a convenção de arquivamento"},"v":{"fr":"Le tableau d'historique de `docs/backlogs/INDEX.md` s'arrête au v31 : **la ligne du v32 manque**, alors que le fichier est bien dans `archive/`. Et deux conventions de nommage des archives coexistent — avec ou sans le préfixe `-archive-` —, point ouvert explicite jamais porté au REGISTRE.","pt":"A tabela de histórico de `docs/backlogs/INDEX.md` para no v31: **a linha do v32 falta**, embora o arquivo esteja em `archive/`. E duas convenções de nomenclatura dos arquivos coexistem — com ou sem o prefixo `-archive-` —, ponto aberto explícito jamais levado ao REGISTRO."},"w":{"fr":"Ajouter la ligne du v32, celles du v33 et du v34, et trancher la convention d'archivage en une phrase inscrite au REGISTRE.","pt":"Acrescentar a linha do v32, as do v33 e do v34, e decidir a convenção de arquivamento numa frase inscrita no REGISTRO."},"y":{"fr":"L'index des backlogs est ce qui permet de savoir quelle version fait foi. Une lignée avec un trou et deux conventions concurrentes ne remplit pas cet office.","pt":"O índice dos backlogs é o que permite saber qual versão faz fé. Uma linhagem com um buraco e duas convenções concorrentes não cumpre esse ofício."},"f":{"fr":["Le tableau est complet du v8 au v34.","Une seule convention de nommage est inscrite au REGISTRE."],"pt":["A tabela está completa do v8 ao v34.","Uma única convenção de nomenclatura está inscrita no REGISTRO."]},"dep":{"fr":"Se fait en posant ce backlog.","pt":"Faz-se ao depositar este backlog."},"r":["docs/backlogs/INDEX.md"]},{"id":"J3","d":"J","p":"P1","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Corriger les trois affirmations fausses de la spec des consultations","pt":"Corrigir as três afirmações falsas da spec das consultas"},"v":{"fr":"`spec-flux-consultations-v2.2.md` affirme, section profils, que la BLMF est en `full_sigb`, la BTL en `informal` et `BLT-test` en `informal`, le tout « vérifié en prod ». **Les trois sont fausses aujourd'hui** : `BLT-test` n'existe pas en base, et la BTL est en `full_sigb`.","pt":"`spec-flux-consultations-v2.2.md` afirma, seção perfis, que a BLMF está em `full_sigb`, a BTL em `informal` e `BLT-test` em `informal`, tudo «verificado em prod». **As três são falsas hoje**: `BLT-test` não existe no banco, e a BTL está em `full_sigb`."},"w":{"fr":"Relever l'état réel des cinq bibliothèques et le reporter, avec la date du relevé.","pt":"Levantar o estado real das cinco bibliotecas e transpô-lo, com a data do levantamento."},"y":{"fr":"Une affirmation marquée « vérifié en prod » qui ne l'est plus est plus dangereuse qu'une affirmation non marquée : elle décourage la vérification. C'est la leçon centrale de ce backlog.","pt":"Uma afirmação marcada «verificado em prod» que já não o é é mais perigosa que uma afirmação não marcada: desencoraja a verificação. É a lição central deste backlog."},"f":{"fr":["La section décrit l'état réel, daté.","Toute affirmation « vérifié en prod » du corpus porte désormais sa date."],"pt":["A seção descreve o estado real, datado.","Toda afirmação «verificado em prod» do corpus traz agora sua data."]},"dep":{"fr":"Lié à **G5** (statut de la BTL).","pt":"Ligado a **G5** (estatuto da BTL)."},"r":["PLAN_formation_coordination_BLMF §8"]},{"id":"J4","d":"J","p":"P1","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Réécrire la section 14 de la spec de gouvernance des rôles","pt":"Reescrever a seção 14 da spec de governança dos papéis"},"v":{"fr":"`spec-gouvernance-roles.md` §14 liste comme « à implémenter » des choses **qui tournent en production** : la table d'audit `library_membership_audit` (alimentée, huit entrées récentes), les colonnes de carence `pending_removal_until` et `pending_removal_requested_by`, les courriels `team.*` (21 envois, zéro échec), et les deux crons `anarbib-team-pending-removal-complete` et `anarbib-team-inactive-cleanup`. La §5.3 est également périmée : la transition T2 n'est plus unilatérale.","pt":"`spec-gouvernance-roles.md` §14 lista como «a implementar» coisas **que rodam em produção**: a tabela de auditoria `library_membership_audit` (alimentada, oito entradas recentes), as colunas de carência `pending_removal_until` e `pending_removal_requested_by`, os e-mails `team.*` (21 envios, zero falha), e os dois crons `anarbib-team-pending-removal-complete` e `anarbib-team-inactive-cleanup`."},"w":{"fr":"Réécrire les deux sections d'après l'état vérifié du 26/08, et passer la version à jour — le REGISTRE cite déjà une v1.4 que l'index des specs ignore.","pt":"Reescrever as duas seções conforme o estado verificado de 26/08, e atualizar a versão — o REGISTRO já cita uma v1.4 que o índice das specs ignora."},"y":{"fr":"Une spec qui sous-estime le livré fait refaire ce qui existe. C'est la dérive de sens inverse de **J3**, et les deux ont été relevées le même jour.","pt":"Uma spec que subestima o entregue faz refazer o que existe. É a deriva de sentido inverso de **J3**, e as duas foram levantadas no mesmo dia."},"f":{"fr":["Les §14 et §5.3 décrivent l'état réel.","La version de la spec est la même au REGISTRE et dans `docs/specs/INDEX.md`.","La doctrine du rôle exclusif est notée comme appliquée par la RPC elle-même, pas seulement écrite — la promotion du 26/08 en donne la trace : ligne `coordenador` créée active, ligne `librarian` passée à `removed` au même horodatage, deux entrées d'audit, notification en 2,5 secondes."],"pt":["As §14 e §5.3 descrevem o estado real.","A versão da spec é a mesma no REGISTRO e em `docs/specs/INDEX.md`.","A doutrina do papel exclusivo é anotada como aplicada pela própria RPC, não apenas escrita — a promoção de 26/08 dá o rastro: linha `coordenador` criada ativa, linha `librarian` passada a `removed` no mesmo carimbo, duas entradas de auditoria, notificação em 2,5 segundos."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["VERIF_etat_reel_gouvernance_et_crons_2026-08-26 §2","REGISTRE §41 GOUV"]},{"id":"J5","d":"J","p":"P2","s":"ouvert","e":"M","sk":["aucune"],"t":{"fr":"Résorber les incohérences du corpus documentaire","pt":"Resolver as incoerências do corpus documental"},"v":{"fr":"Une relecture du corpus a relevé une vingtaine de contradictions internes. Les plus structurantes : **deux sections `MAP` au REGISTRE** avec des verdicts inverses et sans renvoi de l'une à l'autre ; **deux sections numérotées §17** (`IMP` et `PRIV`) ; trois versions déclarées du REGISTRE (v0.1, v0.2, v0.3) selon l'index consulté ; `OAI-1` à `OAI-9` annoncés « à inscrire ici » et jamais inscrits ; **sept specs présentes sur disque et référencées par aucun index** ; et l'index général qui désigne encore Woodpecker comme chaîne de déploiement là où le REGISTRE dit Forgejo depuis le 11/06.","pt":"Uma releitura do corpus levantou umas vinte contradições internas. As mais estruturantes: **duas seções `MAP` no REGISTRO** com vereditos inversos e sem remissão de uma à outra; **duas seções numeradas §17** (`IMP` e `PRIV`); três versões declaradas do REGISTRO (v0.1, v0.2, v0.3) conforme o índice consultado; `OAI-1` a `OAI-9` anunciados «a inscrever aqui» e nunca inscritos; **sete specs presentes em disco e referenciadas por nenhum índice**; e o índice geral que ainda designa o Woodpecker como cadeia de implantação onde o REGISTRO diz Forgejo desde 11/06."},"w":{"fr":"Une passe d'hygiène, par ordre de gravité : les collisions de numéro et de section au REGISTRE d'abord, puis les versions déclarées, puis les sept specs orphelines, puis les renvois périmés.","pt":"Uma passagem de higiene, por ordem de gravidade: as colisões de número e de seção no REGISTRO primeiro, depois as versões declaradas, depois as sete specs órfãs, depois as remissões vencidas."},"y":{"fr":"Le REGISTRE fait foi : c'est écrit dans la règle de préséance, et cette règle est ce qui permet à quelqu'un de trancher sans demander. Un registre qui porte deux §17 et deux sections `MAP` contradictoires ne peut pas faire foi sur ces points précis. C'est un défaut de la seule chose qui n'a pas le droit d'en avoir.","pt":"O REGISTRO faz fé: está escrito na regra de precedência, e essa regra é o que permite a alguém decidir sem perguntar. Um registro que traz duas §17 e duas seções `MAP` contraditórias não pode fazer fé nesses pontos precisos. É um defeito na única coisa que não tem direito a tê-los."},"f":{"fr":["Les collisions de section sont résolues, en respectant `#HYG-REG-1` : **on ne renumérote pas le normatif déjà inscrit**, les sections nouvelles prennent les numéros suivants.","Le §2 `MAP` porte un renvoi vers le §34.","Les sept specs orphelines sont référencées ou archivées.","Les renvois à Woodpecker sont corrigés dans `docs/specs/INDEX.md` et `CONTRIBUTING.md`.","Les deux identifiants cités mais absents de la table des doctrines — `DOC-COLLECTIVE-1` et `USER-EMAIL-1` — sont inscrits ou retirés."],"pt":["As colisões de seção estão resolvidas, respeitando `#HYG-REG-1`: **não se renumera o normativo já inscrito**, as seções novas tomam os números seguintes.","A §2 `MAP` traz uma remissão à §34.","As sete specs órfãs estão referenciadas ou arquivadas.","As remissões ao Woodpecker estão corrigidas em `docs/specs/INDEX.md` e `CONTRIBUTING.md`.","Os dois identificadores citados mas ausentes da tabela das doutrinas — `DOC-COLLECTIVE-1` e `USER-EMAIL-1` — estão inscritos ou retirados."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique**, mais qui demande de la patience.","pt":"Nenhuma. **Entrada sem competência técnica**, mas que exige paciência."},"r":["docs/specs/REGISTRE_decisions.md","docs/INDEX.md","docs/specs/INDEX.md"]},{"id":"J6","d":"J","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Écrire les cinq doctrines internalisées là où un tiers les trouverait","pt":"Escrever as cinco doutrinas internalizadas onde um terceiro as encontraria"},"v":{"fr":"Cinq règles de conception sont appliquées partout et écrites nulle part d'accessible : l'ordre des mises à jour dans une RPC (le récit avant l'état), la distinction entre `workflow_note` et `schedule_reply_note`, l'interdiction d'`async` dans `onAuthStateChange`, les pièges d'encodage sous PowerShell, et le contrat `actionBox` de la fonction de rendu des courriels.","pt":"Cinco regras de concepção são aplicadas em toda parte e escritas em nenhum lugar acessível: a ordem das atualizações numa RPC (o relato antes do estado), a distinção entre `workflow_note` e `schedule_reply_note`, a proibição de `async` em `onAuthStateChange`, as armadilhas de codificação sob PowerShell, e o contrato `actionBox` da função de renderização dos e-mails."},"w":{"fr":"Les écrire dans le dépôt, pas dans un fichier local. Une page suffit ; chacune tient en trois lignes et un exemple.","pt":"Escrevê-las no repositório, não num arquivo local. Uma página basta; cada uma cabe em três linhas e um exemplo."},"y":{"fr":"Ces cinq règles vivent aujourd'hui dans `CLAUDE.md`, qui est **explicitement hors dépôt**. Quelqu'un qui clone le projet ne les verra jamais et les enfreindra, une par une, en écrivant du code parfaitement raisonnable.","pt":"Estas cinco regras vivem hoje em `CLAUDE.md`, que está **explicitamente fora do repositório**. Quem clonar o projeto nunca as verá e as infringirá, uma a uma, escrevendo código perfeitamente razoável."},"f":{"fr":["Les cinq sont dans le dépôt, atteignables depuis `CONTRIBUTING.md`.","Chacune porte l'incident qui l'a produite, quand il existe."],"pt":["As cinco estão no repositório, alcançáveis a partir de `CONTRIBUTING.md`.","Cada uma traz o incidente que a produziu, quando existe."]},"dep":{"fr":"Sert **A2** et **A4**.","pt":"Serve **A2** e **A4**."},"r":["CLAUDE.md, doctrines internalisées","PLAN_DE_MARCHE §8"]},{"id":"K1","d":"K","p":"P0","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Faire adopter l'acte de création du Fonds AnarBib","pt":"Fazer adotar a ata de criação do Fundo AnarBib"},"v":{"fr":"Un projet d'acte est rédigé et archivé. Il n'a pas été adopté. **C'est le préalable politique à l'ouverture de tout canal d'encaissement : rien ne bouge avant.**","pt":"Um projeto de ata está redigido e arquivado. Não foi adotado. **É o preliminar político à abertura de qualquer canal de arrecadação: nada se move antes.**"},"w":{"fr":"L'acte doit faire quatre choses : créer le fonds, désigner nommément la personne qui tient la clé Pix, désigner la personne dépositaire de la part européenne, et fixer le principe du rapport annuel.","pt":"A ata deve fazer quatro coisas: criar o fundo, designar nominalmente a pessoa que detém a chave Pix, designar a pessoa depositária da parte europeia, e fixar o princípio do relatório anual."},"y":{"fr":"Les frais de fonctionnement — environ **36 € par mois, 430 € par an**, intégralement adossés à des factures — sortent aujourd'hui de la poche d'une seule personne. Deux caisses sont prévues, avec un seul registre : la caisse brésilienne finance les dépenses locales, la caisse européenne finance l'infrastructure. **L'argent doit atterrir là où les factures se paient.**","pt":"As despesas de funcionamento — cerca de **36 € por mês, 430 € por ano**, integralmente lastreadas em faturas — saem hoje do bolso de uma só pessoa. Duas caixas estão previstas, com um único registro: a caixa brasileira financia as despesas locais, a caixa europeia financia a infraestrutura. **O dinheiro deve pousar onde as faturas se pagam.**"},"f":{"fr":["L'acte est adopté et archivé.","La personne qui tient la clé Pix l'accepte en connaissance de cause.","Le nom public de la caisse est arrêté.","**Son article 1 suffit à lui seul à publier un canal honnêtement, si l'assemblée tarde.**"],"pt":["A ata está adotada e arquivada.","A pessoa que detém a chave Pix aceita com pleno conhecimento.","O nome público da caixa está definido.","**Seu artigo 1 basta sozinho para publicar um canal honestamente, se a assembleia demorar.**"]},"dep":{"fr":"Bloque **K2**.","pt":"Bloqueia **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25 §9","MINUTA_ata_fundo_anarbib_CCLA_2026-08-26"]},{"id":"K2","d":"K","p":"P1","s":"bloque","e":"M","sk":["collectif"],"t":{"fr":"Ouvrir les canaux d'encaissement dormants","pt":"Abrir os canais de arrecadação dormentes"},"v":{"fr":"Liberapay est en ligne et a reçu son premier don le 27/08. L'encart « soutenir financièrement » est publié dans les dix locales et nomme Liberapay comme unique canal ouvert. **Pix et IBAN dorment** dans un bloc de commentaire HTML entre les marqueurs `ENCART-DORMANT-START` et `ENCART-DORMANT-END`. Wero est en attente d'une réponse de l'établissement bancaire.","pt":"O Liberapay está no ar e recebeu sua primeira doação em 27/08. O encarte «apoiar financeiramente» está publicado nas dez locales e nomeia o Liberapay como único canal aberto. **Pix e IBAN dormem** num bloco de comentário HTML entre os marcadores `ENCART-DORMANT-START` e `ENCART-DORMANT-END`."},"w":{"fr":"Côté Brésil : une clé aléatoire dédiée créée par la personne mandatée, et l'ouverture d'un compte au numéro d'entreprise — une coopérative de crédit est plus cohérente qu'une banque commerciale. Côté Europe : décider quel compte reçoit. Puis remplir les gabarits, retirer les deux marqueurs de commentaire, et supprimer les deux paragraphes « en cours d'ouverture ».","pt":"Lado Brasil: uma chave aleatória dedicada criada pela pessoa mandatada, e a abertura de uma conta no CNPJ — uma cooperativa de crédito é mais coerente que um banco comercial. Lado Europa: decidir qual conta recebe. Depois preencher os modelos, retirar os dois marcadores de comentário, e suprimir os dois parágrafos «em abertura»."},"y":{"fr":"Le Pix ne peut pas être créé depuis la France — l'élargissement d'août 2026 ne vaut que pour envoyer. Et une clé posée sur le numéro fiscal personnel d'un compa l'expose au contrôle fiscal : d'où l'urgence du compte au numéro d'entreprise. Sur l'IBAN, la recommandation écrite est de le publier **en clair** — un « demander par courriel » fera perdre plus de dons qu'il n'évitera d'ennuis.","pt":"O Pix não pode ser criado desde a França — a ampliação de agosto de 2026 só vale para enviar. E uma chave posta no CPF pessoal de um compa o expõe à malha fina: daí a urgência da conta no CNPJ. Sobre o IBAN, a recomendação escrita é publicá-lo **em claro** — um «pedir por e-mail» fará perder mais doações do que evitará aborrecimentos."},"f":{"fr":["Au moins un canal supplémentaire est ouvert et publié dans les dix locales.","Le générateur des pages de comptes a été relancé après chaque édition de `FINANCES.md`.","Si la réponse sur Wero est négative, **la phrase Wero est retirée du bloc dormant des dix fichiers** — le gabarit y est encore.","Rappel : le hook `pre-push` refuse la poussée tant qu'un gabarit est visible hors du bloc dormant."],"pt":["Pelo menos um canal adicional está aberto e publicado nas dez locales.","O gerador das páginas de contas foi reexecutado após cada edição de `FINANCES.md`.","Se a resposta sobre o Wero for negativa, **a frase Wero é retirada do bloco dormente dos dez arquivos** — o modelo ainda está lá.","Lembrete: o hook `pre-push` recusa o push enquanto um modelo estiver visível fora do bloco dormente."]},"dep":{"fr":"**Bloqué par K1.**","pt":"**Bloqueado por K1.**"},"r":["PLAN_financement_AnarBib_2026-08-25","FINANCES.md"]},{"id":"K3","d":"K","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Tenir le registre public des comptes","pt":"Manter o registro público das contas"},"v":{"fr":"`FINANCES.md` est à la racine du dépôt vitrine et dix pages publiques en sont engendrées, par langue. Le générateur signale nommément toute cellule non traduite. Un tableau distinct porte ce qu'une personne a avancé avant que le fonds existe — environ **228 € de mars à août 2026** — et la question de savoir si c'est une dette à rembourser est laissée à l'assemblée.","pt":"`FINANCES.md` está na raiz do repositório vitrine e dez páginas públicas são geradas a partir dele, por língua. O gerador sinaliza nominalmente toda célula não traduzida. Uma tabela distinta traz o que uma pessoa adiantou antes de o fundo existir — cerca de **228 € de março a agosto de 2026** — e a questão de saber se é uma dívida a reembolsar fica para a assembleia."},"w":{"fr":"Consigner chaque recette et chaque dépense au fil de l'eau, et relancer le générateur après chaque édition.","pt":"Registrar cada receita e cada despesa continuamente, e reexecutar o gerador após cada edição."},"y":{"fr":"**Consigner les avances passées dès maintenant, avant la délibération** — dans un an, personne ne se souviendra des montants. Le régime de transparence choisi est le rapport annuel plus les comptes sur demande ; il ne tient que si le registre est à jour.","pt":"**Registrar os adiantamentos passados desde já, antes da deliberação** — daqui a um ano, ninguém se lembrará dos valores. O regime de transparência escolhido é o relatório anual mais as contas sob pedido; só se sustenta se o registro estiver atualizado."},"f":{"fr":["Le registre est à jour et les dix pages reflètent son contenu.","Anticipation notée : le renouvellement du domaine en mars 2027 coûtera plus cher, la promotion de première année ne se reconduisant pas."],"pt":["O registro está atualizado e as dez páginas refletem seu conteúdo.","Antecipação anotada: a renovação do domínio em março de 2027 custará mais caro, a promoção do primeiro ano não se renovando."]},"dep":{"fr":"Indépendant de **K1** et **K2**.","pt":"Independente de **K1** e **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25","tools/build-finances-pages.cjs"]},{"id":"K4","d":"K","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Corriger le générateur des pages de vie privée sur la langue déclarée","pt":"Corrigir o gerador das páginas de privacidade sobre a língua declarada"},"v":{"fr":"Les pages écrites à la main portent `<html lang=\"pt-BR\">` ; `tools/build-privacy-pages.cjs` émet `lang=\"pt\"`. **Les pages ont raison, le script a tort.**","pt":"As páginas escritas à mão trazem `<html lang=\"pt-BR\">`; `tools/build-privacy-pages.cjs` emite `lang=\"pt\"`. **As páginas têm razão, o script está errado.**"},"w":{"fr":"Corriger le script pour qu'il émette l'étiquette complète, et vérifier que le générateur des pages de comptes, bâti sur le même modèle, ne reproduit pas le défaut.","pt":"Corrigir o script para que emita a etiqueta completa, e verificar que o gerador das páginas de contas, construído no mesmo modelo, não reproduza o defeito."},"y":{"fr":"L'attribut de langue est ce qu'utilisent les lecteurs d'écran pour choisir leur prononciation. `pt` fera lire du portugais du Portugal à un public brésilien. C'est le même critère WCAG 3.1.1 que le projet a déjà corrigé côté application.","pt":"O atributo de língua é o que os leitores de tela usam para escolher sua pronúncia. `pt` fará ler português de Portugal para um público brasileiro. É o mesmo critério WCAG 3.1.1 que o projeto já corrigiu do lado do aplicativo."},"f":{"fr":["Le script émet l'étiquette complète.","Les pages engendrées et les pages écrites à la main concordent."],"pt":["O script emite a etiqueta completa.","As páginas geradas e as páginas escritas à mão concordam."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Dépôt vitrine anarbib/pages","tools/build-privacy-pages.cjs"]},{"id":"K5","d":"K","p":"P1","s":"en-cours","e":"M","sk":["collectif"],"t":{"fr":"Tenir l'intervention de Bologne et en tirer les suites","pt":"Realizar a intervenção de Bolonha e tirar as consequências"},"v":{"fr":"Atelier AnarBib le 12/09 au matin, assemblée ouverte le 13. Un jeu de 29 diapositives italien-anglais est prêt, ainsi qu'une brochure manifeste bilingue. Trois objectifs annoncés : la genèse et la conception, le panorama des fonctionnalités, et **un appel à participation**.","pt":"Oficina AnarBib em 12/09 pela manhã, assembleia aberta em 13. Um conjunto de 29 slides italiano-inglês está pronto, assim como um folheto manifesto bilíngue. Três objetivos anunciados: a gênese e a concepção, o panorama das funcionalidades, e **um chamado à participação**."},"w":{"fr":"Demander le créneau d'intervention à l'assemblée du 13, chronométrer la version italienne à voix haute, imprimer le dossier sur papier — tout le monde n'ouvre pas un PDF dans une salle —, et répéter la démonstration **hors ligne**, au cas où le réseau manque.","pt":"Pedir o horário de intervenção à assembleia do dia 13, cronometrar a versão italiana em voz alta, imprimir o material em papel — nem todo mundo abre um PDF numa sala —, e ensaiar a demonstração **off-line**, caso a rede falte."},"y":{"fr":"L'appel à participation est ce qui décide de **A1** et de **A3**. Le but énoncé est qu'AnarBib cesse d'être un projet solitaire : que le code évolue par des contributions humaines plutôt que par de l'assistance automatique, et que les coûts soient mutualisés. Point de vigilance : la colonne « manquant » de la diapositive 21 est **largement périmée** — beaucoup de ce qu'elle liste a été livré depuis.","pt":"O chamado à participação é o que decide **A1** e **A3**. O objetivo enunciado é que o AnarBib deixe de ser um projeto solitário: que o código evolua por contribuições humanas em vez de assistência automática, e que os custos sejam mutualizados. Ponto de vigilância: a coluna «faltando» do slide 21 está **amplamente vencida** — muito do que ela lista foi entregue desde então."},"f":{"fr":["L'intervention a eu lieu et l'appel a été porté à l'assemblée.","Les contacts pris sont consignés, avec ce que chacun a proposé.","Sur l'accessibilité, dire les deux : des fonctionnalités sont implémentées, aucun audit indépendant n'a été mené (voir **E1**)."],"pt":["A intervenção ocorreu e o chamado foi levado à assembleia.","Os contatos feitos estão registrados, com o que cada um propôs.","Sobre acessibilidade, dizer os dois: funcionalidades estão implementadas, nenhuma auditoria independente foi conduzida (ver **E1**)."]},"dep":{"fr":"Gel du code en production à partir du 08/09.","pt":"Congelamento do código em produção a partir de 08/09."},"r":["CALENDRIER_bologne_2026-08-27","PLAN_intervention_FICEDL_Bologne_2026-09-12"]},{"id":"K6","d":"K","p":"P2","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Écrire à May Day Rooms et préparer la rencontre avec leftove.rs","pt":"Escrever ao May Day Rooms e preparar o encontro com leftove.rs"},"v":{"fr":"Un brouillon complet est rédigé, en anglais. **L'atelier AnarBib est le matin, l'atelier leftove.rs l'après-midi du 12/09, même salle, même journée.** L'échéance d'envoi — fin août, pour qu'ils aient le temps de regarder AnarBib sans que ce soit urgent — se referme.","pt":"Um rascunho completo está redigido, em inglês. **A oficina AnarBib é de manhã, a oficina leftove.rs à tarde do dia 12/09, mesma sala, mesmo dia.** O prazo de envio — fim de agosto, para que tenham tempo de olhar o AnarBib sem que seja urgente — está se fechando."},"w":{"fr":"Envoyer, avec trois questions : le vocabulaire de sujets, le profil de numérisation (ils ont 16 000 documents océrisés), et NORLA et la cartographie. Plus une question sur l'auto-hébergement au collectif technique présent.","pt":"Enviar, com três perguntas: o vocabulário de assuntos, o perfil de digitalização (têm 16 000 documentos ocerizados), e a NORLA e a cartografia. Mais uma pergunta sobre auto-hospedagem ao coletivo técnico presente."},"y":{"fr":"Deux ateliers le même jour dans la même salle, sur des sujets voisins, sans que les deux équipes se soient parlé, serait un gâchis. Et il y a un point à regarder avant, pas après : **leftove.rs est sous licence CC BY-NC-SA, et la clause non commerciale n'est pas une licence libre au sens strict.**","pt":"Duas oficinas no mesmo dia na mesma sala, sobre assuntos vizinhos, sem que as duas equipes tenham se falado, seria um desperdício. E há um ponto a olhar antes, não depois: **leftove.rs está sob licença CC BY-NC-SA, e a cláusula não comercial não é uma licença livre em sentido estrito.**"},"f":{"fr":["Le message est parti.","Les trois questions ont une réponse, ou une conversation est prévue à Bologne."],"pt":["A mensagem foi enviada.","As três perguntas têm resposta, ou uma conversa está prevista em Bolonha."]},"dep":{"fr":"Avant le 12/09.","pt":"Antes de 12/09."},"r":["VEILLE_leftovers_maydayrooms_2026-08-19","CALENDRIER_bologne_2026-08-27"]},{"id":"K7","d":"K","p":"P1","s":"en-cours","e":"L","sk":["collectif"],"t":{"fr":"Mener la formation des deux coordinations BLMF jusqu'à l'autonomie","pt":"Conduzir a formação das duas coordenações BLMF até a autonomia"},"v":{"fr":"Le matériel est livré : 89 diapositives en portugais du Brésil, six modules, trois rencontres, six exercices pratiques, notes d'animation dans chaque diapositive. Ni l'une ni l'autre des deux personnes n'est bibliothécaire ou informaticienne.","pt":"O material está entregue: 89 slides em português do Brasil, seis módulos, três encontros, seis exercícios práticos, notas de animação em cada slide. Nenhuma das duas pessoas é bibliotecária ou informática."},"w":{"fr":"Avant la première séance : créer sur `blmf-teste` les deux comptes de coordination, un ou deux comptes de lecture fictifs, et les cinq fiches fautives de l'exercice 2. Puis le suivi de huit semaines : cinq fiches par semaine **toutes avec leur provenance**, un jour de comptoir par semaine, une consultation menée de bout en bout avec négociation réelle, et le vote du profil de la bibliothèque porté en assemblée.","pt":"Antes do primeiro encontro: criar em `blmf-teste` as duas contas de coordenação, uma ou duas contas de leitura fictícias, e as cinco fichas defeituosas do exercício 2. Depois o acompanhamento de oito semanas: cinco fichas por semana **todas com sua proveniência**, um dia de balcão por semana, uma consulta conduzida de ponta a ponta com negociação real, e o voto do perfil da biblioteca levado à assembleia."},"y":{"fr":"Deux personnes autonomes sur la coordination d'une bibliothèque, c'est **A1** à l'échelle locale. Le principe pédagogique tient en trois mots — *« cliqua, não vai quebrar nada ! »* — et il est tenable parce que les transitions impossibles ne s'affichent pas, les boutons bloqués sont pré-désactivés avec une explication, et la base refuse les combinaisons impossibles. Les neuf gestes irréversibles sont nommés explicitement.","pt":"Duas pessoas autônomas na coordenação de uma biblioteca é **A1** na escala local. O princípio pedagógico cabe em três palavras — *«cliqua, não vai quebrar nada!»* — e é sustentável porque as transições impossíveis não aparecem, os botões travados vêm pré-desativados com uma explicação, e o banco recusa as combinações impossíveis. Os nove gestos irreversíveis são nomeados explicitamente."},"f":{"fr":["Les huit semaines sont faites, avec le rituel hebdomadaire de trente minutes et ses trois questions fixes.","La feuille de lacunes alimentée par ce rituel devient l'ordre du jour suivant **et un matériau de contribution au projet**.","L'engagement chiffré est tenu : **aucune fiche nouvelle sans mode d'acquisition** — le rattrapage rétroactif des 2 450 fiches sans donnée d'acquisition n'est pas demandé, seul l'arrêt de la dette l'est."],"pt":["As oito semanas estão feitas, com o ritual semanal de trinta minutos e suas três perguntas fixas.","A folha de lacunas alimentada por esse ritual vira a pauta seguinte **e um material de contribuição ao projeto**.","O compromisso quantificado é cumprido: **nenhuma ficha nova sem modo de aquisição** — a recuperação retroativa das 2 450 fichas sem dado de aquisição não é pedida, só a parada da dívida é."]},"dep":{"fr":"S'appuie sur **G3** et **G4** pour le bac à sable.","pt":"Apoia-se em **G3** e **G4** para o ambiente de teste."},"r":["PLAN_formation_coordination_BLMF_2026-08-26","GABARITO_exercicio2_formacao_BLMF_2026-08-26"]},{"id":"K8","d":"K","p":"P2","s":"ouvert","e":"M","sk":["collectif"],"t":{"fr":"Finir le texte d'orientation sur les outils de bibliothèques militantes","pt":"Terminar o texto de orientação sobre as ferramentas de bibliotecas militantes"},"v":{"fr":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` est un **squelette destiné à être co-signé**. Six points sont explicitement à vérifier ou à trancher, et la section finale — celle qui porte l'appel — reste à écrire.","pt":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` é um **esqueleto destinado a ser cossinado**. Seis pontos estão explicitamente a verificar ou decidir, e a seção final — a que carrega o chamado — resta escrever."},"w":{"fr":"Lister quelques hébergeurs associatifs, vérifier la vitalité actuelle de PMB, vérifier la licence exacte de Pandora et ce qu'implique l'entrée d'une archive partenaire, vérifier l'adresse de contact du réseau ALN, trancher la ligne « catalogue consultable, pas de prêt » du tableau, faire compléter la description d'AnarcosyndicalismeBOOK, et **écrire ensemble la section finale « Ce qui manque » — c'est l'appel**.","pt":"Listar alguns provedores associativos, verificar a vitalidade atual do PMB, verificar a licença exata do Pandora e o que implica a entrada de um arquivo parceiro, verificar o endereço de contato da rede ALN, decidir a linha «catálogo consultável, sem empréstimo» da tabela, fazer completar a descrição do AnarcosyndicalismeBOOK, e **escrever juntos a seção final «O que falta» — é o chamado**."},"y":{"fr":"Trois positions du texte méritent d'être tenues telles quelles. **La question qui décide de tout : qui tiendra le serveur, et pendant combien de temps ?** **Soyez honnêtes sur l'échelle** — en dessous de quelques centaines de documents sans prêt, un tableur fait le travail, et **AnarBib est surdimensionné pour un petit fonds sans prêt**. Et la déclaration d'intérêt explicite : les deux projets comparés sont libres, les deux sont tenus par une seule personne — **se le dire vaut mieux que de le découvrir**.","pt":"Três posições do texto merecem ser mantidas tais quais. **A pergunta que decide tudo: quem vai manter o servidor, e por quanto tempo?** **Sejam honestos quanto à escala** — abaixo de algumas centenas de documentos sem empréstimo, uma planilha faz o serviço, e **o AnarBib é superdimensionado para um pequeno acervo sem empréstimo**. E a declaração de interesse explícita: os dois projetos comparados são livres, os dois são mantidos por uma só pessoa — **dizer isso vale mais que descobrir**."},"f":{"fr":["Les six vérifications sont faites.","La section finale est écrite à plusieurs.","Le texte est traduit une fois stabilisé, pas avant."],"pt":["As seis verificações estão feitas.","A seção final está escrita em conjunto.","O texto é traduzido depois de estabilizado, não antes."]},"dep":{"fr":"Lié à **K5** et **H7**.","pt":"Ligado a **K5** e **H7**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26"]}],"etat":{"photo_intro":{"fr":"Relevé du **29 août 2026**. Base de production `uflwmikiyjfnikiphtcp` interrogée en lecture seule ; dépôt `codeberg.org/anarbib/anarbib` au commit `1d00ed2c`. Ces chiffres ne sont pas des estimations : ils sont la réponse d'une requête ou d'un `ls`. Ils périmeront vite — c'est normal, et c'est la raison pour laquelle ils sont datés.","pt":"Levantamento de **29 de agosto de 2026**. Banco de produção `uflwmikiyjfnikiphtcp` consultado em somente-leitura; repositório `codeberg.org/anarbib/anarbib` no com nt figés. Ce qui compte n'est pas de les déplorer, c'est de savoir qu'ils vont **dans les deux sens** — et donc qu'un document non revérifié peut aussi bien faire perdre du temps à refaire l'existant qu'à croire acquis ce qui ne l'est pas.","pt":"Eis por que o v33 não podia mais servir. Estes desvios não são negligências: são o rastro normal de um projeto que entregou 655 commits enquanto seus documentos de pilotagem ficaram parados. O que importa não é lamentá-los, é saber que vão **nos dois sentidos** — e portanto que um documento não reverificado tanto pode fazer perder tempo refazendo o existente quanto acreditar adquirido o que não é."},"ecarts":[{"sens":"livre","quoi":{"fr":"Les six migrations de conventions catalographiques","pt":"As seis migrações de convenções catalográficas"},"dit":{"fr":"« écrites, jamais appliquées » — `REPRISE_claude_code_conventions_2026-08-20`","pt":"«escritas, nunca aplicadas» — `REPRISE_claude_code_conventions_2026-08-20`"},"reel":{"fr":"**19 migrations `conventions_00` à `conventions_17` appliquées le 21/08**, soit bien au-delà des six annoncées. Le chantier a été mené presque entièrement.","pt":"**19 migrações `conventions_00` a `conventions_17` aplicadas em 21/08**, bem além das seis anunciadas. O canteiro foi conduzido quase inteiramente."}},{"sens":"livre","quoi":{"fr":"La collégialité de promotion à coordenador·a","pt":"A colegialidade de promoção a coordenador·a"},"dit":{"fr":"« écrite, testée hors production, non appliquée » + runbook de déploiement en 11 étapes","pt":"«escrita, testada fora de produção, não aplicada» + runbook de implantação em 11 etapas"},"reel":{"fr":"`20260826120000_team_coordenador_collegial_promotion` **est en production**. Le runbook de déploiement est caduc ; la répétition sur `blmf-teste` reste à faire (item **G3**).","pt":"`20260826120000_team_coordenador_collegial_promotion` **está em produção**. O runbook de implantação está caduco; o ensaio em `blmf-teste` continua por fazer (item **G3**)."}},{"
