do — a sonda `catalogue_par_oeuvre` do `health-probe` (`5111ac5f`) chama a RPC em anónimo de cinco em cinco minutos, limiar 3 000 ms; o front regista o seu recuo. Suites em CI: `catalogue_par_oeuvre_cout_tests` (7 casos), banco `health-probe-catalogue-par-oeuvre` (3 casos). Fora do item: a view continua a ser o posto mais caro (`fn_library_visible_to_caller` avaliada por detenção, ~70 000 acessos a buffers por chamada)."}],["F7","2026-09-24",{"fr":"**Attention : l'identifiant `F7` désigne deux objets — les treize secrets vides (clos le 02/09, ligne plus haut) et celui-ci, le transport mail.** **Clos le 24/09 au soir, sur pièces : les deux critères tenus, et le cas (a) de `DOC-SILENCE-1` qui les motivait a une alarme.** *(1)* Sans `MAIL_TRANSPORT=mock` explicite, une fonction sans service configuré lève un message lisible — livré par la PR #30 du camarade (`ASR2026`), fusion `2cd27d71` le 23/09 après six corrections obtenues en relecture (RFC 2047 sur les noms accentués, STARTTLS obligatoire avec opt-in `SMTP_ALLOW_INSECURE`, corps en base64 plié à 76 colonnes, garde `SMTP_HOST`, délais `SMTP_TIMEOUT_MS`, banc `smtp-transport.test.js` qui charge le vrai module). **Preuve en production** : une réservation et son annulation le 23/09 à 19 h 30 ont fait partir quatre courriels par `notify-event`, journalisés « `[transport] envoi via Resend` » — la majuscule n'existe que dans le code fusionné. *(2)* Une seule implémentation d'envoi, appelée par toutes les fonctions : les huit copies de l'appel à Resend ont rejoint `_shared/transport/email.ts` en trois lots (`7a2ba5e9`, `c7db27e1`, `b0ff9970`/`badf88de`/`f2c36a6f`), chacune en passant SON routage explicitement — le module posait un `Reply-To` d'office depuis le contexte, ce qui aurait rendu à `notify-library-request` celui que F14 venait de retirer ; d'où `routing` et `noReplyTo`. Le module a aussi appris `toEmails` (une liste de destinataires en un message, pour `register`) et `transportConfigure()` (la garde de `register` exigeait `RESEND_API_KEY` : une pile SMTP aurait eu `MISSING_ENV` à chaque inscription). **Garde** `src/tests/mail-transport-routage.test.js` : payload figé (From du routage explicite, absence de Reply-To sous `noReplyTo`, repli sur le contexte, `throw` sans service) et liste fermée des fonctions encore en direct, **vide** ; éprouvée par mutation. La garde F14 (`reply-to-meme-domaine`) balaye désormais aussi un Reply-To passé en routage explicite. Déployé en trois runs verts (#1316, #1317, #1318) ; empreintes neuves constatées, OPTIONS 200/405 partout. **Rectification** : `register` n'a jamais été silencieux — il renvoie `email_usuaria_enviado: false` et la page d'inscription avertit. Le vrai cas (a) était `request-password-reset`, dont le `catch` anti-énumération (décision juste, gardée) avalait tout échec de transport. **Réponse le 24/09** (`91475d06`, migration prod `20260924180538`) : le module note chaque échec dans `mail_transport_failures` — jamais l'adresse, erreur expurgée `<adresse>` et tronquée — et `health-probe` porte la sonde `mail_transport` (`fn_healthcheck_mail_transport()`, `security definer` fermée à `anon`) : un échec dans les 30 dernières minutes ouvre l'incident, trente minutes de calme le referment ; `kind` dans la CHECK et dans `sondesStructurelles` par la même livraison ; table classée pour la sauvegarde, purgée à 30 jours ; suite `mail_transport_tests` (6/6) dans la liste des suites. Constaté après déploiement : tour de la sonde à 20 h 35, zéro incident, sonde `ok`. **Non éprouvé** : un vrai échec ouvrant un vrai incident — Xavier a choisi de ne pas simuler ; la recette de F2 (une ligne insérée, deux courriels) reste valable le jour où on voudra.","pt":"**Atenção: o identificador `F7` designa dois objetos — os treze segredos vazios (fechado em 02/09, linha acima) e este, o transporte de e-mail.** **Fechado em 24/09 à noite, com provas: os dois critérios cumpridos, e o caso (a) de `DOC-SILENCE-1` que os motivava tem um alarme.** *(1)* Sem `MAIL_TRANSPORT=mock` explícito, uma função sem serviço configurado falha com mensagem legível — entregue pela PR #30 do companheiro (`ASR2026`), merge `2cd27d71` em 23/09 após seis correções obtidas na releitura (RFC 2047, STARTTLS obrigatório com opt-in `SMTP_ALLOW_INSECURE`, corpo em base64 dobrado a 76 colunas, guarda `SMTP_HOST`, `SMTP_TIMEOUT_MS`, banco `smtp-transport.test.js`). **Prova em produção**: uma reserva e o seu cancelamento em 23/09 às 19h30 dispararam quatro e-mails por `notify-event`, registrados como « `[transport] envoi via Resend` » — a maiúscula só existe no código novo. *(2)* Uma só implementação de envio, chamada por todas as funções: as oito cópias da chamada à Resend passaram para `_shared/transport/email.ts` em três lotes (`7a2ba5e9`, `c7db27e1`, `b0ff9970`/`badf88de`/`f2c36a6f`), cada uma passando o SEU roteamento explicitamente — o módulo punha um `Reply-To` por padrão a partir do contexto, o que devolveria a `notify-library-request` o que F14 acabara de retirar; daí `routing` e `noReplyTo`. O módulo aprendeu também `toEmails` e `transportConfigure()` (a guarda de `register` exigia `RESEND_API_KEY`: uma pilha SMTP teria `MISSING_ENV` em toda inscrição). **Guarda** `mail-transport-routage.test.js`: payload fixado e lista fechada das funções ainda diretas, **vazia**; provada por mutação. Implantado em três runs verdes (#1316, #1317, #1318); impressões novas constatadas, OPTIONS 200/405. **Retificação**: `register` nunca foi silencioso — devolve `email_usuaria_enviado: false` e a página de inscrição avisa. O caso (a) real era `request-password-reset`, cujo `catch` anti-enumeração (decisão correta, mantida) engolia toda falha de transporte. **Resposta em 24/09** (`91475d06`, migração em produção `20260924180538`): o módulo anota cada falha em `mail_transport_failures` — nunca o endereço — e `health-probe` traz a sonda `mail_transport`: uma falha nos últimos 30 minutos abre o incidente, trinta minutos de calma o fecham; `kind` na CHECK e em `sondesStructurelles` na mesma entrega; tabela classificada para o backup, purgada a 30 dias; suíte `mail_transport_tests` (6/6). Constatado após o deploy: volta da sonda às 20h35, zero incidente, sonda `ok`. **Não provado**: uma falha real abrindo um incidente real — Xavier escolheu não simular; a receita de F2 continua válida."}],["I25","2026-09-24",{"fr":"**Clos le 24/09 sur pièces : la cause est nommée, reproduite et retirée.** Le filet lisait la sortie par `echo \"$out\" | grep -qE ' OK : …'` sous `set -o pipefail` : `grep -q` quitte à la première ligne « OK : », `echo` n a pas fini d écrire ce qui la suit (« ROLLBACK »), reçoit SIGPIPE, et `pipefail` fait de son code 141 le verdict — FAIL sur une suite verte. Rare, parce que ce reste tient en quelques octets, le plus souvent déjà dans le tampon du tube. **Reproduit le 24/09 hors CI, 300 fois sur 300**, en plaçant 300 Ko après la ligne « OK : » (bash 5 sous Git Bash ; le mécanisme est celui de POSIX) ; **0 sur 300 depuis un fichier**. `scripts/ci/run-sql-suites.sh` lit désormais la sortie depuis un fichier (`grep -c`, aucun tube), et un FAIL imprime le code de psql, celui de grep, le nombre de lignes « OK : » et la taille de la sortie. Rejoué en local sur `supabase_db_anarbib` (325 migrations, 192 tables classées) : `mail_transport_tests` et `crons_planifies_tests` PASS ; une suite sans bilan FAIL avec sa ligne de diagnostic (« psql rc=0 · grep rc=1 · lignes OK=0 · 48 octets »). Le second critère (« trois mois sans récidive ») avait été écrit pour une cause inconnue ; la cause est nommée, l attente n a plus d objet. `32edb185`, `sql-tests` vert en CI.","pt":"**Fechado em 24/09 sobre peças: a causa está nomeada, reproduzida e retirada.** A rede lia a saída por `echo \"$out\" | grep -qE ' OK : …'` sob `set -o pipefail`: `grep -q` sai na primeira linha « OK : », `echo` ainda não acabou de escrever o que se segue (« ROLLBACK »), recebe SIGPIPE, e `pipefail` faz do seu código 141 o veredicto — FAIL numa suite verde. Raro, porque esse resto cabe em poucos bytes. **Reproduzido em 24/09 fora da CI, 300 vezes em 300**, colocando 300 KB depois da linha « OK : »; **0 em 300 a partir de um ficheiro**. `scripts/ci/run-sql-suites.sh` lê agora a saída de um ficheiro (`grep -c`, nenhum tubo), e um FAIL imprime o código do psql, o do grep, o número de linhas « OK : » e o tamanho da saída. Reproduzido em local: duas suites PASS, uma suite sem balanço FAIL com a sua linha de diagnóstico. O segundo critério (« três meses sem recidiva ») fora escrito para uma causa desconhecida; a causa está nomeada. `32edb185`, `sql-tests` verde na CI."}],["F13","2026-09-24",{"fr":"**Clos le 24/09 sur pièces.** `sendIll` rend le verdict de `safeSendEmail` par `verdictEnvois` (`_shared/domain/outbox-verdict.ts`, le même juge que les sept modules corrigés le 21/09) : `sent_count` ne compte que les envois acceptés par le transport ; la réponse porte `refused_count`, `refused` (adresse et cause) et `skipped_count`. Le cas épinglé du banc `notify-digital-share-banc` est retourné — transport en panne : `sent_count` 0, un refus nommé (`dem@exemplo.test`) ; un cas neuf vérifie les trois comptes sur un envoi à deux (2 / 0 / 0). **Plus aucun cas du dépôt n est épinglé « DÉFAUT CONNU »** (il reste une mention au passé dans `library-profile-banc`). Rien n affiche encore cette réponse : c était le dernier endroit connu à garder la forme du défaut « sent à tort ». `32edb185`, CI verte (`app`, `backend`), fonction déployée (marqueur `deployed-functions`), sondée en production après le déploiement : marqueur `deployed-functions` sur `32edb185`, trois appels sans secret → 401 en 0,3 à 1,7 s à 21 h 32, la fonction démarre.","pt":"**Fechado em 24/09 sobre peças.** `sendIll` devolve o veredicto de `safeSendEmail` por `verdictEnvois` (`_shared/domain/outbox-verdict.ts`, o mesmo juiz dos sete módulos corrigidos em 21/09): `sent_count` só conta os envios aceites pelo transporte; a resposta traz `refused_count`, `refused` (endereço o uma escolha de sessão, não de falantes (nl, el: E2) — « corrige-me »; e o manual do leitor, fora do repositório, ainda cita a palavra antiga (J9). `32edb185`, CI verde, em produção."}],["H11","2026-09-24",{"fr":"**Clos le 24/09 sur pièces.** Migration `20260924194818` (`f4a531ce`), engendrée par le mapping du sync lui-même (`isSyncable` + `toRow` importés de `scripts/ficedl_thesaurus_sync.mjs`, jamais recopiés) depuis `docs/journal/ficedl/ficedl_thesaurus_2026-09-03.json` : 621 termes (227 sujets, 234 géo, 1 mixte, **159 dates**), les deux fiches sans libellé ni H1 écartées (`mot532`, `mot538`), idempotente — l UPDATE ne touche qu une ligne dont le contenu diffère. **Comparée ligne à ligne à la production avant de pousser** (md5 par `mot_id`, 621 lignes) : 619 identiques, deux différaient — `mot136` et `mot137` portaient au dépôt le drapeau `hors_liste_cira` que la production n avait pas, parce que le sync du 03/09 (11 h 07) a précédé la ré-aspiration commitée à 13 h 17 (`2f314f15`). Le dépôt est la référence : la production a reçu ces deux drapeaux au déploiement, rien d autre. **Vérifié en production après la CI** : 621 termes, 159 dates, empreinte de la table `8d1e585e67e3c5f7059532a41adabcd0` = celle du rejeu local = celle que la suite imprime ; 332 migrations = 332. Suite `ficedl_termes_tests` (7 cas : comptes, un seul `harvested_at`, aucun terme sans libellé, empreinte, et un alignement vers un descripteur `dates` qui passe la clé étrangère — le sujet est créé par le test, aucun n existe en CI). `sql-tests` et `rejeu-image` verts. Le jour où le sync sera rejoué en production, la suite rougira : il faudra régénérer la migration (script au scratchpad de la session, recette dans l en-tête de la migration), pas ajuster le test.","pt":"**Fechado em 24/09 sobre peças.** Migração `20260924194818` (`f4a531ce`), gerada pelo próprio mapping do sync (`isSyncable` + `toRow` importados, nunca recopiados) a partir da aspiração de 03/09: 621 termos (**159 datas**), idempotente. **Comparada linha a linha à produção antes de empurrar**: 619 idênticas, duas diferiam (`mot136`, `mot137`: bandeira `hors_liste_cira` posta pela re-aspiração de 13h17, depois do sync de 11h07) — a produção recebeu-as na implantação, nada mais. **Verificado em produção após a CI**: 621 termos, 159 datas, impressão digital `8d1e585e67e3c5f7059532a41adabcd0` = a do rejogo local = a que a suite imprime; 332 migrações = 332. Suite `ficedl_termes_tests` (7 casos, incluindo um alinhamento para um descritor `dates`). `sql-tests` e `rejeu-image` verdes."}],["F4","2026-09-24",{"fr":"**Clos le 24/09 : le dernier critère est tenu par Xavier.** Mesuré en production le 24/09 : `loan_cycle_notifications` porte trois envois, tous sur l emprunt 84 (BLMF) — l invitation à une note de lecture le 10/09 à 09 h 15, **le rappel J-3 le 18/09** et **le rappel du jour de l échéance le 21/09**, une fois chacun (unicité item × moment). Xavier confirme le 24/09 que ces courriels sont **arrivés, dans la langue de la personne**. Les interrupteurs commandent des envois réels depuis le 31/08 (EF `notify-loan-cycle`, cron quotidien 9 h 15 UTC, suite `rappels_echeance_tests`). Ce qui n est pas dans cette clôture : le J+7 (aucun retard depuis le 31/08 — l emprunt 84 est rendu) ; il partira au premier retard réel, et la table le dira.","pt":"**Fechado em 24/09: o último critério é cumprido por Xavier.** Medido em produção: `loan_cycle_notifications` tem três envios, todos sobre o empréstimo 84 — o convite a uma nota de leitura em 10/09, **o lembrete D-3 em 18/09** e **o do dia do prazo em 21/09**, uma vez cada. Xavier confirma em 24/09 que chegaram, na língua da pessoa. Fora deste fecho: o D+7 (nenhum atraso desde 31/08) — partirá no primeiro atraso real."}],["G14","2026-09-24",{"fr":"**Clos le 24/09 sur pièces.** Xavier a relancé la personne lui-même (décision du 21/09) ; lu en production le 24/09 : l invitation du 30/08 est passée à **`accepted`** avant son expiration du 29/09. Les deux autres invitations du 01/09 : une acceptée, une en attente de ratification (expiration 01/10). Ce que l épisode dit, à verser à **G1** : l invitation par courriel n a pas suffi, la relance humaine oui.","pt":"**Fechado em 24/09 sobre peças.** Xavier relançou a pessoa; lido em produção em 24/09: o convite de 30/08 passou a **`accepted`** antes de expirar. As duas outras de 01/09: uma aceite, uma à espera de ratificação. O que o episódio diz, para **G1**: o convite por e-mail não bastou, a relance humana sim."}],["E14","2026-09-24",{"fr":"**Clos le 24/09 au soir, sur pièces.** Livré en trois commits (`44ced60d`, `4dfb9d47`, `1145b32f`), déployé, et **emprunté pour de vrai** : à 22 h 55 (heure de Paris), Xavier a déposé le signalement `35a5dc22` depuis `/login`, sans session, et reçu le courriel des admins (PDF versé dans la séance) ; en base, la ligne de file est passée à `sent` au premier essai, accusé de réception compris. *Critère 1* (déposer un signalement depuis n importe quelle page sans rien connaître de Codeberg) : tenu, par ce geste. *Critère 2* (courriel aux admins, file avec un statut, un même défaut signalé cinq fois ne fait pas cinq courriels) : tenu — courriel reçu, file `/relatar-problema/fila`, doublon ouvert rendu tel quel (banc `relatar-banc`). *Critère 3* : dix locales, page titrée, formulaire au clavier (champs étiquetés, `role=alert`/`status`) ; **le rendu sur téléphone n a pas été regardé** — les champs sont en pleine largeur et en 16 px, sans grille, mais c est une lecture du code, pas une mesure. Deux corrections nées du premier signalement réel : le courriel ne cite plus « (E14) », qui ne dit rien à qui le lit (remarque de Xavier), et une personne sans compte n envoie plus « Bibliothèque : AnarBib » — c était le contexte par défaut de `LibraryContext`. Deux gardes avaient mordu avant : la CHECK de la table Altcha (rejeu local) et `salle_des_machines_tests` (privilège par défaut de `public`, fermé par `20260924204107`). La route a d abord dit « signalar », qui n est d aucune langue : `/relatar-problema`.","pt":"**Fechado em 24/09 à noite, sobre peças.** Entregue em três commits, implantado e **percorrido de verdade**: às 22h55 (hora de Paris), Xavier depositou o relato `35a5dc22` a partir de `/login`, sem sessão, e recebeu o e-mail da administração; em base, a linha da fila passou a `sent` à primeira tentativa, aviso de receção incluído. Critérios 1 e 2 cumpridos; critério 3: dez locales, página titulada, formulário por teclado — **o rendimento no telemóvel não foi visto**. Duas correções nascidas do primeiro relato real: o e-mail já não cita « (E14) », e uma pessoa sem conta já não envia « Biblioteca: AnarBib »."}],["F14","2026-09-24",{"fr":"**Clos le 24/09 : le dernier critère est tenu par Xavier.** Le code est en production depuis le 22/09 au soir (les deux secrets de Reply-To retirés, `register` retombe sur l expéditeur, l adresse humaine `anarbib@proton.me` écrite dans le corps des courriels concernés, dix langues, garde `reply-to-meme-domaine`). Xavier a refait l épreuve : une inscription vers une adresse Riseup, et le courriel de bienvenue est **arrivé en boîte de réception principale** (plus dans les indésirables). Nuance honnête : l en-tête `X-Spam-Status` n a pas été relu ligne à ligne ; c est l arrivée en boîte principale qui fait preuve ici.","pt":"**Fechado em 24/09: o último critério é cumprido por Xavier.** Código em produção desde 22/09. Xavier refez a prova: uma inscrição para um endereço Riseup, e o e-mail de boas-vindas **chegou à caixa de entrada principal**. Nuance: o cabeçalho `X-Spam-Status` não foi relido linha a linha; é a chegada à caixa principal que faz prova."}],["F11","2026-09-24",{"fr":"**Clos le 24/09 : le dernier critère est tenu par Xavier.** Les deux gestes de code étaient faits le 22/09 (les 27 fonds sans couleur de texte corrigés, garde `mails-fond-et-couleur` ; `color-scheme: dark` déclaré dans les huit documents, `MAIL-Q7`). Xavier a regardé les courriels dans son client, en thème sombre et en thème clair, dont les deux nés le 24/09 (l alerte de signalement et l accusé de réception) : **tout se lit**. Aucune capture versée au dépôt : la parole de Xavier fait preuve.","pt":"**Fechado em 24/09: o último critério é cumprido por Xavier.** Os gestos de código estavam feitos em 22/09. Xavier olhou os e-mails no seu cliente, em tema escuro e claro, incluindo os dois nascidos em 24/09: **tudo se lê**."}],["I15","2026-09-24",{"fr":"**Clos le 24/09 au soir : les trois critères tenus.** Xavier a créé le secret Forgejo `VITE_SUPABASE_PUBLISHABLE_KEY` (valeur : la clé publiable, publique par nature) ; `ci.yml` le lit (`f0a88461`) ; le build suivant (run 7258461, vert) a publié un `catalogue-snapshot.json` généré à 20 h 57 UTC — la clé est passée. Vérifié ensuite sur Codeberg (`9e36871c`) : plus aucun workflow ni aucun code ne lit `VITE_SUPABASE_ANON_KEY` (seul le commentaire historique de `ci.yml` le nomme). **Xavier a supprimé l ancien secret** le 24/09. Le piège reste écrit dans `ci.yml` : `prebuild` sort en 0 si la variable manque, la date du snapshot servi est la seule preuve d un build sain.","pt":"**Fechado em 24/09 à noite: os três critérios cumpridos.** Segredo criado por Xavier, `ci.yml` alinhado (`f0a88461`), snapshot gerado às 20h57 UTC; nenhum workflow lê já o segredo antigo, que Xavier apagou em 24/09."}],["E19","2026-09-25",{"fr":"**Clos le 25/09, sur un critère réécrit par Xavier.** Le premier « fini quand » de la fiche — « les trois cartes visibles sans défiler sur un écran de portable » — était **intenable par construction** : l en-tête, le bandeau, l identité de la personne et les vidéos tutos précèdent l onglet, quoi qu on y déplace (constat de Xavier, 25/09). **Critère réécrit par Xavier le 25/09** : *les trois cartes (export, notifications, lettre) viennent juste après le profil, avant tout le reste de l onglet.* **Tenu** depuis `e09bf16a` (24/09) : profil seul en haut, puis les trois cartes côte à côte (`repeat(3, minmax(0, 1fr))`, une colonne sous 900 px), puis « Ma bibliothèque », puis l adresse (formulaire coupé en deux le 21/09, `26e2421f`), puis ce qui se lit, et « Supprimer mon compte » seule, en dernier, en rouge. Gardé par le banc `conta-decisions-sous-le-profil` (7 cas : ordre des blocs, une seule grille, pistes `minmax`, plus de colonne à droite, chaque geste garde son appel). Vérifié en production le 24/09 à 23 h 30 (`AccountPage-Df-sqleY.css`, `AccountPage-Cwx3hTeR.js`), vu par Xavier sur son portable. Les autres critères : 360 px sans débordement (mesuré dans un harnais le 20/09 à 360, 700, 920 et 1 366 px, trois langues) ; suppression en dernier (banc). **Hors de cette clôture** : la capture de la page dans le Manuel v5, qui vit hors du dépôt (à reprendre avec **J9**).","pt":"**Fechado em 25/09, sobre um critério reescrito por Xavier.** O primeiro « pronto quando » — « as três cartas visíveis sem deslizar num portátil » — era **impossível por construção**: o cabeçalho, a faixa, a identidade da pessoa e os vídeos tutoriais precedem o separador. **Critério reescrito por Xavier em 25/09**: *as três cartas vêm logo depois do perfil, antes de todo o resto do separador.* **Cumprido** desde `e09bf16a`: perfil, três cartas, « A minha biblioteca », endereço, o que se lê, e « Apagar a minha conta » em último. Guardado pelo banco `conta-decisions-sous-le-profil` (7 casos), verificado em produção, visto por Xavier. **Fora deste fecho**: a captura do Manual v5, fora do repositório (J9)."}],["B24","2026-09-25",{"fr":"**Clos le 25/09, les deux critères tenus.** *(1) Une seule copie, une garde.* Dans le dépôt de la vitrine (`codeberg.org/anarbib/pages`, `d4a110f`) : l adresse du projet et la clé publiable vivent dans **`js/config.js` et nulle part ailleurs** (une rotation = une ligne) ; `explorar.js` les lit dans `window.ANARBIB_CONFIG` ; les dix pages `/<lang>/explorar/` chargent `config.js` avant lui et ne portent plus aucun attribut de clé. **`tools/garde-cles.cjs`** refuse tout JWT legacy et toute clé secrète dans le dépôt, toute clé publiable hors de `config.js`, tout attribut `data-supabase-key`, et une clé qui ne commence pas par `sb_publishable_` — **éprouvée rouge** sur une clé remise dans le HTML et sur un JWT dans `config.js`, verte sur l état livré (210 fichiers lus). Elle tourne au pre-push, dont une **copie versionnée** vit désormais dans `tools/hooks/pre-push` (README : l installer dans un clone neuf). Vérifié dans un navigateur (`/fr/` et `/el/explorar/` : trois bibliothèques, console sans erreur) puis **en production** (`anarbib.org/js/config.js` servi, `/fr/explorar/` charge `config.js`, zéro attribut de clé). *(2) L inventaire écrit.* `CONTRIBUTING.md` de l application (§ « Rotation d une clé », fr et en) nomme chaque lieu de chaque clé — secret Forgejo, vitrine, fonctions, poste — et la relecture des `edge_logs` après rotation (le `referer` désigne le lieu oublié). B19, clos le 15/09, porte l inventaire du 08/09.","pt":"**Fechado em 25/09, os dois critérios cumpridos.** *(1)* No repositório da vitrine (`d4a110f`): endereço e chave publicável em **`js/config.js` e em nenhum outro lugar**; as dez páginas carregam `config.js`; **`tools/garde-cles.cjs`** recusa qualquer JWT legacy, chave secreta, chave publicável fora de `config.js`, atributo `data-supabase-key` ou chave que não comece por `sb_publishable_` — provada vermelha nos dois erros, verde no estado entregue; corre no pre-push, cuja cópia versionada vive em `tools/hooks/pre-push`. Verificado num navegador e em produção. *(2)* O `CONTRIBUTING.md` da aplicação nomeia cada lugar de cada chave e a releitura dos `edge_logs` após rotação."}],["F12","2026-09-25",{"fr":"**Clos le 25/09, les trois critères tenus.** Livré par `2a5d2642`, migration `20260924214108`. *(1) Un envoi refusé est retenté seul, un nombre borné de fois, sans doublon.* Le verdict (`outbox-verdict.ts`) rend QUI a refusé ; les huit handlers des cinq files concernées (team — avec network, assembleia, library_profile —, lettre, gazette, cartography, bug_report) l écrivent dans `refused_recipients` ; un trigger programme le prochain essai (15 min, 1 h, 6 h) ; le cron `anarbib-notify-outbox-retry` (toutes les 15 min) reposte à `notify-event` avec « seulement » ; `core/dispatch.ts` enveloppe le handler dans la restriction (`transport/restriction.ts`, AsyncLocalStorage) et `safeSendEmail` saute tout destinataire déjà servi en le comptant comme servi. Prouvé par le banc `courriels-rejeu-banc` (6 cas : refus partiel nommé, rejeu qui ne sert que le refusé et passe à « sent », refus persistant, pas de fuite de la restriction, deux dépêches concurrentes). *(2) État final et raison ; la sonde distingue.* Après quatre essais la ligne passe en `abandoned` ; `api.fn_outbox_abandonnees` / `api.fn_outbox_acquitter` (admin réseau, raison obligatoire) l en font sortir en `skipped`, raison écrite ; `fn_healthcheck_notifications` compte à part `dont_en_rejeu` et `dont_abandonnees` (corps réel, deux remplacements comptés). Suite `courriels_rejeu_tests` (9 cas). *(3) Le cron est dans `fn_crons_attendus()` et dans la suite des crons* : 39 jobs ; la suite résout désormais aussi les appels `private.` (0 commande non vérifiée). **Éprouvé avant de pousser** : `node:async_hooks` sous Deno 2.7 et dans le binaire `edge-runtime` du conteneur local ; 111 suites SQL et 859 tests verts. **En production le 25/09** : 335 migrations = 335, cron actif, colonnes sur les cinq files, sonde `ok`, fonctions privées fermées, sept fonctions d envoi sondées (démarrage normal : 401, 400, 422, 200), et le premier passage du cron, le 25/09 à 00 h 15 (heure de Paris), a réussi en 46 ms (aucune ligne en échec à reprendre). Verdicts des deux RPC à l audit (0029 = 424). Hors périmètre, dit dans la migration : `authority_proposal_notification_outbox` (son handler ne lit pas le verdict) et les deux files `painel_*`.","pt":"**Fechado em 25/09, os três critérios cumpridos.** Entregue por `2a5d2642`. *(1)* O veredicto diz QUEM recusou; os oito handlers das cinco filas escrevem-no; o cron `anarbib-notify-outbox-retry` repõe com « seulement », e o transporte só serve os recusados — banco `courriels-rejeu-banc` (6 casos). *(2)* Após quatro tentativas, `abandoned`; `api.fn_outbox_acquitter` (administração da rede, razão obrigatória) fá-la sair; a sonda distingue `dont_en_rejeu` e `dont_abandonnees` — suite `courriels_rejeu_tests` (9). *(3)* Cron em `fn_crons_attendus()` (39) e na suite. Em produção em 25/09: migração aplicada, cron ativo, sete funções de envio sondadas, e le premier passage du cron, le 25/09 à 00 h 15 (heure de Paris), a réussi en 46 ms (aucune ligne en échec à reprendre)."}],["I22","2026-09-25",{"fr":"**Clos le 25/09 — tranché « interdire et contrôler » (décision de Xavier), le critère tenu.** La ligne `DOC-DEPLOY-1` ne porte plus l'écart ouvert : la note ⚠️ du §30 devient 🔵 « tranché le 25/09 », REGISTRE 0.45. **Le contrôle n'est pas celui que l'item proposait** : une version sans fichier au dépôt n'aurait rien vu, puisque le fichier de l'écart du 07/09 y était, sous la version inscrite. La signature retenue est `supabase_migrations.schema_migrations.created_by` — un auteur quand la migration passe par l'API de gestion (MCP, tableau de bord), rien quand c'est la CI : lu sur les 335 versions de la production le 25/09, et **confirmé par la migration du contrôle elle-même**, appliquée par la CI sans auteur. Migration `20260925082749` (`d4fa5152`) : `fn_healthcheck_deploiement()` ouvre l'incident `deploiement` sur toute version signée absente de `deploiement_ecarts_acquittes`, qui ne se remplit **que par une migration versée au dépôt** — l'acquittement passe lui-même par la CI. Le bilan ne porte jamais l'auteur. **Treize écarts antérieurs acquittés nommément**, chacun avec le commit qui le trace, **dont deux jamais tracés** (`20260922185953` le 22/09, `20260924180538` le 24/09 ; fichiers au dépôt sous la même version) ; 44 d'avant le 20/08 en bloc. Suite `deploiement_tests` (9 cas, dont le bilan sans auteur) ; garde vitest `health-probe-kinds-check` : tout kind inséré par health-probe doit figurer dans la dernière CHECK (éprouvée rouge). **En production le 25/09** : 336 migrations, contrôle `actif` et vert, 57 écarts acquittés, sonde fermée à anon et authenticated, et health-probe l'a lue au tour de 08 h 50 UTC (`\"deploiement\": true`). Angle mort dit au registre : une `db push` lancée à la main depuis un poste.","pt":"**Fechado em 25/09 — decidido « proibir e controlar » (decisão de Xavier).** A nota ⚠️ do §30 passa a 🔵, REGISTRE 0.45. A assinatura é `schema_migrations.created_by` (autor quando passa pela API de gestão, nulo pela CI — confirmado pela própria migração do controle). Migração `20260925082749`: `fn_healthcheck_deploiement()` abre o incidente `deploiement` para toda versão assinada não quitada; a quitação só se faz por migração no repositório. Treze desvios anteriores quitados nominalmente, **dois nunca rastreados** (22/09 e 24/09). Suite `deploiement_tests` (9), guarda vitest. Em produção: controle ativo e verde, 57 quitados, health-probe leu a sonda às 08h50 UTC."}],["J2","2026-09-25",{"fr":"**Clos le 25/09, les deux critères tenus.** *(1)* Le tableau de `INDEX.md` court sans trou du v8 au v34 : 36 lignes pour les 36 fichiers d'`archive/`, plus la version courante (relu le 25/09). *(2)* **`DOC-ARCH-1`** au REGISTRE (0.45, décision de Xavier : « ne rien renommer, écrire la règle ») : le préfixe `-archive-` marque les neuf fichiers des lignées d'avant la fusion du 20/05, dont les numéros (v8, v10 à v15) ont été repris par la lignée unifiée — c'est lui qui les distingue ; toute version archivée depuis garde son nom d'origine, le dossier suffit et les liens restent valides. La note de l'INDEX le dit et renvoie au registre. L'en-tête de l'INDEX date désormais son « 90 items » (« à l'écriture ») au lieu de dériver.","pt":"**Fechado em 25/09.** *(1)* A tabela do `INDEX.md` vai do v8 ao v34 sem buraco. *(2)* **`DOC-ARCH-1`** no REGISTRO (0.45, decisão de Xavier: não renomear nada, escrever a regra): o prefixo `-archive-` marca os nove arquivos anteriores à fusão de 20/05; depois, o nome de origem e a pasta bastam."}],["H13","2026-09-25",{"fr":"**Clos le 25/09, le critère tenu.** Les deux fichiers sont au dépôt (`e0fbb024`), dans `docs/journal/ficedl/` : ceux du 09/09 emportés à Bologne — 28 descripteurs, deux schémas en nœuds anonymes, URI `?motNN`, `broader` « généralités » confirmés, « art : courants » en `skos:Collection` provisoire —, sha256 vérifiés contre les trois copies du disque E: (le disque F: de la mémoire n'était pas branché). **Régénérables par une commande documentée** dans le README du dossier : `node scripts/ficedl_thesaurus_esquisse.mjs docs/journal/ficedl/ficedl_thesaurus_2026-09-03.json docs/journal/ficedl` — copie du `build_esquisse.mjs` du paquet hors ligne, sortie **identique octet pour octet** sur l'aspiration du 03/09 (identique elle aussi à celle du paquet). Le CSV (CRLF + BOM) est sorti de la conversion des fins de ligne pour le rester après un clone ; la garde vitest `ficedl-esquisse-regenerable` régénère et compare à chaque CI. La note du 28/08 est versée à côté, avec les trois points où elle est dépassée (26 descripteurs, un seul vocabulaire, `/id/motNN`).","pt":"**Fechado em 25/09.** Os dois arquivos no repositório (`docs/journal/ficedl/`, os de 09/09 levados a Bolonha, sha256 verificados), regeneráveis por um comando documentado no README — saída idêntica byte a byte; o CSV fica fora da conversão de fins de linha; guarda vitest que regenera e compara. A nota de 28/08 ao lado, com os três pontos superados."}],["H9","2026-09-25",{"fr":"**Clos le 25/09 au soir, les trois critères tenus.** Livré par `f67ff3d9` (migration `20260925084523`) : la RPC accepte les cinq relations, `skosExport.js` passe par la table `SKOS_MATCH` et ne publie plus rien par défaut, la page-sujet et l'éditeur de la coordination lisent `ficedlMatch.js` — l'éditeur n'offrait jusque-là **aucun** choix de relation —, cinq clés dans les dix locales (en de/nl, « close » ne porte plus le mot de « related »). *(1)* **Xavier a posé depuis l'écran** (capture du 25/09, 21 h 17) un alignement « plus large » : Anarchosyndicalisme (sujet 17) → `mot286` « syndicalisme révolutionnaire », lu en base (`match_type = broad`, 19:17 UTC) ; la page publique `/thesaurus/anarcossindicalismo` l'affiche « PLUS LARGE » à côté de l'« EXACT » de `mot272` (lu dans le navigateur) ; l'export réel `api.thesaurus_export_v1`, appelé en anonyme, passé dans le `skosExport.js` livré, sort `skos:broadMatch <…?mot286>` en Turtle comme en JSON-LD. *(2)* `npm test` vert : 878 tests, dont `skos-relations-h9` (15). *(3)* Le 4.2 de `20260907172508` est inversé dans `20260925084523` le même jour, et annoté là-bas. Suite SQL `alignement_ficedl_relations_tests` (6). Ouvre **H10**.","pt":"**Fechado em 25/09 à noite, os três critérios cumpridos.** Entregue por `f67ff3d9`. *(1)* Xavier pôs pela tela um alinhamento « mais amplo » (Anarcossindicalismo → `mot286`), lido na base, exibido « MAIS AMPLO » na página pública e exportado em `skos:broadMatch` (Turtle e JSON-LD, export real em anônimo). *(2)* `npm test` verde (878). *(3)* Bloco 4.2 invertido no mesmo dia."}],["H10","2026-09-26",{"fr":"**Clos le 26/09, les deux critères tenus.** Relevé du matin : 99 liens (44 `exact`, 54 `close`, 1 `broad` posé à l'écran le 25/09), aucun vers la facette `dates`. **Relecture ligne à ligne** (`CONV-EXEC-3`) consignée dans `docs/journal/arbitrages/RELECTURE_alignements_ficedl_2026-09-26.md`, **fiche validée en bloc par Xavier le 26/09**. *(1) Chaque lien porte une relation choisie* : sur les 54 `close`, 19 deviennent « plus large », 21 « plus étroit » (les rubriques composites de Solidaires), 5 « associé », 9 sont confirmés ; sur les 44 `exact`, 6 étaient trop affirmés (3 « plus large » — le descripteur couvre les deux faces, 3 « proche » — une révolution n'est pas une période), 38 sont confirmés nommément dans la fiche. *(2)* **Huit alignements vers la facette `dates`** (Commune ×2 → 1871, Mai-Juin 1936 → 1936, Mai 68 → 1968, révolution russe ×2 → 1917, révolution allemande → 1918 et 1919 — 1789 et 1848 n'existent pas dans la facette, qui commence en 1868), plus trois meilleures cibles trouvées en chemin (Proche et Moyen-Orient, Allemagne 1917-1921, conseils ouvriers). Migration `20260926182521` (`e38f7310`) : clé (slug, `mot_id`), un lien n'est changé que s'il porte encore la relation relevée, vérification des 71 décisions une à une. **Éprouvée avant de pousser** : en lecture seule contre la prod (71/71 visent juste, 0 écart d'état), sur copie jetable du banc (71 tenues, idempotente, refuse un lien modifié entre-temps en le nommant). **En production le 26/09** : migration appliquée par la CI (338 migrations, sans auteur, sonde de déploiement verte), **110 liens — 38 exact, 14 close, 26 broad, 22 narrow, 10 related**, exactement la répartition attendue par la fiche ; **8 vers la facette dates** ; l'export anonyme réel, passé dans `skosExport.js`, sort par exemple Commune de Paris en `skos:broadMatch` vers 1871 et la révolution russe en `skos:closeMatch` vers 1917-1921 et `skos:relatedMatch` vers 1917.","pt":"**Fechado em 26/09, os dois critérios cumpridos.** Releitura linha a linha dos 99 vínculos (`CONV-EXEC-3`), ficha validada em bloco por Xavier e registrada em `docs/journal/arbitrages/RELECTURE_alignements_ficedl_2026-09-26.md`: dos 54 `close`, 19 viram « mais amplo », 21 « mais restrito », 5 « relacionado », 9 confirmados; 6 `exact` exagerados corrigidos, 38 confirmados. **Oito alinhamentos para a faceta `dates`** e três alvos melhores. Migração `20260926182521`, verificada decisão por decisão; testada antes do push (leitura em produção, cópia descartável)."}],["H14","2026-09-26",{"fr":"**Clos le 26/09 au soir, les deux critères tenus.** *(1)* PMB 8.1.1.1 (archive officielle, somme SHA256 vérifiée) tourne sur le poste en deux conteneurs (projet compose `pmb-banc`, PHP 8.3 + Apache, MariaDB 10.11 réglée selon les pré-requis PMB 8.1), recette **sans clic** au dépôt sous `tests/pmb/banc` : installation par POST vers `install_rep.php` (sa branche « base existante » — le mode création fabrique `bibli@localhost`, injoignable d'un autre conteneur), montée du schéma v5.34 → v6.03, **export** et **import** pilotés par HTTP (`exporter-pmb.mjs`, `importer-pmb.mjs`) — commits `d8695a68`, `5bfa50ff`. *(2)* Fixtures **exportées par PMB lui-même** sous `tests/pmb/fixtures` : le jeu de test PMB (50 notices, 33 exemplaires 995) en UNIMARC ISO 2709, en XML MARC et dans le XML propre à PMB ; 14 **cas difficiles** (zine, grec, cyrillique, arabe, chinois, collectivité, congrès, rôles, tomes, trois exemplaires, périodique et article, 606 à subdivisions) importés dans PMB puis réexportés. **Latin-1 : pas par PMB** — PMB 8.1 n'installe qu'en UTF-8 (`install_rep.php` force `utf-8`) ; la variante latin-1 est transcodée par `yaz-marcdump` (longueurs ISO 2709 recalculées), et le dit. Ce que PMB perd en réimportant (`func_bdp`) est consigné dans `tests/pmb/README.md` pour **H24**/**H27**.","pt":"**Fechado em 26/09 à noite, os dois critérios cumpridos.** *(1)* PMB 8.1.1.1 (arquivo oficial, SHA256 verificado) roda na máquina em dois contêineres, receita **sem cliques** no repositório (`tests/pmb/banc`): instalação, atualização do esquema, **exportação** e **importação** por HTTP. *(2)* Fixtures **exportadas pelo próprio PMB** (`tests/pmb/fixtures`): o jogo de teste do PMB (50 registros, 33 exemplares) em ISO 2709, XML MARC e XML próprio do PMB, e 14 **casos difíceis** passados pelo PMB. Latin-1: não pelo PMB (o 8.1 só instala em UTF-8) — variante transcodificada por `yaz-marcdump`, dito. O que o PMB perde ao reimportar está em `tests/pmb/README.md` (**H24**/**H27**)."}],["C8","2026-09-26",{"fr":"**Clos le 26/09, les deux critères tenus** (demande de Xavier : « compléter l'ensemble des fiches auteurs », carte blanche sur la méthode). Deux phases, chacune par une migration de données passée par la CI : **Wikidata** (`20260926193111`, `b418e149`) — 607 fiches ; **Library of Congress** (`20260926200208`, `abaa4755`) — 288 fiches liées, 90 complétées. Règles et échantillons dans `docs/journal/operations/enrichissement-autorites-2026-09-26/` (README + `decisions.csv`, `decisions-lc.csv`) : nom identique ET aucune contradiction ET dates concordantes ou deux signaux indépendants (Wikidata), titre de l'auteur au catalogue cité dans la notice ou dates concordantes (LC) ; justesse mesurée sur échantillon aléatoire : 60/60. On ne remplit que le vide, trace par fiche dans `external_ids` (`wikidata_releve`, `lc_releve`). *(1) Couverture en identifiants externes* (Wikidata, VIAF, ISNI ou LC), mesurée en production le 26/09 : **51 %** de toutes les autorités, **78 %** de celles à trois livres ou plus, **86 %** à cinq, **96 %** à dix — le seuil de 20 % est dépassé partout. *(2) Aucun pseudonyme militant remplacé par un nom civil* : aucune forme de nom n'est touchée (forme retenue, forme de tri, variantes) — par construction, et c'est la garde de la migration (id ET forme retenue du relevé). Au passage, la langue d'écriture a reçu sa colonne (`writing_language`, `20260926191225`, `6bcb3fa5`) : 503 fiches renseignées. **En production le 26/09** : 344 migrations, sonde de déploiement verte ; 614 fiches liées à Wikidata, 288 à la LC ; restent 716 fiches sans année de naissance. Les formes variantes (troisième constat de la fiche) n'ont pas été enrichies : Wikidata en porte, mais une variante mal choisie brouille la recherche — à faire à la main si le besoin se montre. **29/09** — Ce qui n'a pas été écrit reste à relire à la main, cas par cas, dans `decisions.csv` (Wikidata : 96 homonymes ambigus, 70 contradictions avec la fiche, 88 fiches à un seul signal, 39 non corroborées) et `decisions-lc.csv` (LC : 27 contradictions, 345 homonymes sans titre commun) ; la phase IdRef du 27/09 (C4) laisse `decisions-idref.csv` (50 contradictions, 173 non corroborées). Une valeur douteuse est en base : E. M. Cioran, `writing_language = 'ro'` (posée par `20260926193111` ; langue maternelle, il écrit en français après 1949), qu'aucune migration ne corrige — à reprendre à la main.","pt":"**Fechado em 26/09, os dois critérios cumpridos.** Duas fases por migração de dados via CI: Wikidata (607 fichas) e Library of Congress (288 ligadas, 90 completadas); regras, amostras e planilhas em `docs/journal/operations/enrichissement-autorites-2026-09-26/`; precisão medida numa amostra aleatória: 60/60. Só se preenche o vazio, com rastro por ficha. (1) Cobertura em identificadores externos: 51 % de todas as autoridades, 78 % das com três livros ou mais, 96 % das com dez. (2) Nenhuma forma de nome tocada. A língua de escrita ganhou sua coluna (503 fichas). **29/09** — O que não foi escrito fica para revisão manual, caso a caso, em `decisions.csv` (Wikidata: 96 homônimos ambíguos, 70 contradições, 88 com um só sinal, 39 não corroboradas), `decisions-lc.csv` (LC: 27 contradições) e `decisions-idref.csv` (IdRef, C4: 50 contradições, 173 não corroboradas). Um valor duvidoso está na base: E. M. Cioran, `writing_language = 'ro'` (`20260926193111`; ele escreve em francês depois de 1949), a corrigir à mão."}],["C11","2026-09-27",{"fr":"**Clos le 27/09 — critères 1 et 3 tenus sur pièces, le 2 laissé en pratique continue (décision de Xavier).** Relevé du matin, par les fonctions mêmes de l'assistant : 9 groupes de tomes, 90 paires d'œuvres scindées, 10 paires « à décider », 175 notices MLEG sans matière. Fiche de propositions validée en bloc par Xavier (`docs/journal/arbitrages/ARBITRAGE_file_opac_par_oeuvre_2026-09-27.md`). **Partage des gestes** : une première migration qui appliquait tout sous l'identité de Xavier a été refusée par le garde-fou de l'environnement — un verdict ne porte le nom de quelqu'un que s'il l'a posé ; les fusions et réunions de tomes ont donc été faites par Xavier dans l'assistant (plusieurs décisions divergent de la fiche, elles font foi et sont écrites au journal), le reste par deux migrations en leur propre nom : `20260927112143`, `ee07f79c` (*O Capital* écarté des tomes ; les six volumes thématiques de *O Homem e a Terra* réunis, le thème en volume ; une matière existante pour six catégories MLEG, deux en note seule — THES-4) et `20260927114232`, `6f4d7b89` (sept familles de tomes réunies en volumes sur décision de Xavier ; Peirats rendu à la file en alignant l'éditeur, la fusion des œuvres l'ayant masqué). Deux constats faux corrigés en route, au journal (`ccc4c4f9`) : la paire 1510/1511 ne quittait pas « À décider » d'elle-même, et le renommage d'une œuvre fait surgir des paires neuves (*Textos escolhidos*, un troisième *Living my Life*) — tranchées par Xavier. *(1)* **Mesuré en production le 27/09 : « Volumes » 0, « Œuvres scindées » 0, « À décider » 0.** *(3)* Les 175 notices MLEG ont chacune une décision écrite : matière posée (140) ou note conservée par choix (35, *Transversais* et *Ciências Humanas*) ; aucune matière créée. *(2)* Non mesurable — rien n'enregistre qu'une œuvre a été ouverte ; les titres automatiques sont passés de 1 452 à 1 676 (187 œuvres), les regroupements ayant créé ou renommé des œuvres que la pré-traduction a complétées. Leur relecture reste une pratique continue, par la file des titres de l'Atelier : décision de Xavier, le 27/09.","pt":"**Fechado em 27/09 — critérios 1 e 3 cumpridos, o 2 fica como prática contínua (decisão de Xavier).** Ficha validada em bloco; fusões e reuniões de tomos feitas por Xavier no assistente (a migração que agia em seu nome foi recusada, com razão); o resto por duas migrações em nome próprio (`20260927112143` e `ee07f79c`; `20260927114232` e `6f4d7b89`): O Capital, O Homem e a Terra em seis volumes, sete famílias de tomos reunidas, Peirats devolvido à fila, matérias MLEG. Em produção: as três abas vazias; 175 notas MLEG com decisão escrita. Critério 2 não mensurável: 1 676 títulos automáticos, revisão contínua pela fila do Ateliê."}],["C7","2026-09-27",{"fr":"**Clos le 27/09 — critères 1 et 2 tenus sur pièces, le 3 levé par décision de Xavier.** 1 317 notices sans sujet lues une à une (88 % : import Zotero de la BTL, titre seul) ; 851 propositions dans le vocabulaire existant, fiche `docs/journal/arbitrages/C7_propositions_matieres_2026-09-27.md` validée A + B par Xavier ; migration de données `20260927124038` appliquée par la CI : +851 notices, +1 180 affectations, 89 matières avant comme après (THES-4). *(1)* **Mesuré en anonyme : 2 167 / 2 633 notices indexées, 82,3 %** (50,0 % le matin). *(2)* `pierre-joseph-proudhon` n'existe plus ; `anarcocomunismo` actif, « Communisme libertaire », `broad` → « anarchisme », 3 notices. *(3)* Sept des huit sujets sont rattachés à un terme FICEDL plus large, `abolicionismo-penal` est `related` → « prison » (H10). Les porter à la fédération n'est plus demandé : **décision de Xavier, le 27/09, « si ça ne crée pas de fork »** — et il n'y en a pas, mesuré le jour même : la copie du thésaurus compte 621 termes, tous moissonnés à la source le 03/09, aucun terme ajouté localement ni ressemblant aux huit, aucun lien `exact` vers eux ; les huit vivent dans le vocabulaire AnarBib et ne touchent la FICEDL que par des liens SKOS. Restent 466 notices hors vocabulaire (littérature générale, philosophie, sciences sociales, esperanto, spiritualité, histoire du Brésil) : l'étendre serait un autre item. **05/10, inventaire** — les notices hors vocabulaire ont leur item : C27.","pt":"**Fechado em 27/09 — critérios 1 e 2 cumpridos, o 3 dispensado por decisão de Xavier.** 851 registros indexados pelo vocabulário existente (ficha validada A + B, migração `20260927124038` pela CI): cobertura pública medida como anônimo 2 167 / 2 633 = 82,3 %. `pierre-joseph-proudhon` suprimido, `anarcocomunismo` verificado. Levar os oito assuntos à FICEDL deixa de ser pedido (decisão de Xavier, «se não criar fork»): não há fork — a cópia do tesauro tem 621 termos, todos colhidos na fonte em 03/09, nenhum acrescentado localmente, nenhum vínculo `exact` para os oito. 466 registros ficam fora do vocabulário. **05/10, inventário** — as notícias fora do vocabulário têm seu item: C27."}],["C6","2026-09-27",{"fr":"**Clos le 27/09 — vérifié à l'écran par Xavier, connecté (« vérifié, fonctionnel »).** Les trois assistances de la spec des conventions (§7) livrées le même jour. *§7.2* bouton « Normaliser la casse » sous le titre de la notice (`b9177403`) ; **sur remarque de Xavier** (« lE tRuc qui FAIT cHIER », bouton grisé : la première version n'abaissait que les mots-outils), il applique depuis `1782dfcb` la casse de la langue selon §4.1 — casse de phrase pt/es/fr/it/ca/eo/nl/el, title case en anglais, mots-outils seuls en allemand, sigles et chiffres romains figés, aperçu où chaque mot se clique pour les noms propres. *§7.1* assistant du point d'accès sous le nom d'une personne (`0c3bb62f` : Confirmer, Corriger mot par mot, Nom unique ; variante hispanique seulement offerte) et, **à la demande de Xavier**, la même normalisation de casse pour le nom (`8c73b850`, CONV-1 : « osvaldo BAYER » → « Osvaldo Bayer », particules, initiales, rangs, noms composés et élidés). *§7.3* cron du lundi `anarbib-conv-file-alimenter` (`7eb72630`) qui passe les cinq semeurs de la file de vérification, bac à sable de formation exclu ; premier passage en production : 4 lignes. Critères : (1) trois dispositifs, aucun bloquant ; (2) chaque proposition refusable, original conservé (aperçus, annuler après coup, la file s'écarte) ; (3) libellés dans les dix locales. Limites laissées : le lot « titre_casse » de l'Atelier (171 titres) propose encore l'ancienne forme (mots-outils seuls) ; la casse des collectivités n'a pas d'outil ; `name_lang` (CONV-6) n'est pas au formulaire. **Les trois limites traitées le soir même, à la demande de Xavier.** (a) Un dictionnaire des noms propres attestés (`src/lib/nomsPropres.js`, 1 378 mots et 719 phrases, engendré par `scripts/noms-propres-attestes.mjs` depuis le catalogue, les patronymes, les pays et les collectivités ; mots communs écartés) : le bouton ne les abaisse plus ; la règle a son miroir SQL `fn_conv_casse_titre` (`20260927154351`, parité 26/26 au banc et 173/173 sur les titres réels, par empreinte) qui fait la proposition du lot « titre_casse » ; les 171 propositions en attente refaites (`20260927163827`, fiche `C6_propositions_casse_file_titres_2026-09-27.md` vue par Xavier), 0 écart en production. (b) `name_lang` se saisit (`20260927160008`, datée après B29 qu'elle prolonge) et pilote la découpe (it/af/en particule gardée, fr article, es deux noms). (c) La casse des collectivités (`d421774d`) : mots principaux, français en casse de phrase, sigles de toute longueur gardés.","pt":"**Fechado em 27/09 — verificado na tela por Xavier, conectado.** As três assistências da spec das convenções (§7): botão «Normalizar maiúsculas» do título, corrigido por observação de Xavier para aplicar a caixa da língua (§4.1, `1782dfcb`); assistente do ponto de acesso e normalização da caixa do nome de pessoa (`0c3bb62f`, `8c73b850`); cron semanal que alimenta a fila de verificação (`7eb72630`). Limites: o lote «titre_casse» ainda propõe a forma antiga; coletividades sem ferramenta de caixa; `name_lang` fora do formulário. **As três limitações tratadas na mesma noite:** dicionário de nomes próprios atestados + espelho SQL (171 propostas da fila refeitas, 0 divergência); `name_lang` no formulário e na separação do nome; caixa dos nomes de coletividades."}],["B10","2026-09-27",{"fr":"**Clos le 27/09 au soir, sur pièces : les trois critères tenus, et trois gardes pour qu'ils le restent.** *(1) Policies* — les avis `multiple_permissive_policies` sont résorbés (**25 → 0**, avis relu en production le 27/09). Une permissive par (rôle, commande) sur les 25 tables (`20260927180000`), puis chaque OU ordonné : ce qui ne dépend pas de la ligne d'abord, la lecture publique ensuite, le staff ligne à ligne en dernier (`20260927180030`). Rien n'a changé de qui voit quoi : empreinte md5 des clés visibles, pour `anon` et chacun des 20 comptes réels, **identique sur les 25 tables** avant, après la passe 1 et après la passe 1 bis. Et l'ordre paie : `count(*)` sur `books` sous un compte lecteur **208 → 90 ms**, bibliothécaire 209 → 89 ms, admin réseau **39 → 1,4 ms** ; `exemplares` 177 → 100 ms (lecteur), 40 → 0,9 ms (admin) ; anonyme inchangé. Garde : `policies_permissives_uniques_tests` (33 tests : aucune paire dans aucun schéma, liste fermée vide ; la lecture publique, désormais en deux copies, doit rester identique ; trente lectures et écritures réelles). *(2) Clés étrangères* — **21 indexées** (`20260927180100`) : toutes celles dont le parent est supprimé en exploitation — du 02/09 au 27/09, 146 œuvres, 37 autorités, 21 notices et 2 comptes supprimés, et chaque brouillon purgé coûtait deux parcours complets de la plus grosse table d'import. La liste assumée de B21 passe de **38 à 17**, règle écrite en tête (codes `catalog_ref_*`, bibliothèques, partenaires : des parents qui ne se suppriment pas). *(3) Index* — **22 retirés, raison écrite pour chacun** : 10 redondants jamais empruntés (`20260927180200`) et 12 sans aucun lecteur sur le chemin d'écriture (`20260927180300` : 6 sur `books`, qui en portait 27, 4 sur `book_drafts`, les 3,5 Mo de `idx_shp_endpoint`, un doublon ; son premier essai, tombé dans le `pg_dump` de la sauvegarde hebdomadaire, a été annulé sans rien appliquer et rejoué au run suivant). Garde : `index_redondants_garde_tests` (plus de nouveau redondant ; les 22 redondants empruntés, nommés avec leurs compteurs, se retirent sur mesure). Les 108 index sans lecteur restants sont inventoriés un par un, avec origine et verdict (`docs/journal/audits/AUDIT_performance_B10_2026-09-27.md`). Nés des constats : **B31** (trois lectures anonymes lèvent une erreur au lieu de rendre zéro ligne), **B32** (le catalogue public relit toute sa vue matérialisée à chaque page, et calcule la visibilité ligne à ligne), **B33** (la recherche ne peut emprunter aucun de ses index trigramme), **B34** (l'effacement de compte ne traite pas le journal du catalogue), **I28** (le hook `pre-commit` ne tourne pas dans les worktrees WSL). **Écart tracé** : les cinq migrations enfreignent `DOC-DEPLOY-4` (heure ronde, datées dans le futur), sans collision ni effet d'ordre — audit §7.","pt":"**Fechado em 27/09 à noite, com provas: os três critérios cumpridos, e três guardas para mantê-los.** (1) Os avisos `multiple_permissive_policies` foram resolvidos (25 → 0): uma permissiva por (papel, comando) nas 25 tabelas, com o OU ordenado — primeiro o que não depende da linha, depois a leitura pública, depois o staff linha a linha. A impressão digital das linhas visíveis para anon e para cada uma das 20 contas reais é idêntica nas 25 tabelas antes e depois; `count(*)` em `books` sob leitor 208 → 90 ms, admin 39 → 1,4 ms. Guarda: `policies_permissives_uniques_tests` (33 testes). (2) 21 chaves estrangeiras indexadas — as de pais realmente excluídos em operação; a lista assumida do B21 passa de 38 a 17, com a regra escrita. (3) 22 índices retirados com o motivo escrito (10 redundantes nunca usados, 12 sem leitor no caminho de escrita); guarda `index_redondants_garde_tests`. Os 108 índices sem leitor restantes estão inventariados na auditoria. Novos itens: B31, B32, B33, B34, I28. Desvio registrado a `DOC-DEPLOY-4` (auditoria §7)."}],["D7","2026-09-27",{"fr":"**Clos le 27/09 : décision écrite au REGISTRE (section `ARCH`), avec sa raison** — son seul critère. **Décidé par Xavier** : un **modèle archivistique complet dans AnarBib** (niveaux ISAD(G) fonds, sous-fonds, série, sous-série, dossier, pièce ; producteurs en autorités ISAAR(CPF) ; export EAD dès la première version — `ARCH-1`), un **niveau de description variable selon le fonds** (`ARCH-2`), des **conditions d'accès par niveau dès la première version** (`ARCH-3`), présentés pour avis à DIRA, au CIRA et au FICEDL avant tout code (`ARCH-4`). Réalisation : **D8**.","pt":"**Fechado em 27/09: decisão escrita no REGISTRO (seção `ARCH`), com a sua razão.** **Decidido por Xavier**: um modelo arquivístico completo no AnarBib (níveis ISAD(G), produtores em autoridades ISAAR(CPF), exportação EAD desde a primeira versão), nível de descrição variável segundo o fundo, condições de acesso por nível desde a primeira versão; apresentado para parecer a DIRA, CIRA e FICEDL antes de qualquer código. Realização: **D8**."}],["I3","2026-09-27",{"fr":"**Clos le 27/09 — les quatre tests passent, et trois de plus.** Le routeur `supabase/functions/main/index.ts` lancé seul dans `supabase/edge-runtime:v1.74.0` (la version de `deploy/.env.example`), fonctions et `config.toml` montés comme dans `deploy/compose.yml`, secret JWT tiré au hasard pour l'essai : il démarre (40 fonctions dispensées, 54 montées, aucune dispense orpheline) et décide juste — nom inexistant 404, fonction protégée sans jeton 401, avec un jeton valide la fonction s'exécute (405, sa propre réponse à un GET), jeton signé d'un autre secret 401, jeton expiré 401, chemin sans `/functions/v1` 401 ; une fonction dispensée (`health-probe`) n'est pas bloquée, son travailleur est lancé — il échoue ensuite (500, « supabaseKey is required ») faute de base et de secrets dans le conteneur isolé : **répondre 200 relève de la répétition complète, I21**. *Critère 2* : les 14 fonctions qui exigent un jeton (`attach-received-asset`, `audio_fingerprint_lookup`, `authority_lookup`, `author_portrait_lookup`, `catalog_metadata_lookup`, `cover_lookup`, `deposit-fonds-direct`, `export-catalog-lote`, `export-fonds-bundle`, `geocode`, `mail-i18n-test`, `notify-library-invitation`, `probe-partner-catalog`, `revoke-digital-asset`) sont toutes appelées par l'application avec une session ou, pour `geocode`, le jeton anonyme de la pile auto-hébergée : voulu. L'essai est au dépôt, rejouable : `deploy/scripts/essai-routeur-main.sh` (docker, openssl, curl ; 7/7).","pt":"**Fechado em 27/09 — os quatro testes passam, e mais três.** O roteador `main` lançado sozinho em `edge-runtime` v1.74.0 com segredo de teste: 404 para nome inexistente, 401 sem token, com token inválido ou expirado, a função protegida executa com token válido, a dispensada não é bloqueada (responder 200 exige a pilha completa, I21). As 14 funções que exigem token são chamadas pelo app com sessão: comportamento desejado. Teste reproduzível: `deploy/scripts/essai-routeur-main.sh`."}],["C9","2026-09-27",{"fr":"**Clos le 27/09 — le travail de main qui restait est fait, sur pièces.** *O5/O6* livrés le 03/09 (déjà écrit à la fiche). *O2* : mesuré le 27/09, plus aucune collectivité « à revoir » dans la file (les deux ont été tranchées entre-temps). *O8* : le verdict « pas de scission avant la quatrième » étant dépassé (douze fiches doubles au 03/09), une fiche « qui devient quoi » (`docs/journal/arbitrages/C9_scissions_des_fiches_a_plusieurs_personnes_2026-09-27.md`) a été **validée par Xavier** (« tout, sauf 4955 »), avec, sur sa parole, « Sorel, G. » réuni à « Sorel, Georges ». Migration `20260927193940` (`1948b78d`), en son propre nom, appliquée par la CI : **dix fiches scindées** — six personnes reliées à leur fiche existante (Gurucharri, Ibáñez, Philopat, Biehl, Bookchin, Sacchetti), deux fiches doubles fusionnées puis supprimées, dix fiches créées —, rôle organizador pour les deux ouvrages « (orgs.) » ; Ludmila et Silvério sans « (et al.) » ni capitales ; Noir et Rouge en collectivité ; **trois fusions** au journal (`merged_by` nul, motif écrit). Recherche demandée par Xavier des « Prénom Nom & Prénom Nom » : aucune autre fiche publiée, mais **dix brouillons** (lots 8 et 63) qui en auraient créé à la publication — ils portent désormais une contribution par personne (25), reliée à l'autorité existante quand il y en a une. Vérifié en production le soir même.","pt":"**Fechado em 27/09 — o trabalho manual restante feito.** O2: nenhuma coletividade «a rever». O8: ficha de separação validada por Xavier; migração `20260927193940` (`1948b78d`) pela CI: dez fichas separadas (seis pessoas ligadas à ficha existente, duas fichas duplas fundidas, dez criadas), três correções, «Sorel, G.» fundida em «Sorel, Georges», e dez rascunhos (lotes 8 e 63) com uma contribuição por pessoa. Verificado em produção."}],["B35","2026-09-28",{"fr":"**Clos le 28/09 — par le schéma `private`, sur pièces.** Ouvert le matin même comme « différé » : la voie de l'item (borner la réponse au périmètre de l'appelant·e, version interne) coûtait quinze appelants et quatre politiques à raisonner un par un. Vérifié entre-temps : PostgREST n'expose que `public, graphql_public, api, ingest` (PGRST106 sur `private`). Les deux aides ont donc changé de schéma (migration `20260928105437`, commit `6721277b`, déployée par la CI le 28/09 à 11 h 12 UTC) : recréées dans `private` depuis leur définition réelle, les quinze appelants et les quatre politiques re-pointés sur leur définition réelle, les versions `public` supprimées ; `authenticated` garde EXECUTE pour les politiques et les déclencheurs, mais aucune porte RPC ne les sert plus — l'oracle est fermé sans qu'un corps change. Garde dans la migration (deux camps, plus aucun appelant, politique ni vue vers `public`), T32 de `brouillons_par_bibliotheque_tests` en continu (T30/T31 re-pointés), mutants éprouvés (sans re-pointage, sans ALTER POLICY, sans GRANT, sans REVOKE PUBLIC, appelant nu apparu). En prod après déploiement : les deux fonctions absentes de `public`, présentes dans `private`, lint 0029 à 441. Décision de Xavier du 28/09 (« fais-le par le schéma private »).","pt":"**Fechado em 28/09 — pelo esquema `private`, com provas.** Aberto na mesma manhã como «adiado»: o caminho do item (limitar a resposta ao perímetro de quem chama, versão interna) custava quinze chamadores e quatro políticas a raciocinar um a um. Verificado entretanto: o PostgREST só expõe `public, graphql_public, api, ingest` (PGRST106 em `private`). As duas ajudas mudaram de esquema (migração `20260928105437`, commit `6721277b`, implantada pela CI em 28/09 às 11 h 12 UTC): recriadas em `private` a partir da definição real, os quinze chamadores e as quatro políticas reapontados, as versões `public` removidas; `authenticated` mantém EXECUTE para as políticas e os gatilhos, mas nenhuma porta RPC as serve mais — o oráculo fechou sem que um corpo mudasse. Guarda na migração, T32 da suíte do B29 em contínuo, mutantes provados. Em produção após a implantação: as duas funções ausentes de `public`, presentes em `private`, lint 0029 em 441. Decisão de Xavier de 28/09."}],["B13","2026-09-28",{"fr":"Décision écrite au REGISTRE (`DOC-MIGR-2`, actée par Xavier) : on ne squashe pas. Faits recomptés : 384 migrations, 9,0 Mo (socle 2,4 Mo, données FICEDL 1,9 Mo), rejeu complet sur l'image Supabase en 2 min 17 s (run 1418), non 25 min. Un squash refait un `pg_dump` porteur du défaut `DOC-GRANT-2` ; chaque migration est une trace citée par version ; le coût dépasse le gain. Rouvrir si le rejeu passe dix minutes ou si un socle est à refaire (I2).","pt":"Decisão escrita no REGISTRO (`DOC-MIGR-2`, confirmada por Xavier): não se faz squash. Fatos recontados: 384 migrações, 9,0 MB, reexecução completa em 2 min 17 s (run 1418). Um squash refaz um `pg_dump` com o defeito `DOC-GRANT-2`; cada migração é um rastro citado por versão; o custo supera o ganho."}],["B31","2026-09-28",{"fr":"Livré par l'autre session le 27/09 (`507afb03`, migration `20260927184425`) : 13 relations pour `anon` et 10 pour un compte sans adhésion levaient 42501 ; toutes rendent zéro ligne. Vérifié en prod le 28/09 sous `anon` : les trois tables du constat rendent 0 ligne sans erreur, politiques SELECT `TO authenticated`. Suite `lecture_accordee_sans_erreur_tests` en CI. Clos par Xavier sur ces constats.","pt":"Entregue pela outra sessão em 27/09 (`507afb03`): 13 relações para `anon` e 10 para conta sem adesão levantavam 42501; todas devolvem zero linhas. Verificado em produção em 28/09 sob `anon`. Suíte `lecture_accordee_sans_erreur_tests` na CI. Fechado por Xavier."}],["B33","2026-09-28",{"fr":"Livré par l'autre session le 27/09 (`6bdd4331`, migrations `20260927193314`/`…315` ; T1 corrigé le 28/09, `8eaa180c`). Vérifié en prod le 28/09 : `search_catalog_v1` porte le motif regexp unique ; plan à l'appui — `BitmapOr` de six `Bitmap Index Scan` sur les deux index trigramme de `authors` (4,5 ms) ; `publishers_lower_name_idx` sert la publication ; cinq index sans lecteur retirés, raison écrite : `idx_publishers_name_trgm`, `idx_authors_external_ids`, `serials_issn_idx`, `serials_uniform_title_trgm`, `idx_books_autor_trgm` ; les trois derniers ne pouvaient servir aucune requête derrière une policy (LIKE, ILIKE, `~` et `%` ne sont pas leakproof). Réserve notée : l'appel complet sous `anon` reste à 183 ms, le temps est ailleurs que dans les branches trigramme. Clos par Xavier sur ces constats. **29/09** — Au passage, `6bdd4331` fait entrer les jetons échappés dans le motif de `api.search_catalog_v1` : en production, « c++ anarquia » ou « [anarquia » levaient 2201B à l'autocomplétion. Sur base synthétique (20 000 autorités, 20 003 notices), l'autocomplétion passe de 2 182 à 125 ms par appel. Garde : `recherche_index_trigramme_tests` (8).","pt":"Entregue pela outra sessão em 27/09 (`6bdd4331`). Verificado em produção em 28/09: `search_catalog_v1` traz o padrão único; plano — `BitmapOr` de seis `Bitmap Index Scan` nos dois índices trigram de `authors`; `publishers_lower_name_idx` serve a publicação; cinco índices sem leitor retirados (três não podiam servir consulta alguma atrás de uma policy: LIKE, ILIKE, `~` e `%` não são leakproof). Reserva: a chamada completa sob `anon` fica em 183 ms. Fechado por Xavier. **29/09** — De passagem, `6bdd4331` escapa os termos no padrão de `api.search_catalog_v1`: em produção, «c++ anarquia» ou «[anarquia» davam erro 2201B no autocompletar. Em base sintética, o autocompletar passa de 2 182 a 125 ms por chamada."}],["B34","2026-09-28",{"fr":"Livré par l'autre session le 27/09 (`df4dcec1`, migration `20260927184954`) : `fn_delete_my_account` re-pointe l'acteur de `catalog_audit_log` et les comptes des instantanés de brouillons. Vérifié en prod le 28/09 : le corps de la fonction traite le journal ; 1 750 lignes, un seul acteur (actif), aucun uuid orphelin. Suite `effacement_journal_catalogue_tests` en CI. Clos par Xavier sur ces constats.","pt":"Entregue pela outra sessão em 27/09 (`df4dcec1`): `fn_delete_my_account` repõe o ator de `catalog_audit_log` e as contas dos instantâneos. Verificado em produção em 28/09: 1 750 linhas, um só ator, nenhum uuid órfão. Suíte na CI. Fechado por Xavier."}],["I28","2026-09-28",{"fr":"**Clos le 28/09 : la CI tient les règles du hook, pour tout le monde, puisqu'elle tourne pour tout le monde.** `src/tests/doctrine-migrations-garde.test.js` (dans `npm test`, donc au job `app` de chaque push) : 10 tests — nom à 14 chiffres ; version unique (une collision, c'est une migration sautée sans erreur) ; pas d'heure ronde depuis le 31/08, hors une liste close des 15 déjà versées, dont la garde vérifie qu'elles existent ; pas de date dans le futur (dix minutes de tolérance) ; la doctrine SQL du hook sur toute migration depuis le 31/08 (DEFINER sans `SET search_path`, nouvelle DEFINER sans `REVOKE … FROM PUBLIC`, table sans RLS, vue sans `security_invoker`, table de `public` sans `GRANT`). Livré le 27/09 par `89a2b508`, juste avant B31 (`507afb03`) et B34 (`df4dcec1`). Éprouvé le jour même : relancée à chaque rebase sur les migrations des autres sessions (capas, B30, C9), et elle a arrêté un brouillon de B33 (un `CREATE FUNCTION` dans une migration qui citait « SECURITY DEFINER » sans `SET search_path`). Le second critère est rempli par le premier : la recette de worktree n'a plus besoin du hook.","pt":"**Fechado em 28/09: a CI aplica as regras do hook para todas as sessões.** `src/tests/doctrine-migrations-garde.test.js` (em `npm test`, job `app`): 10 testes — nome com 14 dígitos, versão única, sem hora redonda desde 31/08 (fora uma lista fechada de 15), sem data no futuro, e a doutrina SQL do hook. Entregue em 27/09 por `89a2b508`, logo antes de B31 (`507afb03`) e B34 (`df4dcec1`); já barrou um rascunho do B33."}],["B32","2026-09-28",{"fr":"**Clos le 28/09, sur pièces, à 100 000 notices synthétiques.** Trois migrations (`20260928122316`, `…17`, `…18`). *(b)* La visibilité par bibliothèque se calcule une fois par requête — `fn_visible_library_ids()` en InitPlan dans les 21 policies, la règle restant écrite dans `fn_library_visible_to_caller` : `count(*)` sur `books` sous anon 3,0 s → 52 ms, en session 29,8 s → 0,79 s ; visibilité identique (13 tables, 6 identités). *(a)* Les vues du catalogue lisent les vues matérialisées par deux vues `private` (plus d'enveloppe DEFINER par ligne), et les index sont enfin empruntés (`book_id` 2 193 parcours sur 24 requêtes réelles, `titulo`, `autor_trgm`, `ano`…). Devant la vraie vue, `catalog_works_v1` basculait en boucles imbriquées (1 ligne estimée pour 77 000 — des heures) : elle assemble son WHERE des filtres présents, lit `volume` par la vue, prend le titre de repli dans le catalogue qu'elle sert, matérialise `titres` et interdit les boucles imbriquées le temps de sa requête. Au passage, `catalog_search_ids_v1` rendait `LIMIT 500` sans ordre total : `book_id` départage. *(c)* `fn_locale_from_idioma` s'insère en ligne (plus de `SET`). Quarante parcours de l'OPAC identiques avant/après (md5 du JSON rendu). Mesures finales, anon : page par défaut 15,9 s → 1,8 s, tri auteur·rice 11,3 → 1,7 s, recherche 0,75 s, liste plate par titre 132 → 0,8 ms ; session : page par défaut 54,8 → 2,2 s. Index secondaires : tous gardés, raison écrite ; trois sans parcours (`autor_norm_trgm`, `library_slug`, `titulo_trgm`) à relire aux compteurs de production dans un mois. Le coût d'une page reste linéaire dans le nombre d'œuvres (total, tri global) : une vue par œuvre au-delà de 200 000 notices, ce n'est pas le problème d'aujourd'hui. Vérifié en production le 28/09 (déployé 14:05 UTC) : visibilité identique pour les 21 identités ; 39 parcours sur 40 identiques, le quarantième identique à ce que l'ancienne logique rend sur les mêmes données ; page par défaut anonyme 383 → 74 ms, recherche 335 → 49 ms, `count(*)` 87 → 4 ms, page en session 442 → 135 ms ; lint 0028 = 27, attendu. Audit : `journal/audits/AUDIT_catalogue_grande_echelle_B32_2026-09-28.md`. **Complété le 29/09.** Commits `46d10ed2` (b), `f4622aab` (a), `48267f27` (c) ; suite `catalogue_grande_echelle_tests` (T1-T9) ; banc versé : `scripts/loadtest/catalogue-synthetique.sql` et `catalogue-mesure.sql`. Exception assumée : `private.catalog_public_rows` et `private.catalog_network_rows` sont sans `security_invoker` (une vue matérialisée n'a pas de RLS ; nommées dans la garde T7 de `grants_herites_tests`, étendue à `private`). **Suite le soir même** : `api.catalog_facets_v1` assemble ses cinq prédicats selon les filtres présents (`cddc567b`, `20260928162102` ; 23 jeux de filtres au même md5 avant et après, en production comprise), puis sa recherche « q » devient celle de la page (`5f13ec86`, `20260928164227`, REGISTRE `OPAC-F2` : « memoria » comptait 9 éditions dans les facettes pour 52 à la page) ; `facettes_catalogue_tests` 18. Limite : les facettes restent celles du catalogue public. Audit §6 complété le 28/09 (`038efa8b`) : l'écart des relevés « nouveautés » tenait à l'œuvre 2037 éditée entre deux relevés, pas à un défaut d'agrégat de la vue matérialisée. La limite des facettes : item E29.","pt":"**Fechado em 28/09, com provas, a 100 000 registros sintéticos.** Três migrações (`20260928122316`, `…17`, `…18`). *(b)* A visibilidade por biblioteca é calculada uma vez por consulta (`fn_visible_library_ids()` em InitPlan nas 21 policies) : `count(*)` em `books` sob anon 3,0 s → 52 ms, em sessão 29,8 s → 0,79 s ; visibilidade idêntica (13 tabelas, 6 identidades). *(a)* As visões do catálogo leem as visões materia
