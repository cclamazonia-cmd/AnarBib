<style>
/* Identite AnarBib : fond bordeaux sombre, Bitter en labeur, Big Shoulders
   en titraille (la police de la brochure manifeste), rouge AnarBib reserve
   aux signaux semantiques. Concu en sombre d'abord ; la variante claire
   garde le meme biais bordeaux plutot qu'un gris neutre. */
:root{
  color-scheme:light dark;
  /* clair */
  --bg:#f6f1ef; --panel:#fffdfc; --ink:#1a1012; --mut:#6d5b58; --line:#e3d6d2;
  --rule:#cbb8b3; --accent:#a81c1c; --accent-soft:#f5e7e6; --chip:#ece1de;
  --p0:#a81c1c; --p1:#9a6410; --p2:#4d6136; --p3:#6d5b58;
  --sp:clamp(16px,3vw,22px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}}
:root[data-theme="dark"]{
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.62 Bitter,Georgia,"Times New Roman",serif;
  -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--sp) 96px}
header{padding:52px 0 20px;border-bottom:2px solid var(--rule);margin-bottom:0}
.eyebrow{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px}
h1{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:.005em;
  text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.sub{color:var(--ink);font-size:clamp(16px,2.1vw,19px);margin:0;max-width:60ch}
.mta{margin:14px 0 0;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:11px 0;margin:0 0 8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--mut);border:1px solid var(--line);
  border-radius:2px;padding:4px 11px;cursor:pointer;line-height:1.4}
button:hover{color:var(--ink);border-color:var(--rule)}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
input[type=search]{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--line);
  border-radius:2px;background:var(--panel);color:var(--ink);min-width:170px;flex:1 1 170px}
h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;
  font-size:clamp(26px,3.6vw,34px);letter-spacing:.02em;text-transform:uppercase;
  margin:52px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--rule);text-wrap:balance}
h3{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:23px;letter-spacing:.05em;text-transform:uppercase;margin:34px 0 6px}
p{margin:0 0 14px;max-width:74ch}
.note{color:var(--mut);font-size:15px;font-style:italic;max-width:70ch}
.tbl{overflow-x:auto;margin:0 0 22px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.photo td:nth-child(1){width:32%}
.photo td:nth-child(2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--accent);padding-right:18px}
.photo td:nth-child(3){color:var(--mut)}
.clot td:nth-child(1){width:24%;font-weight:600}
.clot td:nth-child(2){width:30%;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--p2);
  border-radius:2px;padding:18px 20px;margin:0 0 12px}
.card.P0{border-left-color:var(--p0)}.card.P1{border-left-color:var(--p1)}
.card.P2{border-left-color:var(--p2)}.card.P3{border-left-color:var(--p3)}
.card h4{margin:0 0 10px;font-size:18.5px;line-height:1.32;font-weight:600;text-wrap:balance}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400;
  color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:2px;margin-right:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.07em;text-transform:uppercase;background:var(--chip);color:var(--mut);
  padding:2px 9px;border-radius:2px;line-height:1.5}
.chip.pr{color:var(--bg);background:var(--p2)}
.card.P0 .chip.pr{background:var(--p0)}.card.P1 .chip.pr{background:var(--p1)}
.card.P3 .chip.pr{background:var(--p3)}
.f{margin:14px 0 0}
.f dt{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:14px}
.f dd{margin:2px 0 0;max-width:74ch}
.f dd p{margin:0 0 9px}
.f dd p:last-child{margin-bottom:0}
.f ul,.f ol{margin:4px 0 9px;padding-left:19px}
.f dd>ol:last-child,.f dd>ul:last-child{margin-bottom:0}
.f li{margin:4px 0;max-width:72ch}
pre{background:var(--chip);border-left:2px solid var(--line);padding:10px 13px;
  margin:9px 0;overflow-x:auto;max-width:74ch}
pre code{background:none;padding:0;font-size:.84em;line-height:1.5;
  white-space:pre;word-break:normal}
.refs{font-size:12.5px;color:var(--mut);margin-top:15px;font-style:italic;max-width:none}
.prov{font-size:12.5px;color:var(--mut);font-style:italic;margin:6px 0 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--chip);padding:1px 5px;border-radius:2px;word-break:break-word}
.count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);
  font-size:14px;font-weight:400;letter-spacing:0;text-transform:none}
.ecart{border-left:2px solid var(--line);padding-left:16px;margin:0 0 18px;max-width:80ch}
.ecart b{display:block;margin-bottom:5px;font-weight:600}
.ecart span{display:block;font-size:15px;color:var(--mut);margin-bottom:4px}
.empty{color:var(--mut);font-style:italic;padding:26px 0}
@media (max-width:640px){
  header{padding-top:34px}
  .card{padding:14px 15px}
  .photo td:nth-child(1),.clot td:nth-child(1),.clot td:nth-child(2){width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

tifications","pt":"E-mail e notificações"},"note":{"fr":"13 fonctions notify-*, 5 files d'attente, 6 déclencheurs de dépêche. Personne n'a jamais audité l'ensemble.","pt":"13 funções notify-*, 5 filas, 6 gatilhos de despacho. Ninguém jamais auditou o conjunto."}},{"key":"G","label":{"fr":"Réseau, gouvernance, fédération","pt":"Rede, governança, federação"},"note":{"fr":"Beaucoup de circuits construits, très peu empruntés. C'est le principal enseignement du relevé.","pt":"Muitos circuitos construídos, pouquíssimos percorridos. É o principal ensinamento do levantamento."}},{"key":"H","label":{"fr":"Interopérabilité, thésaurus, moisson","pt":"Interoperabilidade, tesauro, coleta"},"note":{"fr":"Sortir vers les autres catalogues, et accepter d'être pointé en retour.","pt":"Sair em direção aos outros catálogos, e aceitar ser apontado de volta."}},{"key":"I","label":{"fr":"Auto-hébergement, exploitation, sauvegardes, CI","pt":"Auto-hospedagem, operação, backups, CI"},"note":{"fr":"Gelé jusqu'au 14/09/2026 sur la production. Le travail en environnement d'essai reste ouvert.","pt":"Congelado até 14/09/2026 na produção. O trabalho em ambiente de teste continua aberto."}},{"key":"J","label":{"fr":"Documentation et corpus","pt":"Documentação e corpus"},"note":{"fr":"Le corpus est vaste et sa dérive est mesurée. Ce backlog en fait partie.","pt":"O corpus é vasto e sua deriva é medida. Este backlog faz parte dele."}},{"key":"K","label":{"fr":"Caisse, communication, formation","pt":"Caixa, comunicação, formação"},"note":{"fr":"Ce qui décide si le projet a des moyens et des bras, et non seulement du code.","pt":"O que decide se o projeto tem meios e braços, e não apenas código."}}],"priorities":[{"key":"P0","label":{"fr":"Structurel","pt":"Estrutural"},"desc":{"fr":"Le projet reste fragile tant que ce n'est pas fait. Aucun code ne le remplace.","pt":"O projeto continua frágil enquanto isso não for feito. Nenhum código substitui."}},{"key":"P1","label":{"fr":"Prioritaire","pt":"Prioritário"},"desc":{"fr":"Corrige un défaut réel, ou débloque plusieurs autres chantiers.","pt":"Corrige um defeito real, ou desbloqueia vários outros canteiros."}},{"key":"P2","label":{"fr":"Courant","pt":"Corrente"},"desc":{"fr":"Utile, non bloquant, à prendre quand un créneau se libère.","pt":"Útil, não bloqueante, a pegar quando abrir uma janela."}},{"key":"P3","label":{"fr":"Différé","pt":"Adiado"},"desc":{"fr":"Différé volontairement, avec la raison écrite. Ne pas le reprendre sans rouvrir la raison.","pt":"Adiado deliberadamente, com o motivo escrito. Não retomar sem reabrir o motivo."}}],"states":[{"key":"ouvert","label":{"fr":"Ouvert","pt":"Aberto"}},{"key":"en-cours","label":{"fr":"En cours","pt":"Em curso"}},{"key":"a-verifier","label":{"fr":"À vérifier","pt":"A verificar"}},{"key":"bloque","label":{"fr":"Bloqué","pt":"Bloqueado"}},{"key":"gele","label":{"fr":"Gelé","pt":"Congelado"}},{"key":"decision","label":{"fr":"Décision collective","pt":"Decisão coletiva"}}],"efforts":[{"key":"S","label":{"fr":"une soirée","pt":"uma noite"}},{"key":"M","label":{"fr":"quelques jours","pt":"alguns dias"}},{"key":"L","label":{"fr":"plusieurs semaines","pt":"várias semanas"}},{"key":"XL","label":{"fr":"un chantier long","pt":"um canteiro longo"}},{"key":"?","label":{"fr":"non chiffré","pt":"não estimado"}}],"skills":[{"key":"aucune","label":{"fr":"aucune compétence technique","pt":"nenhuma competência técnica"}},{"key":"biblio","label":{"fr":"bibliothéconomie","pt":"biblioteconomia"}},{"key":"langue","label":{"fr":"langue maternelle","pt":"língua materna"}},{"key":"sql","label":{"fr":"SQL / PostgreSQL","pt":"SQL / PostgreSQL"}},{"key":"front","label":{"fr":"React / JavaScript","pt":"React / JavaScript"}},{"key":"deno","label":{"fr":"Deno / TypeScript","pt":"Deno / TypeScript"}},{"key":"sysadmin","label":{"fr":"administration système","pt":"administração de sistemas"}},{"key":"powershell","label":{"fr":"PowerShell (hooks Windows)","pt":"PowerShell (hooks Windows)"}},{"key":"collectif","label":{"fr":"délibération collective","pt":"deliberação coletiva"}}],"items":[{"id":"A1","d":"A","p":"P0","s":"decision","e":"?","sk":["collectif","aucune"],"t":{"fr":"Obtenir au moins deux autres administrateur·rices réseau","pt":"Obter pelo menos duas outras pessoas administradoras de rede"},"v":{"fr":"Vérifié en base le 29/08 : le réseau compte **un seul administrateur**. Les tables `network_administrators`, `network_administrator_cooptation_proposals` et `network_administrator_cooptation_votes` sont vides après quelques insertions historiques.","pt":"Verificado no banco em 29/08: a rede conta com **um único administrador**. As tabelas `network_administrators`, `network_administrator_cooptation_proposals` e `network_administrator_cooptation_votes` estão vazias após algumas inserções históricas."},"w":{"fr":"Trouver et coopter deux personnes de plus, dans deux collectifs différents, disposées à porter les décisions fédérales : admission d'une bibliothèque, arbitrage entre bibliothèques, ouverture de la moisson.","pt":"Encontrar e cooptar mais duas pessoas, em dois coletivos diferentes, dispostas a carregar as decisões federais: admissão de uma biblioteca, arbitragem entre bibliotecas, abertura da coleta."},"y":{"fr":"C'est l'item qui commande tous les autres. Des décisions fédérales sont **volontairement différées** faute de pouvoir être prises à plusieurs — l'admission de la Bibliothèque SOLIDAIRES au premier chef. Tant qu'il n'y a qu'une personne, le mécanisme de cooptation reste un dispositif sans usage, et le réseau reste suspendu à quelqu'un qui peut tomber malade.","pt":"É o item que comanda todos os outros. Decisões federais são **deliberadamente adiadas** por não poderem ser tomadas em conjunto — a admissão da Biblioteca SOLIDAIRES em primeiro lugar. Enquanto houver uma só pessoa, o mecanismo de cooptação continua um dispositivo sem uso, e a rede continua suspensa a alguém que pode adoecer."},"f":{"fr":["Deux personnes supplémentaires portent le rôle `network_administrator` en base.","Une décision fédérale a été prise à trois de bout en bout, avec sa trace dans `network_administrator_audit`.","Le circuit de cooptation a été emprunté au moins une fois : proposition, délai, ratification."],"pt":["Duas pessoas a mais carregam o papel `network_administrator` no banco.","Uma decisão federal foi tomada em três, de ponta a ponta, com seu rastro em `network_administrator_audit`.","O circuito de cooptação foi percorrido pelo menos uma vez: proposta, prazo, ratificação."]},"dep":{"fr":"Bloque **G7** (décision sur SOLIDAIRES) et conditionne **A2**.","pt":"Bloqueia **G7** (decisão sobre SOLIDAIRES) e condiciona **A2**."},"r":["docs/CHANTIERS_OUVERTS.md §7","REGISTRE §1 RES-D11","CALENDRIER_bologne_2026-08-27"],"verif":{"fr":"31/08 — `network_administrators` : 1 ligne. Rien n'a bougé.","pt":"31/08 — `network_administrators`: 1 linha. Nada mudou."}},{"id":"A2","d":"A","p":"P0","s":"ouvert","e":"M","sk":["sysadmin","sql","front"],"t":{"fr":"Éprouver la reconstruction complète par quelqu'un d'autre que le mainteneur","pt":"Testar a reconstrução completa por outra pessoa que não o mantenedor"},"v":{"fr":"Jamais fait. `deploy/README.md`, `deploy/REPETITION.md` et `deploy/bootstrap.sh` existent et ont été exécutés — **sur la seule machine du mainteneur**.","pt":"Nunca feito. `deploy/README.md`, `deploy/REPETITION.md` e `deploy/bootstrap.sh` existem e foram executados — **apenas na máquina do mantenedor**."},"w":{"fr":"Cloner le dépôt sur une machine tierce, monter la pile complète en suivant `deploy/README.md`, et écrire ce qui casse. Aucun secret, aucun accès, aucune coordination : la pile se rebâtit depuis le dépôt seul. Docker, une machine, une soirée.","pt":"Clonar o repositório numa máquina de terceiro, subir a pilha completa seguindo `deploy/README.md`, e escrever o que quebra. Nenhum segredo, nenhum acesso, nenhuma coordenação: a pilha se reconstrói a partir do repositório sozinho. Docker, uma máquina, uma noite."},"y":{"fr":"C'est la réponse à la seule question qui décide de tout le reste : *ce projet est-il reprenable par quelqu'un d'autre que celui qui l'a écrit ?* Un rapport d'échec détaillé vaut ici plus qu'un correctif : c'est la liste de ce qui ne marche que sur une seule machine.","pt":"É a resposta à única pergunta que decide todo o resto: *este projeto é retomável por outra pessoa além de quem o escreveu?* Um relatório de falha detalhado vale aqui mais que uma correção: é a lista do que só funciona numa única máquina."},"f":{"fr":["La pile démarre sur une machine qui n'a jamais vu le projet, en suivant la documentation seule.","Chaque écart entre la documentation et la réalité est consigné, avec sa commande et son message d'erreur.","Le journal d'exécution devient une section de `deploy/README.md`."],"pt":["A pilha sobe numa máquina que nunca viu o projeto, seguindo apenas a documentação.","Cada divergência entre a documentação e a realidade é registrada, com seu comando e sua mensagem de erro.","O diário de execução vira uma seção de `deploy/README.md`."]},"dep":{"fr":"Aucune. **C'est le meilleur premier pas pour quelqu'un qui arrive.**","pt":"Nenhuma. **É o melhor primeiro passo para quem chega.**"},"r":["docs/CHANTIERS_OUVERTS.md §1","deploy/REPETITION.md"]},{"id":"A3","d":"A","p":"P0","s":"ouvert","e":"L","sk":["sysadmin"],"t":{"fr":"Sortir le runner d'intégration continue de la machine du mainteneur","pt":"Tirar o runner de integração contínua da máquina do mantenedor"},"v":{"fr":"`.forgejo/workflows/ci.yml` et `sql-tests.yml` portent tous deux `runs-on: anarbib-local` — un `act_runner` auto-hébergé sur le WSL2 du mainteneur. Machine éteinte, **rien ne se déploie**, et l'échec est parfois silencieux.","pt":"`.forgejo/workflows/ci.yml` e `sql-tests.yml` trazem ambos `runs-on: anarbib-local` — um `act_runner` auto-hospedado no WSL2 do mantenedor. Máquina desligada, **nada se implanta**, e a falha às vezes é silenciosa."},"w":{"fr":"Faire tourner le runner ailleurs que sur un poste de travail personnel : machine de l'hébergeur, seconde machine du réseau, ou runner partagé. La logique de déploiement est déjà extraite dans `scripts/ci/deployer-backend.sh` et rejouable à la main — la moitié du travail est faite.","pt":"Rodar o runner em outro lugar que não uma estação de trabalho pessoal: máquina do provedor, segunda máquina da rede, ou runner compartilhado. A lógica de implantação já está extraída em `scripts/ci/deployer-backend.sh` e é reexecutável à mão — metade do trabalho está feita."},"y":{"fr":"Tant que le runner est unique et personnel, aucune procédure ne peut rendre le déploiement fiable, et personne d'autre ne peut fusionner une contribution. C'est la seconde moitié de la dépendance à une seule personne, après **A1**.","pt":"Enquanto o runner for único e pessoal, nenhum procedimento pode tornar a implantação confiável, e ninguém mais pode integrar uma contribuição. É a segunda metade da dependência de uma só pessoa, depois de **A1**."},"f":{"fr":["Un push sur `main` déclenche un déploiement sans que la machine du mainteneur soit allumée.","Le garde-fou d'exclusion du routeur `main` est préservé aux deux endroits (workflow et script).","La procédure de remise en route du runner est écrite pour quelqu'un qui ne l'a pas installé."],"pt":["Um push em `main` dispara uma implantação sem que a máquina do mantenedor esteja ligada.","A guarda de exclusão do roteador `main` é preservada nos dois lugares (workflow e script).","O procedimento de recolocação do runner em funcionamento está escrito para quem não o instalou."]},"dep":{"fr":"Lié à **I2** (bascule auto-hébergée). Peut se faire avant, sur l'infrastructure actuelle.","pt":"Ligado a **I2** (migração auto-hospedada). Pode ser feito antes, na infraestrutura atual."},"r":["CLAUDE.md, piège connu n°1","REPRISE_bascule_autohebergee_2026-08-26"],"verif":{"fr":"31/08 — 7 occurrences de `runs-on: anarbib-local` dans `.forgejo/workflows/`. Rien n'a bougé.","pt":"31/08 — 7 ocorrências de `runs-on: anarbib-local` em `.forgejo/workflows/`. Nada mudou."}},{"id":"B2","d":"B","p":"P1","s":"en-cours","e":"M","sk":["sql"],"t":{"fr":"Trier les 36 fonctions `SECURITY DEFINER` ouvertes à `anon`","pt":"Triar as 36 funções `SECURITY DEFINER` abertas a `anon`"},"v":{"fr":"**Lots 1 et 2 livrés le 30/08** — migration `20260830181207_un_grant_que_la_fonction_contredit`, tests `T8`/`T9` dans `grants_herites_tests.sql`, CI verte, déployé. Le compteur de l'advisor est passé de **500 à 497** : trois exactement, comme annoncé. Restent les lots 3 et 4.\n\nComplété le 30/08. Le Security Advisor de Supabase affiche **500 avertissements** ; l'export CSV le dit : ce sont **deux lints et rien d'autre** — `anon_security_definer_function_executable` (0028) et `authenticated_security_definer_function_executable` (0029). Compté en production : **36** fonctions exécutables par `anon`, **464** par `authenticated`, total exactement 500.\n\n**Ce ne sont pas 36 décisions.** Le schéma `public` porte, depuis le socle Supabase :\n\n```sql\nALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public\n  GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;\n```\n\nLes 621 fonctions de `public` appartiennent toutes à `postgres`. **Toute fonction créée dans `public` naît donc exécutable par `anon`**, sans qu'aucune migration ne l'ait demandé. Ce défaut figure dans le baseline (`20260510000000_baseline_live.sql`), donc la CI le rejoue à l'identique : ce n'est pas une dérive de production.\n\nLa contre-preuve est dans le dépôt : **141 lignes `REVOKE … anon`** réparties dans les migrations, et trois lots de durcissement en masse les 17, 19 et 20/08. Le projet corrige ce défaut une fonction à la fois depuis des mois. Il en reste 79 ouvertes à `anon` dans `public` (33 en `SECURITY DEFINER`, 46 en `SECURITY INVOKER`, où la RLS s'applique encore), plus 3 dans `api`.\n\nRelues une par une, les 36 se répartissent en trois groupes très inégaux :\n\n1. **Cinq intouchables.** `user_can_act_as_staff_on_library`, `fn_library_visible_to_caller`, `user_can_engage_library`, `fn_caller_is_network_admin`, `fn_caller_is_library_staff` sont appelées par **107 policies RLS, dont 39 évaluées par `anon`**. Leur retirer `EXECUTE` ne ferme rien : cela fait échouer la lecture publique avec `permission denied for function`.\n2. **Une vingtaine d'usages anonymes réels** : catalogue public (`api.search_catalog_v1`, `api.audio_tracklist_public`, `api.subject_related_v1`), les quatre lecteurs de mode, le moissonnage OAI, le parcours de candidature d'une bibliothèque par jeton.\n3. **Trois grants que la fonction elle-même contredit** : `search_authors_by_name`, `search_publishers_by_name` et `remove_library_regulation_document` **refusent `anon` dans leur propre corps** (`RAISE EXCEPTION 'Acesso restrito ao staff de catalogacao.'`, `'authentication required'`).\n\n**Lot 3 livré le 31/08 — la cause est retournée.** `ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE EXECUTE ON FUNCTIONS FROM anon` : une fonction créée dans `public` **naît désormais fermée à `anon`**. Aucune des 621 existantes n'a bougé.\n\n**Deux vérifications faites avant d'écrire ont corrigé le constat.** *(a)* `pg_default_acl` porte **deux** entrées sur les fonctions de `public` — une pour `postgres`, une pour `supabase_admin`. Nos migrations tournent en `postgres` et les fonctions lui appartiennent : c'est celle-là qui décide ; l'autre est hors de notre portée et ne s'appliquerait qu'à une fonction créée par `supabase_admin`, ce que le dépôt ne fait jamais. *(b)* **Aucune des 621 fonctions n'a d'ACL nulle**, et c'est ce qui rend l'opération sûre : dès qu'une entrée `pg_default_acl` existe, elle **remplace** le défaut natif de PostgreSQL — lequel accorde `EXECUTE` à `PUBLIC`. Retirer `anon` ne fait donc pas retomber sur `PUBLIC`.\n\n**Le piège, nommé pour qu'il ne se retrouve pas :** ne jamais révoquer *tous* les rôles du défaut. Une entrée devenue vide est **supprimée** par Postgres, et le défaut natif `PUBLIC=X` reprend — on croirait fermer et on ouvrirait à tout le monde. `postgres`, `authenticated` et `service_role` restent pour que la ligne survive. Le même piège attend **B14**.\n\n**Ce qui change pour la suite** : une fonction servant une page publique doit porter un `GRANT EXECUTE … TO anon` explicite (`DOC-OBJ-2`, corollaire). Une ligne oubliée casse la page avec `permission denied for function` — visible et réparable, jamais silencieux. Gardé par le `T11` de `grants_herites_tests.sql`, dans les deux sens.","pt":"**Lotes 1 e 2 entregues em 30/08** — migração `20260830181207_un_grant_que_la_fonction_contredit`, testes `T8`/`T9` em `grants_herites_tests.sql`, CI verde, implantado. O contador do advisor passou de **500 para 497**: três exatamente, como anunciado. Restam os lotes 3 e 4.\n\nCompletado em 30/08. O Security Advisor do Supabase mostra **500 avisos**; a exportação CSV diz: são **dois lints e nada mais** — `anon_security_definer_function_executable` (0028) e `authenticated_security_definer_function_executable` (0029). Contado em produção: **36** funções executáveis por `anon`, **464** por `authenticated`, total exatamente 500.\n\n**Não são 36 decisões.** O esquema `public` carrega, desde a base Supabase:\n\n```sql\nALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public\n  GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;\n```\n\nAs 621 funções de `public` pertencem todas a `postgres`. **Toda função criada em `public` nasce portanto executável por `anon`**, sem que nenhuma migração o tenha pedido. Esse padrão está no baseline (`20260510000000_baseline_live.sql`), logo a CI o reproduz identicamente: não é um desvio de produção.\n\nA contraprova está no repositório: **141 linhas `REVOKE … anon`** espalhadas pelas migrações, e três lotes de endurecimento em massa em 17, 19 e 20/08. O projeto corrige esse padrão uma função por vez há meses. Restam 79 abertas a `anon` em `public` (33 em `SECURITY DEFINER`, 46 em `SECURITY INVOKER`, onde a RLS ainda se aplica), mais 3 em `api`.\n\nRelidas uma a uma, as 36 dividem-se em três grupos muito desiguais:\n\n1. **Cinco intocáveis.** `user_can_act_as_staff_on_library`, `fn_library_visible_to_caller`, `user_can_engage_library`, `fn_caller_is_network_admin`, `fn_caller_is_library_staff` são chamadas por **107 policies RLS, das quais 39 avaliadas por `anon`**. Retirar-lhes `EXECUTE` não fecha nada: faz a leitura pública falhar com `permission denied for function`.\n2. **Uns vinte usos anônimos reais**: catálogo público (`api.search_catalog_v1`, `api.audio_tracklist_public`, `api.subject_related_v1`), os quatro leitores de modo, a coleta OAI, o percurso de candidatura de uma biblioteca por token.\n3. **Três grants que a própria função contradiz**: `search_authors_by_name`, `search_publishers_by_name` e `remove_library_regulation_document` **recusam `anon` no próprio corpo** (`RAISE EXCEPTION 'Acesso restrito ao staff de catalogacao.'`, `'authentication required'`).\n\n**Lote 3 entregue em 31/08 — a causa está invertida.** `ALTER DEFAULT PRIVILEGES … REVOKE EXECUTE ON FUNCTIONS FROM anon`: uma função criada em `public` **nasce agora fechada a `anon`**. Nenhuma das 621 existentes mudou. **Armadilha nomeada**: nunca revogar *todos* os papéis do defeito — uma entrada `pg_default_acl` vazia é **apagada**, e o defeito nativo `PUBLIC=X` regressa. Guardado pelo `T11`."},"w":{"fr":"La règle, corrigée par ce relevé : **est ouvert à `anon` ce qui sert une page publique, ou ce qu'une policy évaluée par `anon` appelle. Rien d'autre — et surtout pas par défaut.**\n\nQuatre lots, dans cet ordre :\n\n1. `REVOKE EXECUTE … FROM anon` sur les trois grants que la fonction contredit. Aucun changement de comportement : elles refusaient déjà.\n2. Un `COMMENT ON FUNCTION` sur les cinq intouchables, qui dit *pourquoi* et cite le décompte de policies daté. Sans lui, la prochaine lecture du tableau de bord refera ce travail — ou fera le revoke.\n3. **Retourner le défaut du schéma** : `ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE EXECUTE ON FUNCTIONS FROM anon;`. Ne change rien aux 621 fonctions existantes — seulement aux suivantes. À partir de là, ouvrir à `anon` est un acte écrit, et une ouverture oubliée casse une page publique de façon visible au lieu d'exposer une fonction en silence. C'est une décision de doctrine : elle demande une entrée au `REGISTRE_decisions`, pas seulement une migration. **Et elle a une limite connue** : le chapeau de `grants_herites_tests.sql` la note depuis le 29/08 pour les tables — le défaut posé par `supabase_admin` n'est pas modifiable depuis une migration. Celui de `postgres` l'est, et c'est celui qui s'applique aux fonctions créées par les migrations ; mais la plateforme peut le reposer. D'où le dernier critère de fin : une suite, pas seulement un `ALTER`.\n4. Passer les ~28 restantes au crible de la question d'audit du 18/05 : *que renvoie-t-elle, à partir de quel paramètre, et qu'est-ce qui interdit à un tiers non connecté de le demander ?*\n\n**Avant tout `REVOKE` nominatif, vérifier :**\n```sql\nSELECT c.relname, p.polname, p.polroles::regrole[]\n  FROM pg_policy p JOIN pg_class c ON c.oid = p.polrelid\n WHERE coalesce(pg_get_expr(p.polqual, p.polrelid), '')\n     || coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '')\n       LIKE '%nom_de_la_fonction%';\n```","pt":"A regra, corrigida por este levantamento: **está aberto a `anon` o que serve uma página pública, ou o que uma policy avaliada por `anon` chama. Nada mais — e sobretudo não por padrão.**\n\nQuatro lotes, nesta ordem:\n\n1. `REVOKE EXECUTE … FROM anon` nos três grants que a função contradiz. Nenhuma mudança de comportamento: já recusavam.\n2. Um `COMMENT ON FUNCTION` nas cinco intocáveis, dizendo *por quê* e citando a contagem datada de policies. Sem ele, a próxima leitura do painel refará este trabalho — ou fará o revoke.\n3. **Inverter o padrão do esquema**: `ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE EXECUTE ON FUNCTIONS FROM anon;`. Não muda nada nas 621 funções existentes — apenas nas seguintes. A partir daí, abrir a `anon` é um ato escrito, e uma abertura esquecida quebra uma página pública de forma visível em vez de expor uma função em silêncio. É uma decisão de doutrina: pede uma entrada no `REGISTRE_decisions`, não apenas uma migração. **E tem um limite conhecido**: o cabeçalho de `grants_herites_tests.sql` o anota desde 29/08 para as tabelas — o padrão posto por `supabase_admin` não é modificável a partir de uma migração. O de `postgres` é, e é ele que se aplica às funções criadas pelas migrações; mas a plataforma pode repô-lo. Daí o último critério de fim: uma suíte, não apenas um `ALTER`.\n4. Passar as ~28 restantes pelo crivo da pergunta de auditoria de 18/05: *o que ela retorna, a partir de qual parâmetro, e o que impede um terceiro não conectado de pedi-lo?*\n\n**Antes de qualquer `REVOKE` nominal, verificar:**\n```sql\nSELECT c.relname, p.polname, p.polroles::regrole[]\n  FROM pg_policy p JOIN pg_class c ON c.oid = p.polrelid\n WHERE coalesce(pg_get_expr(p.polqual, p.polrelid), '')\n     || coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '')\n       LIKE '%nome_da_funcao%';\n```"},"y":{"fr":"Parce qu'un défaut permissif ne se voit jamais. Une fonction créée demain dans `public` sera exécutable par `anon` sans que personne ne l'ait décidé, et le seul endroit où cela apparaîtra est un compteur à trois chiffres sur un tableau de bord que plus personne ne lit. Les 141 `REVOKE` du dépôt sont la trace de cette lutte, menée à la main, sans jamais retourner la cause.\n\nEt parce qu'un grant que le corps de la fonction contredit est exactement ce qui cesse d'être relu. Le jour où quelqu'un retire la garde `auth.uid() is null` de `remove_library_regulation_document` pour réparer autre chose, le grant sera toujours là — et personne ne l'aura mis ce jour-là.","pt":"Porque um padrão permissivo nunca se vê. Uma função criada amanhã em `public` será executável por `anon` sem que ninguém o tenha decidido, e o único lugar onde isso aparecerá é um contador de três dígitos num painel que ninguém mais lê. Os 141 `REVOKE` do repositório são o rastro dessa luta, travada à mão, sem nunca inverter a causa.\n\nE porque um grant que o corpo da função contradiz é exatamente o que deixa de ser relido. No dia em que alguém retirar a guarda `auth.uid() is null` de `remove_library_regulation_document` para consertar outra coisa, o grant ainda estará lá — e ninguém o terá colocado naquele dia."},"f":{"fr":["Les trois grants morts sont retirés par migration ; aucune suite ne rougit.","Les cinq intouchables portent un `COMMENT ON FUNCTION` qui nomme la raison et le décompte daté de policies.","Le privilège par défaut de `public` ne donne plus `EXECUTE` à `anon` sur les fonctions à venir, et la décision est écrite au `REGISTRE_decisions`.","Les ~28 restantes ont un verdict écrit dans `docs/journal/audits/`.","Une suite SQL garde l'invariant : *aucune fonction ouverte à `anon` hors d'une liste nommée* — sur le modèle du TEST 15 de `paquetA`, qui garde déjà le partage dans les deux sens sur dix helpers.","Le lint 0028 tombe à la taille de cette liste, et ce nombre est écrit quelque part. Un avertissement attendu n'est plus un avertissement."],"pt":["Os três grants mortos são retirados por migração; nenhuma suíte fica vermelha.","As cinco intocáveis levam um `COMMENT ON FUNCTION` que nomeia a razão e a contagem datada de policies.","O privilégio padrão de `public` não dá mais `EXECUTE` a `anon` sobre as funções futuras, e a decisão está escrita no `REGISTRE_decisions`.","As ~28 restantes têm um veredicto escrito em `docs/journal/audits/`.","Uma suíte SQL guarda o invariante: *nenhuma função aberta a `anon` fora de uma lista nomeada* — no modelo do TEST 15 de `paquetA`, que já guarda a partilha nos dois sentidos sobre dez helpers.","O lint 0028 cai ao tamanho dessa lista, e esse número está escrito em algum lugar. Um aviso esperado deixa de ser um aviso."]},"dep":{"fr":"Les lots 1 et 2 tiennent dans une soirée et ne dépendent de rien. Le lot 3 est une décision de doctrine — il ne se prend pas seul et se pose après le lot 4, quand on sait ce qui doit rester ouvert. Le lot 4 est une revue, par paquets de dix.","pt":"Os lotes 1 e 2 cabem numa noite e não dependem de nada. O lote 3 é uma decisão de doutrina — não se toma sozinho e vem depois do lote 4, quando se sabe o que deve permanecer aberto. O lote 4 é uma revisão, em pacotes de dez."},"r":["PLAN_DE_MARCHE §8","PLAN_DE_MARCHE règle 13.3","AUDIT_securite_fonctions_privees_2026-05-18","migration 20260702103557 (durcissement advisor 0028)","baseline 20260510000000 lignes 61206-61220 (ALTER DEFAULT PRIVILEGES)","tests/sql/paquetA_profils_tests.sql TEST 13 et TEST 15"],"verif":{"fr":"31/08 — lots 1, 2 et 3 livrés et vérifiés en base ; `pg_default_acl` relevé avant écriture (deux entrées, pas une), et l'absence d'ACL nulle sur les 621 fonctions vérifiée pour s'assurer que la fermeture ne retombe pas sur `PUBLIC`. Reste le tri des fonctions ouvertes à `authenticated`, qui est l'item **B14**.","pt":"31/08 — lotes 1, 2 e 3 entregues e verificados em base. Resta a triagem de `authenticated`, item **B14**."}},{"id":"B14","d":"B","p":"P2","s":"ouvert","e":"L","sk":["sql"],"t":{"fr":"Auditer les 464 fonctions `SECURITY DEFINER` ouvertes à `authenticated`","pt":"Auditar as 464 funções `SECURITY DEFINER` abertas a `authenticated`"},"v":{"fr":"L'autre part des 500 avertissements de l'advisor : le lint 0029, **464 fonctions** — 138 dans `api` sur 142, 326 dans `public` sur 498. L'audit du 18/05 a passé en revue une partie de `public` et fermé cinq failles réelles ; **il ne portait pas sur `api`.**\n\nComme pour `anon` (item **B2**), ce nombre est d'abord l'effet d'un défaut de schéma : `ALTER DEFAULT PRIVILEGES … GRANT ALL ON FUNCTIONS TO … authenticated` s'applique à toute fonction créée dans `public`. La différence est qu'ici, le défaut est **presque toujours celui qu'on veut** : la surface d'écriture de l'application est faite de RPC `SECURITY DEFINER` derrière `api`, appelées par des personnes connectées (doctrine `DOC-RPC-3`). Le nombre ne descendra pas à zéro, et ce n'est pas l'objectif. L'advisor signale une architecture qu'il ne peut pas connaître.\n\n**Ce que le lot 3 de B2 change ici (31/08).** Le défaut du schéma a été retourné pour `anon` : une fonction créée dans `public` naît désormais fermée à ce rôle. **Rien n'a été fait pour `authenticated`, et rien ne doit l'être à l'aveugle** — c'est toute la différence entre les deux items. Fermer `authenticated` par défaut casserait la surface d'écriture de l'application, faite de RPC `SECURITY DEFINER` derrière `api` appelées par des personnes connectées : la panne serait immédiate, générale, et sans rapport avec une décision de sécurité.\n\n**Et le piège nommé dans B2 vaut ici, en pire.** Une entrée `pg_default_acl` devenue vide est *supprimée* par PostgreSQL, et le défaut natif `PUBLIC=X` reprend la main : on croirait fermer, on ouvrirait à tout le monde. Après le lot 3, la ligne de `postgres` sur les fonctions de `public` ne porte plus que `postgres`, `authenticated` et `service_role`. **Retirer `authenticated` sans en laisser d'autres viderait la ligne** — et rendrait exécutables par n'importe qui les fonctions que le lot 3 vient de protéger pour l'avenir. Si cet item aboutit un jour à un `ALTER DEFAULT PRIVILEGES`, il devra retirer `authenticated` *et* laisser `postgres` et `service_role`, puis **vérifier que la ligne existe encore** : le bloc de vérification de la migration `20260831105114` est écrit pour être recopié.\n\nLe travail réel de B14 n'est donc pas un `ALTER` — c'est l'audit des 138 fonctions de `api`, une par une. Le défaut n'y sera retourné, si jamais il l'est, qu'à la fin.","pt":"A outra parte dos 500 avisos do advisor: o lint 0029, **464 funções** — 138 em `api` de 142, 326 em `public` de 498. A auditoria de 18/05 revisou uma parte de `public` e fechou cinco falhas reais; **não abrangia `api`.**\n\nComo para `anon` (item **B2**), este número é antes de tudo o efeito de um padrão de esquema: `ALTER DEFAULT PRIVILEGES … GRANT ALL ON FUNCTIONS TO … authenticated` aplica-se a toda função criada em `public`. A diferença é que aqui o padrão é **quase sempre o que se quer**: a superfície de escrita da aplicação é feita de RPC `SECURITY DEFINER` atrás de `api`, chamadas por pessoas conectadas (doutrina `DOC-RPC-3`). O número não descerá a zero, e não é esse o objetivo. O advisor sinaliza uma arquitetura que não pode conhecer.\n\n**O que o lote 3 de B2 muda aqui (31/08).** O padrão do esquema foi invertido para `anon`. **Nada foi feito para `authenticated`, e nada deve ser feito às cegas** — fechar `authenticated` por padrão quebraria a superfície de escrita da aplicação.\n\n**E a armadilha nomeada em B2 vale aqui, pior.** Uma entrada `pg_default_acl` vazia é *apagada* pelo PostgreSQL, e o padrão nativo `PUBLIC=X` retoma. Depois do lote 3, a linha de `postgres` traz apenas `postgres`, `authenticated` e `service_role`: **retirar `authenticated` sem deixar outros esvaziaria a linha**. Se este item chegar um dia a um `ALTER DEFAULT PRIVILEGES`, deverá deixar `postgres` e `service_role`, e **verificar que a linha ainda existe** — o bloco de verificação da migração `20260831105114` está escrito para ser copiado.\n\nO trabalho real de B14 não é um `ALTER`: é a auditoria das 138 funções de `api`."},"w":{"fr":"Le critère n'est pas *« est-elle `SECURITY DEFINER` ? »* — elles le sont toutes, par construction. C'est : **que peut demander une inconnue qui s'est simplement inscrite ?** Un compte `authenticated` s'obtient en trois clics ; il ne prouve l'appartenance à aucune bibliothèque.\n\nReprendre la question d'audit du 18/05 — *que renvoie-t-elle, à partir de quel paramètre, et qu'est-ce qui interdit à un tiers de le demander ?* — et l'appliquer aux 138 fonctions de `api` d'abord, qui sont la surface exposée par `/rest/v1/rpc/`. Chercher `auth.uid()` dans le corps ne prouve rien : les cinq failles de mai en contenaient.\n\nLes oracles trouvés en mai avaient tous la même forme : un identifiant en paramètre, une donnée nominative en retour. Chercher cette forme en priorité.","pt":"O critério não é *«é `SECURITY DEFINER`?»* — todas são, por construção. É: **o que pode pedir uma desconhecida que apenas se cadastrou?** Uma conta `authenticated` obtém-se em três cliques; não prova pertencimento a nenhuma biblioteca.\n\nRetomar a pergunta de auditoria de 18/05 — *o que ela retorna, a partir de qual parâmetro, e o que impede um terceiro de pedi-lo?* — e aplicá-la às 138 funções de `api` primeiro, que são a superfície exposta por `/rest/v1/rpc/`. Procurar `auth.uid()` no corpo não prova nada: as cinco falhas de maio continham-no.\n\nOs oráculos encontrados em maio tinham todos a mesma forma: um identificador como parâmetro, um dado nominativo no retorno. Procurar essa forma prioritariamente."},"y":{"fr":"C'est la moitié non auditée de la surface d'API du projet. Les cinq failles trouvées dans `public` étaient des oracles — numéro vers courriel, identifiant vers nom — et rien ne dit que `api` n'en porte pas. Pour une bibliothèque militante, un oracle qui rend un nom à partir d'un numéro n'est pas un défaut technique : c'est une liste de personnes.","pt":"É a metade não auditada da superfície de API do projeto. As cinco falhas encontradas em `public` eram oráculos — número para e-mail, identificador para nome — e nada diz que `api` não carregue outros. Para uma biblioteca militante, um oráculo que devolve um nome a partir de um número não é um defeito técnico: é uma lista de pessoas."},"f":{"fr":["Les 138 fonctions de `api` ont un verdict écrit : légitime, à restreindre, ou à supprimer.","Les fonctions à restreindre ont perdu leur `EXECUTE` par migration, après vérification qu'aucune policy ne les appelle.","Le compte rendu vit dans `docs/journal/audits/`, au format de celui du 18/05.","Le reste de `public` suit, par paquets."],"pt":["As 138 funções de `api` têm um veredicto escrito: legítima, a restringir, ou a suprimir.","As funções a restringir perderam seu `EXECUTE` por migração, após verificação de que nenhuma policy as chama.","O relatório vive em `docs/journal/audits/`, no formato do de 18/05.","O resto de `public` segue, em pacotes."]},"dep":{"fr":"Se fait par lots. Un lot de vingt fonctions est déjà utile. Ne commence pas avant **B2**, dont le lot 2 pose le vocabulaire des commentaires et dont le lot 3 pose le piège à ne pas répéter.","pt":"Faz-se em lotes. Um lote de vinte funções já é útil. Não começa antes de **B2**, cujo lote 2 estabelece o vocabulário dos comentários e cujo lote 3 nomeia a armadilha a não repetir."},"r":["PLAN_DE_MARCHE §8","PLAN_DE_MARCHE règle 13.3","AUDIT_securite_fonctions_privees_2026-05-18","REGISTRE_decisions DOC-RPC-3","item B2, lot 3","migration 20260831105114","tests/sql/grants_herites_tests.sql T11"],"verif":{"fr":"31/08 — relu à la lumière du lot 3 de **B2**, livré le jour même : le défaut de `public` sur les fonctions porte désormais `postgres`, `authenticated`, `service_role` — `anon` retiré, la ligne `pg_default_acl` vérifiée présente après coup. Le comptage du 30/08 (138 de `api` sur 142, 326 de `public` sur 498) n'a pas été refait ; **l'audit lui-même reste entier**.","pt":"31/08 — relido à luz do lote 3 de **B2**, entregue no mesmo dia: o padrão de `public` traz agora `postgres`, `authenticated`, `service_role`. A contagem de 30/08 não foi refeita; **a auditoria em si continua inteira**."}},{"id":"B4","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Examiner les quatre tables à RLS sans policy qui ne sont pas du transit","pt":"Examinar as quatro tabelas com RLS sem policy que não são de trânsito"},"v":{"fr":"15 tables ont RLS activé et zéro policy. Onze sont des tables de transit ou vides. Quatre ne le sont pas : `author_name_aliases` (**1 647 lignes**), `library_themes` (3 lignes), `library_theme_configs`, `interlibrary_loan_events`.","pt":"15 tabelas têm RLS ativado e zero policy. Onze são tabelas de trânsito ou vazias. Quatro não são: `author_name_aliases` (**1 647 linhas**), `library_themes` (3 linhas), `library_theme_configs`, `interlibrary_loan_events`."},"w":{"fr":"Pour chacune, trancher : soit l'accès passe par une RPC et l'absence de policy est correcte — l'écrire en commentaire SQL —, soit une lecture légitime est aujourd'hui impossible et il manque une policy ou une fonction.","pt":"Para cada uma, decidir: ou o acesso passa por uma RPC e a ausência de policy está correta — escrevê-lo em comentário SQL —, ou uma leitura legítima é hoje impossível e falta uma policy ou uma função."},"y":{"fr":"Une table avec RLS et sans policy est fermée à tout le monde sauf aux fonctions `DEFINER`. C'est parfois exactement ce qu'on veut, et parfois une fonctionnalité qui ne marche pas sans que personne l'ait remarqué — `author_name_aliases` porte 1 647 lignes que rien ne lit peut-être.","pt":"Uma tabela com RLS e sem policy está fechada para todos exceto para as funções `DEFINER`. Às vezes é exatamente o que se quer, e às vezes é uma funcionalidade que não funciona sem que ninguém tenha percebido — `author_name_aliases` carrega 1 647 linhas que talvez nada leia."},"f":{"fr":["Les quatre tables ont un verdict écrit.","Le contrôle de restauration du runbook liste nommément les tables sans policy attendues."],"pt":["As quatro tabelas têm um veredicto escrito.","O controle de restauração do runbook lista nominalmente as tabelas sem policy esperadas."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["PLAN_DE_MARCHE §8","MATRICE_rls_deny_all_2026-06-23"],"verif":{"fr":"31/08 — 14 tables à RLS sans policy (15 au 29/08). Les quatre nommées y sont toujours : `author_name_aliases` (1 647 lignes vivantes), `library_themes` (3), `library_theme_configs` (0), `interlibrary_loan_events` (0).","pt":"31/08 — 14 tabelas com RLS sem policy (15 em 29/08). As quatro nomeadas continuam lá, `author_name_aliases` com 1 647 linhas vivas."}},{"id":"B5","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Résorber les neuf policies qui réévaluent `auth.*()` par ligne","pt":"Resolver as nove policies que reavaliam `auth.*()` por linha"},"v":{"fr":"La migration `20260703203953_perf_rls_initplan_wrap_auth_calls` a traité les policies d'alors. Neuf policies écrites depuis y échappent : `book_reading_notes` (4), `book_reading_note_reports` (2), `catalog_duplicate_reports` (1), `authority_duplicate_reports` (1), `author_not_duplicate` (1).","pt":"A migração `20260703203953_perf_rls_initplan_wrap_auth_calls` tratou as policies de então. Nove policies escritas desde então escapam: `book_reading_notes` (4), `book_reading_note_reports` (2), `catalog_duplicate_reports` (1), `authority_duplicate_reports` (1), `author_not_duplicate` (1)."},"w":{"fr":"Envelopper les appels `auth.uid()` / `auth.jwt()` dans un sous-select, comme la migration de juillet l'a fait pour les autres.","pt":"Envolver as chamadas `auth.uid()` / `auth.jwt()` num sub-select, como a migração de julho fez para as outras."},"y":{"fr":"Sans cet enveloppement, la fonction est appelée une fois par ligne examinée. Les cinq tables concernées sont vides aujourd'hui, donc le coût est nul — et c'est précisément le bon moment pour corriger, avant que les notes de lecture servent.","pt":"Sem esse envolvimento, a função é chamada uma vez por linha examinada. As cinco tabelas envolvidas estão vazias hoje, então o custo é nulo — e é precisamente o bom momento para corrigir, antes que as notas de leitura sirvam."},"f":{"fr":["Le lint `auth_rls_initplan` ne remonte plus aucun avis.","Le patron d'enveloppement est rappelé dans le modèle de migration."],"pt":["O lint `auth_rls_initplan` não retorna mais nenhum aviso.","O padrão de envolvimento é lembrado no modelo de migração."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Advisors performance, relevé du 29/08/2026"],"verif":{"fr":"31/08 — le lint `auth_rls_initplan` remonte exactement les neuf policies nommées : `book_reading_notes` (4), `book_reading_note_reports` (2), `catalog_duplicate_reports`, `authority_duplicate_reports`, `author_not_duplicate` (1 chacune).","pt":"31/08 — o lint `auth_rls_initplan` aponta exatamente as nove policies nomeadas."}},{"id":"B7","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Départager les homonymes de fonctions entre `ingest` et `public`","pt":"Desambiguar os homônimos de funções entre `ingest` e `public`"},"v":{"fr":"Quatre noms de fonction existent dans les deux schémas avec des signatures et des sémantiques différentes : `fn_bulk_create_book_drafts_from_run`, `fn_bulk_set_partner_catalog_editorial_decision`, `fn_set_partner_catalog_editorial_decision`, et `set_updated_at()`. Aucun doublon de signature dans un même schéma — le problème est le nom partagé.","pt":"Quatro nomes de função existem nos dois esquemas com assinaturas e semânticas diferentes: `fn_bulk_create_book_drafts_from_run`, `fn_bulk_set_partner_catalog_editorial_decision`, `fn_set_partner_catalog_editorial_decision`, e `set_updated_at()`. Nenhuma duplicata de assinatura num mesmo esquema — o problema é o nome compartilhado."},"w":{"fr":"Vérifier laquelle des deux est appelée par le front et par les RPC, renommer celle qui ne l'est pas, ou supprimer la version morte. `set_updated_at()` est un trigger banal et peut rester.","pt":"Verificar qual das duas é chamada pelo front e pelas RPC, renomear a que não é, ou suprimir a versão morta. `set_updated_at()` é um trigger banal e pode ficar."},"y":{"fr":"Un `search_path` qui change d'ordre suffit à faire appeler l'autre fonction, avec des paramètres qui ne correspondent pas. C'est une panne difficile à diagnostiquer, et le projet a déjà payé une fois pour un `search_path` mal épinglé.","pt":"Um `search_path` que muda de ordem basta para chamar a outra função, com parâmetros que não correspondem. É uma pane difícil de diagnosticar, e o projeto já pagou uma vez por um `search_path` mal fixado."},"f":{"fr":["Les trois fonctions métier homonymes sont départagées.","Aucune ne dépend de l'ordre du `search_path` pour être résolue correctement."],"pt":["As três funções de negócio homônimas estão desambiguadas.","Nenhuma depende da ordem do `search_path` para ser resolvida corretamente."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Relevé du 29/08/2026"],"verif":{"fr":"30/08 — quatre homonymes relevés : `set_updated_at` (trivial) et trois qui touchent aux décisions éditoriales sur catalogue partenaire. Les corps n'ont pas été comparés.","pt":"30/08 — quatro homónimos levantados: `set_updated_at` (trivial) e três que tocam nas decisões editoriais sobre catálogo parceiro. Os corpos não foram comparados."}},{"id":"B9","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Purger le schéma `backup_2026_05_07`","pt":"Purgar o esquema `backup_2026_05_07`"},"v":{"fr":"Six tables, **toutes à zéro ligne et zéro insertion depuis leur création**, sans clé primaire, sans RLS : `emprestimos_v2`, `emprestimo_itens_v2`, `reservas_v2`, `reserva_linhas_v2`, `reserva_item_workflow_v2`, `loan_midpoint_message_log`. La décision `BG2-9` prescrit cette purge depuis juin.","pt":"Seis tabelas, **todas com zero linha e zero inserção desde a criação**, sem chave primária, sem RLS: `emprestimos_v2`, `emprestimo_itens_v2`, `reservas_v2`, `reserva_linhas_v2`, `reserva_item_workflow_v2`, `loan_midpoint_message_log`. A decisão `BG2-9` prescreve essa purga desde junho."},"w":{"fr":"`DROP SCHEMA backup_2026_05_07 CASCADE` par migration, après avoir confirmé une dernière fois que les six tables sont vides.","pt":"`DROP SCHEMA backup_2026_05_07 CASCADE` por migração, após confirmar uma última vez que as seis tabelas estão vazias."},"y":{"fr":"Six tables de sauvegarde vides polluent chaque relevé d'advisors — elles portent à elles seules six des quatorze avis « pas de clé primaire ». Et un schéma nommé `backup_` qui ne contient rien est un piège pour qui reprendra le projet.","pt":"Seis tabelas de backup vazias poluem cada levantamento de advisors — carregam sozinhas seis dos catorze avisos «sem chave primária». E um esquema chamado `backup_` que não contém nada é uma armadilha para quem retomar o projeto."},"f":{"fr":["Le schéma n'existe plus.","`deploy/bg2-known-tables.txt` a été mis à jour dans le même mouvement."],"pt":["O esquema não existe mais.","`deploy/bg2-known-tables.txt` foi atualizado no mesmo movimento."]},"dep":{"fr":"Ne pas confondre avec `conv_backup`, qui porte des données de revue humaine et **ne se purge pas** (voir **C4**).","pt":"Não confundir com `conv_backup`, que carrega dados de revisão humana e **não se purga** (ver **C4**)."},"r":["REGISTRE §BG2 BG2-9"],"verif":{"fr":"30/08 — le schéma pèse 6 tables et 0,1 Mo. Ce qui le lit encore n'a pas été cherché.","pt":"30/08 — o esquema pesa 6 tabelas e 0,1 Mo. O que ainda o lê não foi procurado."}},{"id":"B10","d":"B","p":"P3","s":"ouvert","e":"M","sk":["sql"],"t":{"fr":"Hygiène de performance : 170 index inutilisés, 38 clés étrangères non indexées, 24 policies permissives en double","pt":"Higiene de performance: 170 índices não usados, 38 chaves estrangeiras não indexadas, 24 policies permissivas duplicadas"},"v":{"fr":"256 avis de performance au 29/08. Les tables les plus chargées en index inutilisés sont `library_partnerships` (6), `books` (5), `membership_payments` (4). Les 24 policies permissives en double portent toutes sur le rôle `authenticated` en `SELECT`, sur des tables centrales (`books`, `authors`, `exemplares`, `subjects`, `works`).","pt":"256 avisos de performance em 29/08. As tabelas mais carregadas de índices não usados são `library_partnerships` (6), `books` (5), `membership_payments` (4). As 24 policies permissivas duplicadas incidem todas sobre o papel `authenticated` em `SELECT`, em tabelas centrais (`books`, `authors`, `exemplares`, `subjects`, `works`)."},"w":{"fr":"Trois passes distinctes, à ne pas mélanger : fusionner les paires de policies permissives ; indexer les clés étrangères qui servent réellement ; ne supprimer un index inutilisé que si l'on comprend pourquoi il avait été créé.","pt":"Três passagens distintas, a não misturar: fundir os pares de policies permissivas; indexar as chaves estrangeiras que realmente servem; só suprimir um índice não usado se se compreender por que foi criado."},"y":{"fr":"À la volumétrie actuelle — 2 676 notices, 16 comptes — **rien de ceci ne se voit**. C'est un chantier de pré-montée en charge, différé à dessein depuis juillet. Le noter permet de ne pas le redécouvrir en urgence le jour où une bibliothèque arrive avec 100 000 notices.","pt":"Na volumetria atual — 2 676 registros, 16 contas — **nada disso se vê**. É um canteiro de pré-crescimento, adiado de propósito desde julho. Anotá-lo permite não redescobri-lo às pressas no dia em que uma biblioteca chegar com 100 000 registros."},"f":{"fr":["Les 24 avis de policies en double sont résorbés — c'est la passe la plus rentable.","Les clés étrangères des tables réellement écrites sont indexées.","Les index supprimés le sont avec la raison écrite."],"pt":["Os 24 avisos de policies duplicadas estão resolvidos — é a passagem mais rentável.","As chaves estrangeiras das tabelas realmente escritas estão indexadas.","Os índices suprimidos o são com o motivo escrito."]},"dep":{"fr":"À reprendre si une bibliothèque à gros fonds rejoint le réseau.","pt":"A retomar se uma biblioteca de grande acervo entrar na rede."},"r":["ETAT-lancement-consolide-2026-07-03 §2 item 7","Advisors performance du 29/08/2026"],"verif":{"fr":"31/08 — 254 avis : 167 index inutilisés, 38 clés étrangères non indexées, **25** tables en policies permissives en double (`book_reading_notes` s'y est ajoutée avec les notes de lecture), 14 tables sans clé primaire, 1 avis de connexions.","pt":"31/08 — 254 avisos: 167 índices sem uso, 38 chaves estrangeiras sem índice, **25** tabelas com policies permissivas em dobro (`book_reading_notes` entrou na lista), 14 sem chave primária."}},{"id":"B11","d":"B","p":"P3","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Comprendre `user_wishlist` : une ligne vivante pour 9 092 insertions","pt":"Compreender `user_wishlist`: uma linha viva para 9 092 inserções"},"v":{"fr":"**Mesuré le 30/08 : 1 ligne vivante, 9 092 insertions, 9 082 suppressions.** Le rapport n'est donc pas une fuite d'écriture mais un **cycle** : presque tout ce qui entre ressort. Une liste d'envies dont on retire ce qu'on ajoute, à raison de neuf mille allers-retours pour une seule ligne survivante, ne ressemble pas à un usage de lectrices — le réseau n'a pas ce volume.\n\nLa question n'est donc plus « qu'est-ce qui écrit », mais **« qu'est-ce qui écrit puis efface aussitôt »** : un test rejoué en boucle, un composant qui insère à chaque rendu et nettoie derrière lui, ou un chargement de page qui bascule l'état deux fois.","pt":"**Medido em 30/08: 1 linha viva, 9 092 inserções, 9 082 supressões.** A razão não é uma fuga de escrita mas um **ciclo**: quase tudo o que entra volta a sair. Nove mil idas e voltas para uma única linha sobrevivente não se parece com um uso de leitoras — a rede não tem esse volume.\n\nA pergunta já não é «o que escreve», mas **«o que escreve e apaga logo a seguir»**."},"w":{"fr":"Trouver ce qui écrit et efface : un test rejoué, un chargement de page qui insère puis annule, un composant React qui appelle la RPC à chaque rendu. Regarder `OPAC-W1`, dont la note dit « reste `WITH CHECK` ».","pt":"Encontrar o que escreve e apaga: um teste reexecutado, um carregamento de página que insere e depois cancela, um componente React que chama a RPC a cada renderização. Olhar `OPAC-W1`, cuja nota diz «resta `WITH CHECK`»."},"y":{"fr":"Neuf mille écritures pour une ligne, ce n'est pas un usage : c'est une boucle. Elle coûte peu aujourd'hui et coûtera exactement autant par utilisatrice le jour où il y en aura cent.","pt":"Nove mil escritas para uma linha não é um uso: é um laço. Custa pouco hoje e custará exatamente o mesmo por usuária no dia em que houver cem."},"f":{"fr":["La cause est identifiée et écrite.","Si c'est une boucle du front, elle est corrigée ; si c'est un test, la ligne est retirée du constat."],"pt":["A causa está identificada e escrita.","Se for um laço do front, está corrigido; se for um teste, a linha é retirada da constatação."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["REGISTRE §18 OPAC-W1","Relevé du 29/08/2026"],"verif":{"fr":"30/08 — `pg_stat_user_tables` : 1 ligne vivante, 9 092 insertions, 9 082 suppressions. Ce qui écrit puis efface reste inconnu.","pt":"30/08 — `pg_stat_user_tables`: 1 linha viva, 9 092 inserções, 9 082 supressões. O que escreve e depois apaga continua desconhecido."}},{"id":"B13","d":"B","p":"P3","s":"ouvert","e":"L","sk":["sql","sysadmin"],"t":{"fr":"Décider du sort des 221 migrations : squash ou pas","pt":"Decidir o destino das 221 migrações: squash ou não"},"v":{"fr":"221 migrations appliquées, dont la première est un `baseline_live` de **2,4 Mo** — le plus gros fichier du dépôt. Le squash est marqué « décidé, non commencé » depuis le 20/08, à une époque où le compte était de 146.","pt":"221 migrações aplicadas, das quais a primeira é um `baseline_live` de **2,4 MB** — o maior arquivo do repositório. O squash está marcado «decidido, não iniciado» desde 20/08, numa época em que a contagem era de 146."},"w":{"fr":"Soit reconstruire un `baseline` à partir du schéma courant et archiver les migrations antérieures, soit assumer la chaîne longue et documenter pourquoi. Le rejeu complet prend aujourd'hui environ 25 minutes, mesuré.","pt":"Ou reconstruir um `baseline` a partir do esquema atual e arquivar as migrações anteriores, ou assumir a cadeia longa e documentar por quê. A reexecução completa leva hoje cerca de 25 minutos, medido."},"y":{"fr":"Le risque du squash est entier : il réécrit la seule trace ordonnée de ce qui a été fait, et le harnais de tests SQL rejoue toute la chaîne à chaque fois. Ne pas le faire coûte du temps de CI ; le faire mal coûte la capacité à reconstruire. **Ne pas s'y engager avant que A2 ait réussi au moins une fois.**","pt":"O risco do squash é inteiro: reescreve o único rastro ordenado do que foi feito, e o arnês de testes SQL reexecuta toda a cadeia a cada vez. Não fazê-lo custa tempo de CI; fazê-lo mal custa a capacidade de reconstruir. **Não se comprometer antes que A2 tenha sido bem-sucedido pelo menos uma vez.**"},"f":{"fr":["Une décision écrite au REGISTRE, dans un sens ou dans l'autre.","Si squash : la reconstruction depuis le nouveau baseline a été éprouvée sur une machine tierce."],"pt":["Uma decisão escrita no REGISTRO, num sentido ou no outro.","Se squash: a reconstrução a partir do novo baseline foi testada numa máquina de terceiro."]},"dep":{"fr":"**Bloqué par A2.** Ne pas commencer avant.","pt":"**Bloqueado por A2.** Não começar antes."},"r":["ETAT-AVANCEMENT-multisessions","docs/schema/baseline_schema_2026-06-11.sql"],"verif":{"fr":"31/08 — 243 migrations appliquées : vingt-deux de plus qu'au 29/08. L'argument du squash grossit tout seul.","pt":"31/08 — 243 migrações aplicadas: vinte e duas a mais que em 29/08."}},{"id":"C1","d":"C","p":"P1","s":"ouvert","e":"S","sk":["sql","biblio"],"t":{"fr":"Faire entrer les 35 sujets SOLIDAIRES dans les migrations","pt":"Fazer os 35 assuntos SOLIDAIRES entrarem nas migrações"},"v":{"fr":"Vérifié le 29/08 : **35 sujets ont été créés en base le 27/08** et les alignements FICEDL sont passés de 51 à **98**. Mais `docs/drafts/20260828_sujets_solidaires_ficedl.sql` est toujours dans `docs/drafts/`, hors de `supabase/migrations/`. Une instance neuve n'aura donc pas ces sujets.","pt":"Verificado em 29/08: **35 assuntos foram criados no banco em 27/08** e os alinhamentos FICEDL passaram de 51 para **98**. Mas `docs/drafts/20260828_sujets_solidaires_ficedl.sql` continua em `docs/drafts/`, fora de `supabase/migrations/`. Uma instância nova, portanto, não terá esses assuntos."},"w":{"fr":"Comparer le contenu du brouillon à l'état réel de la base, en faire une migration idempotente qui ne recrée pas ce qui existe, et la ranger dans `supabase/migrations/`. Ou décider que ces sujets sont propres à une bibliothèque et n'ont pas à embarquer — mais l'écrire.","pt":"Comparar o conteúdo do rascunho ao estado real do banco, transformá-lo numa migração idempotente que não recrie o que existe, e guardá-la em `supabase/migrations/`. Ou decidir que esses assuntos são próprios de uma biblioteca e não devem embarcar — mas escrevê-lo."},"y":{"fr":"C'est exactement la question tranchée le 26/08 pour le thésaurus FICEDL : le vocabulaire fédéral embarque, les sujets locaux et leur alignement n'embarquent pas, parce que ce sont le fonds et l'acte de chaque collectif. Si cette règle vaut ici, il faut le dire ; sinon, la migration manque. Dans les deux cas, l'écart entre `docs/drafts/` et la base est une dette de traçabilité.","pt":"É exatamente a questão decidida em 26/08 para o tesauro FICEDL: o vocabulário federal embarca, os assuntos locais e seu alinhamento não embarcam, porque são o acervo e o ato de cada coletivo. Se essa regra vale aqui, é preciso dizê-lo; senão, a migração falta. Nos dois casos, o desvio entre `docs/drafts/` e o banco é uma dívida de rastreabilidade."},"f":{"fr":["`docs/drafts/20260828_sujets_solidaires_ficedl.sql` a disparu : soit devenu migration, soit archivé avec la raison.","Le compte de contrôle est écrit : 89 sujets, 98 alignements au 29/08.","Rappel : `subject_ficedl_links.match_type` n'accepte que `exact` et `close` — il n'y a pas de `broad`."],"pt":["`docs/drafts/20260828_sujets_solidaires_ficedl.sql` desapareceu: ou virou migração, ou foi arquivado com o motivo.","A contagem de controle está escrita: 89 assuntos, 98 alinhamentos em 29/08.","Lembrete: `subject_ficedl_links.match_type` só aceita `exact` e `close` — não existe `broad`."]},"dep":{"fr":"Lié à **C2** (import du fonds SOLIDAIRES).","pt":"Ligado a **C2** (importação do acervo SOLIDAIRES)."},"r":["REPRISE_claude_code_2026-08-27 chantier 2","REGISTRE §30 THES"],"verif":{"fr":"31/08 — 89 sujets et 98 alignements en base ; `docs/drafts/20260828_sujets_solidaires_ficedl.sql` est toujours hors de `supabase/migrations/`. Le constat tient tel quel.","pt":"31/08 — 89 assuntos e 98 alinhamentos no banco; o SQL continua em `docs/drafts/`, fora das migrações."}},{"id":"C2","d":"C","p":"P1","s":"bloque","e":"M","sk":["biblio","sql"],"t":{"fr":"Importer le fonds SOLIDAIRES par l'outil d'import, et consigner ce qui casse","pt":"Importar o acervo SOLIDAIRES pela ferramenta de importação, e registrar o que quebra"},"v":{"fr":"1 685 notices dans `SOLIDAIRES_import_test.csv`. **Constat corrigé le 31/08 : le fichier a bel et bien été confronté à l'importeur.** `book_drafts` porte 1 673 brouillons de source `SOLIDAIRES_import_v2.csv`, créés en un seul lot le 29/08 à 1 h 48 — la nuit précédant l'écriture du constat « jamais confrontés ». Tous sont à l'état `draft`, **aucun n'est publié** : le catalogue public n'est pas touché. La décision de Xavier (29/08) reste entière pour la suite : pas de promotion tant que la candidature de SOLIDAIRES n'est pas acceptée à plusieurs (G7). Ce qui reste de l'item n'est donc plus « importer », mais consigner ce que l'import a cassé, puis promouvoir après l'admission.","pt":"1 685 registros em `SOLIDAIRES_import_test.csv`. **Constato corrigido em 31/08: o arquivo foi sim confrontado com o importador.** `book_drafts` traz 1 673 rascunhos da fonte `SOLIDAIRES_import_v2.csv`, criados num único lote na noite anterior à escrita do constato « nunca confrontados ». Todos `draft`, **nenhum publicado**: o catálogo público não foi tocado. A decisão de Xavier (29/08) permanece: nenhuma promoção antes da admissão (G7). O que resta não é mais « importar », mas consignar o que quebrou e promover depois da admissão."},"w":{"fr":"Adapter les en-têtes au format réellement attendu (environ une heure), faire passer le fichier **par l'outil d'import du dépôt et non par des `INSERT` à la main**, relire une vingtaine de fiches au hasard, puis faire une démonstration en visio écran partagé.","pt":"Adaptar os cabeçalhos ao formato realmente esperado (cerca de uma hora), passar o arquivo **pela ferramenta de importação do repositório e não por `INSERT` à mão**, revisar umas vinte fichas ao acaso, e depois fazer uma demonstração em videoconferência com tela compartilhada."},"y":{"fr":"L'objet reste autant d'éprouver l'importeur que d'obtenir les notices : **le livrable le plus utile du chantier est la liste de ce qui casse, de ce qui est mal deviné et de ce qui se perd** — pas les 1 685 fiches. Mais faire entrer un fonds avant que le réseau ait dit oui reviendrait à trancher par le fait ce qu'on dit vouloir trancher à plusieurs. C'est le même raisonnement qui interdisait de créer la fiche bibliothèque ; il s'étend maintenant au lot lui-même.","pt":"O objetivo continua sendo tanto testar o importador quanto obter os registros: **a entrega mais útil do canteiro é a lista do que quebra, do que é mal adivinhado e do que se perde** — não as 1 685 fichas. Mas fazer entrar um acervo antes de a rede ter dito sim equivaleria a decidir pelo fato o que se diz querer decidir em conjunto. É o mesmo raciocínio que proibia criar a ficha de biblioteca; estende-se agora ao próprio lote."},"f":{"fr":["**L'admission a été prononcée à plusieurs (G7) avant que le fichier soit touché.**","Le lot est passé par l'outil d'import du dépôt, pas par des `INSERT` à la main.","Un compte rendu écrit dit ce qui a cassé, ligne par ligne quand c'est possible.","Vingt fiches tirées au hasard ont été relues.","**Aucune coquille d'accent de la source n'a été corrigée en silence** : les corrections vivent dans `assunto_local_sugerido`."],"pt":["**A admissão foi pronunciada em conjunto (G7) antes de o arquivo ser tocado.**","O lote passou pela ferramenta de importação do repositório, não por `INSERT` à mão.","Um relatório escrito diz o que quebrou, linha por linha quando possível.","Vinte fichas sorteadas ao acaso foram revisadas.","**Nenhum erro de acento da fonte foi corrigido em silêncio**: as correções vivem em `assunto_local_sugerido`."]},"dep":{"fr":"**Bloqué par G7**, lui-même bloqué par **A1**. Rien ne bouge tant que le réseau n'a qu'un seul administrateur.","pt":"**Bloqueado por G7**, ele mesmo bloqueado por **A1**. Nada se move enquanto a rede tiver um único administrador."},"r":["REPRISE_claude_code_2026-08-27 chantier 2","CALENDRIER_bologne_2026-08-27"],"verif":{"fr":"31/08 — `book_drafts` : 1 673 lignes de source `SOLIDAIRES_import_v2.csv`, toutes créées le 29/08 à 1 h 48 en un seul lot, toutes `draft`, 0 publiée, 0 rattachée à un périodique. Le premier critère de fin (« l'admission avant que le fichier soit touché ») est caduc dans sa lettre : le fichier a été touché — mais rien n'est entré au catalogue.","pt":"31/08 — `book_drafts`: 1 673 linhas, todas `draft`, 0 publicadas. O primeiro critério (« admissão antes de tocar o arquivo ») caducou na letra: o arquivo foi tocado — mas nada entrou no catálogo."}},{"id":"C3","d":"C","p":"P1","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Mener la revue humaine des autorités : patronymes, casse, titres","pt":"Conduzir a revisão humana das autoridades: sobrenomes, caixa, títulos"},"v":{"fr":"Les 19 migrations `conventions_*` sont appliquées depuis le 21/08 : les référentiels sont normalisés, les mécaniques sûres ont été passées, la file de vérification existe et l'application permet d'y travailler. **Ce qui reste est la part qu'aucune machine ne fait.**","pt":"As 19 migrações `conventions_*` estão aplicadas desde 21/08: os referenciais estão normalizados, as mecânicas seguras foram passadas, a fila de verificação existe e o aplicativo permite trabalhar nela. **O que resta é a parte que nenhuma máquina faz.**"},"w":{"fr":"Reprendre les trois tables de revue du schéma `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — et les traiter fiche par fiche depuis l'Atelier autorités.","pt":"Retomar as três tabelas de revisão do esquema `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — e tratá-las ficha por ficha a partir da Oficina de autoridades."},"y":{"fr":"Sur les 22 doubles patronymes hispaniques signalés automatiquement, **trois sont des faux positifs connus** (Mechoso, Borges, Marcos) : 14 % d'erreur. Et sur les 13 points d'accès sur particule, **quatre sont corrects** (Van der Walt, De Amicis, Di Paolo, De Greef). Un script qui « finirait » ce travail introduirait des fautes dans un catalogue qui n'en a pas.","pt":"Dos 22 duplos sobrenomes hispânicos apontados automaticamente, **três são falsos positivos conhecidos** (Mechoso, Borges, Marcos): 14 % de erro. E dos 13 pontos de acesso sobre partícula, **quatro estão corretos** (Van der Walt, De Amicis, Di Paolo, De Greef). Um script que «terminasse» esse trabalho introduziria erros num catálogo que não os tem."},"f":{"fr":["Les trois tables sont vidées par validation humaine, pas par script.","**Interdiction absolue** : décommenter le SQL d'application, le compléter, ou passer `valide = true` en masse.","Les 9 points d'accès posés sur un suffixe de filiation — type `FILHO, Fábio Luz` — sont traités en premier : l'audit les donne pour **le défaut le plus grave du lot**."],"pt":["As três tabelas são esvaziadas por validação humana, não por script.","**Proibição absoluta**: descomentar o SQL de aplicação, completá-lo, ou passar `valide = true` em massa.","Os 9 pontos de acesso postos sobre um sufixo de filiação — tipo `FILHO, Fábio Luz` — são tratados primeiro: a auditoria os dá como **o defeito mais grave do lote**."]},"dep":{"fr":"Se fait dans l'application, sans migration. C'est un chantier de bibliothéconomie, ouvert à qui sait cataloguer.","pt":"Faz-se no aplicativo, sem migração. É um canteiro de biblioteconomia, aberto a quem sabe catalogar."},"r":["AUDIT_conventions_catalographiques_2026-08-20","REGISTRE §37 CONV"]},{"id":"C4","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Renseigner les pays manquants sur 722 fiches d'autorité","pt":"Preencher os países ausentes em 722 fichas de autoridade"},"v":{"fr":"**722 fiches sur 1 305 (55 %) n'ont pas de `country`.** Or c'est `country` qui pilote la règle d'entrée du nom : sans lui, la détection des doubles patronymes hispaniques ne voit qu'une fraction des cas. Les 22 signalements sont un **plancher**, pas un total.","pt":"**722 fichas de 1 305 (55 %) não têm `country`.** Ora, é `country` que comanda a regra de entrada do nome: sem ele, a detecção dos duplos sobrenomes hispânicos só vê uma fração dos casos. Os 22 apontamentos são um **piso**, não um total."},"w":{"fr":"Renseigner `country` par lots, à partir des notices, des sources externes déjà branchées (Wikidata, VIAF) et de la connaissance du fonds. Puis rejouer la détection des patronymes.","pt":"Preencher `country` por lotes, a partir dos registros, das fontes externas já conectadas (Wikidata, VIAF) e do conhecimento do acervo. Depois reexecutar a detecção dos sobrenomes."},"y":{"fr":"C'est le prérequis dur de toute la chaîne de conventions : `CONV-7` fait de `country` en ISO 3166-1 α-2 une condition, et `CONV-3` fait piloter la casse par la langue. Un catalogue à 55 % sans pays applique ses propres règles à moitié.","pt":"É o pré-requisito duro de toda a cadeia de convenções: `CONV-7` faz de `country` em ISO 3166-1 α-2 uma condição, e `CONV-3` faz a caixa ser comandada pela língua. Um catálogo com 55 % sem país aplica as próprias regras pela metade."},"f":{"fr":["La proportion de fiches sans `country` est descendue sous 20 %.","La détection des doubles patronymes a été rejouée et la nouvelle liste est passée en revue humaine."],"pt":["A proporção de fichas sem `country` caiu abaixo de 20 %.","A detecção dos duplos sobrenomes foi reexecutada e a nova lista passou por revisão humana."]},"dep":{"fr":"Prérequis de la seconde passe de **C3**.","pt":"Pré-requisito da segunda passagem de **C3**."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A5","REGISTRE §37 CONV-7"],"verif":{"fr":"31/08 — 726 fiches sur 1 305 sans `country` (55,6 %) : quatre de plus qu'au 29/08. La dette avance plus vite que sa résorption.","pt":"31/08 — 726 de 1 305 fichas sem `country` (55,6 %): quatro a mais que em 29/08."}},{"id":"C5","d":"C","p":"P2","s":"decision","e":"S","sk":["biblio","sql"],"t":{"fr":"Trancher le sort du champ libre `books.autor`","pt":"Decidir o destino do campo livre `books.autor`"},"v":{"fr":"`CONV-O3` est ouvert : déprécier `books.autor` maintenant, ou à l'Atelier ? Le champ coexiste avec la table `authors` et porte les mêmes défauts **en pire** — on y trouve `identificado, Não`, `REICH, Hilhem`, `Rosamund Bartlett (Org.)`. L'audit du 20/08 l'a explicitement laissé hors périmètre : sa dette n'est pas chiffrée.","pt":"`CONV-O3` está aberto: depreciar `books.autor` agora, ou na Oficina? O campo coexiste com a tabela `authors` e carrega os mesmos defeitos **piores** — encontram-se lá `identificado, Não`, `REICH, Hilhem`, `Rosamund Bartlett (Org.)`. A auditoria de 20/08 o deixou explicitamente fora do perímetro: sua dívida não está quantificada."},"w":{"fr":"D'abord chiffrer : combien de notices ont un `autor` sans contributeur lié, et à quoi ressemble le contenu. Puis trancher : dépréciation immédiate avec migration des valeurs récupérables, ou conservation comme forme transcrite au sens de `P3` des périodiques.","pt":"Primeiro quantificar: quantos registros têm um `autor` sem contribuidor vinculado, e como é o conteúdo. Depois decidir: depreciação imediata com migração dos valores recuperáveis, ou conservação como forma transcrita no sentido do `P3` dos periódicos."},"y":{"fr":"Deux vérités concurrentes sur l'auteur d'un livre, c'est le contraire de `DOC-CONV-1` (« une seule vérité en base, plusieurs rendus »). Tant que le champ vit, chaque écran doit choisir lequel afficher, et les deux divergent.","pt":"Duas verdades concorrentes sobre o autor de um livro é o contrário de `DOC-CONV-1` («uma só verdade no banco, várias renderizações»). Enquanto o campo viver, cada tela precisa escolher qual exibir, e os dois divergem."},"f":{"fr":["~~La dette est chiffrée~~ — 31/08 : 2 653 `autor` non vides, 1 629 distincts, 231 livres sans aucun lien `authors`.","Une décision est inscrite au REGISTRE, dans un sens ou dans l'autre.","Si dépréciation : le champ n'est plus écrit par aucun formulaire."],"pt":["~~A dívida está quantificada~~ — 31/08: 2 653 `autor` não vazios, 1 629 distintos, 231 livros sem vínculo com `authors`.","Uma decisão está inscrita no REGISTRO, num sentido ou no outro.","Se depreciação: o campo não é mais escrito por nenhum formulário."]},"dep":{"fr":"Renvoie à `INV-4`.","pt":"Remete a `INV-4`."},"r":["REGISTRE §37 CONV-O3","AUDIT_conventions_catalographiques_2026-08-20"],"verif":{"fr":"31/08 — dette chiffrée en lecture seule : 2 653 livres sur 2 659 portent un `autor` non vide, 1 629 valeurs distinctes, et **231 livres n'ont aucun lien vers `authors`** — pour eux, le champ libre est aujourd'hui la seule information d'auteur. Le déprécier sans reprise les rendrait anonymes.","pt":"31/08 — dívida quantificada: 2 653 livros de 2 659 com `autor` não vazio, 1 629 valores distintos, e **231 livros sem nenhum vínculo com `authors`** — para eles o campo livre é a única informação de autoria."}},{"id":"C6","d":"C","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Livrer les trois assistances de saisie prévues par la spec des conventions","pt":"Entregar as três assistências de digitação previstas pela spec das convenções"},"v":{"fr":"La base sait normaliser ; l'interface de saisie n'assiste pas encore. Trois dispositifs sont spécifiés et non livrés : l'assistant de découpage du nom (§7.1), le bouton « Normalizar maiúsculas » avec aperçu (§7.2), et la file de contrôles de cohérence en arrière-plan (§7.3).","pt":"O banco sabe normalizar; a interface de digitação ainda não assiste. Três dispositivos estão especificados e não entregues: o assistente de separação do nome (§7.1), o botão «Normalizar maiúsculas» com pré-visualização (§7.2), e a fila de controles de coerência em segundo plano (§7.3)."},"w":{"fr":"Trois écrans, dans cet ordre de valeur : le bouton de normalisation de casse (le plus simple, actif seulement si la langue est renseignée) ; l'assistant de découpage, qui propose mot par mot avec un bouton « Corrigir » et une explication d'une ligne ; la file de contrôles, qui signale sans bloquer.","pt":"Três telas, nesta ordem de valor: o botão de normalização de caixa (o mais simples, ativo só se a língua estiver preenchida); o assistente de separação, que propõe palavra por palavra com um botão «Corrigir» e uma explicação de uma linha; a fila de controles, que sinaliza sem bloquear."},"y":{"fr":"C'est la contrainte de conception la plus ferme du projet : **toute règle doit être soit invisible parce que calculée, soit assistée parce que proposée et confirmée, jamais un savoir préalable exigé à la saisie.** Les personnes qui cataloguent ne sont ni bibliothécaires ni informaticiennes. Sans ces trois écrans, les conventions restent une doctrine que seul leur auteur sait appliquer.","pt":"É a restrição de concepção mais firme do projeto: **toda regra deve ser ou invisível porque calculada, ou assistida porque proposta e confirmada, nunca um saber prévio exigido na digitação.** As pessoas que catalogam não são bibliotecárias nem informáticas. Sem essas três telas, as convenções continuam uma doutrina que só seu autor sabe aplicar."},"f":{"fr":["Les trois dispositifs existent et **aucun n'est bloquant**.","Chaque proposition est refusable, avec l'original conservé.","Les libellés existent dans les dix locales en une seule passe."],"pt":["Os três dispositivos existem e **nenhum é bloqueante**.","Cada propo
