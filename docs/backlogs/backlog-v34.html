letada em 28/09 (`038efa8b`): a diferença das « novidades » vinha da obra 2037 editada entre dois levantamentos. O limite das facetas: item E29."}],["C12","2026-09-28",{"fr":"**Clos le jour même, 28/09 — la recherche de métadonnées montre une candidate par source, pas une par ISBN.** Constat de Xavier à l'écran : pour l'ISBN 8432302120, les pastilles disaient BNE 2, BnF 2, ICCU 2, LoC 1, Open Library 2, et la liste des candidates n'en montrait qu'une (Siglo XXI 1976, quand la notice porte 1991). Cause dans `catalog_metadata_lookup` : `dedupeAndRank` prenait l'ISBN seul comme clé — en recherche par ISBN toutes les sources rendent le même, tout se repliait sur la mieux notée — et la liste fusionnée était tronquée à `maximumRecords` (8), qui borne déjà chaque source. Correctif en deux commits (`78685511`, `16a4dcb4`) : la clé porte la source, l'identifiant de la notice chez elle (001/035, BID, clé Open Library, QID), l'ISBN, le titre, le premier contributeur et l'année — seule la même notice rendue deux fois se replie ; plus de troncature. Banc `src/tests/catalog-metadata-lookup-candidates.test.js` : le vrai fichier transpilé en mémoire, BNE et LoC stubées, cinq cas, 3/4 rouges sur le code d'avant. Vérifié en production à 16 h 16 dans l'onglet de Xavier : 7 lignes pour 7 résultats annoncés (BNE 2, BnF 2, ICCU 2, LoC 1 ; Open Library avait expiré ce coup-ci). E6 lot 3 (`LookupPanel`) n'y est pour rien : le panneau affiche ce que la fonction rend, et le défaut existait avant l'extraction.","pt":"**Fechado no mesmo dia, 28/09 — a pesquisa de metadados mostra uma candidata por fonte, não uma por ISBN.** Constatação de Xavier na tela: para o ISBN 8432302120, os marcadores diziam BNE 2, BnF 2, ICCU 2, LoC 1, Open Library 2, e a lista mostrava só uma candidata (Siglo XXI 1976, quando o registro traz 1991). Causa em `catalog_metadata_lookup`: `dedupeAndRank` usava o ISBN sozinho como chave, e a lista fundida era truncada em `maximumRecords` (8), que já limita cada fonte. Correção em dois commits (`78685511`, `16a4dcb4`): a chave traz a fonte, o identificador do registro nela, o ISBN, o título, o primeiro contribuidor e o ano — só o mesmo registro devolvido duas vezes se dobra; sem truncamento. Bancada `catalog-metadata-lookup-candidates.test.js` (cinco casos, 3/4 vermelhos no código anterior). Verificado em produção às 16h16 na aba de Xavier: 7 linhas para 7 resultados anunciados."}],["H27","2026-09-29",{"fr":"**Clos le 29/09 sur décision de Xavier.** Les trois critères : (1) la suite SQL `aller_retour_pmb_tests` tourne en CI, pertes acceptées écrites et figées notice par notice (`tests/pmb/aller-retour-pertes.json`) ; (2) l'export tiré de la base, réimporté dans un PMB 8.1.1.1 vidé de son jeu de test (`tests/pmb/bilans/`) : 46 exemplaires sur 46, 3 bulletins et 15 dépouillements sur 3 et 15, 61 responsabilités, 57 auteurs, 36 éditeurs ; les notices passent de 62 à 64, les deux pseudo-notices par lesquelles PMB exporte les exemplaires d'un bulletin et la notice propre du bulletin 278 revenant en périodiques ; (3) le tableau de couverture, engendré depuis le code et les bilans (`docs/interop/couverture-pmb.md`). Déployé le 29/09 (`2348cb86`, migrations `20260929102719` et `20260929103533`, md5 de production égal au banc). Ce qui ne revient pas — le type, la section et le code statistique des exemplaires — passe à **H29**. **Le chemin** (fiche à `66943e5a`). *(0)* Depuis le 26/09, un pont vitest (`src/tests/deno-tests-pont.test.js`, `66750198`) joue tels quels les tests Deno du parseur MARC et de l'export, que la CI ne lançait nulle part ; il exige le compte exact : 16 au départ, 75 au 29/09. *(1)* Tenu le 28/09 (`2ee5f7a7`, revue `a692a75e`, migration `20260928170909`) ; la preuve a trouvé cinq défauts, corrigés : un lot MARC ne se publiait pas (langue brute contre `books_idioma_bcp47_chk`), les noms grecs, cyrilliques, arabes ou chinois passaient pour « Collectif », les mots-clés 610/653 ressortaient en 606, l'ISSN d'un article sortait en 011, une responsabilité secondaire perdait son niveau (701/702, 711/712). *(2)-(3)* Tenus par `7dbd9f11`, puis deux revues contradictoires : `466324aa` range les périodiques avant les articles (7 → 15 articles rattachés sur 15), écrit `$r uu`/`$q u` en 995 et ne lit plus l'ISSN d'un périodique PMB comme un ISBN ; `2348cb86` dit les deux réglages de PMB qui décident de tout (« Générer les liens entre notices ? » à Oui, sinon 0 bulletin ; « Tenir compte des notices d'autorités » à Non dans PMB 8.1.1.1) et, par `20260929102719`, ne prend plus, dans un import MARC, les fascicules d'une revue ni les tomes d'un ensemble pour des doublons (58 → 64 brouillons), ni un article pour sa revue par l'ISSN ; `2f488790` (`IMP-25`) : une notice MARC sans exemplaire n'en reçoit plus d'automatique (PMB en refusait 15, sur des articles). Vérifié le 29/09 : `publish_book_draft`, `fn_flag_intra_run_duplicates` et `fn_match_partner_catalog_row` au md5 du banc, ces deux dernières fermées à anon et à authenticated, les deux EF modifiées à 401 sans jeton ; avant la poussée, vitest 1 518, SQL 149/149.","pt":"**Fechado em 29/09 por decisão de Xavier.** Os três critérios: (1) a suíte SQL `aller_retour_pmb_tests` roda na CI, perdas aceitas escritas e congeladas; (2) o export tirado da base, reimportado num PMB 8.1.1.1 esvaziado: 46 exemplares de 46, 3 fascículos e 15 artigos, 61 responsabilidades, 57 autores, 36 editoras; os registros passam de 62 a 64 (as pseudo-notícias de fascículo do PMB voltam como periódicos); (3) a tabela de cobertura gerada a partir do código e dos balanços (`docs/interop/couverture-pmb.md`). Implantado em 29/09 (`2348cb86`). O que não volta — tipo, seção e código estatístico dos exemplares — passa para **H29**. **O caminho** (ficha em `66943e5a`). (0) Desde 26/09, uma ponte vitest (`src/tests/deno-tests-pont.test.js`, `66750198`) roda como estão os testes Deno do parser MARC e do export, que a CI não rodava; exige a contagem exata: 16 no início, 75 em 29/09. (1) Cumprido em 28/09 (`2ee5f7a7`, revisão `a692a75e`, migração `20260928170909`): a prova achou cinco defeitos, corrigidos — lote MARC impublicável (língua bruta contra `books_idioma_bcp47_chk`), nomes não latinos tomados por «Collectif», palavras-chave 610/653 devolvidas em 606, ISSN de artigo em 011, nível 701/702 perdido. (2)-(3) Cumpridos por `7dbd9f11` e duas revisões contraditórias: `466324aa` (periódicos antes dos artigos, 7 → 15 de 15; `$r uu`/`$q u` na 995); `2348cb86` (os dois ajustes do PMB que decidem tudo: «Gerar os vínculos» em Sim, «autoridades» em Não no PMB 8.1.1.1; e, por `20260929102719`, fascículos e tomos não são mais duplicatas numa importação MARC, 58 → 64 rascunhos); `2f488790` (`IMP-25`). Verificado em 29/09: as três funções no md5 do banco, as duas da aproximação fechadas a anon e a authenticated, as duas EF a 401 sem token; vitest 1 518, SQL 149/149."}],[{"fr":"Couvertures : la chaîne réparée, une couverture par édition, le lot, la photo en rayon (CAPAS-1 à 6)","pt":"Capas: a cadeia consertada, uma capa por edição, o lote, a foto na estante (CAPAS-1 a 6)"},"2026-09-27",{"fr":"**Livré le 27/09, suite le 28/09** (REGISTRE §43 `CAPAS-1` à `CAPAS-6`, `282b4e32` et `af052382` ; note `LIVRAISON_capas_2026-09-27.md`). La voie ISBN de `cover_lookup` répondait 404 chez Open Library depuis une date inconnue, et l'écran disait « aucune couverture trouvée ». **La chaîne** : URL réparée, Inventaire ajouté, titre à défaut d'ISBN (`2a80d43b` : 0 → 85 couvertures sur les 267 notices sans capa qui portent un ISBN) ; la source en panne nommée à l'écran (`fd5d2f0e`) ; provenance et licence par paire, à la publication et à la reprise (`76c6ae3f`, `20260927130518`, `capas_provenance_tests` 7 ; 0 capa attribuée sur 250 avant) ; une sonde horaire des sources, incident `capas_sources` (`0821035a`, `20260927130745`), qui a trouvé à son premier passage le trait d'union lu comme un opérateur (`6a76aa23`). **L'édition** : une candidate dit l'édition que son ISBN désigne, la recherche par titre vise l'édition et non l'œuvre (`027e6903`, `63803dea`) ; un ISBN d'ensemble vaut pour chacun de ses volumes (`3e1a3991`, `20260927164619`, `isbn_volumes_tests` 6 ; `123f20e6`). **Le lot** : `cover-batch` propose dans `cover_proposals` (cron `anarbib-capas-lot`), une personne tranche à l'écran « Couvertures proposées » (`ce2b759d`, `d37111b2`, `c89e1099`, `7dc13e5c`, `20260927180120`, `capas_lot_tests` 20) ; premier passage en production à 18 h 37 UTC : 24 notices, 10 à revoir. **La photo en rayon** : onglet « Couvertures » du Painel (`e6fd1dc2`, `20260927182008`, `capas_photo_tests` 14). **28/09** — une capa neuve a une adresse neuve, sans `upsert`, contre le cache d'une heure du bucket (`d7f65c54`, `CAPAS-6`). La note de livraison attribue l'édition à `e046157f` (une retouche i18n) et le lot à `c89e1099` (un test) : lire `027e6903`/`63803dea` et `ce2b759d`/`7dc13e5c`. **Reste, hors outil** : les versions remplacées restent au bucket tant que `scripts/purge-orphelins-covers.py` n'est pas lancé à la main (classe B) ; aucune migration n'a rendu de provenance aux capas d'avant le 27/09 (**C16**) ; les données fautives relevées (six années impossibles, un ISBN à clé fausse) se corrigent au formulaire, livre en main (**C15**). `6a76aa23` corrige aussi un chiffre publié par `0821035a` : contre l'ancien `health-probe`, 5 cas de mutation sur 6 tombent, et non 6 ; les contrôles de mutation de `2a80d43b`, `fd5d2f0e` et `0821035a` ont été refaits octet pour octet. Les anciennes couvertures non purgées : item J11.","pt":"**Entregue em 27/09, continuação em 28/09** (REGISTRO §43 `CAPAS-1` a `CAPAS-6`; nota `LIVRAISON_capas_2026-09-27.md`). A via ISBN de `cover_lookup` respondia 404 na Open Library desde data desconhecida. A cadeia consertada: URL, Inventaire, título na falta de ISBN (`2a80d43b`: 0 → 85 capas nos 267 registros sem capa com ISBN); fonte fora do ar indicada na tela (`fd5d2f0e`); procedência e licença em par (`76c6ae3f`, `20260927130518`); sonda horária `capas_sources` (`0821035a`, `6a76aa23`). Uma capa é a de uma edição (`027e6903`, `63803dea`; volumes: `3e1a3991`, `123f20e6`). O lote `cover-batch` propõe em `cover_proposals`, uma pessoa decide na tela «Capas sugeridas» (`ce2b759d`, `d37111b2`, `c89e1099`, `7dc13e5c`, `capas_lot_tests` 20); a foto na estante pela aba «Capas» do Painel (`e6fd1dc2`, `capas_photo_tests` 14). Em 28/09, uma capa nova tem um endereço novo (`d7f65c54`, `CAPAS-6`). A nota de entrega cita `e046157f` e `c89e1099` por engano: ler `027e6903`/`63803dea` e `ce2b759d`/`7dc13e5c`. **Fica fora da ferramenta**: as versões substituídas ficam no bucket até `purge-orphelins-covers.py` ser executado manualmente; as capas anteriores a 27/09 seguem sem procedência (**C16**); os dados errados levantados se corrigem no formulário, com o livro na mão (**C15**). `6a76aa23` corrige também um número publicado por `0821035a`: 5 casos de mutação em 6 caem, não 6. Capas antigas não purgadas: item J11."}],[{"fr":"pt-BR parle brésilien","pt":"O pt-BR fala brasileiro"},"2026-09-27",{"fr":"**Livré le 27/09.** **L'app** : 78 valeurs de `pt-BR.json` au vocabulaire du Portugal réécrites (« ficheiro » → « arquivo », « Guardar » → « Salvar », « gerir » → « gerenciar »…), garde `PT_EUROPEU` (`faae6e0e`) ; puis 91 valeurs françaises ou calquées, sur décisions de Xavier du 27/09 au soir : « cota » → « número de chamada », « notícia » → « ficha », « flux » → « feed », PEB → EEB, « import » → « importação » (`dfa622f5`, garde `FRANCES_EM_PT` ; `e046157f` pour une « Notícia do volume » oubliée) ; le document Communs « Cotação BLMF » devient « Números de chamada BLMF ». **Les courriels** : 16 chaînes (`49047ae3`, `PT_EUROPEU` partagée avec `mail-ptbr-voce.test.js`) ; le texte en dur du rapport hebdomadaire de la bibliothèque (`6f762f8f`), qui pose la liste fermée `TEXTE_EN_DUR_PT` : huit fichiers des Edge Functions rédigés en pt-BR seul, relus par `TU_EUROPEU`, `PT_EUROPEU` et `FRANCES_EM_PT` ; spec alignée (`d997ada7`). Angles morts déclarés dans les gardes : les mots qui existent au Brésil dans un autre sens (« gerir », « Guardar »), les calques en mots portugais (« notícia », « concernida »). **Reste** : ces décisions de vocabulaire ne sont pas au REGISTRE (`DOC-ADDR-1` ne traite que du registre d'adresse) — porté par **E25**. Le 27/09 au soir, `28f45047` a élargi le motif `TU_EUROPEU`, partagé par les gardes de `pt-BR.json` et des courriels : 154 fautes vues sur 163 (courriels 58 sur 61), sans faux positif.","pt":"**Entregue em 27/09.** No app, 78 valores de `pt-BR.json` com vocabulário de Portugal reescritos («ficheiro» → «arquivo», «Guardar» → «Salvar», «gerir» → «gerenciar»; `faae6e0e`, guarda `PT_EUROPEU`), depois 91 valores franceses ou decalcados, por decisão de Xavier: cota → «número de chamada», notícia → ficha, flux → feed, PEB → EEB, import → importação (`dfa622f5`, guarda `FRANCES_EM_PT`; `e046157f`). Nos e-mails, 16 strings (`49047ae3`) e o texto escrito no código do relatório semanal da biblioteca (`6f762f8f`), que cria a lista fechada `TEXTE_EN_DUR_PT` (oito arquivos das Edge Functions escritos só em pt-BR, lidos pelas três guardas). **Falta**: levar essas decisões de vocabulário ao REGISTRO (**E25**). Em 27/09 à noite, `28f45047` ampliou o padrão `TU_EUROPEU`: 154 erros vistos em 163 (e-mails 58 em 61), sem falso positivo."}],[{"fr":"Fusion de notices : rien ne se perd, la référence d'un exemplaire suit son fonds (DEDUP-11 à 14)","pt":"Fusão de registros: nada se perde, a referência de um exemplar segue seu acervo (DEDUP-11 a 14)"},"2026-09-28",{"fr":"**Clos le 28/09** (REGISTRE `DEDUP-11` à `DEDUP-14`, note `LIVRAISON_fusion-notices_2026-09-28.md`). Relevé par Xavier le 27/09 au soir : `suggest_editions_for_book` levait 42702 à chaque appel depuis sa création le 20/06, et aucun test ne l'appelait ; `911ad1db` (`20260927194141`, `editions_suggerees_tests` 4) la répare et fusionne BTL-TL-000880 dans BTL-TL-000881 sans rien perdre (`merge_log` 149). `11da0df8` (`20260928100501`) : une seule `fn_fusion_notices` pour `merge_book` et `merge_book_with_fields` — doublon entier dans `merge_log`, sujets et contributeur·rices repris, brouillons ouverts du doublon écartés, tout ce qui le désignait rattaché — et trois déclencheurs tiennent `exemplares.bib_ref` égal à la référence du fonds : 43 exemplaires réalignés (les 32 autres des « 75 » étaient justes). Suite `fusion_notices_complete_tests` 15/15 au banc ; en production à 10 h 49 UTC, déclencheurs présents, 0 exemplaire décalé. `40cb978f` : « Même édition : fusionner dans cette notice », chemin manuel pour une paire que la détection écarte (`DEDUP-13`, la règle des années reste stricte). BTL-TL-000881 corrigée (`96b4a104`, `bcd36f9d`) : l'exemplaire BLMF CCLA.2026.93 créé par erreur est retiré, « 1ª edição, 2010 » et « 2ª edição, 2011 » sont notées sur les deux exemplaires BTL ; au passage, le formulaire gardait les éditions suggérées de la notice précédente, désormais remises à zéro. Les deux autorités de Cristina Escrivá Moscardó réunies à l'écran (`merge_log` 150, `3d96a337`). Le soir, `8e0fe538` (`20260928163920`, `DEDUP-14`) : un même ISBN, en ISBN-10 ou en ISBN-13, est une même édition (`fn_isbn_coeur`), et un éditeur ne change pas pour un mot générique (`fn_meme_editeur`) ; `editions_distinctes_tests` 8 ; quatre paires démasquées (000504~000727, 000301~BLMF 0000054, 001525~BLMF 0000258, 001808~BLMF 0000060).","pt":"**Encerrado em 28/09** (REGISTRO `DEDUP-11` a `DEDUP-14`, nota `LIVRAISON_fusion-notices_2026-09-28.md`). `suggest_editions_for_book` dava erro 42702 a cada chamada desde 20/06; `911ad1db` a conserta e funde BTL-TL-000880 em BTL-TL-000881 sem perda (`merge_log` 149). `11da0df8` (`20260928100501`): uma só `fn_fusion_notices` para as duas fusões, nada se perde, e três gatilhos mantêm `exemplares.bib_ref` igual à referência do acervo — 43 exemplares realinhados; `fusion_notices_complete_tests` 15/15, gatilhos verificados em produção. `40cb978f`: «Mesma edição: fundir nesta ficha» (`DEDUP-13`). BTL-TL-000881 corrigida (`96b4a104`, `bcd36f9d`), e o formulário não guarda mais as edições sugeridas do registro anterior. `8e0fe538` (`DEDUP-14`): um mesmo ISBN, de 10 ou 13 dígitos, é uma mesma edição; quatro pares desmascarados."}],[{"fr":"Sujets effacés par la reprise d'une notice (THES-5)","pt":"Assuntos apagados pela retomada de um registro (THES-5)"},"2026-09-28",{"fr":"**Clos le 28/09, trouvé et réparé le jour même** (REGISTRE `THES-5`). « Éditer » une notice publiée créait un brouillon sans ses sujets, et la publication remplaçait ceux de la notice par ce vide : depuis juin, 136 brouillons de reprise publiés sans sujet, 20 notices désindexées (constaté sur BTL-TL-000881). `6cdd27a0` (`20260928133838`) : `trg_seed_draft_subjects` sème les sujets à la création du brouillon, et un brouillon sans aucun sujet n'efface plus rien (limite assumée : on ne retire plus le dernier sujet d'une notice en publiant) ; les brouillons ouverts sont semés, sept notices rendues — six indexées par C7 la veille et BTL-TL-000881 (`sujets_suivent_la_reprise_tests` 7). `bab3f0fa` (`20260928155533`) : six autres retrouvées dans la sauvegarde #BG2 (`restic dump` de six instantanés, du 30/06 au 27/09). `e9ded1e8` (`20260928163609`) : les sept dernières n'avaient de sujet dans aucun instantané ; six indexées sur arbitrage de Xavier, BTL-TL-001242 laissée sans matière. Règle au registre : tout ce qu'un brouillon de reprise ne reprend pas, la publication l'efface.","pt":"**Encerrado em 28/09, achado e consertado no mesmo dia** (REGISTRO `THES-5`). «Editar» um registro publicado criava um rascunho sem seus assuntos, e a publicação apagava os do registro: desde junho, 136 rascunhos de retomada publicados sem assunto, 20 registros desindexados. `6cdd27a0` (`20260928133838`): `trg_seed_draft_subjects` copia os assuntos na criação do rascunho, e um rascunho sem assunto não apaga mais nada; sete registros devolvidos (`sujets_suivent_la_reprise_tests` 7). `bab3f0fa` (`20260928155533`): seis outros recuperados do backup #BG2 (seis snapshots, de 30/06 a 27/09). `e9ded1e8` (`20260928163609`): seis indexados por arbitragem de Xavier, BTL-TL-001242 fica sem assunto."}],[{"fr":"Les sigles se cherchent sans leurs points (OPAC-F3)","pt":"As siglas se buscam sem os pontos (OPAC-F3)"},"2026-09-28",{"fr":"**Clos le 28/09 au soir** (REGISTRE `OPAC-F3`, versions 0.51 et 0.52). « La C.N.T. y la revolución española » (BTL) et « La CNT en la revolución española » (MLEG) restaient deux lignes au catalogue par œuvre selon la graphie cherchée. `fn_sigle_sans_points` plie un sigle sur ses lettres, d'abord dans `api.catalog_search_ids_v1` (`f36b4638`, `20260928174350`), puis dans `f_normalize_search`, pour la recherche de l'en-tête (`8d31716d`, `20260928191324` : REINDEX des index des autorités, REFRESH des deux vues matérialisées ; effet assumé, un périodique ou un sujet neuf « C.N.T. » reçoit le slug « cnt »). Le premier push s'est arrêté sur la vérification de la migration : 530 des 1 644 `alias_norm` viennent d'autres normalisations ; `36ae8d5d` plie `alias_norm` sur place, répété à blanc en production (0 alias replié, 6 index valides). Garde : `recherche_sigles_tests` T1-T11. **En production** : au relevé du 29/09, les 398 migrations numérotées du dépôt sont toutes au ledger, appliquées par la CI, `20260928191324` comprise. Au REGISTRE, `OPAC-F3` dit encore « `alias_norm` recalculé » : il est plié sur place.","pt":"**Encerrado em 28/09 à noite** (REGISTRO `OPAC-F3`, 0.51 e 0.52). «La C.N.T. y la revolución española» (BTL) e «La CNT en la revolución española» (MLEG) eram duas linhas no catálogo por obra conforme a grafia buscada. `fn_sigle_sans_points` reduz uma sigla às suas letras, primeiro em `api.catalog_search_ids_v1` (`f36b4638`, `20260928174350`), depois em `f_normalize_search`, para a busca do cabeçalho (`8d31716d`, `20260928191324`). O primeiro push parou na verificação da própria migração (530 dos 1 644 `alias_norm` vêm de outras normalizações); `36ae8d5d` ajusta `alias_norm` no próprio lugar, sem recalculá-lo. Guarda: `recherche_sigles_tests` T1-T11. **Em produção**: no levantamento de 29/09, as 398 migrações numeradas do repositório estão todas no ledger, aplicadas pela CI, `20260928191324` inclusive."}],[{"fr":"« Rattacher à une autre œuvre » s'exécute depuis l'écran (OPAC-OEU7)","pt":"«Vincular a outra obra» funciona a partir da tela (OPAC-OEU7)"},"2026-09-28",{"fr":"**Clos le 28/09** (REGISTRE `OPAC-OEU7`). L'écran répondait 42501 depuis le 04/09 : `assign_book_to_work` avait été fermée à `authenticated` au solde des différées du 02/09 (B20), faute d'écran, puis réécrite le 04/09 pour l'écran sans le GRANT (un `CREATE OR REPLACE` garde l'ACL en place) ; `oeuvres_rattachement_tests` l'appelait en `postgres`, qui exécute tout. Droit rendu par la migration `20260928184700` (`f36b4638`) ; `oeuvres_rattachement_tests` T4 lit désormais le droit, `solde_des_differees_tests` compte 45 fermées — la clôture B20 du 02/09 en annonce 47 : `fn_circle_member_count` en est sortie le soir même (`20260902175631`), `assign_book_to_work` le 28/09. Règle rappelée : une RPC qu'un écran appelle se vérifie sous le rôle de l'écran, pas sous `postgres`.","pt":"**Encerrado em 28/09** (REGISTRO `OPAC-OEU7`). A tela respondia 42501 desde 04/09: `assign_book_to_work`, fechada a `authenticated` em 02/09 (B20), foi reescrita em 04/09 para a tela sem o GRANT, e a suíte a chamava como `postgres`. Direito devolvido pela migração `20260928184700` (`f36b4638`); T4 lê o direito, `solde_des_differees_tests` conta 45 fechadas — o fechamento B20 de 02/09 anuncia 47: `fn_circle_member_count` saiu na mesma noite (`20260902175631`), `assign_book_to_work` em 28/09."}],[{"fr":"Le catalogue publié ouvre la page de catalogage","pt":"O catálogo publicado abre a página de catalogação"},"2026-09-28",{"fr":"**Livré le 28/09 à la demande de Xavier** (`0d0322c0`) : on part de ce qui existe avant de saisir. L'onglet « Catalogue(s) publié(s) » passe en tête de la barre de catalogage et s'ouvre par défaut. Le dernier onglet visité n'est plus retenu (`catalogacaoActiveTab` n'est plus ni lue ni écrite dans `localStorage` : elle aurait masqué l'onglet de référence à toute personne ayant déjà ouvert la page) ; le lien profond `#tab=` (« Je veux… », cloche, rechargement) garde la main. Garde : `src/tests/catalogacao-onglet-de-reference.test.js` (4 cas).","pt":"**Entregue em 28/09 a pedido de Xavier** (`0d0322c0`): parte-se do que existe antes de catalogar. A aba «Catálogo(s) já publicado(s)» abre a barra e a página de catalogação. A última aba visitada não é mais lembrada (`catalogacaoActiveTab` não é mais lida nem escrita), e o link direto `#tab=` continua prevalecendo. Guarda: `catalogacao-onglet-de-reference.test.js` (4 casos)."}],[{"fr":"`robots.txt` : les robots d'IA refusés, le catalogue public ouvert aux moteurs","pt":"`robots.txt`: robôs de IA recusados, catálogo público aberto aos buscadores"},"2026-09-29",{"fr":"**Livré le 29/09, décision du jour** (`75ccb035`, déployé : servi en `text/plain` depuis 18 h 55). Jusque-là, `/robots.txt` répondait 200 avec `index.html` (le repli de l'application monopage) : les robots recevaient du HTML et l'ignoraient. Désormais les robots des entreprises d'IA (entraînement, assistants, moteurs de réponse) sont refusés partout ; les moteurs de recherche parcourent le catalogue public — notices, œuvres, autorités, périodiques, bibliothèques, thésaurus, cartographie — et les espaces de travail, formulaires, liseuse et banc leur sont fermés ; `Crawl-delay: 5` ménage le pool anonyme (plafond de 20 connexions, cf. capacité mesurée). Garde `src/tests/robots-txt.test.js` : toute route de `App.jsx` doit être classée (publique ou `Disallow`), arbitrage de la RFC 9309 (la règle la plus longue l'emporte), pas de jokers ; trois mutants vérifiés.","pt":"**Entregue em 29/09, decisão do dia** (`75ccb035`, implantado: servido em `text/plain` desde 18h55). Até então `/robots.txt` respondia com `index.html`. Agora os robôs das empresas de IA são recusados em toda parte; os buscadores percorrem o catálogo público e ficam fora dos espaços de trabalho, formulários, leitor e bancada; `Crawl-delay: 5` poupa o pool anônimo. Guarda `src/tests/robots-txt.test.js`: toda rota de `App.jsx` precisa estar classificada."}],["E3","2026-09-30",{"fr":"**Clos le 30/09, les deux critères tenus.** *(1)* La décision et ses deux raisons sont au REGISTRE (`DOC-ADDR-1`, amendé le 07/09, complété le 27/09) : on tutoie dans toutes les langues qui ont un registre de politesse (en et eo n'en ont pas), pt-BR au « você ». *(2)* Les dix locales appliquent ce registre, chacune sous sa garde au chemin (4) de `src/tests/i18n-ecriture.test.js` : passes du 27/09 (pt-BR `a805951b`, `36c467fa` ; fr `8f0d85a0` ; es et pt-BR `e8caf563` ; ca `f1743c4c`, `53cba900` ; it, de, nl, el `b425dfb1`), refus de l'EF `login` passés en codes traduits (`3cf927e1`). Les quatre dernières valeurs italiennes au « Lei » (« Faccia clic… », « Ricarichi l'elenco »), que la garde ne voyait pas, sont passées au tu le 30/09 (`abb4aa38`) ; `IMPERATIVI_LEI` apprend les deux formes, deux mutants vérifiés rouges. Restes suivis ailleurs : les conventions nl et el à faire relire par une personne de langue maternelle (E2), la passe pt-BR hors de l'app (E25).","pt":"**Encerrado em 30/09, os dois critérios cumpridos.** A decisão está no REGISTRO (`DOC-ADDR-1`); as dez locales aplicam o mesmo registro, cada uma com sua guarda em `src/tests/i18n-ecriture.test.js`. Os quatro últimos valores italianos no « Lei » passaram ao tu em 30/09 (`abb4aa38`), e a guarda aprendeu as duas formas. Restos acompanhados em E2 (nl, el) e E25 (pt-BR fora do app)."}],["I24","2026-09-30",{"fr":"**Clos le 30/09 au soir, sur l'essai de Xavier** (« on pourra clore I24 si les résultats confortent l'essai »). Livré par `233bb735`, déployé le jour même sur le poste. *Critère 1, réécrit* — tel qu'écrit (« le service survit à la fermeture du terminal ») il était inatteignable : c'est le gestionnaire systemd lui-même qui sort (constat du 20/09). Ce qui le remplace, et qui a été éprouvé : **un tir tué repart seul**. Xavier a lancé un tir `storage` à 20 h 15, coupé WSL (`wsl --terminate`) à 20 h 16 — le journal redit « Failed to enqueue OnFailure », comme le 15/09 —, rallumé : le contrôle de fraîcheur a vu le tir interrompu et l'a relancé à 20 h 21, sous le nouveau script (verrou `.bg2.lock` né à cette minute) ; instantané `f420f896` à 20 h 39, témoin de vie envoyé, marqueur retiré (18 min 44 s) ; en base, `storage` ni interrompu ni muet, **aucun incident** ouvert par la sonde. *Critère 2* — tenu depuis le 20/09 par `health-probe` (deux alertes reçues par Xavier). *Critère 3* — un dimanche poste éteint : le rattrapage `Persistent=` rejoue les tirs manqués, la relance rejoue un tir tué, le verrou empêche les rattrapages simultanés de se détruire leurs dumps (défaut antérieur trouvé par la relecture), et la sonde écrit sinon dans l'heure. Chemin de la preuve : deux bancs (`fraicheur-relance`, `bg2-un-tir-a-la-fois`), un essai réel. Découvert en route et réparé : `~/anarbib-ops/anarbib-bg2.sh` était une copie depuis le 07/09, pas un lien.","pt":"**Encerrado em 30/09 à noite, pelo ensaio de Xavier.** Um disparo `storage` foi morto (`wsl --terminate`) e relançado sozinho pelo controle de frescor 5 min depois; instantâneo `f420f896`, testemunho enviado, nenhum incidente. Critério 1 reescrito em torno desse ensaio (o texto original era inatingível); critério 2 cumprido desde 20/09 (sonda do servidor); critério 3 coberto pelo rattrapage, pela relança, pela trava entre disparos e pela sonda."}],["F18","2026-09-30",{"fr":"**Clos le 30/09 le soir même de son ouverture : le constat était faux.** La carte F1 tenait `fede@anarbib.org` pour une adresse sans boîte, sur la foi d'une note OVH du 28/08. Xavier a montré la boîte, configurée dans son client de courrier : les contributions à la Gazette (4 envois, 27/08-15/09) et la copie fédérale des ouvertures OAI (3 envois le 02/09) y arrivent. Rien à corriger ; la carte porte un correctif en tête.","pt":"**Encerrado em 30/09, na mesma noite: a constatação era falsa.** `fede@anarbib.org` tem caixa (Xavier a mostrou no seu cliente de e-mail). Nada a corrigir."}],["F17","2026-10-01",{"fr":"**Clos le 01/10 : livré, déployé, le critère tenu au banc.** `88dde5b3` (migration `20260930200514`, appliquée par la CI le 01/10 à 18 h 55 ; `notify-loan-cycle` version 83 relue en production : échéance courante `coalesce(extended_until, due_at)`). La trace `loan_cycle_notifications` porte l'échéance (unicité exemplaire, moment, échéance ; un déclencheur la remplit quand l'écrivain ne la donne pas, pour qu'aucun ordre de déploiement ne fasse repartir un rappel ; les 3 traces existantes reprises). Banc `notify-loan-cycle-banc` 13 : trois cas de prorogation (le J-3 de la nouvelle date part, pas le « c'est aujourd'hui » de l'ancienne ; un J-3 déjà parti pour l'ancienne échéance n'empêche pas le nouveau ; pas de « 7 jours de retard » à tort, date affichée juste) — mutant « due_at seul » : 3 rouges ; `rappels_echeance_tests` 8/8. Aucune prorogation réelle n'a encore eu lieu depuis F4.","pt":"**Encerrado em 01/10.** `88dde5b3`, migração aplicada pela CI; os lembretes seguem `coalesce(extended_until, due_at)`; bancadas 13 e 8/8."}],["E26","2026-10-01",{"fr":"**Ouvert et clos le 01/10 : la recherche du catalogue ne trouvait ni « Emma Goldman » ni « Vivre ma vie ».** Signalé par Xavier à l'écran. Deux causes : le filtre texte par auteur·rice cherchait la saisie entière comme sous-chaîne de `autor`, qui est à la forme d'autorité (« GOLDMAN, Emma ») — « Emma Goldman » n'y figurait jamais, un accent omis non plus ; et `catalog_search_ids_v1` ne lisait que les champs de l'édition, si bien que le titre d'œuvre affiché (`work_titles`, « Vivre ma vie » pour l'œuvre 2101) n'était pas cherchable — la seule réponse était un faux positif (Armand : « vivre ? », « vie », « ma » dans « ARMAND »). Migration `20261001190729` (`697c81d9`) : filtre auteur·rice mot par mot, sans accents ni casse (`catalog_works_v1`, réécriture d'une seule clause gardée par md5 ; repli PostgREST `catalogFilters.js` mot par mot) ; la meule de la recherche reçoit les titres de l'œuvre dans toutes les langues et le rang prend le meilleur d'entre eux. En chemin, l'œuvre 1163 (*L'Épopée d'une anarchiste*, abrégé français arrêté en 1920) portait neuf titres « auto » copiés de *Living My Life* : remplacés par son titre français (`manual`, l'autofill ne repasse plus) et une note d'œuvre ; **décision de Xavier : les deux œuvres restent distinctes**. Suite `20261001192041` (`52ebebc1`) : le départage écrit `s.book_id` (garde T7 de `catalogue_grande_echelle_tests`, rouge sur le premier push). Vérifié en production et à l'écran : « Emma Goldman » → 13 œuvres, « Vivre ma Vie » → *Vivre ma vie* en tête. Restes : **E27** (les suggestions de la recherche rapide), **C18** (œuvres scindées).","pt":"**Aberto e encerrado em 01/10: a busca do catálogo não achava «Emma Goldman» nem «Vivre ma vie».** O filtro de autor·a buscava a frase inteira em `autor` (forma de autoridade «GOLDMAN, Emma»), e a busca livre não lia os títulos da obra (`work_titles`). Migração `20261001190729` (`697c81d9`): filtro palavra por palavra, sem acentos nem caixa; a busca lê os títulos da obra em todas as línguas. A obra 1163 (resumo francês de *Living My Life*) perdeu os nove títulos «auto» copiados da obra 2101 — as duas ficam distintas (decisão de Xavier). Seguimento `20261001192041` (`52ebebc1`, guarda T7). Verificado em produção e na tela. Restos: E27, C18."}],["F1","2026-10-03",{"fr":"**Clos le 03/10, décision de Xavier, les trois critères tenus.** (1) La carte est écrite : `docs/journal/audits/CARTE_chaine_courriel_2026-09-30.md`, environ 96 chaînes mesurées en production. (2) Les quatre courriels signalés ont leur verdict : `retirada_efetivada` part sous `reserva_convertida_em_emprestimo`, `retirada_no_show` part, `retirada_reagendada` était un fossile (supprimé), `liberada_para_circulacao` est coupé par réglage. (3) Les branches mortes sont supprimées ou documentées : `57a4aafc` (migration `20261001194818`, déployé et vérifié le 01/10 à 22 h 40) et `e897fb26` (échéance de 60 jours des consultations, décision de Xavier) ; `team.promoted_to_librarian` émis ; colonnes et table sans lecteur gardées par COMMENT (aucune donnée supprimée) ; `notify-mid-loan-reading` retirée de la plateforme par Xavier. Tirs des 02 et 03/10 relus : expiration des consultations sans effet (aucune échéance encore posée), `notify-loan-cycle` en 200. Défauts trouvés en route, traités à part : F16, F17, F19 (livrés), F18 (constat faux), F20, F21.","pt":"**Encerrado em 03/10 (decisão do Xavier).** Mapa escrito, os quatro e-mails com veredicto, ramos mortos suprimidos ou documentados (`57a4aafc`, `e897fb26`), `notify-mid-loan-reading` removida da plataforma; execuções de 02 e 03/10 verificadas."}],["C19","2026-10-03",{"fr":"**Demandé et livré le 03/10 (Xavier).** Une reprise de notice, d'autorité ou d'exemplaire que ne suit aucun enregistrement ne reste plus en file éditoriale : `retake_untouched` la marque à la naissance, la première écriture le retire (ouvrir n'est pas modifier ; sujets, ressources numériques et contributeurs écrits en direct comptent). L'éditeur la fait oublier quand on la quitte (`discard_untouched_retake`), sans corbeille ni entrée au journal ; le job horaire `anarbib-purge-untouched-retakes` rattrape les onglets fermés (plus de 24 h). Cas d'origine : les brouillons 6276 et 6277, écartés à la main par `20260928114148`. Dans le même lot, tout enregistrement des trois éditeurs remonte jusqu'à son message de confirmation, doublé d'un toast temporaire. Migration `20261003202521` (`8ccfa02f`, déployée et vérifiée en production), écran `9419fda7` ; suites `reprises_vierges_tests` (7) et vitest `reprises-vierges`, `confirmation-enregistrement` (12).","pt":"**Pedido e entregue em 03/10 (Xavier).** Uma retomada de registro, autoridade ou exemplar sem nenhuma gravação depois não fica mais na fila editorial: `retake_untouched` a marca ao nascer, a primeira escrita o retira. O editor a faz esquecer ao sair (`discard_untouched_retake`), sem lixeira nem entrada no diário; o job horário `anarbib-purge-untouched-retakes` cobre as abas fechadas (mais de 24 h). No mesmo lote, toda gravação dos três editores sobe até a mensagem de confirmação, com um toast temporário. Migração `20261003202521` (`8ccfa02f`), tela `9419fda7`."}],["E28","2026-10-04",{"fr":"**Ouvert et livré le 04/10 : une autorité corrigée ne changeait aucune fiche, et la fiche 2736 montrait deux fois le SNI.** Signalé par Xavier à l'écran (`/livro/2736`). Deux causes. (1) **Doublons** : le lot `conv_revue` du 03/09 avait créé l'autorité depuis la transcription `books.autor` (avec sa faute, « d Informações ») et **ajouté** une ligne de contributeur liée au lieu de rattacher la ligne d'origine ; même cas sur les livres 412, 1282, 1541 et 2316. Données corrigées le 04/10 (autorisé par Xavier) : ligne d'origine rattachée à l'autorité, doublon supprimé, « Russel » → « RUSSELL », faute de `books.autor` du 2736 corrigée, 3 liens `book_authors` orphelins de ces livres retirés. (2) **Affichage** : `get_book_contributors_public` rendait la transcription figée au rattachement, jamais `authors.preferred_name`. Doctrine `CAT-G4` : un contributeur lié s'affiche sous la forme autorisée (point d'accès), la transcription reste la mention de responsabilité (vue ISBD). La RPC rend `authority_name` en plus, `name` inchangé (le catalogage le recharge comme ligne éditable). Migration `20261004212710`, fiche `BookPage.jsx`. Le même soir (autorisé par Xavier), les **29 liens `book_authors` orphelins** des 22 autres livres sont retirés : chacun désignait une personne bien présente parmi les contributeurs du livre, sous un rôle ou une position périmés, et chaque contributeur lié gardait son lien exact (0 orphelin, 0 lien manquant après coup). Le 05/10, **la cause est retirée** : `api.conv_revue_appliquer` (lot `autor_sans_autorite`) rattache désormais le contributeur non lié qui ressemble à la transcription — clé `fn_normalize_name` égale après retrait d'une parenthèse finale, ou similarité trigramme ≥ 0,6, seuil mesuré en production (les cinq cas ≥ 0,83 ; aucune paire de personnes réellement distinctes d'un même livre ≥ 0,5) — et n'insère une ligne que si aucun ne ressemble. Migration `20261005071316` (`caa147be`), suite `conv_c5_autor_sans_autorite_tests` portée à 10 tests (graphie voisine, « (org.) », personne différente non rattachée). La file était vide : rien n'a été rejoué. Le même jour (demandé par Xavier), deux cas repérés en chemin sont corrigés en données : **Huxley** (livres 359 et 360, même mécanisme que le SNI — ligne d'origine « Huxley, Aldous Leonard » rattachée à l'autorité 10185, doublon du 03/09 retiré) et **Grosz** (livre 1023 : « 1959. ), George Grosz (1893 », un « George Grosz (1893-1959) » démembré à l'import, retiré du contributeur et de `books.autor`). Puis, sur décision de Xavier, les trois autres débris du même import : **645** (« Crusao), Luis Woollands (Juan ») — autorité 10464 refaite en « Woollands, Luis » / « Luis Woollands », pseudonyme « Juan Crusao » en forme variante, contributeur et transcription réparés ; **1187** (« Ilustraciones), Juan José Vázquez ») — contributeur « Vázquez, Juan José », rôle `ilustrador` ; **1218** (« 2, Université Pierre Mendès France Grenoble ») — l'université n'est pas une contributrice : ligne retirée, mention gardée en note. Recherche des mêmes motifs (date ou parenthèse démembrée) sur les contributeurs et `books.autor` : plus aucun cas. Enfin (demandé par Xavier, 05/10), **`CAT-G4` étendu** : la liste du catalogue s'y conformait déjà (`v_book_authors_canonical` prend `sort_name`) ; les citations et exports (APA, Chicago, MLA, BibTeX, RIS, fiche et page auteur·rice) citent désormais un contributeur lié sous la forme inversée de son autorité — migration `20261005101227` (`authority_sort_name`), `citeName`, garde `citations-cat-g4.test.js` (`8fc3c900`). Puis une citation ne nomme plus que les responsables principaux, comme la liste : auteur·rices (`autor`, `coautor`), sinon réalisation, composition ou organisation ; traduction, illustration et préface n'y figurent plus (vérifié en ligne sur `/livro/1187` : l'illustrateur reste sur la fiche avec son rôle, la citation ne nomme que l'auteur) — `citationContributors`, `3fc8656a`. La liste du catalogue nomme à son tour les coauteur·rices (`v_book_authors_canonical` : `coautor` compte comme auteur·rice, un livre n'ayant que des coauteurs ne bascule plus sur l'organisation) — migration `20261005164328` (`6bb89e0a`), suite `liste_coauteurs_tests` (3) ajoutée à la CI. Puis, décision de Xavier, **une seule forme** pour nommer un contributeur lié : son point d'accès en casse naturelle (« Russell, Bertrand »), sur la fiche, dans la liste du catalogue (plus de capitales calculées), sur la page Œuvre et dans les citations ; le titre d'une page d'autorité reste en ordre direct ; `editor` rejoint les rôles de repli de la liste — migration `20261005184801` (`15763f19`), amende `DOC-CONV-1` et `CONV-1`. Le test `facettes_catalogue_tests` cherchait encore l'ancien libellé en capitales (rouge 8/18 en CI, production intacte) : corrigé (`e1fb796a`), banc local complet 173/173. Restent en capitales 4 transcriptions de contributeurs non liés (Catanuto, Satrapi, Fučík, Alleg) et 3 autorités **volontairement** fausses, matériel de la formation BLMF du 26/08 (11326, 11327, 11328, bibliothèque de test privée) — à ne pas corriger. Commit de la migration `20261004212710` : `af7b7ead`. Les quatre transcriptions restées en capitales : C3.","pt":"**Aberto e entregue em 04/10: uma autoridade corrigida não mudava nenhuma ficha, e a ficha 2736 mostrava o SNI duas vezes.** (1) Duplicatas criadas pelo lote `conv_revue` de 03/09 em 5 livros (2736, 412, 1282, 1541, 2316), corrigidas nos dados em 04/10. (2) `get_book_contributors_public` passa a devolver `authority_name`: um contribuidor vinculado aparece pela forma autorizada da autoridade (doutrina `CAT-G4`), a transcrição continua na menção de responsabilidade (visão ISBD). Migração `20261004212710`. Os 29 vínculos `book_authors` órfãos de outros 22 livros também foram retirados (papel ou posição vencidos; nenhum vínculo real perdido). Em 05/10, a causa foi retirada: o lote `autor_sans_autorite` vincula o contribuidor existente que se parece com a transcrição (chave normalizada igual ou similaridade ≥ 0,6) em vez de inserir uma linha duplicada. Migração `20261005071316` (`caa147be`), suíte `conv_c5` com 10 testes. No mesmo dia, Huxley (livros 359 e 360) e Grosz (livro 1023, nome desmembrado na importação) corrigidos nos dados; depois, os três outros resíduos da mesma importação: 645 (autoridade refeita, pseudônimo « Juan Crusao » como forma variante), 1187 (ilustrador com o papel `ilustrador`), 1218 (a universidade sai dos contribuidores e fica em nota). Enfim, `CAT-G4` estendido às citações e exportações: um contribuidor vinculado é citado pela forma invertida da autoridade (`sort_name`); a lista do catálogo já seguia a doutrina. Migração `20261005101227` (`8fc3c900`). Depois, uma citação só nomeia os responsáveis principais (autoria, senão direção, composição ou organização); tradução, ilustração e prefácio saem da menção de autoria (`3fc8656a`). A lista do catálogo também nomeia os coautores (migração `20261005164328`, `6bb89e0a`). Depois, uma só forma para nomear um contribuidor vinculado: o ponto de acesso em caixa natural (« Russell, Bertrand »), na ficha, na lista, na página da obra e nas citações; `editor` entra no recurso da lista (migração `20261005184801`, `15763f19`). As fichas 11326, 11327 e 11328 são material de formação, erradas de propósito. Commit da migração `20261004212710`: `af7b7ead`. As quatro transcrições em maiúsculas: C3."}],["F20","2026-10-04",{"fr":"**Clos le 04/10 sur pièces : livré, déployé, le critère tenu par une suite qui emprunte les crons.** `7a00b054` (migration `20261004210702`, appliquée par la CI, vérifiée en production le 04/10 à 23 h 31 : les trois crons font un LEFT JOIN). `fn_expire_solicitada_reservations`, `fn_expire_negotiation_timeout` et `fn_detect_no_show_reservations` prennent les délais par défaut des colonnes (14 jours, 21 jours, 24 heures) quand une bibliothèque n'a pas de ligne de politique ; aucune ligne créée. Trois bibliothèques actives concernées le 04/10 : Solidaires, anarchief, blmf-teste. Suite `reservations_sans_politique` 6/6 (les trois crons empruntés sans ligne ; une ligne existante garde la main ; replis = DEFAULT des colonnes) ; mutant « INNER JOIN » : 3 rouges.","pt":"**Encerrado em 04/10.** `7a00b054`, migração aplicada pela CI, verificada em produção: os três crons de reserva usam LEFT JOIN e os prazos padrão das colunas (14 d, 21 d, 24 h) quando a biblioteca não tem linha de política. Suíte 6/6, mutante morto."}],["E27","2026-10-04",{"fr":"**Clos le 04/10 : livré, déployé, vérifié à l'écran le 05/10.** `5e97a77b` (migration `20261004211159`, appliquée par la CI, pipeline vert de bout en bout). `api.search_catalog_v1` reçoit une branche `work_title_candidates` : un titre d'œuvre (`work_titles`, toutes langues) qui répond à la requête — préfixe ou jetons, pas la proximité `%`, qui doublait le coût des mots fréquents — suggère les éditions de l'œuvre, une ligne par édition, libellé « Living my Life (Vivre ma vie) », même score et même filtre « préfixe d'abord » que les livres ; rien pour une édition que son propre titre fait déjà suggérer. Index trigramme `work_titles_title_norm_trgm_idx` sur `f_normalize_search(title)` : sans lui ~470 ms par frappe (mesuré en production, transaction annulée), avec lui le coût d'avant (« anarquia » 112 → ~120 ms). Réécriture chirurgicale gardée par md5, fins de ligne CRLF respectées comme B33. Banc local avant le push : rejeu sur image vierge 407/407, suites SQL 159/159, dont **T9** neuf dans `recherche_index_trigramme_tests` (une édition suggérée par le seul titre de son œuvre ; l'expression servie par l'index — le compteur ne tranche pas sur un jeu minuscule, le planificateur passe par la clé `(work_id, lang)`). À l'écran, sur app.anarbib.org sans compte : « Vivre ma Vie » suggère les trois *Living my Life* et *Viviendo mi vida*, le livre d'Armand ne l'est plus.","pt":"**Encerrado em 04/10, verificado na tela em 05/10.** `5e97a77b` (migração `20261004211159`, CI verde). As sugestões da busca rápida (`api.search_catalog_v1`) leem os títulos da obra (`work_titles`), rótulo «Living my Life (Vivre ma vie)»; índice trigrama em `f_normalize_search(title)` mantém o custo de antes. Bancada local: 407/407 migrações, 159/159 suítes (T9 nova)."}],["C20","2026-10-05",{"fr":"**Constaté et livré du 04 au 05/10 (Xavier) : le catalogue dit ce qui se lit en ligne.** Mesuré en production : 19 livres avaient un PDF public actif et aucun ne portait l’indicateur du catalogue — `has_online_reading` des vues matérialisées ne comptait que les PDF réservés. `catalog_digital_access_v1` sert l’accès réel des livres affichés (usages publics, ressource réservée, droit de lecture, bibliothèques détentrices), sans toucher aux vues ; badges « Lire / Écouter / Voir en ligne » et « Réservé aux lecteur·rices de … » sur les lignes d’édition et d’œuvre ; la fiche dit « RÉSERVÉ » et propose de se connecter au lieu de « NON », et traduit les droits. Décision de Xavier : l’administration du réseau lit aussi les PDF réservés aux détentrices. Migration `20261004215035` (`6738b02f`), écrans `d8a5b5f4`, `14cdd0db` ; suite `acces_numerique_catalogue_tests` (6) ; vérifié en production le 05/10 (anonyme : 4 livres publics « Lire en ligne », le 1434 « Réservé aux lecteur·rices de Biblioteca Terra Livre »). Le défaut de lecture réservée signalé par Xavier n’est pas reproduit en base (la règle accorde l’accès à 4 des 5 membres actifs de la BTL n de Xavier du jour** (`f5e3f5ed`, CI verte). Relevé par la revue du lot 2 de H21 : aucun flux ne sauvegardait `ingest` (imports, lignes de staging — qui portent désormais des preuves : ligne écartée IMP-27, source des bases —, liens ligne → brouillon, bases du lot 2) ; le cadrage BG2-13 du 30/06 n’avait jamais été appliqué. `anarbib-bg2.sh` : un seul `pg_dump --schema=public --schema=ingest`, même fichier `anarbib-long.sql` (même lignée restic), exclusions et denylist en noms qualifiés, deux contrôles de plus sur le dump, filet sur public + ingest, restore-test aux attendus calculés ; `bg2-known-tables.txt` : les 11 tables `ingest.<table>` ; filet CI aux mêmes fonctions ; RUNBOOK : repose des droits d’ingest, exposition dans le Data API, secours `fn_h21_reprendre_les_bases()` ; REGISTRE : BG2-13 mis en œuvre (tout ingest, colonnes d’acteur staff acceptées), BG2-AUTO-2 corrigé. Preuve sur banc privé : dump de 169 tables (public 158, ingest 11) avec données, rejeu dans une base vide, ACL reposées identiques à la production. Mis en service : `~/anarbib` avancé sur `f5e3f5ed`, `anarbib-bg2.sh check` → « Filet OK ». **Reste** : le premier tir long avec ingest, dimanche 11/10 à 20:00 (attendu au journal : « Dump long OK : N tables (public ~158, ingest 11) ») ; hors périmètre, consigné : `--no-privileges` perd aussi les droits de public, et les schémas `private` et `api` ne sont dans aucun flux.","pt":"**O esquema `ingest` entra no fluxo longo do backup #BG2 — entregue e em serviço em 05/10, decisão de Xavier** (`f5e3f5ed`). Nenhum fluxo salvava `ingest`; agora um único `pg_dump --schema=public --schema=ingest`, mesmo arquivo, filtro de classificação nos dois esquemas, 11 tabelas classificadas, RUNBOOK e REGISTRO atualizados. Prova em banco privado; `anarbib-bg2.sh check` → «Filet OK». **Falta**: o primeiro backup longo com ingest, domingo 11/10 às 20:00."}],["B29","2026-10-06",{"fr":"Les brouillons appartiennent à leur bibliothèque, constaté en production le 28/09 : la c ent leur rôle et leur nature sur la fixture, les rapprochements d'autorités sont proposés en révision, tests écrits (`8c80de27`, `2ee5f7a7`, `a692a75e`). L'épreuve sur un import réel est portée par H28. **Clos le 06/10 par Xavier sur ces constats.**","pt":"As responsabilidades importadas mantêm papel e natureza, aproximações propostas na revisão, testes escritos. Prova numa importação real: H28. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["H19","2026-10-06",{"fr":"Les exemplaires d'un catalogue importé suivent leur notice : critères tenus au banc le 27/09, 46 exemplaires sur 46 au réimport (`2f488790`, `IMP-25`). L'épreuve sur un import DIRA réel est portée par H28. **Clos le 06/10 par Xavier sur ces constats.**","pt":"Os exemplares importados seguem sua notícia: critérios cumpridos em bancada, 46/46 na reimportação (`IMP-25`). Importação real da DIRA: H28. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["H22","2026-10-06",{"fr":"Le lecteur de l'export XML propre à PMB est livré (`8c80de27`) et déployé le 28/09 ; le format `pmb_xml` est admis par la CHECK de la base. **Clos le 06/10 par Xavier sur ces constats.**","pt":"O leitor do XML do PMB foi entregue (`8c80de27`) e implantado em 28/09; formato `pmb_xml` admitido pela CHECK. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["H23","2026-10-06",{"fr":"Un export UNIMARC (ISO 2709 et XML), miroir exact de l'import : les deux sont proposés dans Importations, une seule table de correspondance (`_shared/marc/correspondance.ts`) sert à l'import et à l'export, et les 64 notices de la fixture font l'aller-retour à l'identique (`ecriture.test.ts`, 19 tests ; `8c80de27`, `2ee5f7a7`, `466324aa`, `2348cb86`). **Clos le 06/10 par Xavier sur ces constats.**","pt":"Exportação UNIMARC (ISO 2709 e XML), espelho exato da importação: uma só tabela de correspondência, ida e volta idêntica das 64 notícias. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["H24","2026-10-06",{"fr":"L'export d'une bibliothèque contient tout ce qu'elle a catalogué : critère 1 éprouvé le 29/09 par la preuve de H27 (46/46 exemplaires, 61/61 responsabilités, 42/42 notices indexées), critère 2 par `export_catalogue_tests` (10). Le type, la section et le code statistique des exemplaires sont portés par H29. **Clos le 06/10 par Xavier sur ces constats.**","pt":"A exportação de uma biblioteca contém tudo o que ela catalogou: critério 1 provado em 29/09 (H27), critério 2 por `export_catalogue_tests`. Tipo, seção e código estatístico: H29. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["F16","2026-10-06",{"fr":"L'invitation à une tâche crée enfin une invitation : `fn_task_invite` pose `convite:<adresse>` (`32cfea66`, migration `20260930195644`) ; suite `taches_invitation_tests` 6/6 (1/6 contre l'ancienne fonction) ; les marqueurs `convite:` ne s'affichent plus. Une invitation réelle reçue est portée par E31. **Clos le 06/10 par Xavier sur ces constats.**","pt":"O convite a uma tarefa enfim cria um convite (`32cfea66`); suíte 6/6; as marcas `convite:` não aparecem mais. Um convite real recebido: E31. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["F21","2026-10-06",{"fr":"Pied de page et statuts des courriels dans la langue de la bibliothèque : une clé `wf.stage.*` par étape dans les dix langues, plus de pied ni de signature en portugais par défaut (PR #31 du camarade `ASR2026`, `da034c83` — `9e298ea3`, `70233b98` — et `9bdce13a`) ; bancs `mail-status-footer-i18n` (9) et `mail-nom-equipe-repli-garde` (4). Un vrai courriel en français reçu en production et le nom d'expéditeur par défaut, encore en portugais, sont portés par F24. **Clos le 06/10 par Xavier sur ces constats.**","pt":"Rodapé e status dos e-mails na língua da biblioteca: uma chave `wf.stage.*` por etapa nas dez línguas, sem rodapé nem assinatura em português por padrão (PR #31 do camarada, `9bdce13a`); bancadas 9 + 4. E-mail real em francês e nome de remetente padrão: F24. **Fechado em 06/10 por Xavier com base nessas constatações.**"}],["E29","2026-10-06",{"fr":"Les facettes d'une session comptent le catalogue que la page affiche : `api.catalog_facets_v1` lit `catalog_list_session_v1` pour une personne connectée, `catalog_list_anon_v1` sinon, comme `catalog_works_v1` — ce que `OPAC-F1` prévoyait (REGISTRE 0.72, `OPAC-F2` complété). `4b27b909`, migration `20261006170736` appliquée par la CI, vérifiée en production à 19 h 27 ; suite `facettes_catalogue_tests` T8 (membre 1/1, connecté sans appartenance 0/0, anonyme 0/0 ; sans la migration, membre 0/1) ; empreinte de 20 jeux de filtres identique avant et après (`a8aed78d…`). **Clos le 06/10 par Xavier sur ces constats.**","pt":"As facetas de uma sessão contam o catálogo que a página mostra (`4b27b909`, migração `20261006170736`, verificada em produção às 19h27; suíte T8; impressão de 20 conjuntos de filtros idêntica). **Fechado em 06/10 por Xavier.**"}],["F23","2026-10-06",{"fr":"Les 22 demandes de consultation antérieures au 01/10 restent sans échéance : elles sont toutes closes, une échéance ne changerait rien à leur sort ; la règle des 60 jours (`e897fb26`, F1) vaut pour les demandes nouvelles. Aucune migration. **Décision de Xavier, 06/10.**","pt":"As 22 consultas anteriores a 01/10 ficam sem prazo: estão todas encerradas; a regra dos 60 dias vale para os pedidos novos. Nenhuma migração. **Decisão de Xavier, 06/10.**"}],["H25","2026-10-06",{"fr":"**Clos le 06/10 sur décision de Xavier.** L’export des autorités (UNIMARC Autorités, `fn_export_authorities_lote`, `_shared/marc/autorites.ts`, livré le 28/09) se réimporte dans PMB 8.1.1.1 : avec la consigne « Tenir compte des notices d’autorités : Non » (écran, README, 10 langues), les 61 responsabilités de la fixture reviennent en 57 auteurs rapprochés par le nom et les dates, aucun recréé, et les catégories par leur libellé. Le lien par le numéro `$3` ne sert pas : le formulaire de PMB 8.1.1.1 ne transmet pas l’origine choisie (sa liste s’appelle `authorities_origin`, l’import lit `authorities_default_origin`) ; avec « Oui », 44 liens partent vers une source absente. Défaut de PMB, pas d’AnarBib : son signalement et le correctif d’une ligne pour DIRA vont à **H32**.","pt":"**Fechado em 06/10 por decisão de Xavier.** A exportação de autoridades reimporta-se no PMB 8.1.1.1 com «Não»: autores aproximados por nome e datas, nenhum recriado; o vínculo pelo `$3` não funciona por um defeito do PMB (a origem não é transmitida pelo formulário) — sinalização e correção para a DIRA em **H32**."}],["H20","2026-10-06",{"fr":"L'identifiant d'origine d'une notice est gardé par bibliothèque : table `book_external_ids` (notice, bibliothèque, schéma, valeur ; unique par bibliothèque), posée à la publication, au rapprochement d'un exemplaire et à l'absorption d'un brouillon importé, qui suit la notice gardée d'une fusion (`8c80de27`, migration `20260928111812`) ; 264 lignes en production. Les deux critères sont couverts par `identifiant_origine_tests` en CI — T10 (brouillon importé absorbé par une fiche existante) et T3 (exemplaire rapproché d'une notice d'une autre bibliothèque), relus le 06/10 — et, depuis, par les suites des lots 1 et 2 de H21. **Clos le 06/10 par Xavier sur ces constats.**","pt":"O identificador de origem é guardado por biblioteca (`book_external_ids`, `8c80de27`); critérios cobertos por `identifiant_origine_tests` T10 e T3 na CI. **Fechado em 06/10 por Xavier.**"}],["E35","2026-10-06",{"fr":"**Ouvert et livré le 06/10, sur trois signalements de Xavier à l'écran** (`2ce1bad5`, migration `20261006194628`, déployé et vérifié à 22 h 18 ; GitHub poussé le soir même). (1) **Un lecteur BLMF voyait l'exemplaire de la BTL « Disponible »** : la ligne d'une autre bibliothèque ne passait à « Indisponible pour toi » que si la sienne n'avait pas du tout l'édition ; BLMF l'avait aussi, la ligne BTL montrait son vrai stock. Il n'y a pas de prêt entre bibliothèques : dès qu'on est rattaché à une bibliothèque, toute ligne d'une autre dit « Indisponible pour toi » (`CatalogPage.jsx`, `catalogFilters.js`). (2) **« Confederación » ne trouvait pas la notice saisie « C.N.T. »** : le champ Auteur·rice et la recherche libre ne lisaient que la saisie libre, jamais le nom d'autorité que la ligne affiche ; les deux recherches lisent aussi ce nom, et « CNT » trouve « C.N.T. » (en production, lecture seule : 8 → 9 notices, la neuvième est la 1432) ; la liste plate suit la même règle. (3) **`sob_direitos` en dur dans le lecteur PDF** : le badge prend le libellé des droits que la fiche utilise déjà, dix locales (quatre valeurs en production, toutes traduites). Suites : `nom_affiche_cherchable_tests` (7 cas ; l'ancienne règle remise au banc en fait tomber 3), `catalogFilters.test.js`. **Le quatrième signalement n'était pas une faille** : le compte de Xavier lit un PDF réservé à la BTL au titre de l'administration du réseau, décision du 04/10 codée dans `fn_current_user_is_member_of_holding_library` ; un simple lecteur BLMF ne voit pas « Lire ». Une mention « tu y accèdes au titre de l'administration du réseau » a été proposée ; Xavier : « je comprends mieux, et c'est très bien comme cela ». **Reste** : la ligne BTL « Indisponible pour toi » pour un compte BLMF n'a pas été vue à l'écran (la session ne saisit pas de mot de passe) — porté à E31. *Porté au backlog le 07/10, à l'inventaire des sessions voisines : la livraison n'avait d'item nulle part.*","pt":"**Aberto e entregue em 06/10, sobre três sinalizações de Xavier na tela** (`2ce1bad5`, migração `20261006194628`, verificado às 22h18). (1) Um leitor da BLMF via o exemplar da BTL « Disponível »: não há empréstimo entre bibliotecas, toda linha de outra biblioteca diz « Indisponível para você ». (2) « Confederación » não achava a notícia digitada « C.N.T. »: as duas buscas leem também o nome de autoridade exibido (8 → 9 notícias). (3) `sob_direitos` fixo no leitor PDF: o selo usa o rótulo dos direitos da ficha, dez locales. A quarta sinalização não era falha: a administração da rede lê um PDF reservado, decisão de 04/10. **Resta** ver na tela a linha BTL para uma conta BLMF (E31). *Levado ao backlog em 07/10, no inventário.*"}],["B37","2026-10-06",{"fr":"**Ouvert et livré le 06/10** (`1fafc35b`, migration `20261006202320`, déployé et vérifié à 23 h 02), à partir du CSV des avis du tableau de bord (« réduis ce qui peut être réduit ») : **34 fonctions SECURITY DEFINER sans appelant sous `authenticated` fermées** — l'avis 0029 passe de 451 à 418 (417 attendus : `fn_import_preparer_mises_a_jour`, H21 lot 4, est arrivée pendant le banc ; son verdict a été écrit le même soir). Le tri : sur 451, 399 ne sont appelées sous `authenticated` ni par une politique, ni par une vue, ni par une fonction INVOKER, ni par le cron ; 43 d'entre elles ne le sont ni par le front, ni par une fonction Edge, ni par un script. Neuf restent ouvertes exprès : les 7 qui figurent aussi dans la liste T10, les deux RPC d'admin `fn_outbox_*` (F12), `fn_import_row_comparison` (H21 en cours). Les 34 fermées : des aides que seules des DEFINER appellent, deux fonctions de déclencheur, trois fonctions mortes (`revoke_my_reader_card`, `discard_book`, `fn_ensure_current_user_profile`). La garde de la migration revérifie au déploiement qu'aucune n'a d'appelant sous `authenticated` — jouée d'abord en production dans une transaction annulée, elle a refusé une première liste qui portait une fonction déjà fermée. Suite `aides_definer_fermees_tests` (six mutants rouges) ; `circulation_couche_supplantee`, `paquetA_profils` et `brouillons_par_bibliotheque` ajustées ; dans `b14_oracle_existence_forme`, T2 affirmait que le Painel appelle `fn_painel_find_profile_by_lookup` — aucun fichier de l'historique ne l'a jamais nommée, le Painel cherche par `fn_painel_search_reader` : prémisse fausse, fonction déplacée côté « reste fermée », sans affaiblir le test. **Ce qui ne baisse pas, et pourquoi** : 0028 = 29, exactement la liste T10, chaque ouverture à `anon` décidée par écrit ; 0011 = 1, `fn_locale_from_idioma`, voulu (B32). Complément écrit dans `AUDIT_execute_authenticated_2026-09-01.md`. *Porté au backlog le 07/10, à l'inventaire des sessions voisines : la livraison n'avait d'item nulle part.*","pt":"**Aberto e entregue em 06/10** (`1fafc35b`, migração `20261006202320`, verificado às 23h02): **34 funções SECURITY DEFINER sem chamador sob `authenticated` fechadas** — o aviso 0029 passa de 451 a 418. Nove ficam abertas de propósito (7 da lista T10, as duas RPC `fn_outbox_*`, `fn_import_row_comparison`). A guarda da migração reverifica na implantação. Suíte `aides_definer_fermees_tests`; T2 de `b14_oracle_existence_forme` corrigido (premissa falsa). 0028 = 29 = T10; 0011 = 1, voluntário. Complemento na auditoria. *Levado ao backlog em 07/10, no inventário.*"}],["I31","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« mails reçus sur les deux adresses, tu peux clore »), les trois critères tenus sur envoi réel.** Ouvert le 07/10 après la panne de la base (19:58 → 20:19) dont personne n'avait été prévenu : `health-probe` vit dans la base et tombe avec elle. Livré le 08/10 (`ead6aea9`, mode exécutable `4dfb1dc2`, CI verte) : `deploy/ops/anarbib-temoin.sh`, toutes les cinq minutes depuis le poste (`anarbib-temoin.timer`, `*:0/5`, deux minutes après le démarrage, sans rattrapage), une lecture REST (`api.public_libraries`, clé publiable) et la santé d'Auth ; après deux échecs de suite, un courriel par l'API de Resend — sans rien lire ni écrire dans la base —, un second au retour avec la durée ; un seul courriel par panne, un envoi refusé retenté au passage suivant ; aveugle si l'API et codeberg.org se taisent ensemble (poste sans réseau : rien compté, rien écrit) ; sans configuration il refuse de tourner (sortie 2, visible). Banc `temoin-panne` (8 cas, le vrai script contre deux serveurs HTTP du test). Posé sur le poste le soir même ; configuration `~/anarbib-ops/temoin.env` (mode 600, jamais au dépôt) : clé Resend saisie par Xavier à l'invite masquée, destinataires `admins@anarbib.org,anarbib@proton.me`, expéditeur `no-reply@notifications.anarbib.org`. *En chemin* : une première pose a laissé le texte d'exemple de la consigne comme destinataire (Resend 422) — le témoin a dit « courriel non parti, nouvel essai au prochain passage » sans déclarer la panne, comme prévu ; leçon pour les consignes à Xavier, pas pour le code. **Épreuve réelle à 20 h 50** : panne simulée (port fermé), deux passages → « la base ne répond plus » (Resend 200) ; passage normal → « répond de nouveau (panne de 5 min) » (Resend 200) ; les deux reçus sur les deux adresses. **Consigné** : le témoin ne voit ni la cause (I32) ni une panne de moins de dix minutes ; le serveur maison le reprendra tel quel (même unité, même fichier).","pt":"**Fechado em 08/10 à palavra de Xavier, os três critérios cumpridos com envio real.** Testemunha de queda fora do banco: a cada cinco minutos, do posto, leitura REST e saúde do Auth; após dois falhos, e-mail pela API da Resend sem tocar no banco; um segundo na volta. Cego se o posto está sem rede; recusa sem configuração. Bancada de 8 casos. Prova real às 20h50: dois e-mails (Resend 200) recebidos em `admins@anarbib.org` e `anarbib@proton.me`. Consignado: não vê a causa (I32) nem uma queda de menos de dez minutos."}],[{"fr":"Deux tomes différents ne sont jamais un doublon, dans les trois détecteurs ; cinq tomes catalogués deux fois fusionnés (DEDUP-15)","pt":"Dois tomos diferentes nunca são uma duplicata, nos três detectores; cinco tomos catalogados duas vezes fundidos (DEDUP-15)"},"2026-10-08",{"fr":"**Clos le 08/10** (REGISTRE `DEDUP-15`). Relevé par Xavier le 08/10 au soir, sur la liste plate du catalogue (la vue par œuvre regroupe bien les tomes : le réglage « Liste plate » était resté enregistré). Mesuré en prod : le balayage global écartait deux tomes différents depuis le lot 4 (04/09), mais `suggest_book_duplicates` (l'assistant sur une fiche) et `api.suggest_draft_duplicates` (le formulaire) ne lisaient pas le tome — 64 paires intra-bibliothèque de tomes différents proposées à tort. Migration `20261008185800` : les deux détecteurs calculent le rang du tome comme le balayage et excluent deux rangs connus et différents ; un tome inconnu d'un côté reste candidat. Suite `tomes_jamais_doublons_par_notice_tests` (7 : « 1 » = « I », tome 2 ne voit jamais 3 ni III, la notice sans tome voit tout, pareil pour les brouillons, anon fermé). Migration `20261008185801`, sur accord écrit de Xavier et sous son identité comme en C18 : cinq paires de même édition et même tome, dans deux bibliothèques, jamais fusionnées le 31/08 parce que le tome y est écrit autrement (« 1 » / « I », « Vol I » dans le titre) — Thomas, *A guerra civil espanhola* 1964, tomes 1 et 2 (305←2473, 304←2474) ; *Os Sindicatos operários e a Revolução social* vol. 1 (2311←2670) ; *Rebeldias* vol. 2 et 3 (1990←2683, 1989←2684). Notice la plus ancienne gardée, fonds MLEG sous sa propre cote, rien de copié depuis la notice MLEG (sa provenance d'import et ses « Assuntos importados » restent dans `merge_log.details`), un sujet manquant repris sur 1989. **Reste à une main** : 28 paires inter-bibliothèques de même édition sans tome d'aucun côté (liste tirée le 08/10 au soir), candidates ordinaires à trancher dans l'assistant ; une seule paire où un seul côté porte un tome (BTL-TL-000294 / BLMF 0000098, *A Internacional*). Plus tard dans la soirée, sur accord écrit (« là où les ISBN concordent »), migration `20261008201703` : les deux paires à ISBN identique des deux côtés fusionnées, notice BLMF gardée — Goldman, *O indivíduo, a Sociedade e o Estado* (2377 ← 1501 ; 2007 et 2011 sont deux impressions, l'année notée sur l'exemplaire BTL) et Reclus, *Renovação de uma Cidade* (2275 ← 1968). Puis, sur accord écrit (« résous les doublons sans perte de détails en gardant les exemplaires là où existent »), migration `20261008204237` : les 25 paires restantes relues notice contre notice et fusionnées (BLMF gardée si présente, sinon BTL ; fonds MLEG sous sa propre cote ; champs vides repris des notices BTL/BLMF, rien d'office des notices MLEG, titre MLEG pris quand la BTL porte une faute ; 14 sujets et 2 contributeurs repris ; « Edirora » corrigé). *A Internacional* (BTL-TL-000294 → BLMF 0000098) fusionnée par Xavier à l'écran : un seul volume est paru. Les 28 paires du relevé sont réglées. À part : les quatre tomes BTL d'*Acción directa anarquista* (œuvre 38) et les trois notices MLEG « Tomo II/III/IV » sans tome posé ne sont proposés par aucun détecteur (titres trop différents) et leur numérotation ne concorde pas — à régler les livres en main.","pt":"**Encerrado em 08/10** (REGISTRO `DEDUP-15`). Relatado por Xavier na lista plana do catálogo (a visão por obra agrupa os tomos; a opção «Lista plana» ficara gravada). Medido em produção: a varredura global descartava dois tomos diferentes desde o lote 4 (04/09), mas `suggest_book_duplicates` (o assistente numa ficha) e `api.suggest_draft_duplicates` (o formulário) não liam o tomo — 64 pares de tomos diferentes propostos por engano. Migração `20261008185800`: os dois detectores calculam a ordem do tomo como a varredura e excluem duas ordens conhecidas e diferentes; um tomo desconhecido de um lado continua candidato. Suíte `tomes_jamais_doublons_par_notice_tests` (7). Migração `20261008185801`, com acordo escrito de Xavier e sob sua identidade como em C18: cinco pares de mesma edição e mesmo tomo, em duas bibliotecas, nunca fundidos em 31/08 porque o tomo estava escrito de outro modo («1» / «I», «Vol I» no título) — Thomas, *A guerra civil espanhola* 1964, tomos 1 e 2; *Os Sindicatos operários e a Revolução social* vol. 1; *Rebeldias* vol. 2 e 3. Ficha mais antiga mantida, acervo MLEG com seu próprio número de chamada, nada copiado da ficha MLEG, um assunto recuperado. **Falta a uma mão**: 28 pares entre bibliotecas de mesma edição sem tomo de nenhum lado, candidatos comuns a decidir no assistente; um só par em que só um lado tem tomo (BTL-TL-000294 / BLMF 0000098). Mais tarde, com acordo escrito, migração `20261008201703`: os dois pares com o mesmo ISBN dos dois lados fundidos, ficha BLMF mantida — Goldman (2377 ← 1501) e Reclus (2275 ← 1968). Depois, com acordo escrito, migração `20261008204237`: os 25 pares restantes relidos ficha a ficha e fundidos (BLMF mantida se presente, senão BTL; acervo MLEG com seu próprio número de chamada; 14 assuntos e 2 contribuidores recuperados). *A Internacional* fundida por Xavier na tela. Os 28 pares do levantamento estão resolvidos. À parte: os tomos de *Acción directa anarquista* (obra 38, BTL e MLEG) não são propostos por nenhum detector e sua numeração não coincide — com os livros na mão."}],["E34","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), les trois critères tenus sur pièces : suite de 5 cas, migration en production, liste à soumettre vide (aucune notice basculée).** « Éditer » une notice en consultation la rend empruntable à la publication : la reprise oublie `circulation_default`. *Ce qui comptait comme fini* : La reprise d’une notice en consultation la laisse en consultation, non empruntable. · Les notices touchées en production sont listées pour Xavier. *Historique* : 07/10 — ouvert sur constat du lot 5 de H21 (en-tête de sa migration). **08/10 — livré, déployé et vérifié à 19 h 37** (`52fd90e2`, migration `20261008172304`, appliquée par la CI, `created_by` vide). *Cause confirmée sur la définition réelle* : `create_book_draft_from_book` recopiait 90 colonnes, pas `circulation_default` ; le déclencheur `fn_propagate_circulation_default_on_publish` (AFTER UPDATE OF status → published) réécrit `circulation_default` ET `loanable` depuis le brouillon — le brouillon né au défaut `'emprestavel'` basculait la notice. *Ce qui a protégé les notices jusqu'ici* : l'écran — `BookDraftForm` recalcule la circulation depuis `loanable` (recopié, lui) en chargeant le brouillon ; en production
