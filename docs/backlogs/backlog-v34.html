a Alemanha) — um terceiro de confiança, mas um terceiro, numa infraestrutura que uma medida do mesmo tipo pode atingir. Um Jitsi hospedado por nós (ou por um coletivo de hospedagem aliado, ou repartido entre vários) é a única saída completa. Não é a mesma carga que o resto da pilha: o videobridge consome largura de banda de subida na proporção das participantes. **Perguntas a fazer**: a VM aguenta um Jitsi (RAM, banda, porta UDP 10000); preferem uma segunda máquina; outro hospedeiro aliado (Chapril, Systemli, uma instância amiga) aceitaria carregar a videoconferência da rede, mesmo que não viva no mesmo lugar que a base? No mesmo dia, **o arquivo de fundo de mapa** (`map-tiles/planet-z12.pmtiles`, 18 GB, a reextrair em z15 a partir da VM: 138 GB) entrou no que se muda — a contar no disco pedido (I21)."},"y":{"fr":"C'est l'objectif que le projet s'est donné et qu'il n'a pas encore atteint : la fin de la dépendance à un hébergeur tiers. **C'est le chantier le plus technique et le plus autonome du lot** — quelqu'un peut le prendre sans coordination.","pt":"É o objetivo que o projeto se deu e que ainda não atingiu: o fim da dependência de um provedor terceiro. **É o canteiro mais técnico e mais autônomo do lote** — alguém pode assumi-lo sem coordenação."},"f":{"fr":["La pile tourne derrière un proxy inverse, avec les versions en empreintes.","Une reconstruction complète a été refaite un mois après la première.","Garde-fou à préserver impérativement : la boucle de déploiement parcourt `supabase/functions/*/` **en excluant `_shared` et `main`** — sans quoi le routeur partirait sur le Supabase hébergé.","Piège déjà rencontré : les rôles de service n'ont pas de mot de passe dans l'image `supabase/postgres` (SQLSTATE 28P01 en boucle), `postgres` n'est pas superutilisateur (c'est `supabase_admin`), `authenticator` est réservé, et un `set -e` dans la boucle tue le script au premier rôle en échec.","La question d'un Jitsi (chez l'hébergeur, chez un allié, ou réparti) a été posée, et la réponse est consignée ici — même si c'est « non »."],"pt":["A pilha roda atrás de um proxy reverso, com as versões em impressões.","Uma reconstrução completa foi refeita um mês após a primeira.","Guarda a preservar imperativamente: o laço de implantação percorre `supabase/functions/*/` **excluindo `_shared` e `main`** — sem o que o roteador iria para o Supabase hospedado.","Armadilha já encontrada: os papéis de serviço não têm senha na imagem `supabase/postgres` (SQLSTATE 28P01 em laço), `postgres` não é superusuário (é `supabase_admin`), `authenticator` é reservado, e um `set -e` no laço mata o script no primeiro papel em falha.","A pergunta de um Jitsi (no hospedeiro, num aliado, ou repartido) foi feita, e a resposta está registada aqui — mesmo que seja «não»."]},"dep":{"fr":"**Gelé sur la production jusqu'au 14/09.** Dépend de **I1**. À faire avant de louer quoi que ce soit : reprendre la connexion authentifiée en local, bloquée par une résolution IPv6 sans route — **ce blocage a probablement disparu de lui-même**, le vérifier coûte cinq minutes et peut épargner une machine montée pour rien.","pt":"**Congelado na produção até 14/09.** Depende de **I1**. A fazer antes de alugar o que quer que seja: retomar a conexão autenticada em local, bloqueada por uma resolução IPv6 sem rota — **esse bloqueio provavelmente desapareceu sozinho**, verificá-lo custa cinco minutos e pode poupar uma máquina montada à toa."},"r":["docs/CHANTIERS_OUVERTS.md §2","deploy/README.md","REPRISE_bascule_autohebergee_2026-08-26","SETUP_fonds_de_carte_pmtiles_2026-09-07","REGISTRE FED-O9 (08/09)"],"verif":[{"fr":"08/09 — l'hôte de la visio est Framatalk depuis ce jour (commits `88bba888`, `b75d4b2a`, REGISTRE FED-O9/AG-7) ; aucune réponse d'hébergeur sur un Jitsi n'a encore été demandée. Le fond de carte est un fichier de 18 Go dans le Storage (`map-tiles`), à faire suivre.","pt":"08/09 — o hospedeiro da videoconferência é o Framatalk desde este dia; nenhuma resposta de hospedeiro sobre um Jitsi foi ainda pedida. O fundo de mapa é um arquivo de 18 GB no Storage (`map-tiles`), a fazer seguir."},{"fr":"21/09 — **relu sur pièces et remesuré ; le « comment » de la fiche est en partie fait, et la journée a trouvé trois choses qu'aucune relecture ne pouvait voir.** *(a) Découpler la CI* : fait pour le backend depuis le 01/09 (`scripts/ci/deployer-backend.sh`, que `ci.yml` appelle) ; **fait ce jour pour le front** — `scripts/ci/publier-front.sh` rejoue hors forge le job `app` (l'action git-pages n'est qu'une image Docker, `git-pages-cli`), garde `publier-front-coherence` ; construction, `--simulation` et `--vers-dossier` exécutés, **publication réelle par ce chemin jamais faite** (`--essai` existe pour le premier tir). Et `deploy/deploy.sh` ne reconstruisait **jamais** le front d'une instance auto-hébergée (`install.sh` le construit une fois) : étape « Front » ajoutée, éprouvée sur une pile restaurée. *(b) Les pins d'images périmaient en silence* : la production était passée à GoTrue v2.197.0 (82 migrations) et Storage 1.73.1 (68) sous des pins à 77 et 65 ; remesurés au banc (`deploy/banc-paliers.sh`), puis **Storage a remonté le soir même** (1.77.5, 73 migrations, 20 h 43) — vu cette fois par la sonde `images_pins` de `health-probe`, livrée dans la journée (migrations `20260921181812` et `20260921190301`, incident ouvert, courriel reçu par Xavier à 20 h 45). Pins retenus : `v2.197.0` et `v1.77.0`, 344 colonnes `auth`+`storage` concordantes avec la production. *(c) Passe `--depuis-une-sauvegarde` sur un dump RÉEL sous ces images* : restauration en 62 s, huit décomptes identiques à la production (5 bibliothèques, 2 656 notices, 2 758 exemplaires, 20 comptes, 17 buckets, 833 objets), 831 fichiers reversés, deux objets servis octet pour octet, connexion par l'Edge Function `login`. Le dump, lui, a coûté 301 s (schéma) + 439 s (données, 37,6 Mo — le double du 26/08). **Trouvé en chemin** : `supabase db dump` n'emporte pas `supabase_migrations` — une instance restaurée ne pouvait plus jamais être mise à jour par `deploy.sh` (il rejouait le socle) ; **réparé** (troisième fichier `migrations.sql`, étape « 3 bis » de `restore.sh`, `restore-historique.sh`, garde-fou dans `apply-pending-migrations.sh`). Il n'emporte pas `cron.job` non plus : **I26**. Et un `pg_dump` lancé pendant qu'une migration attend en CI la fait mourir sur le statement timeout (run 1288, rouge d'une demi-heure, aucune écriture partielle). Pièce : `journal/operations/NOTE_pins-images-remesures_2026-09-21`. Restent au « comment » : le proxy inverse avec tunnel, les empreintes `sha256`, la répétition à froid, la question du Jitsi.","pt":"21/09 — **relido sobre peças e remedido; o « como » da ficha está em parte feito, e o dia achou três coisas que nenhuma releitura podia ver.** *(a) Desacoplar a CI*: feito para o backend desde 01/09 (`scripts/ci/deployer-backend.sh`); **feito hoje para o front** — `scripts/ci/publier-front.sh` repete fora da forja o job `app` (a ação git-pages é só uma imagem Docker, `git-pages-cli`), guarda `publier-front-coherence`; construção, `--simulation` e `--vers-dossier` executados, **publicação real por este caminho nunca feita** (`--essai` existe para o primeiro tiro). E `deploy/deploy.sh` **nunca** reconstruía o front de uma instância auto-hospedada: etapa « Front » acrescentada, provada numa pilha restaurada. *(b) Os pins de imagens caducavam em silêncio*: a produção tinha passado a GoTrue v2.197.0 (82 migrações) e Storage 1.73.1 (68) sob pins a 77 e 65; remedidos na bancada (`deploy/banc-paliers.sh`), e **o Storage subiu de novo na mesma noite** (1.77.5, 73 migrações, 20h43) — visto desta vez pela sonda `images_pins` do `health-probe`, entregue no mesmo dia (migrações `20260921181812` e `20260921190301`, incidente aberto, e-mail recebido por Xavier às 20h45). Pins retidos: `v2.197.0` e `v1.77.0`, 344 colunas `auth`+`storage` concordantes com a produção. *(c) Passagem `--depuis-une-sauvegarde` num dump REAL sob estas imagens*: restauração em 62 s, oito contagens idênticas à produção, 831 ficheiros repostos, dois objetos servidos byte a byte, login pela Edge Function `login`. O dump custou 301 s (esquema) + 439 s (dados, 37,6 MB — o dobro de 26/08). **Achado pelo caminho**: `supabase db dump` não leva `supabase_migrations` — uma instância restaurada nunca mais podia ser atualizada por `deploy.sh`; **reparado** (terceiro ficheiro `migrations.sql`, etapa « 3 bis » de `restore.sh`, `restore-historique.sh`, guarda em `apply-pending-migrations.sh`). Também não leva `cron.job`: **I26**. E um `pg_dump` lançado enquanto uma migração espera na CI fá-la morrer no statement timeout (run 1288, vermelho de meia hora, nenhuma escrita parcial). Peça: `journal/operations/NOTE_pins-images-remesures_2026-09-21`. Restam no « como »: o proxy inverso com túnel, as impressões `sha256`, a repetição a frio, a questão do Jitsi."},{"fr":"24/09 — le gel « jusqu au 14/09 » est levé ; état remis à « ouvert ». Restent au « comment » : proxy inverse avec tunnel, empreintes `sha256`, répétition à froid, la question du Jitsi — et I21 devant.","pt":"24/09 — congelamento levantado; estado reposto em « aberto »."}]},{"id":"K1","d":"K","p":"P0","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Faire adopter l'acte de création du Fonds AnarBib","pt":"Fazer adotar a ata de criação do Fundo AnarBib"},"v":{"fr":"Un projet d'acte est rédigé et archivé. Il n'a pas été adopté. **C'est le préalable politique à l'ouverture de tout canal d'encaissement : rien ne bouge avant.**","pt":"Um projeto de ata está redigido e arquivado. Não foi adotado. **É o preliminar político à abertura de qualquer canal de arrecadação: nada se move antes.**"},"w":{"fr":"L'acte doit faire quatre choses : créer le fonds, désigner nommément la personne qui tient la clé Pix, désigner la personne dépositaire de la part européenne, et fixer le principe du rapport annuel.","pt":"A ata deve fazer quatro coisas: criar o fundo, designar nominalmente a pessoa que detém a chave Pix, designar a pessoa depositária da parte europeia, e fixar o princípio do relatório anual."},"y":{"fr":"Les frais de fonctionnement — environ **36 € par mois, 430 € par an**, intégralement adossés à des factures — sortent aujourd'hui de la poche d'une seule personne. Deux caisses sont prévues, avec un seul registre : la caisse brésilienne finance les dépenses locales, la caisse européenne finance l'infrastructure. **L'argent doit atterrir là où les factures se paient.**","pt":"As despesas de funcionamento — cerca de **36 € por mês, 430 € por ano**, integralmente lastreadas em faturas — saem hoje do bolso de uma só pessoa. Duas caixas estão previstas, com um único registro: a caixa brasileira financia as despesas locais, a caixa europeia financia a infraestrutura. **O dinheiro deve pousar onde as faturas se pagam.**"},"f":{"fr":["L'acte est adopté et archivé.","La personne qui tient la clé Pix l'accepte en connaissance de cause.","Le nom public de la caisse est arrêté.","**Son article 1 suffit à lui seul à publier un canal honnêtement, si l'assemblée tarde.**"],"pt":["A ata está adotada e arquivada.","A pessoa que detém a chave Pix aceita com pleno conhecimento.","O nome público da caixa está definido.","**Seu artigo 1 basta sozinho para publicar um canal honestamente, se a assembleia demorar.**"]},"dep":{"fr":"Bloque **K2**.","pt":"Bloqueia **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25 §9","MINUTA_ata_fundo_anarbib_CCLA_2026-08-26"]},{"id":"K2","d":"K","p":"P1","s":"bloque","e":"M","sk":["collectif"],"t":{"fr":"Ouvrir les canaux d'encaissement dormants","pt":"Abrir os canais de arrecadação dormentes"},"v":{"fr":"Liberapay est en ligne et a reçu son premier don le 27/08. L'encart « soutenir financièrement » est publié dans les dix locales et nomme Liberapay comme unique canal ouvert. **Pix et IBAN dorment** dans un bloc de commentaire HTML entre les marqueurs `ENCART-DORMANT-START` et `ENCART-DORMANT-END`. Wero est en attente d'une réponse de l'établissement bancaire.","pt":"O Liberapay está no ar e recebeu sua primeira doação em 27/08. O encarte «apoiar financeiramente» está publicado nas dez locales e nomeia o Liberapay como único canal aberto. **Pix e IBAN dormem** num bloco de comentário HTML entre os marcadores `ENCART-DORMANT-START` e `ENCART-DORMANT-END`."},"w":{"fr":"Côté Brésil : une clé aléatoire dédiée créée par la personne mandatée, et l'ouverture d'un compte au numéro d'entreprise — une coopérative de crédit est plus cohérente qu'une banque commerciale. Côté Europe : décider quel compte reçoit. Puis remplir les gabarits, retirer les deux marqueurs de commentaire, et supprimer les deux paragraphes « en cours d'ouverture ».","pt":"Lado Brasil: uma chave aleatória dedicada criada pela pessoa mandatada, e a abertura de uma conta no CNPJ — uma cooperativa de crédito é mais coerente que um banco comercial. Lado Europa: decidir qual conta recebe. Depois preencher os modelos, retirar os dois marcadores de comentário, e suprimir os dois parágrafos «em abertura»."},"y":{"fr":"Le Pix ne peut pas être créé depuis la France — l'élargissement d'août 2026 ne vaut que pour envoyer. Et une clé posée sur le numéro fiscal personnel d'un compa l'expose au contrôle fiscal : d'où l'urgence du compte au numéro d'entreprise. Sur l'IBAN, la recommandation écrite est de le publier **en clair** — un « demander par courriel » fera perdre plus de dons qu'il n'évitera d'ennuis.","pt":"O Pix não pode ser criado desde a França — a ampliação de agosto de 2026 só vale para enviar. E uma chave posta no CPF pessoal de um compa o expõe à malha fina: daí a urgência da conta no CNPJ. Sobre o IBAN, a recomendação escrita é publicá-lo **em claro** — um «pedir por e-mail» fará perder mais doações do que evitará aborrecimentos."},"f":{"fr":["Au moins un canal supplémentaire est ouvert et publié dans les dix locales.","Le générateur des pages de comptes a été relancé après chaque édition de `FINANCES.md`.","Si la réponse sur Wero est négative, **la phrase Wero est retirée du bloc dormant des dix fichiers** — le gabarit y est encore.","Rappel : le hook `pre-push` refuse la poussée tant qu'un gabarit est visible hors du bloc dormant."],"pt":["Pelo menos um canal adicional está aberto e publicado nas dez locales.","O gerador das páginas de contas foi reexecutado após cada edição de `FINANCES.md`.","Se a resposta sobre o Wero for negativa, **a frase Wero é retirada do bloco dormente dos dez arquivos** — o modelo ainda está lá.","Lembrete: o hook `pre-push` recusa o push enquanto um modelo estiver visível fora do bloco dormente."]},"dep":{"fr":"**Bloqué par K1.**","pt":"**Bloqueado por K1.**"},"r":["PLAN_financement_AnarBib_2026-08-25","FINANCES.md"],"verif":{"fr":"31/08 — les marqueurs `ENCART-DORMANT-START` sont en place dans les dix fichiers du dépôt vitrine. Rien de neuf mesurable d'ici sur Pix, IBAN ou Wero.","pt":"31/08 — os marcadores `ENCART-DORMANT-START` estão nos dez arquivos do repositório vitrine."}},{"id":"K3","d":"K","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Tenir le registre public des comptes","pt":"Manter o registro público das contas"},"v":{"fr":"`FINANCES.md` est à la racine du dépôt vitrine et dix pages publiques en sont engendrées, par langue. Le générateur signale nommément toute cellule non traduite. Un tableau distinct porte ce qu'une personne a avancé avant que le fonds existe — environ **228 € de mars à août 2026** — et la question de savoir si c'est une dette à rembourser est laissée à l'assemblée.","pt":"`FINANCES.md` está na raiz do repositório vitrine e dez páginas públicas são geradas a partir dele, por língua. O gerador sinaliza nominalmente toda célula não traduzida. Uma tabela distinta traz o que uma pessoa adiantou antes de o fundo existir — cerca de **228 € de março a agosto de 2026** — e a questão de saber se é uma dívida a reembolsar fica para a assembleia."},"w":{"fr":"Consigner chaque recette et chaque dépense au fil de l'eau, et relancer le générateur après chaque édition.","pt":"Registrar cada receita e cada despesa continuamente, e reexecutar o gerador após cada edição."},"y":{"fr":"**Consigner les avances passées dès maintenant, avant la délibération** — dans un an, personne ne se souviendra des montants. Le régime de transparence choisi est le rapport annuel plus les comptes sur demande ; il ne tient que si le registre est à jour.","pt":"**Registrar os adiantamentos passados desde já, antes da deliberação** — daqui a um ano, ninguém se lembrará dos valores. O regime de transparência escolhido é o relatório anual mais as contas sob pedido; só se sustenta se o registro estiver atualizado."},"f":{"fr":["Le registre est à jour et les dix pages reflètent son contenu.","Anticipation notée : le renouvellement du domaine en mars 2027 coûtera plus cher, la promotion de première année ne se reconduisant pas."],"pt":["O registro está atualizado e as dez páginas refletem seu conteúdo.","Antecipação anotada: a renovação do domínio em março de 2027 custará mais caro, a promoção do primeiro ano não se renovando."]},"dep":{"fr":"Indépendant de **K1** et **K2**.","pt":"Independente de **K1** e **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25","tools/build-finances-pages.cjs"]},{"id":"K7","d":"K","p":"P1","s":"en-cours","e":"L","sk":["collectif"],"t":{"fr":"Mener la formation des deux coordinations BLMF jusqu'à l'autonomie","pt":"Conduzir a formação das duas coordenações BLMF até a autonomia"},"v":{"fr":"Le matériel est livré : 89 diapositives en portugais du Brésil, six modules, trois rencontres, six exercices pratiques, notes d'animation dans chaque diapositive. Ni l'une ni l'autre des deux personnes n'est bibliothécaire ou informaticienne.","pt":"O material está entregue: 89 slides em português do Brasil, seis módulos, três encontros, seis exercícios práticos, notas de animação em cada slide. Nenhuma das duas pessoas é bibliotecária ou informática."},"w":{"fr":"Avant la première séance : créer sur `blmf-teste` les deux comptes de coordination, un ou deux comptes de lecture fictifs, et les cinq fiches fautives de l'exercice 2. Puis le suivi de huit semaines : cinq fiches par semaine **toutes avec leur provenance**, un jour de comptoir par semaine, une consultation menée de bout en bout avec négociation réelle, et le vote du profil de la bibliothèque porté en assemblée.","pt":"Antes do primeiro encontro: criar em `blmf-teste` as duas contas de coordenação, uma ou duas contas de leitura fictícias, e as cinco fichas defeituosas do exercício 2. Depois o acompanhamento de oito semanas: cinco fichas por semana **todas com sua proveniência**, um dia de balcão por semana, uma consulta conduzida de ponta a ponta com negociação real, e o voto do perfil da biblioteca levado à assembleia."},"y":{"fr":"Deux personnes autonomes sur la coordination d'une bibliothèque, c'est **A1** à l'échelle locale. Le principe pédagogique tient en trois mots — *« cliqua, não vai quebrar nada ! »* — et il est tenable parce que les transitions impossibles ne s'affichent pas, les boutons bloqués sont pré-désactivés avec une explication, et la base refuse les combinaisons impossibles. Les neuf gestes irréversibles sont nommés explicitement.","pt":"Duas pessoas autônomas na coordenação de uma biblioteca é **A1** na escala local. O princípio pedagógico cabe em três palavras — *«cliqua, não vai quebrar nada!»* — e é sustentável porque as transições impossíveis não aparecem, os botões travados vêm pré-desativados com uma explicação, e o banco recusa as combinações impossíveis. Os nove gestos irreversíveis são nomeados explicitamente."},"f":{"fr":["Les huit semaines sont faites, avec le rituel hebdomadaire de trente minutes et ses trois questions fixes.","La feuille de lacunes alimentée par ce rituel devient l'ordre du jour suivant **et un matériau de contribution au projet**.","L'engagement chiffré est tenu : **aucune fiche nouvelle sans mode d'acquisition** — le rattrapage rétroactif des 2 450 fiches sans donnée d'acquisition n'est pas demandé, seul l'arrêt de la dette l'est."],"pt":["As oito semanas estão feitas, com o ritual semanal de trinta minutos e suas três perguntas fixas.","A folha de lacunas alimentada por esse ritual vira a pauta seguinte **e um material de contribuição ao projeto**.","O compromisso quantificado é cumprido: **nenhuma ficha nova sem modo de aquisição** — a recuperação retroativa das 2 450 fichas sem dado de aquisição não é pedida, só a parada da dívida é."]},"dep":{"fr":"S'appuie sur **G3** et **G4** pour le bac à sable.","pt":"Apoia-se em **G3** e **G4** para o ambiente de teste."},"r":["docs/journal/chantiers/formation-BLMF/PLAN_formation_coordination_BLMF_2026-09-01.docx","docs/journal/chantiers/formation-BLMF/CONDUCTEUR_seance1_BLMF.pdf","docs/journal/chantiers/formation-BLMF/ROTEIRO_capsula_sessao1_BLMF.pdf","docs/journal/chantiers/formation-BLMF/Formacao_coordenacao_BLMF_AnarBib.pptx","docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md"],"verif":{"fr":"07/09 — en base : la lectrice fictive « Voltairine de Teste » n'a **jamais** ouvert de session (`auth.users.last_sign_in_at` nul) ; aucun exemplaire créé depuis le 01/09, donc l'engagement « aucun exemplaire sans mode d'acquisition » n'est pas encore éprouvé. L'invitation BTL en attente est sortie en **G14**.\n\n**03/09 — préparation de la séance 1, vérifiée en base.** Les deux coordinations ont leur compte sur `blmf-teste` (Mariana S. active le 30/08 ; **Rafael G. sans connexion depuis le 24/06** — à vérifier au début de séance) ; les cinq fiches fautives de l'exercice 2 y sont depuis le 26/08 (`TESTE-9001-1`…`9005-1`) ; **mais aucun lecteur fictif** (le seul retiré le 02/09) et **aucune règle de circulation ni horaire** — impossible d'y jouer une réservation. Posé le 03/09 : le jeu de règles de la BLMF (six règles) et ses horaires copiés sur `blmf-teste`. Reste à la main de Xavier : inviter deux lecteur·rices fictif·ves (le bac à sable n'accepte pas l'inscription publique), vérifier l'entrée de Rafael, **trancher la collision de dates avec Bologne (11-13/09)**, et retrouver le plan et le gabarit — **absents du dépôt, du poste et des transcripts** (les références `PLAN_formation…` et `GABARITO…` de cette fiche sont des fantômes tant qu'ils ne sont pas déposés). Le parcours de la séance, étape par étape, page par page, compte par compte : `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md`. **03/09, fin de journée — les documents sont au dépôt et le dispositif n'est plus celui de la fiche.** Xavier a fourni le plan (révisé le 01/09), le conducteur de la séance 1, le roteiro de la capsule, les 89 diapositives et « O salto colegial » : déposés dans `docs/journal/chantiers/formation-BLMF/`. Le plan dit **sept soirées de 2 h 15, six modules, six exercices, une capsule de 40 minutes** — plus trois rencontres ; l'exercice 0 devient un travail personnel ; l'engagement chiffré est inchangé (5 exemplaires sur 2 758 avec mode d'acquisition). **Le « 13/09 » n'apparaît dans aucun document** : la première soirée n'est pas datée, et « collision avec Bologne » était une fausse alerte née d'une hypothèse du backlog. Bac à sable : deux lecteur·rices fictif·ves créé·es sur `blmf-teste` (Emma Teste, Errico Teste, adresses de Xavier ; mot de passe à poser par « Esqueci minha senha ») ; Voltairine de Teste existe mais ses adhésions ont été remaniées le 02/09 (lectrice retirée) ; règles et horaires copiés de la BLMF. La page `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md` est réécrite en **compléments au conducteur**. Reste : dater la soirée 1, poser les mots de passe, Rafael G., et corriger dans les diapositives les quatre réserves dépassées listées au §7 du plan avant la soirée 4. **Soirée 1 datée par Xavier : le 08/09/2026** (17 h 00 – 19 h 15). Voltairine de Teste repassée **lectrice** (bibliothécaire retirée) ; Emma et Errico Teste se sont connecté·es le 03/09 à 16 h 15 et 16 h 18 : le bac à sable a ses trois lecteur·rices.","pt":"07/09 — no banco: a leitora fictícia «Voltairine de Teste» **nunca** abriu sessão (`auth.users.last_sign_in_at` nulo); nenhum exemplar criado desde 01/09, logo o compromisso «nenhum exemplar sem modo de aquisição» ainda não foi provado. O convite BTL em espera saiu em **G14**.\n\n**03/09 — preparação da sessão 1, verificada na base.** Contas das duas coordenações em `blmf-teste` (Rafael G. sem login desde 24/06); as cinco fichas do exercício 2 desde 26/08; **mas nenhum leitor fictício** e **nenhuma regra de circulação** — regras e horários da BLMF copiados em 03/09. Fica com Xavier: convidar dois leitores fictícios, verificar Rafael, decidir a colisão de datas com Bolonha, encontrar o plano e o gabarito (ausentes do repositório). Percurso: `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md`. **03/09, fim do dia — os documentos estão no repositório e o dispositivo mudou.** Plano de 01/09, condutor, roteiro, 89 slides : em `formation-BLMF/`. Sete noites de 2h15, seis módulos, cápsula de 40 min. **O «13/09» não está em nenhum documento** : a primeira noite não tem data ; a «colisão com Bolonha» era um falso alarme. Duas leitoras fictícias criadas em `blmf-teste` (Emma Teste, Errico Teste). A página `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md` foi reescrita como complementos ao condutor. **Noite 1 datada por Xavier : 08/09/2026.** Voltairine de Teste voltou a **leitora** ; Emma e Errico Teste entraram em 03/09."}},{"id":"K8","d":"K","p":"P2","s":"ouvert","e":"M","sk":["collectif"],"t":{"fr":"Finir le texte d'orientation sur les outils de bibliothèques militantes","pt":"Terminar o texto de orientação sobre as ferramentas de bibliotecas militantes"},"v":{"fr":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` est un **squelette destiné à être co-signé**. Six points sont explicitement à vérifier ou à trancher, et la section finale — celle qui porte l'appel — reste à écrire.","pt":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` é um **esqueleto destinado a ser cossinado**. Seis pontos estão explicitamente a verificar ou decidir, e a seção final — a que carrega o chamado — resta escrever."},"w":{"fr":"Lister quelques hébergeurs associatifs, vérifier la vitalité actuelle de PMB, vérifier la licence exacte de Pandora et ce qu'implique l'entrée d'une archive partenaire, vérifier l'adresse de contact du réseau ALN, trancher la ligne « catalogue consultable, pas de prêt » du tableau, faire compléter la description d'AnarcosyndicalismeBOOK, et **écrire ensemble la section finale « Ce qui manque » — c'est l'appel**.","pt":"Listar alguns provedores associativos, verificar a vitalidade atual do PMB, verificar a licença exata do Pandora e o que implica a entrada de um arquivo parceiro, verificar o endereço de contato da rede ALN, decidir a linha «catálogo consultável, sem empréstimo» da tabela, fazer completar a descrição do AnarcosyndicalismeBOOK, e **escrever juntos a seção final «O que falta» — é o chamado**."},"y":{"fr":"Trois positions du texte méritent d'être tenues telles quelles. **La question qui décide de tout : qui tiendra le serveur, et pendant combien de temps ?** **Soyez honnêtes sur l'échelle** — en dessous de quelques centaines de documents sans prêt, un tableur fait le travail, et **AnarBib est surdimensionné pour un petit fonds sans prêt**. Et la déclaration d'intérêt explicite : les deux projets comparés sont libres, les deux sont tenus par une seule personne — **se le dire vaut mieux que de le découvrir**.","pt":"Três posições do texto merecem ser mantidas tais quais. **A pergunta que decide tudo: quem vai manter o servidor, e por quanto tempo?** **Sejam honestos quanto à escala** — abaixo de algumas centenas de documentos sem empréstimo, uma planilha faz o serviço, e **o AnarBib é superdimensionado para um pequeno acervo sem empréstimo**. E a declaração de interesse explícita: os dois projetos comparados são livres, os dois são mantidos por uma só pessoa — **dizer isso vale mais que descobrir**."},"f":{"fr":["Les six vérifications sont faites.","La section finale est écrite à plusieurs.","Le texte est traduit une fois stabilisé, pas avant."],"pt":["As seis verificações estão feitas.","A seção final está escrita em conjunto.","O texto é traduzido depois de estabilizado, não antes."]},"dep":{"fr":"Lié à **K5** et **H7**.","pt":"Ligado a **K5** e **H7**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26"]},{"id":"I18","d":"I","p":"P2","s":"en-cours","e":"M","sk":["sysadmin"],"t":{"fr":"Le banc CI ne rejoue pas sur une image Supabase — il faut un rejeu qui le fasse","pt":"O banco de CI não faz replay numa imagem Supabase — é preciso um que faça"},"v":{"fr":"`scripts/ci/run-sql-suites.sh` crée `anarbib_test` depuis `template0` : `pg_default_acl` y est vide, les fonctions naissent fermées, la vérification des migrations du 29/08 passe — et une image réelle la fait lever. Le vert de `sql-tests` n'atteste donc pas qu'une image Supabase rejoue le dépôt (`DOC-GRANT-2`, même limite structurelle que `DOC-MIGR-1` par l'autre bout). Le choix de `template0` est motivé (pas d'event triggers hérités) et reste bon pour les suites. **07/09** : la spec d'`I17` (§8) rend cet item bon marché — le service `sql-tests` lance déjà l'image ; il suffit d'un second job qui rejoue les migrations dans la base `postgres` du service (défauts et extensions de l'init posés) au lieu d'une base `template0`. **07/09, confirmé par l'expérience d'`I17`** : avec A.1 avant le socle et `CREATE EXTENSION pg_cron`, la base `postgres` de l'image rejoue les 310 migrations sous `postgres` ; le job serait vert aujourd'hui. **16/09 : livré.** Job `rejeu-image` dans `sql-tests.yml` (`scripts/ci/run-image-replay.sh`) : même service Postgres, rejeu dans la base `postgres` de l'image par les deux scripts de la pile (`deploy/init-db/01-roles.sh` : mots de passe, A.1, `pg_cron` ; `deploy/scripts/run-migrations.sh` sous `postgres`), qui parlent à l'image par `PGHOST` au lieu du socket — un `install.sh` sans conteneurs applicatifs. Entre les deux, ce que la pile obtient de ses services avant de migrer (bootstrap.sh 3/8 et 4/8) : le sel au Vault réel par `vault.create_secret`, les stubs `auth` et `storage` de sql-tests, et un stub de pont `tests/sql/_ci_setup_image_services_stub.sql`. **Quatre manques de l'image nue, mesurés en chemin, sans lesquels un rejeu à froid s'arrête** : `auth.jwt()` absent (socle, l. 41402) ; `auth.users` d'origine sans `email_confirmed_at`, `is_sso_user`, `is_anonymous` (`20260623204043`) ; `auth.uid()` d'origine qui ne lit que `request.jwt.claim.sub`, pas `request.jwt.claims` (`20260702081711`, « Nenhum usuário autenticado ») ; `storage.buckets` créée fermée à `postgres`, l'image n'ayant aucun privilège par défaut sur `storage` (`20260820012512`). Le stub dit chacun. Éprouvé quatre fois sur conteneur jetable `public.ecr.aws/supabase/postgres:17.6.1.084` : **320/320 en 54 s sous `postgres`, 133 fonctions exécutables par `anon` (public, api, ingest, private), empreinte MD5 identique à la production du 15/09, 38 crons, 0 table sans RLS**, 64 s bout en bout. `alerte` et `acquittement` comptent les deux jobs. Reste : le premier run de la forge, puis le critère 2 (un rouge pour une vraie raison, corrigé).","pt":"`scripts/ci/run-sql-suites.sh` cria `anarbib_test` a partir de `template0`: `pg_default_acl` está vazia, as funções nascem fechadas e a verificação passa — uma imagem real a faz falhar. O verde do `sql-tests` não atesta que uma imagem Supabase reproduz o repositório. **07/09**: a spec de `I17` (§8) torna este item barato — basta um segundo job que reproduza as migrações no banco `postgres` do serviço em vez de um banco `template0`. **07/09, confirmado pela experiência de `I17`**: com A.1 antes da base e `CREATE EXTENSION pg_cron`, o banco `postgres` da imagem reproduz as 310 migrações sob `postgres`; o job estaria verde hoje. **16/09: entregue.** Job `rejeu-image` em `sql-tests.yml` (`scripts/ci/run-image-replay.sh`): mesmo serviço Postgres, replay no banco `postgres` da imagem pelos dois scripts da pilha (`01-roles.sh`: A.1 e `pg_cron`; `run-migrations.sh` sob `postgres`), precedido do que a pilha obtém dos seus serviços antes de migrar (sal no Vault real, stubs `auth`/`storage`, stub de ponte `_ci_setup_image_services_stub.sql`). Quatro faltas da imagem nua medidas no caminho: `auth.jwt()` ausente; `auth.users` de origem sem `email_confirmed_at` / `is_sso_user` / `is_anonymous`; `auth.uid()` de origem que não lê `request.jwt.claims`; `storage.buckets` fechada a `postgres`. Provado quatro vezes em contêiner descartável `17.6.1.084`: **320/320 em 54 s, 133 funções `anon`, MD5 idêntico à produção, 38 crons, 0 tabela sem RLS**. Falta: o primeiro run da forja e o critério 2 (um vermelho por razão real, corrigido)."},"w":{"fr":"Lire le run dans Actions. Quand il rougit, corriger la cause — une migration, ou le pont si l'image ou GoTrue ont bougé — jamais le job. Le jour où un rouge motivé est corrigé, clore (critère 2).","pt":"Ler o run em Actions. Quando ficar vermelho, corrigir a causa — uma migração, ou a ponte — nunca o job. No dia em que um vermelho motivado for corrigido, encerrar (critério 2)."},"y":{"fr":"Toute assertion « N migrations rejouent de zéro » se mesure sur une image Supabase, jamais sur le banc CI. Sans ce job, c'est la prochaine personne extérieure qui fera la mesure, à ses frais.","pt":"Toda afirmação « N migrações reproduzem do zero » mede-se numa imagem Supabase, nunca no banco de CI."},"f":{"fr":["Un job de la forge rejoue les migrations sur `supabase/postgres` et son résultat est lisible dans Actions.","Il a été rouge une fois pour une vraie raison, et la raison a été corrigée."],"pt":["Um job da forja reproduz as migrações em `supabase/postgres` com resultado legível em Actions.","Foi vermelho uma vez por uma razão real, corrigida."]},"dep":{"fr":"Après **I17** (sinon le job sera rouge pour la raison déjà connue).","pt":"Depois de I17."},"r":["scripts/ci/run-sql-suites.sh","REGISTRE §0 DOC-GRANT-2","REGISTRE §0 DOC-MIGR-1","scripts/ci/run-image-replay.sh","tests/sql/_ci_setup_image_services_stub.sql",".forgejo/workflows/sql-tests.yml","deploy/init-db/01-roles.sh","deploy/scripts/run-migrations.sh"],"verif":[{"fr":"16/09 — job écrit et éprouvé quatre fois sur conteneur jetable `public.ecr.aws/supabase/postgres:17.6.1.084` (worktree `claude/i18`), liste des 133 fonctions `anon` comparée ligne à ligne à celle du 15/09, empreinte identique ; pile locale (GoTrue, Storage réels) consultée pour les droits et `auth.uid()`.","pt":"16/09 — job escrito e provado quatro vezes em contêiner descartável `17.6.1.084` (worktree `claude/i18`), lista das 133 funções `anon` comparada linha a linha com a de 15/09, MD5 idêntico."},{"fr":"21/09 — **premier critère tenu sur la forge, second en attente par construction ; la fiche avait cinq jours de retard.** Le job `rejeu-image` (`sql-tests.yml`, commit `d5228c7f`) a tourné **huit fois** sur la forge entre le 16/09 et le 21/09 (relevé par l'API `actions/tasks`), **huit fois vert**, lisible dans Actions — dont le 21/09 sur la migration de B27. Une autre session l'écrit « livré et vert sur la forge » le 21/09. Le second critère — « il a été rouge une fois pour une vraie raison, et la raison a été corrigée » — ne peut pas être provoqué : l'item reste ouvert pour lui, et pour lui seul.","pt":"21/09 — **primeiro critério cumprido na forja, segundo em espera por construção.** O job `rejeu-image` correu **oito vezes** entre 16/09 e 21/09, **oito vezes verde**. O segundo critério — « ficou vermelho uma vez por uma razão real » — não se pode provocar: o item fica aberto só por ele."},{"fr":"28/09 — un écart de plus entre le banc `template0` et la plate-forme, trouvé par B32 (`f4622aab`) : le banc n'accordait pas `USAGE` sur le schéma `extensions` à `anon`, `authenticated` et `service_role`, que la production accorde (ACL relevée le 28/09). Le cache de plan le masquait ; quand le REFRESH d'une fixture l'a invalidé, `opac_par_oeuvre` T8 a levé 42501 sous `anon`. `scripts/ci/run-sql-suites.sh` pose désormais ce droit avant les migrations, comme la plate-forme. Ce n'est pas le second critère : ce rouge venait du banc `template0`, pas du job `rejeu-image`.","pt":"28/09 — mais uma diferença entre o banco de CI `template0` e a plataforma, achada pelo B32 (`f4622aab`): ele não concedia `USAGE` no esquema `extensions` a `anon`, `authenticated` e `service_role`, como a produção concede. O cache de planos escondia isso até um REFRESH de fixture invalidá-lo (42501 em `opac_par_oeuvre` T8). `run-sql-suites.sh` concede agora esse direito antes das migrações. Não é o segundo critério: o vermelho veio do banco `template0`, não do job `rejeu-image`."}]},{"id":"H12","d":"H","p":"P3","s":"ouvert","e":"S","sk":["aucune","collectif"],"t":{"fr":"Les listes hors thésaurus de la FICEDL — communes du Bettini, lieux d'édition du Bianco : demander l'export tel quel, jamais l'intégration","pt":"As listas fora do tesauro da FICEDL — municípios do Bettini, lugares de edição do Bianco: pedir a exportação como está, nunca a integração"},"v":{"fr":"Réponse de la source, 07/09 : deux référentiels existent hors thésaurus — les communes des biographies du *Bettini* (avec cartographie) et les lieux d'édition du *Bianco* — « pas intégrées au thésaurus, probablement trop lourd à gérer ». AnarBib n'a aucune autorité de lieux : `local_publicacao` est un champ libre (audit du 20/08 : `BELEM`), et la spec périodiques a écarté l'alignement FICEDL au motif que le thésaurus indexe des matières — vrai pour les matières, faux pour les lieux.","pt":"Resposta da fonte, 07/09: dois referenciais existem fora do tesauro — os municípios das biografias do *Bettini* (com cartografia) e os lugares de edição do *Bianco* — «não integrados ao tesauro, provavelmente pesado demais para gerir». O AnarBib não tem nenhuma autoridade de lugares: `local_publicacao` é campo livre (auditoria de 20/08: `BELEM`), e a spec de periódicos descartou o alinhamento FICEDL porque o tesauro indexa assuntos — verdade para os assuntos, falso para os lugares."},"w":{"fr":"Après Bologne, et hors de la demande du 12 (qui tient parce qu'elle demande *une* chose) : demander les deux listes comme fichiers séparés, telles qu'elles sont. Puis aligner sur un référentiel géographique existant (Wikidata, GeoNames) avec la liste du Bianco en surcouche militante — pas construire une n-ième liste de communes.","pt":"Depois de Bolonha, e fora do pedido do dia 12 (que se sustenta porque pede *uma* coisa): pedir as duas listas como arquivos separados, como estão. Depois alinhar a um referencial geográfico existente (Wikidata, GeoNames) com a lista do Bianco como sobrecamada militante — não construir mais uma lista de municípios."},"y":{"fr":"Demander l'intégration, c'est demander la charge que la source dit ne pas pouvoir porter. Une liste n'a pas besoin d'être dans le thésaurus pour être utile ; elle a besoin d'être copiable.","pt":"Pedir a integração é pedir a carga que a fonte diz não poder carregar. Uma lista não precisa estar no tesauro para ser útil; precisa ser copiável."},"f":{"fr":["Les deux listes reçues sous une forme machine-lisible, versées à `docs/journal/ficedl/`.","Une décision écrite sur l'autorité de lieux d'AnarBib."],"pt":["As duas listas recebidas em forma legível por máquina, versadas em `docs/journal/ficedl/`.","Uma decisão escrita sobre a autoridade de lugares do AnarBib."]},"dep":{"fr":"Après **K5**. Touche `spec-periodiques` et **C3** (autorités).","pt":"Depois de **K5**. Toca `spec-periodiques` e **C3** (autoridades)."},"r":["REGISTRE §30 THES-FIC-O2","claude/REPONSE_hortical_deux_thesaurus_2026-09-07","claude/spec-periodiques-v0.1 §5"]},{"id":"K10","d":"K","p":"P2","s":"a-verifier","e":"M","sk":["langue"],"t":{"fr":"Trois articles promis au *Monde libertaire*, un par mois — et une émission proposée à *Trous Noirs*","pt":"Três artigos prometidos ao *Monde libertaire*, um por mês — e um programa proposto à *Trous Noirs*"},"v":{"fr":"Session du 30/08 : le courriel à Monique et Serge (Radio Libertaire, *Trous Noirs*) écrit « Le Monde libertaire en publie trois articles dans les mois qui viennent, un par mois ». **Non vérifié** : ni la remise du premier article, ni l'envoi du courriel, ni la réponse. Aucun item du backlog ne portait cet engagement.","pt":"Sessão de 30/08: o e-mail a Monique e Serge (Radio Libertaire, *Trous Noirs*) escreve «Le Monde libertaire en publie trois articles dans les mois qui viennent, un par mois». **Não verificado**: nem a entrega do primeiro artigo, nem o envio do e-mail, nem a resposta. Nenhum item do backlog carregava esse compromisso."},"w":{"fr":"Dire ici où en sont les trois articles (rendu, relu, publié) et si le courriel est parti ; puis tenir le rythme — un article par mois est une dette qui se voit.","pt":"Dizer aqui onde estão os três artigos (entregue, revisto, publicado) e se o e-mail saiu; depois manter o ritmo — um artigo por mês é uma dívida que se vê."},"y":{"fr":"Une promesse faite à un journal militant engage le projet autant qu'un déploiement : elle se lit dans les numéros où l'article manque.","pt":"Uma promessa feita a um jornal militante compromete o projeto tanto quanto um deploy: lê-se nos números em que o artigo falta."},"f":{"fr":["Trois dates de parution, ou une renégociation écrite du rythme."],"pt":["Três datas de publicação, ou uma renegociação escrita do ritmo."]},"dep":{"fr":"Voisin de **K5** ; sans dépendance technique.","pt":"Vizinho de **K5**; sem dependência técnica."},"r":["session Cowork « Monde libertaire article publication », 30/08/2026"],"verif":[{"fr":"07/09 — engagement relevé dans une session, aucune trace de suivi ailleurs.","pt":"07/09 — compromisso encontrado numa sessão, nenhum rastro de acompanhamento em outro lugar."},{"fr":"**08/10 — Xavier : « Paru. Un article ce mois-ci dans le ML. »** Le premier des trois articles est paru dans *Le Monde libertaire* d'octobre 2026. Restent deux parutions (ou une renégociation écrite) ; rien sur l'émission *Trous Noirs*.","pt":"**08/10 — Xavier: « Publicado. Um artigo este mês no ML. »** Primeiro dos três artigos publicado em outubro de 2026. Restam dois."}]},{"id":"I21","d":"I","p":"P1","s":"ouvert","e":"M","sk":["sysadmin","collectif"],"t":{"fr":"Ce qui doit être vrai avant la bascule chez Les Herbes Folles, et ne l'est pas encore — huit conditions, aucune technique difficile","pt":"O que deve ser verdade antes da virada para Les Herbes Folles, e ainda não é — oito condições, nenhuma tecnicamente difícil"},"v":{"fr":"La décision du 07/09 (offre confirmée : VM IPv4, Debian, sauvegardes déjà chez eux) et la note du 05-06/09 laissent une liste que rien ne tient ensemble. **Vérifié le 07/09 dans `deploy/`** : aucune trace d'`unattended-upgrades`, de pare-feu ni d'authentification par clé seule. Le reste est humain ou local : la connexion authentifiée sur la pile locale jamais retestée depuis le retrait de Turnstile ; `deploy/.env` écrasé par `install.sh` (domaines sur `localhost`) sans copie connue ; l'essai depuis un réseau mobile brésilien (NAT64) jamais fait ; le délai d'intervention des Herbes Folles jamais demandé ; le moyen de leur verser de l'argent « demandé depuis juillet, sans réponse » ; un second détenteur des accès ; et la règle posée le 07/09 : **on ne bascule pas avant que la sauvegarde soit partie chez un tiers** — aujourd'hui les trois flux restic sont chez l'hébergeur de destination lui-même.","pt":"A decisão de 07/09 (oferta confirmada: VM IPv4, Debian, backups já lá) e a nota de 05-06/09 deixam uma lista que nada mantém junta. **Verificado em 07/09 em `deploy/`**: nenhum rastro de `unattended-upgrades`, firewall nem autenticação só por chave. O resto é humano ou local: a conexão autenticada na pilha local nunca retestada desde a retirada do Turnstile; `deploy/.env` sobrescrito por `install.sh` (domínios em `localhost`) sem cópia conhecida; o teste a partir de uma rede móvel brasileira (NAT64) nunca feito; o prazo de intervenção de Les Herbes Folles nunca pedido; o meio de lhes pagar «pedido desde julho, sem resposta»; um segundo detentor dos acessos; e a regra posta em 07/09: **não se vira antes que o backup tenha ido para um terceiro** — hoje os três fluxos restic estão no próprio hospedeiro de destino."},"w":{"fr":"Tenir la liste ici, cocher chaque condition avec sa preuve (fichier, courriel, essai daté). Le durcissement entre dans `deploy/` ; le dépôt de sauvegarde tiers se demande à Bologne (**I12** dit ce que le miroir froid couvre, et ce n'est pas ça).","pt":"Manter a lista aqui, marcar cada condição com sua prova (arquivo, e-mail, teste datado). O endurecimento entra em `deploy/`; o depósito de backup terceiro pede-se em Bolonha (**I12** diz o que o espelho frio cobre, e não é isso)."},"y":{"fr":"Chacune de ces conditions est petite. Ensemble, c'est la différence entre une bascule et un déménagement de la fragilité.","pt":"Cada condição é pequena. Juntas, são a diferença entre uma virada e uma mudança de endereço da fragilidade."},"f":{"fr":["Les huit conditions cochées avec preuve, dans cet item.","`deploy/` porte le durcissement, rejoué par `bootstrap.sh`."],"pt":["As oito condições marcadas com prova, neste item.","`deploy/` carrega o endurecimento, reexecutado por `bootstrap.sh`."]},"dep":{"fr":"Bloque **I2**. Le dépôt tiers et le second détenteur relèvent de la même conversation que **A1** (Bologne).","pt":"Bloqueia **I2**. O depósito terceiro e o segundo detentor pertencem à mesma conversa que **A1** (Bolonha)."},"r":["claude/DECISION_herbesfolles_offre_confirmee_2026-09-07","claude/NOTE_sortie_services_etats_uniens_2026-09-05","claude/REPRISE_claude_code_PR28_revoke_anon_2026-09-06 (deploy/.env)"],"verif":[{"fr":"07/09 — `deploy/` sans durcissement ; les sept autres conditions non vérifiables depuis la base.","pt":"07/09 — `deploy/` sem endurecimento; as outras sete condições não verificáveis a partir do banco."},{"fr":"17/09 — **I16 y verse une condition** : `install.sh` (PR #28) exécuté une fois sur une machine vierge qui n'est pas celle de son auteur, écarts consignés — l'épreuve que la pile n'a pas encore passée hors de chez le camarade (avec le routeur `main`, I3, et le rejeu CI sur l'image Supabase, I18).","pt":"17/09 — **I16 verte aqui uma condição**: `install.sh` (PR #28) executado uma vez numa máquina virgem que não é a do seu autor, desvios registados — a prova que a pilha ainda não passou fora da casa do companheiro (com o router `main`, I3, e a reprodução CI na imagem Supabase, I18)."},{"fr":"21/09 — **une affirmation du constat tombe, relue sur pièces.** La fiche dit « la connexion authentifiée sur la pile locale jamais retestée depuis le retrait de Turnstile ». C'était déjà faux le 07/09, jour où elle a été écrite : `journal/operations/NOTE_bootstrap-premiere-execution_2026-08-26` §5 décrit l'essai fait le 26/08, après le retrait de Turnstile (AR-2/AR-3) — compte créé par l'API admin, connexion directe GoTrue, **connexion par l'Edge Function `login` : HTTP 200, jeton émis**, zéro appel à `challenges.cloudflare.com`. La rédaction du 07/09 n'avait pas ouvert cette note. **Refait le 21/09** sur une pile reconstruite par `bootstrap.sh --depuis-le-depot --sel-jetable` aux pins remesurés ce jour (GoTrue v2.197.0, Storage v1.72.0) : création 200, GoTrue direct 200, `login` 200 avec jeton, mauvais mot de passe 401, le jeton lit `rest/v1/libraries` en 200, zéro occurrence de « cloudflare » ou « turnstile » dans les journaux des six conteneurs (`journal/operations/NOTE_pins-images-remesures_2026-09-21` §4). Cette condition-là est donc **tenue, avec preuve datée** ; ce qu'elle ne couvre pas : un navigateur réel devant le front reconstruit, et un compte revenu d'un dump de production. Les sept autres conditions sont inchangées.","pt":"21/09 — **uma afirmação do constato cai, relida sobre peças.** A ficha diz « a conexão autenticada na pilha local nunca retestada desde a retirada do Turnstile ». Já era falso em 07/09, dia em que foi escrita: `journal/operations/NOTE_bootstrap-premiere-execution_2026-08-26` §5 descreve o ensaio feito em 26/08, depois da retirada do Turnstile (AR-2/AR-3) — conta criada pela API admin, conexão direta ao GoTrue, **conexão pela Edge Function `login`: HTTP 200, token emitido**, zero chamadas a `challenges.cloudflare.com`. A redação de 07/09 não tinha aberto essa nota. **Refeito em 21/09** numa pilha reconstruída por `bootstrap.sh --depuis-le-depot --sel-jetable` com os pins remedidos nesse dia (GoTrue v2.197.0, Storage v1.72.0): criação 200, GoTrue direto 200, `login` 200 com token, senha errada 401, o token lê `rest/v1/libraries` em 200, zero ocorrências de « cloudflare » ou « turnstile » nos diários dos seis contêineres (`journal/operations/NOTE_pins-images-remesures_2026-09-21` §4). Essa condição está portanto **cumprida, com prova datada**; o que ela não cobre: um navegador real diante do front reconstruído, e uma conta vinda de um dump de produção. As outras sete condições não mudam."},{"fr":"27/09 — I3 est clos (`738283d5`) et confie un reste à cet item. Le routeur `main`, lancé seul dans un edge-runtime isolé, démarre et décide juste (`deploy/scripts/essai-routeur-main.sh`, 7/7, rejouable). Une fonction dispensée (`health-probe`) n'y est pas bloquée, mais, sans base ni secrets, elle répond 500. **À prouver ici, à la répétition complète** : qu'elle réponde 200 avec la base et les secrets de la pile.","pt":"27/09 — o I3 foi fechado (`738283d5`) e deixa um resto para este item. O roteador `main`, sozinho num edge-runtime isolado, inicia e decide certo (`deploy/scripts/essai-routeur-main.sh`, 7/7, reproduzível). Uma função dispensada (`health-probe`) não é bloqueada, mas, sem banco nem segredos, responde 500. **A provar aqui, no ensaio completo**: que ela responda 200 com o banco e os segredos da pilha."}]},{"id":"F10","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno","collectif"],"t":{"fr":"Sortir de Resend : un relais militant à demander, un transport à écrire, l'aiguillage à rétablir — et `sendViaBrevo` traîne encore dans `email.ts`","pt":"Sair do Resend: um relay militante a pedir, um transporte a escrever, o roteamento a restabelecer — e `sendViaBrevo` ainda está em `email.ts`"},"v":{"fr":"**Vérifié dans le dépôt le 07/09** : `supabase/functions/_shared/transport/email.ts` connaît deux transports, `sendViaResend` et `sendViaBrevo` — le second survit au retrait de Brevo (R.6/R.7, annoncé clos). Aucun transport SMTP générique, donc aucun moyen de brancher un relais militant (ARN, Nodo50, bida.im) le jour où l'un dit oui. La note du 05-06/09 place cette sortie après Bologne, derrière la demande d'un relais SMTP le 12.","pt":"**Verificado no repositório em 07/09**: `supabase/functions/_shared/transport/email.ts` conhece dois transportes, `sendViaResend` e `sendViaBrevo` — o segundo sobrevive à retirada do Brevo (R.6/R.7, anunciado fechado). Nenhum transporte SMTP genérico, logo nenhum meio de ligar um relay militante (ARN, Nodo50, bida.im) no dia em que um disser sim. A nota de 05-06/09 põe essa saída depois de Bolonha, atrás do pedido de um relay SMTP no dia 12."},"w":{"fr":"Demander avant de choisir (les relais militants d'abord, Scaleway en repli) ; écrire `sendViaSmtp` (ou le transport retenu) et rétablir un aiguillage par variable ; supprimer `sendViaBrevo` ; ne faire lever que ce qui doit lever (**F7** est clos là-dessus).","pt":"Pedir antes de escolher (os relays militantes primeiro, Scaleway como recuo); escrever `sendViaSmtp` (ou o transporte escolhido) e restabelecer um roteamento por variável; remover `sendViaBrevo`; só levantar erro onde deve (**F7** está fechado nisso)."},"y":{"fr":"Resend est le dernier service états-unien après Supabase. Sortir de l'un sans l'autre laisse la moitié de la dépendance, et la moitié la plus bavarde : le courriel des lectrices.","pt":"O Resend é o último serviço estadunidense depois do Supabase. Sair de um sem o outro deixa metade da dependência, e a metade mais falante: o e-mail das leitoras."},"f":{"fr":["Un courriel réel part par le nouveau transport, depuis la production, vers une boîte tierce.","`sendViaBrevo` n'existe plus dans le dépôt."],"pt":["Um e-mail real sai pelo novo transporte, da produção, para uma caixa terceira.","`sendViaBrevo` não existe mais no repositório."]},"dep":{"fr":"Après **K5** (relais demandé à Bologne). Pas avant **I2** : changer de transport et d'hébergeur la même semaine, c'est deux inconnues.","pt":"Depois de **K5** (relay pedido em Bolonha). Não antes de **I2**: mudar de transporte e de hospedeiro na mesma semana são duas incógnitas."},"r":["claude/NOTE_sortie_services_etats_uniens_2026-09-05 (chemin, étape 4)","spec-migration-mail-resend"],"verif":{"fr":"07/09 — deux transports dans `email.ts`, aucun SMTP.","pt":"07/09 — dois transportes em `email.ts`, nenhum SMTP."}},{"id":"F19","d":"F","p":"P1","s":"a-verifier","e":"S","sk":["deno"],"t":{"fr":"Les journaux des fonctions contiennent les adresses des destinataires en clair","pt":"Os registros das funções contêm os endereços em claro"},"v":{"fr":"Relevé par la carte F1 (30/09). Les journaux des fonctions Edge portent des lignes « [user_mail] sent to <adresse> » et « [admin_copy] sent to <adresse> » depuis au moins le 04/08 : toute personne qui consulte les journaux lit les adresses des lectrices et du staff.","pt":"Achado pelo mapa F1. Os registros das Edge Functions trazem « sent to <endereço> » desde pelo menos 04/08."},"w":{"fr":"Masquer l'adresse dans tous les journaux d'envoi (domaine seul, ou empreinte courte), à la source commune (`_shared/transport/email.ts` et les gestionnaires qui journalisent eux-mêmes) ; un test de source refuse un `console.log` qui imprime une adresse.","pt":"Mascarar o endereço em todos os registros de envio, na fonte comum; teste de fonte."},"y":{"fr":"Une fuite de données personnelles continue, dans un outil que plusieurs personnes peuvent lire.","pt":"Vazamento contínuo de dados pessoais."},"f":{"fr":["Plus aucune adresse complète dans les journaux d'envoi (relevé sur une semaine de journaux après le correctif)."],"pt":["Nenhum endereço completo nos registros após a correção."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["docs/journal/audits/CARTE_chaine_courriel_2026-09-30.md"],"verif":[{"fr":"**30/09** — livré et déployé (`4158504a`, CI verte, les 55 fonctions redéployées le 30/09 à 22 h 01 ; puis de nouveau le 01/10 avec F17). `masquerAdresse` à la source (transport, notificateurs) et un filet sur `console.*` installé au chargement sous Deno ; banc `journal-sans-adresse` (les 55 fonctions atteignent le masque) ; éprouvé sous Deno 2.7. **Reste le critère** : une semaine de journaux d'envoi sans adresse complète — à relever le 08/10.","pt":"**30/09** — entregue e implantado (`4158504a`). Falta o critério: uma semana de registros sem endereço completo (08/10)."},{"fr":"**08/10 — relevé d'une semaine de journaux (01 → 08/10, `function_logs`, 10 400 lignes)** : zéro adresse complète sur six jours ; **trois lignes le 05/10 à 13 h 22**, toutes de `register` (« routing », « welcome email request », « admin internal email request » : `admin_recipients` et `to` écrits en clair, un compte créé ce jour-là). Le filet de `console.*` et `masquerAdresse` à la source ne couvrent donc pas `register`, qui journalise des objets entiers. **Le critère n'est pas tenu** ; à corriger dans `register/index.ts` (masquer ou retirer ces trois journaux), puis relever une nouvelle semaine.","pt":"**08/10 — uma semana de diários lida**: zero endereço em seis dias; **três linhas em 05/10**, todas de `register` (objetos inteiros no diário). Critério não cumprido; corrigir `register/index.ts` e reler uma semana."},{"fr":"**08/10 — corrigé à la source dans `register`** (`ce792be4`, CI verte, fonctions redéployées) : les deux journaux d'objets (« routing » — `admin_recipients`, `effective_library_internal_recipients`, `channel_admin_email`, `configured_contact_email` — et « request » — `to`) passent par `masquerAdresses(JSON.stringify(…))` AVANT `console.log`. *Ce que les trois lignes du 05/10 apprennent* : elles sont au format de `Deno.inspect` (objets dépliés sur plusieurs lignes), pas au JSON du filet — **le filet global posé sur `console` par `deps.ts` ne tient pas dans l'exécuteur Edge de production**, qui journalise par sa propre console ; il reste utile au banc et sous Deno local, mais seule la règle « masquer à la source, sur chaque ligne qui cite un destinataire » protège vraiment, et c'est elle que la garde `journal-sans-adresse` (T « toute ligne console.* qui cite un destinataire ») doit tenir. **Reste le critère** : une nouvelle semaine de journaux sans adresse, à relire vers le 15/10 (`query_logs`, source `function_logs`, 24 h par requête, sept requêtes).","pt":"**08/10 — corrigido na fonte em `register`** (`ce792be4`): os dois diários de objetos passam por `masquerAdresses(JSON.stringify(…))` antes do `console.log`. Lição: a rede global sobre `console` não se mantém no executor Edge de produção; só o mascaramento na fonte protege. **Resta** uma nova semana de diários sem endereço, por volta de 15/10."}]},{"id":"J10","d":"J","p":"P3","s":"ouvert","e":"M","sk":["aucune"],"t":{"fr":"Sept domaines sont entrés dans le v17 sans avoir été arbitrés contre leur coût d'achèvement","pt":"Sete domínios entraram no v17 sem terem sido arbitrados contra seu custo de conclusão"},"v":{"fr":"Le relevé du GLB v17 (01/09) le dit sans action datée : périodiques, notes de lecture, moisson OAI entrante, OPDS, sondes, témoin de sauvegarde, file des conventions — « aucun n'a été arbitré contre son coût d'achèvement ». Depuis, H5 (OAI) et I4 (témoin) sont clos ; les cinq autres sont livrés en partie et non arbitrés.","pt":"O levantamento do GLB v17 (01/09) o diz sem ação datada: periódicos, notas de leitura, coleta OAI de entrada, OPDS, sondas, testemunha de backup, fila das convenções — «nenhum foi arbitrado contra seu custo de conclusão». Desde então, H5 (OAI) e I4 (testemunha) estão fechados; os outros cinco estão entregues em parte e não arbitrados."},"w":{"fr":"Cinq lignes : ce qui est livré, ce qui manque pour que ce soit fini, ce que ça coûte, et si on le finit ou si on le gèle avec la raison écrite (`P3`).","pt":"Cinco linhas: o que está entregue, o que falta para estar pronto, o que custa, e se se termina ou se congela com a razão escrita (`P3`)."},"y":{"fr":"Le gel de périmètre (`DOC-GEL-1`) ne vaut que si ce qui est entré pendant le gel est jugé — sinon il n'y a pas eu de gel.","pt":"O congelamento de perímetro (`DOC-GEL-1`) só vale se o que entrou durante o congelamento for julgado — senão não houve congelamento."},"f":{"fr":["Cinq verdicts au registre ou au backlog, datés."],"pt":["Cinco veredictos no registro ou no backlog, datados."]},"dep":{"fr":"Après Bologne. Sans dépendance technique.","pt":"Depois de Bolonha. Sem dependência técnica."},"r":["claude/GLB_v17_releve_et_constats_2026-09-01","REGISTRE §0 DOC-GEL-1"]},{"id":"E20","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front","langue"],"t":{"fr":"La barre de navigation se regroupe par nature — Public, Moi, Travail — en menus qui s'ouvrent au clic, pas au survol","pt":"A barra de navegação agrupa-se por natureza — Público, Eu, Trabalho — em menus que abrem ao clique, não ao passar do rato"},"v":{"fr":"**Demande de Xavier le 08/09/2026, tranchée après débat.** `src/components/layout/index.jsx` aligne sur **une seule ligne** jusqu'à **douze liens** pour une coordination qui est aussi admin réseau : Catalogue, Je veux…, Bibliothèques, Cartographie, Thésaurus, Mon compte, Panneau (`canSeePainel`), Catalogage, Importations (`canSeeImportacoes`), Bibliothèque, Fédération, Réseau (`canSeeRede`). Et chaque page aligne ses onglets sur une ligne aussi : neuf à Mon compte, douze à Bibliothèque, quinze à Réseau. Tout est aplati : rien ne dit d'un coup d'œil ce qui est public, ce qui est à soi, ce qui est du travail de bibliothèque ou de réseau. Xavier proposait d'abord des menus **par rôle** (« Bibliothécaire », « Coordinateur ») ouverts **au survol** ; le débat a retenu autre chose sur les deux points, voir « ce qu'il faut faire ».","pt":"**Pedido de Xavier em 08/09/2026, decidido após debate.** A barra alinha numa só linha até doze ligações ; cada página alinha os seus separadores (nove a quinze). Tudo está achatado. A proposta inicial (menus por papel, ao passar do rato) foi substituída no debate."},"w":{"fr":"**Regrouper par nature, pas par rôle** — une coordination est aussi bibliothécaire et lectrice, un menu par rôle lui en montrerait deux pour elle seule et une bibliothécaire verrait un menu « Coordinateur » vide. Trois groupes : **Public** (Catalogue, Bibliothèques, Cartographie, Thésaurus), **Moi** (Mon compte, Je veux…), **Travail** (Panneau, Catalogage, Importations, Bibliothèque, Fédération, Réseau — chaque entrée soumise au même `canSee*` qu'aujourd'hui, le groupe n'apparaissant que s'il a une entrée ; le rôle qui ouvre chaque entrée peut être un sous-titre dans le menu). Le catalogue reste un lien direct, c'est la porte d'entrée publique. **Les menus s'ouvrent au clic ou à la touche Entrée, jamais au survol** : le survol n'existe ni au doigt (E9) ni au clavier (E1) ; `aria-haspopup`, `aria-expanded`, fermeture à Échap et au clic dehors, focus rendu au bouton. **Les onglets ne bougent pas dans ce lot** : un troisième niveau ferait pire, et les 51 intentions de « Je veux… » pointent déjà page + onglet exacts ; un regroupement des onglets, s'il s'impose, sera un lot à part. À livrer avec : le registre `intentions.js` relu (les chemins ne changent pas, les libellés de groupe entrent dans ses mots-clés), les dix locales (trois libellés de groupe, les sous-titres de rôle), le Manuel v5 et la formation BLMF (89 diapositives montrent la barre actuelle).","pt":"**Agrupar por natureza, não por papel** : **Público** (catálogo, bibliotecas, cartografia, tesauro), **Eu** (minha conta, «Quero…»), **Trabalho** (painel, catalogação, importações, biblioteca, federação, rede — cada entrada sob o mesmo `canSee*`, o grupo só aparece se tiver entradas). **Menus ao clique ou Enter, nunca ao passar do rato** (E9, E1), com `aria-haspopup`/`aria-expanded`, Esc, foco devolvido. **Os separadores não mudam neste lote.** Entregar com o registo `intentions.js` relido, as dez locales, o Manual v5 e a formação BLMF."},"y":{"fr":"Une barre de douze liens sans hiérarchie se lit en la parcourant, pas en la regardant — et c'est exactement ce qu'on demande à une coordination le premier soir de sa formation. Grouper par nature tient quel que soit le nombre de rôles d'une personne ; grouper par rôle se casse dès qu'elle en a deux. Et un menu au clic marche partout où l'app tourne, un menu au survol seulement à la souris.","pt":"Uma barra de doze ligações sem hierarquia lê-se percorrendo, não olhando. Agrupar por natureza resiste ao número de papéis de uma pessoa ; ao clique funciona onde a app corre."},"f":{"fr":["La barre n'expose plus que les liens directs (Catalogue) et trois boutons de groupe ; chaque groupe s'ouvre au clic et au clavier, se ferme à Échap, et ne montre que ce que le rôle ouvre.","Une inconnue non connectée ne voit ni Moi ni Travail ; une lectrice voit Moi ; une bibliothécaire voit Travail avec Panneau et Catalogage ; une coordination y voit aussi Importations, Bibliothèque, Fédération ; l'admin réseau y voit Réseau.","Aucun chemin ne change : les 51 intentions de « Je veux… » et les liens profonds du Manuel v5 restent valides (test à liste fermée d'`intentions.js` vert).","Dix locales pour les libellés de groupe et de rôle, parité stricte.","Sur 360 px, la barre tient sans débordement et les menus se ferment au toucher hors du menu.","Le Manuel v5 et le conducteur de la formation montrent la nouvelle barre — **ou** le lot est daté après la dernière soirée de formation."],"pt":["A barra só expõe as ligações diretas e três botões de grupo ; cada grupo abre ao clique e ao teclado, fecha em Esc, e só mostra o que o papel abre.","Uma desconhecida não vê Eu nem Trabalho ; uma leitora vê Eu ; uma bibliotecária vê Trabalho com Painel e Catalogação ; uma coordenação também Importações, Biblioteca, Federação ; a admin de rede vê Rede.","Nenhum caminho muda : intenções e ligações profundas continuam válidas.","Dez locales, paridade estrita.","A 360 px a barra cabe.","Manual v5 e guião da formação atualizados — ou lote datado depois da última noite de formação."]},"dep":{"fr":"Après **E9** (mobile) de préférence, ou avec lui ; même exigence de regard extérieur que **E1**. **Ne pas livrer pendant la formation BLMF** (sept soirées à partir du 08/09) : la barre est sur les diapositives — à dater après la dernière soirée, ou à montrer aux coordinations comme changement annoncé. Gel du code jusqu'au 14/09.","pt":"Depois de **E9** de preferência ; mesma exigência de olhar externo que **E1**. **Não entregar durante a formação BLMF** (sete noites a partir de 08/09). Congelamento até 14/09."},"r":["src/components/layout/index.jsx","src/lib/roles.js (canSee*)","src/pages/inicio (intentions.js)","anarbib-rede-perimetre-admins (doctrine : une porte se pose dans la page du geste, pas dans la barre)","K7 (formation BLMF)"],"verif":{"fr":"08/09 — barre relue : sept liens publics ou personnels + jusqu'à six liens de travail selon `canSee*` (`roles.js` : Painel et Catalogage dès `librarian`, Importations et Bibliothèque dès `coordenador`, Fédération pour tout rôle, Réseau pour l'admin réseau). Onglets comptés : Mon compte 9, Bibliothèque 12, Réseau 15, Fédération 8. Le lien Réseau reste réservé aux admins (décision du 02/09) : le regroupement n'y change rien. **15/09 — un des six liens de Travail a changé de nom** : « Bibliothèque » (`/biblioteca`) s'appelle « Gestion de la bibliothèque » (Xavier, `09165764`, REGISTRE 0.36 `PUBLIB-NAV-2`) — deux liens homonymes au singulier et au pluriel ne disaient pas ce qu'on y trouve. Le groupe Travail listera donc Panneau, Catalogage, Importations, **Gestion de la bibliothèque**, Fédération, Réseau ; les 89 diapositives BLMF montrent l'ancien mot et la barre d'avant : à reprendre dans ce lot.","pt":"08/09 — barra relida : sete ligações públicas ou pessoais + até seis de trabalho segundo `canSee*`. Separadores : Minha conta 9, Biblioteca 12, Rede 15, Federação 8. Rede continua reservada às admins (02/09). **15/09 — uma das seis ligações de Trabalho mudou de nome** : « Biblioteca » (`/biblioteca`) chama-se « Gestão da biblioteca » (Xavier, `09165764`, REGISTRE 0.36 `PUBLIB-NAV-2`). O grupo Trabalho listará Painel, Catalogação, Importações, **Gestão da biblioteca**, Federação, Rede ; os 89 diapositivos BLMF mostram a palavra antiga : retomar neste lote."}},{"id":"G15","d":"G","p":"P1","s":"ouvert","e":"M","sk":["aucune","biblio"],"t":{"fr":"DIRA : un essai d'import sur échantillon avant toute adhésion, PMB restant la base de référence","pt":"DIRA: um ensaio de importação sobre amostra antes de qualquer adesão, o PMB continuando como base de referência"},"v":{"fr":"Le 26/09/2026, DIRA a écrit au réseau (« Demande d'adhésion au réseau AnarBib — DIRA ») : une bibliothèque sous **PMB**, avec une collection multilingue, des zines, des archives de collectifs et un comité documentaire actif. Sa question centrale est la pérennité : que deviennent ses données si le projet s'arrête ? La réponse préparée le même jour ne promet pas un aller-retour qui n'existe pas encore (voir **H23**, **H24**). Elle propose un essai sur un échantillon d'une cinquantaine de notices en UNIMARC ISO 2709 avec exemplaires (995), la version de PMB et l'encodage de la base, sans données de lecteur·ices ni de prêts. **Mesuré le 26/09 en production** : aucune instance d'essai séparée n'existe (le projet « staging » est la production). L'essai se fait donc sur le banc (**H14**), sans rien publier.","pt":"Em 26/09/2026, a DIRA escreveu à rede: biblioteca em **PMB**, coleção multilíngue, zines, arquivos de coletivos, comitê documental ativo. A questão central é a perenidade. A resposta preparada no mesmo dia não promete um ida-e-volta que ainda não existe (**H23**, **H24**) e propõe um ensaio sobre ~50 registros em UNIMARC ISO 2709 com exemplares (995), versão do PMB e codificação, sem dados de leitoras nem de empréstimos. Não existe instância de ensaio separada: o ensaio é feito no banco (**H14**), sem publicar nada."},"w":{"fr":"Envoyer la réponse (Xavier). À réception de l'échantillon, le passer au banc (**H14**), avec l'encodage (**H15**) et les exemplaires (**H19**). Renvoyer à DIRA le rapport de couverture (**H16**) : ce qui passe, ce qui se perd, ce qui reste à construire. Décider ensuite, par écrit, d'ouvrir ou non un accès. L'adhésion elle-même suit le circuit ordinaire des admins réseau.","pt":"Enviar a resposta (Xavier). Ao receber a amostra, passá-la no banco (**H14**) com **H15** e **H19**; devolver à DIRA o relatório de cobertura (**H16**); decidir por escrito se se abre um acesso. A adesão segue o circuito normal dos admins da rede."},"y":{"fr":"C'est la première bibliothèque qui vient d'un autre SIGB avec une vraie exigence de réversibilité. Si l'essai est honnête, il fait de DIRA une bibliothèque qui rend le projet durable ; s'il survend, on la perd, et avec elle la crédibilité de l'argument « vos données restent à vous ».","pt":"É a primeira biblioteca vinda de outro SIGB com uma exigência real de reversibilidade. Um ensaio honesto a traz; um ensaio que promete demais a perde, e com ela o argumento «seus dados continuam seus»."},"f":{"fr":["Réponse envoyée, datée.","Échantillon reçu, avec version de PMB et encodage.","Rapport de couverture envoyé à DIRA.","Décision d'accès écrite, avec sa raison."],"pt":["Resposta enviada, datada.","Amostra recebida, com versão do PMB e codificação.","Relatório de cobertura enviado à DIRA.","Decisão de acesso escrita, com a razão."]},"dep":{"fr":"Avant le compte rendu : **H28** (livré le 26/09 — sans lui aucun ISO 2709 ne s'importait), **H14** (clos le 26/09), **H15** et **H16** (livrés le 26/09), **H19** (livré le 27/09) ; **H28**, **H15**, **H16** et **H19** restent à vérifier sur un import réel. Avant toute bascule : **H23** et **H24** (livrés le 28/09), **H27** (clos le 29/09) et **H21** (en cours : décisions `IMP-26` et `IMP-27` du 29/09, lot 0 livré le 01/10, puis **H30** et **H31**). Les archives : **D7** (clos le 27/09 ; réalisation : **D8**).","pt":"Antes do relatório: **H28** (entregue em 26/09), **H14** (fechado em 26/09), **H15** e **H16** (entregues em 26/09), **H19** (entregue em 27/09); **H28**, **H15**, **H16** e **H19** ainda a verificar numa importação real. Antes de qualquer migração: **H23** e **H24** (entregues em 28/09), **H27** (fechado em 29/09) e **H21** (em curso: `IMP-26` e `IMP-27` de 29/09, lote 0 entregue em 01/10, depois **H30** e **H31**). Arquivos: **D7** (fechado em 27/09; realização: **D8**)."},"r":["claude/aller-retour-PMB_2026-09-26","Réponse à DIRA du 26/09/2026"],"verif":{"fr":"**29/09** — l'envoi de la réponse à DIRA n'est daté nulle part dans le dépôt (critère 1). L'aller-retour que la réponse du 26/09 ne promettait pas est depuis éprouvé au banc : **H27** clos le 29/09 (l'export tiré de la base, réimporté dans un PMB vide, rend 46 exemplaires sur 46). Deux pièces existent pour le compte rendu : le CSV de couverture d'un import (**H16**, `4be5fee9`) et le tableau de l'aller-retour (`docs/interop/couverture-pmb.md`).","pt":"**29/09** — o envio da resposta à DIRA não está datado em lugar nenhum do repositório (critério 1). O ida-e-volta que a resposta de 26/09 não prometia foi desde então provado no banco: **H27** fechado em 29/09 (o export tirado da base, reimportado num PMB vazio, devolve 46 exemplares de 46). Duas peças existem para o relatório: o CSV de cobertura de uma importação (**H16**, `4be5fee9`) e a tabela do ida-e-volta (`docs/interop/couverture-pmb.md`)."}},{"id":"H28","d":"H","p":"P1","s":"a-verifier","e":"S","sk":["sql","front"],"t":{"fr":"Un fichier MARC ISO 2709 s'importe : le format détecté est admis par la base","pt":"Um arquivo MARC ISO 2709 é importado: o formato detectado é aceito pela base"},"v":{"fr":"**Trouvé le 26/09 par la cartographie de l'import, confirmé en production.** La CHECK `partner_catalog_import_runs_detected_format_check` n'admettait ni `marc_iso2709` — le mot que `process-partner-catalog-import` écrit pour tout ISO 2709 reconnu — ni `marc21`, que le front envoyait pour un `.mrc` ou un `.marc`. Le front échouait donc à la **création** du run (23514) ; l'EF, elle, échouait à son **UPDATE final**, après avoir inséré ses lignes : run « failed », lignes invisibles à l'écran. **Aucun run MARC n'avait jamais tourné** (8 runs : 5 CSV, 3 RIS) — le défaut était invisible. Or PMB livre ses exports UNIMARC en `.marc` : c'était le premier fichier que DIRA aurait envoyé.","pt":"Achado em 26/09, confirmado em produção: a CHECK de `detected_format` não aceitava nem `marc_iso2709` (escrito pela EF) nem `marc21` (enviado pelo front para `.mrc`/`.marc`). Todo import ISO 2709 falhava — na criação ou na atualização final. Nenhum run MARC jamais rodou. O PMB exporta em `.marc`."},"w":{"fr":"**Livré le 26/09** (`d008bb51`, migration `20260926184500`) : `marc_iso2709` admis, `marc21` toujours refusé (un vocabulaire, pas un format — `forced_vocabulary`) ; une seule copie de `detectFileKind` (`src/lib/importFileKind.js`, il y en avait deux), `.mrc`/`.marc`/`.iso` → `marc_iso2709`, suffixe `.iso` accepté ; garde vitest `import-file-kind` (chaque format écrit par le front ou par l'EF appartient à la CHECK de la **dernière** migration qui la pose) ; suite SQL `import_format_marc_tests`. Reste : **un premier import ISO 2709 réel en production** (l'échantillon de DIRA, ou un export PMB du banc déposé par une coordination).","pt":"**Entregue em 26/09** (`d008bb51`, migração `20260926184500`): `marc_iso2709` aceito, `marc21` recusado (vocabulário, não formato); uma só `detectFileKind`; guarda vitest e suíte SQL. Falta: **uma primeira importação ISO 2709 real em produção**."},"y":{"fr":"C'est la porte d'entrée de tout l'aller-retour PMB : sans elle, aucun des items H15 à H27 n'aurait pu servir.","pt":"É a porta de entrada de todo o ida-e-volta PMB."},"f":{"fr":["La CHECK admet `marc_iso2709` en production (fait, 26/09).","Un import ISO 2709 réel passe en production jusqu'à « prêt à revoir »."],"pt":["A CHECK aceita `marc_iso2709` em produção (feito, 26/09).","Uma importação ISO 2709 real chega a « pronta para revisão » em produção."]},"dep":{"fr":"Avant **H15** et **H19** (faits ou en cours). Éprouvé en vrai par **G15**.","pt":"Antes de **H15** e **H19**. Provado de verdade por **G15**."},"r":["claude/aller-retour-PMB_2026-09-26","tests/pmb/README.md"],"verif":{"fr":"26/09 — migration `20260926184500` appliquée par la CI (`created_by` vide) ; CHECK en production : `marc_iso2709` présent ; banc de la vraie EF sur l'export PMB : `detected_format = marc_iso2709` écrit. **28/09** — toujours aucun run `marc_iso2709` en production (relevé fait pour **H17**) : le critère 2 attend. Plus loin que « prêt à revoir », un lot MARC ne se serait pas publié (langue brute contre la CHECK BCP-47) : corrigé le 28/09 (`2ee5f7a7`, voir **H17**). **29/09** — `import_format_marc_tests` (4 tests) tourne en CI depuis `d008bb51` ; dernière batterie relevée : SQL 149/149, avant la poussée de `2348cb86`. **06/10** — H17, H18 et H19 sont clos (critères tenus au banc) et lui confient leur épreuve réelle : au premier import ISO 2709 réel, regarder aussi les responsabilités (rôle, nature), les exemplaires (un catalogue DIRA) et le rattachement des fascicules importés à leur périodique.","pt":"26/09 — migração aplicada pela CI; CHECK em produção com `marc_iso2709`; banco da EF real escreve `marc_iso2709`. **28/09** — ainda nenhum run `marc_iso2709` em produção (levantamento feito para **H17**): o critério 2 espera. Além de «pronta para revisão», um lote MARC não teria sido publicado (idioma bruto contra a CHECK BCP-47): corrigido em 28/09 (`2ee5f7a7`, ver **H17**). **29/09** — `import_format_marc_tests` (4 testes) roda na CI desde `d008bb51`; última bateria anotada: SQL 149/149, antes do push de `2348cb86`. **06/10** — H17, H18 e H19 fechados; a primeira importação ISO 2709 real verifica também responsabilidades, exemplares (DIRA) e fascículos ligados ao periódico."}},{"id":"H15","d":"H","p":"P1","s":"a-verifier","e":"S","sk":["deno"],"t":{"fr":"L'import lit un fichier qui n'est pas en UTF-8 au lieu de le corrompre en silence","pt":"A importação lê um arquivo que não está em UTF-8 em vez de corrompê-lo em silêncio"},"v":{"fr":"`process-partner-catalog-import/index.ts` (l. 623) et `marc.ts` (l. 303) décodent **toujours en UTF-8** (`new TextDecoder('utf-8')`, sans `fatal`). Seul le MARC-8 (leader/9 blanc) déclenche un avertissement. Une base PMB en ISO-8859-1, courante sur les installations anciennes, donnerait des accents remplacés par U+FFFD, **sans aucun avertissement**. Il en va de même pour un CSV enregistré en Windows-1252 par un tableur. **Mesuré sur le banc PMB le 26/09** (`tests/pmb`) : sur un vrai export PMB transcodé en latin-1, **29 notices sur 50** portaient U+FFFD, et chaque UNIMARC recevait un **faux « MARC-8 détecté »** (leader/9 blanc, non défini en UNIMARC — PMB 8.1 l'écrit ainsi). **Livré le 26/09** (`f1159947`, `6ab73436`, migration `20260926191500`) : UTF-8 strict, repli windows-1252 **supposé** et dit (`summary.encoding`, `summary.warnings`, première ligne) ; `forced_encoding` lu avant le décodage ; MARC-8 réservé au MARC21 ; 100 `$a`/26-29 relu et confronté ; `fn_import_set_adapter_overrides` gagne `p_forced_encoding` et **fusionne** (elle effaçait `profile_id`) ; `fn_import_dispatch` refuse de retraiter un import déjà promu (le lien ligne → brouillon partait en cascade) ; écran : sélecteur, panneau « encodage lu », geste « Retraiter », 14 clés × 10 locales.","pt":"`index.ts` (l. 623) e `marc.ts` (l. 303) decodificam **sempre em UTF-8**, sem `fatal`; só o MARC-8 gera aviso. Uma base PMB em ISO-8859-1 teria os acentos trocados por U+FFFD **sem nenhum aviso**; idem para um CSV em Windows-1252. **Medido no banco PMB em 26/09**: 29 de 50 registros com U+FFFD em latin-1, e um falso « MARC-8 » em todo UNIMARC. **Entregue em 26/09**: UTF-8 estrito, recuo windows-1252 suposto e dito, `forced_encoding`, MARC-8 só em MARC21, 100 $a relido; RPC com `p_forced_encoding` em fusão; reprocessamento recusado após promoção; tela com seletor, painel e « Reprocessar », 10 locales."},"w":{"fr":"Décoder en UTF-8 strict (`fatal: true`) ; en cas d'échec, relire en Windows-1252 et **le dire** dans les avertissements du run. Pour l'ISO 2709 UNIMARC, lire aussi le jeu de caractères déclaré en 100 $a/26-29. Ajouter un réglage `forced_encoding` à `adapter_overrides` (utf-8, iso-8859-1, windows-1252). Tester avec une fixture latin-1 (**H14**).","pt":"Decodificar em UTF-8 estrito (`fatal: true`); se falhar, reler em Windows-1252 e **dizê-lo** nos avisos do run. No ISO 2709 UNIMARC, ler também 100 $a/26-29. Ajustar `forced_encoding` em `adapter_overrides`. Testar com fixture latin-1."},"y":{"fr":"Une corruption silencieuse est la pire des pertes : personne ne la voit avant qu'une lectrice cherche un titre accentué. Et elle frapperait justement les bibliothèques européennes qui viennent de PMB.","pt":"Uma corrupção silenciosa é a pior perda: ninguém a vê até uma leitora buscar um título acentuado."},"f":{"fr":["Fixture latin-1 importée sans U+FFFD.","L'encodage retenu apparaît dans les avertissements du run.","Test au banc des edge functions."],"pt":["Fixture latin-1 importada sem U+FFFD.","A codificação adotada aparece nos avisos do run.","Teste no banco das edge functions."]},"dep":{"fr":"Après **H28** (fait). Fixture de **H14** (faite).","pt":"Depois de **H28** (feito). Fixture de **H14** (feita)."},"r":["claude/aller-retour-PMB_2026-09-26","Réponse à DIRA du 26/09/2026"],"verif":{"fr":"26/09 — la var
