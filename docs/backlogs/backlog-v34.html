 a tela recalcula a circulação a partir de `loanable`; em produção nenhuma das 12 notícias em consulta mudou por este caminho; os « 11 rascunhos divergentes » não são este defeito — nada a corrigir. Entregue: a cópia recopia `circulation_default`; verificação final: toda coluna comum a `books` e `book_drafts` é copiada. Suíte de 5 casos, mutante vermelho. **Fechamento a decidir por Xavier.**"}],["H32","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore maintenant »), signalement rédigé, marche à suivre pour DIRA écrite, correctif d'une ligne éprouvé au banc (61/61) ; l'envoi à PMB Services est le geste de Xavier, hors critères.** Signaler à PMB que son formulaire d’import ne transmet pas l’origine des autorités, et donner à DIRA le correctif d’une ligne. *Ce qui comptait comme fini* : Signalement rédigé et remis à Xavier. · Correctif d’une ligne vérifié au banc PMB : 61 liens par `$3`. · Marche à suivre pour DIRA dans `tests/pmb/README.md`. *Historique* : 06/10 — ouvert à la clôture de H25, sur décision de Xavier. **08/10 — rédigé, éprouvé au banc, livré** (`4c2d1c32`). (1) Le signalement pour PMB Services est écrit, au « je », prêt à envoyer par Xavier : `docs/interop/signalement-pmb-origine-autorites-2026-10-08.md` — version 8.1.1 patch 1, la ligne en cause (`admin/import/import_func.inc.php` 95, gabarit `$tpl_beforeupload_expl` de l'onglet « Exemplaires UNIMARC », affiché par `iimport_expl.php` 150), la variable lue (lignes 911 et 924, `$authorities_default_origin`), les trois formulaires voisins qui passent déjà le bon nom (245 ; `iimport_expl.php` 275 et 451), le correctif d'une ligne, et la mesure (origine non transmise : 44 liens vers une origine absente ; transmise : 61 responsabilités sur 61 par le `$3`, 0 auteur recréé). Lignes relues dans les sources de l'archive du banc. (2) La marche à suivre pour DIRA est dans `tests/pmb/README.md`, section « Pour DIRA » : sauvegarder le fichier, remplacer la ligne, vérifier le `name` de la liste, importer dans l'ordre avec « Oui » et l'origine AnarBib, vérifier le résultat ; refaire la ligne après une mise à jour de PMB, sinon laisser « Non ». (3) **Le correctif d'une ligne, éprouvé au banc** : posé dans le PMB du banc, puis l'import joué « comme le navigateur » (l'outil envoie le champ sous le nom que la page corrigée porte, `authorities_default_origin` — `importer-pmb.mjs` lit désormais la liste sous l'un ou l'autre nom) : 61 responsabilités sur 61 rattachées à leur fiche AnarBib par le ``, 61 liens notice → source d'autorité, 0 vers une source absente, 0 auteur recréé — chiffre pour chiffre le bilan « origine transmise » du 29/09 (`h25-origine-transmise`) ; sans le correctif, le même import « comme le navigateur » donne 0 sur 61 et 44 liens vers une origine absente (`h25-comme-le-navigateur`). Le correctif a ensuite été retiré du banc, qui reste un PMB 8.1.1.1 tel quel. Le canal d'envoi (forge de PMB Services ou liste des utilisateur·rices) est au choix de Xavier. **Reste** : l'envoi, par Xavier ; clôture à sa décision.","pt":"**Fechado em 08/10 à palavra de Xavier.** Sinalizar ao PMB que o formulário de importação não transmite a origem das autoridades, e dar à DIRA a correção de uma linha. *Histórico*: 06/10 — aberto no fechamento de H25, por decisão de Xavier. **08/10 — redigido, provado na bancada, entregue** (`4c2d1c32`). (1) O relato para a PMB Services está escrito (`docs/interop/signalement-pmb-origine-autorites-2026-10-08.md`): a linha em causa, a variável lida, a correção de uma linha, a medida. (2) O passo a passo para a DIRA está em `tests/pmb/README.md`. (3) A correção de uma linha foi provada na bancada: 61 responsabilités sur 61 rattachées à leur fiche AnarBib par le ``, 61 liens notice → source d'autorité, 0 vers une source absente, 0 auteur recréé — chiffre pour chiffre le bilan « origine transmise » du 29/09 (`h25-origine-transmise`) ; sans le correctif, le même import « comme le navigateur » donne 0 sur 61 et 44 liens vers une origine absente (`h25-comme-le-navigateur`). **Resta** o envio, por Xavier."}],["E33","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), les trois critères tenus par la suite (6 cas) et par construction ; on ne provoque pas une panne en production pour voir l'écran.** Quand la base ne répond pas, Mon compte dit que le service est indisponible au lieu d'une page vide. *Ce qui comptait comme fini* : API injoignable (simulée dans un test) : Mon compte affiche le message et « Réessayer » en moins de vingt secondes. · Un onglet qui casse affiche son erreur sans emporter la page. · Dix locales, test. *Historique* : **07/10 — livré, déployé et vérifié à 21 h 48** (`312f91cc`). *Cause trouvée* : le client Supabase n'a aucun délai ; pendant la panne, des requêtes ont pendu (524 au journal) et `ContaRouter`, qui attend trois réponses avant de choisir quelle page monter, rendait `null` sans fin — le fond seul de la capture ; quand la passerelle répondait vite par un 522, le routeur retombait en silence sur « aucune appartenance » et montait une page au profil nul, panneau vide. *Livré* : `ServiceIndisponible` (message + « Réessayer », deux clés dans les dix locales) ; le routeur l'affiche au-delà de douze secondes sans décision ou dès qu'une requête fondatrice rend une erreur ; `AccountPage` borne son squelette à douze secondes, affiche le message compact sur profil nul (rechargement des données), et met le panneau des onglets sous l'`ErrorBoundary` existante. Banc `service-indisponible` (6 cas, minuterie simulée, mutant rouge), vitest 2 172, build vert. *Critère 1* tenu (API injoignable simulée : message en douze secondes, moins de vingt) ; *critère 2* tenu par construction (limite d'erreur) ; *critère 3* tenu (dix locales, test). **Consigné** : les requêtes REST elles-mêmes restent sans délai — un délai global sur le client touche aussi les téléversements, c'est une décision à part (I31/I32). **Reste** : à voir à l'écran — on ne simule pas une panne en production ; clôture à décider par Xavier.","pt":"**Fechado em 08/10 à palavra de Xavier.** Quando o banco não responde, Minha conta diz que o serviço está indisponível em vez de uma página vazia. *Histórico*: **07/10 — entregue e verificado às 21 h 48** (`312f91cc`). Causa: sem timeout no cliente, `ContaRouter` esperava três respostas e renderizava `null` sem fim; com 522 rápido, montava a página com perfil nulo. Entregue: `ServiceIndisponible` (dez locales), roteador e página limitados a doze segundos, `ErrorBoundary` em torno das abas. Bancada 6 casos. **Fechamento a decidir por Xavier.**"}],["D9","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), la publication ne retire plus une ressource reçue par dépôt de fonds sans geste qui le dit ; une suite le prouve ; déployé le 06/10 sur la décision « garder ce qu'elle ignore ».** Une ressource posée par réception de fonds disparaît à la publication suivante du brouillon. *Ce qui comptait comme fini* : Publier un brouillon ne retire plus une ressource posée par réception de fonds sans un geste qui le dit. · Une suite SQL le prouve. *Historique* : **06/10 — décision de Xavier : « garder ce qu'elle ignore ». Livré, déployé et vérifié en production à 20 h 13** (`0dae3d10`, migration `20261006175037` par la CI). Une ressource publiée ne quitte le publié que si le brouillon la porte retirée ou inactive, ou s'il l'a supprimée : la suppression d'une ligne liée laisse une trace dans `book_drafts.digital_resources_removed` (déclencheur DEFINER fermé à tous) ; la reprise vide la trace. Réécritures depuis `pg_get_functiondef`, ancres comptées. Effet voisin, réglé du même geste : publier un brouillon créé sans reprise (mise à jour par import) vidait la notice de toutes ses ressources. Suite `depot_numerique_droits_tests` T8 : A gardée, B (supprimée) retirée, C (posée après la reprise) gardée, brouillon sans reprise 2/2, trace vidée ; avec la publication d'avant : C retirée, sans reprise 0. **`sql-tests` rouge après le déploiement** : `aller_retour_pmb_tests` T5 compare les brouillons d'import à une capture figée, où la colonne neuve n'existe pas (64 écarts, aucune donnée fausse) — mon banc n'avait joué que quatre suites ; exclue de la comparaison (`81c17016`) ; mais ce fichier est **engendré** par `src/tests/pmb-aller-retour-base.test.js`, et ma retouche à la main a fait rougir le job `app` (« la suite SQL engendrée est à jour »), aussi pour le commit voisin `e8101139` — je n'avais pas relancé vitest avant ce push. L'autre session a porté l'exclusion dans le générateur (`f6bb60e5`, le fichier redonné octet pour octet) : tout est vert depuis. **Critères tenus ; clôture à décider par Xavier.**","pt":"**Fechado em 08/10 à palavra de Xavier.** Um recurso posto por recepção de fundo desaparece na publicação seguinte do rascunho. *Histórico*: **06/10 — decisão de Xavier: « manter o que ela ignora ». Entregue e verificado em produção às 20h13** (`0dae3d10`, migração `20261006175037`). Um recurso publicado só sai se o rascunho o tiver retirado ou inativo, ou o tiver apagado (rastro em `book_drafts.digital_resources_removed`). Efeito vizinho resolvido: publicar um rascunho sem retomada (importação) esvaziava a notícia. Suíte T8; `sql-tests` vermelho por uma comparação com captura fixa (`aller_retour_pmb_tests` T5), corrigida (`81c17016`). **Critérios cumpridos; fechamento a decidir por Xavier.**"}],["J11","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), les cinq restes retirés ou gardés avec leur raison écrite (gardes en double, script mort, couvertures purgées par Xavier, restes de F1 supprimés avec son accord, lot C5).** Ménage : gardes en double, script mort, couvertures orphelines, restes du courriel et du lot C5. *Ce qui comptait comme fini* : Chacun des cinq restes est retiré, ou gardé avec sa raison écrite ici. *Historique* : **06/10 — quatre restes sur cinq réglés, le cinquième au geste de Xavier.** *(1)* La garde en double est retirée : on garde `locales-sans-cle-en-double` (elle décode la clé et ne lit que le premier niveau) ; *(2)* `scripts/merge-imp-deposit-keys.cjs` supprimé — à usage unique, déjà joué, nuisible à rejouer (`4b8ddebc`, vitest complet vert). *(4)* **Restes de F1, sur autorisation écrite de Xavier** (`fe10098d`, migration `20261006190649` par la CI, vérifiée en production à 21 h 22) : mesuré d'abord — `loan_midpoint_message_log` vide et sans écrivain ; deux des trois colonnes encore écrites par `upsert_library_notification_policies` (fermée aux comptes depuis le 02/09) et exposées par `v_library_notification_context`, que ni l'écran ni les fonctions Edge ne lisent pour elles. L'upsert est réécrite, la vue recréée sans les deux colonnes (security_invoker, commentaire et droits rejoués et comparés — identiques en production), colonnes et table supprimées, garde « table vide » ; suite `f1_restes_supprimes_tests` 4/4, banc complet vert. **Exploitation** : la table était dans `~/anarbib-ops/bg2-denylist.txt` (hors dépôt) — retirée avant le push (copie `.bak-20261006`, `check` : Filet OK), sinon la sauvegarde courte s'arrêtait ; retirée aussi de `deploy/bg2-known-tables.txt`. *(5)* **Les deux vues de travail du lot C5 ne sont pas mortes** : `v_author_alias_worklist` et `v_author_seed_candidates` alimentent `api.report_auteurs_non_resolus`, affiché dans l'onglet Rapports de la page Réseau — gardées ; l'écart assumé de la garde de doctrine reste juste. *(3)* **Couvertures** : passage à blanc refait en lecture seule, avec le classement du script — **7 originaux orphelins**, pas 358 (le premier compte prenait les 351 vignettes, qu'aucune notice ne désigne par construction) : A débris 2, B remplacées 3, D brouillon 1 à supprimer, C 1 gardée (notice 0000280) ; 12 objets avec leurs vignettes, ~740 Ko. Le script demande une clé secrète (Dashlane) : **à lancer par Xavier**, `--dry-run` d'abord. **06/10, 21 h 40 — couvertures purgées par Xavier** (`scripts/purge-orphelins-covers.py`, clé secrète saisie à l'invite) : le résultat est celui du passage à blanc — 6 originaux (B 3, D 1, A 2) et leurs 6 vignettes, 12 objets, 778 Ko, 0 échec ; `books/0000280/front.jpg` gardée (classe C, notice sans couverture). Relu en base après coup : un seul original non désigné, celui-là. **Les cinq restes sont traités** — quatre retirés, les deux vues de C5 gardées avec leur raison. **Critères tenus ; clôture à décider par Xavier.**","pt":"**Fechado em 08/10 à palavra de Xavier.** Faxina: guardas duplicadas, script morto, capas órfãs, restos do e-mail e do lote C5. *Histórico*: **06/10 — quatro restos de cinco resolvidos.** Guarda duplicada e script morto retirados (`4b8ddebc`); restos do F1 suprimidos com autorização escrita de Xavier (`fe10098d`, migração `20261006190649`, verificada em produção; a tabela saiu também da denylist do backup, hors repositório); as duas views do lote C5 alimentam um relatório ativo: mantidas. Capas: 7 originais órfãos (não 358) — a purga cabe a Xavier. **06/10 — capas purgadas por Xavier**: 12 objetos (6 originais + 6 miniaturas), 778 KB, 0 falha; `books/0000280/front.jpg` mantida. Os cinco restos tratados. **Critérios cumpridos; fechamento a decidir por Xavier.**"}],["F24","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Oui, en français, sans portugais → clore »), un vrai courriel de réservation en français reçu en production depuis le 06/10, sans un mot de portugais ; banc `mail-expediteur-par-defaut` vert.** Le nom d'expéditeur par défaut des courriels est en portugais. *Ce qui comptait comme fini* : Aucun courriel rendu en français ne porte de nom d'expéditeur en portugais (banc). · Un vrai courriel de réservation en français, reçu en production, ne contient pas un mot de portugais. *Historique* : **06/10 — décision de Xavier : « AnarBib » seul. Livré et déployé** (`7aa8e8c4`, puis `c952704a`) : `SENDER_NAME` vaut « AnarBib » sans secret ; `.env.example` aligné ; garde `mail-expediteur-par-defaut` (4 tests, l'ancien défaut en fait tomber 3). Le premier push a fait rougir le job `app` : la garde `mail-ptbr-voce` lisait `env.ts` dans sa liste fermée du texte en dur pt-BR et refusait un fichier sans phrase portugaise ; il en sort (`c952704a`). Vérifié en production : `notify-event` version 1742 (17:54 UTC) porte `|| \"AnarBib\"`. Le secret `SENDER_NAME`, posé dans Supabase, l'emportait sur ce défaut : **Xavier l'a mis à « AnarBib » le 06/10**. **Reste** : un vrai courriel de réservation en français reçu en production, sans un mot de portugais.","pt":"**Fechado em 08/10 à palavra de Xavier.** O nome de remetente padrão dos e-mails está em português. *Histórico*: **06/10 — decisão de Xavier: « AnarBib » só. Entregue e implantado** (`7aa8e8c4`, `c952704a`); guarda `mail-expediteur-par-defaut`; `notify-event` v1742 com `|| \"AnarBib\"`. O segredo `SENDER_NAME` foi posto em « AnarBib » por Xavier em 06/10. **Falta**: ler um e-mail real em francês."}],["H30","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), refus traduit, lecture avant effacement, suite SQL et banc de la fonction ; les constats consignés vivent dans H21.** « Retraiter » un import sans fichier (moisson OAI, candidat, dépôt direct) n’efface plus ses lignes. *Ce qui comptait comme fini* : « Retraiter » n’est ni offert ni accepté pour un run sans fichier ; refus traduit. · Un échec de lecture du fichier n’efface plus aucune ligne. · Suite SQL et banc de l’edge function. *Historique* : 01/10 — ouvert à la livraison du lot 0 de H21 (constat de revue, prouvé au banc). **05/10 — livré** (`324a49a5`, migration `20261005064758` appliquée par la CI, `created_by` vide ; edge functions déployées, `deployed-functions` = `324a49a5`) : `fn_import_dispatch` refuse tout de suite « Retraiter » quand le fichier n’est pas dans `storage.objects` (HINT `error.import.reparse_no_file`, 10 locales ; le propriétaire contourne la RLS, vérifié en production) ; les deux edge functions lisent et analysent le fichier avant d’effacer, effacent avant de passer « en cours », et un retraitement qui échoue avant l’effacement garde lignes, fichiers reçus et état du run (journal, 409 `rows_kept`) ; un premier import qui échoue reste « échoué ». Mesuré le 04/10 : 4 runs sur 8 sans fichier en production (des essais déjà promus). SQL 161/161 (suite `h30_retraiter_exige_le_fichier`), vitest 1 854 ; bouchon CI : `storage.objects` ajouté. **Consigné** : l’écran ne lit pas `error_log`, un refus différé de l’edge function reste invisible ; un échec APRÈS l’effacement (insertion partielle, rapprochement) perd encore les lignes ; le dépôt de fonds n’a pas la garde « analyse sans ligne » ; la fenêtre de course de **H31** s’élargit (un run à lignes ne passe « en cours » qu’après l’analyse).","pt":"**Fechado em 08/10 à palavra de Xavier.** «Reprocessar» uma importação sem arquivo (coleta OAI, candidato, depósito direto) não apaga mais as linhas. *Histórico*: 01/10 — aberto na entrega do lote 0 de H21 (constatação de revisão, provada na bancada). **05/10 — entregue** (`324a49a5`, migração `20261005064758` aplicada pela CI; edge functions implantadas): `fn_import_dispatch` recusa na hora «Reprocessar» quando o arquivo não está em `storage.objects` (HINT traduzida, 10 locales); as duas edge functions leem e analisam o arquivo antes de apagar e, se falharem antes do apagamento, mantêm linhas e estado (diário, 409). **Registrado**: a tela não lê `error_log`; uma falha DEPOIS do apagamento ainda perde as linhas; a janela de **H31** aumenta."}],["H31","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), les trois critères sont des tests à deux sessions, et ils passent ; une mesure en production n'est pas exigible.** « Retraiter » juge le run au moment d’effacer, pas seulement à l’envoi. *Ce qui comptait comme fini* : Une promotion ou un rapprochement dans la fenêtre est refusé ou fait refuser le retraitement, sans run en échec ni ligne perdue. · Un retraitement refusé laisse le run et sa file visibles. · Tests de suite de la fenêtre (relais remplacé rou — aucun appelant, clés étrangères protectrices ; (4) un run supprimé pendant l’attente répond « Run N introuvable » sans HINT (clé `error.import.run_not_found` à créer) ; (5) un fichier attaché fait dire « déjà promu » à l’écran (HINT `reparse_after_promotion` réutilisée) ; (6) deux onglets qui attachent le même fichier : la réponse idempotente rend le `book_id` demandé par le second (antérieur).","pt":"**Fechado em 08/10 à palavra de Xavier.** «Reprocessar» julga a importação no momento de apagar, não só no envio. *Histórico*: 01/10 — aberto na entrega do lote 0 de H21 (provado na bancada; largura da janela não medida em produção). **05/10 — entregue** (`9942be20`, enviado por engano com a mensagem provisória «wip(h31)»; migração `20261005124652` aplicada pela CI): o apagamento das linhas no reprocessamento passa por uma função que trava a importação e rejulga a guarda; promoção, vinculação, decisão, anexação de arquivo recebido e exclusão da importação usam a mesma trava; um pacote com arquivo já anexado não se reprocessa mais. Provado com duas sessões. **Registrado**: uma promoção grande faz os outros gestos esperarem até 8 s; dois «Reprocessar» simultâneos não são recusados; «Run N introuvable» sem HINT."}],["F6","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Clore »), divergence refermée et gardée par 6 tests, fichiers réunis le 30/08, dossier dupliqué disparu ; aucune décision de portée ne reste à prendre.** `notify-internal-task` tourne sur une copie gelée de toute la pile courriel. *Ce qui comptait comme fini* : ~~La divergence de signature localisée est refermée~~ — fait le 30/08, gardé par 6 tests. · ~~Le sort des 9 fichiers d'infrastructure dupliqués est tranché — réunis, ou assumés par écrit.~~ — réunis le 30/08 (`334e852c`). · ~~Un en-tête dans `notify-internal-task/_shared/` dit ce qui y vit et pourquoi.~~ — sans objet : le dossier n'existe plus, l'en-tête d'`index.ts` raconte la réunion. · ~~La collision de nom sur `resolveLibraryLogo Livré le 24/09 au soir** : module + six conversions + modèles d'environnement + garde et bancs (rendu réel de `notify-library-request`, `notify-cross-library-digest`, `membership-restriction`, `notify-network-weekly-report`). Reste le premier critère : un courriel réel lu dans la boîte, à la main de Xavier.","pt":"**Fechado em 08/10 à palavra de Xavier.** Os e-mails institucionais às admins da rede só chegavam a uma caixa pessoal — uma única resolução de destinatários, com a caixa coletiva. *Histórico*: 24/09/2026 — e-mail recebido às 21h46 lido; `sendToAdmins` lido; uma admin ativa contada na base; `HEALTH_ALERT_CC` presente nos segredos, `NETWORK_ADMIN_CC` ausente. **Entregue em 24/09 à noite**: módulo + seis conversões + modelos de ambiente + guarda e bancadas. Falta o primeiro critério: um e-mail real lido na caixa, por Xavier."}],["G16","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Oui, vu à l'écran → clore »), un vote pour, un contre et une abstention passés par l'écran depuis le 05/10 ; l'abstention gardée, règle de la cooptation.** Le vote des transitions (changer un mode de fonctionnement d'une bibliothèque) ne parle pas la langue de la base. *Ce qui comptait comme fini* : L'abstention est décidée. · Un vote pour, un vote contre et (si retenue) une abstention passent par l'écran ; une suite emprunte la proposition, le vote et l'application. *Historique* : **05/10 — livré, déployé et vérifié en production à 12 h 39** (`f93667ac`, migration `20261005101029` passée par la CI, marqueur des fonctions sur le commit). Décision de Xavier : **garder l'abstention**, règle de la cooptation (ni opposition ni « pour », sans motif ; en majorité elle ne s'ajoute pas aux « pour » ; en unanimité elle la rend impossible et la proposition est close « rejetée »). En empruntant le circuit au banc, **deux défauts de plus** que le constat : une transition de **type 4** (`unanimous_extended`) ne se fermait jamais (la fonction ne connaissait que `majority` et `unanimous` — elle suit maintenant la doctrine : unanimité et carence de 14 jours) ; une transition de **type 2** acceptée à la majorité ne se fermait pas non plus (sans carence, le verrou finissait à l'instant même et `chk_lpgl_grace_after_lock` refusait le vote gagnant — sans carence, plus de verrou). Écran : valeurs traduites, 20 caractères pour un vote contre, historique avec les acceptées en carence et les rejetées ; courriel de vote : un « pour » affichait la clé `lp.vote.for`. Suite `vote_des_transitions` 12/12 (dont l'application par la tâche planifiée), trois mutants tués ; banc des courriels +3 ; garde écran ↔ base +4. **Reste** : un vote réel vu à l'écran sur une bibliothèque en `staff_roles` ou `full_governance`.","pt":"**Fechado em 08/10 à palavra de Xavier.** O voto das transições (mudar um modo de funcionamento de uma biblioteca) não fala a língua do banco. *Histórico*: **05/10 — entregue, implantado e verificado em produção às 12h39** (`f93667ac`). Decisão de Xavier: manter a abstenção (regra da cooptação). Dois defeitos a mais: o tipo 4 nunca fechava, e o tipo 2 aceito por maioria falhava no voto vencedor. Suíte 12/12, três mutantes mortos. **Falta**: um voto real visto na tela."}],["C14","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Oui → clore »), un déplacement réel vu à l'écran ; compteurs BTL relus le 06/10 ; les brouillons ouverts refusés comme décidé.** Un exemplaire qui change de bibliothèque emmène tout avec lui. *Ce qui comptait comme fini* : Chaque point a sa décision (Xavier pour le (1)) et, s'il est corrigé, une suite qui emprunte le chemin. · Pour le (3), la règle de `CAT-E19` s'applique telle quelle : supprimer le fonds que le geste vide, sauf renvoi. *Historique* : **05/10 — livré, déployé et vérifié en production (`07ad68af`, migration `20261005074236`, passée par la CI).** (1) Un brouillon d'exemplaire ouvert avant le départ de son exemplaire est **refusé** à la publication (décision de Xavier) : marqueur `exemplar_drafts.exemplar_moved_at`, posé par les deux réattributions et par la publication qui change un exemplaire de bibliothèque (ses autres brouillons ouverts) ; clé `error.publish.exemplar_moved`. (2) Disponibilité : un PEB compte là où est son exemplaire, un PEB clos ne retient plus rien. (2 bis) **Réservations** (décision de Xavier) : la réattribution est refusée tant qu'une réservation active porte sur un fonds qu'elle viderait (`error.reassign.active_reservation`). **PEB** : cause trouvée — un PEB déclaré rendu ou annulé à la main ne closait pas ses lignes ; `fn_peb_propagate_status` les clôt désormais. Les deux lignes des PEB 24 et 25 sont réparées en production (`devolvido`, date de retour, trace `c14_reparation`). (3) Désherbage et déplacement d'un exemplaire isolé : règle de CAT-E19, une seule implémentation `private.fn_fonds_vides_menage` (fermée à `anon` et `authenticated`, vérifié). (4) La corbeille rend un brouillon dont le fonds a disparu. (5) Le panneau de réattribution nomme les fonds vides gardés. Suite `brouillon_perime_exemplaire_deplace` 17/17, sept mutants tués chacun par son test ; `reattribution_fonds_vide` 18/18 ; 21 suites voisines vertes au banc ; vitest 1 865 tests, lint 0 erreur. Les sept fonctions ont été réécrites depuis leur définition réelle, empreintes revérifiées en production le 05/10 avant le push. **Reste à voir** : les compteurs des fonds BTL 173 et 2426 affichent encore « 0 disponible » ; le recalcul nocturne (04 h 43) doit les remettre à 1 — à relire le 06/10. Et un regard de Xavier sur les deux refus à l'écran. **Vu en chemin, hors C14** : `publish_exemplar_draft` ne crée pas le fonds de la bibliothèque visée ; déplacer un exemplaire vers une bibliothèque qui n'a pas encore de fonds de la notice échoue en `exemplar_library_holding_mismatch` brut (et sans tombo, en `tombo_pattern_not_configured` si elle n'a pas de numérotation). **05/10, soir** — le défaut « vu en chemin, hors C14 » (`exemplar_library_holding_mismatch`, `tombo_pattern_not_configured`) est devenu **C23**, livré le même jour (`16962c55`). **06/10** — compteurs relus après le recalcul de 04 h 43 UTC : les fonds BTL 173 et 2426 sont à 1 disponible sur 1. Reste le regard de Xavier sur les deux refus à l'écran (E31).","pt":"**Fechado em 08/10 à palavra de Xavier.** Um exemplar que muda de biblioteca leva tudo consigo. *Histórico*: **05/10 — entregue, implantado e verificado em produção (`07ad68af`, migração `20261005074236`, pela CI).** Rascunho aberto antes da mudança do exemplar: recusado na publicação. Reatribuição recusada enquanto houver reserva ativa no fundo. EEB declarado devolvido ou cancelado à mão fecha suas linhas; as duas linhas dos EEB 24 e 25 foram reparadas. Fundos vazios: regra de CAT-E19 no descarte e na mudança de um exemplar (`private.fn_fonds_vides_menage`, fechada a `anon` e `authenticated`). Lixeira sem 23503. Suíte 17/17, sete mutantes mortos, CAT-E19 18/18, vitest 1 865, lint 0 erro. **Falta ver**: os contadores dos fundos BTL 173 e 2426 ainda mostram «0 disponível» — o recálculo noturno (04h43) deve corrigi-los, reler em 06/10; e um olhar do Xavier nas duas recusas na tela. **Visto de passagem, fora de C14**: `publish_exemplar_draft` não cria o fundo da biblioteca de destino; mover um exemplar para uma biblioteca sem fundo da notícia falha em `exemplar_library_holding_mismatch` bruto. **05/10, à noite** — o defeito « visto de passagem, fora de C14 » virou **C23**, entregue no mesmo dia (`16962c55`). **06/10** — contadores relidos após o recálculo das 04h43 UTC: fundos BTL 173 e 2426 com 1 disponível de 1. Falta o olhar de Xavier nas duas recusas (E31)."}],["C23","2026-10-08",{"fr":"**Clos le 08/10 sur le mot de Xavier (« Oui → clore »), un déplacement réel vu à l'écran ; suite 6/6, mutant rouge, migration en production.** Un exemplaire déplacé par sa publication trouve, ou crée, le fonds de sa notice dans la bibliothèque visée. *Ce qui comptait comme fini* : La suite `exemplaire_deplace_cree_son_fonds` (6 tests) pas ctions, 38 `verify_jwt` ; `CLAUDE.md` mis à jour. **Reste (Xavier)** : supprimer `read-pdf` et `mail-i18n-test` de la plateforme — la CI ne supprime pas une fonction ; le 05/10 à 14 h 05 elles y sont encore (versions 1660 et 1653, figées). **08/10 — vérifié : `read-pdf` et `mail-i18n-test` sont encore déployées** (`list_edge_functions`, versions 1661 et 1654). Xavier les supprime au tableau de bord (Edge Functions → chacune → Supprimer) ; je revérifie ensuite et je clos.","pt":"**Fechado em 08/10: Xavier suprimiu `read-pdf` e `mail-i18n-test` no painel — verificado: 50 funções, nenhuma das duas.** Consolidar as funções de notificação redundantes. *Histórico*: 31/08 — `mail-i18n-test` continua implantada (versão 1 566). O repositório tem 50 pastas de funções e 38 declarações `verify_jwt`. 24/09 — `mail-i18n-test` continua no repositório e no `config.toml`, portanto implantada. Desde F7, um só transporte: F1 e esta consolidação ficaram mais baratos. 29/09 — Desde `6f762f8f`, o texto escrito no código dos dois relatórios semanais é lido por `mail-ptbr-voce.test.js` (lista fechada `TEXTE_EN_DUR_PT`): uma função de resumo consolidada deverá entrar nela. **05/10 — vereditos escritos, duas funções retiradas do repositório** (`82afd616`). Recapitulativos, leitores e exportações: separados com razão escrita; `read-pdf` e `mail-i18n-test` retiradas (nenhuma chamada em oito dias). **Falta (Xavier)**: suprimi-las da plataforma. **08/10 — verificado: `read-pdf` e `mail-i18n-test` ainda implantadas.** Xavier as suprime no painel; depois verifico e fecho."}],[{"fr":"Locales : une clé présente dans les dix fichiers est traduite","pt":"Locales: uma chave presente nos dez arquivos está traduzida"},{"fr":"« La parité des clés, gardée en CI, suffit » (angle mort 2 de la garde code ↔ locales, nommé le 27/08 et laissé ouvert)","pt":"«A paridade das chaves, guardada na CI, basta» (ponto cego 2 da guarda código ↔ locales, nomeado em 27/08 e deixado aberto)"},{"fr":"**Faux.** Le 08/10, l'on let K = 'fr';
const st = { dom:'all', prio:'all', q:'' };
const L=(o,k)=>o&&typeof o==='object'&&!Array.isArray(o)?(o[k]??o.fr??''):o;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Rendu markdown minimal, cote client. Trois niveaux seulement :
// l'inline (code, gras, italique), les blocs separes par une ligne vide,
// et les listes. Ajout du 30/08/2026 : les blocs de code delimites par trois
// accents graves. Un item de backlog qui donne une requete a copier-coller
// est un item qu'on peut utiliser sans le retaper -- c'etait la raison d'etre
// de ce fichier.
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
const md=s=>{
  const parts=String(s==null?'':s).split(/```/);
  let out='';
  parts.forEach((seg,idx)=>{
    if(idx%2===1){
      out+='<pre><code>'+esc(seg.replace(/^[a-z]*\n/,'').replace(/\n$/,''))+'</code></pre>';
      return;
    }
    seg.split(/\n{2,}/).forEach(blk=>{
      const b=blk.trim();
      if(!b) return;
      const li=b.split(/\n/);
      if(li.every(l=>/^\d+\.\s/.test(l)))
        out+='<ol>'+li.map(l=>'<li>'+inl(l.replace(/^\d+\.\s/,''))+'</li>').join('')+'</ol>';
      else if(li.every(l=>/^[-*]\s/.test(l)))
        out+='<ul>'+li.map(l=>'<li>'+inl(l.replace(/^[-*]\s/,''))+'</li>').join('')+'</ul>';
      else
        out+='<p>'+inl(b).replace(/\n/g,'<br>')+'</p>';
    });
  });
  return out;
};
const lab=(l,key)=>{const e=D[l].find(x=>x.key===key);return e?L(e.label,K):key;};

  h+='<span class="sep"></span>';

// Delegation posee une seule fois : la barre est reconstruite a chaque rendu,

document.getElementById('bar').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b)return;
  if(b.dataset.k){ if(b.dataset.k===K)return; K=b.dataset.k; }
  else if(b.dataset.d!==undefined){ st.dom=b.dataset.d; }
  else if(b.dataset.p!==undefined){ st.prio=b.dataset.p; }

});
document.getElementById('bar').addEventListener('input',ev=>{

});

function match(i){
  if(st.dom!=='all'&&i.d!==st.dom)return false;
  if(st.prio!=='all'&&i.p!==st.prio)return false;
  if(st.q){const s=(i.id+' '+L(i.t,K)+' '+L(i.w,K)+' '+L(i.v,K)+' '+L(i.y,K)+' '+(i.r||[]).join(' ')).toLowerCase();
    if(!s.includes(st.q.toLowerCase()))return false;}
  return true;
}

function card(i){
  const t=D.T[K];
  let h='<article class="card '+i.p+'"><h4><span class="id">'+i.id+'</span>'+md(L(i.t,K))+'</h4>';

  h+='</div><dl class="f">';
  h+='<dt>'+t.etat+'</dt><dd>'+md(L(i.v,K))
    +'<p class="prov">'+(i.verif ? esc(t.verif_oui+' : ')+md(L(i.verif,K)) : esc(t.verif_non+'.'))+'</p>'+'</dd>';
  if(L(i.w,K)) h+='<dt>'+t.quoi+'</dt><dd>'+md(L(i.w,K))+'</dd>';
  if(L(i.y,K)) h+='<dt>'+t.pourquoi+'</dt><dd>'+md(L(i.y,K))+'</dd>';
  const fini=(L(i.f,K)||[]);
  if(fini.length) h+='<dt>'+t.fini+'</dt><dd><ul>'+fini.map(f=>'<li>'+md(f)+'</li>').join('')+'</ul></dd>';
  if(L(i.dep,K)) h+='<dt>'+t.dep+'</dt><dd>'+md(L(i.dep,K))+'</dd>';
  h+='</dl>';
  if((i.r||[]).length) h+='<p class="refs">'+t.refs+' : '+i.r.map(r=>'<code>'+esc(r)+'</code>').join(' · ')+'</p>';
  h+='</article>';
  return h;
}

function render(){
  const t=D.T[K];
  document.documentElement.lang = K==='fr' ? 'fr' : 'pt-BR';
  document.getElementById('eyb').textContent = K==='fr'
    ? 'AnarBib · backlog v34' + (D.meta.maj ? ' · à jour au ' + D.meta.maj : '')
    : 'AnarBib · backlog v34' + (D.meta.maj ? ' · atualizado em ' + D.meta.maj : '');
  document.getElementById('ttl').textContent=L(D.meta.title,K);
  document.getElementById('sub').textContent=L(D.meta.subtitle,K);
  document.getElementById('mta').textContent=
    (K==='fr'?'écrit le ':'escrito em ')+D.meta.date
    +(D.meta.maj?(K==='fr'?', mis à jour le ':', atualizado em ')+D.meta.maj:'')
    +' · '+D.items.length+' '+t.total
    +' · '+(K==='fr'?'remplace ':'substitui ')+D.meta.previous;
  bar();
  const shown=D.items.filter(match);
  let h='';

  if(st.dom==='all'&&st.prio==='all'&&!st.q){
    h+='<h2>'+t.photo+'</h2><p class="note">'+md(L(D.etat.photo_intro,K))+'</p>';
    h+='<p class="note">'+md(L(D.etat.fraicheur,K))+'</p>';
    D.etat.photo.forEach(g=>{
      h+='<h3>'+L(g.g,K)+'</h3><div class="tbl"><table class="photo"><tbody>';
      g.rows.forEach(r=>{h+='<tr><td>'+md(L(r[0],K))+'</td><td>'+r[1]+'</td><td>'+md(L(r[2],K))+'</td></tr>';});
      h+='</tbody></table></div>';
    });
    h+='<h2>'+t.ecarts+'</h2><p class="note">'+md(L(D.etat.ecarts_intro,K))+'</p>';
    Object.keys(D.etat.sens_labels).forEach(sens=>{
      const rows=D.etat.ecarts.filter(e=>e.sens===sens);
      if(!rows.length)return;
      h+='<h3>'+L(D.etat.sens_labels[sens],K)+'</h3>';
      rows.forEach(e=>{h+='<div class="ecart"><b>'+md(L(e.quoi,K))+'</b><span>'+t.dit+' — '+md(L(e.dit,K))+'</span><span>'+t.reel+' — '+md(L(e.reel,K))+'</span></div>';});
    });
  }

  h+='<h2>'+t.chantiers+' <span class="count">'+shown.length+' / '+D.items.length+'</span></h2>';
  if(!shown.length){ h+='<p class="empty">'+(K==='fr'?'Aucun item ne correspond.':'Nenhum item corresponde.')+'</p>'; }
  D.domains.forEach(d=>{
    const list=shown.filter(i=>i.d===d.key);
    if(!list.length)return;
    h+='<h3>'+d.key+' — '+L(d.label,K)+' <span class="count">'+list.length+'</span></h3>';
    h+='<p class="note">'+md(L(d.note,K))+'</p>';
    list.forEach(i=>{h+=card(i);});
  });

  if(st.dom==='all'&&st.prio==='all'&&!st.q){
    h+='<h2>'+t.clotures+'</h2><p class="note">'+md(L(D.clotures.intro,K))+'</p><div class="tbl"><table class="clot"><tbody>';
    D.clotures.rows.forEach(r=>{h+='<tr><td>'+md(L(r[0],K))+'</td><td>'+md(L(r[1],K))+'</td><td>'+md(L(r[2],K))+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  document.getElementById('main').innerHTML=h;
}
render();
</script>
</body>
</html>
