ire sans mode d'acquisition » n'est pas encore éprouvé. L'invitation BTL en attente est sortie en **G14**.\n\n**03/09 — préparation de la séance 1, vérifiée en base.** Les deux coordinations ont leur compte sur `blmf-teste` (Mariana S. active le 30/08 ; **Rafael G. sans connexion depuis le 24/06** — à vérifier au début de séance) ; les cinq fiches fautives de l'exercice 2 y sont depuis le 26/08 (`TESTE-9001-1`…`9005-1`) ; **mais aucun lecteur fictif** (le seul retiré le 02/09) et **aucune règle de circulation ni horaire** — impossible d'y jouer une réservation. Posé le 03/09 : le jeu de règles de la BLMF (six règles) et ses horaires copiés sur `blmf-teste`. Reste à la main de Xavier : inviter deux lecteur·rices fictif·ves (le bac à sable n'accepte pas l'inscription publique), vérifier l'entrée de Rafael, **trancher la collision de dates avec Bologne (11-13/09)**, et retrouver le plan et le gabarit — **absents du dépôt, du poste et des transcripts** (les références `PLAN_formation…` et `GABARITO…` de cette fiche sont des fantômes tant qu'ils ne sont pas déposés). Le parcours de la séance, étape par étape, page par page, compte par compte : `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md`. **03/09, fin de journée — les documents sont au dépôt et le dispositif n'est plus celui de la fiche.** Xavier a fourni le plan (révisé le 01/09), le conducteur de la séance 1, le roteiro de la capsule, les 89 diapositives et « O salto colegial » : déposés dans `docs/journal/chantiers/formation-BLMF/`. Le plan dit **sept soirées de 2 h 15, six modules, six exercices, une capsule de 40 minutes** — plus trois rencontres ; l'exercice 0 devient un travail personnel ; l'engagement chiffré est inchangé (5 exemplaires sur 2 758 avec mode d'acquisition). **Le « 13/09 » n'apparaît dans aucun document** : la première soirée n'est pas datée, et « collision avec Bologne » était une fausse alerte née d'une hypothèse du backlog. Bac à sable : deux lecteur·rices fictif·ves créé·es sur `blmf-teste` (Emma Teste, Errico Teste, adresses de Xavier ; mot de passe à poser par « Esqueci minha senha ») ; Voltairine de Teste existe mais ses adhésions ont été remaniées le 02/09 (lectrice retirée) ; règles et horaires copiés de la BLMF. La page `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md` est réécrite en **compléments au conducteur**. Reste : dater la soirée 1, poser les mots de passe, Rafael G., et corriger dans les diapositives les quatre réserves dépassées listées au §7 du plan avant la soirée 4. **Soirée 1 datée par Xavier : le 08/09/2026** (17 h 00 – 19 h 15). Voltairine de Teste repassée **lectrice** (bibliothécaire retirée) ; Emma et Errico Teste se sont connecté·es le 03/09 à 16 h 15 et 16 h 18 : le bac à sable a ses trois lecteur·rices.","pt":"07/09 — no banco: a leitora fictícia «Voltairine de Teste» **nunca** abriu sessão (`auth.users.last_sign_in_at` nulo); nenhum exemplar criado desde 01/09, logo o compromisso «nenhum exemplar sem modo de aquisição» ainda não foi provado. O convite BTL em espera saiu em **G14**.\n\n**03/09 — preparação da sessão 1, verificada na base.** Contas das duas coordenações em `blmf-teste` (Rafael G. sem login desde 24/06); as cinco fichas do exercício 2 desde 26/08; **mas nenhum leitor fictício** e **nenhuma regra de circulação** — regras e horários da BLMF copiados em 03/09. Fica com Xavier: convidar dois leitores fictícios, verificar Rafael, decidir a colisão de datas com Bolonha, encontrar o plano e o gabarito (ausentes do repositório). Percurso: `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md`. **03/09, fim do dia — os documentos estão no repositório e o dispositivo mudou.** Plano de 01/09, condutor, roteiro, 89 slides : em `formation-BLMF/`. Sete noites de 2h15, seis módulos, cápsula de 40 min. **O «13/09» não está em nenhum documento** : a primeira noite não tem data ; a «colisão com Bolonha» era um falso alarme. Duas leitoras fictícias criadas em `blmf-teste` (Emma Teste, Errico Teste). A página `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md` foi reescrita como complementos ao condutor. **Noite 1 datada por Xavier : 08/09/2026.** Voltairine de Teste voltou a **leitora** ; Emma e Errico Teste entraram em 03/09."}},{"id":"K8","d":"K","p":"P2","s":"ouvert","e":"M","sk":["collectif"],"t":{"fr":"Finir le texte d'orientation sur les outils de bibliothèques militantes","pt":"Terminar o texto de orientação sobre as ferramentas de bibliotecas militantes"},"v":{"fr":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` est un **squelette destiné à être co-signé**. Six points sont explicitement à vérifier ou à trancher, et la section finale — celle qui porte l'appel — reste à écrire.","pt":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` é um **esqueleto destinado a ser cossinado**. Seis pontos estão explicitamente a verificar ou decidir, e a seção final — a que carrega o chamado — resta escrever."},"w":{"fr":"Lister quelques hébergeurs associatifs, vérifier la vitalité actuelle de PMB, vérifier la licence exacte de Pandora et ce qu'implique l'entrée d'une archive partenaire, vérifier l'adresse de contact du réseau ALN, trancher la ligne « catalogue consultable, pas de prêt » du tableau, faire compléter la description d'AnarcosyndicalismeBOOK, et **écrire ensemble la section finale « Ce qui manque » — c'est l'appel**.","pt":"Listar alguns provedores associativos, verificar a vitalidade atual do PMB, verificar a licença exata do Pandora e o que implica a entrada de um arquivo parceiro, verificar o endereço de contato da rede ALN, decidir a linha «catálogo consultável, sem empréstimo» da tabela, fazer completar a descrição do AnarcosyndicalismeBOOK, e **escrever juntos a seção final «O que falta» — é o chamado**."},"y":{"fr":"Trois positions du texte méritent d'être tenues telles quelles. **La question qui décide de tout : qui tiendra le serveur, et pendant combien de temps ?** **Soyez honnêtes sur l'échelle** — en dessous de quelques centaines de documents sans prêt, un tableur fait le travail, et **AnarBib est surdimensionné pour un petit fonds sans prêt**. Et la déclaration d'intérêt explicite : les deux projets comparés sont libres, les deux sont tenus par une seule personne — **se le dire vaut mieux que de le découvrir**.","pt":"Três posições do texto merecem ser mantidas tais quais. **A pergunta que decide tudo: quem vai manter o servidor, e por quanto tempo?** **Sejam honestos quanto à escala** — abaixo de algumas centenas de documentos sem empréstimo, uma planilha faz o serviço, e **o AnarBib é superdimensionado para um pequeno acervo sem empréstimo**. E a declaração de interesse explícita: os dois projetos comparados são livres, os dois são mantidos por uma só pessoa — **dizer isso vale mais que descobrir**."},"f":{"fr":["Les six vérifications sont faites.","La section finale est écrite à plusieurs.","Le texte est traduit une fois stabilisé, pas avant."],"pt":["As seis verificações estão feitas.","A seção final está escrita em conjunto.","O texto é traduzido depois de estabilizado, não antes."]},"dep":{"fr":"Lié à **K5** et **H7**.","pt":"Ligado a **K5** e **H7**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26"]},{"id":"F6","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno"],"t":{"fr":"`notify-internal-task` tourne sur une copie gelée de toute la pile courriel","pt":"`notify-internal-task` corre sobre uma cópia congelada de toda a pilha de e-mail"},"v":{"fr":"**La divergence de signature est refermée le 30/08.** `resolveMailRouting` de la copie accepte désormais une locale et lit `signature_short_i18n[locale]`, à l'identique du canonique ; `renderEmail` la transmet, et les trois envois du gestionnaire passent la leur — elle était déjà calculée quatre lignes plus haut à chaque fois, par `normalizeTaskLocale`. Un avis de tâche à la BLMF est maintenant signé dans la langue de qui le lit. Gardé par `src/tests/notify-internal-task-signature.test.js`, 6 tests qui exercent le vrai fichier sur le contexte réel de la BLMF — dont un qui vérifie que **sans locale, le comportement est exactement celui d'avant**.\n\n**Ce qui reste ouvert, et c'est le gros :** les 9 fichiers d'infrastructure dupliqués. Le relevé ci-dessous ne bouge pas.\n\n**Mesuré le 30/08, après ouverture de l'item.** Il y a bien trois arbres `_shared` sous `supabase/functions/`, mais ils ne pèsent pas le même poids : celui de `catalog_metadata_lookup` ne contient qu'un `cors.ts` sans équivalent canonique — ce n'est pas une duplication. Le cas réel est `notify-internal-task`.\n\nSes 12 fichiers se répartissent ainsi : **3 sont légitimement privés** (`data/internal-tasks.ts`, `handlers/internal-task.ts`, `i18n/task-mail-strings.ts`, absents du canonique) et **9 sont de l'infrastructure dupliquée, toute divergente** — `library-mail-routing` (116 lignes d'écart), `library-notification-context` (122), `mail/layout` (140), `transport/email` (121), `shared/format` (89), `context/policies` (42), `core/webhook` (30), `core/env` (10), `shared/branding` (4). Environ **694 lignes** au total.\n\n**Pourquoi ces copies existent : la question n'a pas de réponse dans le dépôt.** Elles apparaissent dans le TOUT PREMIER commit (`e6ec991a`, 21/08/2026) — 1 479 fichiers et 615 892 insertions sous un message qui parle d'un bouton de l'écran de catalogage. C'est l'import initial du dépôt : l'histoire ne commence pas avant. Aucune décision n'est écrite nulle part.\n\n**Ce qui diverge vraiment, vérifié :** le canonique résout la signature de pied de page en `signature_short_i18n[locale]` avec repli sur `signature_short` ; la copie ne connaît que `signature_short`, et son `resolveMailRouting` n'accepte même pas de locale. **La BLMF a `signature_short_i18n` rempli en six langues.** Ses avis de tâche interne sont donc signés « Equipe da BLMF » quelle que soit la langue de la personne, là où tous les autres courriels de la même bibliothèque disent « L'équipe de la BLMF » à qui lit en français.\n\n**Ce qui NE diverge pas, vérifié aussi :** `transportDisabledReason` est identique octet pour octet dans les deux copies, et le contexte de la copie lit bien `channel_active`. L'interrupteur d'envoi rendu réel le 30/08 est donc honoré ici comme ailleurs. `policyEnabled` et `resolveNetworkLogoUrl`, présents dans la copie seule, ne sont appelés par personne.","pt":"**A divergência de assinatura foi fechada em 30/08.** O `resolveMailRouting` da cópia aceita agora uma locale e lê `signature_short_i18n[locale]`, igual ao canónico; `renderEmail` transmite-a, e os três envios do gestor passam a sua — já estava calculada quatro linhas acima de cada vez, por `normalizeTaskLocale`. Um aviso de tarefa na BLMF é agora assinado na língua de quem o lê. Guardado por `src/tests/notify-internal-task-signature.test.js`, 6 testes que exercitam o ficheiro real sobre o contexto real da BLMF — incluindo um que verifica que **sem locale, o comportamento é exatamente o de antes**.\n\n**O que fica em aberto, e é o grosso:** os 9 ficheiros de infraestrutura duplicados. O levantamento abaixo não muda.\n\n**Medido em 30/08, depois da abertura do item.** Há de facto três árvores `_shared` sob `supabase/functions/`, mas não pesam o mesmo: a de `catalog_metadata_lookup` contém apenas um `cors.ts` sem equivalente canónico — não é duplicação. O caso real é `notify-internal-task`.\n\nOs seus 12 ficheiros repartem-se assim: **3 são legitimamente privados** (`data/internal-tasks.ts`, `handlers/internal-task.ts`, `i18n/task-mail-strings.ts`, ausentes do canónico) e **9 são infraestrutura duplicada, toda divergente** — `library-mail-routing` (116 linhas de diferença), `library-notification-context` (122), `mail/layout` (140), `transport/email` (121), `shared/format` (89), `context/policies` (42), `core/webhook` (30), `core/env` (10), `shared/branding` (4). Cerca de **694 linhas** ao todo.\n\n**Porque existem estas cópias: a pergunta não tem resposta no repositório.** Aparecem no PRIMEIRO commit (`e6ec991a`, 21/08/2026) — 1 479 ficheiros e 615 892 inserções sob uma mensagem que fala de um botão do ecrã de catalogação. É a importação inicial: a história não começa antes. Nenhuma decisão está escrita em lado nenhum.\n\n**O que diverge realmente, verificado:** o canónico resolve a assinatura de rodapé em `signature_short_i18n[locale]` com recurso a `signature_short`; a cópia só conhece `signature_short`, e o seu `resolveMailRouting` nem sequer aceita uma locale. **A BLMF tem `signature_short_i18n` preenchido em seis línguas.** Os seus avisos de tarefa interna são portanto assinados «Equipe da BLMF» seja qual for a língua da pessoa, ao passo que todos os outros e-mails da mesma biblioteca dizem «L'équipe de la BLMF» a quem lê em francês.\n\n**O que NÃO diverge, também verificado:** `transportDisabledReason` é idêntico byte a byte nas duas cópias, e o contexto da cópia lê bem `channel_active`. O interruptor de envio tornado real em 30/08 é portanto honrado aqui como noutro sítio. `policyEnabled` e `resolveNetworkLogoUrl`, presentes só na cópia, não são chamados por ninguém."},"w":{"fr":"La première question de l'item — *pourquoi ces copies existent* — est close : elles précèdent l'histoire du dépôt, aucune décision n'est écrite. Il faut donc trancher **sur le fond**, pas par archéologie.\n\n**Le plus petit geste utile**, si on ne veut pas ouvrir le chantier : donner à `resolveMailRouting` de la copie le paramètre `locale` et la lecture de `signature_short_i18n`, à l'identique du canonique. Ça referme la seule divergence dont on a constaté l'effet.\n\n**Le geste complet** : faire pointer les 9 fichiers d'infrastructure de `notify-internal-task` vers `../../_shared/`, et ne garder en propre que les 3 fichiers de tâches. Le risque n'est pas nul — 694 lignes d'écart contiennent peut-être d'autres différences voulues — donc chaque fichier se reprend un par un, en comparant les envois avant/après sur un avis de tâche réel.\n\n**Et dans les deux cas** : écrire en tête de `notify-internal-task/_shared/` ce qui y vit et pourquoi, pour que la prochaine personne n'ait pas à refaire ce relevé.","pt":"A primeira pergunta do item — *porque existem estas cópias* — está encerrada: precedem a história do repositório, nenhuma decisão está escrita. É preciso portanto decidir **pelo mérito**, não por arqueologia.\n\n**O menor gesto útil**, se não se quiser abrir o canteiro: dar ao `resolveMailRouting` da cópia o parâmetro `locale` e a leitura de `signature_short_i18n`, igual ao canónico. Isso fecha a única divergência cujo efeito foi constatado.\n\n**O gesto completo**: fazer os 9 ficheiros de infraestrutura de `notify-internal-task` apontarem para `../../_shared/`, e guardar em próprio apenas os 3 ficheiros de tarefas. O risco não é nulo — 694 linhas de diferença talvez contenham outras diferenças desejadas — portanto cada ficheiro retoma-se um a um, comparando os envios antes/depois num aviso de tarefa real.\n\n**E nos dois casos**: escrever no cabeçalho de `notify-internal-task/_shared/` o que ali vive e porquê, para que a próxima pessoa não tenha de refazer este levantamento."},"y":{"fr":"Parce que le routage du courriel est justement l'endroit où une divergence ne se voit pas. Un logo résolu autrement, une règle d'extinction appliquée dans une copie et pas dans l'autre : le message part quand même, et personne ne compare deux courriels envoyés par deux fonctions différentes.\n\nC'est exactement ce qui vient de se produire à l'échelle d'une seule colonne — `register` résolvait le logo autrement que toutes les autres fonctions, et l'écart a tenu des mois. Ici l'écart porte sur 139 lignes.","pt":"Porque o roteamento do e-mail é justamente o sítio onde uma divergência não se vê. Um logótipo resolvido de outra forma, uma regra de extinção aplicada numa cópia e não na outra: a mensagem parte na mesma, e ninguém compara dois e-mails enviados por duas funções diferentes.\n\nÉ exatamente o que acaba de acontecer à escala de uma única coluna — `register` resolvia o logótipo de forma diferente de todas as outras funções, e a diferença durou meses. Aqui a diferença é de 139 linhas."},"f":{"fr":["~~La divergence de signature localisée est refermée~~ — fait le 30/08, gardé par 6 tests.","Le sort des 9 fichiers d'infrastructure dupliqués est tranché — réunis, ou assumés par écrit.","Un en-tête dans `notify-internal-task/_shared/` dit ce qui y vit et pourquoi.","La collision de nom sur `resolveLibraryLogoUrl` est levée."],"pt":["~~A divergência de assinatura localizada está fechada~~ — feito em 30/08, guardado por 6 testes.","O destino dos 9 ficheiros de infraestrutura duplicados está decidido — reunidos, ou assumidos por escrito.","Um cabeçalho em `notify-internal-task/_shared/` diz o que ali vive e porquê.","A colisão de nome sobre `resolveLibraryLogoUrl` está resolvida."]},"dep":{"fr":"Aucune. Le relevé est fait — il est dans cet item. Ce qui reste est une décision de portée, pas une enquête.","pt":"Nenhuma. O levantamento está feito — está neste item. O que resta é uma decisão de alcance, não uma investigação."},"r":["supabase/functions/_shared/context/library-mail-routing.ts","supabase/functions/notify-internal-task/_shared/ (12 fichiers, dont 9 dupliqués)","library_notification_profiles.signature_short_i18n (BLMF, 6 langues)","commit e6ec991a — import initial du dépôt, 21/08/2026","src/tests/notify-internal-task-signature.test.js"],"verif":{"fr":"30/08 — relevé fait fichier par fichier, après ouverture de l'item : 9 fichiers dupliqués et tous divergents, ~694 lignes, et **une seule divergence à effet observable** — la signature de pied de page non traduite, **refermée le soir même et gardée par 6 tests**. L'origine des copies n'a pas de réponse dans le dépôt : elles sont dans le premier commit. Ce qui reste est une décision de portée, pas une mesure.","pt":"30/08 — levantamento feito ficheiro a ficheiro, depois da abertura do item: 9 ficheiros duplicados e todos divergentes, ~694 linhas, e **uma única divergência com efeito observável** — a assinatura de rodapé não traduzida, **fechada na mesma noite e guardada por 6 testes**. A origem das cópias não tem resposta no repositório: estão no primeiro commit. O que resta é uma decisão de alcance, não uma medição."}},{"id":"I18","d":"I","p":"P2","s":"en-cours","e":"M","sk":["sysadmin"],"t":{"fr":"Le banc CI ne rejoue pas sur une image Supabase — il faut un rejeu qui le fasse","pt":"O banco de CI não faz replay numa imagem Supabase — é preciso um que faça"},"v":{"fr":"`scripts/ci/run-sql-suites.sh` crée `anarbib_test` depuis `template0` : `pg_default_acl` y est vide, les fonctions naissent fermées, la vérification des migrations du 29/08 passe — et une image réelle la fait lever. Le vert de `sql-tests` n'atteste donc pas qu'une image Supabase rejoue le dépôt (`DOC-GRANT-2`, même limite structurelle que `DOC-MIGR-1` par l'autre bout). Le choix de `template0` est motivé (pas d'event triggers hérités) et reste bon pour les suites. **07/09** : la spec d'`I17` (§8) rend cet item bon marché — le service `sql-tests` lance déjà l'image ; il suffit d'un second job qui rejoue les migrations dans la base `postgres` du service (défauts et extensions de l'init posés) au lieu d'une base `template0`. **07/09, confirmé par l'expérience d'`I17`** : avec A.1 avant le socle et `CREATE EXTENSION pg_cron`, la base `postgres` de l'image rejoue les 310 migrations sous `postgres` ; le job serait vert aujourd'hui. **16/09 : livré.** Job `rejeu-image` dans `sql-tests.yml` (`scripts/ci/run-image-replay.sh`) : même service Postgres, rejeu dans la base `postgres` de l'image par les deux scripts de la pile (`deploy/init-db/01-roles.sh` : mots de passe, A.1, `pg_cron` ; `deploy/scripts/run-migrations.sh` sous `postgres`), qui parlent à l'image par `PGHOST` au lieu du socket — un `install.sh` sans conteneurs applicatifs. Entre les deux, ce que la pile obtient de ses services avant de migrer (bootstrap.sh 3/8 et 4/8) : le sel au Vault réel par `vault.create_secret`, les stubs `auth` et `storage` de sql-tests, et un stub de pont `tests/sql/_ci_setup_image_services_stub.sql`. **Quatre manques de l'image nue, mesurés en chemin, sans lesquels un rejeu à froid s'arrête** : `auth.jwt()` absent (socle, l. 41402) ; `auth.users` d'origine sans `email_confirmed_at`, `is_sso_user`, `is_anonymous` (`20260623204043`) ; `auth.uid()` d'origine qui ne lit que `request.jwt.claim.sub`, pas `request.jwt.claims` (`20260702081711`, « Nenhum usuário autenticado ») ; `storage.buckets` créée fermée à `postgres`, l'image n'ayant aucun privilège par défaut sur `storage` (`20260820012512`). Le stub dit chacun. Éprouvé quatre fois sur conteneur jetable `public.ecr.aws/supabase/postgres:17.6.1.084` : **320/320 en 54 s sous `postgres`, 133 fonctions exécutables par `anon` (public, api, ingest, private), empreinte MD5 identique à la production du 15/09, 38 crons, 0 table sans RLS**, 64 s bout en bout. `alerte` et `acquittement` comptent les deux jobs. Reste : le premier run de la forge, puis le critère 2 (un rouge pour une vraie raison, corrigé).","pt":"`scripts/ci/run-sql-suites.sh` cria `anarbib_test` a partir de `template0`: `pg_default_acl` está vazia, as funções nascem fechadas e a verificação passa — uma imagem real a faz falhar. O verde do `sql-tests` não atesta que uma imagem Supabase reproduz o repositório. **07/09**: a spec de `I17` (§8) torna este item barato — basta um segundo job que reproduza as migrações no banco `postgres` do serviço em vez de um banco `template0`. **07/09, confirmado pela experiência de `I17`**: com A.1 antes da base e `CREATE EXTENSION pg_cron`, o banco `postgres` da imagem reproduz as 310 migrações sob `postgres`; o job estaria verde hoje. **16/09: entregue.** Job `rejeu-image` em `sql-tests.yml` (`scripts/ci/run-image-replay.sh`): mesmo serviço Postgres, replay no banco `postgres` da imagem pelos dois scripts da pilha (`01-roles.sh`: A.1 e `pg_cron`; `run-migrations.sh` sob `postgres`), precedido do que a pilha obtém dos seus serviços antes de migrar (sal no Vault real, stubs `auth`/`storage`, stub de ponte `_ci_setup_image_services_stub.sql`). Quatro faltas da imagem nua medidas no caminho: `auth.jwt()` ausente; `auth.users` de origem sem `email_confirmed_at` / `is_sso_user` / `is_anonymous`; `auth.uid()` de origem que não lê `request.jwt.claims`; `storage.buckets` fechada a `postgres`. Provado quatro vezes em contêiner descartável `17.6.1.084`: **320/320 em 54 s, 133 funções `anon`, MD5 idêntico à produção, 38 crons, 0 tabela sem RLS**. Falta: o primeiro run da forja e o critério 2 (um vermelho por razão real, corrigido)."},"w":{"fr":"Lire le run dans Actions. Quand il rougit, corriger la cause — une migration, ou le pont si l'image ou GoTrue ont bougé — jamais le job. Le jour où un rouge motivé est corrigé, clore (critère 2).","pt":"Ler o run em Actions. Quando ficar vermelho, corrigir a causa — uma migração, ou a ponte — nunca o job. No dia em que um vermelho motivado for corrigido, encerrar (critério 2)."},"y":{"fr":"Toute assertion « N migrations rejouent de zéro » se mesure sur une image Supabase, jamais sur le banc CI. Sans ce job, c'est la prochaine personne extérieure qui fera la mesure, à ses frais.","pt":"Toda afirmação « N migrações reproduzem do zero » mede-se numa imagem Supabase, nunca no banco de CI."},"f":{"fr":["Un job de la forge rejoue les migrations sur `supabase/postgres` et son résultat est lisible dans Actions.","Il a été rouge une fois pour une vraie raison, et la raison a été corrigée."],"pt":["Um job da forja reproduz as migrações em `supabase/postgres` com resultado legível em Actions.","Foi vermelho uma vez por uma razão real, corrigida."]},"dep":{"fr":"Après **I17** (sinon le job sera rouge pour la raison déjà connue).","pt":"Depois de I17."},"r":["scripts/ci/run-sql-suites.sh","REGISTRE §0 DOC-GRANT-2","REGISTRE §0 DOC-MIGR-1","scripts/ci/run-image-replay.sh","tests/sql/_ci_setup_image_services_stub.sql",".forgejo/workflows/sql-tests.yml","deploy/init-db/01-roles.sh","deploy/scripts/run-migrations.sh"],"verif":[{"fr":"16/09 — job écrit et éprouvé quatre fois sur conteneur jetable `public.ecr.aws/supabase/postgres:17.6.1.084` (worktree `claude/i18`), liste des 133 fonctions `anon` comparée ligne à ligne à celle du 15/09, empreinte identique ; pile locale (GoTrue, Storage réels) consultée pour les droits et `auth.uid()`.","pt":"16/09 — job escrito e provado quatro vezes em contêiner descartável `17.6.1.084` (worktree `claude/i18`), lista das 133 funções `anon` comparada linha a linha com a de 15/09, MD5 idêntico."},{"fr":"21/09 — **premier critère tenu sur la forge, second en attente par construction ; la fiche avait cinq jours de retard.** Le job `rejeu-image` (`sql-tests.yml`, commit `d5228c7f`) a tourné **huit fois** sur la forge entre le 16/09 et le 21/09 (relevé par l'API `actions/tasks`), **huit fois vert**, lisible dans Actions — dont le 21/09 sur la migration de B27. Une autre session l'écrit « livré et vert sur la forge » le 21/09. Le second critère — « il a été rouge une fois pour une vraie raison, et la raison a été corrigée » — ne peut pas être provoqué : l'item reste ouvert pour lui, et pour lui seul.","pt":"21/09 — **primeiro critério cumprido na forja, segundo em espera por construção.** O job `rejeu-image` correu **oito vezes** entre 16/09 e 21/09, **oito vezes verde**. O segundo critério — « ficou vermelho uma vez por uma razão real » — não se pode provocar: o item fica aberto só por ele."}]},{"id":"F7","d":"F","p":"P1","s":"ouvert","e":"S","sk":["deno"],"t":{"fr":"Un transport mail sans service configuré lève ; il ne simule pas en silence","pt":"Um transporte de e-mail sem serviço configurado falha; não simula em silêncio"},"v":{"fr":"La PR #28 ajoute un transport hybride SMTP / Resend / « mock » dans `_shared/transport/email.ts` et dans les deux copies locales de `notify-library-request` et `notify-document-permission-request` : sans `SMTP_HOST` ni `RESEND_API_KEY`, `sendEmail` rend `{ok:true, mocked:true}` et journalise. C'est le cas *(a)* de `DOC-SILENCE-1`, et la forme exacte de son occurrence (1). En prod la clé Resend existe, rien ne change aujourd'hui ; le jour où le secret manque, la prod répondra 200 en n'envoyant rien. L'aiguillage SMTP/Resend, lui, est correct (`SMTP_HOST` posé ⇒ SMTP sauf `MAIL_TRANSPORT=resend`), et le client SMTP maison (`smtp.ts`) est propre. **D4 (21 h 30)** : côté installateur, la simulation devient l'option 3, jamais par défaut.","pt":"A PR #28 adiciona um transporte híbrido SMTP / Resend / « mock »: sem `SMTP_HOST` nem `RESEND_API_KEY`, `sendEmail` devolve `{ok:true, mocked:true}`. É o caso (a) de `DOC-SILENCE-1`. Em produção nada muda hoje; no dia em que o segredo faltar, a produção responderá 200 sem enviar nada. **D4 (21h30)**: no instalador, a simulação vira opção 3, nunca padrão."},"w":{"fr":"Règle à demander dans la PR et à écrire dans `spec-migration-mail-resend` : le mock **uniquement** sur `MAIL_TRANSPORT=mock` explicite (c'est ce qu'`install.sh` écrit déjà pour l'option 1) ; sans configuration, lever comme avant. Et une seule implémentation : les deux `notify-*` doivent appeler `_shared/transport/email.ts` au lieu d'en porter une copie — la PR a étendu les trois.","pt":"Regra a pedir na PR e escrever na spec: mock **só** com `MAIL_TRANSPORT=mock` explícito; sem configuração, falhar como antes. E uma única implementação: os dois `notify-*` devem chamar `_shared/transport/email.ts` em vez de copiar."},"y":{"fr":"Une coordination a cru pendant des mois avoir coupé ses notifications ; le contraire — croire qu'elles partent — coûte les rappels d'échéance et les circuits collégiaux, qui s'arrêtent sans bruit (`GOUV-17`).","pt":"Uma coordenação acreditou por meses ter cortado suas notificações; o contrário — acreditar que partem — custa lembretes e circuitos colegiais que param sem ruído."},"f":{"fr":["Sans `MAIL_TRANSPORT=mock`, une fonction sans service mail configuré lève et son appel rend une erreur lisible.","Une seule fonction d'envoi dans `_shared/`, appelée par toutes les EF qui écrivent."],"pt":["Sem `MAIL_TRANSPORT=mock`, uma função sem serviço configurado falha com erro legível.","Uma única função de envio em `_shared/`, chamada por todas as EF."]},"dep":{"fr":"Relecture de la PR « code applicatif » (**I16**).","pt":"Releitura da PR « código aplicativo » (I16)."},"r":["supabase/functions/_shared/transport/email.ts","REGISTRE §0 DOC-SILENCE-1","docs/specs/spec-migration-mail-resend.md","codeberg.org/anarbib/anarbib/pulls/28"],"verif":[{"fr":"06/09 — PR #28 relue en entier (46 fichiers, tête `b5782ec1`), production interrogée en lecture seule, constat `CONSTAT_PR28_rejeu_vs_production_revoke_anon_2026-09-06`.","pt":"06/09 — PR #28 relida por inteiro (46 arquivos, cabeça `b5782ec1`), produção consultada em leitura, constato `CONSTAT_PR28_rejeu_vs_production_revoke_anon_2026-09-06`."},{"fr":"16/09 — le transport hybride SMTP/Resend/Mock n'est **pas** dans `main` : `_shared/transport/email.ts` ne connaît que Resend, `MAIL_TRANSPORT` n'apparaît que dans `deploy/functions.env.example`. Il est dans la PR #29 (code applicatif), pas encore fusionnée. **Écart de doc** : `deploy/README.md` § « Transport des e-mails » décrit déjà les trois modes et le « mode test local » silencieux — le README est en avance sur le code, et décrit précisément ce que F7 interdit.","pt":"16/09 — o transporte híbrido SMTP/Resend/Mock **não** está em `main`: `_shared/transport/email.ts` só conhece a Resend, `MAIL_TRANSPORT` só aparece em `deploy/functions.env.example`. Está na PR #29, ainda não fundida. **Desvio de doc**: `deploy/README.md` § « Transport des e-mails » já descreve os três modos e o « modo teste local » silencioso — o README está à frente do código."}]},{"id":"E14","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front","deno","sql","langue"],"t":{"fr":"Une page pour signaler un bug depuis l'application","pt":"Uma página para relatar um bug a partir do aplicativo"},"v":{"fr":"**Demande de Xavier le 07/09/2026.** Vérifié le même jour : **aucun mécanisme de signalement n'existe dans l'app**, à aucun niveau. Pas de table (`bug_reports`, `feedback`, `signalements` — rien ; la seule table d'incidents, `service_health_incidents`, est la supervision automatique), aucune des 52 Edge Functions, aucune route dans `App.jsx` (pas de `/bug`, `/feedback`, `/contato`, `/aide`), aucune clé i18n (`*.bug.*`, `*.feedback.*`), aucun lien vers les issues Codeberg dans `src/` (les seules URL Codeberg de l'app sont dans la politique de confidentialité et le DPA). Le seul courriel de contact général, `mailto:contato@anarbib.org`, est enterré dans `PrivacyPolicyPage.jsx` ; les deux `mailto:anarbib@proton.me` sont réservés à l'onboarding. Le canal documenté vit hors de l'app et côté développeur : `CONTRIBUTING.md` et le README disent « ouvrir une issue sur Codeberg » — inaccessible à une bibliothécaire qui n'a pas de compte là-bas.\n\n**Trois patrons maison existent déjà**, et il n'y a rien à inventer : *(1)* `authority_duplicate_reports` + `report_authority_pair` (staff → coordination, index unique partiel anti-flood sur `status='open'`, `HINT` = clés i18n, `DO $$` de vérification — et son en-tête explique pourquoi une table générique à `entity_type` a été refusée) ; *(2)* `book_reading_note_reports` (modération, `UNIQUE (note_id, reporter)`) ; *(3)* **`cartography_submissions`** — le seul ouvert à `anon` : table verrouillée, Edge Function publique `submit-cartography-entry` avec défi altcha, outbox → `notify-event` vers `fede@anarbib.org`, trio `list/approve/reject`, écran de modération. C'est le modèle 3 qui couvre le besoin, avec l'anti-flood du modèle 1.","pt":"**Pedido de Xavier em 07/09/2026.** Verificado no mesmo dia: **nenhum mecanismo de relato existe no app**. Nenhuma tabela (`bug_reports`, `feedback` — nada; `service_health_incidents` é a supervisão automática), nenhuma das 52 Edge Functions, nenhuma rota em `App.jsx`, nenhuma chave i18n, nenhum link para as issues do Codeberg em `src/`. O único e-mail de contato geral, `contato@anarbib.org`, está enterrado na política de privacidade. O canal documentado vive fora do app, do lado do desenvolvedor: «abrir uma issue no Codeberg» — inacessível a uma bibliotecária sem conta lá.\n\n**Três padrões caseiros já existem**: *(1)* `authority_duplicate_reports` (staff → coordenação, índice único parcial anti-inundação, `HINT` = chaves i18n); *(2)* `book_reading_note_reports` (moderação); *(3)* **`cartography_submissions`** — o único aberto a `anon`: tabela trancada, Edge Function pública com altcha, outbox → `notify-event`, trio `list/approve/reject`, tela de moderação. É o modelo 3 que cobre a necessidade, com o anti-inundação do modelo 1."},"w":{"fr":"Une page publique « Signaler un problème » (route à nommer, `/signalar` ou `/problema`), accessible **sans compte** et depuis **toutes** les pages : un lien dans le `Footer` (`src/components/layout/index.jsx`, aujourd'hui trois éléments : mention, confidentialité, langue) et une intention « Je veux signaler un problème » dans `intentions.js` (groupe lecteur — une ligne). Formulaire minimal : ce qui s'est passé, ce qui était attendu, comment refaire ; **le contexte se remplit seul** (page d'origine, locale, rôle et bibliothèque de session si connecté, navigateur) ; courriel de réponse facultatif ; jamais de mot de passe ni de capture obligatoire. Côté serveur, calquer `cartography_submissions` : table `bug_reports` verrouillée (`REVOKE ALL FROM anon, authenticated`), Edge Function `submit-bug-report` avec altcha pour les anonymes, outbox → `notify-event` vers `admins@anarbib.org` (le destinataire de supervision, F-domaine), statut `open/closed`, index unique partiel anti-flood, RPC `list/close` réservées aux admins réseau, et un onglet dans Rede (ou la page de modération existante) pour la file. **Deux décisions à prendre en écrivant** : *(a)* pont vers Codeberg (un admin recopie à la main vers une issue — le plus simple et le plus honnête) ou pas de pont ; *(b)* accusé de réception par courriel au signaleur quand il a laissé une adresse. Dix locales d'emblée (parité stricte, `i18n.test.js`), et un test qui garde la route et le `Footer`.","pt":"Uma página pública «Relatar um problema» (rota a nomear), acessível **sem conta** e a partir de **todas** as páginas: um link no `Footer` (`src/components/layout/index.jsx`) e uma intenção «Quero relatar um problema» em `intentions.js` (grupo leitor — uma linha). Formulário mínimo: o que aconteceu, o que era esperado, como refazer; **o contexto preenche-se sozinho** (página de origem, locale, papel e biblioteca de sessão, navegador); e-mail de resposta opcional. No servidor, copiar `cartography_submissions`: tabela `bug_reports` trancada, Edge Function `submit-bug-report` com altcha para anônimos, outbox → `notify-event` para `admins@anarbib.org`, status `open/closed`, índice único parcial anti-inundação, RPC `list/close` para admins de rede, e um separador na Rede para a fila. **Duas decisões ao escrever**: ponte para o Codeberg (um admin recopia à mão) ou não; acusar recebimento por e-mail quando houver endereço. Dez locales de imediato, e um teste que guarda a rota e o `Footer`."},"y":{"fr":"La formation BLMF commence le 08/09 (sept soirées) : des coordinations vont buter sur des défauts, et la seule voie de retour aujourd'hui est l'oreille de Xavier. Un outil dont on ne peut pas dire qu'il est cassé sans passer par le mainteneur contredit `DOC-COLLECTIVE-1` ; et la promesse d'**A4** (« un premier retour sous une semaine ») n'a pas de porte d'entrée pour qui ne code pas.","pt":"A formação BLMF começa em 08/09 (sete noites): as coordenações vão topar com defeitos, e o único caminho de retorno hoje é o ouvido de Xavier. Uma ferramenta em que não se pode dizer «está quebrado» sem passar pelo mantenedor contradiz `DOC-COLLECTIVE-1`; e a promessa de **A4** não tem porta para quem não programa."},"f":[{"fr":"Depuis n'importe quelle page, connectée ou non, une personne dépose un signalement en moins de deux minutes sans rien connaître de Codeberg.","pt":"De qualquer página, com ou sem conta, uma pessoa deposita um relato em menos de dois minutos sem saber nada do Codeberg."},{"fr":"Le signalement arrive par courriel aux admins réseau et figure dans une file avec un statut ; le même défaut signalé cinq fois ne fait pas cinq courriels.","pt":"O relato chega por e-mail aos admins de rede e figura numa fila com status; o mesmo defeito relatado cinco vezes não faz cinco e-mails."},{"fr":"Dix locales, page titrée (`useDocumentTitle`), formulaire utilisable au clavier et sur mobile (`minmax(0,1fr)`).","pt":"Dez locales, página com título, formulário utilizável ao teclado e no celular."}],"dep":{"fr":"Aucune bloquante. Voisin de **A4** (accueillir une contribution) et **E12** (le premier retour ergonomique de Xavier n'avait, lui non plus, pas de canal). Réutilise `notify-event` et altcha tels quels.","pt":"Nenhuma bloqueante. Vizinho de **A4** e **E12**. Reutiliza `notify-event` e altcha tal como estão."},"r":["src/components/layout/index.jsx (Footer)","src/pages/inicio/intentions.js","supabase/migrations/20260618182516_cartography_submissions.sql","supabase/functions/submit-cartography-entry","supabase/migrations/20260821130001_signaler_un_doublon_d_autorite.sql","CONTRIBUTING.md"],"verif":{"fr":"07/09 — grep sur `src/`, `supabase/functions/` (52 EF), `App.jsx` (routes), `fr.json` ; dépôt `eb790c33`. Aucun mécanisme, aucun item au backlog avant celui-ci.","pt":"07/09 — grep em `src/`, `supabase/functions/` (52 EF), `App.jsx`, `fr.json`; repositório `eb790c33`. Nenhum mecanismo, nenhum item no backlog antes deste."}},{"id":"G13","d":"G","p":"P2","s":"ouvert","e":"M","sk":["sql","front","langue","biblio"],"t":{"fr":"Un commutateur « réseaux constitués » à l'OPAC : ne voir que les catalogues FICEDL, RebAL, NORLA…","pt":"Um comutador «redes constituídas» no OPAC: ver só os catálogos FICEDL, RebAL, NORLA…"},"v":{"fr":"**Demande de Xavier le 07/09/2026** : pouvoir restreindre l'affichage aux catalogues des bibliothèques qui appartiennent à un réseau constitué **avant** AnarBib — FICEDL, RebAL, NORLA (le corpus écrit NORLA, pas NORMA).\n\n**Le modèle ne connaît pas ces réseaux.** `libraries` n'a ni colonne ni table d'affiliation externe — `network_mode` (`isolated|observer|federated`), `visibility_level='network'`, `catalog_mode='network_published'` et `network_administrators` parlent tous du rapport au réseau **AnarBib**, faux amis. Deux seuls porteurs, en texte libre : **`cartography_entries.reseau`** (spec-cartographie, sans vocabulaire contrôlé) et `library_commons.affiliation_label` (éditorial : « CCLA »). Sur les 187 fiches de carte : `FICEDL` 34, `RebAL ; FICEDL` 11, `RebAL` 6, `FAI Reggiana` 2, `ABABA`, `RebAL, FAI`, `FAO, AFI`, `UK Social Centre Network, Radical Routes` — 130 vides ; séparateurs `;` et `,` mélangés ; fédérations de centres de documentation et organisations politiques dans le même champ. **NORLA n'apparaît nulle part dans les données** (seulement aux items G8, H6, D4). Le champ n'est affiché qu'en infobulle de la carte (`CartographyMap.jsx`), jamais filtrable, et absent du formulaire d'édition. Aucune vue publique ne l'expose : `api.libraries_public_v1` (celle de l'OPAC) sert `id, slug, name, short_name, city, state` ; `api.public_libraries` sert `affiliation_label` mais pas `reseau`.\n\n**Côté OPAC**, le filtre par bibliothèque passe par les **noms courts** (`p_filters.libraries` → `api.catalog_works_v1`, `holding_library_names_json`), mémorisé dans `localStorage` (`anarbib:catalog:filters`) — pas de `library_ids`, pas de notion de réseau.\n\n**Mesuré en production le 07/09** : trois bibliothèques seulement ont une fiche de carte rattachée (`library_id`) — BLMF (FICEDL, 248 exemplaires), BTL (FICEDL, 2 184), MLEG (aucun réseau, 269). Un commutateur « FICEDL seulement » montrerait donc aujourd'hui BLMF + BTL, et « RebAL » ou « NORLA » rien : l'item vaut pour ce que le réseau devient (Bologne, admissions), pas pour ce qu'il est.","pt":"**Pedido de Xavier em 07/09/2026**: restringir a exibição aos catálogos das bibliotecas que pertencem a uma rede constituída **antes** do AnarBib — FICEDL, RebAL, NORLA.\n\n**O modelo não conhece essas redes.** `libraries` não tem coluna nem tabela de afiliação externa — `network_mode`, `visibility_level='network'`, `catalog_mode='network_published'` falam todos da relação com a rede **AnarBib**, falsos amigos. Dois únicos portadores, em texto livre: **`cartography_entries.reseau`** (sem vocabulário controlado) e `library_commons.affiliation_label` (editorial). Nas 187 fichas do mapa: `FICEDL` 34, `RebAL ; FICEDL` 11, `RebAL` 6, `FAI Reggiana` 2 … — 130 vazias; separadores `;` e `,` misturados. **NORLA não aparece em lugar nenhum dos dados.** O campo só aparece no balão do mapa, nunca filtrável, ausente do formulário de edição, ausente das vistas públicas (`api.libraries_public_v1` serve `id, slug, name, short_name, city, state`).\n\n**No OPAC**, o filtro por biblioteca passa pelos **nomes curtos** (`p_filters.libraries` → `api.catalog_works_v1`), guardado em `localStorage` — nenhuma noção de rede.\n\n**Medido em produção em 07/09**: só três bibliotecas têm ficha de mapa ligada — BLMF (FICEDL, 248 exemplares), BTL (FICEDL, 2 184), MLEG (sem rede, 269). Um comutador «só FICEDL» mostraria hoje BLMF + BTL; «RebAL» ou «NORLA», nada: o item vale pelo que a rede se torna, não pelo que é."},"w":{"fr":"Trois pas, dans cet ordre. **(1) Normaliser** : un vocabulaire contrôlé des réseaux (table `networks` : slug, libellé, site — `ficedl`, `rebal`, `norla`, `fai`…, en excluant ou en typant les organisations politiques) et une colonne `reseaux text[]` — ou une table de jointure — sur `cartography_entries`, remplie depuis `reseau` (couper sur `;` et `,`, normaliser la casse), le champ ajouté à `CartographyEditModal` avec ses clés i18n ; l'appartenance reste déclarée par la fiche de carte, qui a déjà sa modération — **aucun circuit nouveau**. **(2) Exposer** : une colonne `networks` dans `api.libraries_public_v1` par jointure sur `cartography_entries.library_id` — en réécrivant la vue **avec** `security_invoker` (un `CREATE OR REPLACE VIEW` sans `WITH` la ferait retomber en DEFINER). **(3) Filtrer** : dans `CatalogPage.jsx`, à côté du sélecteur de bibliothèques, un sélecteur de réseaux qui réduit `libraryOptions` et alimente `libraryShortNames` — **sans toucher au RPC** ni aux vues matérialisées `catalog_list_*` ; mémorisé dans `anarbib:catalog:filters`, visible en puce, remis à zéro par « effacer les filtres ». **Décision à prendre en écrivant** : un interrupteur unique « réseaux constitués seulement » ou un filtre par réseau (FICEDL / RebAL / NORLA) — le second coûte le même prix et répond à « où sont nos catalogues ? » posé par un réseau à la fois ; l'interrupteur peut être le raccourci « tous les réseaux ». Une biblio hors de toute fiche de carte n'apparaît dans aucun réseau : le dire à l'écran plutôt que la faire disparaître en silence.","pt":"Três passos. **(1) Normalizar**: um vocabulário controlado das redes (tabela `networks`: slug, rótulo, site) e uma coluna `reseaux text[]` — ou tabela de junção — em `cartography_entries`, preenchida a partir de `reseau` (cortar em `;` e `,`), o campo acrescentado ao `CartographyEditModal` com suas chaves i18n; a pertença continua declarada pela ficha do mapa, que já tem moderação — **nenhum circuito novo**. **(2) Expor**: uma coluna `networks` em `api.libraries_public_v1` por junção em `cartography_entries.library_id` — reescrevendo a vista **com** `security_invoker`. **(3) Filtrar**: em `CatalogPage.jsx`, ao lado do seletor de bibliotecas, um seletor de redes que reduz `libraryOptions` e alimenta `libraryShortNames` — **sem tocar no RPC** nem nas vistas materializadas; guardado em `localStorage`, visível em chip. **Decisão ao escrever**: um interruptor único «só redes constituídas» ou um filtro por rede (FICEDL / RebAL / NORLA) — o segundo custa o mesmo e responde a «onde estão os nossos catálogos?». Uma biblioteca sem ficha de mapa não aparece em rede nenhuma: dizê-lo na tela, não a fazer desaparecer em silêncio."},"y":{"fr":"Bologne (13/09) réunit des gens dont les réseaux existaient avant AnarBib ; la première chose qu'ils chercheront à l'écran, c'est le leur. Les conventions d'interopérabilité posent qu'il n'y a « rien à rejoindre » : montrer les réseaux tels qu'ils existent, plutôt que les fondre dans un annuaire AnarBib, est la traduction de cette phrase dans l'interface.","pt":"Bolonha (13/09) reúne gente cujas redes existiam antes do AnarBib; a primeira coisa que procurarão na tela é a sua. As convenções de interoperabilidade dizem que «não há nada a que aderir»: mostrar as redes tal como existem, em vez de fundi-las num anuário AnarBib, é a tradução dessa frase na interface."},"f":[{"fr":"Plus une valeur de `reseau` hors vocabulaire ; la fiche de carte propose les réseaux dans une liste, dans les dix langues.","pt":"Nenhum valor de `reseau` fora do vocabulário; a ficha do mapa propõe as redes numa lista, nas dez línguas."},{"fr":"À l'OPAC, un geste réduit la liste aux bibliothèques d'un ou plusieurs réseaux, survit au rechargement, s'affiche en puce et s'efface avec les autres filtres.","pt":"No OPAC, um gesto reduz a lista às bibliotecas de uma ou várias redes, sobrevive ao recarregamento, aparece em chip e apaga-se com os outros filtros."},{"fr":"Vérifié à l'écran avec BLMF et BTL sous FICEDL et MLEG hors réseau, et sur mobile.","pt":"Verificado na tela com BLMF e BTL sob FICEDL e MLEG fora de rede, e no celular."}],"dep":{"fr":"**G8** (compléter la carte : les neuf archives NORLA) enrichit le résultat sans le conditionner. **G9** (cartographie v1.0) est gelé : ne pas l'attendre, le pas (1) lui servira. Voisin de **H6** (vocabulaires NORLA ↔ FICEDL). Le pas (2) touche une vue : relire `CREATE OR REPLACE VIEW` et ses options avant.","pt":"**G8** enriquece o resultado sem o condicionar. **G9** está congelado: não esperar por ele, o passo (1) lhe servirá. Vizinho de **H6**. O passo (2) toca uma vista: reler as opções de `CREATE OR REPLACE VIEW` antes."},"r":["supabase/migrations/20260618142238_cartography_schema.sql (colonne reseau)","docs/specs/spec-cartographie-reseau.md","src/pages/public/CatalogPage.jsx (libraryFilter, libraryShortNames, FILTER_STORAGE_KEY)","supabase/migrations/20260904150000_l_opac_par_oeuvre_se_lit_sans_session.sql (p_filters.libraries)","api.libraries_public_v1 (baseline)","src/pages/federacao/CartographyMap.jsx","docs/cartographie/carte-reseau.umap"],"verif":{"fr":"07/09 — production interrogée en lecture seule (jointure `cartography_entries` × `libraries` : trois lignes, réseaux et exemplaires ci-dessus) ; valeurs de `reseau` comptées sur `carte-reseau.umap` ; dépôt `eb790c33`.","pt":"07/09 — produção consultada em leitura (junção `cartography_entries` × `libraries`: três linhas); valores de `reseau` contados em `carte-reseau.umap`; repositório `eb790c33`."}},{"id":"H9","d":"H","p":"P1","s":"gele","e":"M","sk":["sql","front","langue"],"t":{"fr":"Ouvrir les cinq relations SKOS aux consommateurs — RPC, page-sujet, sérialiseur, trente clés i18n, d'un bloc","pt":"Abrir as cinco relações SKOS aos consumidores — RPC, página de assunto, serializador, trinta chaves i18n, num só bloco"},"v":{"fr":"**Vérifié en base et dans le dépôt le 07/09.** Le domaine de `subject_ficedl_links.match_type` porte désormais `exact`, `close`, `broad`, `narrow`, `related` (migration `20260907172508`), mais la porte est restée fermée exprès : `api.fn_subject_add_ficedl_match` n'accepte que `exact`/`close`, parce que **deux rendus sont binaires** — `src/pages/public/SubjectPage.jsx` (l. 163) affiche « exacte » pour tout ce qui n'est pas `close`, et `src/lib/skosExport.js` sérialise en `skos:exactMatch` tout ce qui n'est pas `close`, dans le Turtle et le JSON-LD publiés. Un `broad` créé aujourd'hui serait publié comme correspondance exacte.","pt":"**Verificado no banco e no repositório em 07/09.** O domínio de `subject_ficedl_links.match_type` agora carrega `exact`, `close`, `broad`, `narrow`, `related` (migração `20260907172508`), mas a porta ficou fechada de propósito: `api.fn_subject_add_ficedl_match` só aceita `exact`/`close`, porque **duas renderizações são binárias** — `src/pages/public/SubjectPage.jsx` (l. 163) mostra «exata» para tudo que não é `close`, e `src/lib/skosExport.js` serializa como `skos:exactMatch` tudo que não é `close`, no Turtle e no JSON-LD publicados. Um `broad` criado hoje seria publicado como correspondência exata."},"w":{"fr":"Étendre la garde de la RPC aux trois valeurs ; remplacer les deux ternaires par une table à cinq entrées (`skos:broadMatch`, `skos:narrowMatch`, `skos:relatedMatch`) ; ajouter trois clés `subject.matchBroad/Narrow/Related` dans les dix locales (le test i18n bloque sinon). Livrer les trois ensemble, jamais l'un sans les autres.","pt":"Estender a guarda da RPC aos três valores; substituir os dois ternários por uma tabela de cinco entradas (`skos:broadMatch`, `skos:narrowMatch`, `skos:relatedMatch`); acrescentar três chaves `subject.matchBroad/Narrow/Related` nas dez locales (o teste i18n bloqueia se faltar). Entregar os três juntos, nunca um sem os outros."},"y":{"fr":"Tant que le domaine existe en base sans consommateur capable de le dire, chaque alignement « plus large » reste tassé en `close` — une sur-affirmation publiée. Et l'ouvrir sans les rendus ferait pire : un `broad` sortirait en `exactMatch` dans un fichier que d'autres catalogues peuvent moissonner.","pt":"Enquanto o domínio existir no banco sem consumidor capaz de dizê-lo, cada alinhamento «mais amplo» continua espremido em `close` — uma sobreafirmação publicada. E abri-lo sem as renderizações seria pior: um `broad` sairia como `exactMatch` num arquivo que outros catálogos podem coletar."},"f":{"fr":["Un alignement `broad` posé depuis l'écran s'affiche « plus large » sur la page-sujet et sort en `skos:broadMatch` dans le Turtle et le JSON-LD.","`npm test` passe avec les trente clés.","La migration `20260907172508` voit son bloc de vérification 4.2 (porte fermée) retiré ou inversé le même jour."],"pt":["Um alinhamento `broad` posto pela tela aparece «mais amplo» na página de assunto e sai como `skos:broadMatch` no Turtle e no JSON-LD.","`npm test` passa com as trinta chaves.","A migração `20260907172508` tem seu bloco de verificação 4.2 (porta fechada) retirado ou invertido no mesmo dia."]},"dep":{"fr":"Gelé jusqu'au 14/09 (code de production). Précède **H10**.","pt":"Congelado até 14/09 (código de produção). Precede **H10**."},"r":["REGISTRE §0 DOC-THES-1","REGISTRE §30 THES-FIC4, THES-FIC5","claude/VERIF_subject_ficedl_links_schema_2026-09-07","migration 20260907172508"],"verif":{"fr":"07/09 — domaine étendu en base, porte fermée, deux rendus binaires constatés dans le dépôt.","pt":"07/09 — domínio estendido no banco, porta fechada, duas renderizações binárias constatadas no repositório."}},{"id":"H10","d":"H","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Relire à la main les 98 alignements FICEDL — 54 `close` dont une part sont des `broad` — et aligner enfin les quatre rubriques historiques de Solidaires","pt":"Reler à mão os 98 alinhamentos FICEDL — 54 `close` dos quais uma parte são `broad` — e alinhar enfim as quatro rubricas históricas de Solidaires"},"v":{"fr":"**Vérifié en base le 07/09.** 98 liens dans `subject_ficedl_links` : 44 `exact`, 54 `close`. Jusqu'au 07/09 le domaine n'avait que ces deux valeurs, donc tout ce qui est réellement « plus large » ou « voisin » a été tassé en `close`. Par vocabulaire visé : 72 vers la liste commune, 26 vers la géo-histo, **0 vers la facette `dates`** — les quatre rubriques historiques de Solidaires (guerres, périodes) ne sont donc toujours pas alignées, alors que les 159 dates sont en base depuis le 03/09 (H1 clos).","pt":"**Verificado no banco em 07/09.** 98 vínculos em `subject_ficedl_links`: 44 `exact`, 54 `close`. Até 07/09 o domínio só tinha esses dois valores, logo tudo que é realmente «mais amplo» ou «vizinho» foi espremido em `close`. Por vocabulário visado: 72 para a lista comum, 26 para a geo-histo, **0 para a faceta `dates`** — as quatro rubricas históricas de Solidaires (guerras, períodos) continuam, portanto, sem alinhamento, embora as 159 datas estejam no banco desde 03/09 (H1 fechado)."},"w":{"fr":"Fiche par fiche, jamais par passe automatique (`CONV-EXEC-3`) : pour chaque `close`, décider s'il reste `close` ou devient `broad`/`narrow`/`related` ; poser les alignements manquants vers la facette `dates` pour les rubriques historiques ; passer aussi les 44 alignements du lot Solidaires du 28/08.","pt":"Ficha por ficha, nunca por passagem automática (`CONV-EXEC-3`): para cada `close`, decidir se fica `close` ou vira `broad`/`narrow`/`related`; pôr os alinhamentos faltantes para a faceta `dates` nas rubricas históricas; passar também os 44 alinhamentos do lote Solidaires de 28/08."},"y":{"fr":"Un `skos:closeMatch` dit « presque le même concept ». Quand le sujet local est plus étroit, c'est faux — et c'est publié dans l'export que d'autres catalogues peuvent lire.","pt":"Um `skos:closeMatch` diz «quase o mesmo conceito». Quando o assunto local é mais estreito, é falso — e está publicado no export que outros catálogos podem ler."},"f":{"fr":["Chaque lien porte une relation choisie, pas héritée d'un domaine à deux valeurs.","Au moins un alignement vers un descripteur `dates` existe."],"pt":["Cada vínculo carrega uma relação escolhida, não herdada de um domínio de dois valores.","Existe pelo menos um alinhamento para um descritor `dates`."]},"dep":{"fr":"Après **H9** : sans les cinq valeurs ouvertes à l'écran, la relecture n'a pas d'outil pour dire ce qu'elle voit.","pt":"Depois de **H9**: sem os cinco valores abertos na tela, a releitura não tem ferramenta para dizer o que vê."},"r":["REGISTRE §30 THES-FIC4, THES-FIC-O1","claude/VERIF_subject_ficedl_links_schema_2026-09-07","CALENDRIER_bologne_2026-08-27 (rubriques historiques)"],"verif":{"fr":"07/09 — 98 liens, 54 `close`, 0 vers `dates`.","pt":"07/09 — 98 vínculos, 54 `close`, 0 para `dates`."}},{"id":"H11","d":"H","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Le dépôt dit 462 descripteurs FICEDL, la production en porte 621 — régénérer la migration de données avant qu'un rejeu depuis zéro ne casse","pt":"O repositório diz 462 descritores FICEDL, a produção carrega 621 — regenerar a migração de dados antes que um replay do zero quebre"},"v":{"fr":"**Vérifié le 07/09, dépôt et production.** `20260826191000_donnees_ficedl_thesaurus.sql` insère 462 lignes (227 sujets, 234 geo, 1 double, **0 date**) — figée sur l'aspiration du 30/06. La production porte l'aspiration du 03/09 : **621** (159 dates en plus) parce que `ficedl_thesaurus_sync.mjs` a été rejoué. Le rejeu depuis une base vide passe encore : les 47 `mot_id` référencés par la migration d'alignement sont tous dans les 462. Il cassera le jour où un alignement visera un terme postérieur au 30/06 — c'est exactement ce que **H10** va faire. Deux dates de l'aspiration (161) manquent en base (159) : sans libellé, écartées par `isSyncable`.","pt":"**Verificado em 07/09, repositório e produção.** `20260826191000_donnees_ficedl_thesaurus.sql` insere 462 linhas (227 assuntos, 234 geo, 1 dupla, **0 data**) — congelada na coleta de 30/06. A produção carrega a coleta de 03/09: **621** (159 datas a mais) porque `ficedl_thesaurus_sync.mjs` foi reexecutado. O replay a partir de um banco vazio ainda passa: os 47 `mot_id` referenciados pela migração de alinhamento estão todos nos 462. Vai quebrar no dia em que um alinhamento visar um termo posterior a 30/06 — é exatamente o que **H10** vai fazer. Duas datas da coleta (161) faltam no banco (159): sem rótulo, descartadas por `isSyncable`."},"w":{"fr":"Régénérer la migration de données depuis `docs/journal/ficedl/ficedl_thesaurus_2026-09-03.json` (ou la remplacer par un seed rejoué par le sync en CI), et regarder les deux fiches sans libellé. Ne jamais lancer le sync avec `--prune`.","pt":"Regenerar a migração de dados a partir de `docs/journal/ficedl/ficedl_thesaurus_2026-09-03.json` (ou substituí-la por um seed reexecutado pelo sync na CI), e olhar as duas fichas sem rótulo. Nunca rodar o sync com `--prune`."},"y":{"fr":"Une reconstruction depuis zéro (**A2**, la bascule **I2**) qui ne rejoue pas les données de production n'est pas une reconstruction — c'est une autre base.","pt":"Uma reconstrução do zero (**A2**, a virada **I2**) que não reexecuta os dados de produção não é uma reconstrução — é outro banco."},"f":{"fr":["`count(*)` de `ficedl_thesaurus_terms` identique en CI et en production.","Le rejeu de `sql-tests.yml` passe avec un alignement vers un descripteur `dates`."],"pt":["`count(*)` de `ficedl_thesaurus_terms` idêntico na CI e na produção.","O replay de `sql-tests.yml` passa com um alinhamento para um descritor `dates`."]},"dep":{"fr":"Avant **H10**. Conditionne **A2** et **I2**.","pt":"Antes de **H10**. Condiciona **A2** e **I2**."},"r":["REGISTRE §30 THES-FIC-O4","claude/VERIF_subject_ficedl_links_schema_2026-09-07","REPRISE_claude_code_2026-08-27 (piège --prune)"],"verif":{"fr":"07/09 — 462 au dépôt, 621 en production, rejeu encore vert.","pt":"07/09 — 462 no repositório, 621 na produção, replay ainda verde."}},{"id":"H12","d":"H","p":"P3","s":"ouvert","e":"S","sk":["aucune","collectif"],"t":{"fr":"Les listes hors thésaurus de la FICEDL — communes du Bettini, lieux d'édition du Bianco : demander l'export tel quel, jamais l'intégration","pt":"As listas fora do tesauro da FICEDL — municípios do Bettini, lugares de edição do Bianco: pedir a exportação como está, nunca a integração"},"v":{"fr":"Réponse de la source, 07/09 : deux référentiels existent hors thésaurus — les communes des biographies du *Bettini* (avec cartographie) et les lieux d'édition du *Bianco* — « pas intégrées au thésaurus, probablement trop lourd à gérer ». AnarBib n'a aucune autorité de lieux : `local_publicacao` est un champ libre (audit du 20/08 : `BELEM`), et la spec périodiques a écarté l'alignement FICEDL au motif que le thésaurus indexe des matières — vrai pour les matières, faux pour les lieux.","pt":"Resposta da fonte, 07/09: dois referenciais existem fora do tesauro — os municípios das biografias do *Bettini* (com cartografia) e os lugares de edição do *Bianco* — «não integrados ao tesauro, provavelmente pesado demais para gerir». O AnarBib não tem nenhuma autoridade de lugares: `local_publicacao` é campo livre (auditoria de 20/08: `BELEM`), e a spec de periódicos descartou o alinhamento FICEDL porque o tesauro indexa assuntos — verdade para os assuntos, falso para os lugares."},"w":{"fr":"Après Bologne, et hors de la demande du 12 (qui tient parce qu'elle demande *une* chose) : demander les deux listes comme fichiers séparés, telles qu'elles sont. Puis aligner sur un référentiel géographique existant (Wikidata, GeoNames) avec la liste du Bianco en surcouche militante — pas construire une n-ième liste de communes.","pt":"Depois de Bolonha, e fora do pedido do dia 12 (que se sustenta porque pede *uma* coisa): pedir as duas listas como arquivos separados, como estão. Depois alinhar a um referencial geográfico existente (Wikidata, GeoNames) com a lista do Bianco como sobrecamada militante — não construir mais uma lista de municípios."},"y":{"fr":"Demander l'intégration, c'est demander la charge que la source dit ne pas pouvoir porter. Une liste n'a pas besoin d'être dans le thésaurus pour être utile ; elle a besoin d'être copiable.","pt":"Pedir a integração é pedir a carga que a fonte diz não poder carregar. Uma lista não precisa estar no tesauro para ser útil; precisa ser copiável."},"f":{"fr":["Les deux listes reçues sous une forme machine-lisible, versées à `docs/journal/ficedl/`.","Une décision écrite sur l'autorité de lieux d'AnarBib."],"pt":["As duas listas recebidas em forma legível por máquina, versadas em `docs/journal/ficedl/`.","Uma decisão escrita sobre a autoridade de lugares do AnarBib."]},"dep":{"fr":"Après **K5**. Touche `spec-periodiques` et **C3** (autorités).","pt":"Depois de **K5**. Toca `spec-periodiques` e **C3** (autoridades)."},"r":["REGISTRE §30 THES-FIC-O2","claude/REPONSE_hortical_deux_thesaurus_2026-09-07","claude/spec-periodiques-v0.1 §5"]},{"id":"H13","d":"H","p":"P2","s":"a-verifier","e":"S","sk":["aucune"],"t":{"fr":"L'esquisse SKOS des 26 descripteurs n'est ni au dépôt ni au projet — la verser à `docs/journal/ficedl/` pour qu'elle soit donnable et versionnée","pt":"O esboço SKOS dos 26 descritores não está nem no repositório nem no projeto — versá-lo em `docs/journal/ficedl/` para que seja doável e versionado"},"v":{"fr":"Le dossier Bologne du 03/09 le dit : `ficedl_thesaurus_ESQUISSE.csv` et `.jsonld` « ne sont pas dans le projet », à emporter sur clé USB. **Vérifié le 07/09** : `docs/journal/ficedl/` contient les quatre aspirations et les audits, **aucun fichier `ESQUISSE`** ; le projet Claude non plus. Le racleur et le sync, eux, sont au dépôt (`scripts/ficedl_thesaurus_scrape.mjs`, `_sync.mjs`) — cette moitié-là est déjà donnable.","pt":"O dossiê de Bolonha de 03/09 diz: `ficedl_thesaurus_ESQUISSE.csv` e `.jsonld` «não estão no projeto», a levar em pendrive. **Verificado em 07/09**: `docs/journal/ficedl/` contém as quatro coletas e as auditorias, **nenhum arquivo `ESQUISSE`**; o projeto Claude tampouco. O raspador e o sync, esses, estão no repositório (`scripts/ficedl_thesaurus_scrape.mjs`, `_sync.mjs`) — essa metade já é doável."},"w":{"fr":"Retrouver les deux fichiers (Downloads ?) ou les régénérer depuis l'aspiration du 03/09, et les commiter avec la note du 28/08 à côté. Depuis le 07/09 l'esquisse est à réviser : deux `skos:ConceptScheme`, les têtes `guerres`/`art : courants` en `skos:Collection`, jamais d'URI de schéma inventé — et, depuis la note de la source sur les URL : URI canonique `https://thesaurus.ficedl.info/?motNN`, `skos:notation` = le numéro, la forme `/id/motNN` retirée.","pt":"Reencontrar os dois arquivos (Downloads?) ou regenerá-los a partir da coleta de 03/09, e commitá-los com a nota de 28/08 ao lado. Desde 07/09 o esboço está para revisar: dois `skos:ConceptScheme`, as cabeças `guerres`/`art : courants` em `skos:Collection`, nunca URI de esquema inventada — e, desde a nota da fonte sobre as URL: URI canônica `https://thesaurus.ficedl.info/?motNN`, `skos:notation` = o número, a forma `/id/motNN` retirada."},"y":{"fr":"C'est la pièce que tu poses sur la table à Bologne. Une pièce qui n'existe que sur une clé n'est pas une contribution, c'est une démonstration.","pt":"É a peça que você põe na mesa em Bolonha. Uma peça que só existe num pendrive não é contribuição, é demonstração."},"f":{"fr":["Les deux fichiers au dépôt, régénérables par une commande documentée."],"pt":["Os dois arquivos no repositório, regeneráveis por um comando documentado."]},"dep":{"fr":"Lié à **H2** et **K6**.","pt":"Ligado a **H2** e **K6**."},"r":["claude/DOSSIER_rencontre_leftovers_bologne_2026-09-12 §B.1","claude/NOTE_export_thesaurus_questions_ouvertes_2026-08-28"],"verif":{"fr":"07/09 — absents du dépôt et du projet ; leur existence sur disque n'a pas été vérifiée.","pt":"07/09 — ausentes do repositório e do projeto; sua existência em disco não foi verificada."}},{"id":"K10","d":"K","p":"P2","s":"a-verifier","e":"M","sk":["langue"],"t":{"fr":"Trois articles promis au *Monde libertaire*, un par mois — et une émission proposée à *Trous Noirs*","pt":"Três artigos prometidos ao *Monde libertaire*, um por mês — e um programa proposto à *Trous Noirs*"},"v":{"fr":"Session du 30/08 : le courriel à Monique et Serge (Radio Libertaire, *Trous Noirs*) écrit « Le Monde libertaire en publie trois articles dans les mois qui viennent, un par mois ». **Non vérifié** : ni la remise du premier article, ni l'envoi du courriel, ni la réponse. Aucun item du backlog ne portait cet engagement.","pt":"Sessão de 30/08: o e-mail a Monique e Serge (Radio Libertaire, *Trous Noirs*) escreve «Le Monde libertaire en publie trois articles dans les mois qui viennent, un par mois». **Não verificado**: nem a entrega do primeiro artigo, nem o envio do e-mail, nem a resposta. Nenhum item do backlog carregava esse compromisso."},"w":{"fr":"Dire ici où en sont les trois articles (rendu, relu, publié) et si le courriel est parti ; puis tenir le rythme — un article par mois est une dette qui se voit.","pt":"Dizer aqui onde estão os três artigos (entregue, revisto, publicado) e se o e-mail saiu; depois manter o ritmo — um artigo por mês é uma dívida que se vê."},"y":{"fr":"Une promesse faite à un journal militant engage le projet autant qu'un déploiement : elle se lit dans les numéros où l'article manque.","pt":"Uma promessa feita a um jornal militante compromete o projeto tanto quanto um deploy: lê-se nos números em que o artigo falta."},"f":{"fr":["Trois dates de parution, ou une renégociation écrite du rythme."],"pt":["Três datas de publicação, ou uma renegociação escrita do ritmo."]},"dep":{"fr":"Voisin de **K5** ; sans dépendance technique.","pt":"Vizinho de **K5**; sem dependência técnica."},"r":["session Cowork « Monde libertaire article publication », 30/08/2026"],"verif":{"fr":"07/09 — engagement relevé dans une session, aucune trace de suivi ailleurs.","pt":"07/09 — compromisso encontrado numa sessão, nenhum rastro de acompanhamento em outro lugar."}},{"id":"I21","d":"I","p":"P1","s":"ouvert","e":"M","sk":["sysadmin","collectif"],"t":{"fr":"Ce qui doit être vrai avant la bascule chez Les Herbes Folles, et ne l'est pas encore — huit conditions, aucune technique difficile","pt":"O que deve ser verdade antes da virada para Les Herbes Folles, e ainda não é — oito condições, nenhuma tecnicamente difícil"},"v":{"fr":"La décision du 07/09 (offre confirmée : VM IPv4, Debian, sauvegardes déjà chez eux) et la note du 05-06/09 laissent une liste que rien ne tient ensemble. **Vérifié le 07/09 dans `deploy/`** : aucune trace d'`unattended-upgrades`, de pare-feu ni d'authentification par clé seule. Le reste est humain ou local : la connexion authentifiée sur la pile locale jamais retestée depuis le retrait de Turnstile ; `deploy/.env` écrasé par `install.sh` (domaines sur `localhost`) sans copie connue ; l'essai depuis un réseau mobile brésilien (NAT64) jamais fait ; le délai d'intervention des Herbes Folles jamais demandé ; le moyen de leur verser de l'argent « demandé depuis juillet, sans réponse » ; un second détenteur des accès ; et la règle posée le 07/09 : **on ne bascule pas avant que la sauvegarde soit partie chez un tiers** — aujourd'hui les trois flux restic sont chez l'hébergeur de destination lui-même.","pt":"A decisão de 07/09 (oferta confirmada: VM IPv4, Debian, backups já lá) e a nota de 05-06/09 deixam uma lista que nada mantém junta. **Verificado em 07/09 em `deploy/`**: nenhum rastro de `unattended-upgrades`, firewall nem autenticação só por chave. O resto é humano ou local: a conexão autenticada na pilha local nunca retestada desde a retirada do Turnstile; `deploy/.env` sobrescrito por `install.sh` (domínios em `localhost`) sem cópia conhecida; o teste a partir de uma rede móvel brasileira (NAT64) nunca feito; o prazo de intervenção de Les Herbes Folles nunca pedido; o meio de lhes pagar «pedido desde julho, sem resposta»; um segundo detentor dos acessos; e a regra posta em 07/09: **não se vira antes que o backup tenha ido para um terceiro** — hoje os três fluxos restic estão no próprio hospedeiro de destino."},"w":{"fr":"Tenir la liste ici, cocher chaque condition avec sa preuve (fichier, courriel, essai daté). Le durcissement entre dans `deploy/` ; le dépôt de sauvegarde tiers se demande à Bologne (**I12** dit ce que le miroir froid couvre, et ce n'est pas ça).","pt":"Manter a lista aqui, marcar cada condição com sua prova (arquivo, e-mail, teste datado). O endurecimento entra em `deploy/`; o depósito de backup terceiro pede-se em Bolonha (**I12** diz o que o espelho frio cobre, e não é isso)."},"y":{"fr":"Chacune de ces conditions est petite. Ensemble, c'est la différence entre une bascule et un déménagement de la fragilité.","pt":"Cada condição é pequena. Juntas, são a diferença entre uma virada e uma mudança de endereço da fragilidade."},"f":{"fr":["Les huit conditions cochées avec preuve, dans cet item.","`deploy/` porte le durcissement, rejoué par `bootstrap.sh`."],"pt":["As oito condições marcadas com prova, neste item.","`deploy/` carrega o endurecimento, reexecutado por `bootstrap.sh`."]},"dep":{"fr":"Bloque **I2**. Le dépôt tiers et le second détenteur relèvent de la même conversation que **A1** (Bologne).","pt":"Bloqueia **I2**. O depósito terceiro e o segundo detentor pertencem à mesma conversa que **A1** (Bolonha)."},"r":["claude/DECISION_herbesfolles_offre_confirmee_2026-09-07","claude/NOTE_sortie_services_etats_uniens_2026-09-05","claude/REPRISE_claude_code_PR28_revoke_anon_2026-09-06 (deploy/.env)"],"verif":[{"fr":"07/09 — `deploy/` sans durcissement ; les sept autres conditions non vérifiables depuis la base.","pt":"07/09 — `deploy/` sem endurecimento; as outras sete condições não verificáveis a partir do banco."},{"fr":"17/09 — **I16 y verse une condition** : `install.sh` (PR #28) exécuté une fois sur une machine vierge qui n'est pas celle de son auteur, écarts consignés — l'épreuve que la pile n'a pas encore passée hors de chez le camarade (avec le routeur `main`, I3, et le rejeu CI sur l'image Supabase, I18).","pt":"17/09 — **I16 verte aqui uma condição**: `install.sh` (PR #28) executado uma vez numa máquina virgem que não é a do seu autor, desvios registados — a prova que a pilha ainda não passou fora da casa do companheiro (com o router `main`, I3, e a reprodução CI na imagem Supabase, I18)."},{"fr":"21/09 — **une affirmation du constat tombe, relue sur pièces.** La fiche dit « la connexion authentifiée sur la pile locale jamais retestée depuis le retrait de Turnstile ». C'était déjà faux le 07/09, jour où elle a été écrite : `journal/operations/NOTE_bootstrap-premiere-execution_2026-08-26` §5 décrit l'essai fait le 26/08, après le retrait de Turnstile (AR-2/AR-3) — compte créé par l'API admin, connexion directe GoTrue, **connexion par l'Edge Function `login` : HTTP 200, jeton émis**, zéro appel à `challenges.cloudflare.com`. La rédaction du 07/09 n'avait pas ouvert cette note. **Refait le 21/09** sur une pile reconstruite par `bootstrap.sh --depuis-le-depot --sel-jetable` aux pins remesurés ce jour (GoTrue v2.197.0, Storage v1.72.0) : création 200, GoTrue direct 200, `login` 200 avec jeton, mauvais mot de passe 401, le jeton lit `rest/v1/libraries` en 200, zéro occurrence de « cloudflare » ou « turnstile » dans les journaux des six conteneurs (`journal/operations/NOTE_pins-images-remesures_2026-09-21` §4). Cette condition-là est donc **tenue, avec preuve datée** ; ce qu'elle ne couvre pas : un navigateur réel devant le front reconstruit, et un compte revenu d'un dump de production. Les sept autres conditions sont inchangées.","pt":"21/09 — **uma afirmação do constato cai, relida sobre peças.** A ficha diz « a conexão autenticada na pilha local nunca retestada desde a retirada do Turnstile ». Já era falso em 07/09, dia em que foi escrita: `journal/operations/NOTE_bootstrap-premiere-execution_2026-08-26` §5 descreve o ensaio feito em 26/08, depois da retirada do Turnstile (AR-2/AR-3) — conta criada pela API admin, conexão direta ao GoTrue, **conexão pela Edge Function `login`: HTTP 200, token emitido**, zero chamadas a `challenges.cloudflare.com`. A redação de 07/09 não tinha aberto essa nota. **Refeito em 21/09** numa pilha reconstruída por `bootstrap.sh --depuis-le-depot --sel-jetable` com os pins remedidos nesse dia (GoTrue v2.197.0, Storage v1.72.0): criação 200, GoTrue direto 200, `login` 200 com token, senha errada 401, o token lê `rest/v1/libraries` em 200, zero ocorrências de « cloudflare » ou « turnstile » nos diários dos seis contêineres (`journal/operations/NOTE_pins-images-remesures_2026-09-21` §4). Essa condição está portanto **cumprida, com prova datada**; o que ela não cobre: um navegador real diante do front reconstruído, e uma conta vinda de um dump de produção. As outras sete condições não mudam."}]},{"id":"I22","d":"I","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Trancher `DOC-DEPLOY-1` après l'écart du 07/09 : tolérer et tracer, ou interdire et contrôler","pt":"Decidir `DOC-DEPLOY-1` após o desvio de 07/09: tolerar e rastrear, ou proibir e controlar"},"v":{"fr":"Le 07/09, la migration `20260907172508` a été appliquée en production par `apply_migration` (MCP) — ce que `DOC-DEPLOY-1` interdit en toutes lettres. Écart constaté après coup, tracé au REGISTRE §30, rattrapé sans double application (fichier renommé sur l'horodatage enregistré dans `supabase_migrations.schema_migrations`). Le registre laisse la question ouverte et rappelle que, tant qu'elle l'est, **la règle écrite vaut**.","pt":"Em 07/09, a migração `20260907172508` foi aplicada em produção por `apply_migration` (MCP) — o que `DOC-DEPLOY-1` proíbe com todas as letras. Desvio constatado depois, rastreado no REGISTRE §30, recuperado sem dupla aplicação (arquivo renomeado com o timestamp registrado em `supabase_migrations.schema_migrations`). O registro deixa a questão aberta e lembra que, enquanto estiver, **a regra escrita vale**."},"w":{"fr":"Deux issues, une ligne au registre chacune : tolérer à titre exceptionnel et tracé, sur le modèle de `DOC-DEPLOY-3` — ou réaffirmer l'interdiction et poser le contrôle qui la rend vérifiable : une version présente dans `supabase_migrations.schema_migrations` dont le fichier n'est pas au dépôt est la signature exacte de l'écart (une requête, jouable en CI).","pt":"Duas saídas, uma linha no registro cada: tolerar em caráter excepcional e rastreado, no modelo de `DOC-DEPLOY-3` — ou reafirmar a proibição e pôr o controle que a torna verificável: uma versão presente em `supabase_migrations.schema_migrations` cujo arquivo não está no repositório é a assinatura exata do desvio (uma consulta, executável na CI)."},"y":{"fr":"Une règle enfreinte sans suite devient une règle décorative. La suite peut être une exception écrite ; ce ne peut pas être le silence.","pt":"Uma regra infringida sem consequência vira regra decorativa. A consequência pode ser uma exceção escrita; não pode ser o silêncio."},"f":{"fr":["La ligne `DOC-DEPLOY-1` du registre ne porte plus le ⚠️ du 07/09."],"pt":["A linha `DOC-DEPLOY-1` do registro não carrega mais o ⚠️ de 07/09."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["REGISTRE §0 DOC-DEPLOY-1","REGISTRE §30 (écart tracé)","claude/VERIF_subject_ficedl_links_schema_2026-09-07 §4"]},{"id":"I24","d":"I","p":"P1","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Le flux de sauvegarde `storage` est tué quand la session WSL s'arrête, et son alerte `OnFailure` ne part pas","pt":"O fluxo de backup `storage` é morto quando a sessão WSL para, e o seu alerta `OnFailure` não parte"},"v":{"fr":"**Constaté le 15/09/2026 au retour de Bologne.** Le dimanche 13/09, le poste était éteint : les minuteurs hebdomadaires `long` (20 h) et `storage` (21 h) n'ont pas tourné. Le 15/09 à 08 h 15, au démarrage, systemd a rattrapé les trois (`Persistent=`) : `court` fini à 08 h 17, `long` à 08 h 20 (instantané `da135422`), **`storage` tué à 08 h 23 par `SIGTERM`** (« Failed with result 'signal' »), après quatre buckets sur seize — c'est l'arrêt de la session utilisateur WSL, qui rebondit sur ce poste (mémoire `anarbib-systemd-etat-non-fiable`), qui a emporté le service. Et la ligne suivante du journal : **« Failed to enqueue OnFailure=anarbib-backup-failure@… »** — l'unité d'alerte n'a pas pu être lancée, la session s'arrêtant. Résultat : un flux `storage` vieux de neuf jours (dernier instantané le 06/09 21 h 19, seuil de fraîcheur 216 h atteint le 15/09 à 21 h 20), un témoin `started` sans `ok` (`fn_backup_heartbeat_status` : « tir commencé et JAMAIS TERMINÉ, tué en route »), et **aucun courriel**. Relancé à la main le 15/09 à 20 h 50 (`systemctl --user start anarbib-backup-storage.service`).","pt":"**Constatado em 15/09/2026 ao voltar de Bolonha.** Domingo 13/09 o posto estava desligado ; em 15/09 às 08h15 o systemd recuperou os três fluxos : `court` e `long` terminaram, **`storage` foi morto às 08h23 por `SIGTERM`** — o encerramento da sessão WSL — e a unidade de alerta `OnFailure` **não pôde ser lançada**. Resultado : fluxo `storage` com nove dias, testemunho `started` sem `ok`, nenhum e-mail. Relançado à mão às 20h50."},"w":{"fr":"Deux choses. **(1)** Le service `storage` ne doit pas mourir avec la session : `KillMode=` et `TimeoutStopSec=` à régler, ou mieux, le lancer sous `systemd-run --scope` détaché, ou enfin `loginctl enable-linger` pour que la session utilisateur ne s'arrête pas avec le terminal — vérifier lequel tient sur ce WSL, où `systemctl` ment (juger sur `journalctl`). **(2)** L'alerte ne doit pas dépendre de la session qui meurt : le contrôle de fraîcheur du midi (`anarbib-fraicheur.timer`, lecture seule des dépôts restic) doit **envoyer** quand un flux dépasse son seuil ou porte un `started` sans `ok`, pas seulement l'écrire au journal. Le témoin en base (`fn_backup_heartbeat_status`) sait déjà dire « interrompu » : lui donner un destinataire (`HEALTH_ALERT_CC`, mémoire `anarbib-alertes-supervision-destinataires`).","pt":"**(1)** O serviço `storage` não deve morrer com a sessão (`KillMode=`, `TimeoutStopSec=`, ou `loginctl enable-linger`). **(2)** O alerta não deve depender da sessão : o controlo de frescura do meio-dia deve **enviar** quando um fluxo passa o limiar ou tem um `started` sem `ok`."},"y":{"fr":"Une sauvegarde qui saute en silence quand le poste redémarre est exactement la panne qu'on ne voit qu'en reprise après sinistre — et le poste redémarre souvent. Le flux `storage` est **la seule sauvegarde des 16 buckets** (BG2-8) : neuf jours de trou, ce sont neuf jours de couvertures, de PDF et de règlements perdus si le Storage tombe.","pt":"Um backup que falha em silêncio quando o posto reinicia é a avaria que só se vê na recuperação. O fluxo `storage` é **o único backup dos 16 buckets**."},"f":{"fr":["Le service `storage` survit à la fermeture du terminal WSL : éprouvé en fermant la session pendant un tir.","Un flux en dépassement de seuil ou « interrompu » produit un courriel à `admins@anarbib.org` dans les 24 h, sans qu'aucun humain regarde le journal.","Le 13/09 ne se reproduit pas : un poste éteint le dimanche donne trois flux verts le lundi matin, ou un courriel."],"pt":["O serviço `storage` sobrevive ao fecho do terminal WSL.","Um fluxo em atraso ou «interrompido» produz um e-mail em 24 h.","Um posto desligado ao domingo dá três fluxos verdes na segunda, ou um e-mail."]},"dep":{"fr":"Cousin de **I12** (le `die` du miroir sans destinataire) : même cause, l'alerte n'a pas de chemin qui survive au poste. Lié à **A3** (tout tourne sur la machine du mainteneur).","pt":"Primo de **I12**. Ligado a **A3**."},"r":["deploy/ops/systemd/","anarbib-systemd-etat-non-fiable","anarbib-backup-stale-lock-selfheal","RUNBOOK_restauration_BG2_2026-07-01"],"verif":[{"fr":"15/09 — journal `journalctl --user -u anarbib-backup-storage.service` : `Main process exited, code=killed, status=15/TERM` à 08:23:45, « Failed to enqueue OnFailure » ; `fn_backup_heartbeat_status` : `storage` `interrompu = true`, `muet = true`, 215,5 h. Relance manuelle à 20 h 50, en cours au moment du relevé. **21 h 05** — la relance manuelle a abouti : seize buckets resynchronisés, instantané `daafc96b`, témoin de vie envoyé, rétention 7/4/6 appliquée (l’instantané du 09/08 sorti). Le flux `storage` est de nouveau attesté ; le trou va du 06/09 21 h 19 au 15/09 21 h 05.","pt":"15/09 — journal : morto por SIGTERM às 08:23:45, `OnFailure` não enfileirado ; `storage` interrompido, 215,5 h. Relançado às 20h50. **21h05** — o relançamento manual terminou : dezassei
