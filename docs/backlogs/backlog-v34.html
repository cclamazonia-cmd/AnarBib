s buckets, instantâneo `daafc96b`, testemunho enviado. O buraco vai de 06/09 a 15/09."},{"fr":"16/09 — **I12 y est versé** : le `die` du script du miroir froid (`anarbib-mirror-refresh.service`) doit avoir le même destinataire que le contrôle de fraîcheur, et la date du dernier rafraîchissement du miroir s'écrire là où le témoin la lira. Une seule alerte à faire survivre au poste, pour les trois flux restic et le miroir.","pt":"16/09 — **I12 é aqui vertido**: o `die` do script do espelho frio deve ter o mesmo destinatário que o controlo de frescura, e a data da última atualização do espelho escrever-se onde o testemunho a lerá. Um só alerta a fazer sobreviver ao posto, para os três fluxos restic e o espelho."},{"fr":"20/09 — **relu sur pièces, et deux affirmations de la fiche tombent.** *(a) « Aucun courriel » était faux.* `service_health_incidents` porte l'incident 12 : `backup` / `storage`, ouvert le 15/09 à 09 h 20, **`notified_at` 09 h 20**, raison « tir commencé il y a 1.1 h et JAMAIS TERMINÉ (tué en route) », clos à 21 h 10 après la relance ; et l'incident 10 : `court` muet depuis 36 h, ouvert et notifié le 12/09 à 07 h 55 (poste éteint pendant Bologne). La sonde serveur `health-probe` a donc vu les deux pannes dans l'heure. La rédaction du 15/09 avait déduit « aucun courriel » de la seule ligne locale « Failed to enqueue OnFailure », sans lire cette table. Réserve : `notified_at` atteste que la sonde a marqué l'envoi, pas que le message est arrivé — à confirmer par Xavier. *(b) Les trois remèdes du « comment » ne tiennent pas.* `enable-linger` est actif depuis le **01/07/2026** (`/var/lib/systemd/linger/accattone`) : il l'était le 15/09 et n'a rien empêché. C'est le gestionnaire systemd utilisateur lui-même qui sort (`exit.target` 24 s après `Startup finished` le 15/09 à 08 h 12) : 52 démarrages depuis le 01/09, dont 27 le 17/09 ; aucun `KillMode` ni `scope` ne survit à son gestionnaire. Cause des arrêts : **non établie**. Ce qui tient : le rattrapage `Persistent=`. *(c) Côté poste, rien n'envoie* : `anarbib-notify-failure.sh` (11 lignes) écrit `~/anarbib-ops/.last-failure`, la fraîcheur écrit un drapeau lu par `.bashrc`, et `SuccessExitStatus=1 3` fait de ses alertes des succès pour systemd. C'est décoratif tant qu'on n'ouvre pas un terminal — mais la sonde serveur couvre « muet » et « interrompu ». Reste réel : le seuil de `storage` et `long` est de 216 h, un dimanche manqué n'alerte que neuf jours après le dernier bon tir. Les unités du poste sont des liens vers `~/anarbib/deploy/ops/systemd/` : un commit qui les touche, puis un alignement de WSL, modifie les unités en service.","pt":"20/09 — **relido sobre peças, e duas afirmações da ficha caem.** *(a) « Nenhum e-mail » era falso.* `service_health_incidents` tem o incidente 12: `backup` / `storage`, aberto em 15/09 às 09h20, **`notified_at` 09h20**, razão « tiro começado há 1.1 h e NUNCA TERMINADO », fechado às 21h10; e o incidente 10: `court` mudo há 36 h, aberto e notificado em 12/09 às 07h55. A sonda do servidor viu as duas avarias dentro da hora. Reserva: `notified_at` atesta que a sonda marcou o envio, não que a mensagem chegou — a confirmar por Xavier. *(b) Os três remédios não se aguentam.* `enable-linger` está ativo desde **01/07/2026**; é o próprio gestor systemd do utilizador que sai (52 arranques desde 01/09, 27 em 17/09). Causa: **não estabelecida**. O que se aguenta: a recuperação `Persistent=`. *(c) Do lado do posto, nada envia*: os dois scripts escrevem ficheiros-bandeira. A sonda do servidor cobre « mudo » e « interrompido ». Resta real: o limiar de `storage` e `long` é de 216 h. As unidades do posto são ligações para `~/anarbib/deploy/ops/systemd/`."},{"fr":"20/09, second passage — **Xavier confirme avoir reçu les deux alertes de sauvegarde** : « AnarBib — les sauvegardes ne donnent plus signe de vie » (12/09, `court` muet, incident 10) et « AnarBib — une sauvegarde a commencé et ne s'est jamais terminée » (15/09, `storage`, incident 12). Le second « fini quand » de la fiche — un courriel aux admins dans les 24 h sans qu'un humain regarde le journal — est donc tenu par `health-probe`, et l'a été les deux fois dans l'heure. **Correction de l'annotation précédente** : elle disait que `notified_at` « atteste que la sonde a marqué l'envoi ». Lu dans `health-probe/index.ts` (l. 423 et 462-468) : `notified_at` est posé dès qu'`alerter()` rend la main ; `alerter()` renvoie le nombre de destinataires visés, pas le nombre d'envois réussis, et ce nombre n'est pas regardé. `notified_at` prouve une **tentative**, pas un envoi ; ici c'est la boîte de Xavier qui fait preuve. À retenir si un jour une alerte manque : ne pas conclure de `notified_at`. **Ce qu'il reste réellement de l'item** : *(1)* le gestionnaire systemd utilisateur sort sans cause établie (52 démarrages depuis le 01/09) et emporte le tir en cours — aucun des trois remèdes de la fiche ne s'y applique, le rattrapage `Persistent=` tient ; *(2)* côté poste, `OnFailure` et la fraîcheur n'écrivent que des fichiers drapeaux ; *(3)* le seuil de `long` et `storage` est de 216 h. Le premier « fini quand » (fermer la session pendant un tir) ne peut être éprouvé que par Xavier. Item laissé ouvert : à requalifier par lui.","pt":"20/09, segunda passagem — **Xavier confirma ter recebido os dois alertas de backup**: « AnarBib — les sauvegardes ne donnent plus signe de vie » (12/09, `court` mudo, incidente 10) e « AnarBib — une sauvegarde a commencé et ne s'est jamais terminée » (15/09, `storage`, incidente 12). O segundo « acabado quando » da ficha — um e-mail às admins em 24 h sem que um humano olhe o diário — está portanto cumprido por `health-probe`, e foi-o das duas vezes dentro da hora. **Correção da anotação anterior**: dizia que `notified_at` « atesta que a sonda marcou o envio ». Lido em `health-probe/index.ts` (l. 423 e 462-468): `notified_at` é posto assim que `alerter()` devolve; `alerter()` devolve o número de destinatários visados, não o de envios bem-sucedidos, e esse número não é verificado. `notified_at` prova uma **tentativa**, não um envio; aqui é a caixa de Xavier que faz prova. **O que resta realmente do item**: *(1)* o gestor systemd do utilizador sai sem causa estabelecida (52 arranques desde 01/09) e leva o tiro em curso — a recuperação `Persistent=` aguenta; *(2)* do lado do posto, `OnFailure` e a frescura só escrevem ficheiros-bandeira; *(3)* o limiar de `long` e `storage` é de 216 h. O primeiro « acabado quando » só pode ser provado por Xavier. Item deixado aberto: a requalificar por ele."},{"fr":"21/09 — les trois flux du dimanche 20/09 sont attestés par les témoins en base (`fn_backup_heartbeat_status`) : `court` parti à 19 h 00 (instantané `47b476f1`), `long` à 20 h 01 (`6e05608e`), et **`storage`, celui qui avait été tué le 15/09, parti à 21 h 01 et terminé à 21 h 21 (`38035670`)** — premier passage hebdomadaire complet depuis l'incident. Rien n'a été changé aux unités : le passage a tenu parce que la session WSL a tenu. Les trois restes de la fiche (gestionnaire systemd qui sort, drapeaux locaux muets, seuil de 216 h) sont inchangés.","pt":"21/09 — os três fluxos de domingo 20/09 estão atestados na base: `court` às 19h00, `long` às 20h01, e **`storage`, o que tinha sido morto em 15/09, saiu às 21h01 e terminou às 21h21 (`38035670`)**. Nada foi alterado nas unidades; os três restos da ficha mantêm-se."}]},{"id":"I25","d":"I","p":"P3","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Le filet des suites SQL a rendu FAIL sur une suite verte — une fois, sans cause trouvée","pt":"A rede das suítes SQL deu FAIL numa suíte verde — uma vez, sem causa encontrada"},"v":{"fr":"Le 16/09 (run 7092391, commit `d5228c7f`), `sql-tests` est rouge sur la seule `paquet19_loan_wrappers_tests.sql`, dont le bilan dit « LOAN-WRAPPERS OK : 46/46 tests passes ». Le filet de `scripts/ci/run-sql-suites.sh` (`echo \"$out\" | grep -qE ' OK : [0-9]+/[0-9]+'`, sous `set -uo pipefail`) a rendu FAIL sur ce texte. Rejoué à l'octet près hors CI (bash 5.3/grep 3.12 dans WSL ; bash 5.2/grep 3.8 dans l'image `node:22` de la CI ; sortie de 314 Ko en variante) : PASS à chaque fois. Le journal du run ne porte aucune anomalie (fork, mémoire, message de bash) ; la suite n'a pas changé depuis le 02/09 et n'imprime que quatre lignes par construction (aucun `RAISE NOTICE`). Relancé par Xavier : vert à 22 h 05. Un aléa, donc, et un aléa qui rougit pour rien coûte une relance et un ticket ; l'inverse (un vert pour rien) serait pire, et rien ne dit qu'il est impossible.","pt":"Em 16/09 (run 7092391, `d5228c7f`), `sql-tests` ficou vermelho só em `paquet19_loan_wrappers_tests.sql`, cujo balanço diz « OK : 46/46 ». A rede de `run-sql-suites.sh` (`grep -qE` sob `pipefail`) deu FAIL nesse texto. Reproduzido byte a byte fora da CI (WSL e imagem `node:22`): PASS sempre. Nenhuma anomalia no log; suíte inalterada desde 02/09, quatro linhas por construção. Relançado por Xavier: verde às 22h05. Um acaso — e um acaso que dá vermelho custa um relance e um ticket; o inverso seria pior."},"w":{"fr":"Ne pas chercher dans la suite. Instrumenter le filet : écrire `$out` dans un fichier, tester avec `grep -c` sur le fichier (pas de tube, donc pas de `pipefail` ni de SIGPIPE possibles), et sur FAIL imprimer le code de retour de chaque maillon (`PIPESTATUS`) et `wc -c` de la sortie. Si le rouge revient, le journal dira lequel des maillons a menti ; s'il ne revient jamais, l'instrumentation reste sans coût.","pt":"Não procurar na suíte. Instrumentar a rede: gravar `$out` em ficheiro, testar com `grep -c` no ficheiro (sem tubo, logo sem `pipefail` nem SIGPIPE), e em FAIL imprimir `PIPESTATUS` e `wc -c`. Se voltar, o log dirá qual elo mentiu."},"y":{"fr":"Une CI qui rougit sans cause érode la confiance qu'on lui doit : à la troisième fausse alerte on relance sans lire, et la vraie passe. DOC-SILENCE-1 vaut aussi pour le dispositif qui mesure.","pt":"Uma CI que fica vermelha sem causa corrói a confiança: na terceira falsa alerta relança-se sem ler, e a verdadeira passa."},"f":{"fr":["Le filet lit la sortie depuis un fichier, sans tube, et un FAIL imprime `PIPESTATUS` et la taille de la sortie.","Soit le rouge est revenu et le journal a nommé la cause, soit trois mois sans récidive."],"pt":["A rede lê a saída de um ficheiro, sem tubo, e um FAIL imprime `PIPESTATUS` e o tamanho da saída.","Ou o vermelho voltou e o log nomeou a causa, ou três meses sem recidiva."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["scripts/ci/run-sql-suites.sh",".forgejo/workflows/sql-tests.yml","REGISTRE §0 DOC-SILENCE-1","REGISTRE §0 OPS-8"],"verif":{"fr":"16/09 — journal du run 7092391 lu en entier (`sql-tests-sql-tests-9589171.log`), filet rejoué hors CI dans deux environnements, ticket #17 refermé au vert de la relance.","pt":"16/09 — log do run 7092391 lido por inteiro, rede reproduzida fora da CI em dois ambientes, ticket #17 fechado no verde do relance."}},{"id":"F10","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno","collectif"],"t":{"fr":"Sortir de Resend : un relais militant à demander, un transport à écrire, l'aiguillage à rétablir — et `sendViaBrevo` traîne encore dans `email.ts`","pt":"Sair do Resend: um relay militante a pedir, um transporte a escrever, o roteamento a restabelecer — e `sendViaBrevo` ainda está em `email.ts`"},"v":{"fr":"**Vérifié dans le dépôt le 07/09** : `supabase/functions/_shared/transport/email.ts` connaît deux transports, `sendViaResend` et `sendViaBrevo` — le second survit au retrait de Brevo (R.6/R.7, annoncé clos). Aucun transport SMTP générique, donc aucun moyen de brancher un relais militant (ARN, Nodo50, bida.im) le jour où l'un dit oui. La note du 05-06/09 place cette sortie après Bologne, derrière la demande d'un relais SMTP le 12.","pt":"**Verificado no repositório em 07/09**: `supabase/functions/_shared/transport/email.ts` conhece dois transportes, `sendViaResend` e `sendViaBrevo` — o segundo sobrevive à retirada do Brevo (R.6/R.7, anunciado fechado). Nenhum transporte SMTP genérico, logo nenhum meio de ligar um relay militante (ARN, Nodo50, bida.im) no dia em que um disser sim. A nota de 05-06/09 põe essa saída depois de Bolonha, atrás do pedido de um relay SMTP no dia 12."},"w":{"fr":"Demander avant de choisir (les relais militants d'abord, Scaleway en repli) ; écrire `sendViaSmtp` (ou le transport retenu) et rétablir un aiguillage par variable ; supprimer `sendViaBrevo` ; ne faire lever que ce qui doit lever (**F7** est clos là-dessus).","pt":"Pedir antes de escolher (os relays militantes primeiro, Scaleway como recuo); escrever `sendViaSmtp` (ou o transporte escolhido) e restabelecer um roteamento por variável; remover `sendViaBrevo`; só levantar erro onde deve (**F7** está fechado nisso)."},"y":{"fr":"Resend est le dernier service états-unien après Supabase. Sortir de l'un sans l'autre laisse la moitié de la dépendance, et la moitié la plus bavarde : le courriel des lectrices.","pt":"O Resend é o último serviço estadunidense depois do Supabase. Sair de um sem o outro deixa metade da dependência, e a metade mais falante: o e-mail das leitoras."},"f":{"fr":["Un courriel réel part par le nouveau transport, depuis la production, vers une boîte tierce.","`sendViaBrevo` n'existe plus dans le dépôt."],"pt":["Um e-mail real sai pelo novo transporte, da produção, para uma caixa terceira.","`sendViaBrevo` não existe mais no repositório."]},"dep":{"fr":"Après **K5** (relais demandé à Bologne). Pas avant **I2** : changer de transport et d'hébergeur la même semaine, c'est deux inconnues.","pt":"Depois de **K5** (relay pedido em Bolonha). Não antes de **I2**: mudar de transporte e de hospedeiro na mesma semana são duas incógnitas."},"r":["claude/NOTE_sortie_services_etats_uniens_2026-09-05 (chemin, étape 4)","spec-migration-mail-resend"],"verif":{"fr":"07/09 — deux transports dans `email.ts`, aucun SMTP.","pt":"07/09 — dois transportes em `email.ts`, nenhum SMTP."}},{"id":"F11","d":"F","p":"P2","s":"a-verifier","e":"M","sk":["deno"],"t":{"fr":"Blanc sur blanc : des blocs de nos courriels sont illisibles dans un client en thème sombre","pt":"Branco sobre branco: blocos dos nossos e-mails ficam ilegíveis num cliente em tema escuro"},"v":{"fr":"**Constaté par Xavier le 21/09/2026** sur le premier courriel réel de la sonde `images_pins` : le bilan JSON était **blanc sur blanc**. Cause : le `<pre>` fixait un fond clair (`#f4f4f4`) sans fixer la couleur du texte ; un client en thème sombre passe le texte en blanc et garde le fond. **Ce bloc-là est corrigé** (commit `6320a00d`, couleur et bordure posées) — mais il n'était pas seul. *Mesuré le même soir dans `supabase/functions/`* : sur **48** styles en ligne qui fixent un fond, **27 ne fixent pas la couleur du texte**, dans onze fichiers — `notify-network-weekly-report` (4), `notify-rede-digest`, `notify-library-request`, `notify-weekly-report`, `_shared/domain/reader-message.ts` et **le gabarit commun `_shared/mail/layout.ts`** (3 chacun), `register`, `request-password-reset`, `notify-mid-loan-reading` (2), `notify-library-invitation`, `notify-document-permission-request` (1). Et aucun gabarit ne déclare `color-scheme` ni `prefers-color-scheme` (0 occurrence) : chaque client décide seul de ce qu'il inverse. Parmi ces courriels, ceux de l'inscription et de la réinitialisation du mot de passe — les premiers qu'une personne reçoit.","pt":"**Constatado por Xavier em 21/09/2026** no primeiro e-mail real da sonda `images_pins`: o balanço JSON estava **branco sobre branco**. Causa: o `<pre>` fixava um fundo claro sem fixar a cor do texto. **Esse bloco está corrigido** (commit `6320a00d`) — mas não era o único. *Medido na mesma noite em `supabase/functions/`*: em **48** estilos em linha que fixam um fundo, **27 não fixam a cor do texto**, em onze ficheiros, entre eles **o gabarito comum `_shared/mail/layout.ts`**, `register` e `request-password-reset`. E nenhum gabarito declara `color-scheme` (0 ocorrências)."},"w":{"fr":"**Pour clore — un seul geste, à Xavier, sans code** : ouvrir un courriel de chaque famille dans un vrai client (Proton, Thunderbird, Gmail mobile), en thème sombre et en thème clair, et dire s'il se lit ; une capture par famille versée ici suffit. Les deux autres gestes sont faits le 22/09 (voir la vérification) : la règle « tout fond porte sa couleur » est tenue par `src/tests/mails-fond-et-couleur.test.js`, et le choix — courriels sombres par conception, déclarés `color-scheme: dark` — est au REGISTRE (`MAIL-Q7`). Le prochain courriel réel (rappel d'échéance, alerte) peut servir d'épreuve : pas besoin d'en provoquer un.","pt":"**Para fechar — um só gesto, de Xavier, sem código**: abrir um e-mail de cada família num cliente real (Proton, Thunderbird, Gmail móvel), em tema escuro e claro, e dizer se se lê; uma captura por família aqui basta. Os outros dois gestos estão feitos em 22/09: a regra « todo o fundo tem a sua cor » é garantida por `src/tests/mails-fond-et-couleur.test.js`, e a escolha — e-mails escuros por desenho, declarados `color-scheme: dark` — está no REGISTRE (`MAIL-Q7`). O próximo e-mail real pode servir de prova."},"y":{"fr":"Un courriel qu'on ne peut pas lire est un courriel qui n'est pas parti. Ici c'était une alerte d'exploitation, lue par la seule personne qui pouvait agir ; ailleurs ce sont des rappels d'échéance et des liens d'inscription, reçus par des lectrices qui n'écriront pas pour dire qu'elles n'ont rien vu.","pt":"Um e-mail que não se pode ler é um e-mail que não partiu. Aqui era um alerta de exploração; noutros sítios são lembretes e links de inscrição, recebidos por leitoras que não escreverão a dizer que nada viram."},"f":{"fr":["Plus aucun style en ligne ne fixe un fond sans fixer la couleur du texte, et une garde le tient.","Le choix clair imposé / thème sombre est écrit au REGISTRE et posé dans `layout.ts`.","Un courriel de chaque famille a été regardé dans un client en thème sombre, captures versées."],"pt":["Nenhum estilo em linha fixa um fundo sem fixar a cor do texto, e uma guarda garante-o.","A escolha claro imposto / tema escuro está escrita no REGISTRE e posta em `layout.ts`.","Um e-mail de cada família foi olhado num cliente em tema escuro, com capturas."]},"r":["supabase/functions/_shared/mail/layout.ts","supabase/functions/health-probe/index.ts (bloc corrigé le 21/09)","journal/operations/NOTE_pins-images-remesures_2026-09-21 §6"],"verif":[{"fr":"21/09 — courriel de 20 h 45 lu par Xavier (PDF versé dans la séance) ; décompte 27/48 par lecture des `style=\"…\"` de `supabase/functions/**/*.ts` ; `color-scheme` : 0 occurrence. Le courriel de clôture de 21 h 20 (incident 14) n'a pas de bloc `<pre>` : il ne dit rien du correctif, qui attend la prochaine alerte structurelle pour être vu.","pt":"21/09 — e-mail das 20h45 lido por Xavier; contagem 27/48 por leitura dos `style=\"…\"`; `color-scheme`: 0 ocorrências. O correctivo espera o próximo alerta estrutural para ser visto."},{"fr":"22/09 — **deux critères sur trois tenus, le troisième ne peut l'être que par une personne.** Relu : le blanc sur blanc du 21/09 n'était pas un défaut de thème sombre du client — c'était de l'**héritage** (fond clair sans `color`, texte blanc hérité du corps), qui se produit dans n'importe quel client ; la fiche le disait mal. *(1)* Les 27 styles à fond sans couleur ont reçu la couleur de texte de leur document (`#ffffff`, `#f2f2f2` ou `#f3f4f6`, selon le `<body>` ; les fragments injectés dans `introHtml` prennent celle du gabarit) — onze fichiers, `layout.ts`, `register` et `request-password-reset` compris ; les traits (éléments vides) en sont dispensés. Garde `src/tests/mails-fond-et-couleur.test.js`, qui lit tous les `.ts` de `supabase/functions/`. *(2)* Choix écrit au REGISTRE (`MAIL-Q7`) : nos courriels sont sombres par conception et le **déclarent** — `color-scheme: dark` + `supported-color-schemes` dans les huit documents (le huitième, `notify-document-permission-request`, n'avait même pas de `<head>`). Un thème sombre n'est pas écrit : il n'y a rien à inverser. *(3)* **Reste à Xavier** : ouvrir un courriel de chaque famille dans un vrai client (Proton, Thunderbird, Gmail mobile) — la garde lit du HTML, elle ne prouve pas un rendu. Le prochain courriel réel sera celui d'une alerte ou d'un rappel ; le regarder suffit.","pt":"22/09 — **dois critérios em três cumpridos, o terceiro só por uma pessoa.** Relido: o branco sobre branco de 21/09 não era um defeito de tema escuro do cliente — era **herança** (fundo claro sem `color`, texto branco herdado do corpo), que ocorre em qualquer cliente. *(1)* Os 27 estilos com fundo sem cor receberam a cor de texto do seu documento — onze ficheiros, `layout.ts`, `register` e `request-password-reset` incluídos. Guarda `src/tests/mails-fond-et-couleur.test.js`. *(2)* Escolha escrita no REGISTRE (`MAIL-Q7`): os nossos e-mails são escuros por desenho e **declaram-no** — `color-scheme: dark` nos oito documentos (o oitavo nem tinha `<head>`). *(3)* **Fica para Xavier**: abrir um e-mail de cada família num cliente real — a guarda lê HTML, não prova um rendering."}]},{"id":"F12","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno","sql"],"t":{"fr":"Rien ne rejoue un courriel refusé : une ligne de file « failed » le reste pour toujours","pt":"Nada reenvia um e-mail recusado: uma linha de fila « failed » fica assim para sempre"},"v":{"fr":"**Demandé par Xavier le 21/09/2026**, à la suite du correctif « sent à tort ». Jusqu'à ce soir-là, sept modules de courriel (`lettre`, `gazette`, `team`, `network`, `cartography`, `assembleia`, `library_profile`) marquaient leur ligne de file « sent », avec un `sent_at`, sans lire le résultat de l'envoi : un refus du transport passait pour un envoi. Ils lisent désormais `_shared/domain/outbox-verdict.ts` (commits `bbaaa606`, `bbcbef65`, `81af8a3d`) : un refus donne **`failed`**, et `last_error` compte les partis et nomme les refusés (« 1 parti(s), 1 refuse(s) — adresse : cause »). Le journal dit donc vrai — mais **personne ne relit une ligne `failed`** : *cherché le 21/09* dans `supabase/functions/` et dans les migrations, aucun cron, aucune fonction, aucun bouton ne reprend une ligne `failed` des quatre files concernées (`team_notification_outbox`, `lettre_notification_outbox`, `gazette_submission_notification_outbox`, `cartography_submission_notification_outbox`). C'était déjà vrai avant ; simplement, le refus ne se voyait pas. **Effet de bord à connaître** : `fn_healthcheck_notifications()`, dans sa définition du 17/08 (migration `20260817142747`), compte comme « non traitée » toute ligne de file dont le statut n'est ni `sent` ni `skipped` — une ligne `failed` la fait donc passer à `ok: false`, et l'y laisse tant que la ligne existe. C'est une bonne chose (le refus devient visible), à condition qu'il existe un geste pour en sortir.","pt":"**Pedido por Xavier em 21/09/2026**, na sequência do correctivo « sent por engano ». Até essa noite, sete módulos de e-mail marcavam a sua linha de fila « sent », com `sent_at`, sem ler o resultado do envio. Leem agora `_shared/domain/outbox-verdict.ts` (commits `bbaaa606`, `bbcbef65`, `81af8a3d`): uma recusa dá **`failed`**, e `last_error` conta os enviados e nomeia os recusados. O registo diz a verdade — mas **ninguém relê uma linha `failed`**: *procurado em 21/09*, nenhum cron, nenhuma função, nenhum botão retoma uma linha `failed` das quatro filas (`team_notification_outbox`, `lettre_notification_outbox`, `gazette_submission_notification_outbox`, `cartography_submission_notification_outbox`). **Efeito a conhecer**: `fn_healthcheck_notifications()` (migração `20260817142747`) conta como « não tratada » qualquer linha cujo estado não seja `sent` nem `skipped` — uma linha `failed` deixa-a em `ok: false` enquanto existir."},"w":{"fr":"Un rejeu automatique, borné, **par destinataire refusé et jamais par ligne** : une ligne vaut pour tous ses destinataires, et ceux qui ont reçu leur courriel ne doivent pas le recevoir deux fois (c'est écrit en tête de `outbox-verdict.ts`). Ce que cela demande : **(1)** garder, de façon lisible par une machine, QUI a été refusé — aujourd'hui `last_error` est une phrase tronquée à 500 caractères, pas une donnée ; **(2)** un nombre d'essais borné avec recul (la colonne `attempts` existe sur `team_notification_outbox` — à vérifier sur les trois autres files) et un état final distinct quand on renonce ; **(3)** un cron qui reprend les lignes `failed` récentes, inscrit dans `fn_crons_attendus()` (I26) ; **(4)** un geste d'acquittement pour les lignes auxquelles on renonce, afin que la sonde des notifications puisse repasser au vert. Banc d'abord, avec `src/tests/helpers/monter-ef.js`.","pt":"Um reenvio automático, limitado, **por destinatário recusado e nunca por linha**: quem já recebeu o e-mail não deve recebê-lo duas vezes. Exige: **(1)** guardar, de forma legível por máquina, QUEM foi recusado — hoje `last_error` é uma frase cortada a 500 caracteres; **(2)** um número de tentativas limitado, com recuo, e um estado final distinto quando se desiste; **(3)** um cron que retoma as linhas `failed` recentes, inscrito em `fn_crons_attendus()` (I26); **(4)** um gesto de quitação para as linhas abandonadas, para que a sonda volte ao verde. Bancada primeiro."},"y":{"fr":"Dire qu'un courriel n'est pas parti ne le fait pas partir. Une panne d'une heure chez le transporteur, et ce sont des convocations d'assemblée, des décisions de la gazette, des votes de cooptation qui n'arrivent jamais — sans que personne, sauf à lire la base, sache à qui écrire.","pt":"Dizer que um e-mail não partiu não o faz partir. Uma hora de avaria no transportador, e são convocatórias de assembleia, decisões da gazeta, votos de cooptação que nunca chegam — sem que ninguém, salvo lendo a base, saiba a quem escrever."},"f":{"fr":["Un envoi refusé est retenté seul, un nombre borné de fois, sans qu'aucun destinataire déjà servi reçoive un doublon — prouvé par un banc.","Une ligne à laquelle on renonce porte un état final et sa raison ; la sonde des notifications sait la distinguer d'une ligne en attente.","Le cron du rejeu figure dans `fn_crons_attendus()` et dans la suite des crons."],"pt":["Um envio recusado é retentado sozinho, um número limitado de vezes, sem que nenhum destinatário já servido receba um duplicado — provado por uma bancada.","Uma linha abandonada leva um estado final e a sua razão; a sonda das notificações sabe distingui-la de uma linha em espera.","O cron do reenvio consta de `fn_crons_attendus()` e da suíte dos crons."]},"r":["supabase/functions/_shared/domain/outbox-verdict.ts (en-tête : « rejouer par destinataire »)","supabase/migrations/20260817142747_healthcheck_notifications.sql (§3, files non traitées)","src/tests/equipe-reseau-file-banc.test.js, library-profile-banc.test.js, mails-federation-banc.test.js, lettre-banc.test.js","journal/operations/RUNBOOK_domaines_repli_2026-09-07 (« Trouvé en écrivant ces bancs »)"],"verif":[{"fr":"21/09 — recherche de `failed` dans `supabase/functions/**/*.ts` : hors des modules de domaine, les neuf fichiers qui le nomment parlent d'autre chose (moissons, imports, couvertures), aucun ne relit une file de courriels ; recherche de `retry|requeue|status = 'failed'` dans les migrations qui nomment une file : aucune reprise. Définition de `fn_healthcheck_notifications()` lue dans sa migration d'origine, pas dans la base : à relire en production avant de s'y fier.","pt":"21/09 — procura de `failed` em `supabase/functions/**/*.ts` e de `retry|requeue` nas migrações: nenhuma retoma de fila de e-mails. Definição de `fn_healthcheck_notifications()` lida na migração de origem, não na base: a reler em produção."}]},{"id":"F13","d":"F","p":"P3","s":"ouvert","e":"S","sk":["deno"],"t":{"fr":"`notify-digital-share` : `sent_count` compte aussi les envois refusés","pt":"`notify-digital-share`: `sent_count` conta também os envios recusados"},"v":{"fr":"**Demandé par Xavier le 21/09/2026.** Trouvé le même jour en écrivant `src/tests/notify-digital-share-banc.test.js`, et **épinglé** là sous le nom « DÉFAUT CONNU » : la fonction incrémente son compteur dès que `sendIll(...)` rend une valeur vraie (`supabase/functions/notify-digital-share/index.ts`, ligne 126 au 21/09), sans lire ce que le transport a répondu — `safeSendEmail` ne lève jamais. Avec un transport en panne, la réponse annonce donc `sent_count: 1` pour zéro courriel parti. Ce n'est qu'un chiffre dans une réponse que rien n'affiche aujourd'hui : aucun courriel n'est perdu à cause de lui et aucune file ne ment. C'est le dernier endroit connu qui garde la forme du défaut « sent à tort » corrigé ailleurs le 21/09.","pt":"**Pedido por Xavier em 21/09/2026.** Encontrado no mesmo dia ao escrever `src/tests/notify-digital-share-banc.test.js`, e **fixado** aí como « DÉFAUT CONNU »: a função incrementa o contador sem ler o que o transporte respondeu. Com o transporte avariado, a resposta anuncia `sent_count: 1` para zero e-mails enviados. É só um número numa resposta que nada mostra hoje. É o último sítio conhecido com a forma do defeito « sent por engano » corrigido noutros lados em 21/09."},"w":{"fr":"Faire rendre à `sendIll` le résultat de `safeSendEmail`, ne compter que les envois partis, et rendre à côté le compte des refusés (avec l'adresse et la cause) et celui des sautés. Dans le banc, retourner le cas épinglé : rouge d'abord, vert ensuite. Compter les imports, sonder la fonction en production après le déploiement.","pt":"Fazer `sendIll` devolver o resultado de `safeSendEmail`, contar só os envios feitos, e devolver ao lado a contagem dos recusados (com endereço e causa) e dos saltados. Na bancada, inverter o caso fixado: vermelho primeiro, verde depois."},"y":{"fr":"Un compte rendu qui ment, même petit, finit par servir de preuve. Le jour où quelqu'un branchera un écran ou une alerte sur ce chiffre, il dira que tout est parti.","pt":"Um relatório que mente, mesmo pequeno, acaba por servir de prova. No dia em que alguém ligar um ecrã ou um alerta a este número, ele dirá que tudo partiu."},"f":{"fr":["`sent_count` ne compte que les envois acceptés par le transport ; les refus sont rendus à part, nommés.","Le cas « DÉFAUT CONNU » du banc est retourné et vert ; plus aucun cas de test du dépôt n'est épinglé sous ce nom."],"pt":["`sent_count` só conta os envios aceites pelo transporte; as recusas são devolvidas à parte, nomeadas.","O caso « DÉFAUT CONNU » da bancada está invertido e verde; nenhum caso de teste do repositório fica fixado com esse nome."]},"r":["supabase/functions/notify-digital-share/index.ts","src/tests/notify-digital-share-banc.test.js (cas « DÉFAUT CONNU »)","supabase/functions/_shared/domain/outbox-verdict.ts"],"verif":[{"fr":"21/09 — le cas épinglé du banc passe sur le code actuel : transport en 500, zéro envoi, `sent_count` à 1.","pt":"21/09 — o caso fixado da bancada passa no código atual: transporte em 500, zero envios, `sent_count` a 1."}]},{"id":"F14","d":"F","p":"P2","s":"en-cours","e":"S","sk":["aucune"],"t":{"fr":"Le Reply-To en `proton.me` fait classer nos courriels indésirables — 6,9 pour un seuil de 6 chez Riseup","pt":"O Reply-To em `proton.me` faz nossos e-mails caírem no spam — 6,9 para um limiar de 6 no Riseup"},"v":{"fr":"**Trouvé le 22/09/2026 pendant l'essai de bascule authentifié** (runbook des domaines, partie du 22/09). Le courriel de bienvenue d'un compte contributeur, envoyé par `register` à une adresse Riseup, est arrivé dans les indésirables avec l'en-tête `X-Spam-Status: Yes, score=6.9 required=6.0`. Le rapport SpamAssassin nomme la cause : `FROM_NOT_REPLYTO_SAME_DOMAIN` (3,0), `FREEMAIL_FORGED_REPLYTO` (2,5), `FROM_NOT_REPLYTO` (1,0), `REPLYTO_DIFF_DOMAIN` (0,2) — soit 6,7 des 6,9 points — parce que l'expéditeur est `no-reply@notifications.anarbib.org` et le **Reply-To `anarbib@proton.me`**, adresse d'un service gratuit sur un autre domaine : c'est le motif type d'une usurpation. Tout le reste est bon (SPF pass, DKIM valide, réputation « excellente »). Le Reply-To vient du réglage `ANARBIB_REPLY_TO_EMAIL` (`supabase/functions/register/index.ts`, l. 653 ; défaut = l'expéditeur), posé en `proton.me` à la suite de la décision du 16/09 d'éviter les adresses `.org` pour le canal humain. Le courriel de réinitialisation vers Gmail, lui, est arrivé en boîte de réception le même soir — les filtres diffèrent, la cause est la même.","pt":"**Encontrado em 22/09/2026 durante o ensaio de bascule autenticado.** O e-mail de boas-vindas de uma conta de contribuinte, enviado por `register` para um endereço Riseup, caiu no spam com `X-Spam-Status: Yes, score=6.9 required=6.0`. Causa nomeada pelo SpamAssassin: remetente `no-reply@notifications.anarbib.org` com **Reply-To `anarbib@proton.me`** (serviço gratuito, outro domínio) — 6,7 dos 6,9 pontos. SPF, DKIM e reputação estão bons. O Reply-To vem do ajuste `ANARBIB_REPLY_TO_EMAIL`, posto em `proton.me` após a decisão de 16/09 de evitar endereços `.org` no canal humano."},"w":{"fr":"Retirer le Reply-To étranger sans revenir sur la décision du 16/09 : ne plus poser `ANARBIB_REPLY_TO_EMAIL` (le Reply-To retombe sur l'expéditeur, même domaine), et écrire l'adresse humaine `anarbib@proton.me` **dans le corps** des courriels qui invitent à répondre, là où un filtre ne la lit pas comme une usurpation. Vérifier les autres fonctions qui lisent un Reply-To d'environnement (`notify-network-weekly-report` : `NETWORK_REPLY_TO_EMAIL`, `ANARBIB_REPLY_TO_EMAIL`). Puis rejouer : une inscription vers une adresse Riseup, lire `X-Spam-Status`.","pt":"Retirar o Reply-To estrangeiro sem voltar atrás na decisão de 16/09: deixar de definir `ANARBIB_REPLY_TO_EMAIL` (o Reply-To volta ao remetente, mesmo domínio) e escrever o endereço humano `anarbib@proton.me` **no corpo** dos e-mails. Verificar as outras funções que leem um Reply-To de ambiente. Depois repetir: um cadastro para um endereço Riseup, ler `X-Spam-Status`."},"y":{"fr":"Un courriel de bienvenue ou de réinitialisation qui tombe dans les indésirables est un compte perdu : la personne ne trouve ni son identifiant ni son mot de passe provisoire. Les collectifs militants sont justement chez Riseup, Autistici, Proton.","pt":"Um e-mail de boas-vindas ou de redefinição que cai no spam é uma conta perdida. Os coletivos militantes estão justamente no Riseup, Autistici, Proton."},"f":{"fr":["Une inscription vers une adresse Riseup arrive en boîte de réception, `X-Spam-Status: No`, et le rapport ne porte plus aucune règle `*REPLYTO*`.","L'adresse humaine figure dans le corps des courriels concernés, dix langues."],"pt":["Um cadastro para um endereço Riseup chega à caixa de entrada, `X-Spam-Status: No`, sem regra `*REPLYTO*`.","O endereço humano está no corpo dos e-mails, dez línguas."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["docs/journal/operations/RUNBOOK_domaines_repli_2026-09-07.md (essai du 22/09)","supabase/functions/register/index.ts","REGISTRE §38 OPS-10"],"verif":{"fr":"22/09 — en-tête `X-Spam-Report` lu dans la source du message reçu (Thunderbird, compte Riseup) ; `ANARBIB_REPLY_TO_EMAIL` localisé dans `register/index.ts` l. 16 et 653 ; valeur en production déduite de l'en-tête `Reply-To: AnarBib <anarbib@proton.me>` du courriel, le secret lui-même n'étant pas lisible depuis le poste. **22/09 au soir, livré** : quatre secrets en production partageaient la même valeur (`ADMIN_EMAIL`, `ANARBIB_ADMIN_EMAIL`, `ANARBIB_REPLY_TO_EMAIL`, `NETWORK_REPLY_TO_EMAIL`, même empreinte dans `supabase secrets list`) — les deux Reply-To retirés (`supabase secrets unset`), `register` retombe sur `SENDER_EMAIL` ; `notify-network-weekly-report` ne retombe plus sur `ADMIN_EMAIL` ; `notify-library-invitation` et `notify-library-request` n'écrivent plus de Reply-To Proton (l'adresse est dans leur corps) ; `welcome.autoMessage` ×10 dit « n'y réponds pas, pour joindre une personne : anarbib@proton.me » ; garde `src/tests/reply-to-meme-domaine.test.js` à liste fermée ; règle écrite dans `deploy/functions.env.example`. **Reste, à la main de Xavier : une inscription vers une adresse Riseup et la lecture de `X-Spam-Status`** — c'est le premier critère.","pt":"22/09 — cabeçalho `X-Spam-Report` lido na fonte da mensagem recebida; `ANARBIB_REPLY_TO_EMAIL` localizado em `register/index.ts`; valor em produção deduzido do cabeçalho `Reply-To` do e-mail. **22/09 à noite, entregue**: os dois Reply-To retirados dos segredos de produção; `notify-network-weekly-report` não recai mais em `ADMIN_EMAIL`; invitation e library-request sem Reply-To Proton; `welcome.autoMessage` ×10 com o endereço humano no corpo; guarda `reply-to-meme-domaine.test.js`. **Falta: um cadastro para um endereço Riseup e a leitura de `X-Spam-Status`.**"}},{"id":"E15","d":"E","p":"P2","s":"ouvert","e":"S","sk":["langue"],"t":{"fr":"Les mots de confirmation « vider l'historique » et « supprimer le compte » sont le même mot dans huit locales sur neuf","pt":"As palavras de confirmação «esvaziar o histórico» e «excluir a conta» são a mesma palavra em oito de nove locales"},"v":{"fr":"**Vérifié dans `src/i18n/locales/` le 07/09.** En pt-BR, `account.history.deleteAll.confirmWord` = `APAGAR` et `account.deleteAccount.confirmText` = `EXCLUIR` : deux gestes, deux mots. Dans fr, en, es, it, de, nl, el et eo, **les deux clés portent le même mot** (`SUPPRIMER`/`SUPPRIMER`, `DELETE`/`DELETE`…). Seul le catalan distingue (`ELIMINA` / `SUPRIMIR`). Relevé d'abord par le manuel lecteur v2 du 03/09.","pt":"**Verificado em `src/i18n/locales/` em 07/09.** Em pt-BR, `account.history.deleteAll.confirmWord` = `APAGAR` e `account.deleteAccount.confirmText` = `EXCLUIR`: dois gestos, duas palavras. Em fr, en, es, it, de, nl, el e eo, **as duas chaves carregam a mesma palavra** (`SUPPRIMER`/`SUPPRIMER`, `DELETE`/`DELETE`…). Só o catalão distingue (`ELIMINA` / `SUPRIMIR`). Levantado primeiro pelo manual da leitora v2 de 03/09."},"w":{"fr":"Choisir deux mots distincts par locale, avec les locuteur·rices quand il y en a (**E2** pour nl et el), et mettre le manuel en accord.","pt":"Escolher duas palavras distintas por locale, com as pessoas falantes quando houver (**E2** para nl e el), e pôr o manual de acordo."},"y":{"fr":"Un mot de confirmation sert à ce qu'on ne confonde pas deux destructions. Quand c'est le même, il ne sert à rien — et c'est précisément `DOC-DESTR-2` : dire ce qu'on détruit.","pt":"Uma palavra de confirmação serve para não confundir duas destruições. Quando é a mesma, não serve para nada — e é exatamente `DOC-DESTR-2`: dizer o que se destrói."},"f":{"fr":["Neuf locales, deux mots différents chacune ; le test i18n passe."],"pt":["Nove locales, duas palavras diferentes cada; o teste i18n passa."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["claude/MANUEL_LECTEUR_v2_refonte_2026-09-03","REGISTRE §0 DOC-DESTR-2"],"verif":[{"fr":"07/09 — huit paires identiques constatées dans les fichiers de locale.","pt":"07/09 — oito pares idênticos constatados nos arquivos de locale."},{"fr":"20/09 — constat du 07/09 confirmé à l'identique : de, el, en, eo, es, fr, it, nl portent le même mot sur les deux clés ; ca (`ELIMINA`/`SUPRIMIR`) et pt-BR (`APAGAR`/`EXCLUIR`) distinguent. À savoir pour choisir les mots : l'historique compare en majuscules après `trim()` (`AccountPage.jsx` l. 2544), la suppression du compte compare la saisie brute (l. 1805).","pt":"20/09 — constato de 07/09 confirmado tal e qual: de, el, en, eo, es, fr, it, nl têm a mesma palavra nas duas chaves; ca e pt-BR distinguem. A saber: o histórico compara em maiúsculas depois de `trim()` (l. 2544), a eliminação da conta compara a entrada bruta (l. 1805)."}]},{"id":"G14","d":"G","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Une invitation d'équipe attend depuis le 30/08 et expirera le 29/09 — la personne ne le sait peut-être pas","pt":"Um convite de equipe espera desde 30/08 e expirará em 29/09 — a pessoa talvez não saiba"},"v":{"fr":"**Vérifié en base le 07/09** : dans `library_team_invitations`, une invitation créée le 30/08 est toujours `ready`, expiration le 29/09 (deux autres du 01/09 sont `accepted` et `pending_ratification`). Le plan de formation du 01/09 la signalait déjà : « il faut la prévenir ». Le cron d'expiration la fermera en silence.","pt":"**Verificado no banco em 07/09**: em `library_team_invitations`, um convite criado em 30/08 continua `ready`, expira em 29/09 (dois outros de 01/09 estão `accepted` e `pending_ratification`). O plano de formação de 01/09 já o sinalizava: «é preciso avisá-la». O cron de expiração vai fechá-lo em silêncio."},"w":{"fr":"Un message à la personne invitée, par le canal humain (`DOC-COLLECTIVE-1`). Puis regarder pourquoi l'invitation par courriel n'a pas suffi — c'est **G1** en miniature.","pt":"Uma mensagem à pessoa convidada, pelo canal humano (`DOC-COLLECTIVE-1`). Depois olhar por que o convite por e-mail não bastou — é **G1** em miniatura."},"y":{"fr":"Un circuit qui expire sans que personne ne s'en aperçoive est un circuit qui n'existe pas.","pt":"Um circuito que expira sem que ninguém perceba é um circuito que não existe."},"f":{"fr":["L'invitation est `accepted` ou `declined` avant le 29/09, pas expirée."],"pt":["O convite está `accepted` ou `declined` antes de 29/09, não expirado."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["claude/PLAN_formation_coordination_BLMF_2026-08-26 (annexe)","REGISTRE §0 DOC-COLLECTIVE-1"],"verif":[{"fr":"07/09 — `ready` depuis le 30/08, expiration 29/09.","pt":"07/09 — `ready` desde 30/08, expira em 29/09."},{"fr":"16/09 — toujours `ready` en production : l'invitation du 30/08 n'est ni acceptée ni déclinée, elle expire le 29/09. Deux autres invitations du 01/09 : une acceptée, une en attente de ratification.","pt":"16/09 — ainda `ready` em produção: o convite de 30/08 não foi aceite nem recusado, expira em 29/09. Dois outros convites de 01/09: um aceite, um à espera de ratificação."},{"fr":"21/09 — **décision de Xavier : il relance la personne lui-même.** Rien n'est touché en base. À relire le 28/09, veille de l'expiration : état de l'invitation, puis clôture ou nouvelle invitation.","pt":"21/09 — **decisão de Xavier: ele próprio relança a pessoa.** Nada é tocado na base. A reler em 28/09, véspera da expiração."}]},{"id":"B24","d":"B","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Une rotation de clé touche deux dépôts — la vitrine a cassé six jours après B18, et rien ne l'aurait empêché de recommencer","pt":"Uma rotação de chave toca dois repositórios — a vitrine quebrou seis dias depois de B18, e nada a impediria de acontecer de novo"},"v":{"fr":"B18 (02/09) a désactivé les clés legacy sur un feu vert chiffré qui ne regardait que l'application. Or le site vitrine `anarbib.org` est un **second dépôt** (`codeberg.org/anarbib/pages`) dont la galerie *Explorer* lit `api.public_libraries` en production avec une clé embarquée en `data-supabase-key` dans **dix `index.html`** (un par locale) : dès le toggle, la galerie a rendu 401 — **page vide pendant six jours**, réparée dans la nuit du 07 au 08/09 par la session du fond de carte (vitrine `df9ba40`), pas par la surveillance qui était censée le voir. Cette surveillance (tâche quotidienne `anarbib-trafic-cles-legacy`) comptait 4 à 7 requêtes legacy par jour du 04 au 07/09 et les lisait comme des onglets fossiles ; le `referer`, demandé le 08/09 pour la première fois, a désigné la vitrine en une ligne. Le harnais de charge de l'application portait lui aussi la clé legacy en clair (`scripts/loadtest/anarbib-loadtest.mjs`), retirée le 07/09 (`e2f5d75a`). **Vérifié le 08/09** : `grep -r eyJhbGciOi` rend zéro dans les deux dépôts, `/fr/explorar/` déployée sert `sb_publishable_…`, zéro requête legacy depuis le correctif. Ce qui manque n'est plus la réparation, c'est ce qui empêche la répétition : la vitrine n'a **aucune garde**, et sa clé vit en dix copies qu'un `sed` a dû toucher une par une.","pt":"B18 (02/09) desativou as chaves legacy com um sinal verde numérico que só olhava o aplicativo. Só que o site vitrine `anarbib.org` é um **segundo repositório** (`codeberg.org/anarbib/pages`) cuja galeria *Explorar* lê `api.public_libraries` em produção com uma chave embutida em `data-supabase-key` em **dez `index.html`** (um por locale): desde o toggle, a galeria devolveu 401 — **página vazia durante seis dias**, consertada na noite de 07 para 08/09 pela sessão do mapa base (vitrine `df9ba40`), não pela vigilância que deveria ter visto. Essa vigilância (tarefa diária `anarbib-trafic-cles-legacy`) contava 4 a 7 requisições legacy por dia de 04 a 07/09 e as lia como abas fósseis; o `referer`, pedido em 08/09 pela primeira vez, apontou a vitrine numa linha. O harnês de carga do aplicativo também carregava a chave legacy em claro (`scripts/loadtest/anarbib-loadtest.mjs`), retirada em 07/09 (`e2f5d75a`). **Verificado em 08/09**: `grep -r eyJhbGciOi` devolve zero nos dois repositórios, `/fr/explorar/` publicada serve `sb_publishable_…`, zero requisição legacy desde a correção. O que falta já não é o conserto, é o que impede a repetição: a vitrine não tem **nenhuma guarda**, e sua chave vive em dez cópias que um `sed` teve de tocar uma a uma."},"w":{"fr":"Deux gestes dans le dépôt `pages`, une soirée. (1) **Une seule copie de la clé** : la sortir des dix `index.html` vers un `js/config.js` (ou un seul `data-*` sur la balise racine lue par `explorar.js`), pour qu'une rotation soit un commit d'une ligne. (2) **Une garde qui refuse une clé legacy** : test ou hook `pre-commit` qui rougit sur `eyJhbGciOi` n'importe où dans le dépôt, et qui vérifie que la clé embarquée commence par `sb_publishable_`. Et dans l'application : la liste des dépôts à inventorier à chaque rotation écrite dans `B19` (fait le 08/09) et dans `CONTRIBUTING.md`.","pt":"Dois gestos no repositório `pages`, uma noite. (1) **Uma única cópia da chave**: tirá-la dos dez `index.html` para um `js/config.js` (ou um único `data-*` na tag raiz lido por `explorar.js`), para que uma rotação seja um commit de uma linha. (2) **Uma guarda que recusa uma chave legacy**: teste ou hook `pre-commit` que fica vermelho com `eyJhbGciOi` em qualquer lugar do repositório, e que verifica que a chave embutida começa com `sb_publishable_`. E no aplicativo: a lista dos repositórios a inventariar a cada rotação escrita em `B19` (feito em 08/09) e em `CONTRIBUTING.md`."},"y":{"fr":"B19 est le prochain geste sur les clés : ce jour-là une page oubliée ne rendra plus 401, elle rendra une déconnexion générale — réversible (la clé révoquée se remet en standby), mais générale. *(Corrigé le 15/09 : cette phrase disait le geste irréversible.)* Et six jours de galerie vide, c'est six jours où la vitrine disait au public « ce réseau n'a aucune bibliothèque » — indistinguable d'une panne, comme le dit `DOC-SILENCE-1`.","pt":"B19 é o próximo gesto sobre as chaves: nesse dia uma página esquecida não devolverá mais 401, devolverá uma desconexão geral — reversível (a chave revogada volta para standby), mas geral. *(Corrigido em 15/09: esta frase dizia o gesto irreversível.)* E seis dias de galeria vazia são seis dias em que a vitrine dizia ao público «esta rede não tem nenhuma biblioteca» — indistinguível de uma pane, como diz `DOC-SILENCE-1`."},"f":{"fr":["La clé de la vitrine vit en un seul endroit, et une garde rougit sur toute clé legacy ou sur une clé qui ne commence pas par `sb_publishable_`.","`B19` et `CONTRIBUTING.md` nomment les dépôts à inventorier avant et après toute rotation."],"pt":["A chave da vitrine vive num único lugar, e uma guarda fica vermelha com qualquer chave legacy ou com uma chave que não comece por `sb_publishable_`.","`B19` e `CONTRIBUTING.md` nomeiam os repositórios a inventariar antes e depois de qualquer rotação."]},"dep":{"fr":"Ne bloque plus **B19** (levé le 15/09 : l'inventaire est fait et vérifié, et la révocation est réversible) ; les deux gestes protègent la rotation suivante. Dépôt `pages` : le gel est levé depuis le 14/09.","pt":"Não bloqueia mais **B19** (levantado em 15/09: o inventário está feito e verificado, e a revogação é reversível); os dois gestos protegem a rotação seguinte. Repositório `pages`: o congelamento acabou em 14/09."},"r":["REGISTRE §38 OPS-9","item B18 (clôture nuancée)","item B19","vitrine df9ba40","app e2f5d75a"],"verif":{"fr":"08/09 — logs edge 24 h : les 4 requêtes legacy (toutes 401) sont la vérification pré-correctif de la session vitrine, referer `anarbib.org` et `localhost:8765`, même réseau ; `curl anarbib.org/fr/explorar/` → `sb_publishable_…` ; `grep eyJhbGciOi` = 0 dans `anarbib` et `pages`.","pt":"08/09 — logs edge 24 h: as 4 requisições legacy (todas 401) são a verificação pré-correção da sessão da vitrine, referer `anarbib.org` e `localhost:8765`, mesma rede; `curl anarbib.org/fr/explorar/` → `sb_publishable_…`; `grep eyJhbGciOi` = 0 em `anarbib` e `pages`."}},{"id":"J9","d":"J","p":"P2","s":"a-verifier","e":"M","sk":["aucune"],"t":{"fr":"Manuel v5 : le reliquat des captures — 180 emplacements en repli pt-BR, IMG-31 à refaire, IMG-08 à confirmer, tout à recapturer en 900-1000 px","pt":"Manual v5: o restante das capturas — 180 posições em recuo pt-BR, IMG-31 a refazer, IMG-08 a confirmar, tudo a recapturar em 900-1000 px"},"v":{"fr":"Le portfolio du 02/09 laisse cinq choses ouvertes : 320 emplacements remplis dont **180 par repli pt-BR** (pas de capture en langue propre pour neuf locales) ; **IMG-31** reproduit une demande d'adhésion réelle encore en analyse (Solidaires) ; **IMG-08** laisse lisibles l'adresse et le courriel de la BLMF, « probablement délibéré, à confirmer » ; le texte fait ≈ 4,5 pt sur papier, d'où recapture à 900-1000 px et rognage du fond ; **IMG-20** attend le déploiement du correctif du sélecteur de périodique. Le manuel lecteur v2 du 03/09 a réutilisé les mêmes captures sans ce correctif. **Vérifié le 07/09 dans le dépôt** : les dix `docs/manual*.md` sont en v1.1 de septembre — cette partie-là est faite ; la branche et le worktree `manualv5` n'existent plus — fait aussi. Les captures elles-mêmes sont sur la machine de Xavier, hors de portée.","pt":"O portfólio de 02/09 deixa cinco coisas abertas: 320 posições preenchidas das quais **180 por recuo pt-BR** (sem captura na própria língua para nove locales); **IMG-31** reproduz um pedido de adesão real ainda em análise (Solidaires); **IMG-08** deixa legíveis o endereço e o e-mail da BLMF, «provavelmente deliberado, a confirmar»; o texto fica ≈ 4,5 pt no papel, daí recaptura em 900-1000 px e recorte do fundo; **IMG-20** espera o deploy da correção do seletor de periódico. O manual da leitora v2 de 03/09 reutilizou as mesmas capturas sem essa correção. **Verificado em 07/09 no repositório**: os dez `docs/manual*.md` estão na v1.1 de setembro — essa parte está feita; o branch e o worktree `manualv5` não existem mais — feito também. As capturas em si estão na máquina de Xavier, fora de alcance."},"w":{"fr":"Trancher IMG-31 (demande fictive ou floutage) et IMG-08 ; puis une passe de recapture à 900-1000 px, locale par locale, en commençant par celles qui ont des lectrices.","pt":"Decidir IMG-31 (pedido fictício ou desfoque) e IMG-08; depois uma passagem de recaptura em 900-1000 px, locale por locale, começando pelas que têm leitoras."},"y":{"fr":"Un manuel qu'on ne peut pas lire sur papier, et dont une image montre le dossier d'une bibliothèque qui attend une réponse, ne s'imprime pas pour Bologne.","pt":"Um manual que não se consegue ler no papel, e cuja imagem mostra o dossiê de uma biblioteca que espera resposta, não se imprime para Bolonha."},"f":{"fr":["IMG-31 et IMG-08 tranchées, avec la raison écrite.","Les captures relues lisibles à l'impression."],"pt":["IMG-31 e IMG-08 decididas, com a razão escrita.","As capturas relidas legíveis na impressão."]},"dep":{"fr":"IMG-31 touche **G7** (ne pas exposer une candidature en cours).","pt":"IMG-31 toca **G7** (não expor uma candidatura em curso)."},"r":["claude/MANUEL_v5_portfolio_captures_2026-09-02","claude/MANUEL_LECTEUR_v2_refonte_2026-09-03"],"verif":{"fr":"07/09 — manuels .md en v1.1 et branche supprimée (fait) ; captures non vérifiables depuis ici.","pt":"07/09 — manuais .md na v1.1 e branch removido (feito); capturas não verificáveis daqui."}},{"id":"J10","d":"J","p":"P3","s":"ouvert","e":"M","sk":["aucune"],"t":{"fr":"Sept domaines sont entrés dans le v17 sans avoir été arbitrés contre leur coût d'achèvement","pt":"Sete domínios entraram no v17 sem terem sido arbitrados contra seu custo de conclusão"},"v":{"fr":"Le relevé du GLB v17 (01/09) le dit sans action datée : périodiques, notes de lecture, moisson OAI entrante, OPDS, sondes, témoin de sauvegarde, file des conventions — « aucun n'a été arbitré contre son coût d'achèvement ». Depuis, H5 (OAI) et I4 (témoin) sont clos ; les cinq autres sont livrés en partie et non arbitrés.","pt":"O levantamento do GLB v17 (01/09) o diz sem ação datada: periódicos, notas de leitura, coleta OAI de entrada, OPDS, sondas, testemunha de backup, fila das convenções — «nenhum foi arbitrado contra seu custo de conclusão». Desde então, H5 (OAI) e I4 (testemunha) estão fechados; os outros cinco estão entregues em parte e não arbitrados."},"w":{"fr":"Cinq lignes : ce qui est livré, ce qui manque pour que ce soit fini, ce que ça coûte, et si on le finit ou si on le gèle avec la raison écrite (`P3`).","pt":"Cinco linhas: o que está entregue, o que falta para estar pronto, o que custa, e se se termina ou se congela com a razão escrita (`P3`)."},"y":{"fr":"Le gel de périmètre (`DOC-GEL-1`) ne vaut que si ce qui est entré pendant le gel est jugé — sinon il n'y a pas eu de gel.","pt":"O congelamento de perímetro (`DOC-GEL-1`) só vale se o que entrou durante o congelamento for julgado — senão não houve congelamento."},"f":{"fr":["Cinq verdicts au registre ou au backlog, datés."],"pt":["Cinco veredictos no registro ou no backlog, datados."]},"dep":{"fr":"Après Bologne. Sans dépendance technique.","pt":"Depois de Bolonha. Sem dependência técnica."},"r":["claude/GLB_v17_releve_et_constats_2026-09-01","REGISTRE §0 DOC-GEL-1"]},{"id":"E19","d":"E","p":"P2","s":"en-cours","e":"S","sk":["front"],"t":{"fr":"Mon compte, « Données personnelles » : les trois blocs de décision remontent après le profil, côte à côte ; la suppression du compte reste seule tout en bas","pt":"Minha conta, «Dados pessoais» : os três blocos de decisão sobem para depois do perfil, lado a lado ; a supressão da conta fica sozinha no fundo"},"v":{"fr":"**Demande de Xavier le 08/09/2026, tranchée après débat.** L'onglet « Données personnelles » de `/conta` (`AccountPage.jsx`, `activeTab === 'perfil'`, lignes 1352–1830) est le plus long de la page : le formulaire du profil, l'adresse, la carte de contact de la bibliothèque, ce qui a été déclaré, la configuration de l'adhésion (avec un repli), le compte de dépôt — puis, **tout en bas**, les trois blocs qui demandent une décision : « Exporter mes données » (`account.export.title`, `DataExportButton`), « Mes notifications » (`account.notifPrefs.title`) et « Lettre de la fédération » (`account.lettre.title`), et enfin « Supprimer mon compte » en rouge (`account.deleteAccount.*`). Il faut défiler longtemps pour trouver ce qu'on vient faire. Les préférences de conservation ne sont pas dans cet onglet : elles vivent dans « Historique », à côté des traces qu'elles gouvernent, et **y restent**.","pt":"**Pedido de Xavier em 08/09/2026, decidido após debate.** O separador «Dados pessoais» de `/conta` é o mais longo da página ; os três blocos de decisão (exportar, notificações, carta da federação) estão no fundo, e a supressão da conta a seguir. As preferências de conservação vivem em «Histórico» e aí ficam."},"w":{"fr":"Une rangée de **trois cartes côte à côte** — export, notifications, lettre — placée **juste après le formulaire du profil**, avant l'adresse et les blocs d'adhésion (de la lecture plus que de la décision). La grille en `repeat(3, minmax(0, 1fr))`, qui passe à une colonne sous 640 px — jamais `1fr` nu (doctrine mobile, `src/styles/mobile.css`). Le bloc **« Supprimer mon compte » reste seul, tout en bas, sur toute la largeur**, en rouge : son caractère définitif se lit à sa place autant qu'à sa couleur. Aucune RPC, aucune clé nouvelle : un déplacement de JSX et une grille. Refaire ensuite la capture de cette page dans le Manuel v5 (`anarbib-manual-v5-portfolio-captures`).","pt":"Uma fila de **três cartões lado a lado** (exportar, notificações, carta) **logo depois do formulário do perfil** ; grelha em `minmax(0, 1fr)`, uma coluna abaixo de 640 px. «Suprimir a minha conta» fica sozinho no fundo, a toda a largura, a vermelho. Nenhuma RPC, nenhuma chave nova ; refazer a captura no Manual v5."},"y":{"fr":"Ce que la page demande de décider doit se voir avant ce qu'elle donne à lire. Et la suppression du compte, isolée, garde le geste rare à part des gestes ordinaires — c'est une règle d'interface qu'on retrouve partout où un bouton est irréversible.","pt":"O que a página pede para decidir deve ver-se antes do que dá a ler. E a supressão da conta, isolada, mantém o gesto raro à parte dos ordinários."},"f":{"fr":["Les trois cartes sont visibles sans défiler sur un écran de portable, sous le formulaire du profil.","Sur 360 px, une colonne, aucun débordement horizontal (test : `iframe` 360 px, doctrine mobile).","La suppression du compte est le dernier bloc de l'onglet, seule sur sa ligne, en rouge.","La capture du Manuel v5 est refaite."],"pt":["Os três cartões visíveis sem rolar num portátil, sob o formulário do perfil.","A 360 px, uma coluna, sem transbordo.","A supressão da conta é o último bloco, sozinha, a vermelho.","Captura do Manual v5 refeita."]},"dep":{"fr":"Aucune. À faire **après le 14/09** (gel du code jusqu'au retour de Bologne). Voisin de **E9** (mobile).","pt":"Nenhuma. Depois de 14/09 (congelamento). Vizinho de **E9**."},"r":["AccountPage.jsx (onglet perfil)","anarbib-mobile-grid-blowout-doctrine","Manuel v5 §Mon compte"],"verif":[{"fr":"08/09 — ordre des blocs relu dans `AccountPage.jsx` : profil (1352), adresse, contact, déclaré, adhésion, dépôt, RGPD/export (1645), notifications, lettre, suppression (1795). Les libellés existent dans les dix locales ; rien à traduire.","pt":"08/09 — ordem dos blocos relida em `AccountPage.jsx` ; rótulos já nas dez locales."},{"fr":"20/09 — **le déplacement est livré (`2d686f93`) ; la page réelle n'a pas été vue à l'écran, et un point de la fiche ne pouvait pas se faire tel quel.** *Livré* : une `<section>` titrée « Mes droits sur mes données » posée juste après le bloc du profil, qui porte une grille `.ab-conta-decisions` en `repeat(3, minmax(0, 1fr))` et trois cartes — export (la mention RGPD art. 20 / LGPD art. 18 de l'ancienne enveloppe y devient une note), notifications, lettre ; l'ancienne enveloppe RGPD, vidée, disparaît ; « Supprimer mon compte » n'a pas bougé, dernier bloc de l'onglet. Aucune clé nouvelle, aucune RPC touchée. Test de source `src/tests/conta-decisions-sous-le-profil.test.js` (5 cas : ordre des blocs, une seule grille à trois cartes sans la suppression, pistes `minmax`, chaque geste garde son appel) ; 546 tests, lint 0 erreur. *Deux écarts à la fiche, à valider par Xavier* : **(1) la rangée vient après l'adresse, pas avant** — l'adresse n'est pas un bloc à part, elle vit dans le même `<form onSubmit={handleSaveProfile}>` que le profil, avec un seul bouton Enregistrer qui écrit les deux ; la placer avant demanderait de couper ce formulaire en deux (deux boutons, un seul gestionnaire) : c'est un choix d'interaction, pas un déplacement de JSX. **(2) une colonne sous 900 px, pas 640** — mesuré à 700 px : trois pistes de 207 px tiennent sans déborder, mais la carte des notifications y fait 735 px de haut en allemand. *Mesuré* — dans un harnais, pas dans la page : `/conta` exige une session que je n'ai pas ; réplique du balisage de la rangée montée dans la page de connexion d'un aperçu (styles globaux et `AccountPage.css` réels, libellés réels fr, de, el) : à 1366 px trois pistes de 424 px, rangée haute de 389 à 418 px ; à 920 px trois pistes de 275 px ; à 700 et 360 px une colonne ; **aucun débordement, ni d'une carte ni de la page, aux quatre largeurs et dans les trois langues**. *Ce qui n'est pas établi* : le premier « fini quand » — les trois cartes visibles sans défiler sur un portable. Le formulaire du profil avec l'adresse précède la rangée, et sa hauteur réelle n'a pas été mesurée : il est probable que la rangée reste sous la ligne de flottaison à 1366×768 tant que l'adresse est devant. À voir par Xavier, connecté ; la capture du Manuel v5 se refait après.","pt":"20/09 — **o deslocamento está entregue (`2d686f93`); a página real não foi vista na tela, e um ponto da ficha não podia ser feito tal e qual.** *Entregue*: uma `<section>` intitulada « Meus direitos sobre os meus dados » logo após o bloco do perfil, com uma grelha `.ab-conta-decisions` em `repeat(3, minmax(0, 1fr))` e três cartões — exportação (a menção RGPD art. 20 / LGPD art. 18 passa a nota), notificações, carta; o antigo invólucro RGPD, esvaziado, desaparece; « Excluir minha conta » não se moveu, último bloco do separador. Nenhuma chave nova, nenhuma RPC tocada. Teste de fonte `src/tests/conta-decisions-sous-le-profil.test.js` (5 casos); 546 testes, lint 0 erros. *Dois desvios à ficha, a validar por Xavier*: **(1) a fila vem depois da morada, não antes** — a morada vive no mesmo `<form>` que o perfil, com um único botão Guardar; colocá-la antes exigiria cortar esse formulário em dois: é uma escolha de interação. **(2) uma coluna abaixo de 900 px, não 640** — medido a 700 px: três pistas de 207 px cabem sem transbordar, mas o cartão das notificações fica com 735 px de altura em alemão. *Medido* — num arnês, não na página: `/conta` exige uma sessão que não tenho; réplica da marcação montada na página de login de um pré-visualizador (estilos reais, textos reais fr, de, el): a 1366 px três pistas de 424 px; a 920 px três de 275 px; a 700 e 360 px uma coluna; **nenhum transbordo nas quatro larguras e nas três línguas**. *O que não está estabelecido*: o primeiro « terminado quando » — os três cartões visíveis sem deslizar num portátil; a altura real do formulário com a morada não foi medida. A ver por Xavier, com sessão; a captura do Manual v5 refaz-se depois."},{"fr":"21/09 — **les deux écarts sont tranchés par Xavier, et le premier est livré (`26e2421f`).** *Décision 1 : couper le formulaire.* L'onglet devient profil + Enregistrer, les trois cartes, adresse + Enregistrer. Les deux formulaires appellent le même `handleSaveProfile`, qui écrit profil ET adresse : cliquer l'un ne perd jamais ce qu'on a saisi dans l'autre ; le message et le sablier s'affichent sous le bouton cliqué (`saveBloc`, lu sur `data-bloc`), les deux boutons sont inactifs pendant l'écriture, le message porte `role=\"status\"`. *Décision 2 : le repli reste à 900 px.* Banc `conta-decisions-sous-le-profil` : 6 cas, dont l'ordre profil → cartes → adresse ; 567 tests. **Ce qui reste, et que je ne peux pas faire** : voir la page connecté·e — `/conta` demande une session — pour tenir le premier « fini quand » (les trois cartes visibles sans défiler sur un portable) ; puis refaire la capture du Manuel v5.","pt":"21/09 — **os dois desvios foram decididos por Xavier, e o primeiro está entregue (`26e2421f`).** *Decisão 1: cortar o formulário.* O separador passa a ser perfil + Guardar, os três cartões, morada + Guardar. Os dois formulários chamam o mesmo `handleSaveProfile`, que escreve perfil E morada: clicar num nunca perde o que se escreveu no outro; a mensagem aparece sob o botão clicado. *Decisão 2: a coluna única mantém-se abaixo de 900 px.* Banco de teste: 6 casos; 567 testes. **O que falta, e que não posso fazer**: ver a página com sessão para cumprir o primeiro « terminado quando »; depois refazer a captura do Manual v5."}]},{"id":"E20","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front","langue"],"t":{"fr":"La barre de navigation se regroupe par nature — Public, Moi, Travail — en menus qui s'ouvrent au clic, pas au survol","pt":"A barra de navegação agrupa-se por natureza — Público, Eu, Trabalho — em menus que abrem ao clique, não ao passar do rato"},"v":{"fr":"**Demande de Xavier le 08/09/2026, tranchée après débat.** `src/components/layout/index.jsx` aligne sur **une seule ligne** jusqu'à **douze liens** pour une coordination qui est aussi admin réseau : Catalogue, Je veux…, Bibliothèques, Cartographie, Thésaurus, Mon compte, Panneau (`canSeePainel`), Catalogage, Importations (`canSeeImportacoes`), Bibliothèque, Fédération, Réseau (`canSeeRede`). Et chaque page aligne ses onglets sur une ligne aussi : neuf à Mon compte, douze à Bibliothèque, quinze à Réseau. Tout est aplati : rien ne dit d'un coup d'œil ce qui est public, ce qui est à soi, ce qui est du travail de bibliothèque ou de réseau. Xavier proposait d'abord des menus **par rôle** (« Bibliothécaire », « Coordinateur ») ouverts **au survol** ; le débat a retenu autre chose sur les deux points, voir « ce qu'il faut faire ».","pt":"**Pedido de Xavier em 08/09/2026, decidido após debate.** A barra alinha numa só linha até doze ligações ; cada página alinha os seus separadores (nove a quinze). Tudo está achatado. A proposta inicial (menus por papel, ao passar do rato) foi substituída no debate."},"w":{"fr":"**Regrouper par nature, pas par rôle** — une coordination est aussi bibliothécaire et lectrice, un menu par rôle lui en montrerait deux pour elle seule et une bibliothécaire verrait un menu « Coordinateur » vide. Trois groupes : **Public** (Catalogue, Bibliothèques, Cartographie, Thésaurus), **Moi** (Mon compte, Je veux…), **Travail** (Panneau, Catalogage, Importations, Bibliothèque, Fédération, Réseau — chaque entrée soumise au même `canSee*` qu'aujourd'hui, le groupe n'apparaissant que s'il a une entrée ; le rôle qui ouvre chaque entrée peut être un sous-titre dans le menu). Le catalogue reste un lien direct, c'est la porte d'entrée publique. **Les menus s'ouvrent au clic ou à la touche Entrée, jamais au survol** : le survol n'existe ni au doigt (E9) ni au clavier (E1) ; `aria-haspopup`, `aria-expanded`, fermeture à Échap et au clic dehors, focus rendu au bouton. **Les onglets ne bougent pas dans ce lot** : un troisième niveau ferait pire, et les 51 intentions de « Je veux… » pointent déjà page + onglet exacts ; un regroupement des onglets, s'il s'impose, sera un lot à part. À livrer avec : le registre `intentions.js` relu (les chemins ne changent pas, les libellés de groupe entrent dans ses mots-clés), les dix locales (trois libellés de groupe, les sous-titres de rôle), le Manuel v5 et la formation BLMF (89 diapositives montrent la barre actuelle).","pt":"**Agrupar por natureza, não por papel** : **Público** (catálogo, bibliotecas, cartografia, tesauro), **Eu** (minha conta, «Quero…»), **Trabalho** (painel, catalogação, importações, biblioteca, federação, rede — cada entrada sob o mesmo `canSee*`, o grupo só aparece se tiver entradas). **Menus ao clique ou Enter, nunca ao passar do rato** (E9, E1), com `aria-haspopup`/`aria-expanded`, Esc, foco devolvido. **Os separadores não mudam neste lote.** Entregar com o registo `intentions.js` relido, as dez locales, o Manual v5 e a formação BLMF."},"y":{"fr":"Une barre de douze liens sans hiérarchie se lit en la parcourant, pas en la regardant — et c'est exactement ce qu'on demande à une coordination le premier soir de sa formation. Grouper par nature tient quel que soit le nombre de rôles d'une personne ; grouper par rôle se casse dès qu'elle en a deux. Et un menu au clic marche partout où l'app tourne, un menu au survol seulement à la souris.","pt":"Uma barra de doze ligações sem hierarquia lê-se percorrendo, não olhando. Agrupar por natureza resiste ao número de papéis de uma pessoa ; ao clique funciona onde a app corre."},"f":{"fr":["La barre n'expose plus que les liens directs (Catalogue) et trois boutons de groupe ; chaque groupe s'ouvre au clic et au clavier, se ferme à Échap, et ne montre que ce que le rôle ouvre.","Une inconnue non connectée ne voit ni Moi ni Travail ; une lectrice voit Moi ; une bibliothécaire voit Travail avec Panneau et Catalogage ; une coordination y voit aussi Importations, Bibliothèque, Fédération ; l'admin réseau y voit Réseau.","Aucun chemin ne change : les 51 intentions de « Je veux… » et les liens profonds du Manuel v5 restent valides (test à liste fermée d'`intentions.js` vert).","Dix locales pour les libellés de groupe et de rôle, parité stricte.","Sur 360 px, la barre tient sans débordement et les menus se ferment au toucher hors du menu.","Le Manuel v5 et le conducteur de la formation montrent la nouvelle barre — **ou** le lot est daté après la dernière soirée de formation."],"pt":["A barra só expõe as ligações diretas e três botões de grupo ; cada grupo abre ao clique e ao teclado, fecha em Esc, e só mostra o que o papel abre.","Uma desconhecida não vê Eu nem Trabalho ; uma leitora vê Eu ; uma bibliotecária vê Trabalho com Painel e Catalogação ; uma coordenação também Importações, Biblioteca, Federação ; a admin de rede vê Rede.","Nenhum caminho muda : intenções e ligações profundas continuam válidas.","Dez locales, paridade estrita.","A 360 px a barra cabe.","Manual v5 e guião da formação atualizados — ou lote datado depois da última noite de formação."]},"dep":{"fr":"Après **E9** (mobile) de préférence, ou avec lui ; même exigence de regard extérieur que **E1**. **Ne pas livrer pendant la formation BLMF** (sept soirées à partir du 08/09) : la barre est sur les diapositives — à dater après la dernière soirée, ou à montrer aux coordinations comme changement annoncé. Gel du code jusqu'au 14/09.","pt":"Depois de **E9** de preferência ; mesma exigência de olhar externo que **E1**. **Não entregar durante a formação BLMF** (sete noites a partir de 08/09). Congelamento até 14/09."},"r":["src/components/layout/index.jsx","src/lib/roles.js (canSee*)","src/pages/inicio (intentions.js)","anarbib-rede-perimetre-admins (doctrine : une porte se pose dans la page du geste, pas dans la barre)","K7 (formation BLMF)"],"verif":{"fr":"08/09 — barre relue : sept liens publics ou personnels + jusqu'à six liens de travail selon `canSee*` (`roles.js` : Painel et Catalogage dès `librarian`, Importations et Bibliothèque dès `coordenador`, Fédération pour tout rôle, Réseau pour l'admin réseau). Onglets comptés : Mon compte 9, Bibliothèque 12, Réseau 15, Fédération 8. Le lien Réseau reste réservé aux admins (décision du 02/09) : le regroupement n'y change rien. **15/09 — un des six liens de Travail a changé de nom** : « Bibliothèque » (`/biblioteca`) s'appelle « Gestion de la bibliothèque » (Xavier, `09165764`, REGISTRE 0.36 `PUBLIB-NAV-2`) — deux liens homonymes au singulier et au pluriel ne disaient pas ce qu'on y trouve. Le groupe Travail listera donc Panneau, Catalogage, Importations, **Gestion de la bibliothèque**, Fédération, Réseau ; les 89 diapositives BLMF montrent l'ancien mot et la barre d'avant : à reprendre dans ce lot.","pt":"08/09 — barra relida : sete ligações públicas ou pessoais + até seis de trabalho segundo `canSee*`. Separadores : Minha conta 9, Biblioteca 12, Rede 15, Federação 8. Rede continua reservada às admins (02/09). **15/09 — uma das seis ligações de Trabalho mudou de nome** : « Biblioteca » (`/biblioteca`) chama-se « Gestão da biblioteca » (Xavier, `09165764`, REGISTRE 0.36 `PUBLIB-NAV-2`). O grupo Trabalho listará Painel, Catalogação, Importações, **Gestão da biblioteca**, Federação, Rede ; os 89 diapositivos BLMF mostram a palavra antiga : retomar neste lote."}},{"id":"B27","d":"B","p":"P1","s":"en-cours","e":"M","sk":["sql"],"t":{"fr":"`api.catalog_works_v1` dépasse le délai de 3 s du rôle anonyme : le catalogue par œuvre échoue en silence et la page retombe sur la liste à plat","pt":"`api.catalog_works_v1` ultrapassa o prazo de 3 s do papel anónimo: o catálogo por obra falha em silêncio e a página recai na lista plana"},"v":{"fr":"**Constaté le 20/09/2026** en vérifiant E17 à l'écran. La console du catalogue portait des erreurs 500 ; les journaux edge les attribuent toutes à `POST /rest/v1/rpc/catalog_works_v1` — 13 en 12 minutes, depuis deux aperçus locaux branchés sur la production — et `postgres_logs` porte, une pour une, 13 erreurs **`57014 canceling statement due to statement timeout`** (rôle `authenticator`), le plus souvent par salves de **quatre dans la même seconde** (trois salves de quatre à 11 h 52, 11 h 59 et 12 h 01 UTC, puis un appel isolé à 12 h 03). Mesuré : `anon → statement_timeout=3s`, `authenticated → 8s`. La fonction est `api.catalog_works_v1(p_filters jsonb, p_sort text, p_offset integer, p_limit integer, p_lang text)`, INVOKER, STABLE. Le volume est minuscule — 2 449 œuvres, 2 656 notices, 2 651 lignes dans `mv_books_catalog_list_v1` : plus de trois secondes sur si peu de lignes, c'est un plan, pas une taille. **Rien ne se voit à l'écran** : le front retombe sur `catalog_list_anon_v1` et affiche 91 notices ; c'est le regroupement par œuvre (OPAC par œuvre, 04-05/09) qui ne sert pas. Treize appels anonymes sur treize ont échoué, contre la vraie base : **le chemin par œuvre échoue aujourd'hui pour un·e visiteur·se anonyme.** Le premier des deux aperçus servait `main` sans E17 : E17 n'y est pour rien. **Ce qui n'est pas établi** : depuis quand ; si un compte connecté passe dans ses 8 s ; pourquoi quatre appels par chargement. Aucun 500 ne vient de `app.anarbib.org` sur les trois heures relevées — mais aucune connexion n'a eu lieu depuis le 16/09 à 18 h 31 UTC (relu le 20/09 à 14 h) : l'absence d'erreur peut n'être qu'une absence de trafic. Pour qui fera le diagnostic, lu dans `pg_proc.prosrc` le 20/09 : corps en PL/pgSQL de 9 435 caractères, qui appelle `fn_volume_rank` et `fn_work_display_title` et lit `public.books`, `public.book_subjects` et `public.subjects` — des faits, pas une cause.","pt":"**Constatado em 20/09/2026** ao verificar E17 na tela. A consola do catálogo tinha erros 500; os registos edge atribuem-nos todos a `POST /rest/v1/rpc/catalog_works_v1` — 13 em 12 minutos — e `postgres_logs` tem, um por um, 13 erros **`57014 canceling statement due to statement timeout`**, em rajadas de **quatro por carregamento de página**. Medido: `anon → statement_timeout=3s`, `authenticated → 8s`. O volume é minúsculo — 2 449 obras, 2 656 registos: mais de três segundos em tão poucas linhas é um plano, não um tamanho. **Nada se vê na tela**: o front recai em `catalog_list_anon_v1` e mostra 91 registos; é o agrupamento por obra que não serve. Treze chamadas anónimas em treze falharam, contra a base real. O primeiro dos dois pré-visualizadores servia `main` sem E17. **O que não está estabelecido**: desde quando; se uma conta ligada passa nos seus 8 s; porquê quatro chamadas por carregamento."},"w":{"fr":"Mesurer avant de toucher : `EXPLAIN (ANALYZE, BUFFERS)` de l'appel que fait le front, **sous le rôle `anon`** (`set local role anon`), avec les arguments par défaut du catalogue ; dire où part le temps — planification des vues (mémoire `anarbib-capacite-plafonds-mesures`), fonction appelée par ligne, tri. Compter les appels réels du front au chargement (quatre ?) et dire pourquoi. Puis corriger la requête — **pas** relever le délai du rôle anonyme, qui est la protection du pool de 20 connexions. Et rendre l'échec visible : un repli silencieux sur la liste à plat a caché la panne ; le front devrait au moins le journaliser, et une sonde (`health-probe`) pourrait appeler la RPC en anonyme. Le code est celui du chantier OPAC par œuvre : à coordonner avec la session qui l'a écrit.","pt":"Medir antes de tocar: `EXPLAIN (ANALYZE, BUFFERS)` da chamada que o front faz, **sob o papel `anon`**, com os argumentos por defeito; dizer para onde vai o tempo. Contar as chamadas reais do front ao carregar (quatro?) e dizer porquê. Depois corrigir a consulta — **não** aumentar o prazo do papel anónimo, que protege o pool de 20 conexões. E tornar a falha visível: um recuo silencioso para a lista plana escondeu a avaria."},"y":{"fr":"L'OPAC par œuvre est le chantier phare de septembre (douze migrations, un manuel en dix langues) et c'est la porte d'entrée publique du réseau. S'il ne sert qu'aux comptes connectés — ou à personne —, tout le travail de regroupement des éditions est invisible à celles et ceux pour qui il a été fait. Et une panne que le repli masque parfaitement est une panne qui dure.","pt":"O OPAC por obra é a obra principal de setembro e é a porta de entrada pública da rede. Se só serve contas ligadas — ou ninguém —, todo o trabalho de agrupamento das edições é invisível para quem foi feito. E uma avaria que o recuo esconde perfeitamente é uma avaria que dura."},"f":{"fr":["Un appel anonyme de `catalog_works_v1` avec les arguments du premier chargement répond en moins de 3 s — mesuré, avec le plan consigné.","Plus aucun `57014` sur cette RPC dans `postgres_logs` pendant une journée de trafic réel.","Le front ne retombe plus en silence : l'échec de la RPC est journalisé, et quelque chose le surveille."],"pt":["Uma chamada anónima de `catalog_works_v1` com os argumentos do primeiro carregamento responde em menos de 3 s — medido, com o plano registado.","Mais nenhum `57014` nesta RPC em `postgres_logs` durante um dia de tráfego real.","O front já não recai em silêncio: a falha da RPC é registada, e algo a vigia."]},"dep":{"fr":"Trouvé en vérifiant **E17**. Touche **C11** et le chantier OPAC par œuvre ; cousin de **B10** (hygiène de performance) et de la mémoire sur les plafonds de capacité (coût de planification des vues).","pt":"Encontrado ao verificar **E17**. Toca **C11** e a obra OPAC por obra; primo de **B10**."},"r":["api.catalog_works_v1","src/pages/public/CatalogPage.jsx (worksServer, repli)","src/lib/catalogueFallback.js","anarbib-capacite-plafonds-mesures"],"verif":[{"fr":"20/09 — `edge_logs` : 13 × 500 sur `catalog_works_v1` entre 11 h 51 et 12 h 03 UTC (referers `localhost:5180` et `:5181`) ; `postgres_logs` : 13 × `57014` aux mêmes secondes ; `pg_roles` : `anon` 3 s, `authenticated` 8 s ; page affichée : 91 notices par le repli.","pt":"20/09 — `edge_logs`: 13 × 500 em `catalog_works_v1` entre 11h51 e 12h03 UTC; `postgres_logs`: 13 × `57014` nos mesmos segundos; `pg_roles`: `anon` 3 s, `authenticated` 8 s; página mostrada: 91 registos pelo recuo."},{"fr":"21/09 — **diagnostiqué, réparé et vérifié en production ; deux critères sur trois tenus, le troisième attend une journée de trafic.** *Mesuré avant* (sous `set local role anon`, page par défaut du front) : 1 œuvre = 2 106 ms, 50 œuvres = **3 533 ms** et 579 758 blocs temporaires lus (~4,4 Go), 200 œuvres = **27 311 ms** et 9 126 308 blocs (~70 Go) ; la vue seule rend ses 2 651 lignes en 5 ms. *Deux causes, dans la requête* : (1) un coût **quadratique** — `library_names` relisait tout le CTE `filtered` pour CHAQUE groupe de la page, et `filtered` traînait la ligne entière de la vue en jsonb ; (2) un plancher de **1,3 s** — `fn_work_display_title` appelée une fois par œuvre du catalogue (2 449 appels, 1 311 ms mesurés à part), parce que le tri par défaut porte sur le titre affiché. *Réparé* par la migration `20260921111344` (`1fb565b2`) : `src` sans `row_json`, titre affiché en un passage (même cascade que la fonction — équivalence vérifiée sur 2 449 œuvres × 10 locales, **24 490 comparaisons, 0 différence**), éditions et bibliothèques lues sur les seules lignes de la page. La requête neuve rendait, avant d'être appliquée, un jsonb **égal** à celui de l'ancienne fonction. Corps dérivé du corps réel (dépôt = prod, même md5) par six modifications comptées ; la requête reste dynamique, une seule vue nommée à la fois. *Mesuré après, en production, sous le vrai délai de 3 s* : 50 œuvres = **380 ms**, 200 = **460 ms**, plus aucun fichier temporaire ; par l'API REST avec la clé anonyme : HTTP 200 en 0,6 à 0,9 s, 2 435 œuvres au total. **Premier « fini quand » : tenu** (plan consigné dans l'en-tête de la migration). **Troisième : tenu côté surveillance** — la sonde `catalogue_par_oeuvre` de `health-probe` (`5111ac5f`) appelle
