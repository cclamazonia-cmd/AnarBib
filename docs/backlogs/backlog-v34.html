iante latin-1 de l'export PMB donne exactement les mêmes notices que l'UTF-8 (`pmb-fixtures-parseur`, banc de la vraie EF `process-partner-catalog-import-banc`) ; suite SQL `import_encodage_overrides_tests` 6/6. Reste : un import réel en latin-1 en production, et le panneau vu à l'écran par une coordination.","pt":"26/09 — a variante latin-1 dá exatamente os mesmos registros que o UTF-8 (testes nas fixtures PMB e banco da EF real); suíte SQL 6/6. Falta: uma importação latin-1 real em produção e o painel visto na tela."}},{"id":"H16","d":"H","p":"P1","s":"a-verifier","e":"M","sk":["deno","sql","front"],"t":{"fr":"Un rapport de couverture par import : chaque zone du fichier que l'import ne reprend pas est comptée et montrée","pt":"Um relatório de cobertura por importação: cada zona do arquivo que a importação não aproveita é contada e mostrada"},"v":{"fr":"L'enregistrement brut est bien gardé : `ingest.partner_catalog_staging_rows.raw_payload`, recopié en `book_drafts.marc_json` par `ingest.fn_create_book_drafts_from_import_rows`, puis en `books.marc_json` à la publication (2 250 brouillons en portent un au 26/09). Mais **rien ne dit quelles zones ont été laissées de côté**. Aujourd'hui la perte ne se voit pas : ni dans Importações, ni dans le rapport de révision de lot (`fn_batch_review_report`). **Depuis H15 (26/09)**, `summary` porte déjà `encoding`, `warnings` et `adapter` : la couverture s'y range à côté. Relevé du 26/09 : l'import Solidaires (run 29, 1 673 lignes CSV) n'a reconnu que **4 colonnes sur 17** (`titulo`, `autor`, `idioma`, `numero`) — `tipo_material`, `assunto_local`, `subtitulo_sugerido` et dix autres ont été ignorées sans un mot.","pt":"O registro bruto é guardado (`raw_payload` → `book_drafts.marc_json` → `books.marc_json`; 2 250 rascunhos com ele em 26/09), mas **nada diz quais zonas foram deixadas de lado**. A perda não aparece nem em Importações nem no relatório de revisão de lote."},"w":{"fr":"Au parse, calculer pour chaque run l'inventaire des zones et sous-zones : présentes, reprises, ignorées, avec leur nombre d'occurrences et un exemple. Pour un CSV, lister les colonnes non mappées. Le stocker dans `partner_catalog_import_runs.summary`. L'afficher dans Importations et le joindre à `fn_batch_review_report`. Le rendre téléchargeable, pour l'envoyer tel quel à la bibliothèque (c'est le compte rendu promis à DIRA). Dix locales. **Livré le 26/09** (`c38e400b`, `4be5fee9`, migration `20260926194500`) : `marcCoverage` (seule référence : la table de zones du dialecte ; `surplus` = répétitions non reprises), `csvCoverage`/`risCoverage` (alias CSV sortis de `mapRecord` en une seule liste ; « indice » = colonnes et balises relues par le SQL : collection, cote locale), `summary.coverage`/`coverage_counts`/`skipped_rows` ; `fn_batch_review_report` gagne `coverage` (seuls les éléments non repris, corps extrait du banc au md5 de la prod) ; écran : panneau « ce que l'import a repris du fichier », section du rapport de révision, **CSV téléchargeable** (le compte rendu à renvoyer à DIRA), 16 clés × 10 locales. Mesuré sur l'export PMB : 111 sous-zones, 17 reprises ; 995, 215, 225, 330, 676 en brut. **Reste** : le moissonnage OAI (`harvest-oai-pmh`, par lots sur un même run) n'écrit pas encore de couverture ; le panneau vu à l'écran sur un import réel.","pt":"No parse, calcular por run o inventário de zonas/subzonas (presentes, aproveitadas, ignoradas, ocorrências, exemplo); para CSV, colunas não mapeadas. Guardar em `summary`, mostrar em Importações, anexar a `fn_batch_review_report`, baixável para enviar à biblioteca. Dez locales. **Entregue em 26/09**: cobertura MARC/CSV/RIS no `summary` do run, chave `coverage` no relatório de revisão, painel na tela e **CSV para baixar**, 10 locales. Medido no export PMB: 111 subcampos, 17 aproveitados. **Falta**: a coleta OAI ainda não escreve cobertura; ver o painel numa importação real."},"y":{"fr":"C'est ce qui rend l'import **sûr** : rien ne se perd sans qu'on le voie. Et c'est aussi la liste de travail de **H17**, tirée des catalogues réels plutôt que d'une norme lue de loin.","pt":"É o que torna a importação **segura**: nada se perde sem ser visto. E é a lista de trabalho de **H17**, tirada de catálogos reais."},"f":{"fr":["Rapport visible pour un import MARC et pour un import CSV.","Joint au rapport de révision de lot.","Téléchargeable ; dix locales ; test."],"pt":["Relatório visível para uma importação MARC e uma CSV.","Anexado ao relatório de revisão de lote.","Baixável; dez locales; teste."]},"dep":{"fr":"Avant **H17** (il dit quelles zones comptent).","pt":"Antes de **H17** (diz quais zonas importam)."},"r":["claude/aller-retour-PMB_2026-09-26","Réponse à DIRA du 26/09/2026"],"verif":{"fr":"26/09 — suite SQL `import_couverture_tests` 5/5 ; banc de la vraie EF sur l'export PMB et sur un CSV (lignes écartées comptées) ; écran rendu avec les locales fr et el (`import-coverage-ecran`). Déployé le 26/09 au soir : migration `20260926194500` appliquée par la CI (`created_by` vide), `fn_batch_review_report` porte `coverage` en production, droits inchangés (pas anon) ; EF redéployées (`deployed-functions` = `4be5fee9`), sondées au démarrage.","pt":"26/09 — suíte SQL 5/5; banco da EF real no export PMB e num CSV; tela renderizada em fr e el. Implantado em 26/09 à noite: migração aplicada pela CI, `coverage` presente em produção, EF reimplantadas e sondadas."}},{"id":"H21","d":"H","p":"P2","s":"en-cours","e":"L","sk":["sql","deno","front"],"t":{"fr":"Réimporter un catalogue met à jour ce que l'import connaît déjà au lieu de le dupliquer","pt":"Reimportar um catálogo atualiza o que a importação já conhece em vez de duplicá-lo"},"v":{"fr":"La marche en parallèle promise à DIRA suppose qu'elle continue de cataloguer dans PMB et qu'on réimporte. Aujourd'hui, un réimport repasse par la détection de doublons, puis par la révision : il n'existe aucune notion de « notice déjà importée, à mettre à jour ». `book_drafts.action` connaît pourtant `update` (valeur présente en base).","pt":"A marcha em paralelo supõe continuar catalogando no PMB e reimportar. Hoje, um reimport passa pela detecção de duplicatas: não há noção de «registro já importado, a atualizar». `book_drafts.action` já conhece `update`."},"w":{"fr":"Rapprocher d'abord par `(bibliothèque, identifiant d'origine)` (**H20**). Produire des brouillons `update` avec la différence montrée en révision de lot. Traiter les exemplaires ajoutés et retirés. Quand une notice a été modifiée dans AnarBib depuis l'import, la signaler en conflit : **jamais d'écrasement silencieux**. **Décidé le 29/09 par Xavier (REGISTRE `IMP-26`, précise `IMP-23`)** : reprendre une notice à la main est réservé à ses détentrices ; une divergence trouvée sur une notice partagée est traitée par n'importe quelle détentrice, et l'écarter fait avancer la base ; « retiré » est un constat réversible (non prêtable, masqué à l'OPAC, exclu de l'export, jamais supprimé), proposé seulement pour les exemplaires venus de la même source, d'un fichier MARC à exemplaires déclaré « export complet » ; H21 vise DIRA seule (MLEG ne réimportera pas) ; `accept_duplicate` veut dire « rattaché », jamais une création. **Plan en neuf lots**, chacun livrable et prouvé au banc : 0 préalables (porte de révision, promotion de la seule sélection, `accept_duplicate`, identifiant d'origine jugé à la ligne), 1 reconnaître une notice déjà importée, 2 garder la base de ce que le dernier import a apporté, 3 comparer à trois états, 4 brouillon de mise à jour pour une seule détentrice, 5 notice partagée signalée sans réécriture, 6 exemplaires ajoutés, modifiés, déplacés, 7 retirés, 8 bout en bout sur les fixtures PMB.","pt":"Aproximar por `(biblioteca, identificador de origem)`; rascunhos `update` com a diferença mostrada na revisão; exemplares acrescentados/retirados; conflito se o registro foi editado no AnarBib — **nunca sobrescrever em silêncio**. **Decidido em 29/09 por Xavier (REGISTRE `IMP-26`)**: retomar um registro à mão é reservado às bibliotecas que o detêm; uma divergência num registro compartilhado é tratada por qualquer detentora, e descartá-la faz avançar a base; «retirado» é uma constatação reversível (não emprestável, oculto no OPAC, fora do export, nunca apagado), proposta só para exemplares vindos da mesma fonte, num arquivo MARC declarado «export completo»; H21 visa só a DIRA; `accept_duplicate` quer dizer «vinculado», nunca uma criação. **Plano em nove lotes** (0 a 8)."},"y":{"fr":"Sans réimport incrémental, la marche en parallèle se réduit à ressaisir deux fois ou à dupliquer. Autrement dit, elle est impraticable. Et PMB ne peut rester un filet que s'il reste la base vivante.","pt":"Sem reimport incremental, a marcha em paralelo é impraticável."},"f":{"fr":["Réimporter la fixture modifiée ne crée aucun doublon et montre les différences.","Un conflit est signalé, pas écrasé."],"pt":["Reimportar a fixture modificada não cria duplicatas e mostra as diferenças.","Conflito sinalizado, não sobrescrito."]},"dep":{"fr":"Après **H20** et **H19**. Avant toute bascule (**G15**).","pt":"Depois de **H20** e **H19**. Antes de qualquer migração."},"r":["claude/aller-retour-PMB_2026-09-26","Réponse à DIRA du 26/09/2026"],"verif":{"fr":"26/09 — `book_drafts.action` ∈ {create, update} en base. **29/09** — passé en cours par `69dbeec7` ; aucun des neuf lots n'est livré au soir du 29/09. Constat de production qui a demandé la règle (REGISTRE `IMP-26` a, 28/09) : 198 mises à jour publiées, dont 33 sur des notices aujourd'hui partagées et 3 par une bibliothèque qui ne détenait pas la notice. Le tableau de couverture le dit à DIRA : le 001 est gardé et rendu à l'export, mais un réimport ne s'en sert pas encore (`docs/interop/couverture-pmb.md`, `466324aa`). **01/10 — lot 0 livré** (`1385431b` base, `d4f97afc` écran ; migration `20261001200931` appliquée par la CI, `created_by` vide ; REGISTRE `IMP-27`) : une notice ou un exemplaire rapproché né d’un import ne se publie la première fois que dans un lot révisé, même sorti de son lot ; une notice ou un exemplaire déjà publiés (et au catalogue) se republient hors lot ; l’approbation couvre les brouillons figés à la demande, et la coordination redemande un tour pour les ajouts ; un lot de rapprochement passe par la révision ; une sélection rejoint le lot ouvert du run et « Promouvoir la sélection » ne promeut qu’elle ; « rattaché » ne devient jamais une notice ; vider la corbeille d’un brouillon importé écarte sa ligne, que seul le rejeu de ce brouillon reprend ; « Retraiter » refusé tout de suite pour un run qui a une ligne écartée ou un exemplaire rapproché à la corbeille ; l’écran dit les lignes ignorées. Six passes de revue contradictoire ; SQL 158/158, vitest 1 666 ; vérifié en production le 01/10 (définitions, cinq déclencheurs, droits, 0 tour sans liste) et l’écran servi. **Consigné** : la course entre « Retraiter » accepté et l’effacement par l’edge function, et « Retraiter » d’un run sans fichier (**H30**, **H31**) ; les fusions `api.merge_*` qui absorbent un brouillon importé (lot 5) ; la corbeille d’un exemplaire rapproché libère sa ligne, qu’un nouveau « Rapprocher » puis la sortie de corbeille dédoublent (lot 6) ; l’assistant d’import ne lit pas `skipped_rows` ; une ligne dont la notice proposée a été descartée reste « en attente » sans autre geste que « Rejeter » ; un onglet resté sur un run supprimé reçoit « Run N introuvable » en brut. **À trancher par Xavier** : un exemplaire rattaché sorti de la corbeille après la demande doit-il suivre la liste du tour, comme les notices (aujourd’hui non, règle de H19) ? Après une réattribution, la notice garde-t-elle pour la bibliothèque cible l’identifiant d’origine venu du PMB de la première ? **05/10 — lot 1 livré** (`32afb117` base, `ba6ec496` écran ; migration `20261005103427` appliquée par la CI ; REGISTRE `IMP-28`) : une ligne réimportée dont l’identifiant d’origine est connu pour la bibliothèque qui importe, toutes sources, sur une seule notice, devient « Déjà importée » (`known_record`) sans passes floues ; elle se rapproche (exemplaires sur la notice reconnue) ou se rejette, jamais de notice neuve ni de mise à jour ; « plus détenue par ta bibliothèque » est signalé ; l’identifiant d’origine reste à la bibliothèque dont le PMB l’a émis (plus de recopie à la réattribution) ; un exemplaire rattaché sorti de la corbeille après la demande attend un nouveau tour, et « Publier le lot » ne le publie qu’une fois couvert. Critère d’acceptation : la fixture PMB réimportée telle quelle donne 64 « Déjà importée » sur 64, 0 nouveauté, 0 doublon possible (sans la reconnaissance : 33 « déjà au catalogue », 19 nouveautés, 12 doublons possibles). SQL 167/167, vitest 1 905. **Relevé en chemin, consigné (05/10, à la demande de Xavier)** : (1) l’avertissement « clé connue sur plusieurs notices » (`warnings[].kind = known_record_ambiguous`) n’est affiché nulle part à l’écran — la page Importations ne montre aucun avertissement de ligne ; (2) tant qu’un exemplaire rattaché attend son tour, republier sa notice est refusé (`error.publish.items_on_update`, garde de H19) : la règle IMP-28 (d) rend ce cas plus fréquent ; (3) la vue héritée `api.partner_catalog_import_rows_workflow_ui` ne connaît pas `known_record` (« sem classificação », `can_create_draft` faux) — lisible par service_role seulement, aucun écran ne l’utilise. **Relevé par la revue du lot 1, consigné** : (4) un exemplaire rattaché sorti de la corbeille APRÈS la fermeture de son lot est coincé — `added_after_review`, mais la redemande de tour répond `error.review.batch_not_open` ; issue : ranger la notice publiée dans un lot ouvert (0 cas en production le 05/10) ; (5) republier un rattaché déjà publié est refusé (`review_required`) pendant qu’un nouveau tour est demandé sur son lot, comme une notice ; (6) un dépôt sans bibliothèque de destination ne pose aucun identifiant d’origine, ses lignes ne seront jamais reconnues ; (7) pour un dépôt, « déjà importée par ta bibliothèque » est inexact (c’est la destination), et l’assistant affiche une confiance ×100 (« 10000% », défaut antérieur). **05/10 — lot 2 livré** (`84c455cd`, migration `20261005172708` appliquée par la CI, `created_by` vide ; REGISTRE `IMP-29`) : `ingest.book_import_baselines` garde, par identifiant d’origine, ce que le dernier fichier accepté a apporté (colonnes AnarBib, responsabilités, sujets, enregistrement d’origine, empreinte) pour la bibliothèque qui a importé ; une seule règle de correspondance (`ingest.fn_import_row_as_book`, appelée par la création — brouillons identiques avant/après : fixture PMB figée, définition d’avant rejouée, 1 475 écritures espionnées) ; base écrite à la publication, à l’absorption (qui l’avance) et au rapprochement (qui la crée seulement) ; la bibliothèque importatrice se rabat, pour une source sans bibliothèque (MLEG), sur celle qui porte déjà ses identifiants, puis sur celle du brouillon (147 brouillons MLEG en attente auraient sinon été publiés sans identifiant ni base — défaut présent depuis le lot 1) ; l’export lit d’abord la base (identique au caractère près). Vérifié en production : 264 bases reprises pour 264 identifiants, champs douteux marqués, table fermée à l’API. SQL 170/170, vitest 1 993. **Consigné** : (1) la reconnaissance du lot 1 et la liste de l’écran ne connaissent pas le repli des sources sans bibliothèque (un run MLEG n’y serait pas reconnu ; MLEG ne réimporte pas, IMP-26) ; (2) aucun accès de lecture staff à la base (RPC à prévoir au lot 3) ; (3) `publish_catalog_batch` publie sans ORDER BY : identifiants de notice et tombos dépendent du plan ; (4) la reconstitution d’une base depuis `marc_json.ingest` (après une restauration sans le schéma ingest) est approximative (8 lignes CSV sur 2 160 diffèrent) ; (5) `fn_h21_base_du_brouillon` se laisse tromper par une copie dont la trace a été retouchée — la protection vient de ce que la copie n’a pas de clé (lot 1) ; (6) le schéma ingest n’est sauvegardé par aucun flux — décision de Xavier du 05/10 : l’ajouter au flux long (item séparé). **05/10, soir** — le point consigné « le schéma `ingest` n'a pas de sauvegarde » est réglé : **I29**, clos le 05/10 (`f5e3f5ed`) ; les droits et les schémas `private` et `api`, vus en chemin, sont **I30**. **06/10 — lot 3 livré** (`e8101139`, migration `20261006182421` appliquée par la CI le 06/10 après `f6bb60e5`, `created_by` vide ; REGISTRE `IMP-30`) : chaque ligne reconnue compare 24 champs entre la base, AnarBib et le fichier (responsabilités par `book_contributors`, jamais `autor` ; vedettes non comparées tant que l’import ne les verse pas au thésaurus — décision de Xavier du 06/10) ; six verdicts ; aucune écriture au catalogue ; calcul par `fn_import_recomparer` (coordination, administration), par pages de 200 depuis l’écran, jamais pendant le rapprochement (plafond de 8 s des appels de l’API) ; détail par `fn_import_row_comparison`, valeurs AnarBib masquées pour une notice hors de vue ; section `updates` du rapport de révision, lue dans le stocké ; à l’écran, « N changements dans le fichier, dont M conflits ». Page de 200 lignes < 1 s au banc ; SQL 174/174, vitest 2 048 ; un sceptique (deux bloquants corrigés). **Consigné** : `proposed_title` de la liste montre déjà le titre d’une notice hors de vue (antérieur) ; une retouche faite dans AnarBib après le calcul n’est vue qu’au recalcul suivant (une fusion, elle, est détectée) ; une migration qui redéfinit la correspondance ou `normalize_author_alias` invalide les N gardés (recalcul complet, par pages) ; T14 mesure le recalcul du run entier sans l’exiger. Le job `app` de `e8101139` est tombé à cause de `81c17016` (D9, autre session), qui avait corrigé à la main la suite SQL engendrée de la preuve PMB : générateur réparé par `f6bb60e5`. **06/10 — lot 4 livré** (`44ae324a`, migration `20261006203239` appliquée par la CI, `created_by` vide ; REGISTRE `IMP-31`) : geste « Préparer la mise à jour » (`fn_import_preparer_mises_a_jour`, pages de 200, coordination de la bibliothèque du run ou administration ; dépôt et OAI à l’administration) ; seule la bibliothèque **seule détentrice** reçoit un brouillon, copie complète de la notice patchée des seuls champs « changés dans le fichier seulement » ; responsabilités et champs vidés par la source montrés, jamais appliqués ; conflit, sans base, local seul jamais appliqués ; raisons d’écart comptées (partagee, plus_detenue, deja_preparee, rien_a_appliquer…). Trace dans `marc_json.ingest_update`, provenance de la notice intacte. `publish_book_draft` refuse si la notice a changé, est devenue partagée, a disparu, si sa base, sa `bib_ref`, la ligne ou l’identifiant d’origine ont bougé ; à la republication, détention et `bib_ref` sont rejugées ; `api.merge_draft_into_book` refuse un brouillon de mise à jour. La base avance pour les champs appliqués ou égaux, pas pour les autres (règle d). « Préparer » et « Rapprocher » indépendants ; le rejet automatique de H19 (« tous les exemplaires déjà là ») ne bloque pas. Page de 200 lignes en 2,8 s au banc ; SQL 177/177 (lot 4 : 26), vitest 2 111, 44 mutants tués ; un sceptique (deux bloquants corrigés : notice retirée qui renaissait à la publication, republication qui réécrivait une notice devenue partagée). **Consigné** : `publish_catalog_batch` échoue en bloc si un seul brouillon de mise à jour est refusé (même défaut que le piège 11) ; le rejet automatique de H19 est reconnu au texte de sa note ; une ligne disparue (Retraiter, run supprimé) rend le brouillon impubliable et laisse la notice en `deja_preparee` tant qu’on ne le supprime pas ; une retouche par l’API après approbation se publie sans nouveau tour (piège 15) ; republier son propre brouillon après des retouches à la notice (non partagée) les écrase, comme toute reprise (piège 17). **07/10 — lot 5 livré** (`2cb5fd31`, migration `20261007175456` appliquée par la CI, `created_by` vide ; REGISTRE `IMP-32`) : sur une notice partagée, le recalcul pose une divergence par champ (`ingest.book_import_divergences`, au flux long BG2), jamais d’écriture au catalogue ; la coordination de chaque détentrice et l’administration la voient (onglet « Divergences » du catalogage avec pastille, bandeau sur la notice dans l’éditeur ; seules les valeurs bibliographiques des champs ; librarian, lectrice et non-détentrice ne voient rien) ; champ par champ, « Écarter » (la base avance pour ce champ) ou « Appliquer » (brouillon de reprise prérempli pour la bibliothèque active détentrice, responsabilités et effacements jamais préremplis) ; publication refusée si la notice a changé, a disparu, n’est plus détenue, si sa `bib_ref` a changé (détention et `bib_ref` rejugées à la republication) ; `merge_draft_into_book` refuse ; résolue quand AnarBib rejoint le fichier, caduque quand la notice n’est plus partagée ; écartée au même N, pas de nouveau signal. Corrigé au passage (sceptique) : la copie du lot 4 oubliait `circulation_default` (une notice en consultation devenait empruntable à la publication ; aucun brouillon de mise à jour n’existait encore en production) ; une trace d’import (`ingest_update`, `ingest_divergence`) posée par l’API à l’INSERT d’un brouillon bloquait « Appliquer » ou « Préparer » d’une autre bibliothèque → refusée (`error.import.trace_reserved`). SQL 179/179 (lot 5 : 22, lot 4 : 27), vitest 2 151, 60 mutants tués, recalcul d’une page de 200 < 0,7 s. **Consigné** : le constat ne part que quand la bibliothèque qui importe (ou l’administration) ouvre son run dans Importations (calcul par pages depuis l’écran, décision du lot 3) — IMP-26 b n’est vrai qu’à cette condition ; un librarian d’une détentrice publie le brouillon prérempli que seule la coordination peut créer (règle B29 de la publication ; pas une élévation : il retouche déjà la notice) — à trancher par Xavier ; une bibliothèque qui a deux sources sur la même notice fait alterner la base de la divergence, écarter n’avance que la dernière vue ; écarter `contributors` réécrit les responsabilités de la base sous la forme {position, name, role} (effet sur les autres lecteurs de la base non vérifié) ; une valeur retouchée dans le brouillon laisse la divergence ouverte ; pas de notification (mail, cloche) aux détentrices. **08/10 — lot 6a livré** (`e225f463`, migration `20261008173955` appliquée par la CI, `created_by` vide ; REGISTRE `IMP-33`, qui coupe le lot 6 en 6a « reconnaître » et 6b « cote et note comme les notices ») : l’analyse MARC lit l’`expl_id` de la 996 (apparié à sa 995 par le code-barres ; 996 orpheline ou sans $9 = rien, jamais d’erreur ; correspondance surchargeable par le profil) ; `exemplares` et `exemplar_drafts` portent `source_item_id`, `import_source_id`, `import_run_id` (trace refusée à l’API) ; constat unique `ingest.fn_h21_constat_exemplaire` à la promotion et au rapprochement, verdicts nouveau / déjà là / déjà en brouillon / sans code / déplacé / réétiqueté / code repris, seul « nouveau » crée un brouillon ; code-barres = clé par bibliothèque toutes sources, `expl_id` = second signal au sein d’une même source (index `(library_id, import_source_id, source_item_id)`) ; « Rapprocher » rejoint le lot ouvert du run ; rejet d’office seulement si la ligne n’apporte rien (texte de note inchangé) ; plus d’exemplaire implicite pour une ligne MARC qui n’en décrit pas (défaut hérité de H19 : un doublon à chaque réimport) ; plus de double brouillon ; une notice nouvelle se publie même si un de ses exemplaires est pris ailleurs ; sortie de corbeille et journal refusés s’ils feraient un doublon. Écran : verdicts par exemplaire dans Importations, section « exemplaires du fichier écartés » du rapport de révision. SQL 181/181 (lot 6a : 23), vitest 2 228, 46 mutants tués, 300 exemplaires rapprochés < 1 s ; un sceptique (deux bloquants corrigés : exemplaire implicite, `expl_id` comparé entre deux PMB). **Consigné** : un profil mal réglé (`id_tag`/`id_code` constants) range tout en « déjà en brouillon » sans le dire ; après une réattribution ou un dépôt sans destination, le constat se fait dans la bibliothèque importatrice et un doublon bute à la publication de la notice entière ; la réattribution emporte code et `expl_id` dans la bibliothèque cible — les effacer suivrait IMP-28 c mais un retour (CAT-E19) les perdrait : **question pour Xavier** ; les colonnes de trace sont lisibles par anon comme le reste de l’exemplaire (numéros internes, porté à l’audit) ; le constat affiché est un instantané (pas remis à jour après publication ou corbeille) ; la promotion ne rejoint pas un lot né d’un rapprochement ; l’écran du profil ne montre pas encore `id_tag`/`id_code`/`id_prefix`. Prochain : lot 6b (base par exemplaire, trois états, cote et note appliquées par brouillon soumis à révision). **09/10 — lot 6b livré** (`22a8a8f1`, migration `20261008231259` appliquée par la CI, `created_by` vide ; REGISTRE `IMP-33` c) : base par exemplaire importé (`ingest.exemplar_import_baselines`, au flux long BG2) posée à sa première publication ; le recalcul compare base, AnarBib et fichier pour la cote et la note des exemplaires « déjà là » (six verdicts ; hors de vue, seul un état « masqué » sort, ni A ni B ni verdict fin) ; « Préparer la mise à jour » prépare aussi un brouillon par exemplaire de la bibliothèque qui importe dont un champ n’a changé que dans le fichier, dans le lot ouvert du run, même sur une notice partagée (IMP-23 b) ; conflit, retouche locale, champ vidé montrés, jamais appliqués. `publish_exemplar_draft` refuse (sept motifs) si l’exemplaire a disparu (jamais une création), changé de bibliothèque, de notice ou de fonds, bougé depuis la préparation ou depuis sa dernière publication, si la ligne ou la base ont changé, ou si la publication toucherait autre chose que cote et note (empreinte avant/après : exemplaire, fonds, prêts, réservations, récolement) ; base avancée selon IMP-31 d. Un seul brouillon vivant par exemplaire (`exemplar_drafts_maj_import_exclusive`) : « Éditer » attend la mise à jour d’import et inversement ; `merge_book_drafts` refuse. Comparaison et préparation en une passe SQL : 200 lignes × 25 exemplaires, recalcul 1,9 s et préparation 2,9 s (18,4 s avant) ; 5 000 exemplaires au plus par appel, l’écran découpe. SQL 184/184 (lot 6b : 22), vitest 2 323, 60 mutants tués sur 61 (un équivalent) ; un sceptique (republication qui écrasait un « Éditer » publié entre-temps et remettait public un exemplaire réservé au staff, « Éditer » qui effaçait la cote importée, préparation à 18 s, masquage qui laissait deviner A — corrigés). Au rebase, `« exemplar {tombo} »` porté au vocabulaire des homographes catalans (DOC-I18N-3). **Consigné** : supprimer définitivement un brouillon de mise à jour d’exemplaire n’écarte pas sa ligne (IMP-27 e ne vaut que pour les notices) ; un tel brouillon, même à la corbeille, empêche « Retraiter » et la suppression du run (`fn_h31_retraitement_refuse`), comme un exemplaire rapproché. Prochain : lot 7 (retirés).","pt":"26/09 — `action` ∈ {create, update}. **29/09** — passou para «em curso» com `69dbeec7`; nenhum dos nove lotes entregue na noite de 29/09. Constatação de produção que motivou a regra (REGISTRO `IMP-26` a, 28/09): 198 atualizações publicadas, 33 delas em registros hoje compartilhados e 3 por uma biblioteca que não detinha o registro. A tabela de cobertura o diz à DIRA: o 001 é guardado e devolvido no export, mas um reimport ainda não o usa (`docs/interop/couverture-pmb.md`, `466324aa`). **01/10 — lote 0 entregue** (`1385431b` base, `d4f97afc` tela; migração `20261001200931` aplicada pela CI, `created_by` vazio; REGISTRO `IMP-27`): um registro ou um exemplar vinculado nascido de uma importação só é publicado pela primeira vez num lote revisado, mesmo fora do lote; já publicado (e no catálogo), é republicado fora do lote; a aprovação cobre os rascunhos congelados no pedido, e a coordenação pede de novo a revisão para os acréscimos; um lote de vinculação passa pela revisão; uma seleção entra no lote aberto da importação e «Promover a seleção» só promove ela; «vinculado» nunca vira registro; esvaziar a lixeira de um rascunho importado descarta a linha, que só a restauração desse rascunho retoma; «Reprocessar» recusado na hora para uma importação com linha descartada ou exemplar vinculado na lixeira; a tela diz as linhas ignoradas. Seis passadas de revisão contraditória; SQL 158/158, vitest 1 666; verificado em produção em 01/10. **Registrado**: a corrida entre «Reprocessar» aceito e o apagamento pela edge function, e «Reprocessar» de uma importação sem arquivo (**H30**, **H31**); as fusões `api.merge_*` (lote 5); a lixeira de um exemplar vinculado libera a linha (lote 6); o assistente de importação não lê `skipped_rows`; uma linha cujo registro proposto foi descartado fica «pendente»; uma aba aberta numa importação excluída recebe «Run N introuvable» bruto. **A decidir por Xavier**: um exemplar vinculado tirado da lixeira depois do pedido deve seguir a lista da rodada? Depois de uma reatribuição, o registro guarda para a biblioteca de destino o identificador de origem vindo do PMB da primeira? **05/10 — lote 1 entregue** (`32afb117`, `ba6ec496`; migração `20261005103427`; REGISTRO `IMP-28`): uma linha reimportada cujo identificador de origem já é conhecido vira «Já importada», sem passes aproximados; vincula-se ou rejeita-se, nunca registro novo nem atualização; «não possui mais» é sinalizado; o identificador fica com a biblioteca cujo PMB o emitiu; um exemplar vinculado tirado da lixeira depois do pedido espera nova rodada. Fixture PMB reimportada: 64 «Já importada» de 64. **Registrado (05/10)**: (1) o aviso de chave ambígua não aparece na tela; (2) enquanto um exemplar vinculado espera, republicar o registro é recusado (`items_on_update`); (3) a view `api.partner_catalog_import_rows_workflow_ui` não conhece `known_record`. **05/10 — lote 2 entregue** (`84c455cd`, migração `20261005172708`; REGISTRO `IMP-29`): `ingest.book_import_baselines` guarda, por identificador de origem, o que o último arquivo aceito trouxe; uma só regra de correspondência; base escrita na publicação, na absorção (que a avança) e na vinculação (que só a cria); 264 bases retomadas em produção. **Registrado**: o esquema ingest não tem backup (decisão de 05/10: incluí-lo no fluxo longo). **05/10, à noite** — o ponto « o esquema `ingest` não tem backup » está resolvido: **I29**, fechado em 05/10 (`f5e3f5ed`); direitos e esquemas `private`/`api`: **I30**. **06/10 — lote 3 entregue** (`e8101139`, migração `20261006182421`; REGISTRO `IMP-30`): cada linha reconhecida compara 24 campos entre a base, o AnarBib e o arquivo, seis veredictos, nada aplicado; cálculo por páginas a partir da tela; valores do AnarBib mascarados para um registro fora da visão. **06/10 — lote 4 entregue** (`44ae324a`, migração `20261006203239`; REGISTRO `IMP-31`): gesto «Preparar a atualização»; só a biblioteca única detentora recebe um rascunho, cópia do registro com os campos alterados só no arquivo; autorias e campos esvaziados mostrados, nunca aplicados; publicação recusada se o registro mudou, ficou compartilhado, sumiu, ou se a base ou a `bib_ref` mudaram. **07/10 — lote 5 entregue** (`2cb5fd31`, migração `20261007175456`; REGISTRO `IMP-32`): num registro compartilhado, o recálculo aponta uma divergência por campo, nunca escreve no catálogo; cada coordenação detentora a vê (aba «Divergências», faixa no registro); campo a campo, «Descartar» (a base avança) ou «Aplicar» (rascunho pré-preenchido publicado pela detentora). **08/10 — lote 6a entregue** (`e225f463`, migração `20261008173955`; REGISTRO `IMP-33`): cada exemplar do arquivo recebe um veredicto (novo, já presente, já em rascunho, sem código, deslocado, reetiquetado, código retomado); só «novo» cria um rascunho; o `expl_id` da 996 do PMB é lido como segundo sinal. **09/10 — lote 6b entregue** (`22a8a8f1`, migração `20261008231259`): cota e nota de um exemplar comparadas em três estados; o que mudou só no arquivo se aplica por um rascunho de exemplar submetido à revisão; nunca uma criação, nunca o exemplar de outra biblioteca."}},{"id":"H26","d":"H","p":"P2","s":"a-verifier","e":"M","sk":["deno"],"t":{"fr":"L'export d'un gros catalogue ne dépend plus de la mémoire d'une edge function","pt":"O export de um catálogo grande não depende mais da memória de uma edge function"},"v":{"fr":"`export-catalog-lote` construit tout le fichier en mémoire, en une seule réponse. `export-fonds-bundle` est déjà plafonné (150 fichiers, 80 Mo) pour la même raison. **Mesuré le 26/09 en production** : le plus gros catalogue du réseau compte 2 184 détentions. Personne n'a mesuré la limite réelle. La taille du catalogue de DIRA est inconnue. **Livré le 28/09** (`8c80de27`) : la RPC d'export se lit par pages (`p_apres`, `p_limite`) et l'écran Importations assemble le fichier lui-même : plus aucune edge function ne tient le catalogue en mémoire. **Mesuré** (REGISTRE IMP-24) : 306 ms en production pour les 2 167 notices de BTL ; écriture ISO 2709 de 2 200 notices en 333 ms (1 167 ms avant), XML en 162 ms (427 ms avant). **Reste** : la mesure à 10 000 et 50 000 notices (`export-mesure-h26.test.js`, sauté par défaut) sur un catalogue synthétique, et la taille réelle de DIRA (**G15**).","pt":"`export-catalog-lote` monta tudo em memória; `export-fonds-bundle` já é limitado (150 arquivos, 80 MB). Maior catálogo da rede: 2 184 detenções (26/09). Limite real não medida; tamanho da DIRA desconhecido. **Entregue em 28/09** (`8c80de27`): exportação paginada, arquivo montado pela tela Importações; 306 ms em produção para as 2 167 notícias da BTL. **Falta**: medir 10 000 e 50 000 notícias."},"w":{"fr":"Mesurer la limite avec un catalogue synthétique (10 000 et 50 000 notices). Si elle est trop basse, passer à une génération asynchrone : un travail en file, le fichier déposé dans le Storage, un lien envoyé quand il est prêt.","pt":"Medir a limite com catálogo sintético (10 000, 50 000); se baixa, geração assíncrona (fila, arquivo no Storage, link quando pronto)."},"y":{"fr":"Un export qui échoue le jour où une bibliothèque veut partir vaut moins que pas d'export du tout : il fait croire à une porte qui n'ouvre pas.","pt":"Um export que falha no dia em que a biblioteca quer sair vale menos que nenhum."},"f":{"fr":["Limite mesurée et écrite ; au-delà, export asynchrone éprouvé."],"pt":["Limite medida e escrita; além dela, export assíncrono testado."]},"dep":{"fr":"Après **H24**. La taille de DIRA vient de **G15**.","pt":"Depois de **H24**. Tamanho da DIRA via **G15**."},"r":["claude/aller-retour-PMB_2026-09-26","Réponse à DIRA du 26/09/2026"],"verif":{"fr":"28/09 — migrations appliquées par la CI (`created_by` vide), `deployed-functions` = `8c80de27` ; mesures au REGISTRE IMP-24.","pt":"28/09 — migrações aplicadas pela CI (`created_by` vazio), `deployed-functions` = `8c80de27`."}},{"id":"H29","d":"H","p":"P2","s":"ouvert","e":"M","sk":["deno","sql","biblio"],"t":{"fr":"Au retour dans PMB, un exemplaire garde son type, sa section et son code statistique","pt":"De volta ao PMB, um exemplar mantém seu tipo, sua seção e seu código estatístico"},"v":{"fr":"**Mesuré au banc PMB 8.1.1.1 le 29/09** (H27, tableau de couverture § 4, bilans dans `tests/pmb/bilans/`) : les 46 exemplaires des fixtures reviennent tous en type « indéterminé / indéterminé », section « indéterminé », code statistique « Indéterminé ». À l'origine : 8 types (23 Livre, 13 indéterminé / indéterminé, 3 Oeuvre d'art, 2 CD audio, 2 Périodique, 1 Cartes et plans, 1 Cédéroms, 1 DVD), 12 sections, 3 codes statistiques (23 Adultes, 14 Indéterminé, 9 Jeunes). PMB retrouve un type et une section par leur code d'import, ou les crée — le type avec une durée de prêt de 0 jour. Cause : l'export écrit `995 $r uu` et `$q u` ; à l'import, `$r` et `$q` ne vont qu'en note de provenance, et les libellés d'origine sont dans la 996 de PMB, que rien ne reprend et qui n'est jamais réémise (IMP-22). Dans les fixtures, `$r` et `$q` valent déjà « uu » et « u » quel que soit le type : ce PMB de test n'a pas réglé ses codes d'import. Une bibliothèque qui repasse à PMB doit aujourd'hui reclasser chaque exemplaire avant de prêter.","pt":"**Medido no banco PMB 8.1.1.1 em 29/09** (H27): os 46 exemplares voltam todos com tipo, seção e código estatístico «indeterminado»; na origem, 8 tipos, 12 seções, 3 códigos estatísticos. O PMB acha tipo e seção pelo código de importação, ou os cria (o tipo com prazo de empréstimo de 0 dia). Causa: o export escreve `995 $r uu $q u`; na importação `$r`/`$q` vão só para a nota de proveniência, e os rótulos estão na 996 do PMB, nunca retomada nem reemitida. Uma biblioteca que volta ao PMB precisa reclassificar cada exemplar antes de emprestar."},"w":{"fr":"Pistes, à trancher après la réponse de DIRA : garder à l'import, dans des colonnes de l'exemplaire (jamais dans une note), le type, la section, le code statistique et la localisation d'origine — codes de la 995 et, quand la 996 est là, ses libellés — puis les réécrire à l'export pour la bibliothèque d'origine ; pour un exemplaire né dans AnarBib, une correspondance réglée dans le profil de la bibliothèque entre ce qu'AnarBib sait de l'exemplaire et les codes de son PMB. À vérifier au banc : ce que `docs_type::import` et ses équivalents de section et de code statistique font d'un code inconnu et d'un libellé.","pt":"Pistas, a decidir após a resposta da DIRA: guardar na importação, em colunas do exemplar (nunca numa nota), tipo, seção, código estatístico e localização de origem, e reescrevê-los no export para a biblioteca de origem; para um exemplar nascido no AnarBib, uma correspondência no perfil da biblioteca."},"y":{"fr":"Le retour vers PMB est la garantie donnée à une bibliothèque qu'AnarBib ne l'enferme pas. Un catalogue qui revient sans le type ni la section de ses exemplaires ne se prête pas le lendemain.","pt":"A volta ao PMB é a garantia de que o AnarBib não prende uma biblioteca; um catálogo que volta sem tipo nem seção dos exemplares não se empresta no dia seguinte."},"f":{"fr":["Réimporté dans PMB, un exemplaire venu de PMB retrouve son type, sa section et son code statistique d'origine.","Un exemplaire né dans AnarBib sort avec le type et la section que la bibliothèque a fait correspondre.","Mesuré au banc PMB, bilan versé."],"pt":["Reimportado no PMB, um exemplar vindo do PMB recupera tipo, seção e código estatístico de origem.","Um exemplar nascido no AnarBib sai com o tipo e a seção que a biblioteca fez corresponder.","Medido no banco PMB, balanço versado."]},"dep":{"fr":"Après **H27** (clos le 29/09). À demander à DIRA d'abord : ce que ces trois informations leur servent, et si les codes d'import de leurs types et sections sont réglés dans leur PMB.","pt":"Depois de **H27** (fechado em 29/09). Perguntar primeiro à DIRA: para que essas informações lhes servem, e se os códigos de importação de tipos e seções estão configurados no PMB delas."},"r":["claude/aller-retour-PMB_2026-09-26","Tableau de couverture AnarBib ↔ PMB, § 4 (docs/interop/couverture-pmb.md)"],"verif":{"fr":"29/09 — ouvert sur décision de Xavier, à la clôture de H27.","pt":"29/09 — aberto por decisão de Xavier, no fechamento de H27."}},{"id":"D8","d":"D","p":"P3","s":"bloque","e":"XL","sk":["sql","front","biblio"],"t":{"fr":"Décrire les archives de collectifs selon ISAD(G) : niveaux rattachés, producteurs, accès par niveau, export EAD","pt":"Descrever os arquivos de coletivos segundo a ISAD(G): níveis vinculados, produtores, acesso por nível, exportação EAD"},"v":{"fr":"Décision **D7** (REGISTRE `ARCH-1` à `ARCH-4`, Xavier, 27/09) : un modèle archivistique complet dans AnarBib. Aujourd'hui, un type « dossier » **à plat** (`dossier_scope`, `dossier_period`, `dossier_organizations`, `dossier_context` sur `books` et `book_drafts`, inutilisées en production le 27/09) : rien ne rattache une pièce à un dossier, un dossier à une série, une série à un fonds ; l'import CSV d'un inventaire ferait une notice par ligne.","pt":"Decisão **D7** (REGISTRO `ARCH-1` a `ARCH-4`, Xavier, 27/09): um modelo arquivístico completo no AnarBib. Hoje, um tipo «dossiê» plano, sem hierarquia."},"w":{"fr":"Après l'avis du réseau (`ARCH-4`). *(1)* Des unités de description rattachées (niveau ISAD(G), parent, ordre, cote archivistique), aux zones essentielles d'ISAD(G) (identification, contexte, contenu, conditions d'accès et d'utilisation, sources complémentaires) — en repartant des colonnes `dossier_*`. *(2)* Les producteurs en autorités (ISAAR(CPF)) : l'autorité existe (`authors`, `authority_type` personne, collectivité, congrès) ; y ajouter la famille et l'histoire du producteur si besoin. *(3)* Des conditions d'accès et de reproduction par niveau, héritées du parent, respectées par l'OPAC et par les exports (membres seulement, masqué). *(4)* L'arbre à l'OPAC et au catalogage. *(5)* Un export EAD ; un import d'inventaire en tableur qui reconstruit la hiérarchie (cote hiérarchique ou colonne de niveau et de parent), sur un inventaire réel de DIRA.","pt":"Depois do parecer da rede: unidades de descrição vinculadas (ISAD(G)), produtores em autoridades (ISAAR(CPF)), condições de acesso por nível herdadas, árvore no OPAC e na catalogação, exportação EAD, importação de inventário em planilha."},"y":{"fr":"Les archives de collectifs sont une part essentielle des fonds libertaires, et elles sont rarement décrites ailleurs. Les aplatir en notices de livre, c'est perdre justement ce qui en fait des archives : leur contexte.","pt":"Achatar arquivos em registros de livro é perder o que faz deles arquivos: o contexto."},"f":{"fr":["Un fonds réel de DIRA décrit à plusieurs niveaux, du fonds à la pièce là où il le faut.","Une unité restreinte n'apparaît ni à l'OPAC ni dans un export public ; ses enfants en héritent.","Export EAD validé contre le schéma EAD, et relu par une personne du réseau qui pratique l'archivistique."],"pt":["Um fundo real de DIRA descrito em vários níveis.","Uma unidade restrita não aparece nem no OPAC nem numa exportação pública; os filhos herdam.","Exportação EAD validada contra o esquema EAD e relida por alguém da rede."]},"dep":{"fr":"Bloqué par l'avis de DIRA, du CIRA et du FICEDL sur la décision (`ARCH-4`). Un inventaire réel de DIRA (**G15**) pour éprouver l'import.","pt":"Bloqueado pelo parecer de DIRA, CIRA e FICEDL (`ARCH-4`). Um inventário real de DIRA (**G15**)."},"r":["docs/specs/REGISTRE_decisions.md","Réponse à DIRA du 26/09/2026"],"verif":{"fr":"27/09 — colonnes `dossier_*` présentes sur `books` et `book_drafts` en production, aucune hiérarchie, 0 ligne renseignée.","pt":"27/09 — colunas `dossier_*` presentes, sem hierarquia, 0 linha preenchida."}},{"id":"I30","d":"I","p":"P1","s":"a-verifier","e":"M","sk":["sysadmin","sql"],"t":{"fr":"Une restauration rend une base qui sert : les droits de `public`, et les schémas `private` et `api`","pt":"Uma restauração devolve um banco que funciona: os direitos de `public` e os esquemas `private` e `api`"},"v":{"fr":"Consigné à la clôture d'I29 (05/10), hors de son périmètre, et porté par aucun item. **Les deux flux de la sauvegarde #BG2 sont pris en `--no-privileges`** (`deploy/ops/anarbib-bg2.sh`) : aucun `GRANT` ni `REVOKE` n'y figure. Le runbook (`RUNBOOK_restauration_BG2_2026-07-01.md`, §3.2-ter) ne repose les droits que d'`ingest`. Après une restauration, les tables de `public` n'ont plus leurs accès pour `anon` et `authenticated` — l'application ne lit plus rien —, et toute fonction recréée reprend l'`EXECUTE` à `PUBLIC` que Postgres donne par défaut : les fonctions `DEFINER` que les listes fermées surveillent (T10, T12) s'ouvriraient à `anon`. **Les schémas `private` et `api` ne sont dans aucun flux** : `api` porte les fonctions de l'OPAC, `private` les aides que des politiques RLS appellent ; une base restaurée depuis BG2 seul ne les a pas, et les reconstruire par le rejeu des migrations ne rend pas la production (B22).","pt":"Registrado no fechamento do I29. Os dois fluxos do backup #BG2 são feitos em `--no-privileges`: nenhum `GRANT`/`REVOKE`; o runbook só repõe os direitos de `ingest`. Depois de uma restauração, `public` perde os acessos de `anon`/`authenticated` e toda função recriada volta a ser executável por `PUBLIC`. Os esquemas `private` e `api` não estão em nenhum fluxo."},"w":{"fr":"Mesurer en production (lecture seule) les droits de `public`, `ingest`, `private` et `api` et leur contenu ; faire porter les droits par les dumps (ou, à défaut, par un script de repose au runbook, comme pour `ingest`) ; faire entrer `private` et `api` dans le flux long ; prouver sur banc qu'une restauration rend les mêmes droits et les mêmes fonctions que la production, et outiller ce contrôle.","pt":"Medir na produção; levar os direitos nos dumps (ou repô-los por script); incluir `private` e `api` no fluxo longo; provar em banco que uma restauração devolve os mesmos direitos e funções que a produção."},"y":{"fr":"Une sauvegarde se juge à la restauration. Une base qui revient sans ses droits est soit muette (l'application ne lit plus), soit ouverte (des fonctions privilégiées exécutables par n'importe qui) — et c'est le jour du sinistre qu'on le découvrirait.","pt":"Um backup se julga pela restauração: sem os direitos, o banco volta mudo ou aberto demais."},"f":{"fr":["Les droits de `public` (tables, séquences, fonctions, schéma, privilèges par défaut) reviennent à l'identique de la production après restauration.","`private` et `api` sont dans un flux, ou le runbook dit et éprouve comment ils sont reconstruits.","Une restauration d'essai sur banc donne les mêmes droits et les mêmes fonctions que la production, et ce contrôle est outillé."],"pt":["Os direitos de `public` voltam idênticos à produção.","`private` e `api` estão num fluxo, ou o runbook diz e prova como são reconstruídos.","Uma restauração de ensaio em banco devolve os mesmos direitos e funções que a produção, com controle ferramentado."]},"dep":{"fr":"Après **I29** (clos le 05/10). Voisin de **B22** (rejeu depuis zéro ≠ production).","pt":"Depois do **I29**. Vizinho do **B22**."},"r":["deploy/ops/anarbib-bg2.sh","docs/journal/operations/RUNBOOK_restauration_BG2_2026-07-01.md","REGISTRE §BG2"],"verif":[{"fr":"05/10 — ouvert sur décision de Xavier, à partir de la note de clôture d'I29.","pt":"05/10 — aberto por decisão de Xavier, a partir da nota de fechamento do I29."},{"fr":"**05/10, soir — livré, mis en service** (`a387b46c`, CI verte). `anarbib-bg2.sh` : les schémas `public`, `ingest`, `private` et `api` au flux long, plus aucun `--no-privileges` (long et court), le dump refusé s'il ne porte aucun GRANT ; `restore-test` pose les extensions et les fonctions `auth.*`, rejoue les droits par `bg2-repose-droits.sh` (remise aux défauts de Postgres, puis rejeu des GRANT/REVOKE des schémas sauvegardés et des seuls défauts de `postgres`, en une transaction) et compare l'empreinte des droits (`bg2-empreinte-droits.sql`) à celle de la production. RUNBOOK §3.2-quater, REGISTRE `BG2-18`, banc `i30-restauration-droits` (10). **Preuve au banc** sur `supabase/postgres:17.6.1.136` : empreinte identique à la production pour 19 groupes sur 19 avec la repose (2 sans les droits dans les dumps, 13 avec les droits sans repose) ; 18 sur 19 sur un `postgres:17` nu, seul diffère le défaut de `supabase_admin`. Mis en service : `~/anarbib` avancé sur `a387b46c`, `anarbib-bg2.sh check` → « Filet OK » sur les quatre schémas. **Reste à observer** : le premier tir court (06/10, 19:00 — le journal doit montrer les GRANT), le premier tir long (dimanche 11/10, 20:00 — « Dump long OK », `ingest` 11, le reste d'I29), puis `restore-test` et son empreinte.","pt":"**05/10, à noite — entregue, em serviço** (`a387b46c`, CI verde). Os quatro esquemas no fluxo longo, sem `--no-privileges`, dump recusado sem GRANT; `restore-test` repõe os direitos (`bg2-repose-droits.sh`) e compara a impressão dos direitos com a produção. Prova em bancada: 19/19 grupos idênticos com a reposição. Em serviço: `anarbib-bg2.sh check` → « Filet OK ». **Falta observar**: o primeiro tiro curto (06/10, 19:00), o primeiro longo (11/10, 20:00), depois `restore-test`."},{"fr":"**06/10, 19:02 — premier tir court après I30** : « Dump court OK : 34 tables, 312K », instantané `8ccc677d` (310,6 Kio contre 296,7 la veille : les droits sont dans le dump ; le script refuse un dump qui n'en porte aucun), filet OK sur les quatre schémas. Restent le premier tir long (dimanche 11/10, 20:00) et `restore-test`.","pt":"**06/10, 19:02 — primeiro tiro curto após o I30**: « Dump court OK : 34 tables, 312K », snapshot `8ccc677d` (310,6 KiB contra 296,7 na véspera: os direitos estão no dump). Faltam o tiro longo (11/10, 20:00) e `restore-test`."}]},{"id":"C26","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Réviser et publier les 24 brouillons de l'acervo historique du CCLA (BLMF)","pt":"Revisar e publicar os 24 rascunhos do acervo histórico do CCLA (BLMF)"},"v":{"fr":"Le 05/10, C24 a rattaché à des notices les fichiers restés sans ressource dans l'espace public : 24 brouillons pré-remplis forment le lot 66 « Acervo histórico CCLA — PDF a catalogar » de la BLMF (25 fichiers, cessão du CCLA, le caderno de la CAB en licence libre ; migration `20261005123453`, `66cf8d9b`). La correspondance bibliographique est à valider, et chaque brouillon porte une note sur ce qui reste à vérifier. **Mesuré le 05/10 au soir** : 22 en `draft`, 2 publiés (notices 2747 et 2748, cotes `CCLA-2026-0001` et `-0002`), lot ouvert. Aucun item ne portait ce travail : la clôture C24 les dit seulement rattachés.","pt":"Em 05/10, C24 vinculou os arquivos sem recurso do espaço público: 24 rascunhos pré-preenchidos formam o lote 66 « Acervo histórico CCLA — PDF a catalogar » da BLMF (25 arquivos, cessão do CCLA; migração `20261005123453`, `66cf8d9b`). A correspondência bibliográfica está por validar. **Medido em 05/10 à noite**: 22 em `draft`, 2 publicados (notícias 2747 e 2748), lote aberto."},"w":{"fr":"Brouillon par brouillon, le PDF ouvert : valider la description, les contributions et les droits, puis publier ou écarter ; fermer le lot quand il est vide.","pt":"Rascunho por rascunho, com o PDF aberto: validar descrição, contribuições e direitos, publicar ou descartar; fechar o lote quando vazio."},"y":{"fr":"Ces documents sont en ligne sans notice publique : personne ne les trouve au catalogue tant que leur brouillon n'est pas publié.","pt":"Esses documentos estão online sem notícia pública: ninguém os acha no catálogo enquanto o rascunho não for publicado."},"f":{"fr":["Les 24 brouillons du lot 66 sont publiés ou écartés, chacun avec sa raison.","Le lot 66 est fermé."],"pt":["Os 24 rascunhos do lote 66 estão publicados ou descartados, cada um com sua razão.","O lote 66 está fechado."]},"dep":{"fr":"Une personne qui catalogue à la BLMF.","pt":"Uma pessoa que cataloga na BLMF."},"r":["clôture C24","migration 20261005123453 (66cf8d9b)","lot 66 (catalog_batches)"],"verif":null},{"id":"C27","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Indexer les notices que le vocabulaire matière ne couvre pas","pt":"Indexar as notícias que o vocabulário de assuntos não cobre"},"v":{"fr":"C7 (27/09) a indexé 851 notices dans le vocabulaire existant et laissé de côté celles dont le sujet n'y est pas — littérature générale, philosophie, sciences sociales, espéranto, spiritualité, histoire du Brésil : 466 ce jour-là, « l'étendre serait un autre item » (clôture C7). Cet item n'existait pas. **Mesuré le 05/10 au soir** : 463 notices sur 2 607 n'ont aucun sujet.","pt":"C7 (27/09) indexou 851 notícias no vocabulário existente e deixou de lado as de assunto fora dele (literatura geral, filosofia, ciências sociais, esperanto, espiritualidade, história do Brasil): 466 naquele dia. **Medido em 05/10 à noite**: 463 notícias de 2 607 sem nenhum assunto."},"w":{"fr":"Lire les notices sans sujet par grands ensembles ; proposer les termes à ajouter au vocabulaire et les affectations, sur une fiche validée par Xavier comme celle de C7 ; hors du thésaurus FICEDL, sans créer de fork (décision de Xavier du 27/09).","pt":"Ler as notícias sem assunto por grandes conjuntos; propor termos e atribuições numa ficha validada por Xavier, como a do C7; fora do tesauro FICEDL, sem criar fork."},"y":{"fr":"Une notice sans sujet n'apparaît dans aucune facette ni aucune navigation par matière : près d'un sixième du catalogue est invisible par ce chemin.","pt":"Uma notícia sem assunto não aparece em nenhuma faceta nem navegação por assunto: quase um sexto do catálogo é invisível por esse caminho."},"f":{"fr":["Une fiche de propositions (termes et affectations) est validée par Xavier.","Le nombre de notices sans sujet est remesuré après application et noté ici."],"pt":["Uma ficha de propostas é validada por Xavier.","O número de notícias sem assunto é remedido e anotado aqui."]},"dep":{"fr":"Xavier, pour la validation.","pt":"Xavier, para a validação."},"r":["clôture C7","docs/journal/arbitrages/C7_propositions_matieres_2026-09-27.md"],"verif":null},{"id":"C28","d":"C","p":"P2","s":"ouvert","e":"S","sk":["biblio"],"t":{"fr":"Trancher trois paires de notices que DEDUP-14 a fait apparaître","pt":"Decidir três pares de notícias que o DEDUP-14 fez aparecer"},"v":{"fr":"Le 28/09, `DEDUP-14` (un même ISBN = une même édition, `8e0fe538`) a fait proposer comme doublons quatre paires jusque-là masquées par l'œuvre. **Mesuré le 05/10 au soir** : la paire BTL-TL-000504 / BTL-TL-000727 est fusionnée (28/09, `merge_log`) ; trois restent, sans trace de verdict : BTL-TL-000301 / BLMF 0000054 (notices 291 et 2264), BTL-TL-001525 / BLMF 0000258 (1432 et 2446), BTL-TL-001808 / BLMF 0000060 (1699 et 2267).","pt":"Em 28/09, o `DEDUP-14` (`8e0fe538`) fez propor quatro pares até então mascarados pela obra. **Medido em 05/10**: 504/727 fundido em 28/09; restam três, sem veredito: BTL-TL-000301 / BLMF 0000054 (291 e 2264), BTL-TL-001525 / BLMF 0000258 (1432 e 2446), BTL-TL-001808 / BLMF 0000060 (1699 e 2267)."},"w":{"fr":"Pour chaque paire, ouvrir la liste des éditions et trancher : « Même édition : fusionner » (le chemin manuel de `DEDUP-13`), ou garder les deux notices et dire pourquoi.","pt":"Para cada par, abrir a lista das edições e decidir: « Mesma edição: fundir » (`DEDUP-13`), ou manter as duas e dizer por quê."},"y":{"fr":"Deux notices pour une même édition dédoublent le catalogue public et ses compteurs ; deux éditions prises pour une seule perdraient une description.","pt":"Duas notícias para uma mesma edição duplicam o catálogo público; duas edições tomadas por uma perderiam uma descrição."},"f":{"fr":["Chacune des trois paires est fusionnée ou déclarée distincte, raison écrite."],"pt":["Cada um dos três pares está fundido ou declarado distinto, com a razão escrita."]},"dep":{"fr":"Xavier, à l'écran ; les livres en main si l'ISBN ne suffit pas.","pt":"Xavier, na tela; os livros na mão se o ISBN não bastar."},"r":["commit 8e0fe538","REGISTRE DEDUP-13, DEDUP-14","merge_log"],"verif":null},{"id":"E30","d":"E","p":"P3","s":"ouvert","e":"S","sk":["langue"],"t":{"fr":"Faire relire le guide de gouvernance espagnol","pt":"Fazer revisar o guia de governança em espanhol"},"v":{"fr":"Vu en livrant E25 (05/10, `0cc2b6d3`) : le guide de gouvernance espagnol dit « concernida(s) » 22 fois, un mot que la passe pt-BR a remplacé de son côté ; le guide espagnol n'a pas été relu. Écrit seulement dans la clôture d'E25.","pt":"Visto na entrega do E25 (05/10): o guia de governança em espanhol diz « concernida(s) » 22 vezes; não foi revisado."},"w":{"fr":"Relecture par une personne de langue maternelle ; porter ses corrections, puis régénérer le recueil `Guia_de_governanca_AnarBib.pdf` du bucket.","pt":"Revisão por pessoa de língua materna; aplicar as correções e regenerar a coletânea `Guia_de_governanca_AnarBib.pdf`."},"y":{"fr":"Le guide dit à une coordination comment coopter ou traiter un conflit ; un mot douteux à chaque page lui dit que personne ne l'a relu.","pt":"O guia diz a uma coordenação como cooptar ou tratar um conflito; uma palavra duvidosa em cada página diz que ninguém o revisou."},"f":{"fr":["Le guide espagnol est relu par une personne de langue maternelle et ses corrections sont portées.","Le recueil PDF du bucket est régénéré."],"pt":["O guia em espanhol foi revisado e as correções aplicadas.","A coletânea PDF foi regenerada."]},"dep":{"fr":"Une personne hispanophone.","pt":"Uma pessoa hispanofalante."},"r":["clôture E25","commit 0cc2b6d3"],"verif":null},{"id":"E31","d":"E","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Ce qui attend un regard à l'écran, connecté","pt":"O que espera um olhar na tela, com sessão"},"v":{"fr":"Plusieurs livraisons de fin septembre et de début octobre sont prouvées au banc et en base, mais ne se jugent qu'à l'écran, avec une session ; leurs clôtures le disent, sans qu'aucun item ne le porte. **Items clos, regard manquant** : la barre d'état collante et la fenêtre de confirmation du catalogage (C21, session staff) ; « Publié — et maintenant ? », notamment le numéro d'inventaire après « un autre exemplaire du même document » (C22) ; le dépôt numérique en cinq étapes (C24) ; la lecture réservée pour une personne membre de la BTL (C20 ; C25 a réparé un cas voisin). **Items ouverts qui l'attendent aussi** : un déplacement d'exemplaire par publication (C23), un vote réel de transition (G16), les deux refus de C14, chaque lot de E6. **Ajouté le 06/10** : une invitation réelle à une tâche, envoyée à soi-même et reçue (reste de F16, clos).","pt":"Várias entregas de fim de setembro e início de outubro estão provadas em bancada e no banco, mas só se julgam na tela, com sessão. **Itens fechados, olhar faltando**: barra de estado e janela de confirmação (C21); « Publicado — e agora? » (C22); depósito digital em cinco etapas (C24); leitura reservada para membro da BTL (C20). **Itens abertos que também esperam**: C23, G16, C14, cada lote do E6. **Acrescentado em 06/10**: um convite real a uma tarefa, recebido (resto do F16)."},"w":{"fr":"Une séance avec Xavier connecté (staff BLMF ou BTL), un point à la fois ; noter pour chacun « vu, conforme » ou le défaut trouvé (ouvert en item).","pt":"Uma sessão com Xavier conectado, um ponto por vez; anotar « visto, conforme » ou o defeito achado (aberto como item)."},"y":{"fr":"**Ce qui attend encore un regard (08/10)** : les lots 2, 4, 5 et 8 d'`AccountPage` (Avis et Liste de souhaits ; En cours ; Réserver — réserver par référence, annuler une réservation ; E6) ; la ligne BTL « Indisponible pour toi » pour un compte BLMF (E35) ; les écrans de H21 lots 1 à 5 sur la page Importations (« Déjà importée », « plus détenue », comptes de changements et recalcul, « Préparer la mise à jour », onglet « Divergences », bandeau) — DIRA n'a pas réimporté. **Vus et clos le 08/10 sur le mot de Xavier** : C14, C23, G16 ; E33 clos sans regard (on ne simule pas une panne en production). **Vu le 09/10** : la correspondance entre bibliothèques (G19, clos) — fil réel BLMF → BTL à l'écran, cloche reçue côté BTL ; le courriel à l'adresse collective de BTL et la réponse de BTL dans l'onglet (qui prévient BLMF) restent à voir, sans urgence. Les clôtures de fin septembre (C20, C21, C22, C24, C25, F16) restent à voir, sans urgence.","pt":"**O que ainda espera um olhar (08/10)**: lotes 2, 4, 5 e 8 da `AccountPage` (E6); a linha BTL « Indisponível para você » (E35); as telas de H21 lotes 1 a 5. **Vistos e fechados em 08/10**: C14, C23, G16. **Visto em 09/10**: correspondência entre bibliotecas (G19, fechado) — fio real BLMF → BTL na tela, sino recebido do lado da BTL; e-mail ao endereço coletivo da BTL e resposta da BTL na aba ainda por ver."},"f":{"fr":["Chaque point de la liste est vu à l'écran et noté ici, conforme ou défaut ouvert en item."],"pt":["Cada ponto da lista é visto na tela e anotado aqui."]},"dep":{"fr":"Xavier, connecté.","pt":"Xavier, conectado."},"r":["clôtures C20, C21, C22, C24, C25","items C14, C23, G16, E6","clôture F16","clôture G19"],"verif":[{"fr":"**07/10 — ce qui s'est ajouté à la liste depuis le 05/10**, livré et prouvé au banc, jamais vu avec une session : les lots 2, 4, 5 et 8 d'`AccountPage` (Avis et Liste de souhaits ; En cours ; Réserver — dont réserver par référence et annuler une réservation ; les lots 3, 6 et 7 ont été vus par Xavier) ; E33, Mon compte quand la base ne répond pas — on ne simule pas une panne en production ; la ligne BTL « Indisponible pour toi » pour un compte BLMF (E35) ; les écrans de H21 lots 1 à 5 sur la page Importations (« Déjà importée », « plus détenue », les comptes de changements et le recalcul, « Préparer la mise à jour », l'onglet « Divergences » et le bandeau de la notice) — DIRA n'a pas réimporté, aucune ligne réelle ne les exerce encore.","pt":"**07/10 — o que se somou à lista desde 05/10**, entregue e provado em bancada, nunca visto com sessão: os lotes 2, 4, 5 e 8 da `AccountPage` (3, 6 e 7 vistos por Xavier); E33; a linha BTL « Indisponível para você » para uma conta BLMF (E35); as telas de H21 lotes 1 a 5 na página Importações — DIRA ainda não reimportou."},{"fr":"**08/10 — trois regards rendus par Xavier** (questions posées une à une) : C14, C23 et G16 vus à l'écran et clos. La liste restante est réécrite dans « Pourquoi ça compte ».","pt":"**08/10 — três olhares dados por Xavier**: C14, C23 e G16 vistos e fechados. A lista restante foi reescrita."}]},{"id":"E32","d":"E","p":"P3","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Les icônes encore en emoji passent à `AppIcon`, au fil des retouches (IDENT-Q1)","pt":"Os ícones ainda em emoji passam a `AppIcon`, ao sabor dos retoques (IDENT-Q1)"},"v":{"fr":"Le 05/10, la PR #32 du camarade (`ASR2026`) a posé `AppIcon` et ses règles (REGISTRE `IDENT-5` à `IDENT-8`, `0b2b0e14`). Mesuré le même jour (REGISTRE `IDENT-Q1`) : 198 lignes dans 52 fichiers de `src/` portent encore un emoji, dont 111 déclarations d'icône que `AppIcon` traduit par sa table `LEGACY`, déclarée transitoire. Décision de Xavier : elles migrent **au fil des retouches**, comme les requêtes de média de `MOB-Q2` (clôture E9). Seul le registre le portait.","pt":"Em 05/10, a PR #32 do camarada pôs `AppIcon` (REGISTRE `IDENT-5` a `IDENT-8`). Medido no mesmo dia (`IDENT-Q1`): 198 linhas em 52 arquivos com emoji, das quais 111 declarações de ícone traduzidas pela tabela transitória `LEGACY`. Decisão de Xavier: migram ao sabor dos retoques."},"w":{"fr":"Chaque écran retouché, pour quelque raison que ce soit, passe ses icônes à `AppIcon` et sort ses emoji de `LEGACY` ; recompter à chaque relevé.","pt":"Cada tela retocada passa seus ícones a `AppIcon` e tira seus emojis de `LEGACY`; recontar a cada levantamento."},"y":{"fr":"Un emoji se dessine différemment d'un système à l'autre et n'a pas de nom accessible fiable ; `AppIcon` en a un.","pt":"Um emoji muda de um sistema a outro e não tem nome acessível confiável; `AppIcon` tem."},"f":{"fr":["`LEGACY` est vide : plus aucune déclaration d'icône en emoji dans `src/`."],"pt":["`LEGACY` vazia: nenhuma declaração de ícone em emoji em `src/`."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["REGISTRE IDENT-5 à IDENT-8, IDENT-Q1","commits ad5fb042, 300b1a69, 206b7b77, 0b2b0e14"],"verif":null},{"id":"I32","d":"I","p":"P1","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Établir la cause de la panne du 07/10 et dimensionner l'instance de base","pt":"Estabelecer a causa da queda de 07/10 e dimensionar a instância do banco"},"v":{"fr":"Le 07/10/2026, la base de production s'est arrêtée à 19:58 (Paris) et n'a répondu à rien jusqu'au redémarrage du projet par Xavier : 19:58 → 20:19, environ 21 minutes. Journaux : Postgres se tait à 17:57:59 UTC juste après un point de contrôle normal, sans erreur ; la passerelle rend des 522/544 de 18:00 à 18:17 UTC, des 503 au redémarrage (18:18), puis tout revient en 200 (18:19) ; le pooler refuse toute connexion (« ECIRCUITBREAKER… new connections are temporarily blocked », job `backend` de `a4ddaaa3` rouge à 20:14) ; aucun incident Supabase public ; le tableau de bord affichait « Unhealthy », instance MICRO (t4g.micro), mémoire 70 %, connexions indisponibles. **Ce que la panne n'est pas** : ni du trafic (51 requêtes de 17:58:00 à 17:58:58 UTC, toutes en 200 — un renouvellement d'emprunt, son courriel, quatre rechargements de Mon compte, une autre session qui lit ses avis), ni une requête en erreur (aucune ERROR ni FATAL dans les journaux de Postgres avant l'arrêt), ni un déploiement (le dernier `db push` à 19:50, sans migration). **Indice** : depuis 17:50 UTC, PostgREST signalait à répétition « Thread killed by timeout manager ». Premier suspect, non prouvé : un manque de mémoire de l'instance MICRO (1 Go), tuée par l'hébergeur.","pt":"Mesmo episódio. Não foi tráfego (51 requisições em 200 no último minuto), nem erro de consulta, nem implantação. Indício: PostgREST registrava « Thread killed by timeout manager » desde 17:50 UTC. Primeiro suspeito, não provado: falta de memória da instância MICRO (1 GB)."},"w":{"fr":"Lire le rapport d'infrastructure du tableau de bord (Reports → Database : mémoire, swap, CPU, E/S disque) entre 19:45 et 20:00 le 07/10 ; si la mémoire est en cause, chercher ce qui la consomme (connexions du pooler, tâches planifiées des 5 minutes, fonctions Edge) et décider du passage de MICRO à SMALL — une décision de coût qui revient à Xavier.","pt":"Ler o relatório de infraestrutura (Reports → Database) entre 19:45 e 20:00 de 07/10; se for memória, achar o consumidor e decidir a passagem de MICRO para SMALL (decisão de custo de Xavier)."},"y":{"fr":"Sans cause, la panne peut revenir demain à la même heure ; et une instance trop petite pour la charge du réseau fera de chaque soirée de formation un pari.","pt":"Sem causa, a queda pode voltar amanhã."},"f":{"fr":["La cause est établie sur pièces (rapport d'infrastructure, journaux), ou déclarée non établissable, raison écrite.","La taille de l'instance est décidée par Xavier et écrite ici."],"pt":["A causa é estabelecida com provas, ou declarada não estabelecível, com razão escrita.","O tamanho da instância é decidido por Xavier e escrito aqui."]},"dep":{"fr":"Xavier (accès au tableau de bord, décision de coût).","pt":"Xavier (acesso ao painel, decisão de custo)."},"r":["exports supabase_logs.csv du 07/10 (passerelle, 17:58 → 18:25 UTC)","journaux Postgres et PostgREST du 07/10","job backend 10213611"],"verif":[{"fr":"**07/10 — effet de bord du redémarrage** : les statistiques d'usage (`pg_stat_*`) sont reparties de zéro à 20:19 ; l'avis de performance passe de 257 à 466 (440 « index inutilisé ») sans que rien ait changé dans la base. B36 en tient compte.","pt":"**07/10 — efeito colateral do reinício**: as estatísticas de uso (`pg_stat_*`) recomeçaram do zero às 20h19; o aviso de desempenho passa de 257 a 466 (440 « índice não usado ») sem que nada tenha mudado no banco. B36 leva isso em conta."}]},{"id":"I33","d":"I","p":"P2","s":"a-verifier","e":"S","sk":["sysadmin"],"t":{"fr":"Le checkout d'exploitation du poste (`~/anarbib`) doit suivre `main` : le filet de la sauvegarde y lit la liste des tables connues","pt":"O checkout de operação do posto (`~/anarbib`) deve seguir `main`: a rede de segurança do backup lê nele a lista de tabelas conhecidas"},"v":{"fr":"**08/10/2026, 19:03 (Paris) — le tir court #BG2 a échoué** au démarrage de la machine : « Filet déclenché : classe les nouvelles tables avant de sauvegarder ». La table nouvelle était `ingest.book_import_divergences` (H21 lot 5, 07/10), **bien classée au dépôt** (`deploy/bg2-known-tables.txt`, 209 tables, le banc SQL le vérifie à chaque CI) — mais `~/anarbib-ops/bg2-known-tables.txt` est un lien vers `~/anarbib/deploy/bg2-known-tables.txt`, et le checkout `~/anarbib` était resté sur `a387b46c` (05/10) : personne ne l'avait avancé depuis I29. Le drapeau `.last-failure` s'est affiché à l'ouverture du terminal ; le contrôle de fraîcheur disait « frais » (24 h, seuil 36 h) et n'a donc rien relancé. Réparé à 20:28 : `~/anarbib` avancé sur `4dfb1dc2` (ff), tir court relancé à la main, « Filet OK », snapshot `a3325d79`, drapeau retiré. Le flux court n'a manqué qu'un jour ; le long de dimanche aurait échoué pareil.","pt":"**08/10/2026 — o tiro curto #BG2 falhou** no arranque: « rede acionada: classifique as novas tabelas ». A tabela (`ingest.book_import_divergences`, lote 5) estava classificada no repositório, mas `~/anarbib` ficara em `a387b46c` (05/10). Reparado às 20:28: checkout avançado, tiro relançado, snapshot `a3325d79`."},"w":{"fr":"Faire suivre `main` au checkout d'exploitation sans geste humain : le plus simple est que `anarbib-mirror-refresh.sh` (minuteur quotidien), après avoir rafraîchi le miroir nu, avance aussi `~/anarbib` en `--ff-only` quand il est propre — jamais de rebase ni de reset : un checkout sale ou divergent s'écrit au drapeau et ne bouge pas. Variante : le job `acquittement` de la CI ne peut pas le faire (il tourne dans un conteneur). À écrire dans `deploy/ops/README.md` (« ce que fait la machine après un push »), et à éprouver : une table créée au dépôt, le tir du soir passe sans qu'on ait touché au poste. Les unités systemd étant des liens vers ce checkout, un script d'exploitation changé par un push devient actif au tir suivant — c'est déjà le cas aujourd'hui quand une session avance `~/anarbib` ; le dire au README.","pt":"Fazer `~/anarbib` seguir `main` sem gesto humano: `anarbib-mirror-refresh.sh` avança o checkout em `--ff-only` quando está limpo; nunca rebase nem reset. Documentar e provar: uma tabela criada no repositório, o tiro da noite passa."},"y":{"fr":"Le filet existe pour qu'une table nouvelle ne parte jamais sans classement ; s'il lit une liste périmée, il refuse de sauvegarder des données parfaitement classées — et une sauvegarde qui ne part pas pour une mauvaise raison s'apprend à ignorer.","pt":"A rede existe para que nenhuma tabela nova parta sem classificação; se lê uma lista velha, recusa salvar dados bem classificados."},"f":{"fr":["Une table créée par une migration poussée le jour même est connue du tir du soir sans qu'une personne ait avancé `~/anarbib`.","Un checkout sale ou divergent n'est jamais touché : drapeau posé, le tir se fait avec la liste qu'il a.","Documenté dans `deploy/ops/README.md`."],"pt":["Uma tabela criada por migração do dia é conhecida do tiro da noite sem gesto humano.","Um checkout sujo ou divergente nunca é tocado.","Documentado."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["deploy/ops/anarbib-mirror-refresh.sh","deploy/ops/anarbib-bg2.sh (filet)","journal du 08/10/2026, anarbib-backup-court.service"],"verif":[{"fr":"**08/10 — livré, posé, éprouvé sur le poste** (`2d3c8273`, CI verte). `anarbib-exploitation-suit.sh` : avance `~/anarbib` en avance rapide seulement si le checkout est sur `main`, propre (fichiers suivis ; `CLAUDE.md` et `.claude/` ignorés) et qu'aucun script d'exploitation ne tourne (sauvegardes, fraîcheur, témoin : des liens vers ce checkout) ; sinon il dit pourquoi — sale ou divergent : sortie 1 et drapeau `.last-failure` ; un tir en cours : on attend. Il se recopie dans `/tmp` avant de tourner, et le tir du miroir l'appelle en `exec`, dernier geste, parce que tous deux vivent dans le checkout qu'ils avancent. Minuteur du miroir : 18:00, **18:50** (avant le flux court), 19:50 le dimanche (avant le long), une minute après le démarrage. Banc `exploitation-suit-main` (9 cas, vrais dépôts git jetables), vitest 2 229. Sur le poste : `systemd` rechargé, un tir du miroir lancé à la main a enchaîné le suivi — `~/anarbib` suit `main`. *Critère 1* se vérifie au prochain tir du soir après une migration qui crée une table ; *critères 2 et 3* tenus (banc, README). **Reste** : clôture à décider par Xavier après un tir réel.","pt":"**08/10 — entregue, instalado, provado no posto** (`2d3c8273`). O checkout `~/anarbib` segue `main` em avanço rápido, só se limpo e sem script em curso; o tiro do espelho o encadeia (18:00, 18:50, 19:50 dom., arranque). Bancada de 9 casos. **Fechamento a decidir por Xavier após um tiro real.**"}]},{"id":"F25","d":"F","p":"P1","s":"ouvert","e":"M","sk":["deno"],"t":{"fr":"Les envois en rafale dépassent la limite de Resend : des courriels se perdent sans que personne le sache","pt":"Envios em rajada ultrapassam o limite do Resend: e-mails se perdem sem ninguém saber"},"v":{"fr":"**Constaté le 09/10 à 21 h 49** : quatorze propositions ouvertes d'un coup dans l'Atelier (C4) ont déclenché quatorze événements `authority.proposal_opened`, traités en parallèle par `notify-event`, 72 courriels en deux secondes — Resend n'en accepte que dix par seconde (HTTP 429 `rate_limit_exceeded`) : **58 courriels perdus**, 14 passés. Le transport partagé (`_shared/transport/email.ts`, F7) ne rejoue pas un 429 et ne cadence rien ; `safeSendEmail` avale l'échec et `authority.ts` compte `sent++` quand même (la réponse disait « 72 envoyés »). La sonde de santé l'a vu (incident 23, `echecs_recents (58)`, courriel d'alerte à 21 h 50) : le dispositif de F15 a fait son travail, pas le transport. Tout événement qui s'adresse à beaucoup de personnes à la fois (un fil de l'Atelier, une annonce aux coordinations, un rappel groupé) peut reproduire la perte.","pt":"**09/10, 21h49**: catorze propostas abertas de uma vez no Ateliê dispararam 72 e-mails em dois segundos; o Resend aceita dez por segundo (HTTP 429): **58 e-mails perdidos**. O transporte compartilhado não repete um 429 nem cadencia; `sent++` conta o fracasso como sucesso. A sonda de saúde viu (incidente 23)."},"w":{"fr":"Dans `_shared/transport/email.ts` : rejouer un 429 (et un 5xx) avec attente croissante, trois fois, en lisant `retry-after` ; cadencer les envois d'un même appel (au plus huit par seconde) ; rendre un résultat vrai (`ok: false` compté comme tel par les appelants : `authority.ts`, les autres domaines qui font `sent++`). Banc du transport : un faux Resend qui répond 429 deux fois puis 200 → un seul courriel, livré ; 72 destinataires → aucun 429 émis. Puis relire la sonde : l'incident 23 s'est refermé seul.","pt":"No transporte: repetir 429 e 5xx com espera crescente, cadenciar (oito por segundo), devolver um resultado verdadeiro contado pelos chamadores. Bancada com um Resend falso."},"y":{"fr":"Une personne qui ne reçoit pas le courriel ne sait pas qu'une proposition l'attend, qu'une réservation est prête, qu'un mot de passe a été demandé — et le système, lui, a dit « envoyé ». C'est la promesse de F7 (un seul envoi de mail) qui n'est tenue qu'à moitié.","pt":"Quem não recebe o e-mail não sabe que algo a espera — e o sistema disse « enviado »."},"f":{"fr":["Un 429 de Resend est rejoué et le courriel finit par partir (banc).","Soixante-douze destinataires en un appel ne produisent aucun 429 (banc).","Un échec de transport est compté comme un échec par tous les appelants (`sent` vrai)."],"pt":["Um 429 é repetido e o e-mail parte (bancada).","72 destinatários num só chamado: nenhum 429.","Um fracasso de transporte é contado como fracasso por todos os chamadores."]},"dep":{"fr":"Aucune. Les 58 courriels du 09/10 ne seront pas renvoyés : les propositions restent visibles dans l'Atelier jusqu'au 16/10.","pt":"Nenhuma. Os 58 e-mails de 09/10 não serão reenviados: as propostas ficam no Ateliê até 16/10."},"r":["clôture F7","F15","C4","supabase/functions/_shared/transport/email.ts","supabase/functions/_shared/domain/authority.ts"],"verif":null}],"etat":{"photo_intro":{"fr":"**Relevé du 9 octobre 2026 au soir** (`47781985`, mesuré à 22 h 15 — demandé à `d116d42d`, deux commits plus tard C17 était livré et sa migration passée : le relevé les inclut) — production interrogée en lecture seule et dépôt recompté ; **toutes les lignes ont été remesurées** (précédent relevé : le 08/10 au soir, `c06f9ed2`). **La CI est à jour de la tête de branche** : 454 migrations appliquées = 454 au dépôt, les quatre qui attendaient hier soir sont passées, plus H21 lot 6b, les tomes II et III d'*Acción directa* et C17. Ce qui a bougé et pourquoi : **le catalogue** — −3 notices, toutes par fusion (deux tomes réunis par migration sur accord de Xavier, une fusion à 21 h 46), aucune créée, quatre reprises publiées ; **la base** — +25 fonctions (H21 lot 6b dans `ingest`, C17 avec son registre `tombos_attribues`, la liste des fils de correspondance), deux tables fermées de plus (d'où +2 avis 0008), **0029 à 428, exactement le compte attendu par l'audit**, et la garde CI des DEFINER à liste fermée étendue à la correspondance (une porte, trois aides) ; **le réseau** — la correspondance vit (un fil, deux messages, BLMF vers BTL), G19 clos par Xavier ; **le dépôt** — +12 commits, +40 clés, +39 tests, +2 suites SQL, C17 livré (un numéro d'inventaire ne se redonne jamais). **Ce qui reste à clore, et par qui** — *à vérifier sur un fait à venir* : C17 (à l'écran, un numéro libéré refusé), F19 (une semaine de journaux, vers le 15/10), I30 (tir long du 11/10 puis `restore-test`), I33 (un tir du soir après une migration — la migration de ce soir le permet), H15, H16 et H28 (un import réel de DIRA), H26, K10 (deux parutions) ; *à l'écran* : E31 (E6 lots 2, 4, 5, 8 ; E35 ; écrans de H21) ; *les décisions* : A1 (une troisième administration réseau) ; *sans code* : A1, A3 (la machine du runner), H2 (un courriel prêt depuis le 16/09, à envoyer), H32 (le signalement à PMB Services, à envoyer).","pt":"**Levantamento de 9 de outubro de 2026 à noite** (`47781985`, medido às 22h15 — pedido em `d116d42d`, dois commits depois C17 estava entregue e sua migração aplicada: o levantamento os inclui) — produção consultada só em leitura e repositório recontado; **todas as linhas foram remedidas** (levantamento anterior: 08/10 à noite, `c06f9ed2`). **A CI está em dia com a cabeça do branch**: 454 migrações aplicadas = 454 no repositório, as quatro que esperavam ontem à noite passaram, mais H21 lote 6b, os tomos II e III de *Acción directa* e C17. O que mudou e por quê: **o catálogo** — −3 fichas, todas por fusão (dois tomos reunidos por migração com acordo de Xavier, uma fusão às 21h46), nenhuma criada, quatro retomadas publicadas; **o banco** — +25 funções (H21 lote 6b em `ingest`, C17 com seu registro `tombos_attribues`, a lista dos fios de correspondência), mais duas tabelas fechadas (daí +2 avisos 0008), **0029 em 428, exatamente a contagem esperada pela auditoria**, e a guarda CI dos DEFINER de lista fechada estendida à correspondência (uma porta, três ajudas); **a rede** — a correspondência vive (um fio, duas mensagens, BLMF para BTL), G19 fechado por Xavier; **o repositório** — +12 commits, +40 chaves, +39 testes, +2 suítes SQL, C17 entregue (um número de tombo nunca se redá). **O que falta fechar, e por quem** — *a verificar num fato por vir*: C17 (na tela, um número liberado recusado), F19 (uma semana de logs, por volta de 15/10), I30 (disparo longo de 11/10 e depois `restore-test`), I33 (um disparo noturno depois de uma migração — a migração desta noite permite), H15, H16 e H28 (uma importação real da DIRA), H26, K10 (duas edições); *na tela*: E31 (E6 lotes 2, 4, 5, 8; E35; telas do H21); *as decisões*: A1 (uma terceira administração de rede); *sem código*: A1, A3 (a máquina do runner), H2 (um e-mail pronto desde 16/09, a enviar), H32 (o aviso ao PMB Services, a enviar)."},"photo":[{"g":{"fr":"Base","pt":"Banco"},"rows":[[{"fr":"Tables `public`","pt":"Tabelas `public`"},"202",{"fr":"toutes avec RLS activé, **364 policies** tous schémas confondus (`public` 314, `storage` 47, `cron` 2, `ingest` 1). +1 table depuis le 08/10 au soir, sans policy : `tombos_attribues`, le registre des numéros d'inventaire donnés (C17, `5a5a94d6`, 09/10 à 21 h 46) — fermée à `anon` et `authenticated`, écrite par déclencheur seulement, d'où un avis 0008 de plus.","pt":"todas com RLS ativado, **364 policies** em todos os esquemas (`public` 314, `storage` 47, `cron` 2, `ingest` 1). +1 tabela desde 08/10 à noite, sem policy: `tombos_attribues`, o registro dos números de tombo já dados (C17, `5a5a94d6`, 09/10 às 21h46) — fechada a `anon` e `authenticated`, escrit
