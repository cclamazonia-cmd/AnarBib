al no mesmo dia**, sobre cinco fontes, incluindo **o e-mail recebido e relido**. **Falta provar sobre um tipo de ação sem outro canal.**"}},{"id":"J2","d":"J","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Réparer l'index des backlogs et trancher la convention d'archivage","pt":"Reparar o índice dos backlogs e decidir a convenção de arquivamento"},"v":{"fr":"**Corrigé le 31/08 : la ligne du v32 est rétablie depuis le 29/08** (`INDEX.md`, avec la note « elle manquait à ce tableau depuis juin »). Restent : les deux conventions de nommage qui coexistent — 9 archives avec le préfixe `-archive-`, 27 sans — et un en-tête d'INDEX qui dérive déjà : « 90 items » puis « les items restent 84 » dans le même paragraphe, quand le JSON en compte 83.","pt":"**Corrigido em 31/08: a linha do v32 está restabelecida desde 29/08.** Restam: as duas convenções de nomenclatura (9 arquivos com prefixo `-archive-`, 27 sem) e um cabeçalho do INDEX que já deriva (« 90 itens », « restam 84 », quando o JSON conta 83)."},"w":{"fr":"Ajouter la ligne du v32, celles du v33 et du v34, et trancher la convention d'archivage en une phrase inscrite au REGISTRE.","pt":"Acrescentar a linha do v32, as do v33 e do v34, e decidir a convenção de arquivamento numa frase inscrita no REGISTRO."},"y":{"fr":"L'index des backlogs est ce qui permet de savoir quelle version fait foi. Une lignée avec un trou et deux conventions concurrentes ne remplit pas cet office.","pt":"O índice dos backlogs é o que permite saber qual versão faz fé. Uma linhagem com um buraco e duas convenções concorrentes não cumpre esse ofício."},"f":{"fr":["Le tableau est complet du v8 au v34.","Une seule convention de nommage est inscrite au REGISTRE."],"pt":["A tabela está completa do v8 ao v34.","Uma única convenção de nomenclatura está inscrita no REGISTRO."]},"dep":{"fr":"Se fait en posant ce backlog.","pt":"Faz-se ao depositar este backlog."},"r":["docs/backlogs/INDEX.md"],"verif":{"fr":"31/08 — `INDEX.md` relu, archives comptées : 9 avec le préfixe `-archive-`, 27 sans.","pt":"31/08 — `INDEX.md` relido, arquivos contados: 9 com prefixo `-archive-`, 27 sem."}},{"id":"J6","d":"J","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Écrire les cinq doctrines internalisées là où un tiers les trouverait","pt":"Escrever as cinco doutrinas internalizadas onde um terceiro as encontraria"},"v":{"fr":"Cinq règles de conception sont appliquées partout et écrites nulle part d'accessible : l'ordre des mises à jour dans une RPC (le récit avant l'état), la distinction entre `workflow_note` et `schedule_reply_note`, l'interdiction d'`async` dans `onAuthStateChange`, les pièges d'encodage sous PowerShell, et le contrat `actionBox` de la fonction de rendu des courriels.","pt":"Cinco regras de concepção são aplicadas em toda parte e escritas em nenhum lugar acessível: a ordem das atualizações numa RPC (o relato antes do estado), a distinção entre `workflow_note` e `schedule_reply_note`, a proibição de `async` em `onAuthStateChange`, as armadilhas de codificação sob PowerShell, e o contrato `actionBox` da função de renderização dos e-mails."},"w":{"fr":"Les écrire dans le dépôt, pas dans un fichier local. Une page suffit ; chacune tient en trois lignes et un exemple.","pt":"Escrevê-las no repositório, não num arquivo local. Uma página basta; cada uma cabe em três linhas e um exemplo."},"y":{"fr":"Ces cinq règles vivent aujourd'hui dans `CLAUDE.md`, qui est **explicitement hors dépôt**. Quelqu'un qui clone le projet ne les verra jamais et les enfreindra, une par une, en écrivant du code parfaitement raisonnable.","pt":"Estas cinco regras vivem hoje em `CLAUDE.md`, que está **explicitamente fora do repositório**. Quem clonar o projeto nunca as verá e as infringirá, uma a uma, escrevendo código perfeitamente razoável."},"f":{"fr":["Les cinq sont dans le dépôt, atteignables depuis `CONTRIBUTING.md`.","Chacune porte l'incident qui l'a produite, quand il existe."],"pt":["As cinco estão no repositório, alcançáveis a partir de `CONTRIBUTING.md`.","Cada uma traz o incidente que a produziu, quando existe."]},"dep":{"fr":"Sert **A2** et **A4**.","pt":"Serve **A2** e **A4**."},"r":["CLAUDE.md, doctrines internalisées","PLAN_DE_MARCHE §8"],"verif":{"fr":"31/08 — `CONTRIBUTING.md` existe, mais aucune occurrence d'`actionBox` ni de `workflow_note` n'y est atteignable. Le constat tient.","pt":"31/08 — `CONTRIBUTING.md` existe, mas nenhuma ocorrência de `actionBox` nem `workflow_note` é alcançável dali."}},{"id":"K1","d":"K","p":"P0","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Faire adopter l'acte de création du Fonds AnarBib","pt":"Fazer adotar a ata de criação do Fundo AnarBib"},"v":{"fr":"Un projet d'acte est rédigé et archivé. Il n'a pas été adopté. **C'est le préalable politique à l'ouverture de tout canal d'encaissement : rien ne bouge avant.**","pt":"Um projeto de ata está redigido e arquivado. Não foi adotado. **É o preliminar político à abertura de qualquer canal de arrecadação: nada se move antes.**"},"w":{"fr":"L'acte doit faire quatre choses : créer le fonds, désigner nommément la personne qui tient la clé Pix, désigner la personne dépositaire de la part européenne, et fixer le principe du rapport annuel.","pt":"A ata deve fazer quatro coisas: criar o fundo, designar nominalmente a pessoa que detém a chave Pix, designar a pessoa depositária da parte europeia, e fixar o princípio do relatório anual."},"y":{"fr":"Les frais de fonctionnement — environ **36 € par mois, 430 € par an**, intégralement adossés à des factures — sortent aujourd'hui de la poche d'une seule personne. Deux caisses sont prévues, avec un seul registre : la caisse brésilienne finance les dépenses locales, la caisse européenne finance l'infrastructure. **L'argent doit atterrir là où les factures se paient.**","pt":"As despesas de funcionamento — cerca de **36 € por mês, 430 € por ano**, integralmente lastreadas em faturas — saem hoje do bolso de uma só pessoa. Duas caixas estão previstas, com um único registro: a caixa brasileira financia as despesas locais, a caixa europeia financia a infraestrutura. **O dinheiro deve pousar onde as faturas se pagam.**"},"f":{"fr":["L'acte est adopté et archivé.","La personne qui tient la clé Pix l'accepte en connaissance de cause.","Le nom public de la caisse est arrêté.","**Son article 1 suffit à lui seul à publier un canal honnêtement, si l'assemblée tarde.**"],"pt":["A ata está adotada e arquivada.","A pessoa que detém a chave Pix aceita com pleno conhecimento.","O nome público da caixa está definido.","**Seu artigo 1 basta sozinho para publicar um canal honestamente, se a assembleia demorar.**"]},"dep":{"fr":"Bloque **K2**.","pt":"Bloqueia **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25 §9","MINUTA_ata_fundo_anarbib_CCLA_2026-08-26"]},{"id":"K2","d":"K","p":"P1","s":"bloque","e":"M","sk":["collectif"],"t":{"fr":"Ouvrir les canaux d'encaissement dormants","pt":"Abrir os canais de arrecadação dormentes"},"v":{"fr":"Liberapay est en ligne et a reçu son premier don le 27/08. L'encart « soutenir financièrement » est publié dans les dix locales et nomme Liberapay comme unique canal ouvert. **Pix et IBAN dorment** dans un bloc de commentaire HTML entre les marqueurs `ENCART-DORMANT-START` et `ENCART-DORMANT-END`. Wero est en attente d'une réponse de l'établissement bancaire.","pt":"O Liberapay está no ar e recebeu sua primeira doação em 27/08. O encarte «apoiar financeiramente» está publicado nas dez locales e nomeia o Liberapay como único canal aberto. **Pix e IBAN dormem** num bloco de comentário HTML entre os marcadores `ENCART-DORMANT-START` e `ENCART-DORMANT-END`."},"w":{"fr":"Côté Brésil : une clé aléatoire dédiée créée par la personne mandatée, et l'ouverture d'un compte au numéro d'entreprise — une coopérative de crédit est plus cohérente qu'une banque commerciale. Côté Europe : décider quel compte reçoit. Puis remplir les gabarits, retirer les deux marqueurs de commentaire, et supprimer les deux paragraphes « en cours d'ouverture ».","pt":"Lado Brasil: uma chave aleatória dedicada criada pela pessoa mandatada, e a abertura de uma conta no CNPJ — uma cooperativa de crédito é mais coerente que um banco comercial. Lado Europa: decidir qual conta recebe. Depois preencher os modelos, retirar os dois marcadores de comentário, e suprimir os dois parágrafos «em abertura»."},"y":{"fr":"Le Pix ne peut pas être créé depuis la France — l'élargissement d'août 2026 ne vaut que pour envoyer. Et une clé posée sur le numéro fiscal personnel d'un compa l'expose au contrôle fiscal : d'où l'urgence du compte au numéro d'entreprise. Sur l'IBAN, la recommandation écrite est de le publier **en clair** — un « demander par courriel » fera perdre plus de dons qu'il n'évitera d'ennuis.","pt":"O Pix não pode ser criado desde a França — a ampliação de agosto de 2026 só vale para enviar. E uma chave posta no CPF pessoal de um compa o expõe à malha fina: daí a urgência da conta no CNPJ. Sobre o IBAN, a recomendação escrita é publicá-lo **em claro** — um «pedir por e-mail» fará perder mais doações do que evitará aborrecimentos."},"f":{"fr":["Au moins un canal supplémentaire est ouvert et publié dans les dix locales.","Le générateur des pages de comptes a été relancé après chaque édition de `FINANCES.md`.","Si la réponse sur Wero est négative, **la phrase Wero est retirée du bloc dormant des dix fichiers** — le gabarit y est encore.","Rappel : le hook `pre-push` refuse la poussée tant qu'un gabarit est visible hors du bloc dormant."],"pt":["Pelo menos um canal adicional está aberto e publicado nas dez locales.","O gerador das páginas de contas foi reexecutado após cada edição de `FINANCES.md`.","Se a resposta sobre o Wero for negativa, **a frase Wero é retirada do bloco dormente dos dez arquivos** — o modelo ainda está lá.","Lembrete: o hook `pre-push` recusa o push enquanto um modelo estiver visível fora do bloco dormente."]},"dep":{"fr":"**Bloqué par K1.**","pt":"**Bloqueado por K1.**"},"r":["PLAN_financement_AnarBib_2026-08-25","FINANCES.md"],"verif":{"fr":"31/08 — les marqueurs `ENCART-DORMANT-START` sont en place dans les dix fichiers du dépôt vitrine. Rien de neuf mesurable d'ici sur Pix, IBAN ou Wero.","pt":"31/08 — os marcadores `ENCART-DORMANT-START` estão nos dez arquivos do repositório vitrine."}},{"id":"K3","d":"K","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Tenir le registre public des comptes","pt":"Manter o registro público das contas"},"v":{"fr":"`FINANCES.md` est à la racine du dépôt vitrine et dix pages publiques en sont engendrées, par langue. Le générateur signale nommément toute cellule non traduite. Un tableau distinct porte ce qu'une personne a avancé avant que le fonds existe — environ **228 € de mars à août 2026** — et la question de savoir si c'est une dette à rembourser est laissée à l'assemblée.","pt":"`FINANCES.md` está na raiz do repositório vitrine e dez páginas públicas são geradas a partir dele, por língua. O gerador sinaliza nominalmente toda célula não traduzida. Uma tabela distinta traz o que uma pessoa adiantou antes de o fundo existir — cerca de **228 € de março a agosto de 2026** — e a questão de saber se é uma dívida a reembolsar fica para a assembleia."},"w":{"fr":"Consigner chaque recette et chaque dépense au fil de l'eau, et relancer le générateur après chaque édition.","pt":"Registrar cada receita e cada despesa continuamente, e reexecutar o gerador após cada edição."},"y":{"fr":"**Consigner les avances passées dès maintenant, avant la délibération** — dans un an, personne ne se souviendra des montants. Le régime de transparence choisi est le rapport annuel plus les comptes sur demande ; il ne tient que si le registre est à jour.","pt":"**Registrar os adiantamentos passados desde já, antes da deliberação** — daqui a um ano, ninguém se lembrará dos valores. O regime de transparência escolhido é o relatório anual mais as contas sob pedido; só se sustenta se o registro estiver atualizado."},"f":{"fr":["Le registre est à jour et les dix pages reflètent son contenu.","Anticipation notée : le renouvellement du domaine en mars 2027 coûtera plus cher, la promotion de première année ne se reconduisant pas."],"pt":["O registro está atualizado e as dez páginas refletem seu conteúdo.","Antecipação anotada: a renovação do domínio em março de 2027 custará mais caro, a promoção do primeiro ano não se renovando."]},"dep":{"fr":"Indépendant de **K1** et **K2**.","pt":"Independente de **K1** e **K2**."},"r":["PLAN_financement_AnarBib_2026-08-25","tools/build-finances-pages.cjs"]},{"id":"K4","d":"K","p":"P2","s":"ouvert","e":"S","sk":["aucune"],"t":{"fr":"Corriger le générateur des pages de vie privée sur la langue déclarée","pt":"Corrigir o gerador das páginas de privacidade sobre a língua declarada"},"v":{"fr":"Les pages écrites à la main portent `<html lang=\"pt-BR\">` ; `tools/build-privacy-pages.cjs` émet `lang=\"pt\"`. **Les pages ont raison, le script a tort.**","pt":"As páginas escritas à mão trazem `<html lang=\"pt-BR\">`; `tools/build-privacy-pages.cjs` emite `lang=\"pt\"`. **As páginas têm razão, o script está errado.**"},"w":{"fr":"Corriger le script pour qu'il émette l'étiquette complète, et vérifier que le générateur des pages de comptes, bâti sur le même modèle, ne reproduit pas le défaut.","pt":"Corrigir o script para que emita a etiqueta completa, e verificar que o gerador das páginas de contas, construído no mesmo modelo, não reproduza o defeito."},"y":{"fr":"L'attribut de langue est ce qu'utilisent les lecteurs d'écran pour choisir leur prononciation. `pt` fera lire du portugais du Portugal à un public brésilien. C'est le même critère WCAG 3.1.1 que le projet a déjà corrigé côté application.","pt":"O atributo de língua é o que os leitores de tela usam para escolher sua pronúncia. `pt` fará ler português de Portugal para um público brasileiro. É o mesmo critério WCAG 3.1.1 que o projeto já corrigiu do lado do aplicativo."},"f":{"fr":["Le script émet l'étiquette complète.","Les pages engendrées et les pages écrites à la main concordent."],"pt":["O script emite a etiqueta completa.","As páginas geradas e as páginas escritas à mão concordam."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["Dépôt vitrine anarbib/pages","tools/build-privacy-pages.cjs"],"verif":{"fr":"31/08 — `tools/build-privacy-pages.cjs:243` émet toujours `lang` brut, et la page engendrée `pt/privacidade/` porte `lang=\"pt\"` là où les pages écrites à la main (`index.html`, `pt/index.html`) portent `lang=\"pt-BR\"`. Le générateur des finances fait, lui, la conversion (`HTML_LANG[lang]`) : le modèle du correctif est déjà dans le dépôt, à la ligne 252 du fichier voisin.","pt":"31/08 — `build-privacy-pages.cjs:243` ainda emite `lang` bruto (`pt`), enquanto as páginas à mão trazem `pt-BR`. O gerador de finanças faz a conversão (`HTML_LANG[lang]`): o modelo do corretivo já está no repositório."}},{"id":"K5","d":"K","p":"P1","s":"en-cours","e":"M","sk":["collectif"],"t":{"fr":"Tenir l'intervention de Bologne et en tirer les suites","pt":"Realizar a intervenção de Bolonha e tirar as consequências"},"v":{"fr":"Atelier AnarBib le 12/09 au matin, assemblée ouverte le 13. Un jeu de 29 diapositives italien-anglais est prêt, ainsi qu'une brochure manifeste bilingue. Trois objectifs annoncés : la genèse et la conception, le panorama des fonctionnalités, et **un appel à participation**.","pt":"Oficina AnarBib em 12/09 pela manhã, assembleia aberta em 13. Um conjunto de 29 slides italiano-inglês está pronto, assim como um folheto manifesto bilíngue. Três objetivos anunciados: a gênese e a concepção, o panorama das funcionalidades, e **um chamado à participação**."},"w":{"fr":"Demander le créneau d'intervention à l'assemblée du 13, chronométrer la version italienne à voix haute, imprimer le dossier sur papier — tout le monde n'ouvre pas un PDF dans une salle —, et répéter la démonstration **hors ligne**, au cas où le réseau manque.","pt":"Pedir o horário de intervenção à assembleia do dia 13, cronometrar a versão italiana em voz alta, imprimir o material em papel — nem todo mundo abre um PDF numa sala —, e ensaiar a demonstração **off-line**, caso a rede falte."},"y":{"fr":"L'appel à participation est ce qui décide de **A1** et de **A3**. Le but énoncé est qu'AnarBib cesse d'être un projet solitaire : que le code évolue par des contributions humaines plutôt que par de l'assistance automatique, et que les coûts soient mutualisés. Point de vigilance : la colonne « manquant » de la diapositive 21 est **largement périmée** — beaucoup de ce qu'elle liste a été livré depuis.","pt":"O chamado à participação é o que decide **A1** e **A3**. O objetivo enunciado é que o AnarBib deixe de ser um projeto solitário: que o código evolua por contribuições humanas em vez de assistência automática, e que os custos sejam mutualizados. Ponto de vigilância: a coluna «faltando» do slide 21 está **amplamente vencida** — muito do que ela lista foi entregue desde então."},"f":{"fr":["L'intervention a eu lieu et l'appel a été porté à l'assemblée.","Les contacts pris sont consignés, avec ce que chacun a proposé.","Sur l'accessibilité, dire les deux : des fonctionnalités sont implémentées, aucun audit indépendant n'a été mené (voir **E1**)."],"pt":["A intervenção ocorreu e o chamado foi levado à assembleia.","Os contatos feitos estão registrados, com o que cada um propôs.","Sobre acessibilidade, dizer os dois: funcionalidades estão implementadas, nenhuma auditoria independente foi conduzida (ver **E1**)."]},"dep":{"fr":"Gel du code en production à partir du 08/09.","pt":"Congelamento do código em produção a partir de 08/09."},"r":["CALENDRIER_bologne_2026-08-27","PLAN_intervention_FICEDL_Bologne_2026-09-12"]},{"id":"K6","d":"K","p":"P2","s":"en-cours","e":"S","sk":["collectif"],"t":{"fr":"Préparer la rencontre avec leftove.rs et May Day Rooms","pt":"Preparar o encontro com leftove.rs e May Day Rooms"},"v":{"fr":"**Le message est parti** — autour du 19/08, soit trois semaines avant la rencontre, ce qui était exactement la fenêtre visée : assez tôt pour qu'ils regardent AnarBib sans que ce soit urgent. **L'atelier AnarBib est le matin, l'atelier leftove.rs l'après-midi du 12/09, même salle, même journée.** Ce qui reste ouvert, ce sont les réponses et la préparation de la journée.","pt":"**A mensagem foi enviada** — por volta de 19/08, três semanas antes do encontro, exatamente a janela visada: cedo o bastante para que olhassem o AnarBib sem que fosse urgente. **A oficina AnarBib é de manhã, a oficina leftove.rs à tarde do dia 12/09, mesma sala, mesmo dia.** O que continua aberto são as respostas e a preparação do dia."},"w":{"fr":"Relancer si besoin, et préparer les trois questions posées pour qu'elles se discutent sur place : le vocabulaire de sujets, le profil de numérisation (ils ont 16 000 documents océrisés), et NORLA et la cartographie. Plus la question sur l'auto-hébergement au collectif technique présent.","pt":"Retomar o contato se necessário, e preparar as três perguntas feitas para que sejam discutidas no local: o vocabulário de assuntos, o perfil de digitalização (eles têm 16 000 documentos ocerizados), e a NORLA e a cartografia. Mais a pergunta sobre auto-hospedagem ao coletivo técnico presente."},"y":{"fr":"Deux ateliers le même jour dans la même salle, sur des sujets voisins, sans que les deux équipes se soient parlé, serait un gâchis. Et il y a un point à regarder avant, pas après : **leftove.rs est sous licence CC BY-NC-SA, et la clause non commerciale n'est pas une licence libre au sens strict.**","pt":"Duas oficinas no mesmo dia na mesma sala, sobre assuntos vizinhos, sem que as duas equipes tenham se falado, seria um desperdício. E há um ponto a olhar antes, não depois: **leftove.rs está sob licença CC BY-NC-SA, e a cláusula não comercial não é uma licença livre em sentido estrito.**"},"f":{"fr":["Les trois questions ont une réponse, ou un créneau de discussion est calé pour le 12/09.","**Point à regarder avant la rencontre, pas après** : leftove.rs est sous licence CC BY-NC-SA, et la clause non commerciale n'est pas une licence libre au sens strict."],"pt":["As três perguntas têm resposta, ou um horário de conversa está marcado para 12/09.","**Ponto a olhar antes do encontro, não depois**: leftove.rs está sob licença CC BY-NC-SA, e a cláusula não comercial não é uma licença livre em sentido estrito."]},"dep":{"fr":"Le 12/09, dans la journée. Lié à **D4** (matériel éphémère) et **H6** (alignement des vocabulaires).","pt":"Em 12/09, no mesmo dia. Ligado a **D4** (material efêmero) e **H6** (alinhamento dos vocabulários)."},"r":["VEILLE_leftovers_maydayrooms_2026-08-19","CALENDRIER_bologne_2026-08-27"]},{"id":"K7","d":"K","p":"P1","s":"en-cours","e":"L","sk":["collectif"],"t":{"fr":"Mener la formation des deux coordinations BLMF jusqu'à l'autonomie","pt":"Conduzir a formação das duas coordenações BLMF até a autonomia"},"v":{"fr":"Le matériel est livré : 89 diapositives en portugais du Brésil, six modules, trois rencontres, six exercices pratiques, notes d'animation dans chaque diapositive. Ni l'une ni l'autre des deux personnes n'est bibliothécaire ou informaticienne.","pt":"O material está entregue: 89 slides em português do Brasil, seis módulos, três encontros, seis exercícios práticos, notas de animação em cada slide. Nenhuma das duas pessoas é bibliotecária ou informática."},"w":{"fr":"Avant la première séance : créer sur `blmf-teste` les deux comptes de coordination, un ou deux comptes de lecture fictifs, et les cinq fiches fautives de l'exercice 2. Puis le suivi de huit semaines : cinq fiches par semaine **toutes avec leur provenance**, un jour de comptoir par semaine, une consultation menée de bout en bout avec négociation réelle, et le vote du profil de la bibliothèque porté en assemblée.","pt":"Antes do primeiro encontro: criar em `blmf-teste` as duas contas de coordenação, uma ou duas contas de leitura fictícias, e as cinco fichas defeituosas do exercício 2. Depois o acompanhamento de oito semanas: cinco fichas por semana **todas com sua proveniência**, um dia de balcão por semana, uma consulta conduzida de ponta a ponta com negociação real, e o voto do perfil da biblioteca levado à assembleia."},"y":{"fr":"Deux personnes autonomes sur la coordination d'une bibliothèque, c'est **A1** à l'échelle locale. Le principe pédagogique tient en trois mots — *« cliqua, não vai quebrar nada ! »* — et il est tenable parce que les transitions impossibles ne s'affichent pas, les boutons bloqués sont pré-désactivés avec une explication, et la base refuse les combinaisons impossibles. Les neuf gestes irréversibles sont nommés explicitement.","pt":"Duas pessoas autônomas na coordenação de uma biblioteca é **A1** na escala local. O princípio pedagógico cabe em três palavras — *«cliqua, não vai quebrar nada!»* — e é sustentável porque as transições impossíveis não aparecem, os botões travados vêm pré-desativados com uma explicação, e o banco recusa as combinações impossíveis. Os nove gestos irreversíveis são nomeados explicitamente."},"f":{"fr":["Les huit semaines sont faites, avec le rituel hebdomadaire de trente minutes et ses trois questions fixes.","La feuille de lacunes alimentée par ce rituel devient l'ordre du jour suivant **et un matériau de contribution au projet**.","L'engagement chiffré est tenu : **aucune fiche nouvelle sans mode d'acquisition** — le rattrapage rétroactif des 2 450 fiches sans donnée d'acquisition n'est pas demandé, seul l'arrêt de la dette l'est."],"pt":["As oito semanas estão feitas, com o ritual semanal de trinta minutos e suas três perguntas fixas.","A folha de lacunas alimentada por esse ritual vira a pauta seguinte **e um material de contribuição ao projeto**.","O compromisso quantificado é cumprido: **nenhuma ficha nova sem modo de aquisição** — a recuperação retroativa das 2 450 fichas sem dado de aquisição não é pedida, só a parada da dívida é."]},"dep":{"fr":"S'appuie sur **G3** et **G4** pour le bac à sable.","pt":"Apoia-se em **G3** e **G4** para o ambiente de teste."},"r":["PLAN_formation_coordination_BLMF_2026-08-26","GABARITO_exercicio2_formacao_BLMF_2026-08-26"]},{"id":"K8","d":"K","p":"P2","s":"ouvert","e":"M","sk":["collectif"],"t":{"fr":"Finir le texte d'orientation sur les outils de bibliothèques militantes","pt":"Terminar o texto de orientação sobre as ferramentas de bibliotecas militantes"},"v":{"fr":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` est un **squelette destiné à être co-signé**. Six points sont explicitement à vérifier ou à trancher, et la section finale — celle qui porte l'appel — reste à écrire.","pt":"`ORIENTATION_outils_bibliotheques_militantes_2026-08-26` é um **esqueleto destinado a ser cossinado**. Seis pontos estão explicitamente a verificar ou decidir, e a seção final — a que carrega o chamado — resta escrever."},"w":{"fr":"Lister quelques hébergeurs associatifs, vérifier la vitalité actuelle de PMB, vérifier la licence exacte de Pandora et ce qu'implique l'entrée d'une archive partenaire, vérifier l'adresse de contact du réseau ALN, trancher la ligne « catalogue consultable, pas de prêt » du tableau, faire compléter la description d'AnarcosyndicalismeBOOK, et **écrire ensemble la section finale « Ce qui manque » — c'est l'appel**.","pt":"Listar alguns provedores associativos, verificar a vitalidade atual do PMB, verificar a licença exata do Pandora e o que implica a entrada de um arquivo parceiro, verificar o endereço de contato da rede ALN, decidir a linha «catálogo consultável, sem empréstimo» da tabela, fazer completar a descrição do AnarcosyndicalismeBOOK, e **escrever juntos a seção final «O que falta» — é o chamado**."},"y":{"fr":"Trois positions du texte méritent d'être tenues telles quelles. **La question qui décide de tout : qui tiendra le serveur, et pendant combien de temps ?** **Soyez honnêtes sur l'échelle** — en dessous de quelques centaines de documents sans prêt, un tableur fait le travail, et **AnarBib est surdimensionné pour un petit fonds sans prêt**. Et la déclaration d'intérêt explicite : les deux projets comparés sont libres, les deux sont tenus par une seule personne — **se le dire vaut mieux que de le découvrir**.","pt":"Três posições do texto merecem ser mantidas tais quais. **A pergunta que decide tudo: quem vai manter o servidor, e por quanto tempo?** **Sejam honestos quanto à escala** — abaixo de algumas centenas de documentos sem empréstimo, uma planilha faz o serviço, e **o AnarBib é superdimensionado para um pequeno acervo sem empréstimo**. E a declaração de interesse explícita: os dois projetos comparados são livres, os dois são mantidos por uma só pessoa — **dizer isso vale mais que descobrir**."},"f":{"fr":["Les six vérifications sont faites.","La section finale est écrite à plusieurs.","Le texte est traduit une fois stabilisé, pas avant."],"pt":["As seis verificações estão feitas.","A seção final está escrita em conjunto.","O texto é traduzido depois de estabilizado, não antes."]},"dep":{"fr":"Lié à **K5** et **H7**.","pt":"Ligado a **K5** e **H7**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26"]},{"id":"F6","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno"],"t":{"fr":"`notify-internal-task` tourne sur une copie gelée de toute la pile courriel","pt":"`notify-internal-task` corre sobre uma cópia congelada de toda a pilha de e-mail"},"v":{"fr":"**La divergence de signature est refermée le 30/08.** `resolveMailRouting` de la copie accepte désormais une locale et lit `signature_short_i18n[locale]`, à l'identique du canonique ; `renderEmail` la transmet, et les trois envois du gestionnaire passent la leur — elle était déjà calculée quatre lignes plus haut à chaque fois, par `normalizeTaskLocale`. Un avis de tâche à la BLMF est maintenant signé dans la langue de qui le lit. Gardé par `src/tests/notify-internal-task-signature.test.js`, 6 tests qui exercent le vrai fichier sur le contexte réel de la BLMF — dont un qui vérifie que **sans locale, le comportement est exactement celui d'avant**.\n\n**Ce qui reste ouvert, et c'est le gros :** les 9 fichiers d'infrastructure dupliqués. Le relevé ci-dessous ne bouge pas.\n\n**Mesuré le 30/08, après ouverture de l'item.** Il y a bien trois arbres `_shared` sous `supabase/functions/`, mais ils ne pèsent pas le même poids : celui de `catalog_metadata_lookup` ne contient qu'un `cors.ts` sans équivalent canonique — ce n'est pas une duplication. Le cas réel est `notify-internal-task`.\n\nSes 12 fichiers se répartissent ainsi : **3 sont légitimement privés** (`data/internal-tasks.ts`, `handlers/internal-task.ts`, `i18n/task-mail-strings.ts`, absents du canonique) et **9 sont de l'infrastructure dupliquée, toute divergente** — `library-mail-routing` (116 lignes d'écart), `library-notification-context` (122), `mail/layout` (140), `transport/email` (121), `shared/format` (89), `context/policies` (42), `core/webhook` (30), `core/env` (10), `shared/branding` (4). Environ **694 lignes** au total.\n\n**Pourquoi ces copies existent : la question n'a pas de réponse dans le dépôt.** Elles apparaissent dans le TOUT PREMIER commit (`e6ec991a`, 21/08/2026) — 1 479 fichiers et 615 892 insertions sous un message qui parle d'un bouton de l'écran de catalogage. C'est l'import initial du dépôt : l'histoire ne commence pas avant. Aucune décision n'est écrite nulle part.\n\n**Ce qui diverge vraiment, vérifié :** le canonique résout la signature de pied de page en `signature_short_i18n[locale]` avec repli sur `signature_short` ; la copie ne connaît que `signature_short`, et son `resolveMailRouting` n'accepte même pas de locale. **La BLMF a `signature_short_i18n` rempli en six langues.** Ses avis de tâche interne sont donc signés « Equipe da BLMF » quelle que soit la langue de la personne, là où tous les autres courriels de la même bibliothèque disent « L'équipe de la BLMF » à qui lit en français.\n\n**Ce qui NE diverge pas, vérifié aussi :** `transportDisabledReason` est identique octet pour octet dans les deux copies, et le contexte de la copie lit bien `channel_active`. L'interrupteur d'envoi rendu réel le 30/08 est donc honoré ici comme ailleurs. `policyEnabled` et `resolveNetworkLogoUrl`, présents dans la copie seule, ne sont appelés par personne.","pt":"**A divergência de assinatura foi fechada em 30/08.** O `resolveMailRouting` da cópia aceita agora uma locale e lê `signature_short_i18n[locale]`, igual ao canónico; `renderEmail` transmite-a, e os três envios do gestor passam a sua — já estava calculada quatro linhas acima de cada vez, por `normalizeTaskLocale`. Um aviso de tarefa na BLMF é agora assinado na língua de quem o lê. Guardado por `src/tests/notify-internal-task-signature.test.js`, 6 testes que exercitam o ficheiro real sobre o contexto real da BLMF — incluindo um que verifica que **sem locale, o comportamento é exatamente o de antes**.\n\n**O que fica em aberto, e é o grosso:** os 9 ficheiros de infraestrutura duplicados. O levantamento abaixo não muda.\n\n**Medido em 30/08, depois da abertura do item.** Há de facto três árvores `_shared` sob `supabase/functions/`, mas não pesam o mesmo: a de `catalog_metadata_lookup` contém apenas um `cors.ts` sem equivalente canónico — não é duplicação. O caso real é `notify-internal-task`.\n\nOs seus 12 ficheiros repartem-se assim: **3 são legitimamente privados** (`data/internal-tasks.ts`, `handlers/internal-task.ts`, `i18n/task-mail-strings.ts`, ausentes do canónico) e **9 são infraestrutura duplicada, toda divergente** — `library-mail-routing` (116 linhas de diferença), `library-notification-context` (122), `mail/layout` (140), `transport/email` (121), `shared/format` (89), `context/policies` (42), `core/webhook` (30), `core/env` (10), `shared/branding` (4). Cerca de **694 linhas** ao todo.\n\n**Porque existem estas cópias: a pergunta não tem resposta no repositório.** Aparecem no PRIMEIRO commit (`e6ec991a`, 21/08/2026) — 1 479 ficheiros e 615 892 inserções sob uma mensagem que fala de um botão do ecrã de catalogação. É a importação inicial: a história não começa antes. Nenhuma decisão está escrita em lado nenhum.\n\n**O que diverge realmente, verificado:** o canónico resolve a assinatura de rodapé em `signature_short_i18n[locale]` com recurso a `signature_short`; a cópia só conhece `signature_short`, e o seu `resolveMailRouting` nem sequer aceita uma locale. **A BLMF tem `signature_short_i18n` preenchido em seis línguas.** Os seus avisos de tarefa interna são portanto assinados «Equipe da BLMF» seja qual for a língua da pessoa, ao passo que todos os outros e-mails da mesma biblioteca dizem «L'équipe de la BLMF» a quem lê em francês.\n\n**O que NÃO diverge, também verificado:** `transportDisabledReason` é idêntico byte a byte nas duas cópias, e o contexto da cópia lê bem `channel_active`. O interruptor de envio tornado real em 30/08 é portanto honrado aqui como noutro sítio. `policyEnabled` e `resolveNetworkLogoUrl`, presentes só na cópia, não são chamados por ninguém."},"w":{"fr":"La première question de l'item — *pourquoi ces copies existent* — est close : elles précèdent l'histoire du dépôt, aucune décision n'est écrite. Il faut donc trancher **sur le fond**, pas par archéologie.\n\n**Le plus petit geste utile**, si on ne veut pas ouvrir le chantier : donner à `resolveMailRouting` de la copie le paramètre `locale` et la lecture de `signature_short_i18n`, à l'identique du canonique. Ça referme la seule divergence dont on a constaté l'effet.\n\n**Le geste complet** : faire pointer les 9 fichiers d'infrastructure de `notify-internal-task` vers `../../_shared/`, et ne garder en propre que les 3 fichiers de tâches. Le risque n'est pas nul — 694 lignes d'écart contiennent peut-être d'autres différences voulues — donc chaque fichier se reprend un par un, en comparant les envois avant/après sur un avis de tâche réel.\n\n**Et dans les deux cas** : écrire en tête de `notify-internal-task/_shared/` ce qui y vit et pourquoi, pour que la prochaine personne n'ait pas à refaire ce relevé.","pt":"A primeira pergunta do item — *porque existem estas cópias* — está encerrada: precedem a história do repositório, nenhuma decisão está escrita. É preciso portanto decidir **pelo mérito**, não por arqueologia.\n\n**O menor gesto útil**, se não se quiser abrir o canteiro: dar ao `resolveMailRouting` da cópia o parâmetro `locale` e a leitura de `signature_short_i18n`, igual ao canónico. Isso fecha a única divergência cujo efeito foi constatado.\n\n**O gesto completo**: fazer os 9 ficheiros de infraestrutura de `notify-internal-task` apontarem para `../../_shared/`, e guardar em próprio apenas os 3 ficheiros de tarefas. O risco não é nulo — 694 linhas de diferença talvez contenham outras diferenças desejadas — portanto cada ficheiro retoma-se um a um, comparando os envios antes/depois num aviso de tarefa real.\n\n**E nos dois casos**: escrever no cabeçalho de `notify-internal-task/_shared/` o que ali vive e porquê, para que a próxima pessoa não tenha de refazer este levantamento."},"y":{"fr":"Parce que le routage du courriel est justement l'endroit où une divergence ne se voit pas. Un logo résolu autrement, une règle d'extinction appliquée dans une copie et pas dans l'autre : le message part quand même, et personne ne compare deux courriels envoyés par deux fonctions différentes.\n\nC'est exactement ce qui vient de se produire à l'échelle d'une seule colonne — `register` résolvait le logo autrement que toutes les autres fonctions, et l'écart a tenu des mois. Ici l'écart porte sur 139 lignes.","pt":"Porque o roteamento do e-mail é justamente o sítio onde uma divergência não se vê. Um logótipo resolvido de outra forma, uma regra de extinção aplicada numa cópia e não na outra: a mensagem parte na mesma, e ninguém compara dois e-mails enviados por duas funções diferentes.\n\nÉ exatamente o que acaba de acontecer à escala de uma única coluna — `register` resolvia o logótipo de forma diferente de todas as outras funções, e a diferença durou meses. Aqui a diferença é de 139 linhas."},"f":{"fr":["~~La divergence de signature localisée est refermée~~ — fait le 30/08, gardé par 6 tests.","Le sort des 9 fichiers d'infrastructure dupliqués est tranché — réunis, ou assumés par écrit.","Un en-tête dans `notify-internal-task/_shared/` dit ce qui y vit et pourquoi.","La collision de nom sur `resolveLibraryLogoUrl` est levée."],"pt":["~~A divergência de assinatura localizada está fechada~~ — feito em 30/08, guardado por 6 testes.","O destino dos 9 ficheiros de infraestrutura duplicados está decidido — reunidos, ou assumidos por escrito.","Um cabeçalho em `notify-internal-task/_shared/` diz o que ali vive e porquê.","A colisão de nome sobre `resolveLibraryLogoUrl` está resolvida."]},"dep":{"fr":"Aucune. Le relevé est fait — il est dans cet item. Ce qui reste est une décision de portée, pas une enquête.","pt":"Nenhuma. O levantamento está feito — está neste item. O que resta é uma decisão de alcance, não uma investigação."},"r":["supabase/functions/_shared/context/library-mail-routing.ts","supabase/functions/notify-internal-task/_shared/ (12 fichiers, dont 9 dupliqués)","library_notification_profiles.signature_short_i18n (BLMF, 6 langues)","commit e6ec991a — import initial du dépôt, 21/08/2026","src/tests/notify-internal-task-signature.test.js"],"verif":{"fr":"30/08 — relevé fait fichier par fichier, après ouverture de l'item : 9 fichiers dupliqués et tous divergents, ~694 lignes, et **une seule divergence à effet observable** — la signature de pied de page non traduite, **refermée le soir même et gardée par 6 tests**. L'origine des copies n'a pas de réponse dans le dépôt : elles sont dans le premier commit. Ce qui reste est une décision de portée, pas une mesure.","pt":"30/08 — levantamento feito ficheiro a ficheiro, depois da abertura do item: 9 ficheiros duplicados e todos divergentes, ~694 linhas, e **uma única divergência com efeito observável** — a assinatura de rodapé não traduzida, **fechada na mesma noite e guardada por 6 testes**. A origem das cópias não tem resposta no repositório: estão no primeiro commit. O que resta é uma decisão de alcance, não uma medição."}},{"id":"F7","d":"F","p":"P2","s":"ouvert","e":"S","sk":["sysadmin"],"t":{"fr":"Treize secrets de fonction sont déclarés et vides, sans qu'on sache lesquels le sont exprès","pt":"Treze segredos de função estão declarados e vazios, sem que se saiba quais o são de propósito"},"v":{"fr":"Relevé le 30/08 en vérifiant tout autre chose — que le secret des avis de tâche était bien le même des deux côtés.\n\n`supabase secrets list` ne montre pas les valeurs mais leur **empreinte SHA-256**. Or `e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855` est l'empreinte de la **chaîne vide** — et treize secrets la portent :\n\n```\nADMIN_EMAIL_NOTIFY_EVENT   ADMIN_NAME            BRAND_NAME\nFOOTER_TEXT                REPLY_TO_EMAIL        REGIMENTO_URL\nLIBRARY_ADMIN_EMAIL        LIBRARY_ADMIN_NAME    LIBRARY_BRAND_NAME\nLIBRARY_FOOTER_TEXT        LIBRARY_LOGO_URL\nBLMF_INTERNAL_REDIRECT_EMAIL   BTL_INTERNAL_REDIRECT_EMAIL\n```\n\nDans le tableau de bord, un secret vide et un secret renseigné se ressemblent : les deux existent, les deux affichent une valeur masquée. **Seule l'empreinte les distingue.**\n\n**Deux sont vides exprès, et c'est vérifiable :** les deux `*_INTERNAL_REDIRECT_EMAIL`. C'est ainsi que la redirection des avis internes reste inactive — le 30/08, la notification d'inscription de la BTL est bien partie à l'adresse réelle de la bibliothèque, précisément parce que ce secret est vide.\n\n**Onze sont dans une chaîne de repli**, donc sans conséquence visible : `_shared/core/env.ts` lit `ADMIN_NAME || LIBRARY_ADMIN_NAME || ANARBIB_ADMIN_NAME || …`, et les variantes `ANARBIB_*` / `NETWORK_*` sont, elles, renseignées.\n\n**Sauf une.** `REGIMENTO_URL` est vide, et ses deux replis — `ANARBIB_REGIMENTO_URL`, `NETWORK_REGIMENTO_URL` — **n'existent pas du tout** dans la liste. La constante vaut donc la chaîne vide, et `footerPadrao` omet purement et simplement la ligne « Regimento : ouvrir » de tous les courriels qui l'utilisent. Le lien vers le règlement de la bibliothèque n'a jamais été affiché.","pt":"Levantado em 30/08 ao verificar outra coisa — que o segredo dos avisos de tarefa era o mesmo dos dois lados.\n\n`supabase secrets list` não mostra os valores mas a sua **impressão SHA-256**. Ora `e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855` é a impressão da **cadeia vazia** — e treze segredos carregam-na.\n\nNo painel, um segredo vazio e um segredo preenchido parecem-se: ambos existem, ambos mostram um valor mascarado. **Só a impressão os distingue.**\n\n**Dois estão vazios de propósito, e é verificável:** os dois `*_INTERNAL_REDIRECT_EMAIL`. É assim que o reencaminhamento dos avisos internos fica inativo — em 30/08, a notificação de inscrição da BTL foi mesmo para o endereço real da biblioteca, precisamente porque este segredo está vazio.\n\n**Onze estão numa cadeia de recurso**, portanto sem consequência visível: `_shared/core/env.ts` lê `ADMIN_NAME || LIBRARY_ADMIN_NAME || ANARBIB_ADMIN_NAME || …`, e as variantes `ANARBIB_*` / `NETWORK_*` estão preenchidas.\n\n**Exceto uma.** `REGIMENTO_URL` está vazio, e os seus dois recursos — `ANARBIB_REGIMENTO_URL`, `NETWORK_REGIMENTO_URL` — **não existem de todo** na lista. A constante vale portanto a cadeia vazia, e `footerPadrao` omite pura e simplesmente a linha «Regimento: abrir» de todos os e-mails que a usam. A ligação para o regulamento da biblioteca nunca foi mostrada."},"w":{"fr":"**D'abord le seul qui a une conséquence** : décider si le lien vers le règlement doit figurer au pied des courriels. Si oui, renseigner `REGIMENTO_URL` — une seule variable, et la ligne apparaît. Si non, retirer le code qui l'attend dans `footerPadrao`, plutôt que de laisser une branche morte.\n\n**Puis le ménage** : pour chacun des douze autres, trancher entre *vide exprès* et *jamais rempli*. Les deux redirections sont clairement dans le premier cas — elles méritent un commentaire quelque part, parce qu'un secret vide qui EST le réglage est exactement le genre de chose qu'on « répare » par erreur. Les dix autres sont des doublons de chaînes de repli : s'ils ne servent à rien, les supprimer vaut mieux que les garder vides.\n\n**Et retenir la technique**, parce qu'elle ne coûte rien : `supabase secrets list` publie un SHA-256, `sha256()` est natif côté base. Comparer un secret de fonction et un secret du vault, ou repérer les vides, se fait donc sans qu'aucune valeur ne soit lue par personne.","pt":"**Primeiro o único que tem consequência**: decidir se a ligação para o regulamento deve figurar no rodapé dos e-mails. Se sim, preencher `REGIMENTO_URL` — uma só variável, e a linha aparece. Se não, retirar o código que a espera em `footerPadrao`, em vez de deixar um ramo morto.\n\n**Depois a limpeza**: para cada um dos outros doze, decidir entre *vazio de propósito* e *nunca preenchido*. Os dois reencaminhamentos estão claramente no primeiro caso — merecem um comentário algures, porque um segredo vazio que É o ajuste é exatamente o género de coisa que se «repara» por engano. Os outros dez são duplicados de cadeias de recurso: se não servem, suprimi-los vale mais do que mantê-los vazios.\n\n**E reter a técnica**, porque não custa nada: `supabase secrets list` publica um SHA-256, `sha256()` é nativo do lado da base. Comparar um segredo de função e um segredo do vault, ou detetar os vazios, faz-se portanto sem que valor nenhum seja lido por ninguém."},"y":{"fr":"Parce qu'un secret vide ne se signale pas. Il n'y a ni erreur au démarrage, ni ligne de journal : la constante vaut `\"\"`, le repli joue ou pas, et le courriel part avec un champ en moins que personne ne remarque — c'est le cas de `REGIMENTO_URL` depuis toujours.\n\nEt parce que l'inverse est plus dangereux encore : les deux redirections sont vides **exprès**, et c'est ce vide qui fait le réglage. Quelqu'un qui « complète les secrets manquants » sans savoir lesquels sont délibérés rebrancherait la redirection des avis d'inscription sans s'en apercevoir.","pt":"Porque um segredo vazio não se assinala. Não há erro no arranque, nem linha de registo: a constante vale `\"\"`, o recurso joga ou não, e o e-mail parte com um campo a menos que ninguém repara — é o caso de `REGIMENTO_URL` desde sempre.\n\nE porque o inverso é ainda mais perigoso: os dois reencaminhamentos estão vazios **de propósito**, e é esse vazio que faz o ajuste. Quem «completasse os segredos em falta» sem saber quais são deliberados voltaria a ligar o reencaminhamento dos avisos de inscrição sem dar por isso."},"f":{"fr":["Le sort du lien « Regimento » est tranché : la variable est renseignée, ou le code qui l'attend est retiré.","Chacun des douze autres secrets vides est classé — voulu, ou à remplir, ou à supprimer.","Les deux redirections portent une note écrite disant que leur vide EST le réglage.","La méthode de comparaison par empreinte est notée quelque part de retrouvable."],"pt":["O destino da ligação «Regimento» está decidido: a variável está preenchida, ou o código que a espera é retirado.","Cada um dos outros doze segredos vazios está classificado — desejado, a preencher, ou a suprimir.","Os dois reencaminhamentos têm uma nota escrita a dizer que o seu vazio É o ajuste.","O método de comparação por impressão está anotado num sítio recuperável."]},"dep":{"fr":"Aucune. Le relevé est fait et tient dans l'item ; ce qui reste demande surtout de savoir ce qu'on voulait.","pt":"Nenhuma. O levantamento está feito e cabe no item; o que resta exige sobretudo saber o que se queria."},"r":["supabase secrets list --project-ref … (colonne DIGEST = SHA-256)","empreinte de la chaîne vide : e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","supabase/functions/_shared/core/env.ts (chaînes de repli)","footerPadrao — ligne « Regimento », jamais affichée"],"verif":{"fr":"31/08 — `supabase secrets list` rejoué : les treize mêmes secrets portent l'empreinte de la chaîne vide, ni plus ni moins. `REGIMENTO_URL` toujours vide, ses deux replis toujours absents : la ligne « Regimento » manque toujours des courriels.","pt":"31/08 — `supabase secrets list` refeito: os mesmos treze segredos com a impressão da cadeia vazia. `REGIMENTO_URL` segue vazio e sem fallback."}}],"etat":{"photo_intro":{"fr":"Relevé du **29 août 2026**. Base de production `uflwmikiyjfnikiphtcp` interrogée en lecture seule ; dépôt `codeberg.org/anarbib/anarbib` au commit `1d00ed2c`. Ces chiffres ne sont pas des estimations : ils sont la réponse d'une requête ou d'un `ls`. Ils périmeront vite — c'est normal, et c'est la raison pour laquelle ils sont datés.","pt":"Levantamento de **29 de agosto de 2026**. Banco de produção `uflwmikiyjfnikiphtcp` consultado em somente-leitura; repositório `codeberg.org/anarbib/anarbib` no commit `1d00ed2c`. Estes números não são estimativas: são a resposta de uma consulta ou de um `ls`. Vão vencer rápido — é normal, e é a razão pela qual estão datados."},"photo":[{"g":{"fr":"Base","pt":"Banco"},"rows":[[{"fr":"Tables `public`","pt":"Tabelas `public`"},"187",{"fr":"toutes avec RLS activé, 279 policies sur 174 tables","pt":"todas com RLS ativado, 279 policies em 174 tabelas"}],[{"fr":"Tables `ingest`","pt":"Tabelas `ingest`"},"10",{"fr":"8 étaient sans RLS le 29/08 au matin — **les 10 le sont depuis le soir** (item **B1**, soldé). Le schéma n'a jamais été exposé : ni `anon` ni `authenticated` n'y a `USAGE`","pt":"8 estavam sem RLS na manhã de 29/08 — **as 10 estão desde a noite** (item **B1**, liquidado). O esquema nunca esteve exposto: nem `anon` nem `authenticated` tem `USAGE` nele"}],[{"fr":"Vues `api`","pt":"Views `api`"},"68",{"fr":"**65 SECURITY INVOKER**, 3 DEFINER — les trois assumées et commentées `API-VUES-DEFINER` (item **B3**, soldé le 29/08)","pt":"**65 SECURITY INVOKER**, 3 DEFINER — les trois assumées et commentées `API-VUES-DEFINER` (item **B3**, soldé le 29/08)"}],[{"fr":"Fonct
