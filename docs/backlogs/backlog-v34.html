<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Backlog AnarBib v34</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Identite AnarBib : fond bordeaux sombre, Bitter en labeur, Big Shoulders
   en titraille (la police de la brochure manifeste), rouge AnarBib reserve
   aux signaux semantiques. Concu en sombre d'abord ; la variante claire
   garde le meme biais bordeaux plutot qu'un gris neutre. */
:root{
  color-scheme:light dark;
  /* clair */
  --bg:#f6f1ef; --panel:#fffdfc; --ink:#1a1012; --mut:#6d5b58; --line:#e3d6d2;
  --rule:#cbb8b3; --accent:#a81c1c; --accent-soft:#f5e7e6; --chip:#ece1de;
  --p0:#a81c1c; --p1:#9a6410; --p2:#4d6136; --p3:#6d5b58;
  --sp:clamp(16px,3vw,22px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}}
:root[data-theme="dark"]{
  --bg:#12090a; --panel:#1c1113; --ink:#ece2df; --mut:#a08e8a; --line:#33211f;
  --rule:#4a3230; --accent:#d95a4c; --accent-soft:#2c1414; --chip:#261719;
  --p0:#d95a4c; --p1:#cd9440; --p2:#8fa864; --p3:#a08e8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.62 Bitter,Georgia,"Times New Roman",serif;
  -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--sp) 96px}
header{padding:52px 0 20px;border-bottom:2px solid var(--rule);margin-bottom:0}
.eyebrow{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px}
h1{font-family:"Big Shoulders Display",Impact,"Haettenschweiler",sans-serif;
  font-weight:700;font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:.005em;
  text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.sub{color:var(--ink);font-size:clamp(16px,2.1vw,19px);margin:0;max-width:60ch}
.mta{margin:14px 0 0;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:11px 0;margin:0 0 8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--mut);border:1px solid var(--line);
  border-radius:2px;padding:4px 11px;cursor:pointer;line-height:1.4}
button:hover{color:var(--ink);border-color:var(--rule)}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
input[type=search]{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--line);
  border-radius:2px;background:var(--panel);color:var(--ink);min-width:170px;flex:1 1 170px}
h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;
  font-size:clamp(26px,3.6vw,34px);letter-spacing:.02em;text-transform:uppercase;
  margin:52px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--rule);text-wrap:balance}
h3{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;
  font-size:23px;letter-spacing:.05em;text-transform:uppercase;margin:34px 0 6px}
p{margin:0 0 14px;max-width:74ch}
.note{color:var(--mut);font-size:15px;font-style:italic;max-width:70ch}
.tbl{overflow-x:auto;margin:0 0 22px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.photo td:nth-child(1){width:32%}
.photo td:nth-child(2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--accent);padding-right:18px}
.photo td:nth-child(3){color:var(--mut)}
.clot td:nth-child(1){width:24%;font-weight:600}
.clot td:nth-child(2){width:30%;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--p2);
  border-radius:2px;padding:18px 20px;margin:0 0 12px}
.card.P0{border-left-color:var(--p0)}.card.P1{border-left-color:var(--p1)}
.card.P2{border-left-color:var(--p2)}.card.P3{border-left-color:var(--p3)}
.card h4{margin:0 0 10px;font-size:18.5px;line-height:1.32;font-weight:600;text-wrap:balance}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400;
  color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:2px;margin-right:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.07em;text-transform:uppercase;background:var(--chip);color:var(--mut);
  padding:2px 9px;border-radius:2px;line-height:1.5}
.chip.pr{color:var(--bg);background:var(--p2)}
.card.P0 .chip.pr{background:var(--p0)}.card.P1 .chip.pr{background:var(--p1)}
.card.P3 .chip.pr{background:var(--p3)}
.f{margin:14px 0 0}
.f dt{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:13.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:14px}
.f dd{margin:2px 0 0;max-width:74ch}
.f dd p{margin:0 0 9px}
.f dd p:last-child{margin-bottom:0}
.f ul,.f ol{margin:4px 0 9px;padding-left:19px}
.f dd>ol:last-child,.f dd>ul:last-child{margin-bottom:0}
.f li{margin:4px 0;max-width:72ch}
pre{background:var(--chip);border-left:2px solid var(--line);padding:10px 13px;
  margin:9px 0;overflow-x:auto;max-width:74ch}
pre code{background:none;padding:0;font-size:.84em;line-height:1.5;
  white-space:pre;word-break:normal}
.refs{font-size:12.5px;color:var(--mut);margin-top:15px;font-style:italic;max-width:none}
.prov{font-size:12.5px;color:var(--mut);font-style:italic;margin:6px 0 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--chip);padding:1px 5px;border-radius:2px;word-break:break-word}
.count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);
  font-size:14px;font-weight:400;letter-spacing:0;text-transform:none}
.ecart{border-left:2px solid var(--line);padding-left:16px;margin:0 0 18px;max-width:80ch}
.ecart b{display:block;margin-bottom:5px;font-weight:600}
.ecart span{display:block;font-size:15px;color:var(--mut);margin-bottom:4px}
.empty{color:var(--mut);font-style:italic;padding:26px 0}
@media (max-width:640px){
  header{padding-top:34px}
  .card{padding:14px 15px}
  .photo td:nth-child(1),.clot td:nth-child(1),.clot td:nth-child(2){width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const D = {"meta":{"version":"v34","date":"2026-08-29","previous":"AnarBib-Backlog-2026-06-17-v33.md","title":{"fr":"Backlog AnarBib v34","pt":"Backlog AnarBib v34"},"subtitle":{"fr":"Réécriture intégrale sur état vérifié — outil de travail pour les collaboratrices et collaborateurs à venir","pt":"Reescrita integral sobre estado verificado — ferramenta de trabalho para as colaboradoras e os colaboradores por vir"},"maj":"2026-09-22","releve":{"date":"2026-09-22","commit":"608995d0"}},"domains":[{"key":"A","label":{"fr":"Soutenabilité collective","pt":"Sustentabilidade coletiva"},"note":{"fr":"Ce que ni le code ni une seule personne ne régleront. Ce domaine passe avant tous les autres.","pt":"O que nem o código nem uma só pessoa vão resolver. Este domínio vem antes de todos os outros."}},{"key":"B","label":{"fr":"Base de données, sécurité, RLS","pt":"Banco de dados, segurança, RLS"},"note":{"fr":"191 tables, 694 fonctions SECURITY DEFINER, 332 policies (relevé du 06/09). La surface la plus large du projet.","pt":"191 tabelas, 694 funções SECURITY DEFINER, 332 policies (06/09). A maior superfície do projeto."}},{"key":"C","label":{"fr":"Catalogage et données documentaires","pt":"Catalogação e dados documentais"},"note":{"fr":"La dette ici n'est pas du code : ce sont des fiches à relire une par une.","pt":"A dívida aqui não é de código: são fichas para revisar uma a uma."}},{"key":"D","label":{"fr":"Périodiques, éphémères, ressources numériques","pt":"Periódicos, efêmeros, recursos digitais"},"note":{"fr":"Ce que la bibliothéconomie du livre ne sait pas décrire, et qui fait une part énorme de nos fonds.","pt":"O que a biblioteconomia do livro não sabe descrever, e que é uma parte enorme dos nossos acervos."}},{"key":"E","label":{"fr":"Front, OPAC, i18n, accessibilité","pt":"Front, OPAC, i18n, acessibilidade"},"note":{"fr":"10 locales à parité stricte, 6 570 clés chacune (06/09), vérifiées en intégration continue.","pt":"10 locales em paridade estrita, 6 570 chaves cada for feito. Nenhum código substitui."}},{"key":"P1","label":{"fr":"Prioritaire","pt":"Prioritário"},"desc":{"fr":"Corrige un défaut réel, ou débloque plusieurs autres chantiers.","pt":"Corrige um defeito real, ou desbloqueia vários outros canteiros."}},{"key":"P2","label":{"fr":"Courant","pt":"Corrente"},"desc":{"fr":"Utile, non bloquant, à prendre quand un créneau se libère.","pt":"Útil, não bloqueante, a pegar quando abrir uma janela."}},{"key":"P3","label":{"fr":"Différé","pt":"Adiado"},"desc":{"fr":"Différé volontairement, avec la raison écrite. Ne pas le reprendre sans rouvrir la raison.","pt":"Adiado deliberadamente, com o motivo escrito. Não retomar sem reabrir o motivo."}}],"states":[{"key":"ouvert","label":{"fr":"Ouvert","pt":"Aberto"}},{"key":"en-cours","label":{"fr":"En cours","pt":"Em curso"}},{"key":"a-verifier","label":{"fr":"À vérifier","pt":"A verificar"}},{"key":"bloque","label":{"fr":"Bloqué","pt":"Bloqueado"}},{"key":"gele","label":{"fr":"Gelé","pt":"Congelado"}},{"key":"decision","label":{"fr":"Décision collective","pt":"Decisão coletiva"}}],"efforts":[{"key":"S","label":{"fr":"une soirée","pt":"uma noite"}},{"key":"M","label":{"fr":"quelques jours","pt":"alguns dias"}},{"key":"L","label":{"fr":"plusieurs semaines","pt":"várias semanas"}},{"key":"XL","label":{"fr":"un chantier long","pt":"um canteiro longo"}},{"key":"?","label":{"fr":"non chiffré","pt":"não estimado"}}],"skills":[{"key":"aucune","label":{"fr":"aucune compétence technique","pt":"nenhuma competência técnica"}},{"key":"biblio","label":{"fr":"bibliothéconomie","pt":"biblioteconomia"}},{"key":"langue","label":{"fr":"langue maternelle","pt":"língua materna"}},{"key":"sql","label":{"fr":"SQL / PostgreSQL","pt":"SQL / PostgreSQL"}},{"key":"front","label":{"fr":"React / JavaScript","pt":"React / JavaScript"}},{"key":"deno","label":{"fr":"Deno / TypeScript","pt":"Deno / TypeScript"}},{"key":"sysadmin","label":{"fr":"administration système","pt":"administração de sistemas"}},{"key":"powershell","label":{"fr":"PowerShell (hooks Windows)","pt":"PowerShell (hooks Windows)"}},{"key":"collectif","label":{"fr":"délibération collective","pt":"deliberação coletiva"}}],"items":[{"id":"A1","d":"A","p":"P0","s":"decision","e":"?","sk":["collectif","aucune"],"t":{"fr":"Obtenir au moins deux autres administrateur·rices réseau","pt":"Obter pelo menos duas outras pessoas administradoras de rede"},"v":{"fr":"Vérifié en base le 29/08 : le réseau compte **un seul administrateur**. Les tables `network_administrators`, `network_administrator_cooptation_proposals` et `network_administrator_cooptation_votes` sont vides après quelques insertions historiques.","pt":"Verificado no banco em 29/08: a rede conta com **um único administrador**. As tabelas `network_administrators`, `network_administrator_cooptation_proposals` e `network_administrator_cooptation_votes` estão vazias após algumas inserções históricas."},"w":{"fr":"Trouver et coopter deux personnes de plus, dans deux collectifs différents, disposées à porter les décisions fédérales : admission d'une bibliothèque, arbitrage entre bibliothèques, ouverture de la moisson.","pt":"Encontrar e cooptar mais duas pessoas, em dois coletivos diferentes, dispostas a carregar as decisões federais: admissão de uma biblioteca, arbitragem entre bibliotecas, abertura da coleta."},"y":{"fr":"C'est l'item qui commande tous les autres. Des décisions fédérales sont **volontairement différées** faute de pouvoir être prises à plusieurs — l'admission de la Bibliothèque SOLIDAIRES au premier chef. Tant qu'il n'y a qu'une personne, le mécanisme de cooptation reste un dispositif sans usage, et le réseau reste suspendu à quelqu'un qui peut tomber malade.","pt":"É o item que comanda todos os outros. Decisões federais são **deliberadamente adiadas** por não poderem ser tomadas em conjunto — a admissão da Biblioteca SOLIDAIRES em primeiro lugar. Enquanto houver uma só pessoa, o mecanismo de cooptação continua um dispositivo sem uso, e a rede continua suspensa a alguém que pode adoecer."},"f":{"fr":["Deux personnes supplémentaires portent le rôle `network_administrator` en base.","Une décision fédérale a été prise à trois de bout en bout, avec sa trace dans `network_administrator_audit`.","Le circuit de cooptation a été emprunté au moins une fois : proposition, délai, ratification."],"pt":["Duas pessoas a mais carregam o papel `network_administrator` no banco.","Uma decisão federal foi tomada em três, de ponta a ponta, com seu rastro em `network_administrator_audit`.","O circuito de cooptação foi percorrido pelo menos uma vez: proposta, prazo, ratificação."]},"dep":{"fr":"Bloque **G7** (décision sur SOLIDAIRES) et conditionne **A2**.","pt":"Bloqueia **G7** (decisão sobre SOLIDAIRES) e condiciona **A2**."},"r":["docs/CHANTIERS_OUVERTS.md §7","REGISTRE §1 RES-D11","CALENDRIER_bologne_2026-08-27"],"verif":{"fr":"31/08 — `network_administrators` : 1 ligne. Rien n'a bougé.","pt":"31/08 — `network_administrators`: 1 linha. Nada mudou."}},{"id":"A3","d":"A","p":"P0","s":"ouvert","e":"L","sk":["sysadmin"],"t":{"fr":"Sortir le runner d'intégration continue de la machine du mainteneur","pt":"Tirar o runner de integração contínua da máquina do mantenedor"},"v":{"fr":"`.forgejo/workflows/ci.yml` et `sql-tests.yml` portent tous deux `runs-on: anarbib-local` — un `act_runner` auto-hébergé sur le WSL2 du mainteneur. Machine éteinte, **rien ne se déploie**, et l'échec est parfois silencieux.","pt":"`.forgejo/workflows/ci.yml` e `sql-tests.yml` trazem ambos `runs-on: anarbib-local` — um `act_runner` auto-hospedado no WSL2 do mantenedor. Máquina desligada, **nada se implanta**, e a falha às vezes é silenciosa."},"w":{"fr":"Faire tourner le runner ailleurs que sur un poste de travail personnel : machine de l'hébergeur, seconde machine du réseau, ou runner partagé. La logique de déploiement est déjà extraite dans `scripts/ci/deployer-backend.sh` et rejouable à la main — la moitié du travail est faite.","pt":"Rodar o runner em outro lugar que não uma estação de trabalho pessoal: máquina do provedor, segunda máquina da rede, ou runner compartilhado. A lógica de implantação já está extraída em `scripts/ci/deployer-backend.sh` e é reexecutável à mão — metade do trabalho está feita."},"y":{"fr":"Tant que le runner est unique et personnel, aucune procédure ne peut rendre le déploiement fiable, et personne d'autre ne peut fusionner une contribution. C'est la seconde moitié de la dépendance à une seule personne, après **A1**.","pt":"Enquanto o runner for único e pessoal, nenhum procedimento pode tornar a implantação confiável, e ninguém mais pode integrar uma contribuição. É a segunda metade da dependência de uma só pessoa, depois de **A1**."},"f":{"fr":["Un push sur `main` déclenche un déploiement sans que la machine du mainteneur soit allumée.","Le garde-fou d'exclusion du routeur `main` est préservé aux deux endroits (workflow et script).","La procédure de remise en route du runner est écrite pour quelqu'un qui ne l'a pas installé."],"pt":["Um push em `main` dispara uma implantação sem que a máquina do mantenedor esteja ligada.","A guarda de exclusão do roteador `main` é preservada nos dois lugares (workflow e script).","O procedimento de recolocação do runner em funcionamento está escrito para quem não o instalou."]},"dep":{"fr":"Lié à **I2** (bascule auto-hébergée). Peut se faire avant, sur l'infrastructure actuelle.","pt":"Ligado a **I2** (migração auto-hospedada). Pode ser feito antes, na infraestrutura atual."},"r":["CLAUDE.md, piège connu n°1","REPRISE_bascule_autohebergee_2026-08-26"],"verif":{"fr":"31/08 — 7 occurrences de `runs-on: anarbib-local` dans `.forgejo/workflows/`. Rien n'a bougé.","pt":"31/08 — 7 ocorrências de `runs-on: anarbib-local` em `.forgejo/workflows/`. Nada mudou."}},{"id":"B10","d":"B","p":"P3","s":"ouvert","e":"M","sk":["sql"],"t":{"fr":"Hygiène de performance : 170 index inutilisés, 38 clés étrangères non indexées, 24 policies permissives en double","pt":"Higiene de performance: 170 índices não usados, 38 chaves estrangeiras não indexadas, 24 policies permissivas duplicadas"},"v":{"fr":"256 avis de performance au 29/08. Les tables les plus chargées en index inutilisés sont `library_partnerships` (6), `books` (5), `membership_payments` (4). Les 24 policies permissives en double portent toutes sur le rôle `authenticated` en `SELECT`, sur des tables centrales (`books`, `authors`, `exemplares`, `subjects`, `works`).\n\n**Requalifié par la mesure (GLB v17 ch. 8.1, contre-vérifiée le 02/09).** Le volet clés étrangères avait été « soldé » le 02/07 (151 → 15) ; il est à **38** (32 `public` + 6 `ingest`) huit semaines plus tard, par le fonctionnement normal du projet et sans qu'aucune faute soit commise — chaque table de qualité catalographique apporte ses colonnes d'acteur, chaque colonne d'acteur sa FK non indexée. La campagne reste différée à raison ; **le garde qui l'empêche de se rouvrir est extrait en B21** et, lui, n'attend pas la volumétrie.","pt":"256 avisos de performance em 29/08. As tabelas mais carregadas de índices não usados são `library_partnerships` (6), `books` (5), `membership_payments` (4). As 24 policies permissivas duplicadas incidem todas sobre o papel `authenticated` em `SELECT`, em tabelas centrais (`books`, `authors`, `exemplares`, `subjects`, `works`).\n\n**Requalificado pela medida (GLB v17 cap. 8.1, contraverificada em 02/09).** As FK sem índice, «saldadas» em 02/07 (151 → 15), estão em **38** oito semanas depois, pelo funcionamento normal do projeto. A campanha segue adiada com razão; **a guarda que impede a reabertura foi extraída em B21** e não espera a volumetria."},"w":{"fr":"Trois passes distinctes, à ne pas mélanger : fusionner les paires de policies permissives ; indexer les clés étrangères qui servent réellement ; ne supprimer un index inutilisé que si l'on comprend pourquoi il avait été créé.","pt":"Três passagens distintas, a não misturar: fundir os pares de policies permissivas; indexar as chaves estrangeiras que realmente servem; só suprimir um índice não usado se se compreender por que foi criado."},"y":{"fr":"À la volumétrie actuelle — 2 676 notices, 16 comptes — **rien de ceci ne se voit**. C'est un chantier de pré-montée en charge, différé à dessein depuis juillet. Le noter permet de ne pas le redécouvrir en urgence le jour où une bibliothèque arrive avec 100 000 notices.","pt":"Na volumetria atual — 2 676 registros, 16 contas — **nada disso se vê**. É um canteiro de pré-crescimento, adiado de propósito desde julho. Anotá-lo permite não redescobri-lo às pressas no dia em que uma biblioteca chegar com 100 000 registros."},"f":{"fr":["Les 24 avis de policies en double sont résorbés — c'est la passe la plus rentable.","Les clés étrangères des tables réellement écrites sont indexées.","Les index supprimés le sont avec la raison écrite."],"pt":["Os 24 avisos de policies duplicadas estão resolvidos — é a passagem mais rentável.","As chaves estrangeiras das tabelas realmente escritas estão indexadas.","Os índices suprimidos o são com o motivo escrito."]},"dep":{"fr":"À reprendre si une bibliothèque à gros fonds rejoint le réseau.","pt":"A retomar se uma biblioteca de grande acervo entrar na rede."},"r":["ETAT-lancement-consolide-2026-07-03 §2 item 7","Advisors performance du 29/08/2026"],"verif":{"fr":"31/08 — 254 avis : 167 index inutilisés, 38 clés étrangères non indexées, **25** tables en policies permissives en double (`book_reading_notes` s'y est ajoutée avec les notes de lecture), 14 tables sans clé primaire, 1 avis de connexions.","pt":"31/08 — 254 avisos: 167 índices sem uso, 38 chaves estrangeiras sem índice, **25** tabelas com policies permissivas em dobro (`book_reading_notes` entrou na lista), 14 sem chave primária."}},{"id":"B13","d":"B","p":"P3","s":"ouvert","e":"L","sk":["sql","sysadmin"],"t":{"fr":"Décider du sort des 221 migrations : squash ou pas","pt":"Decidir o destino das 221 migrações: squash ou não"},"v":{"fr":"221 migrations appliquées, dont la première est un `baseline_live` de **2,4 Mo** — le plus gros fichier du dépôt. Le squash est marqué « décidé, non commencé » depuis le 20/08, à une époque où le compte était de 146.","pt":"221 migrações aplicadas, das quais a primeira é um `baseline_live` de **2,4 MB** — o maior arquivo do repositório. O squash está marcado «decidido, não iniciado» desde 20/08, numa época em que a contagem era de 146."},"w":{"fr":"Soit reconstruire un `baseline` à partir du schéma courant et archiver les migrations antérieures, soit assumer la chaîne longue et documenter pourquoi. Le rejeu complet prend aujourd'hui environ 25 minutes, mesuré.","pt":"Ou reconstruir um `baseline` a partir do esquema atual e arquivar as migrações anteriores, ou assumir a cadeia longa e documentar por quê. A reexecução completa leva hoje cerca de 25 minutos, medido."},"y":{"fr":"Le risque du squash est entier : il réécrit la seule trace ordonnée de ce qui a été fait, et le harnais de tests SQL rejoue toute la chaîne à chaque fois. Ne pas le faire coûte du temps de CI ; le faire mal coûte la capacité à reconstruire. **Ne pas s'y engager avant que A2 ait réussi au moins une fois.**","pt":"O risco do squash é inteiro: reescreve o único rastro ordenado do que foi feito, e o arnês de testes SQL reexecuta toda a cadeia a cada vez. Não fazê-lo custa tempo de CI; fazê-lo mal custa a capacidade de reconstruir. **Não se comprometer antes que A2 tenha sido bem-sucedido pelo menos uma vez.**"},"f":{"fr":["Une décision écrite au REGISTRE, dans un sens ou dans l'autre.","Si squash : la reconstruction depuis le nouveau baseline a été éprouvée sur une machine tierce."],"pt":["Uma decisão escrita no REGISTRO, num sentido ou no outro.","Se squash: a reconstrução a partir do novo baseline foi testada numa máquina de terceiro."]},"dep":{"fr":"**Bloqué par A2.** Ne pas commencer avant.","pt":"**Bloqueado por A2.** Não começar antes."},"r":["ETAT-AVANCEMENT-multisessions","docs/schema/baseline_schema_2026-06-11.sql"],"verif":{"fr":"31/08 — 243 migrations appliquées : vingt-deux de plus qu'au 29/08. L'argument du squash grossit tout seul.","pt":"31/08 — 243 migrações aplicadas: vinte e duas a mais que em 29/08."}},{"id":"C3","d":"C","p":"P1","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Mener la revue humaine des autorités : patronymes, casse, titres","pt":"Conduzir a revisão humana das autoridades: sobrenomes, caixa, títulos"},"v":{"fr":"Les 19 migrations `conventions_*` sont appliquées depuis le 21/08 : les référentiels sont normalisés, les mécaniques sûres ont été passées, la file de vérification existe et l'application permet d'y travailler. **Ce qui reste est la part qu'aucune machine ne fait.**","pt":"As 19 migrações `conventions_*` estão aplicadas desde 21/08: os referenciais estão normalizados, as mecânicas seguras foram passadas, a fila de verificação existe e o aplicativo permite trabalhar nela. **O que resta é a parte que nenhuma máquina faz.**"},"w":{"fr":"Reprendre les trois tables de revue du schéma `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — et les traiter fiche par fiche depuis l'Atelier autorités.","pt":"Retomar as três tabelas de revisão do esquema `conv_backup` — `titres_a_revoir_20260820` (211), `autorites_casse_a_revoir_20260820` (1 274), `autorites_patronyme_a_revoir_20260820` (22) — e tratá-las ficha por ficha a partir da Oficina de autoridades."},"y":{"fr":"Sur les 22 doubles patronymes hispaniques signalés automatiquement, **trois sont des faux positifs connus** (Mechoso, Borges, Marcos) : 14 % d'erreur. Et sur les 13 points d'accès sur particule, **quatre sont corrects** (Van der Walt, De Amicis, Di Paolo, De Greef). Un script qui « finirait » ce travail introduirait des fautes dans un catalogue qui n'en a pas.","pt":"Dos 22 duplos sobrenomes hispânicos apontados automaticamente, **três são falsos positivos conhecidos** (Mechoso, Borges, Marcos): 14 % de erro. E dos 13 pontos de acesso sobre partícula, **quatro estão corretos** (Van der Walt, De Amicis, Di Paolo, De Greef). Um script que «terminasse» esse trabalho introduziria erros num catálogo que não os tem."},"f":{"fr":["Les trois tables sont vidées par validation humaine, pas par script.","**Interdiction absolue** : décommenter le SQL d'application, le compléter, ou passer `valide = true` en masse.","Les 9 points d'accès posés sur un suffixe de filiation — type `FILHO, Fábio Luz` — sont traités en premier : l'audit les donne pour **le défaut le plus grave du lot**."],"pt":["As três tabelas são esvaziadas por validação humana, não por script.","**Proibição absoluta**: descomentar o SQL de aplicação, completá-lo, ou passar `valide = true` em massa.","Os 9 pontos de acesso postos sobre um sufixo de filiação — tipo `FILHO, Fábio Luz` — são tratados primeiro: a auditoria os dá como **o defeito mais grave do lote**."]},"dep":{"fr":"Se fait dans l'application, sans migration. C'est un chantier de bibliothéconomie, ouvert à qui sait cataloguer.","pt":"Faz-se no aplicativo, sem migração. É um canteiro de biblioteconomia, aberto a quem sabe catalogar."},"r":["AUDIT_conventions_catalographiques_2026-08-20","REGISTRE §37 CONV"],"verif":{"fr":"31/08 — la file `catalog_review_queue` mesurée, 310 lignes : le lot **patronymes est terminé** (20 validés, 2 écartés, 0 à revoir — les 9 suffixes de filiation, donnés pour le défaut le plus grave, sont derrière), `autorite_casse` presque (3 à revoir sur 61), `titre_casse` porte le gros du reste (174 à revoir sur 211), et un quatrième lot `autorite_collectivite` s'est ajouté (2 à revoir sur 16). **179 verdicts humains restent.** **03/09** — 1 532 autorités (1 305 à midi : +227 créées par le lot C5 le soir même, jamais relues, non typées), 1 468 non typées, `name_lang` sur 22, 6 orphelines, 2 doublons de forme de tri sans casse ; `conv_backup` : titres 211, casse 1 274, patronymes 22, inchangés. **Xavier demande un audit en profondeur des autorités et une correction propre, en nouvelle session** : cadrage écrit, `docs/journal/cadrages/REPRISE_audit_autorites_en_profondeur_2026-09-03.md` — recompter d'abord, rejouer l'audit du 20/08, corriger par lots de la file ou migrations testées, jamais en masse. **03/09, nuit — audit fait** (`journal/audits/AUDIT_autorites_2026-09-03.md`) : 1 532 autorités, 23 livres sans autorité (18 écartés + 5 à `autor` NULL), 3 orphelines (pas 6), **13 paires de doublons exacts** dont 9 nées du lot C5, 17 `preferred_name` en capitales après la correction du 21/08, 14 collectivités inversées ratées par le motif, 12 fiches doubles (O8). **Livré** : cinq migrations testées (CONV-2 sur 17 fiches ; homonymie sans casse ni accents + 8 signalements (les 5 paires de fixtures de formation exclues) ; motif des collectivités + re-semis ~36 ; second semis casse ~40 ; nouveau lot `autorite_forme` ~95). **La file porte désormais ~170 verdicts de plus**, tous humains : lots `autorite_collectivite`, `autorite_casse`, `autorite_forme` dans `/atelier-autoridades`. **Puis, le soir même, sur décision de Xavier (« corrige ce qui est évident ») : quatre migrations d'évidences** — 10 doublons exacts fusionnés, 4 non-agents retirés, 24 contributeurs liés à leur fiche homonyme exacte, 43 lignes évidentes de la file tranchées et appliquées (Xavier en avait posé 87 lui-même entre 20 h 00 et 20 h 07). Restent à la main : les fiches doubles (décision O8), les périodiques et l'éditeur logés dans `authors`, les pseudonymes et les formes hispaniques ambiguës.","pt":"31/08 — a fila `catalog_review_queue` medida, 310 linhas: o lote de **patronímicos está terminado** (0 a rever), `autorite_casse` quase (3 a rever), `titre_casse` carrega o grosso (174 a rever), e um quarto lote `autorite_collectivite` (2 a rever). **Restam 179 vereditos humanos.** **03/09** — 1 532 autoridades (+227 criadas pelo lote C5, não relidas), 1 468 sem tipo. **Auditoria em profundidade pedida, em nova sessão** : cadramento em `docs/journal/cadrages/REPRISE_audit_autorites_en_profondeur_2026-09-03.md`. **03/09, noite — auditoria feita** (`journal/audits/AUDIT_autorites_2026-09-03.md`): 1 532 autoridades, 23 livros sem autoridade (18 descartados + 5 com `autor` NULL), 3 órfãs (não 6), **13 pares de duplicatas exatas**, 9 delas nascidas do lote C5, 17 `preferred_name` em maiúsculas após a correção de 21/08, 14 coletividades invertidas que o padrão não via, 12 fichas duplas (O8). **Entregue**: cinco migrações testadas (CONV-2 em 17 fichas; homonímia sem caixa nem acentos + 8 sinalizações (os 5 pares de fixtures de formação excluídos); padrão das coletividades + nova semeadura ~36; segunda semeadura do lote caixa ~40; novo lote `autorite_forme` ~95). **A fila carrega agora ~170 vereditos a mais**, todos humanos: lotes `autorite_collectivite`, `autorite_casse`, `autorite_forme` em `/atelier-autoridades`. **Depois, na mesma noite, por decisão de Xavier (« corrige o que é evidente »): quatro migrações de evidências** — 10 duplicatas exatas fundidas, 4 não-agentes retirados, 24 contribuidores vinculados à sua ficha homônima exata, 43 linhas evidentes da fila decididas e aplicadas (Xavier havia posto 87 vereditos ele mesmo entre 20h00 e 20h07). Ficam à mão: as fichas duplas (decisão O8), os periódicos e a editora alojados em `authors`, os pseudônimos e as formas hispânicas ambíguas."}},{"id":"C4","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Renseigner les pays manquants sur 722 fiches d'autorité","pt":"Preencher os países ausentes em 722 fichas de autoridade"},"v":{"fr":"**722 fiches sur 1 305 (55 %) n'ont pas de `country`.** Or c'est `country` qui pilote la règle d'entrée du nom : sans lui, la détection des doubles patronymes hispaniques ne voit qu'une fraction des cas. Les 22 signalements sont un **plancher**, pas un total.","pt":"**722 fichas de 1 305 (55 %) não têm `country`.** Ora, é `country` que comanda a regra de entrada do nome: sem ele, a detecção dos duplos sobrenomes hispânicos só vê uma fração dos casos. Os 22 apontamentos são um **piso**, não um total."},"w":{"fr":"Renseigner `country` par lots, à partir des notices, des sources externes déjà branchées (Wikidata, VIAF) et de la connaissance du fonds. Puis rejouer la détection des patronymes.","pt":"Preencher `country` por lotes, a partir dos registros, das fontes externas já conectadas (Wikidata, VIAF) e do conhecimento do acervo. Depois reexecutar a detecção dos sobrenomes."},"y":{"fr":"C'est le prérequis dur de toute la chaîne de conventions : `CONV-7` fait de `country` en ISO 3166-1 α-2 une condition, et `CONV-3` fait piloter la casse par la langue. Un catalogue à 55 % sans pays applique ses propres règles à moitié.","pt":"É o pré-requisito duro de toda a cadeia de convenções: `CONV-7` faz de `country` em ISO 3166-1 α-2 uma condição, e `CONV-3` faz a caixa ser comandada pela língua. Um catálogo com 55 % sem país aplica as próprias regras pela metade."},"f":{"fr":["La proportion de fiches sans `country` est descendue sous 20 %.","La détection des doubles patronymes a été rejouée et la nouvelle liste est passée en revue humaine."],"pt":["A proporção de fichas sem `country` caiu abaixo de 20 %.","A detecção dos duplos sobrenomes foi reexecutada e a nova lista passou por revisão humana."]},"dep":{"fr":"Prérequis de la seconde passe de **C3**.","pt":"Pré-requisito da segunda passagem de **C3**."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A5","REGISTRE §37 CONV-7"],"verif":{"fr":"31/08 — 726 fiches sur 1 305 sans `country` (55,6 %) : quatre de plus qu'au 29/08. La dette avance plus vite que sa résorption.","pt":"31/08 — 726 de 1 305 fichas sem `country` (55,6 %): quatro a mais que em 29/08."}},{"id":"C6","d":"C","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Livrer les trois assistances de saisie prévues par la spec des conventions","pt":"Entregar as três assistências de digitação previstas pela spec das convenções"},"v":{"fr":"La base sait normaliser ; l'interface de saisie n'assiste pas encore. Trois dispositifs sont spécifiés et non livrés : l'assistant de découpage du nom (§7.1), le bouton « Normalizar maiúsculas » avec aperçu (§7.2), et la file de contrôles de cohérence en arrière-plan (§7.3).","pt":"O banco sabe normalizar; a interface de digitação ainda não assiste. Três dispositivos estão especificados e não entregues: o assistente de separação do nome (§7.1), o botão «Normalizar maiúsculas» com pré-visualização (§7.2), e a fila de controles de coerência em segundo plano (§7.3)."},"w":{"fr":"Trois écrans, dans cet ordre de valeur : le bouton de normalisation de casse (le plus simple, actif seulement si la langue est renseignée) ; l'assistant de découpage, qui propose mot par mot avec un bouton « Corrigir » et une explication d'une ligne ; la file de contrôles, qui signale sans bloquer.","pt":"Três telas, nesta ordem de valor: o botão de normalização de caixa (o mais simples, ativo só se a língua estiver preenchida); o assistente de separação, que propõe palavra por palavra com um botão «Corrigir» e uma explicação de uma linha; a fila de controles, que sinaliza sem bloquear."},"y":{"fr":"C'est la contrainte de conception la plus ferme du projet : **toute règle doit être soit invisible parce que calculée, soit assistée parce que proposée et confirmée, jamais un savoir préalable exigé à la saisie.** Les personnes qui cataloguent ne sont ni bibliothécaires ni informaticiennes. Sans ces trois écrans, les conventions restent une doctrine que seul leur auteur sait appliquer.","pt":"É a restrição de concepção mais firme do projeto: **toda regra deve ser ou invisível porque calculada, ou assistida porque proposta e confirmada, nunca um saber prévio exigido na digitação.** As pessoas que catalogam não são bibliotecárias nem informáticas. Sem essas três telas, as convenções continuam uma doutrina que só seu autor sabe aplicar."},"f":{"fr":["Les trois dispositifs existent et **aucun n'est bloquant**.","Chaque proposition est refusable, avec l'original conservé.","Les libellés existent dans les dix locales en une seule passe."],"pt":["Os três dispositivos existem e **nenhum é bloqueante**.","Cada proposta é recusável, com o original conservado.","Os rótulos existem nas dez locales numa só passagem."]},"dep":{"fr":"S'appuie sur les migrations `conventions_*` déjà en place.","pt":"Apoia-se nas migrações `conventions_*` já em vigor."},"r":["spec-conventions-catalographiques-v0.1 §7"]},{"id":"C7","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio","aucune"],"t":{"fr":"Indexer par matière les 1 549 notices qui n'ont aucun sujet","pt":"Indexar por assunto os 1 549 registros que não têm nenhum assunto"},"v":{"fr":"Vérifié le 29/08 : **1 127 notices indexées sur 2 676**, soit 42 %. 1 284 affectations réparties sur 89 sujets locaux. Côté public anonyme, la couverture est encore plus basse.","pt":"Verificado em 29/08: **1 127 registros indexados de 2 676**, ou seja 42 %. 1 284 atribuições distribuídas em 89 assuntos locais. Do lado público anônimo, a cobertura é ainda mais baixa."},"w":{"fr":"Indexer, notice par notice, avec le vocabulaire local et le thésaurus FICEDL déjà chargé. Aucune compétence technique : c'est un travail de bibliothèque, fait depuis l'application.","pt":"Indexar, registro por registro, com o vocabulário local e o tesauro FICEDL já carregado. Nenhuma competência técnica: é um trabalho de biblioteca, feito a partir do aplicativo."},"y":{"fr":"Un catalogue à 42 % d'indexation ne se parcourt pas : il se cherche par titre, ce qui suppose de savoir ce qu'on cherche. Le sujet est le seul chemin d'entrée pour quelqu'un qui vient voir ce qu'il y a sur une question. Et le thésaurus étant traduit en dix langues, chaque affectation vaut simultanément pour les dix.","pt":"Um catálogo com 42 % de indexação não se percorre: busca-se por título, o que pressupõe saber o que se procura. O assunto é o único caminho de entrada para quem vem ver o que há sobre uma questão. E, como o tesauro está traduzido em dez línguas, cada atribuição vale simultaneamente para as dez."},"f":{"fr":["La couverture dépasse 70 % des notices publiques.","Le sujet parasite `pierre-joseph-proudhon` (0 livre) est supprimé, et `anarcocomunismo` est vérifié.","Les huit sujets AnarBib sans équivalent FICEDL restent rattachés à un terme plus large et sont **portés à la fédération comme contribution, pas comme plainte** : éducation libertaire (64 livres), abolitionnisme pénal (13), écologie sociale (10), anarcha-féminisme, communisme libertaire, anarcho-punk, especifismo, cabanagem."],"pt":["A cobertura passa de 70 % dos registros públicos.","O assunto parasita `pierre-joseph-proudhon` (0 livro) é suprimido, e `anarcocomunismo` é verificado.","Os oito assuntos AnarBib sem equivalente FICEDL continuam vinculados a um termo mais amplo e são **levados à federação como contribuição, não como queixa**: educação libertária (64 livros), abolicionismo penal (13), ecologia social (10), anarcafeminismo, comunismo libertário, anarcopunk, especifismo, cabanagem."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["AnarBib-Backlog-2026-06-17-v33 §5","ETAT-lancement-consolide-2026-07-03 §2 item 6"],"verif":{"fr":"31/08 — 1 122 notices indexées sur 2 659 (42,2 %), 1 279 affectations, 89 sujets. Les quatre comptes ont légèrement baissé depuis le 29/08 : les fusions de doublons du 31/08 ont retiré des notices, pas des indexations.","pt":"31/08 — 1 122 de 2 659 registros indexados (42,2 %), 1 279 atribuições, 89 assuntos. As fusões de duplicatas de 31/08 explicam a leve queda."}},{"id":"C8","d":"C","p":"P3","s":"ouvert","e":"L","sk":["biblio"],"t":{"fr":"Enrichir les autorités : dates, identifiants externes, formes variantes","pt":"Enriquecer as autoridades: datas, identificadores externos, formas variantes"},"v":{"fr":"Sur 1 305 autorités : **726 (56 %) sans date de naissance**, environ **1 272 (98 %) sans identifiant VIAF, ISNI ou Wikidata**, environ **1 275 (98 %) sans `variant_forms`**. Le code d'enrichissement existe et fonctionne ; la couverture est de l'ordre de 1 à 2 %.","pt":"De 1 305 autoridades: **726 (56 %) sem data de nascimento**, cerca de **1 272 (98 %) sem identificador VIAF, ISNI ou Wikidata**, cerca de **1 275 (98 %) sem `variant_forms`**."},"w":{"fr":"Passes d'enrichissement par les sources déjà branchées, avec relecture. Les pseudonymes militants sont un cas à part : l'entrée se fait à la forme la plus connue du mouvement, avec renvoi depuis le nom civil, **jamais l'inverse**.","pt":"Passagens de enriquecimento pelas fontes já conectadas, com revisão. Os pseudônimos militantes são um caso à parte: a entrada se faz pela forma mais conhecida do movimento, com remissão a partir do nome civil, **nunca o contrário**."},"y":{"fr":"Les identifiants externes sont ce qui permettra à un autre catalogue de reconnaître nos autorités sans les redécrire. Les formes variantes sont ce qui permet de trouver quelqu'un sous le nom qu'on connaît. Et pour un pseudonyme militant, la forme d'usage **porte souvent la seule trace d'une répression** : elle ne s'écrase pas.","pt":"Os identificadores externos são o que permitirá a outro catálogo reconhecer nossas autoridades sem redescrevê-las. As formas variantes são o que permite encontrar alguém sob o nome que se conhece. E para um pseudônimo militante, a forma de uso **carrega frequentemente o único rastro de uma repressão**: não se sobrescreve."},"f":{"fr":["La couverture en identifiants externes dépasse 20 % sur les autorités les plus citées.","Aucun pseudonyme militant n'a été remplacé par un nom civil."],"pt":["A cobertura em identificadores externos passa de 20 % nas autoridades mais citadas.","Nenhum pseudônimo militante foi substituído por um nome civil."]},"dep":{"fr":"Après **C4** (les pays aident les alignements).","pt":"Depois de **C4** (os países ajudam os alinhamentos)."},"r":["AUDIT_conventions_catalographiques_2026-08-20 A7-A9","REGISTRE §12 CAT-D6"],"verif":{"fr":"31/08 — sur 1 305 autorités : 728 sans année de naissance (56 %), 1 276 sans identifiant VIAF, ISNI ou Wikidata (98 %), 1 280 sans `variant_forms` (98 %). Le constat tient.","pt":"31/08 — de 1 305 autoridades: 728 sem ano de nascimento, 1 276 sem identificador externo, 1 280 sem `variant_forms`. O constato se mantém."}},{"id":"C9","d":"C","p":"P2","s":"ouvert","e":"S","sk":["biblio"],"t":{"fr":"Les huit questions des conventions sont tranchées : reste une clé, un rafraîchissement et cinq gestes à la main","pt":"As oito perguntas das convenções estão decididas: falta uma chave, uma atualização e cinco gestos à mão"},"v":{"fr":"`CONV-6` reste « à confirmer » et `CONV-O1` à `CONV-O8` sont ouverts. Deux d'entre eux portent du travail chiffré : `CONV-O7` (le type d'autorité existe mais reste illisible par le SQL — **16 verdicts de collectivités restent à poser**) et `CONV-O8` (la scission d'autorité n'existe pas — **3 découpages restent**).","pt":"`CONV-6` continua «a confirmar» e `CONV-O1` a `CONV-O8` estão abertos. Dois deles carregam trabalho quantificado: `CONV-O7` (o tipo de autoridade existe mas continua ilegível pelo SQL — **16 vereditos de coletividades faltam**) e `CONV-O8` (a cisão de autoridade não existe — **3 separações faltam**)."},"w":{"fr":"**Tranché le 03/09 (C9 = A, les huit — `CONV-6`, `CONV-O1..O8` actés au REGISTRE v0.16).** Ce qui reste est du code petit et du travail à la main : **O5** renommer l'intitulé de `/atelier-autoridades` en « file de vérification du catalogue » (une clé, dix locales) ; **O6** rafraîchir `avant` à l'affichage de la file ; **O2** poser les deux verdicts de collectivités « à revoir » ; **O8** traiter à la main les trois fiches doubles (créer, repointer, fusion inverse). `O7` : vérifier que le SQL lit `authority_type` là où il affiche.","pt":"**Decidido em 03/09 (C9 = A, as oito).** Resta código pequeno e trabalho à mão: O5 renomear o título da fila; O6 atualizar `avant` na exibição; O2 os dois vereditos de coletividades; O8 as três fichas duplas à mão."},"y":{"fr":"La colonne `name_lang` a été créée nullable et sans contrainte validée : **la créer n'engage rien, l'utiliser oui**. Tant que la question reste ouverte, chaque nouvelle règle d'entrée doit se demander sur quoi elle s'appuie.","pt":"A coluna `name_lang` foi criada anulável e sem restrição validada: **criá-la não compromete nada, usá-la sim**. Enquanto a questão ficar aberta, cada nova regra de entrada precisa se perguntar em que se apoia."},"f":[{"fr":"~~Les huit ont un verdict au REGISTRE~~ — 03/09, v0.16.","pt":"~~As oito têm veredito no REGISTRO~~ — 03/09."},{"fr":"~~O5 : l'intitulé de la file dit ce qu'elle est~~ — livré le 03/09 (`5f43a247`) : « la file de vérification du catalogue : propositions sur les autorités et lots de révision des notices », dix locales.","pt":"~~O5~~ — entregue em 03/09 (`5f43a247`), dez locales."},{"fr":"~~O6 : `avant` est rafraîchi à l'affichage ; la garde stricte reste~~ — **était déjà fait** : `conv_revue_list` rend `actuel` et `perime` (comparaison à l'état courant), le panneau barre l'instantané périmé et désactive « appliquer », et chaque branche de `conv_revue_appliquer` porte sa garde `= q.avant`. Forme `DOC-RECENS-1`, relevé le 03/09.","pt":"~~O6~~ — **já estava feito** (`actuel`/`perime` em `conv_revue_list`, painel e guardas). `DOC-RECENS-1`."},{"fr":"Les 2 collectivités « à revoir » et les 3 découpages sont traités à la main — non automatisables.","pt":"As 2 coletividades e os 3 desdobramentos tratados à mão."}],"dep":{"fr":"Éclaire **C6**.","pt":"Esclarece **C6**."},"r":["REGISTRE §37 CONV-6, CONV-O1..O8"],"verif":{"fr":"31/08 — sur les 16 verdicts de collectivités, **14 sont posés** (lot `autorite_collectivite` de la file : 14 validés, 2 à revoir) ; `authors.authority_type` porte 19 `collective`, 45 `person`, 1 241 fiches non typées. La scission d'autorité n'existe toujours pas : aucune table ni fonction en base. Rien de mesuré sur les huit questions `CONV-O*` elles-mêmes. **03/09** — un verdict proposé par question dans la page des cinq décisions (O1 oui ; O2 convention provisoire ; O3 = C5 ; O4 pas de bascule sans déclencheur ; O5 le périmètre est la file ; O6 garde stricte + rafraîchissement ; O7 `authority_type` est la vérité ; O8 pas de scission avant la quatrième) ; file : collectivités 14 appliqués, 2 à revoir ; 1 241 autorités non typées. **Recommandé A**. Verdict attendu. **03/09 — tranché : A, les huit.** Passe de « décision » à « ouvert », effort S. **03/09, après-midi** — O5 livré, O6 constaté déjà fait ; il ne reste que f[3], le travail de main (2 collectivités à revoir, 3 découpages), à l'Atelier autorités. **03/09, nuit — f[3] a changé de taille** : l'audit des autorités compte **12 fiches doubles**, pas 3 (trois anciennes non vues, six nées du lot C5) ; le verdict O8 « pas de scission avant la quatrième » est dépassé par les faits et `fn_authority_split` existe depuis la migration 17 — **décision à reprendre** (REGISTRE §37, MàJ 03/09 nuit). Les 2 collectivités à revoir restent ; le lot en reçoit ~36 de plus (motif refait).","pt":"31/08 — dos 16 vereditos de coletividades, **14 estão postos** (2 a rever); `authority_type`: 19 `collective`, 45 `person`, 1 241 sem tipo. A cisão de autoridade continua inexistente no banco. Nada medido sobre as oito questões em si. **03/09** — um veredito proposto por pergunta na página das cinco decisões. **Recomendado A**. Veredito pendente. **03/09 — decidido: A, as oito.** Passa a «aberto». **03/09, tarde** — O5 entregue, O6 já feito ; fica só f[3], trabalho manual. **03/09, noite — f[3] mudou de tamanho**: a auditoria das autoridades conta **12 fichas duplas**, não 3 (três antigas não vistas, seis nascidas do lote C5); o veredito O8 « sem cisão antes da quarta » foi ultrapassado pelos fatos e `fn_authority_split` existe desde a migração 17 — **decisão a retomar** (REGISTRO §37, atualização de 03/09 noite). As 2 coletividades a rever continuam; o lote recebe ~36 a mais (padrão refeito)."}},{"id":"C10","d":"C","p":"P2","s":"ouvert","e":"S","sk":["sql"],"t":{"fr":"Renommer l'une des deux colonnes `rights_status`","pt":"Renomear uma das duas colunas `rights_status`"},"v":{"fr":"`digital_assets.rights_status` est un **état de workflow** (`to_review`, `public_domain_confirmed`) qui commande la visibilité. Le vocabulaire des droits d'auteur porte le même nom depuis la migration `20260820235000_vocabulaire_rights_status`. Deux sens, un nom.","pt":"`digital_assets.rights_status` é um **estado de workflow** (`to_review`, `public_domain_confirmed`) que comanda a visibilidade. O vocabulário de direitos autorais leva o mesmo nome desde a migração `20260820235000_vocabulaire_rights_status`. Dois sentidos, um nome."},"w":{"fr":"Renommer la colonne de workflow — `review_state` par exemple — et propager au front et aux RPC. Le vocabulaire des droits garde le nom, puisque c'est lui qui parle de droits.","pt":"Renomear a coluna de workflow — `review_state` por exemplo — e propagar ao front e às RPC. O vocabulário de direitos guarda o nome, já que é ele que fala de direitos."},"y":{"fr":"Confusion garantie sinon, et sur un sujet où la confusion se paie : c'est l'état des droits qui décide si un document est visible du public. Un piège documenté s'y ajoute — `access_scope` vaut `conta_ativa` **par défaut**, si bien qu'un document du domaine public reste réservé aux comptes actifs tant que personne n'a posé `publico` explicitement.","pt":"Confusão garantida do contrário, e num assunto em que a confusão se paga: é o estado dos direitos que decide se um documento é visível ao público. Uma armadilha documentada se acrescenta — `access_scope` vale `conta_ativa` **por omissão**, de modo que um documento de domínio público continua reservado às contas ativas enquanto ninguém tiver posto `publico` explicitamente."},"f":{"fr":["Les deux notions portent deux noms distincts, en base et à l'écran.","Le piège `access_scope` est rappelé dans le formulaire de catalogage, pas seulement dans une note."],"pt":["As duas noções levam dois nomes distintos, no banco e na tela.","A armadilha `access_scope` é lembrada no formulário de catalogação, não só numa nota."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["PLAN_DE_MARCHE §8","DECISION_profil_numerisation_2026-08-20"],"verif":[{"fr":"31/08 — le nom vit désormais dans **trois** tables, pas deux : `digital_assets`, `book_digital_resources` et `book_draft_digital_resources` portent chacune une colonne `rights_status`, en plus du vocabulaire homonyme. Le télescopage s'étend au lieu de se résorber.","pt":"31/08 — o nome vive agora em **três** tabelas: `digital_assets`, `book_digital_resources` e `book_draft_digital_resources`, além do vocabulário homônimo."},{"fr":"16/09 — ce ne sont plus deux colonnes mais **trois** : `digital_assets.rights_status`, `book_digital_resources.rights_status`, `book_draft_digital_resources.rights_status`. Le renommage porte sur la colonne de workflow, à identifier parmi les trois.","pt":"16/09 — já não são duas colunas mas **três**: `digital_assets.rights_status`, `book_digital_resources.rights_status`, `book_draft_digital_resources.rights_status`."}]},{"id":"C11","d":"C","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Arbitrer ce que l'OPAC par œuvre a mis en file : tomes, œuvres scindées, titres pré-traduits, notes MLEG","pt":"Arbitrar o que o OPAC por obra pôs em fila: tomos, obras cindidas, títulos pré-traduzidos, notas MLEG"},"v":{"fr":"L'OPAC se lit par œuvre depuis le 04/09 (`OPAC-OEU1..6`). Le code est livré ; ce qui reste est **de la bibliothéconomie, dans l'application**. Compté en production le 05/09 : **9 groupes de tomes** (30 notices) dans l'onglet « Volumes », **90 paires** proposées dans « Œuvres scindées », **3 doublons de notices** dans « À décider » (1458/2333, 1451/1446, 1359/1353), **1 452 titres automatiques** « corrige-moi » sur 162 œuvres (pré-traduction terminée, zéro erreur), **176 notes MLEG** « Assuntos importados » sans matière au thésaurus (huit catégories, dont Anarquismo no Brasil 50 et Anarquismo Internacional 42), et **161 œuvres à plusieurs éditions** dont une seule (Thoreau 97) a son titre uniforme vérifié dans la langue de l'œuvre.","pt":"O OPAC lê-se por obra desde 04/09 (`OPAC-OEU1..6`). O código está entregue; o que resta é **biblioteconomia, no aplicativo**. Contado em produção em 05/09: **9 grupos de tomos** (30 registros) na aba «Volumes», **90 pares** propostos em «Obras cindidas», **3 duplicatas de registros** em «A decidir», **1 452 títulos automáticos** «corrija-me» em 162 obras (pré-tradução terminada, zero erro), **176 notas MLEG** «Assuntos importados» sem assunto no tesauro (oito categorias), e **161 obras com várias edições** das quais uma só tem o título uniforme verificado na língua da obra."},"w":{"fr":"Dans l'assistant de dédoublonnage : trancher les groupes de tomes ligne à ligne (numéro posé à la main), les paires d'œuvres scindées (« Fusionner » ou « Garder séparées »), les trois doublons. Dans la fiche : relire les « Titres par langue » d'une œuvre quand on l'ouvre, poser le « Titre uniforme » dans la langue de l'œuvre. Pour les 176 notes MLEG, une décision **par catégorie** : laisser en note, ou choisir une matière proche **existante** — jamais créer d'entrée (`THES-4`), jamais convertir vers plus générique.","pt":"No assistente de deduplicação: decidir os grupos de tomos linha a linha (número posto à mão), os pares de obras cindidas («Fundir» ou «Manter separadas»), as três duplicatas. Na ficha: reler os «Títulos por idioma» de uma obra ao abri-la, pôr o «Título uniforme» na língua da obra. Para as 176 notas MLEG, uma decisão **por categoria**: deixar em nota, ou escolher um assunto próximo **existente** — nunca criar entrada (`THES-4`), nunca converter para mais genérico."},"y":{"fr":"Un OPAC par œuvre vaut ce que valent ses œuvres : chaque bibliothèque entrante ajoute ses éditions, et huit « Desobediência civil » sur six œuvres, c'est ce que voyait la lectrice le 04/09 au matin. La machine propose et mémorise, elle ne décide jamais (`OPAC-OEU3`, `OPAC-OEU5`, `DEDUP-7`) : deux tomes ne sont pas un doublon, deux éditions ne sont pas deux œuvres, et seul un regard le sait.","pt":"Um OPAC por obra vale o que valem suas obras: cada biblioteca que entra acrescenta suas edições. A máquina propõe e memoriza, nunca decide (`OPAC-OEU3`, `OPAC-OEU5`, `DEDUP-7`): dois tomos não são uma duplicata, duas edições não são duas obras, e só um olhar o sabe."},"f":{"fr":["Les onglets « Volumes » et « Œuvres scindées » sont vides, ou ce qui y reste est mémorisé comme « pas des tomes » / « garder séparées ».","Plus aucun titre « corrige-moi » sur une œuvre ouverte au moins une fois au catalogage.","Les 176 notes MLEG ont chacune une décision écrite (matière existante posée, ou note conservée par choix), et `subjects` n'a pas gagné une entrée.","Les œuvres à plusieurs éditions ont un titre uniforme dans leur langue d'origine."],"pt":["As abas «Volumes» e «Obras cindidas» estão vazias, ou o que fica está memorizado como «não são tomos» / «manter separadas».","Nenhum título «corrija-me» numa obra aberta ao menos uma vez na catalogação.","As 176 notas MLEG têm cada uma uma decisão escrita, e `subjects` não ganhou nenhuma entrada.","As obras com várias edições têm título uniforme na sua língua de origem."]},"dep":{"fr":"Aucune migration : tout se fait dans l'application, par la coordination catalogage. Les compteurs se relisent en base (`suggest_volume_groups`, `suggest_split_works`, `work_titles.needs_review`, `books.notas ~ 'Assuntos importados'`).","pt":"Nenhuma migração: tudo se faz no aplicativo, pela coordenação de catalogação."},"r":["DECISION_opac_par_oeuvre_2026-09-04","REGISTRE §18 OPAC-OEU1..6","REGISTRE §30 THES-4","REGISTRE §40 DEDUP-10"],"verif":{"fr":"05/09 — compté en production (session coordination) : 9 groupes / 30 notices ; 90 paires ; 3 doublons ; 1 452 titres auto à relire sur 162 œuvres ; 176 notes MLEG ; 161 œuvres multi-éditions, 0 sans titre uniforme (colonne obligatoire), 1 vérifiée.","pt":"05/09 — contado em produção: 9 grupos / 30 registros; 90 pares; 3 duplicatas; 1 452 títulos automáticos em 162 obras; 176 notas MLEG; 161 obras multi-edições, 1 verificada."}},{"id":"D3","d":"D","p":"P2","s":"bloque","e":"M","sk":["biblio"],"t":{"fr":"Rattacher les 91 fascicules et les 87 monographies suspectes de SOLIDAIRES","pt":"Vincular os 91 fascículos e as 87 monografias suspeitas de SOLIDAIRES"},"v":{"fr":"Le fichier SOLIDAIRES porte déjà des colonnes `revue` et `numero` : **12 titres à créer, 91 fascicules à lier**. En plus, **87 monographies portent « n° » dans leur titre** et sont marquées par un drapeau `numero_dans_titre` : ce sont des candidates au rattachement.","pt":"O arquivo SOLIDAIRES já traz colunas `revue` e `numero`: **12 títulos a criar, 91 fascículos a vincular**. Além disso, **87 monografias trazem «n°» no título** e estão marcadas por uma flag `numero_dans_titre`: são candidatas ao vínculo."},"w":{"fr":"Créer les 12 titres, lier les 91 fascicules, puis **soumettre** les 87 candidates à quelqu'un qui connaît le fonds. Ne pas les rattacher automatiquement.","pt":"Criar os 12 títulos, vincular os 91 fascículos, depois **submeter** as 87 candidatas a alguém que conheça o acervo. Não vinculá-las automaticamente."},"y":{"fr":"Un titre qui contient « n° » n'est pas toujours un fascicule — c'est parfois un titre de collection, parfois une coquille. Le drapeau signale, il ne décide pas. Et le réseau ne compte aujourd'hui que 4 titres de périodiques : ce lot les multiplierait par quatre, et éprouverait le sous-système pour de bon.","pt":"Um título que contém «n°» nem sempre é um fascículo — às vezes é um título de coleção, às vezes um erro de digitação. A flag sinaliza, não decide. E a rede conta hoje apenas 4 títulos de periódicos: este lote os multiplicaria por quatro, e testaria o subsistema de verdade."},"f":{"fr":["Les 12 titres existent et les 91 fascicules y sont rattachés.","Les 87 candidates ont été soumises, et chaque verdict est humain.","Le comportement observé sur les quatre notices *Encontros com a Civilização brasileira* confirme la règle anti-faux-doublons : deux paires en sortent, deux y restent."],"pt":["Os 12 títulos existem e os 91 fascículos estão vinculados.","As 87 candidatas foram submetidas, e cada veredicto é humano.","O comportamento observado nos quatro registros *Encontros com a Civilização brasileira* confirma a regra antifalsos-duplicados: dois pares saem, dois ficam."]},"dep":{"fr":"**Bloqué par C2**, donc par **G7** et **A1**. La révision de la spec (**D1**) peut se faire sans attendre.","pt":"**Bloqueado por C2**, portanto por **G7** e **A1**. A revisão da spec (**D1**) pode ser feita sem esperar."},"r":["spec-periodiques-v0.1 §10","REPRISE_claude_code_2026-08-27"],"verif":{"fr":"31/08 — les 1 673 brouillons SOLIDAIRES sont en base (voir C2) et **aucun ne porte de `serial_id`** : le rattachement des fascicules n'a pas commencé. Toujours derrière G7. **15/09** — la bibliothèque de destination existe (Solidaires, 14/09) et le lot lui est attribué ; le rattachement des 91 fascicules et des 87 monographies suspectes reste à faire dans le lot, avant la promotion, et reste bloqué par C2/G7.","pt":"31/08 — os 1 673 rascunhos SOLIDAIRES estão no banco (ver C2) e **nenhum traz `serial_id`**: o vínculo dos fascículos não começou. **15/09** — a biblioteca de destino existe e o lote está-lhe atribuído ; o resto continua bloqueado por C2/G7."}},{"id":"D4","d":"D","p":"P1","s":"ouvert","e":"XL","sk":["biblio","front","collectif"],"t":{"fr":"Le matériel éphémère : tracts, affiches, autocollants, zines","pt":"O material efêmero: panfletos, cartazes, adesivos, fanzines"},"v":{"fr":"Rien n'existe. Le modèle de notice hérité de la bibliothéconomie du livre ne sait pas décrire ce matériel, et AnarBib ne fait pas exception. C'est le besoin **le plus mal couvert**, pour une part énorme de nos fonds.","pt":"Nada existe. O modelo de registro herdado da biblioteconomia do livro não sabe descrever esse material, e o AnarBib não é exceção. É a necessidade **pior atendida**, para uma parte enorme dos nossos acervos."},"w":{"fr":"Ce matériel n'a ni ISBN, ni éditeur, souvent ni auteur ni titre. Il est visuel autant que textuel : une affiche ne se résume pas à son océrisation. Le chantier commence par de la réflexion documentaire — que décrit-on, avec quoi, et pour qui — avant toute table.","pt":"Este material não tem ISBN, nem editora, frequentemente nem autor nem título. É visual tanto quanto textual: um cartaz não se resume à sua ocerização. O canteiro começa por reflexão documental — o que se descreve, com quê, e para quem — antes de qualquer tabela."},"y":{"fr":"C'est ce que les bibliothèques militantes ont de plus spécifique et de moins outillé. Les vocabulaires d'éphémères construits ailleurs — NORLA, avec ses facettes *Tactics* et *Social Movement* — sont **monolingues** et sans lien avec le thésaurus FICEDL : il y a là un travail commun à faire, pas un module à écrire seul.","pt":"É o que as bibliotecas militantes têm de mais específico e menos aparelhado. Os vocabulários de efêmeros construídos alhures — NORLA, com suas facetas *Tactics* e *Social Movement* — são **monolíngues** e sem vínculo com o tesauro FICEDL: há aí um trabalho comum a fazer, não um módulo a escrever sozinho."},"f":{"fr":["Un cadrage documentaire écrit, discuté avec au moins un autre fonds.","Un modèle minimal éprouvé sur cinquante pièces réelles.","**Ce n'est pas un chantier pour quelqu'un qui veut seulement écrire des fonctions.**"],"pt":["Um enquadramento documental escrito, discutido com pelo menos um outro acervo.","Um modelo mínimo testado em cinquenta peças reais.","**Não é um canteiro para quem só quer escrever funções.**"]},"dep":{"fr":"À relier à **H6** (alignement des vocabulaires militants) et à la rencontre de Bologne.","pt":"A ligar a **H6** (alinhamento dos vocabulários militantes) e ao encontro de Bolonha."},"r":["docs/CHANTIERS_OUVERTS.md §3","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"D5","d":"D","p":"P2","s":"ouvert","e":"M","sk":["biblio"],"t":{"fr":"Éprouver la chaîne de numérisation sur dix ouvrages avant d'équiper qui que ce soit","pt":"Testar a cadeia de digitalização em dez obras antes de equipar quem quer que seja"},"v":{"fr":"La règle est actée et tient en une phrase : « on capture en niveaux de gris, on livre en bitonal, on ne garde en ligne que ce qui est livré ». Les plafonds de buckets sont posés en production. **L'outil de dérivation n'est pas choisi**, et la fiche pratique d'une page n'est pas écrite.","pt":"A regra está registrada e cabe numa frase: «captura-se em tons de cinza, entrega-se em bitonal, só se mantém on-line o que é entregue». Os tetos dos buckets estão em produção. **A ferramenta de derivação não foi escolhida**, e a ficha prática de uma página não está escrita."},"w":{"fr":"Comparer ScanTailor + `img2pdf` avec `unpaper` ou ImageMagick sur dix ouvrages réels et variés, mesurer le poids et la lisibilité, choisir. Puis écrire la fiche : trois réglages, cinq contrôles, rien d'autre.","pt":"Comparar ScanTailor + `img2pdf` com `unpaper` ou ImageMagick em dez obras reais e variadas, medir o peso e a legibilidade, escolher. Depois escrever a ficha: três ajustes, cinco controles, nada mais."},"y":{"fr":"Équiper une bibliothèque avec une chaîne non éprouvée, c'est lui faire scanner deux cents pages qu'il faudra refaire. Et le seuillage bitonal est **destructeur et irréversible** : on ne scanne jamais directement en bitonal, jamais.","pt":"Equipar uma biblioteca com uma cadeia não testada é fazê-la escanear duzentas páginas que será preciso refazer. E a limiarização bitonal é **destrutiva e irreversível**: nunca se escaneia diretamente em bitonal, nunca."},"f":{"fr":["Un outil est choisi, avec les mesures qui ont décidé.","La fiche pratique d'une page existe, en portugais et en français.","Le sort des images de capture est écrit : archivage hors ligne systématique ou effacement après validation — **la réponse appartient à chaque bibliothèque, mais elle doit être écrite quelque part**."],"pt":["Uma ferramenta é escolhida, com as medidas que decidiram.","A ficha prática de uma página existe, em português e francês.","O destino das imagens de captura está escrito: arquivamento off-line sistemático ou apagamento após validação — **a resposta pertence a cada biblioteca, mas precisa estar escrita em algum lugar**."]},"dep":{"fr":"Le dimensionnement annoncé (20 Go pour démarrer, jusqu'à 50 Go sur 3-5 ans) dépend du choix d'outil.","pt":"O dimensionamento anunciado (20 GB para começar, até 50 GB em 3-5 anos) depende da escolha da ferramenta."},"r":["DECISION_profil_numerisation_2026-08-20 §9"]},{"id":"D6","d":"D","p":"P3","s":"ouvert","e":"M","sk":["front","deno"],"t":{"fr":"Reprendre ou remplacer le lecteur EPUB","pt":"Retomar ou substituir o leitor EPUB"},"v":{"fr":"`epubjs ^0.3.93` est la seule dépendance clairement pré-1.0 sur un chemin critique — le lecteur EPUB, `src/lib/reader/epubEngine.js` et `src/components/viewers/EpubReader.jsx`. La bibliothèque n'a pas connu de publication majeure depuis des années.","pt":"`epubjs ^0.3.93` é a única dependência claramente pré-1.0 num caminho crítico — o leitor EPUB, `src/lib/reader/epubEngine.js` e `src/components/viewers/EpubReader.jsx`. A biblioteca não teve publicação maior há anos."},"w":{"fr":"Évaluer ce qui casse aujourd'hui, ce qui cassera avec les navigateurs à venir, et s'il existe une alternative libre maintenue. Décider entre épingler et assumer, ou remplacer.","pt":"Avaliar o que quebra hoje, o que quebrará com os navegadores futuros, e se existe uma alternativa livre mantida. Decidir entre fixar e assumir, ou substituir."},"y":{"fr":"Le lecteur est ce qui rend un fonds numérisé consultable sans téléchargement. S'il tombe, ce n'est pas un confort qui disparaît, c'est l'accès. Rien ne presse aujourd'hui — mais il vaut mieux savoir.","pt":"O leitor é o que torna um acervo digitalizado consultável sem download. Se cair, não é um conforto que desaparece, é o acesso. Nada urge hoje — mas é melhor saber."},"f":{"fr":["Un verdict écrit : conserver et épingler, ou remplacer par quoi.","Si conservation : un test qui vérifie l'ouverture d'un EPUB réel."],"pt":["Um veredicto escrito: conservar e fixar, ou substituir por quê.","Se conservação: um teste que verifica a abertura de um EPUB real."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["package.json","Relevé du 29/08/2026"],"verif":{"fr":"31/08 — `package.json` : `epubjs ^0.3.93`, inchangé.","pt":"31/08 — `package.json`: `epubjs ^0.3.93`, sem mudança."}},{"id":"E1","d":"E","p":"P1","s":"ouvert","e":"M","sk":["aucune","front"],"t":{"fr":"Faire auditer l'accessibilité par quelqu'un qui n'a pas écrit le code","pt":"Fazer auditar a acessibilidade por alguém que não escreveu o código"},"v":{"fr":"Des fonctionnalités d'accessibilité sont implémentées : panneau de réglages sur toutes les pages depuis le 26/08, `html lang` qui suit la langue affichée (WCAG 3.1.1) avec son test, champs à 16 px minimum, cibles tactiles à 44 px, `viewport-fit=cover`. **Aucun audit d'accessibilité indépendant n'a jamais été mené.**","pt":"Funcionalidades de acessibilidade estão implementadas: painel de ajustes em todas as páginas desde 26/08, `html lang` que segue a língua exibida (WCAG 3.1.1) com seu teste, campos de 16 px no mínimo, alvos táteis de 44 px, `viewport-fit=cover`. **Nenhuma auditoria de acessibilidade independente foi jamais conduzida.**"},"w":{"fr":"Faire parcourir les parcours principaux — chercher, ouvrir une notice, réserver, s'inscrire — par une personne qui utilise un lecteur d'écran ou une navigation au clavier seul, et écrire ce qui bloque.","pt":"Fazer percorrer os percursos principais — buscar, abrir um registro, reservar, cadastrar-se — por uma pessoa que use um leitor de tela ou navegação só por teclado, e escrever o que trava."},"y":{"fr":"« Implémenté » et « audité » ne sont pas le même mot, et les confondre est la faute la plus facile à commettre dans une présentation publique. Dire les deux, toujours : des fonctionnalités existent, personne d'extérieur ne les a éprouvées.","pt":"«Implementado» e «auditado» não são a mesma palavra, e confundi-los é a falta mais fácil de cometer numa apresentação pública. Dizer os dois, sempre: funcionalidades existem, ninguém de fora as testou."},"f":{"fr":["Un parcours complet a été fait au lecteur d'écran, avec un compte rendu écrit.","Les blocages sont dans le backlog avec leur écran.","Le discours public dit désormais « implémenté et audité par X », ou continue de dire les deux séparément."],"pt":["Um percurso completo foi feito com leitor de tela, com relatório escrito.","Os travamentos estão no backlog com sua tela.","O discurso público passa a dizer «implementado e auditado por X», ou continua dizendo os dois separadamente."]},"dep":{"fr":"**Entrée sans compétence technique** pour la partie parcours.","pt":"**Entrada sem competência técnica** para a parte de percurso."},"r":["Mémoire de projet, 25/08/2026","Commits 69af3cf5, df472bed"],"verif":{"fr":"**03/09** — la formation (soirée 1 le 08/09/2026) comporte un **témoin léger** (étape 8 de `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md` : chercher, ouvrir, réserver au clavier seul, souris retournée). Ce n'est pas l'audit demandé par cette fiche : pas de lecteur d'écran, pas de personne concernée ; E1 reste ouvert et le discours reste « implémenté, pas audité ». La liste de blocages clavier qui en sortira entre ici. **03/09, fin de journée** — le témoin clavier léger se cale dans n'importe quelle soirée de la formation (sept soirées, plan du 01/09), pas « le 13/09 ». **06/09** — la navigation a changé le 05/09 : la page **« Je veux… »** (`/inicio`, 51 intentions par rôle, raccourcis en `localStorage`) et les **liens profonds vers les recueils PDF** (`#page=N` par langue). L'audit demandé devra parcourir ces deux chemins ; le témoin clavier de la formation peut commencer par « Je veux… ».","pt":"**03/09** — a formação (noite 1 em 08/09/2026) tem uma **testemunha leve** (etapa 8: teclado só). Não é a auditoria pedida; E1 fica aberto, o discurso fica «implementado, não auditado». **03/09, fim do dia** — a testemunha leve cabe em qualquer noite da formação. **06/09** — a navegação mudou em 05/09 : página «Quero…» (`/inicio`, 51 intenções) e ligações profundas para os PDF. A auditoria terá de percorrer esses caminhos."}},{"id":"E2","d":"E","p":"P1","s":"ouvert","e":"M","sk":["langue"],"t":{"fr":"Trancher les conventions néerlandaise et grecque","pt":"Decidir as convenções neerlandesa e grega"},"v":{"fr":"Les dix locales sont à parité stricte de clés — 6 177 chacune, vérifiée en intégration continue depuis le 27/08. Mais les **conventions** de deux d'entre elles ne sont pas tranchées : le néerlandais est à l'état de brouillon, le grec reste à définir. Le test de parité ne voit pas ça : il compte les clés, pas leur justesse.","pt":"As dez locales estão em paridade estrita de chaves — 6 177 cada uma, verificada na integração contínua desde 27/08. Mas as **convenções** de duas delas não estão decididas: o neerlandês está em estado de rascunho, o grego resta a definir. O teste de paridade não vê isso: conta as chaves, não a justeza delas."},"w":{"fr":"Une locutrice ou un locuteur natif reprend la charte de langage inclusif, décide de la forme neutre pour sa langue, et relit les 6 177 chaînes en priorité sur les écrans les plus vus.","pt":"Uma falante ou um falante nativo retoma a carta de linguagem inclusiva, decide a forma neutra para sua língua, e revisa as 6 177 cadeias com prioridade nas telas mais vistas."},"y":{"fr":"Deux langues qui cessent d'être des traductions approximatives. C'est un des trois chantiers qui **ne demandent aucune compétence technique** — et le seul que personne d'autre ne peut faire à la place.","pt":"Duas línguas que deixam de ser traduções aproximativas. É um dos três canteiros que **não exigem nenhuma competência técnica** — e o único que ninguém mais pode fazer no lugar."},"f":{"fr":["Les conventions `nl` et `el` sont écrites dans `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","Les chaînes des écrans principaux sont relues.","La liste néerlandaise est déjà partie chez Ludwig — le suivi en fait partie."],"pt":["As convenções `nl` e `el` estão escritas em `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","As cadeias das telas principais estão revisadas.","A lista neerlandesa já foi enviada a Ludwig — o acompanhamento faz parte."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["docs/CHANTIERS_OUVERTS.md §5","docs/notes-audit/anarbib-charte-langage-inclusif-v2.md"],"verif":{"fr":"31/08 — les dix fichiers `anarbib-charte-langage-inclusif-v2-*.md` existent depuis le 05/06, `nl` et `el` compris ; mais dedans, la convention `nl` est marquée « provisoire » et la `el` « à définir avec une personne locutrice grecque militante ». Les documents existent, les décisions non : le constat tient sur le fond.","pt":"31/08 — os dez arquivos da carta v2 existem desde 05/06, `nl` e `el` incluídos; mas dentro deles a convenção `nl` está marcada « provisória » e a `el` « a definir com uma pessoa falante de grego militante ». Os documentos existem, as decisões não."}},{"id":"E3","d":"E","p":"P2","s":"decision","e":"M","sk":["langue","collectif"],"t":{"fr":"Uniformiser le registre d'adresse entre les dix locales","pt":"Uniformizar o registro de tratamento entre as dez locales"},"v":{"fr":"`DOC-ADDR-1` fixe le tutoiement comme registre de l'interface. En pratique, **`nl` et `el` tutoient, les huit autres vouvoient**. L'écart est documenté et assumé comme « un chantier à décider, pas à subir au détour d'un correctif ».","pt":"`DOC-ADDR-1` fixa o tratamento informal como registro da interface. Na prática, **`nl` e `el` tratam por «tu», as outras oito por «você» formal**. A divergência está documentada e assumida como «um canteiro a decidir, não a sofrer de passagem numa correção»."},"w":{"fr":"Décider une fois pour les dix, en tenant compte du fait que la valeur politique du tutoiement n'est pas la même dans chaque langue, puis passer les locales concernées en une seule opération.","pt":"Decidir uma vez para as dez, levando em conta que o valor político do tratamento informal não é o mesmo em cada língua, depois passar as locales envolvidas numa única operação."},"y":{"fr":"AnarBib propose à d'autres catalogues des conventions d'interopérabilité, dont l'une dit explicitement que le vocabulaire commun n'impose pas l'écriture inclusive de chacun. **La cohérence interne se règle avant de prêcher la convention.**","pt":"O AnarBib propõe a outros catálogos convenções de interoperabilidade, uma das quais diz explicitamente que o vocabulário comum não impõe a escrita inclusiva de cada um. **A coerência interna se resolve antes de pregar a convenção.**"},"f":{"fr":["Une décision au REGISTRE, avec la raison.","Les dix locales appliquent le même registre, ou l'écart est justifié langue par langue."],"pt":["Uma decisão no REGISTRO, com o motivo.","As dez locales aplicam o mesmo registro, ou a divergência é justificada língua por língua."]},"dep":{"fr":"À faire après **E2** (les conventions décident du registre).","pt":"A fazer depois de **E2** (as convenções decidem o registro)."},"r":["REGISTRE §0 DOC-ADDR-1","VERIF_confidentialite_tiers_2026-08-20"]},{"id":"E4","d":"E","p":"P2","s":"ouvert","e":"S","sk":["langue"],"t":{"fr":"Régler les paires irrégulières de l'italien","pt":"Resolver os pares irregulares do italiano"},"v":{"fr":"`it.json` n'est pas conforme à la convention de l'astérisque final : les paires irrégulières comme `lettore` / `lettrice` ne se réduisent pas à `lettor*`. Le test de charte vérifie une seule chose sur l'italien — que `camerata` et `camerati` n'y figurent jamais, terme fasciste, échec dur — et rien d'autre.","pt":"`it.json` não está conforme à convenção do asterisco final: os pares irregulares como `lettore` / `lettrice` não se reduzem a `lettor*`. O teste de carta verifica uma só coisa no italiano — que `camerata` e `camerati` nunca apareçam, termo fascista, falha dura — e nada mais."},"w":{"fr":"Décider du traitement des paires irrégulières avec un locuteur natif, puis l'appliquer aux chaînes concernées. C'est un travail de langue, pas de code.","pt":"Decidir o tratamento dos pares irregulares com um falante nativo, depois aplicá-lo às cadeias envolvidas. É um trabalho de língua, não de código."},"y":{"fr":"L'italien est la langue de la présentation de Bologne. Une interface qui applique sa convention à moitié se voit à l'écran partagé.","pt":"O italiano é a língua da apresentação de Bolonha. Uma interface que aplica sua convenção pela metade se vê na tela compartilhada."},"f":{"fr":["Le traitement des paires irrégulières est écrit dans la charte italienne.","Les chaînes concernées sont corrigées.","Les trois chaînes restées en français dans l'interface italienne sont traduites (716 chaînes vues, 3 fautives)."],"pt":["O tratamento dos pares irregulares está escrito na carta italiana.","As cadeias envolvidas estão corrigidas.","As três cadeias que ficaram em francês na interface italiana estão traduzidas (716 cadeias vistas, 3 defeituosas)."]},"dep":{"fr":"Avant le 08/09 si possible, sinon octobre.","pt":"Antes de 08/09 se possível, senão outubro."},"r":["CLAUDE.md, piège connu n°9","CALENDRIER_bologne_2026-08-27"],"verif":[{"fr":"20/09 — mesuré dans `it.json` : 318 clés portent une forme en -tore/-trice, et **quatre conventions coexistent** — barre oblique abrégée (`lettore/trice` ×55, `autore/trice` ×29), astérisque (`amministratori*` ×19, `coordinatori*` ×6), masculin nu (`autore` ×20, `lettore` ×15, `editore` ×15) et paire développée (`autore/autrice` ×3). La fiche parlait de paires qui « ne se réduisent pas à `lettor*` » ; l'état réel est une absence de convention unique. Les « trois chaînes restées en français » n'ont pas été retrouvées : une heuristique (valeur it identique à la valeur fr) rend zéro, ce qui ne prouve rien. La décision reste à prendre avec un·e locuteur·rice, comme la fiche le dit.","pt":"20/09 — medido em `it.json`: 318 chaves têm uma forma em -tore/-trice, e **quatro convenções coexistem** — barra abreviada (`lettore/trice` ×55), asterisco (`amministratori*` ×19), masculino nu (`autore` ×20, `lettore` ×15) e par desenvolvido (`autore/autrice` ×3). As « três cadeias que ficaram em francês » não foram reencontradas. A decisão continua a tomar-se com uma pessoa falante, como a ficha diz."}]},{"id":"E6","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Découper les cinq écrans qui pèsent plus de cent kilooctets","pt":"Dividir as cinco telas que pesam mais de cem quilobytes"},"v":{"fr":"`BookDraftForm.jsx` fait **197 Ko**, `BibliotecaPage.jsx` 184 Ko, `AccountPage.jsx` 154 Ko, `PanelPage.jsx` 114 Ko, `ImportacoesPage.jsx` 109 Ko. 29 des 38 routes sont déjà en chargement paresseux, et `vite.config.js` déclare quatre lots de dépendances — le problème n'est pas le chargement initial, c'est la taille d'un fichier unique.","pt":"`BookDraftForm.jsx` tem **197 KB**, `BibliotecaPage.jsx` 184 KB, `AccountPage.jsx` 154 KB, `PanelPage.jsx` 114 KB, `ImportacoesPage.jsx` 109 KB. 29 das 38 rotas já estão em carregamento preguiçoso, e `vite.config.js` declara quatro lotes de dependências — o problema não é o carregamento inicial, é o tamanho de um arquivo único."},"w":{"fr":"Extraire les sous-formulaires et les onglets en composants séparés, sans changer le comportement. Commencer par `BookDraftForm`, le plus gros et le plus édité.","pt":"Extrair os subformulários e as abas em componentes separados, sem mudar o comportamento. Começar por `BookDraftForm`, o maior e o mais editado."},"y":{"fr":"Un fichier de 197 Ko n'est pas relisible par quelqu'un qui arrive,
