trava."},"y":{"fr":"« Implémenté » et « audité » ne sont pas le même mot, et les confondre est la faute la plus facile à commettre dans une présentation publique. Dire les deux, toujours : des fonctionnalités existent, personne d'extérieur ne les a éprouvées.","pt":"«Implementado» e «auditado» não são a mesma palavra, e confundi-los é a falta mais fácil de cometer numa apresentação pública. Dizer os dois, sempre: funcionalidades existem, ninguém de fora as testou."},"f":{"fr":["Un parcours complet a été fait au lecteur d'écran, avec un compte rendu écrit.","Les blocages sont dans le backlog avec leur écran.","Le discours public dit désormais « implémenté et audité par X », ou continue de dire les deux séparément."],"pt":["Um percurso completo foi feito com leitor de tela, com relatório escrito.","Os travamentos estão no backlog com sua tela.","O discurso público passa a dizer «implementado e auditado por X», ou continua dizendo os dois separadamente."]},"dep":{"fr":"**Entrée sans compétence technique** pour la partie parcours.","pt":"**Entrada sem competência técnica** para a parte de percurso."},"r":["Mémoire de projet, 25/08/2026","Commits 69af3cf5, df472bed"],"verif":{"fr":"**03/09** — la formation (soirée 1 le 08/09/2026) comporte un **témoin léger** (étape 8 de `docs/journal/chantiers/PARCOURS_formation_BLMF_seance1_2026-09-08.md` : chercher, ouvrir, réserver au clavier seul, souris retournée). Ce n'est pas l'audit demandé par cette fiche : pas de lecteur d'écran, pas de personne concernée ; E1 reste ouvert et le discours reste « implémenté, pas audité ». La liste de blocages clavier qui en sortira entre ici. **03/09, fin de journée** — le témoin clavier léger se cale dans n'importe quelle soirée de la formation (sept soirées, plan du 01/09), pas « le 13/09 ». **06/09** — la navigation a changé le 05/09 : la page **« Je veux… »** (`/inicio`, 51 intentions par rôle, raccourcis en `localStorage`) et les **liens profonds vers les recueils PDF** (`#page=N` par langue). L'audit demandé devra parcourir ces deux chemins ; le témoin clavier de la formation peut commencer par « Je veux… ».","pt":"**03/09** — a formação (noite 1 em 08/09/2026) tem uma **testemunha leve** (etapa 8: teclado só). Não é a auditoria pedida; E1 fica aberto, o discurso fica «implementado, não auditado». **03/09, fim do dia** — a testemunha leve cabe em qualquer noite da formação. **06/09** — a navegação mudou em 05/09 : página «Quero…» (`/inicio`, 51 intenções) e ligações profundas para os PDF. A auditoria terá de percorrer esses caminhos."}},{"id":"E2","d":"E","p":"P1","s":"ouvert","e":"M","sk":["langue"],"t":{"fr":"Trancher les conventions néerlandaise et grecque","pt":"Decidir as convenções neerlandesa e grega"},"v":{"fr":"Les dix locales sont à parité stricte de clés — 6 177 chacune, vérifiée en intégration continue depuis le 27/08. Mais les **conventions** de deux d'entre elles ne sont pas tranchées : le néerlandais est à l'état de brouillon, le grec reste à définir. Le test de parité ne voit pas ça : il compte les clés, pas leur justesse.","pt":"As dez locales estão em paridade estrita de chaves — 6 177 cada uma, verificada na integração contínua desde 27/08. Mas as **convenções** de duas delas não estão decididas: o neerlandês está em estado de rascunho, o grego resta a definir. O teste de paridade não vê isso: conta as chaves, não a justeza delas."},"w":{"fr":"Une locutrice ou un locuteur natif reprend la charte de langage inclusif, décide de la forme neutre pour sa langue, et relit les 6 177 chaînes en priorité sur les écrans les plus vus.","pt":"Uma falante ou um falante nativo retoma a carta de linguagem inclusiva, decide a forma neutra para sua língua, e revisa as 6 177 cadeias com prioridade nas telas mais vistas."},"y":{"fr":"Deux langues qui cessent d'être des traductions approximatives. C'est un des trois chantiers qui **ne demandent aucune compétence technique** — et le seul que personne d'autre ne peut faire à la place.","pt":"Duas línguas que deixam de ser traduções aproximativas. É um dos três canteiros que **não exigem nenhuma competência técnica** — e o único que ninguém mais pode fazer no lugar."},"f":{"fr":["Les conventions `nl` et `el` sont écrites dans `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","Les chaînes des écrans principaux sont relues.","La liste néerlandaise est déjà partie chez Ludwig — le suivi en fait partie."],"pt":["As convenções `nl` e `el` estão escritas em `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","As cadeias das telas principais estão revisadas.","A lista neerlandesa já foi enviada a Ludwig — o acompanhamento faz parte."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["docs/CHANTIERS_OUVERTS.md §5","docs/notes-audit/anarbib-charte-langage-inclusif-v2.md"],"verif":{"fr":"31/08 — les dix fichiers `anarbib-charte-langage-inclusif-v2-*.md` existent depuis le 05/06, `nl` et `el` compris ; mais dedans, la convention `nl` est marquée « provisoire » et la `el` « à définir avec une personne locutrice grecque militante ». Les documents existent, les décisions non : le constat tient sur le fond. **27/09** — `b425dfb1` a réécrit 18 valeurs `nl` (« u/uw » → « je/jouw », et deux « jullie » adressés à une seule personne → « je ») et 172 valeurs `el` (2e personne du pluriel → singulier), par substitutions écrites clé par clé (`scripts/i18n-it-de-nl-el-tu.cjs`), sous `DOC-ADDR-1`. Aucune personne de langue maternelle ne les a relues : le commit n'en cite aucune. La relecture du critère 2 doit commencer par ces 190 valeurs ; la table DE → PARA du script sert de feuille de relecture.","pt":"31/08 — os dez arquivos da carta v2 existem desde 05/06, `nl` e `el` incluídos; mas dentro deles a convenção `nl` está marcada « provisória » e a `el` « a definir com uma pessoa falante de grego militante ». Os documentos existem, as decisões não. **27/09** — `b425dfb1` reescreveu 18 valores `nl` («u/uw» → «je/jouw», e dois «jullie» dirigidos a uma só pessoa → «je») e 172 valores `el` (2ª pessoa do plural → singular), por substituições escritas chave por chave (`scripts/i18n-it-de-nl-el-tu.cjs`), sob `DOC-ADDR-1`, sem revisão de falante nativo. A revisão do critério 2 deve começar por esses 190 valores; a tabela DE → PARA do script serve de folha de revisão."}},{"id":"E4","d":"E","p":"P2","s":"ouvert","e":"S","sk":["langue"],"t":{"fr":"Régler les paires irrégulières de l'italien","pt":"Resolver os pares irregulares do italiano"},"v":{"fr":"`it.json` n'est pas conforme à la convention de l'astérisque final : les paires irrégulières comme `lettore` / `lettrice` ne se réduisent pas à `lettor*`. Le test de charte vérifie une seule chose sur l'italien — que `camerata` et `camerati` n'y figurent jamais, terme fasciste, échec dur — et rien d'autre.","pt":"`it.json` não está conforme à convenção do asterisco final: os pares irregulares como `lettore` / `lettrice` não se reduzem a `lettor*`. O teste de carta verifica uma só coisa no italiano — que `camerata` e `camerati` nunca apareçam, termo fascista, falha dura — e nada mais."},"w":{"fr":"Décider du traitement des paires irrégulières avec un locuteur natif, puis l'appliquer aux chaînes concernées. C'est un travail de langue, pas de code.","pt":"Decidir o tratamento dos pares irregulares com um falante nativo, depois aplicá-lo às cadeias envolvidas. É um trabalho de língua, não de código."},"y":{"fr":"L'italien est la langue de la présentation de Bologne. Une interface qui applique sa convention à moitié se voit à l'écran partagé.","pt":"O italiano é a língua da apresentação de Bolonha. Uma interface que aplica sua convenção pela metade se vê na tela compartilhada."},"f":{"fr":["Le traitement des paires irrégulières est écrit dans la charte italienne.","Les chaînes concernées sont corrigées.","Les trois chaînes restées en français dans l'interface italienne sont traduites (716 chaînes vues, 3 fautives)."],"pt":["O tratamento dos pares irregulares está escrito na carta italiana.","As cadeias envolvidas estão corrigidas.","As três cadeias que ficaram em francês na interface italiana estão traduzidas (716 cadeias vistas, 3 defeituosas)."]},"dep":{"fr":"Avant le 08/09 si possible, sinon octobre.","pt":"Antes de 08/09 se possível, senão outubro."},"r":["CLAUDE.md, piège connu n°9","CALENDRIER_bologne_2026-08-27"],"verif":[{"fr":"20/09 — mesuré dans `it.json` : 318 clés portent une forme en -tore/-trice, et **quatre conventions coexistent** — barre oblique abrégée (`lettore/trice` ×55, `autore/trice` ×29), astérisque (`amministratori*` ×19, `coordinatori*` ×6), masculin nu (`autore` ×20, `lettore` ×15, `editore` ×15) et paire développée (`autore/autrice` ×3). La fiche parlait de paires qui « ne se réduisent pas à `lettor*` » ; l'état réel est une absence de convention unique. Les « trois chaînes restées en français » n'ont pas été retrouvées : une heuristique (valeur it identique à la valeur fr) rend zéro, ce qui ne prouve rien. La décision reste à prendre avec un·e locuteur·rice, comme la fiche le dit.","pt":"20/09 — medido em `it.json`: 318 chaves têm uma forma em -tore/-trice, e **quatro convenções coexistem** — barra abreviada (`lettore/trice` ×55), asterisco (`amministratori*` ×19), masculino nu (`autore` ×20, `lettore` ×15) e par desenvolvido (`autore/autrice` ×3). As « três cadeias que ficaram em francês » não foram reencontradas. A decisão continua a tomar-se com uma pessoa falante, como a ficha diz."}]},{"id":"E6","d":"E","p":"P2","s":"en-cours","e":"M","sk":["front"],"t":{"fr":"Découper les cinq écrans qui pèsent plus de cent kilooctets","pt":"Dividir as cinco telas que pesam mais de cem quilobytes"},"v":{"fr":"Au 29/08, `BookDraftForm.jsx` faisait **197 Ko**, `BibliotecaPage.jsx` 184 Ko, `AccountPage.jsx` 154 Ko, `PanelPage.jsx` 114 Ko, `ImportacoesPage.jsx` 109 Ko. 29 des 38 routes sont déjà en chargement paresseux, et `vite.config.js` déclare quatre lots de dépendances — le problème n'est pas le chargement initial, c'est la taille d'un fichier unique. **Lot 1 le 27/09 (`486c71a1` ; mesuré avant : `BookDraftForm.jsx` 214 Ko, 3 803 lignes).** Les constantes et fonctions PURES — types de matériel, rôles, liaison MARC → autorités, cote d'étiquette, formulaire vide, candidat BN Brasil, zones ISBD — sortent dans `src/lib/catalogacao/bookDraft.js` (18 Ko), lignes déplacées par script sans ressaisie ; les zones ISBD reçoivent le formulaire et `t` au lieu de les lire dans la fermeture. `BookDraftForm.jsx` : **198 Ko**. Banc `book-draft-lib.test.js` (11 cas), build Vite vert, 1 160 tests. **Reste l'essentiel** : sous 60 Ko il faut découper le JSX (sous-formulaires, panneaux ressources numériques, ISBD, contributeurs) en composants — un changement qui se vérifie à l'écran, connecté, un panneau à la fois. **Lot 2 le 28/09 : le panneau « Recursos digitais vinculados » devient `DigitalResourcesPanel.jsx`** (`305a7922`, 24 Ko : formulaire d'édition, téléversement dans le bon seau, enregistrement, suppression ; le parent garde la liste, que la couverture tirée du PDF lit, et son chargement). Lignes déplacées par script, une différence voulue : l'édition en cours se referme quand le brouillon change, pas seulement sur une fiche vierge. `BookDraftForm.jsx` : **173 Ko** (214 au départ). Lint, 98 tests de source, build Vite. **Lot 3 le 28/09 : le panneau de recherche catalographique devient `LookupPanel.jsx`** (`006edc8a`, 15,7 Ko : recherche ISBN/ISSN/titre+auteur dans les sources, lecture du code-barres, liens BN/WorldCat/ISSN, candidates, résultats BN Brasil). Le panneau n'écrit jamais le formulaire : l'ISBN lu, la candidate ou la notice BN retenue remontent au parent par trois rappels, qui garde `applyCandidate` et `applyBnResult`. Une différence voulue : les résultats se referment dès que le brouillon change, pas seulement sur une fiche vierge. `BookDraftForm.jsx` : **167 Ko** (214 au départ). Lint, 1 402 tests (test de source `lookup-panel-monte`, 5 cas), build Vite. **Lot 4 le 28/09 : le bloc des contributeurs devient `ContributorsPanel.jsx`** (`3fbbd46e`, 10,6 Ko : lignes nom/rôle/principal·e, ajout par rôle, retrait, sélecteur d'autorité par ligne). La liste reste au parent — sauvegarde, chargement, synthèse d'`autor`, candidates et publication la lisent — et lui est passée avec son setter ; le panneau prévient par `onDirty`. `BookDraftForm.jsx` : **157 Ko**. 1 415 tests (test de source `contributors-panel-monte`, 4 cas), build Vite. **Lot 5 le 28/09 : le panneau de révision de la fiche devient `ReviewPanel.jsx`** (`1df28545`, 12 Ko : résumé et architecture documentale, sortie publique, pacote ISBD et ses boutons). Le panneau n'affiche que ce que le parent lui passe — l'état ISBD, sa préparation (qui écrit `marc_json`) et les libellés de zones restent au parent ; seul l'onglet courant vit dans le panneau, ramené au résumé quand le brouillon change. `BookDraftForm.jsx` : **146 Ko**. 1 427 tests (test de source `review-panel-monte`, 4 cas), build Vite. **Lot 6 le 28/09 : la prévia de cote et les exemplaires initiaux deviennent `ShelfLabelPreview.jsx` et `InitialCopiesBlock.jsx`** (`291793cc`, 2,8 et 2,6 Ko : pur affichage pour la cote, saisies remontées par `onChange` pour les exemplaires ; le parent garde les conditions d'affichage et la lecture à la publication). `BookDraftForm.jsx` : **142 Ko**. 1 431 tests, build Vite. **Lots 7 et 8 le 28/09, sur décision de Xavier (« les deux autres morceaux », pas la couverture)** : la réattribution d'une notice publiée devient `ReassignPanel.jsx` (`1c2300db`, 5,5 Ko : ses quatre états, le chargement des bibliothèques détentrices, les deux RPC ; le parent garde la condition admin réseau + notice publiée et la liste des cibles) ; les cartes « para informação » de l'aperçu deviennent `InfoCards.jsx` (`7aaf9905`, 8 Ko : auteur·rices liées, exemplaires de la bibliothèque active cliquables, compte des autres bibliothèques, avec le chargement fonds → exemplaires). `BookDraftForm.jsx` : **130 Ko**. 1 437 tests, build Vite. Les « sections de matériel » n'étaient pas à couper : `CatalogFieldRenderer.jsx` les rend déjà depuis le registre, le formulaire n'en porte que l'appel. Reste dans ce fichier : l'en-tête couverture (téléversement, galerie, page 1 du PDF, ~130 lignes de JSX et 70 de logique — le plus couplé : formulaire, brouillon, stockage, vignette), et la grille des champs écrite à la main. **`BibliotecaPage.jsx`, lot 1 le 28/09 au soir : l'onglet des prêts entre bibliothèques (PEB) devient `IllSection.jsx`** (`3c33b9f6`, 31,7 Ko : formulaire d'un nouveau prêt, file des prêts actifs, pointage du retour, archivage, partage numérique, avec ses sept états ; la liste des prêts et leurs exemplaires restent chargés par le parent, que le rapport lit, et arrivent en props). Les cinq styles partagés du composant passent dans `styles.js`. `BibliotecaPage.jsx` : **184 → 152 Ko**. **Lot 2 le 28/09 au soir : l'onglet « Tarefas internas » devient `TasksSection.jsx`** (`22083073`, 37 Ko : liste par échéance, création, statut, invitation ; tâches-types ; catalogue de suggestions — avec ses cinq états de formulaire, ses fonctions et ses deux mémos ; les trois listes restent chargées par le parent, que le rapport lit, et arrivent en props). `BibliotecaPage.jsx` : **184 → 117 Ko** en deux lots. **Lot 3 le 29/09 : la cotisation associative et le dépôt de garantie deviennent `MembershipSection.jsx` et `DepositSection.jsx`** (`2ae132fe`, 17,7 et 16 Ko : interrupteur du système, plafonds du dépôt, règles à créer, modifier, activer, supprimer — la cotisation garde sa confirmation à deux niveaux ; les deux listes de règles et la fiche de la bibliothèque restent chargées par le parent et arrivent avec leur setter). `BibliotecaPage.jsx` : **184 → 83 Ko** en trois lots. 1 462 tests, build Vite. Restent dans cette page : les rapports (texte du rapport et envoi, ~180 lignes), l'identité et les communications (deux formulaires, ~240 lignes), les horaires. **Lots 2 et 3 vus à l'écran, connecté, par Xavier le 28/09 : ok.** Chaque lot suivant se voit de même avant de clore.","pt":"Em 29/08, `BookDraftForm.jsx` tinha **197 KB**, `BibliotecaPage.jsx` 184 KB, `AccountPage.jsx` 154 KB, `PanelPage.jsx` 114 KB, `ImportacoesPage.jsx` 109 KB. 29 das 38 rotas já estão em carregamento preguiçoso, e `vite.config.js` declara quatro lotes de dependências — o problema não é o carregamento inicial, é o tamanho de um arquivo único. **Lote 1 em 27/09:** constantes e funções puras de `BookDraftForm` (214 Ko) passam para `src/lib/catalogacao/bookDraft.js` (`486c71a1`); o formulário cai para 198 Ko. Falta o essencial: dividir o JSX em componentes, verificado na tela. **Lote 2 em 28/09:** o painel de recursos digitais passa a `DigitalResourcesPanel.jsx` (`305a7922`); o formulário cai para 173 Ko. **Lote 3 em 28/09:** o painel de pesquisa catalográfica passa a `LookupPanel.jsx` (o painel nunca escreve o formulário: três retornos ao pai); o formulário cai para 167 Ko. Lotes 2 e 3 vistos na tela por Xavier em 28/09: ok. **Lote 4 em 28/09:** o bloco de contribuidores passa a `ContributorsPanel.jsx` (a lista fica no pai, o painel avisa por `onDirty`); o formulário cai para 157 Ko. **Lote 5 em 28/09:** o painel de revisão da ficha passa a `ReviewPanel.jsx` (só exibe; ISBD e sua preparação ficam no pai); o formulário cai para 146 Ko. **Lote 6 em 28/09:** a prévia de cota e os exemplares iniciais passam a `ShelfLabelPreview.jsx` e `InitialCopiesBlock.jsx`; o formulário cai para 142 Ko. **Lotes 7 e 8 em 28/09:** a reatribuição de um registro publicado passa a `ReassignPanel.jsx` e os cartões «para informação» da prévia a `InfoCards.jsx`; o formulário cai para 130 Ko. As seções de material já eram renderizadas pelo registro. Falta o cabeçalho (capa), o mais acoplado. **`BibliotecaPage.jsx`, lote 1 em 28/09:** a aba dos empréstimos entre bibliotecas (PEB) passa a `IllSection.jsx` (`3c33b9f6`); a página cai de 184 para 152 Ko. **Lote 2 em 28/09:** a aba das tarefas internas passa a `TasksSection.jsx` (`22083073`); a página cai para 117 Ko. **Lote 3 em 29/09:** a cotização e o depósito de garantia passam a `MembershipSection.jsx` e `DepositSection.jsx` (`2ae132fe`); a página cai para 83 Ko. Faltam relatórios, identidade e comunicações."},"w":{"fr":"Extraire les sous-formulaires et les onglets en composants séparés, sans changer le comportement. Commencer par `BookDraftForm`, le plus gros et le plus édité.","pt":"Extrair os subformulários e as abas em componentes separados, sem mudar o comportamento. Começar por `BookDraftForm`, o maior e o mais editado."},"y":{"fr":"Un fichier de 197 Ko n'est pas relisible par quelqu'un qui arrive, et deux personnes ne peuvent pas y travailler en même temps sans conflit. C'est un obstacle à la contribution avant d'être un problème de performance.","pt":"Um arquivo de 197 KB não é relegível por quem chega, e duas pessoas não podem trabalhar nele ao mesmo tempo sem conflito. É um obstáculo à contribuição antes de ser um problema de performance."},"f":{"fr":["Aucun fichier de `src/` ne dépasse 60 Ko.","Le comportement est inchangé, vérifié écran par écran.","Découpage par lots, un écran à la fois, jamais une refonte."],"pt":["Nenhum arquivo de `src/` passa de 60 KB.","O comportamento está inalterado, verificado tela por tela.","Divisão por lotes, uma tela por vez, nunca uma refundação."]},"dep":{"fr":"Reprend `#PERF-accountpage-split`, hérité du v32.","pt":"Retoma `#PERF-accountpage-split`, herdado do v32."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.5","Relevé du 29/08/2026"],"verif":[{"fr":"**28/09** — `BookDraftForm.jsx` : 214 Ko (27/09) → 198 (lot 1) → 173 (lot 2) → 167 (lot 3) → 157 (lot 4) → 146 (lot 5) → 142 (lot 6) → 137 (lot 7) → **130 Ko** (lot 8) ; neuf modules sortis : `lib/catalogacao/bookDraft.js` (18 Ko), `DigitalResourcesPanel.jsx` (24,6), `LookupPanel.jsx` (15,7), `ContributorsPanel.jsx` (10,6), `ReviewPanel.jsx` (12,1), `ShelfLabelPreview.jsx` (2,8), `InitialCopiesBlock.jsx` (2,6), `ReassignPanel.jsx` (5,5), `InfoCards.jsx` (8,0). Lots 2 et 3 vus à l'écran, connecté, par Xavier : ok. Lots 4 à 8 publiés, à voir de même ; `BibliotecaPage` lots 1 à 3 (onglets PEB, tâches internes, cotisation et dépôt) publiés, à voir aussi : créer un prêt, changer un statut, pointer un retour ; créer une tâche, un modèle, l'instancier, adopter une suggestion ; activer la cotisation, créer une règle, la désactiver ; activer le dépôt, poser un plafond, créer une règle. **29/09, vu à l'écran par Xavier** : l'interrupteur de la cotisation (lot 3) écrit en base ; créer une tâche, changer son état, la supprimer (lot 2) passent — journaux de l'API : création 200 à 12 h 12, changement d'état 200, et la table compte une insertion, une mise à jour, une suppression. Le dépôt de garantie (lot 3) aussi : plafond par lecteur·rice posé, règle « Caution standard » créée, interrupteur basculé — relevé en base après son passage (plafond 3,00, une règle active, une insertion dans `library_deposit_rules`). Puis les tâches en entier (instancier un modèle, adopter une suggestion du catalogue : deux tâches nées et supprimées, un sixième modèle adopté) et les règles de cotisation (désactivation et réactivation d'une règle) : ok. Puis l'onglet des prêts entre bibliothèques (lot 1) : quatre recherches d'exemplaires, un prêt créé avec son exemplaire (la file de notification a reçu son événement), les deux prêts de mai archivés, le prêt d'essai supprimé — journaux de l'API tous en 200 ; le pointage d'un retour n'a pas été essayé. **Les lots 1, 2 et 3 de `BibliotecaPage` sont vus.** Formulaire de notice, lots 4 à 8 : Xavier a créé, publié puis retiré une notice d'essai (« Je suis une légende », brouillon 6317) — journaux de l'API : brouillon créé, contributeur·rices enregistré·es (lot 4), publication acceptée avec son exemplaire initial `CCLA.2026.93` (lot 6), retrait tracé au journal du catalogue ; les onglets de révision et les cartes de l'aperçu (lots 5 et 8) ont été affichés sans erreur. Puis la liaison d'une autorité (lot 4), vérifiée par Xavier sur un brouillon réel : recherche d'autorité par nom, contributeur « Volin » lié à l'autorité 10111, brouillon réenregistré (journaux de l'API à 12 h 49, tous en 200). Puis la réattribution (lot 7), vérifiée par Xavier sur une notice réelle : « A Revolução desconhecida » (notice 771) passée de la BTL à la BLMF à 16 h 34 puis rendue à la BTL à 16 h 35 — relevé par l'API publique (MCP déconnecté) : les deux exemplaires `BTL-TL-EX-000829` et `BTL-TL-EX-000834` sont de retour dans le fonds BTL d'origine (656), publics. **Le panneau marche ; les deux fonctions de réattribution, non** : l'aller a créé un fonds BLMF (2747) que le retour a laissé VIDE, et la fiche publique de la notice annonce depuis « BLMF — 0 exemplaire » (2 bibliothèques au lieu d'une). `network_admin_reassign_book_from_to_library` et `network_admin_reassign_book_to_library` ne suppriment jamais le fonds qu'elles vident (défaut antérieur au découpage) ; 2747 est le seul fonds vide du réseau. Correctif fait le 29/09, autorisé par Xavier (registre `CAT-E19`, migration `20260929151902`) : un fonds que la réattribution vide est supprimé, sauf si un historique y renvoie ; les brouillons publiés des exemplaires déplacés suivent leur exemplaire ; le fonds 2747 est supprimé sous garde. Suite `reattribution_fonds_vide_tests` (`8ee37bde`) : **18/18** au banc, 13 mutants tués, chacun par le test qui le garde ; sa première version, jouée sans la migration, reproduisait le « 2 bibliothèques » de la prod. La relecture contradictoire (quatre angles) a ajouté trois gardes : un fonds recréé par une réattribution revient tel qu'il était (cote locale, prêtabilité, notes) ; chaque fonds supprimé est gardé entier au journal du catalogue, même quand l'admin réseau est staff de la cible ; un brouillon ouvert qui vise la cote retient le fonds. L'état de collection des revues est recompté. En production, au relevé du soir : plus aucun fonds sans exemplaire dans le réseau, et les deux fonctions gardent leurs droits (`authenticated`, `service_role`, jamais `anon`). Les défauts voisins vont en `C14`. Puis le pointage du retour d'un prêt entre bibliothèques (lot 1 de `BibliotecaPage`), vu par Xavier : ok. **Tous les lots des deux découpages sont vus.** Un seul accroc, antérieur au découpage : « Supprimer » s'offrait à un PEB déjà sorti (en partie rendu), la base le refusait et l'écran affichait « DELETE du loan … refusé par RLS » — le bouton ne s'offre plus qu'aux deux statuts que la politique DELETE accepte, et un refus se dit en clair dans les dix langues (`b3ac9d13`). Ces deux essais ont fait trouver deux défauts ANTÉRIEURS au découpage, corrigés le jour même : le contexte de session ne suivait pas un réglage changé à l'écran (`0bf96cb8`), et aucune tâche ne pouvait naître depuis le 31/08 (`455c7f0b`, cinq fonctions et quatre écrans parlaient l'ancien vocabulaire d'états). **29/09 — `BibliotecaPage.jsx` : 184 → 83 Ko** ; cinq sections sorties (`IllSection` 31,7, `TasksSection` 37, `MembershipSection` 17,7, `DepositSection` 16, `styles.js`) — la réattribution (admin réseau, notice publiée) et les cartes exemplaires de l'aperçu (notice publiée avec exemplaires) compris. Onze tests de source gardent les montages : `book-draft-lib`, `lookup-panel-monte`, `contributors-panel-monte`, `review-panel-monte`, `cote-et-exemplaires-initiaux-montes`, `reassign-panel-monte`, `info-cards-montees`, `serial-picker-monte`, et pour la page Bibliothèque `biblioteca-ill-section-montee`, `biblioteca-tasks-section-montee`, `biblioteca-cotisation-depot-montes`. Le critère « aucun fichier de `src/` au-dessus de 60 Ko » reste loin. **Remesuré le 29/09 au soir** (`75ccb035`), neuf fichiers de code le dépassent : `AccountPage.jsx` 156,8 Ko, `BookDraftForm.jsx` 130,9, `ImportacoesPage.jsx` 129,6 (109 le 29/08), `PanelPage.jsx` 118,5, `CatalogPage.jsx` 108,7 (91 le 29/08), `BibliotecaPage.jsx` 83,9, `CatalogacaoPage.jsx` 82,1, `AuthorDraftForm.jsx` 70,9, `QueuePanel.jsx` 60,6. Les dix fichiers de locales (486 à 734 Ko) tombent aussi sous la lettre du critère. **29/09** — deux défauts de plus, trouvés pendant la revue des écrans, antérieurs au découpage. `--brand-accent` n'était défini nulle part : le bouton « Enregistrer » des horaires (`e4814be1`, passé sur `.ab-button`) et une quarantaine d'appels `var(--brand-accent, …)` tombaient chacun sur leur propre rouge de repli. `0d8a0a30` le définit dans `theme-base.css` depuis `--brand-accent-rgb` — il suit donc le thème de la bibliothèque —, définit `.cat-btn` une seule fois (`components/ui/ui.css`) et passe trois écrans sur `.ab-button` (politique de conservation, partenaire de dépôt externe, cartographie). Et `0bf96cb8`, au-delà du contexte de session : `patchLibrary` (règle pure dans `contexts/libraryPatch.js`), appelé par la cotisation, la carte-lecteur et le saut collégial ; l'enregistrement de l'identité affichait « enregistré » même sur un refus de la base, il relève désormais l'erreur (banc `library-context-patch`, 9 cas). **05/10 — `AccountPage.jsx`, lot 1** (`fe5a9d84`) : l'onglet Historique devient `TabHistorico.jsx`, l'en-tête commun des onglets `ContaTabHeader.jsx`. Défaut d'origine corrigé en chemin : la séquence `\\u00b7` était écrite 13 fois en texte JSX, où elle s'affichait telle quelle. Banc `tab-historico-monte`, qui garde aussi tout `src/` contre une séquence `\\uXXXX` en texte JSX. Reste à voir à l'écran par Xavier, comme chaque lot (E31). **06/10 — `AccountPage.jsx`, lot 2** (`f025a469`, déployé à 21 h 35, vérifié dans le module servi) : les onglets Avis et Liste de souhaits deviennent `TabAvisos.jsx` et `TabDesejos.jsx`, lignes déplacées par script ; données et rechargement au parent, gestes inchangés ; `BookAvailability` quitte la page. 140 → 132 Ko. Banc `tab-avisos-desejos-monte` (7 cas, mutant rouge), vitest 2 087, build Vite vert. Restent dans la page Notes, Profil, Réserver, En cours. **À voir à l'écran par Xavier** (marquer lu, archiver, restaurer ; réserver, retirer un souhait). **06/10 — `AccountPage.jsx`, lot 3** (`ee3ef355`, déployé à 21 h 50, vérifié dans le module servi) : l'onglet « Mes notes de lecture » devient `TabNotas.jsx` ; notes, message, état d'édition et les deux écritures restent au parent (`saving` y sert d'autres formulaires). 132 → 128 Ko. Banc `tab-notas-monte` (6 cas, mutant rouge), vitest 2 093, build Vite vert. Restent Profil, Réserver, En cours, plus liés à l'état de la page. **À voir à l'écran par Xavier** (modifier, supprimer une note). **07/10 — `AccountPage.jsx`, lot 4** (`6584e5d3`, déployé à 19 h 51, vérifié dans le module servi) : l'onglet « En cours » devient `TabCurso.jsx` ; emprunts, état de renouvellement et les deux rendus partagés (étiquette de bibliothèque, même titre) restent au parent. 128 → 119 Ko. Banc `tab-curso-monte` (5 cas, mutant rouge), vitest 2 144, build Vite vert. Les deux fonctions de renouvellement relues ouvertes après la fermeture de 34 DEFINER du 07/10 (`1fafc35b`). Restent Profil et Réserver. **À voir à l'écran par Xavier** (un emprunt ouvert : regroupement, Renouveler). **07/10 — `AccountPage.jsx`, lot 5** (`a4ddaaa3`) : l'onglet « Réserver » devient `TabReservar.jsx` (21 props ; données, gestes et modales au parent ; `ReservationCard` lazy suit l'onglet ; `formatSchedule`, `decodeSystemNote`, `ContaTabHeader` quittent les imports de la page). 119 → 111 Ko. Banc `tab-reservar-monte` (mutant rouge), vitest 2 149. Une phrase de l'onglet était en portugais en dur : clé `account.reserve.howTo` dans les dix locales (`fd08ace5`, déployé et vérifié à 20 h 25 dans le module servi), et `account.reserve.hint` espagnol au tutoiement. **Retour de Xavier, 07/10** : l'onglet Notes vu à l'écran, conforme ; réservation et emprunt fonctionnent. Reste dans la page l'onglet Profil. **07/10 — `AccountPage.jsx`, lot 6** (`b42e3548`, déployé à 20 h 40, vérifié dans le module servi) : la grille des trois décisions de « Données personnelles » (export, notifications, lettre) devient `ContaDecisions.jsx`, gestes en ligne comme avant, état au parent (12 props) ; `DataExportButton` quitte la page. 111 → 103 Ko. La garde E19 relit l'onglet en remettant le source de `ContaDecisions` à sa place (7/7). Banc `conta-decisions-monte` (3 cas ; un premier mutant sans effet sur la donnée de test, refait sur un drapeau vrai : rouge), vitest 2 153. Reste dans la page le reste de l'onglet Profil (formulaire, adresse, mot de passe, carte, suppression). **À voir à l'écran par Xavier** (préférences de notification, lettre). **07/10 — retour de Xavier sur le lot 6** : préférences de notification enregistrées, lettre cochée puis décochée — conforme. **`AccountPage.jsx`, lot 7** (`2aef5ce2`, déployé à 21 h 02, vérifié dans le module servi) : quatre blocs de « Données personnelles » sortent à leur place — `ContaMotDePasse` (8 props), `ContaCotisation` (6, lecture seule), `ContaDepot` (1), `ContaSuppression` (5) ; le script vérifie qu'un bloc n'emprunte à la page que ses props. 103 → 88 Ko (153 avant le lot 1). Gardes adaptées sans s'affaiblir : E19 relit l'onglet en remettant à leur place les composants `Conta…`, E15 lit la page avec `ContaSuppression`. Banc `conta-profil-blocs-monte` (5 cas, mutant rouge), vitest 2 158. Restent dans la page : formulaire du profil, adresse, informations déclarées, carte de lecteur. **À voir à l'écran par Xavier** (mot de passe, cotisation, suppression bloquée sans le mot). **07/10 — `AccountPage.jsx`, lot 8, côté données** (`51bcfe51`, déployé à 21 h 23, vérifié dans le module servi) : les onze gestes de réservation et de consultation et leurs neuf états propres sortent dans le hook `useReservationActions` (`src/hooks`, 18 Ko) ; la page garde les données et le rechargement, qu'elle passe en entrée, et appelle le hook après `loadData`, avant tout retour anticipé — l'ordre des hooks ne change pas d'un rendu à l'autre ; le script a vérifié que les blocs n'empruntent à la page que ces six entrées. `assertRpcOk` quitte la page ; la garde `rpc-statut-ok-lu` balaie `src/hooks`. 88 → 73 Ko (153 avant le lot 1). Banc `use-reservation-actions` (8 cas, `renderHook`, mutant rouge), vitest 2 166, build vert. **Le seuil de 60 Ko n'est pas atteint** : ce qui reste (chargements `loadCore`/`loadHeavy`, soixante-dix états, formulaire du profil, modales) est le cœur de la page ; aller plus loin déplacerait les chargements eux-mêmes, dont l'ordre porte le rendu — à décider. **À voir à l'écran par Xavier** : réserver par référence, annuler une réservation.","pt":"**28/09** — `BookDraftForm.jsx`: 214 Ko → 130 Ko em oito lotes; nove módulos extraídos. Lotes 2 e 3 vistos na tela por Xavier: ok. Lotes 4 a 8 publicados, a ver do mesmo modo; `BibliotecaPage` lotes 1 a 3 (PEB, tarefas, cotização e depósito) publicados, a ver também; a página: 184 → 83 Ko. O critério «nenhum arquivo acima de 60 Ko» continua longe: remedidos em 29/09 à noite (`75ccb035`), nove arquivos de código passam disso — `AccountPage.jsx` 156,8 Ko, `BookDraftForm.jsx` 130,9, `ImportacoesPage.jsx` 129,6 (109 em 29/08), `PanelPage.jsx` 118,5, `CatalogPage.jsx` 108,7 (91 em 29/08), `BibliotecaPage.jsx` 83,9, `CatalogacaoPage.jsx` 82,1, `AuthorDraftForm.jsx` 70,9, `QueuePanel.jsx` 60,6; os dez arquivos de locales (486 a 734 Ko) também caem na letra do critério. Onze testes de fonte guardam as montagens, três deles da página Biblioteca. **29/09, visto na tela por Xavier**: o interruptor da cotização e o ciclo de uma tarefa (criar, mudar estado, apagar) funcionam; os dois ensaios revelaram dois defeitos anteriores à divisão, corrigidos no mesmo dia (`0bf96cb8`, `455c7f0b`). O depósito de garantia também: teto posto, regra criada, interruptor acionado. Tarefas completas (instanciar, adotar) e regras de cotização: ok. Aba PEB: buscar, criar, arquivar, apagar — ok. Formulário de registro: um registro de ensaio criado, publicado e retirado — contribuidores e exemplar inicial ok; ligar uma autoridade também verificado; reatribuição também (registro 771, BTL → BLMF → BTL): os dois exemplares voltaram, mas a ida deixou um acervo BLMF VAZIO (2747), que a ficha pública mostra com «0 exemplar» — as duas funções de reatribuição nunca apagam o acervo que esvaziam (defeito anterior à divisão); corrigido em 29/09 com autorização de Xavier (`CAT-E19`, migração `20260929151902`): o acervo esvaziado é apagado salvo referência; o acervo 2747 é apagado sob guarda. Suíte `reattribution_fonds_vide_tests` (`8ee37bde`): **18/18** na bancada, 13 mutantes mortos, cada um pelo teste que o guarda; a revisão contraditória acrescentou três guardas (o acervo recriado volta como era — número de chamada local, emprestabilidade, notas —; cada acervo apagado fica inteiro no diário do catálogo; um rascunho aberto que visa o número de chamada retém o acervo), e o estado de coleção das revistas é recontado. Em produção, no levantamento da noite: nenhum acervo sem exemplar na rede. Defeitos vizinhos em `C14`. Registro da devolução de um EEB: ok — todos os lotes vistos. «Excluir» era oferecido a um EEB já saído e a recusa aparecia em jargão («refusé par RLS»): o botão só aparece nos dois status aceitos pela base, e a recusa é dita claramente (`b3ac9d13`). **29/09** — mais dois defeitos, achados na revisão das telas, anteriores à divisão. `--brand-accent` não estava definido em lugar nenhum: o botão «Salvar» dos horários (`e4814be1`) e umas quarenta chamadas caíam cada uma no seu próprio vermelho de reserva; `0d8a0a30` o define a partir de `--brand-accent-rgb` (segue o tema da biblioteca) e define `.cat-btn` uma só vez. `0bf96cb8` expõe `patchLibrary` (regra pura em `contexts/libraryPatch.js`), chamado pela cotização, pela carteira de leitor e pelo salto colegiado; de passagem, salvar a identidade não diz mais «salvo» diante de uma recusa do banco (`library-context-patch`, 9 casos). **05/10 — `AccountPage.jsx`, lote 1** (`fe5a9d84`): a aba Histórico vira `TabHistorico.jsx`, o cabeçalho comum das abas `ContaTabHeader.jsx`. Defeito de origem corrigido: a sequência `\\u00b7` estava escrita 13 vezes em texto JSX, onde aparecia tal qual. Bancada `tab-historico-monte`, que guarda todo o `src/` contra uma sequência `\\uXXXX` em texto JSX. Falta Xavier ver na tela (E31). **06/10 — `AccountPage.jsx`, lote 2** (`f025a469`, implantado): abas Avisos e Lista de desejos em `TabAvisos.jsx` e `TabDesejos.jsx`; 140 → 132 KB; bancada 7 casos. **Xavier deve ver na tela.** **06/10 — `AccountPage.jsx`, lote 3** (`ee3ef355`, implantado): aba Minhas notas de leitura em `TabNotas.jsx`; 132 → 128 KB; bancada 6 casos. **Xavier deve ver na tela.** **07/10 — `AccountPage.jsx`, lote 4** (`6584e5d3`, implantado): aba Em curso em `TabCurso.jsx`; 128 → 119 KB; bancada 5 casos. **Xavier deve ver na tela.** **07/10 — lote 5** (`a4ddaaa3`): aba Reservar em `TabReservar.jsx`; 119 → 111 KB. Frase em português fixo traduzida (`fd08ace5`, dez locales). Xavier: aba Notas conforme na tela. **07/10 — lote 6** (`b42e3548`, implantado): as três decisões de Dados pessoais em `ContaDecisions.jsx`; 111 → 103 KB; guarda E19 7/7. **Xavier deve ver na tela.** **07/10 — lote 6 conforme na tela (Xavier). Lote 7** (`2aef5ce2`, implantado): senha, cotização, depósito e supressão da conta em quatro componentes; 103 → 88 KB. **Xavier deve ver na tela.** **07/10 — lote 8, lado dados** (`51bcfe51`, implantado às 21h23): onze gestos de reserva e consulta e seus nove estados em `useReservationActions`; 88 → 73 KB. O limite de 60 KB não foi atingido: o que resta é o núcleo da página. **Xavier deve ver na tela** (reservar, cancelar)."},{"fr":"**08/10 — décision de Xavier : AccountPage s'arrête à 73 Ko** (« Accepter 73 Ko ») — ce qui reste (chargements, soixante-dix états, formulaire du profil, modales) est le cœur de la page ; les huit lots ont fait leur travail. L'item reste en cours pour les écrans encore au-dessus de 60 Ko, remesurés sur `2d3c8273` : `ImportacoesPage.jsx` **153 Ko** (il a grossi avec les lots 1 à 5 de H21 : à découper APRÈS H21, et avec sa session), `BookDraftForm.jsx` 133 Ko, `PanelPage.jsx` 119 Ko, `CatalogPage.jsx` 116 Ko, `CatalogacaoPage.jsx` 87 Ko, `BibliotecaPage.jsx` 84 Ko, `AuthorDraftForm.jsx` 73 Ko. Le critère 1 (« aucun fichier de `src/` au-dessus de 60 Ko ») se lira écran par écran, chaque écran pouvant s'arrêter, comme AccountPage, là où le reste est son cœur.","pt":"**08/10 — decisão de Xavier: a AccountPage para em 73 KB.** O item segue em curso para as telas ainda acima de 60 KB: `ImportacoesPage.jsx` 153 KB (cresceu com H21: recortar DEPOIS de H21), `BookDraftForm.jsx` 133, `PanelPage.jsx` 119, `CatalogPage.jsx` 116, `CatalogacaoPage.jsx` 87, `BibliotecaPage.jsx` 84, `AuthorDraftForm.jsx` 73."}]},{"id":"E10","d":"E","p":"P3","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Le reste du socle terrain : permanence mobile, notification poussée, planche de codes","pt":"O resto da base de campo: plantão móvel, notificação push, prancha de códigos"},"v":{"fr":"Le socle terrain est livré : application installable, lecture de codes QR et ISBN, récolement, mise en page adaptative. Trois éléments restent, hérités du v32 et non revérifiés depuis : la permanence mobile (P3), la notification poussée (P5), et la planche de codes QR au format A4.","pt":"A base de campo está entregue: aplicativo instalável, leitura de códigos QR e ISBN, inventário, layout adaptativo. Três elementos restam, herdados do v32 e não reverificados desde então: o plantão móvel (P3), a notificação push (P5), e a prancha de códigos QR em formato A4."},"w":{"fr":"Commencer par vérifier lequel des trois est encore un manque réel. La notification poussée pose une question de fond avant une question de code : elle suppose un service tiers, ce que la doctrine anti-pistage regarde de près.","pt":"Começar verificando qual dos três ainda é uma falta real. A notificação push levanta uma questão de fundo antes de uma questão de código: pressupõe um serviço de terceiro, o que a doutrina antirrastreamento examina de perto."},"y":{"fr":"La planche A4 est la plus simple et la plus utile au comptoir : elle permet d'étiqueter un fonds sans imprimante à étiquettes. Les deux autres méritent d'abord une conversation.","pt":"A prancha A4 é a mais simples e a mais útil no balcão: permite etiquetar um acervo sem impressora de etiquetas. As outras duas merecem primeiro uma conversa."},"f":{"fr":["La planche A4 existe et s'imprime correctement.","Pour la notification poussée, un verdict écrit : faisable sans tiers, ou renoncement assumé."],"pt":["A prancha A4 existe e imprime corretamente.","Para a notificação push, um veredicto escrito: viável sem terceiro, ou renúncia assumida."]},"dep":{"fr":"Hérité de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`.","pt":"Herdado de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.1"]},{"id":"G1","d":"G","p":"P0","s":"ouvert","e":"L","sk":["collectif","aucune"],"t":{"fr":"Emprunter les circuits construits et jamais utilisés","pt":"Percorrer os circuitos construídos e jamais usados"},"v":{"fr":"Vérifié le 29/08 : **62 tables métier n'ont jamais reçu la moindre insertion.** Sept blocs entiers sont concernés — assemblées du réseau (3 tables), notes de lecture (2), propositions et objections d'autorité (3), référentiels de catalogage `catalog_ref_*` (8 sur 9), gouvernance des profils de bibliothèque (4, **alors que deux crons tournent dessus toutes les quinze minutes**), délibération sur les demandes d'adhésion (5, dont `library_request_votes` et `library_request_messages`).\n\n**Remesuré le 31/08 : toujours 62, et ce n'est pas une bonne nouvelle.** Le compte n'a pas bougé en deux jours — 62 tables de `public` sur 189 n'ont jamais reçu la moindre insertion. Mais ce n'est pas la même liste : `loan_cycle_notifications`, née ce matin avec les rappels d'échéance, y est entrée **le jour de sa création**. Un circuit livré aujourd'hui rejoint aussitôt la colonne des circuits jamais empruntés — c'est exactement le mécanisme que cet item nomme, et il continue de tourner pendant qu'on le décrit.\n\n**Un premier livre circule.** L'emprunt **#69** a été ouvert ce matin à 11 h 43 à la BLMF — item 84, *O Anarquismo na Escola, no Teatro, na Poesia* d'Edgar Rodrigues, échéance **21/09**. Il donne au bloc *notes de lecture* sa première chance réelle : le mi-parcours calculé par `notify-loan-cycle` tombe le **10 septembre**, et l'invitation à déposer une note sous pseudonyme partira ce jour-là (item **F4**). `book_reading_notes` est encore à zéro ligne ; si elle en porte une le 11, un des sept blocs sera sorti de cette liste pour de bon — et pas parce qu'on l'aura décidé, parce que quelqu'un l'aura emprunté.\n\nLes six autres blocs sont inchangés au 31/08, vérifiés table par table : assemblées du réseau (3), propositions et objections d'autorité (3), référentiels `catalog_ref_*` (8), gouvernance des profils de bibliothèque (4, **et les deux crons tournent toujours dessus toutes les quinze minutes**), délibération des demandes d'adhésion (5). Tous à zéro insertion.","pt":"Verificado em 29/08: **62 tabelas de negócio nunca receberam uma única inserção.** Sete blocos inteiros são atingidos — assembleias da rede (3 tabelas), notas de leitura (2), propostas e objeções de autoridade (3), referenciais de catalogação `catalog_ref_*` (8 de 9), governança dos perfis de biblioteca (4, **enquanto dois crons rodam sobre elas a cada quinze minutos**), deliberação sobre os pedidos de adesão (5, incluindo `library_request_votes` e `library_request_messages`).\n\n**Remedido em 31/08: ainda 62, e não é boa notícia.** A conta não mudou em dois dias — 62 tabelas de `public` em 189 nunca receberam uma inserção. Mas não é a mesma lista: `loan_cycle_notifications`, nascida esta manhã com os lembretes de vencimento, entrou nela **no dia da sua criação**. Um circuito entregue hoje junta-se de imediato à coluna dos circuitos jamais percorridos.\n\n**Um primeiro livro circula.** O empréstimo **#69** foi aberto esta manhã na BLMF — item 84, *O Anarquismo na Escola, no Teatro, na Poesia*, de Edgar Rodrigues, vencimento **21/09**. Dá ao bloco *notas de leitura* a sua primeira hipótese real: o meio-percurso calculado por `notify-loan-cycle` cai em **10 de setembro**, e o convite a deixar uma nota sob pseudónimo parte nesse dia (item **F4**). `book_reading_notes` continua a zero linhas.\n\nOs seis outros blocos estão inalterados em 31/08, verificados tabela a tabela: assembleias da rede (3), propostas e objeções de autoridade (3), referenciais `catalog_ref_*` (8), governança dos perfis (4, **e os dois crons continuam a rodar sobre elas a cada quinze minutos**), deliberação dos pedidos de adesão (5). Todos a zero inserções."},"w":{"fr":"Choisir un bloc et l'emprunter pour de vrai, du premier geste au dernier : tenir une assemblée du réseau, déposer une note de lecture, proposer une autorité et laisser quelqu'un objecter, faire délibérer une demande d'adhésion. Consigner ce qui manque, ce qui surprend, ce qui bloque.","pt":"Escolher um bloco e percorrê-lo de verdade, do primeiro ao último gesto: realizar uma assembleia da rede, depositar uma nota de leitura, propor uma autoridade e deixar alguém objetar, fazer deliberar um pedido de adesão. Registrar o que falta, o que surpreende, o que trava."},"y":{"fr":"C'est le principal enseignement du relevé du 29 août, et il ne figure dans aucun document du corpus. **Le projet ne souffre pas d'un manque de fonctionnalités : il souffre d'un manque d'usage.** Un circuit jamais emprunté n'est pas livré — il est seulement écrit. Et le jour où il devient le chemin critique, comme le circuit d'invitation vient de le devenir pour les promotions, il casse sur des choses qu'un seul passage aurait révélées.","pt":"É o principal ensinamento do levantamento de 29 de agosto, e não consta em nenhum documento do corpus. **O projeto não sofre de falta de funcionalidades: sofre de falta de uso.** Um circuito jamais percorrido não está entregue — está apenas escrito. E no dia em que se torna o caminho crítico, como o circuito de convite acaba de se tornar para as promoções, ele quebra em coisas que uma única passagem teria revelado."},"f":{"fr":["Au moins trois des sept blocs ont été empruntés de bout en bout, sur `blmf-teste` puis en réel.","Chaque passage a produit un compte rendu écrit de ce qui manque.","Les blocs dont l'usage n'est pas souhaité aujourd'hui sont marqués **dormants**, avec la raison — ce n'est pas un échec, c'est une information."],"pt":["Pelo menos três dos sete blocos foram percorridos de ponta a ponta, em `blmf-teste` e depois no real.","Cada passagem produziu um relatório escrito do que falta.","Os blocos cujo uso não é desejado hoje são marcados **dormentes**, com o motivo — não é um fracasso, é uma informação."]},"dep":{"fr":"Le bloc « assemblée » dépend de **A1**. Les autres non.","pt":"O bloco «assembleia» depende de **A1**. Os outros não."},"r":["Relevé du 29/08/2026","REGISTRE §32 AG, §28 ATE, §26 ONBO","emprunt #69 (BLMF, item 84, échéance 21/09)","item F4","public.book_reading_notes"],"verif":[{"fr":"31/08 — remesuré en production : **62 tables de `public` sur 189** à zéro insertion (`pg_stat_user_tables.n_tup_ins`, croisé avec un décompte de lignes sur les tables citées). Le compte est stable, la liste ne l'est pas — `loan_cycle_notifications` y est entrée le jour de sa naissance. Emprunt **#69** ouvert à la BLMF ; l'invitation à écrire une note de lecture est attendue le **10/09**, et c'est la première sortie possible de cette liste. **06/09** — deux circuits de plus sont construits sans être empruntés : **l'atelier ouvert aux œuvres** (05/09 soir, cinq types de proposition, file « corrige-moi » de 1 452 titres) compte **0 proposition** ; la **révision des lots importés** (05/09) compte **0 révision** (`catalog_batch_reviews` vide) ; et `network_contributors` est toujours à **0** — l'atelier des autorités lui-même n'avait jamais reçu une proposition avant le 05/09. La liste des circuits jamais empruntés s'allonge plus vite qu'elle ne se vide.","pt":"31/08 — remedido em produção: **62 tabelas de `public` em 189** a zero inserções. A conta é estável, a lista não. Empréstimo **#69** aberto na BLMF; o convite a escrever uma nota de leitura é esperado em **10/09**. **06/09** — dois circuitos a mais construídos sem uso : a oficina aberta às obras (0 proposta) e a revisão dos lotes importados (0 revisão) ; `network_contributors` continua a 0."},{"fr":"24/09 — remesuré en production : **deux circuits de plus sont empruntés** — `network_contributors` porte 2 lignes actives (22/09) et `library_request_votes` 2 votes favorables (14 et 16/09, l admission de Solidaires). Toujours à zéro : notes de lecture (`book_reading_notes`), propositions d autorité ou d œuvre (`authority_proposals`), révisions de lots (`catalog_batch_reviews`). Et G14 le redit en miniature : une invitation par courriel n a pas suffi, la relance humaine a fait accepter.","pt":"24/09 — remedido: **dois circuitos a mais foram percorridos** — 2 contribuidores da rede (22/09) e 2 votos sobre pedidos de admissão (14 e 16/09). Ainda a zero: notas de leitura, propostas de autoridade ou obra, revisões de lotes."},{"fr":"29/09 — un circuit jamais emprunté, cassé depuis quatre semaines sans que personne le voie. Depuis le 31/08, aucune tâche interne ne pouvait naître : la CHECK des sept états posée au titre de F6 (`20260831073104`) refusait le `pendente` que quatre fonctions écrivaient encore (23514), et la sonde des récurrences filtrait sur l'ancien état. La table était vide, aucune suite n'empruntait ces chemins. Xavier l'a trouvé en créant une tâche à l'écran (revue d'E6) ; corrigé le jour même (`455c7f0b`, migration `20260929095411`, suite `taches_sept_etats_tests`, banc `task-status-vocabulaire`), puis créer, changer d'état, supprimer, instancier un modèle et adopter une suggestion ont passé. Le même passage à l'écran a trouvé trois autres défauts antérieurs : le contexte de session qui ne suivait pas un réglage (`0bf96cb8`), la réattribution qui laissait un fonds vide (`8ee37bde`, `CAT-E19`), « Supprimer » offert à un PEB déjà sorti (`b3ac9d13`). Les tâches d'essai ont été supprimées : la table est de nouveau vide.","pt":"29/09 — um circuito nunca percorrido, quebrado havia quatro semanas sem que ninguém visse. Desde 31/08, nenhuma tarefa interna podia nascer: a CHECK dos sete estados posta no âmbito do F6 (`20260831073104`) recusava o `pendente` que quatro funções ainda escreviam (23514). A tabela estava vazia e nenhuma suíte passava por esses caminhos. Xavier achou o defeito ao criar uma tarefa na tela (revisão do E6); corrigido no mesmo dia (`455c7f0b`, migração `20260929095411`, suíte `taches_sept_etats_tests`). A mesma passagem pela tela achou outros três defeitos anteriores (`0bf96cb8`, `8ee37bde`, `b3ac9d13`). As tarefas de ensaio foram apagadas: a tabela está vazia de novo."},{"fr":"**05/10 — la cooptation réseau empruntée pour la première fois, en réel** (le camarade `ASR2026`, A1). Six défauts trouvés et corrigés le jour même, tous invisibles tant que le seul admin était aussi membre de deux bibliothèques : la fenêtre ne trouvait pas un compte sans bibliothèque (G17, `4d417f98`) ; les boutons des courriels menaient à des chemins qui n'ont jamais été des routes (`d186da59`, puis `43f8481e` pour les courriels déjà reçus) ; un compte sans bibliothèque chargeait sans fin cinq pages, dont la page Réseau (`43359867`) ; un lien ouvert sans session perdait la page demandée (`43359867`, `8a1d2663`) ; l'étiquette de rôle lui disait « Lecteur·rice » et la barre du haut n'avait pas « Mon compte » (`26142551`, `d147224e`) ; le soir, « Mon espace contributeur·rice », où arrive un compte sans bibliothèque, n'avait pas « Mes bibliothèques » : il ne pouvait ni demander son adhésion ni accepter une invitation (`f3694408`). Voir la clôture G18. La même leçon que le 29/09 : un circuit jamais emprunté ne marche pas.","pt":"**05/10 — a cooptação da rede percorrida pela primeira vez, no real** (o companheiro `ASR2026`). Seis defeitos achados e corrigidos no mesmo dia (ver G18)."},{"fr":"**05/10, inventaire** — la carte de la chaîne de courriel (F1, `docs/journal/audits/CARTE_chaine_courriel_2026-09-30.md`, mesurée en production) compte, sur environ 96 chaînes métier, **31 jamais empruntées** : branchées, jamais servies. Elles relèvent de cet item au même titre que les tables à zéro ligne.","pt":"**05/10, inventário** — o mapa da cadeia de e-mail (F1, `CARTE_chaine_courriel_2026-09-30.md`, medido em produção) conta, em cerca de 96 cadeias, **31 nunca percorridas**. Pertencem a este item como as tabelas vazias."}]},{"id":"G6","d":"G","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Mener un prêt entre bibliothèques de bout en bout par son écran","pt":"Fazer um empréstimo entre bibliotecas de ponta a ponta pela sua tela"},"v":{"fr":"Le cycle de vie du prêt entre bibliothèques est spécifié et implémenté en base : machine à états verrouillée, quatre triggers, cron `anarbib-peb-detect-overdue-daily` actif. **Un écran existe** : l'onglet PEB de la page Bibliothèque, présent dès le commit initial d'AnarBib v3 (`92e0064e`, 26/04), passé aux RPC PEB le 20/05 (`e4a0b9d6`, EA-12 phase 1), devenu `IllSection.jsx` le 28/09 (`3c33b9f6`). Un prêt s'y affiche chez la prêteuse comme chez l'emprunteuse. Le 29/08, la base portait 2 prêts pour 20 insertions historiques.","pt":"O ciclo de vida do empréstimo entre bibliotecas está especificado e implementado no banco: máquina de estados travada, quatro triggers, cron `anarbib-peb-detect-overdue-daily` ativo. **Uma tela existe**: a aba EEB da página Biblioteca, presente desde o commit inicial do AnarBib v3 (`92e0064e`, 26/04), ligada às RPC de EEB em 20/05 (`e4a0b9d6`, EA-12 fase 1), transformada em `IllSection.jsx` em 28/09 (`3c33b9f6`). Um empréstimo aparece nela tanto para a emprestadora quanto para a solicitante. Em 29/08, o banco trazia 2 empréstimos para 20 inserções históricas."},"w":{"fr":"Un écran de demande côté bibliothèque emprunteuse, un écran de traitement côté prêteuse, et l'affichage de l'état pour les deux. Les vues `interlibrary_loans_painel_ui` et `interlibrary_loan_items_ui` existent déjà.","pt":"Uma tela de pedido do lado da biblioteca solicitante, uma tela de tratamento do lado da emprestadora, e a exibição do estado para as duas. As views `interlibrary_loans_painel_ui` e `interlibrary_loan_items_ui` já existem."},"y":{"fr":"Le prêt entre bibliothèques est ce qui rend un réseau fédératif utile à ses lectrices, plutôt qu'une simple juxtaposition de catalogues. Le corpus le disait « une amorce en base, même sans écran » ; l'écran existait pourtant (voir v). Ce qui manque, c'est qu'un prêt réel le traverse de bout en bout.","pt":"O empréstimo entre bibliotecas é o que torna uma rede federativa útil às suas leitoras, em vez de uma simples justaposição de catálogos. O corpus dizia «um início no banco, mesmo sem tela»; a tela, porém, existia (ver v). O que falta é um empréstimo real atravessá-la de ponta a ponta."},"f":{"fr":["Un prêt complet a été fait entre deux bibliothèques du réseau, par l'interface.","Le flux « livre perdu ou abîmé » a un traitement écrit — **aucun flux ne le couvre aujourd'hui**, il se traite hors SIGB avec remontée en coordination."],"pt":["Um empréstimo completo foi feito entre duas bibliotecas da rede, pela interface.","O fluxo «livro perdido ou danificado» tem um tratamento escrito — **nenhum fluxo o cobre hoje**, trata-se fora do SIGB com escalada à coordenação."]},"dep":{"fr":"`EA-12 phase 2` (parité PEB, environ 45 fonctions) est gelée par `BIBLIO-9` — à ne pas confondre avec cet item.","pt":"`EA-12 fase 2` (paridade EEB, cerca de 45 funções) está congelada por `BIBLIO-9` — a não confundir com este item."},"r":["spec-cycle-vie-peb.md","PLAN_formation_coordination_BLMF §5","REGISTRE §14 PEB"],"verif":{"fr":"31/08 — `interlibrary_loans_v2` : 2 prêts vivants pour 20 insertions historiques, comme au 29/08. **29/09** — l'onglet emprunté à l'écran par Xavier (revue d'E6) : un prêt d'essai créé avec son exemplaire (la file de notification a reçu son événement), puis supprimé ; les deux PEB de mai (n° 24 et 25) archivés ; un second prêt d'essai (n° 35) créé, son retour pointé en deux fois, archivé. Un défaut trouvé en chemin : « Supprimer » s'offrait à un prêt déjà sorti, la base le refusait et l'écran affichait « refusé par RLS ». Le bouton ne s'offre plus qu'aux deux statuts que la politique DELETE accepte (préparation, attente de sortie), et un refus se dit en clair dans les dix langues (`b3ac9d13`). Au relevé du soir, aucun PEB n'est ouvert. Le critère 1 n'est pas tenu : c'étaient des essais d'une seule personne, pas un prêt réel entre deux bibliothèques, chacune tenant son côté.","pt":"31/08 — `interlibrary_loans_v2`: 2 empréstimos vivos para 20 inserções, como em 29/08. **29/09** — a aba percorrida na tela por Xavier (revisão do E6): um empréstimo de ensaio criado com seu exemplar (a fila de notificação recebeu o evento) e depois apagado; os dois EEB de maio (nº 24 e 25) arquivados; um segundo ensaio (nº 35) criado, devolução registrada em duas vezes, arquivado. Um defeito no caminho: «Excluir» era oferecido a um EEB já saído e a recusa aparecia em jargão («refusé par RLS»); o botão só aparece nos dois status aceitos pela política DELETE, e a recusa é dita claramente nas dez línguas (`b3ac9d13`). No levantamento da noite, nenhum EEB está aberto. O critério 1 não está cumprido: foram ensaios de uma só pessoa, não um empréstimo real entre duas bibliotecas, cada uma do seu lado."}},{"id":"G8","d":"G","p":"P2","s":"ouvert","e":"S","sk":["biblio","aucune"],"t":{"fr":"Compléter la cartographie avec les archives repérées ailleurs","pt":"Completar a cartografia com os arquivos identificados alhures"},"v":{"fr":"`cartography_entries` porte 187 fiches et le fichier `anarbib_bibliotheques_libertaires.geojson` en compte 121. Neuf archives repérées dans le réseau NORLA n'ont pas été confrontées à cette liste.","pt":"`cartography_entries` traz 187 fichas e o arquivo `anarbib_bibliotheques_libertaires.geojson` conta 121. Nove arquivos identificados na rede NORLA não foram confrontados com essa lista."},"w":{"fr":"Vérifier lesquelles des neuf figurent déjà, et faire entrer les manquantes avec `source = \"FICEDL\"` ou `\"NORLA\"` selon leur provenance.","pt":"Verificar quais das nove já constam, e fazer entrar as ausentes com `source = \"FICEDL\"` ou `\"NORLA\"` conforme sua proveniência."},"y":{"fr":"La carte n'a d'intérêt que si elle est plus complète que ce que chacun connaît déjà. Et la traçabilité de la source est ce qui permettra plus tard de dire d'où vient chaque fiche sans avoir à redemander.","pt":"O mapa só tem interesse se for mais completo do que aquilo que cada um já conhece. E a rastreabilidade da fonte é o que permitirá mais tarde dizer de onde vem cada ficha sem ter de perguntar de novo."},"f":{"fr":["Les neuf archives ont un verdict : déjà présente, ou ajoutée avec sa source.","Rappel : `statut_public` est à `FALSE` par défaut et **aucun import en masse** n'est autorisé (`MAP-E`)."],"pt":["Os nove arquivos têm um veredicto: já presente, ou acrescentado com sua fonte.","Lembrete: `statut_public` está em `FALSE` por omissão e **nenhuma importação em massa** é autorizada (`MAP-E`)."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["VEILLE_leftovers_maydayrooms_2026-08-19 §3.4","REGISTRE §34 MAP-E"],"verif":{"fr":"31/08 — 187 fiches en base, inchangé. Le fichier public a changé d'adresse et de contenu : `data/carte-publique.geojson` du dépôt vitrine, **109** entrées (l'item en citait 121 sous l'ancien nom). Les neuf archives NORLA restent à confronter.","pt":"31/08 — 187 fichas no banco. O arquivo público mudou de endereço: `data/carte-publique.geojson` no repositório vitrine, **109** entradas (o item citava 121). As nove NORLA seguem por confrontar."}},{"id":"G9","d":"G","p":"P3","s":"gele","e":"L","sk":["front"],"t":{"fr":"Implémenter la cartographie du réseau selon la spec v1.0","pt":"Implementar a cartografia da rede segundo a spec v1.0"},"v":{"fr":"Les arbitrages sont tranchés depuis le 18/06 : table dédiée, i18n hybride, carte publique comme route de l'application, moteur Leaflet, OpenStreetMap et Nominatim auto-hébergés, entrées non membres affichées avec un filtre clair. `MAP-I` (statut du prêt entre bibliothèques sur la carte interne) et `MAP-J` (auto-déclaration « ajouter ma bibliothèque » avec modération) restent différés. **L'implémentation est calendée post-Bologne, fin 2026 ou 2027.**","pt":"As arbitragens estão decididas desde 18/06: tabela dedicada, i18n híbrida, mapa público como rota do aplicativo, motor Leaflet, OpenStreetMap e Nominatim auto-hospedados, entradas não membros exibidas com um filtro claro. `MAP-I` (estatuto do empréstimo entre bibliotecas no mapa interno) e `MAP-J` (autodeclaração «adicionar minha biblioteca» com moderação) continuam adiados."},"w":{"fr":"Reprendre la spec v1.0 quand la fenêtre s'ouvre. Attention : le REGISTRE porte **deux sections `MAP`** — le §2 est un squelette où tout est ouvert, le §34 est la version tranchée. Le §2 n'a ni tampon de supersession ni renvoi vers le §34 : **c'est le §34 qui vaut**.","pt":"Retomar a spec v1.0 quando a janela se abrir. Atenção: o REGISTRO traz **duas seções `MAP`** — a §2 é um esqueleto onde tudo está aberto, a §34 é a versão decidida. A §2 não tem carimbo de supersessão nem remissão à §34: **é a §34 que vale**."},"y":{"fr":"La carte est le premier objet qu'une bibliothèque qui découvre le réseau va regarder. Elle mérite d'être faite quand il y aura du temps pour la faire bien, et pas dans la fenêtre d'avant Bologne.","pt":"O mapa é o primeiro objeto que uma biblioteca que descobre a rede vai olhar. Merece ser feito quando houver tempo para fazê-lo bem, e não na janela anterior a Bolonha."},"f":{"fr":["La carte publique est une route de l'application, servie sans requête vers un tiers (voir **E5**).","Le §2 du REGISTRE porte un renvoi vers le §34."],"pt":["O mapa público é uma rota do aplicativo, servido sem requisição a terceiro (ver **E5**).","A §2 do REGISTRO traz uma remissão à §34."]},"dep":{"fr":"Après Bologne. Lié à **E5** et **J5**.","pt":"Depois de Bolonha. Ligado a **E5** e **J5**."},"r":["spec-cartographie-reseau.md v1.0","REGISTRE §34 MAP"]},{"id":"G10","d":"G","p":"P2","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Solder les trois questions d'onboarding marquées « au plus vite »","pt":"Liquidar as três questões de onboarding marcadas «o mais rápido possível»"},"v":{"fr":"Trois points sont marqués 🔴 « à résoudre au plus vite » depuis juin et n'ont pas bougé : `#111` (évaluation collaborative d'un·e administrateur·rice réseau, dormante), `ONBO-Q13` (transfert technique du mandat de coordination), et la finition du volet 10 de l'atelier d'onboarding.","pt":"Três pontos estão marcados 🔴 «a resolver o mais rápido possível» desde junho e não se moveram: `#111` (avaliação colaborativa de uma pessoa administradora de rede, dormente), `ONBO-Q13` (transferência técnica do mandato de coordenação), e o acabamento do módulo 10 da oficina de onboarding."},"w":{"fr":"Les trois se traitent ensemble parce qu'ils portent la même question : que se passe-t-il quand quelqu'un arrive, et quand quelqu'un part ?","pt":"Os três se tratam juntos porque carregam a mesma questão: o que acontece quando alguém chega, e quando alguém sai?"},"y":{"fr":"`ONBO-Q13` est le cas de figure d'une coordination qui change de mains. Aujourd'hui, une bibliothèque dont la personne coordinatrice disparaît n'a pas de chemin écrit. C'est exactement le risque que **A1** décrit à l'échelle du réseau, à l'échelle d'une bibliothèque cette fois.","pt":"`ONBO-Q13` é o caso de uma coordenação que muda de mãos. Hoje, uma biblioteca cuja pessoa coordenadora desaparece não tem caminho escrito. É exatamente o risco que **A1** descreve na escala da rede, desta vez na escala de uma biblioteca."},"f":{"fr":["Le transfert de mandat a un chemin écrit et éprouvé sur `blmf-teste`.","`#111` a un verdict : réveillée, ou fermée.","Le volet 10 est fini."],"pt":["A transferência de mandato tem um caminho escrito e testado em `blmf-teste`.","`#111` tem um veredicto: reativada, ou fechada.","O módulo 10 está terminado."]},"dep":{"fr":"Éclairé par **G3** (le circuit d'invitation est le même).","pt":"Esclarecido por **G3** (o circuito de convite é o mesmo)."},"r":["REGISTRE §26 ONBO-Q13","spec-onboarding-biblioteca-v2.0"],"verif":{"fr":"07/09 — dans le dépôt : `fn_activate_approved_library_request` n'est appelée par **aucun** composant de `src/` — « Concluir a constituição » ne vaut donc pas activation, comme le manuel v5 l'avait relevé le 01/09. C'est la quatrième question d'onboarding, ou la première.","pt":"07/09 — no repositório: `fn_activate_approved_library_request` não é chamada por **nenhum** componente de `src/` — «Concluir a constituição» não vale, portanto, ativação, como o manual v5 tinha levantado em 01/09. É a quarta questão de onboarding, ou a primeira."}},{"id":"H2","d":"H","p":"P1","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Poser à la FICEDL les sept questions qui bloquent l'export du thésaurus","pt":"Colocar à FICEDL as sete questões que bloqueiam a exportação do tesauro"},"v":{"fr":"L'export complet des 620 descripteurs dans les deux formats est **à une soirée de travail** — dès que les sept questions ont une réponse. Elles sont écrites et personne ne les a encore posées.","pt":"A exportação completa dos 620 descritores nos dois formatos está a **uma noite de trabalho** — assim que as sete questões tiverem resposta. Estão escritas e ninguém ainda as colocou."},"w":{"fr":"Les sept : la forme des identifiants ; **la hiérarchie, qui est la vraie question** ; le statut de la facette « dates » ; le sort des 2 842 liens vers six catalogues ; le grec romanisé ; la licence ; et la manière dont le fichier se régénère.","pt":"As sete: a forma dos identificadores; **a hierarquia, que é a verdadeira questão**; o estatuto da faceta «datas»; o destino dos 2 842 vínculos para seis catálogos; o grego romanizado; a licença; e a maneira como o arquivo se regenera."},"y":{"fr":"Sur 148 descripteurs à libellé arborescent, **93 parents sont retrouvés et 55 sont introuvables** : « art », « économie », « guerres », « littérature », « presse », « syndicalisme » ne sont pas des descripteurs, ou portent un autre nom. Vu de l'extérieur, **la hiérarchie n'est pas une donnée, c'est une convention d'affichage dans une chaîne de caractères** — et on ne peut pas écrire `skos:broader` honnêtement là-dessus. Seule la FICEDL peut dire si le site tient une vraie relation parent-enfant.","pt":"De 148 descritores com rótulo arborescente, **93 pais são encontrados e 55 são inencontráveis**: «arte», «economia», «guerras», «literatura», «imprensa», «sindicalismo» não são descritores, ou têm outro nome. Visto de fora, **a hierarquia não é um dado, é uma convenção de exibição numa cadeia de caracteres** — e não se pode escrever `skos:broader` honestamente sobre isso. Só a FICEDL pode dizer se o site mantém uma verdadeira relação pai-filho."},"f":{"fr":["Les sept questions sont posées, avec l'audit de qualité produit à la première aspiration en pièce jointe — **les corrections appartiennent à la source, pas aux copies**.","Quatre anomalies vues en passant sont remontées : deux sites différents sous le même intitulé « catalogue du CCL » ; les archives du *Monde libertaire* apparaissant deux fois par terme sous deux formes d'adresse ; `mot228` (« populations autochtones ») présent dans deux facettes ; 29 libellés portugais portant astérisque, point d'interrogation ou espace finale.","La question 7 est la plus rentable : un squelette SPIP qui imprime les termes en CSV règle aussi la charge robots — **une requête au lieu de 620, par consommateur et par mise à jour**, pour une demi-journée de travail côté FICEDL."],"pt":["As sete questões estão colocadas, com a auditoria de qualidade produzida na primeira coleta em anexo — **as correções pertencem à fonte, não às cópias**.","Quatro anomalias vistas de passagem são reportadas: dois sites diferentes sob o mesmo rótulo «catálogo do CCL»; os arquivos do *Monde libertaire* aparecendo duas vezes por termo sob duas formas de endereço; `mot228` («populações autóctones») presente em duas facetas; 29 rótulos portugueses com asterisco, ponto de interrogação ou espaço final.","A questão 7 é a mais rentável: um esqueleto SPIP que imprime os termos em CSV resolve também a carga de robôs — **uma requisição em vez de 620, por consumidor e por atualização**, para meia jornada de trabalho do lado da FICEDL."]},"dep":{"fr":"Bloque **H3**. À poser à Bologne ou avant.","pt":"Bloqueia **H3**. A colocar em Bolonha ou antes."},"r":["NOTE_export_thesaurus_questions_ouvertes_2026-08-28"],"verif":[{"fr":"07/09, soir — **deux réponses de plus de la source.** (1) `X (généralités)` **est** la tête de hiérarchie : les 45 parents « introuvables » sont 45 `broader` réels ; 138 descripteurs sur 148 sont rattachés, 10 ne le sont pas — et la question restante est devenue : `guerres` et `art : courants` sont-ils des **groupes de mots-clés SPIP** ? (2) Identifiants : la forme canonique SPIP est `?motNN` quel que soit le type d'URL affiché ; les « URL propres » sont des adresses, pas des identités. La question 1 tombe — URI `https://thesaurus.ficedl.info/?motNN`, `skos:notation` = le numéro, proposition `/id/motNN` retirée. Restent : la question des groupes, le format (un fichier à deux schémas ou deux), les liens vers les catalogues, le grec, la licence, la régénération.\n\n07/09 — **Réponse partielle reçue de la source** : « guerre » est dans les deux thésaurus qu'elle tient séparés, *liste commune* et *géo-histo* ; les listes de communes (Bettini, Bianco) sont hors thésaurus. Ça répond à la question 3 (dates) et déplace la question 2 : les sept deviennent trois — `X` = `X (généralités)` ? ; `guerres`, `art : courants` = regroupements ou termes ? ; un fichier à deux schémas ou deux fichiers ? Les autres (identifiants, liens, grec, licence, régénération) restent posées. Le même jour, `thesaurus.ficedl.info` est **hors service** (« problème technique (serveur SQL) »).","pt":"07/09, noite — **mais duas respostas da fonte.** (1) `X (généralités)` **é** a cabeça da hierarquia: os 45 pais «não encontrados» são 45 `broader` reais; 138 descritores de 148 estão vinculados, 10 não — e a pergunta restante virou: `guerres` e `art : courants` são **grupos de palavras-chave SPIP**? (2) Identificadores: a forma canônica SPIP é `?motNN` seja qual for o tipo de URL exibido; as «URL propres» são endereços, não identidades. A questão 1 cai — URI `https://thesaurus.ficedl.info/?motNN`, `skos:notation` = o número, proposta `/id/motNN` retirada. Restam: a questão dos grupos, o formato (um arquivo com dois esquemas ou dois), os vínculos aos catálogos, o grego, a licença, a regeneração.\n\n07/09 — **Resposta parcial recebida da fonte**: «guerre» está nos dois tesauros que ela mantém separados, *lista comum* e *geo-histo*; as listas de municípios (Bettini, Bianco) estão fora do tesauro. Isso responde à questão 3 (datas) e desloca a questão 2: as sete viram três — `X` = `X (généralités)`?; `guerres`, `art : courants` = agrupamentos ou termos?; um arquivo com dois esquemas ou dois arquivos? As outras (identificadores, vínculos, grego, licença, regeneração) continuam postas. No mesmo dia, `thesaurus.ficedl.info` está **fora do ar** («problema técnico (servidor SQL)»)."},{"fr":"16/09 — non clos : la rencontre de Bologne et les échanges avec Ludwig (28 sujets nl validés le 09/09) ont ouvert le canal, mais rien n'atteste que **les sept questions** ont été posées avec l'audit en pièce jointe. À poser par écrit, maintenant que le contact existe.","pt":"16/09 — não fechado: o encontro de Bolonha e as trocas com Ludwig abriram o canal, mas nada atesta que **as sete perguntas** foram feitas com a auditoria em anexo. A fazer por escrito, agora que o contacto existe."},{"fr":"**05/10 — le site du thésaurus ne répond plus du tout.** Le 27/09, la page SPIP rendait encore un 503 ; le 05/10, `thesaurus.ficedl.info` accepte la connexion puis la coupe dès `robots.txt` (`server closed abruptly`), pareil depuis un chemin réseau indépendant ; le DNS n'a pas bougé (84.234.23.121). La dégradation se suit sur un mois : deux fiches en 503 le 03/09, tout le site le 09/09, encore le 27/09, plus de réponse le 05/10. Aucun raclage possible ; l'instantané du 03/09 reste la référence (H13), le paquet sur E: n'a pas bougé. **Deux gestes proposés à Xavier le 05/10, sans réponse** : envoyer le courriel à la source — prêt depuis le 16/09, jamais parti ; son thésaurus est injoignable depuis un mois et il ne le sait peut-être pas, c'est devenu la raison la plus pressante de l'écrire — ; et poser une sonde légère, une requête par jour, qui prévient le jour où le site revient.","pt":"**05/10 — o site do tesauro não responde mais.** Em 27/09 ainda devolvia um 503; em 05/10 aceita a conexão e a corta desde `robots.txt`, igual por um caminho de rede independente. Nenhuma raspagem possível; o instantâneo de 03/09 segue como referência (H13). **Dois gestos propostos a Xavier, sem resposta**: enviar o e-mail à fonte (pronto desde 16/09, nunca enviado) e pôr uma sonda leve, um pedido por dia."}]},{"id":"H6","d":"H","p":"P2","s":"ouvert","e":"M","sk":["biblio","collectif"],"t":{"fr":"Aligner les vocabulaires militants qui ne se connaissent pas","pt":"Alinhar os vocabulários militantes que não se conhecem"},"v":{"fr":"NORLA a bâti son vocabulaire — avec ses facettes *Tactics* et *Social Movement* — **sans lien avec le thésaurus FICEDL**. Deux vocabulaires militants, construits en parallèle, qui s'ignorent. Par ailleurs, les 11 catégories thématiques d'AnarcosyndicalismeBOOK ne sont alignées sur rien.","pt":"A NORLA construiu seu vocabulário — com suas facetas *Tactics* e *Social Movement* — **sem vínculo com o tesauro FICEDL**. Dois vocabulários militantes, construídos em paralelo, que se ignoram. Além disso, as 11 categorias temáticas do AnarcosyndicalismeBOOK não estão alinhadas a nada."},"w":{"fr":"Commencer par le plus petit et le plus faisable : les 11 catégories d'AnarcosyndicalismeBOOK, **un premier pas concret, borné, faisable en une soirée** — et comme le thésaurus est déjà en dix langues, l'alignement vaut simultanément pour les dix. Puis ouvrir la conversation avec NORLA.","pt":"Começar pelo menor e mais viável: as 11 categorias do AnarcosyndicalismeBOOK, **um primeiro passo concreto, delimitado, viável numa noite** — e como o tesauro já está em dez línguas, o alinhamento vale simultaneamente para as dez. Depois abrir a conversa com a NORLA."},"y":{"fr":"Chaque vocabulaire construit isolément est un fonds que les autres ne trouveront pas. Réserve à garder en tête : les vocabulaires d'éphémères sont **monolingues**, l'alignement y sera plus lourd que sur des sujets.","pt":"Cada vocabulário construído isoladamente é um acervo que os outros não encontrarão. Reserva a ter em mente: os vocabulários de efêmeros são **monolíngues**, o alinhamento será mais pesado neles do que em assuntos."},"f":{"fr":["Les 11 catégories d'AnarcosyndicalismeBOOK sont alignées.","Une conversation est ouverte avec NORLA sur l'alignement des facettes.","La réciprocité est demandée : **les catalogues partenaires ne pointent pas en retour** aujourd'hui."],"pt":["As 11 categorias do AnarcosyndicalismeBOOK estão alinhadas.","Uma conversa está aberta com a NORLA sobre o alinhamento das facetas.","A reciprocidade é pedida: **os catálogos parceiros não apontam de volta** hoje."]},"dep":{"fr":"Octobre-novembre, si le camarade s'y met. Lié à **D4**.","pt":"Outubro-novembro, se o companheiro topar. Ligado a **D4**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26 §6","VEILLE_leftovers_maydayrooms_2026-08-19"],"verif":[{"fr":"**05/10 — AnarcosyndicalismeBOOK, lu de près** à l'occasion du coup de main au camarade (`ASR2026`) : son CMS expose déjà un flux OPDS (`opds.php`, Dublin Core). AnarBib pourrait le moissonner, ou lui proposer un point OAI-PMH — FED-O11, « seul le catalogue traverse ». C'est la collaboration la plus intéressante politiquement, et elle se discute avec lui d'abord, jamais par une PR surprise. (Sa PR n° 2 chez lui — liste blanche d'upload, nettoyage des fichiers retirés, option Calibre auto-signé — a été fusionnée le 05/10.)","pt":"**05/10 — AnarcosyndicalismeBOOK, lido de perto** por ocasião da ajuda ao camarada (`ASR2026`): seu CMS já expõe um fluxo OPDS. O AnarBib poderia colhê-lo, ou propor um ponto OAI-PMH (FED-O11). Discutir com ele primeiro, nunca por uma PR surpresa."}]},{"id":"I2","d":"I","p":"P1","s":"ouvert","e":"L","sk":["sysadmin"],"t":{"fr":"Achever la bascule vers l'auto-hébergement","pt":"Concluir a migração para a auto-hospedagem"},"v":{"fr":"La pile est réduite de douze à **six conteneurs** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), les versions sont épinglées, `bootstrap.sh` a été exécuté pour de vrai le 26/08 avec huit défauts relevés et corrigés, et la répétition du 18/08 a rejoué 124 migrations et restauré un dump de production en 17 secondes. Reconstruction complète mesurée : **25 minutes**.","pt":"A pilha está reduzida de doze a **seis contêineres** (`db`, `rest`, `auth`, `storage`, `functions`, `caddy`), as versões estão fixadas, `bootstrap.sh` foi executado de verdade em 26/08 com oito defeitos levantados e corrigidos, e o ensaio de 18/08 reexecutou 124 migrações e restaurou um dump de produção em 17 segundos. Reconstrução completa medida: **25 minutos**."},"w":{"fr":"Ce qui reste : découpler la chaîne de déploiement de l'intégration continue (**de l'extraction, pas de la création** — `scripts/ci/deployer-backend.sh` existe déjà), poser un proxy inverse avec tunnel devant la pile, passer des tags aux empreintes `sha256`, et refaire la répétition à froid un mois plus tard pour vérifier que rien n'a divergé. **Ajouté le 08/09/2026, à poser à l'hébergeur pressenti (Les Herbes Folles), ou à un ou plusieurs autres** : **un Jitsi à nous.** La visio d'entraide et d'assemblées vivait chez Autistici/Inventati ; A/I a été désigné « SDGT » par les États-Unis le 26/08 et a fermé ; le 08/09 on a basculé sur Framatalk (Framasoft, Hetzner en Allemagne) — un tiers de confiance, mais un tiers, et sur une infrastructure qu'une mesure du même genre peut atteindre. Un Jitsi hébergé par nous (ou par un collectif d'hébergement allié, ou réparti entre plusieurs) est la seule sortie complète. Ce n'est pas la même charge que le reste de la pile : le videobridge consomme de la bande passante montante à proportion des participantes, et une assemblée de vingt personnes n'est pas une aide à deux. **Questions à poser** : la VM peut-elle tenir un Jitsi (RAM, bande passante, ports UDP 10000) ; préfèrent-ils une seconde machine ; un autre hébergeur allié (Chapril, Systemli, une instance amie) accepterait-il de porter la visio pour le réseau, quitte à ce qu'elle ne vive pas au même endroit que la base ? Le même jour, **le fichier de fond de carte** (`map-tiles/planet-z12.pmtiles`, 18 Go, à réextraire en z15 depuis la VM : 138 Go) est entré dans ce qui déménage — à compter dans le disque demandé (I21).","pt":"O que resta: desacoplar a cadeia de implantação da integração contínua (**extração, não criação** — `scripts/ci/deployer-backend.sh` já existe), colocar um proxy reverso com túnel na frente da pilha, passar de tags para impressões `sha256`, e refazer o ensaio a frio um mês depois para verificar que nada divergiu. **Acrescentado em 08/09/2026, a colocar ao hospedeiro previsto (Les Herbes Folles), ou a um ou vários outros**: **um Jitsi nosso.** A videoconferência de apoio mútuo e de assembleias vivia na Autistici/Inventati; a A/I foi designada «SDGT» pelos Estados Unidos em 26/08 e fechou; em 08/09 mudámos para o Framatalk (Framasoft, Hetzner n
