ão foi escolhida**, e a ficha prática de uma página não está escrita."},"w":{"fr":"Comparer ScanTailor + `img2pdf` avec `unpaper` ou ImageMagick sur dix ouvrages réels et variés, mesurer le poids et la lisibilité, choisir. Puis écrire la fiche : trois réglages, cinq contrôles, rien d'autre.","pt":"Comparar ScanTailor + `img2pdf` com `unpaper` ou ImageMagick em dez obras reais e variadas, medir o peso e a legibilidade, escolher. Depois escrever a ficha: três ajustes, cinco controles, nada mais."},"y":{"fr":"Équiper une bibliothèque avec une chaîne non éprouvée, c'est lui faire scanner deux cents pages qu'il faudra refaire. Et le seuillage bitonal est **destructeur et irréversible** : on ne scanne jamais directement en bitonal, jamais.","pt":"Equipar uma biblioteca com uma cadeia não testada é fazê-la escanear duzentas páginas que será preciso refazer. E a limiarização bitonal é **destrutiva e irreversível**: nunca se escaneia diretamente em bitonal, nunca."},"f":{"fr":["Un outil est choisi, avec les mesures qui ont décidé.","La fiche pratique d'une page existe, en portugais et en français.","Le sort des images de capture est écrit : archivage hors ligne systématique ou effacement après validation — **la réponse appartient à chaque bibliothèque, mais elle doit être écrite quelque part**."],"pt":["Uma ferramenta é escolhida, com as medidas que decidiram.","A ficha prática de uma página existe, em português e francês.","O destino das imagens de captura está escrito: arquivamento off-line sistemático ou apagamento após validação — **a resposta pertence a cada biblioteca, mas precisa estar escrita em algum lugar**."]},"dep":{"fr":"Le dimensionnement annoncé (20 Go pour démarrer, jusqu'à 50 Go sur 3-5 ans) dépend du choix d'outil.","pt":"O dimensionamento anunciado (20 GB para começar, até 50 GB em 3-5 anos) depende da escolha da ferramenta."},"r":["DECISION_profil_numerisation_2026-08-20 §9"]},{"id":"D6","d":"D","p":"P3","s":"ouvert","e":"M","sk":["front","deno"],"t":{"fr":"Reprendre ou remplacer le lecteur EPUB","pt":"Retomar ou substituir o leitor EPUB"},"v":{"fr":"`epubjs ^0.3.93` est la seule dépendance clairement pré-1.0 sur un chemin critique — le lecteur EPUB, `src/lib/reader/epubEngine.js` et `src/components/viewers/EpubReader.jsx`. La bibliothèque n'a pas connu de publication majeure depuis des années.","pt":"`epubjs ^0.3.93` é a única dependência claramente pré-1.0 num caminho crítico — o leitor EPUB, `src/lib/reader/epubEngine.js` e `src/components/viewers/EpubReader.jsx`. A biblioteca não teve publicação maior há anos."},"w":{"fr":"Évaluer ce qui casse aujourd'hui, ce qui cassera avec les navigateurs à venir, et s'il existe une alternative libre maintenue. Décider entre épingler et assumer, ou remplacer.","pt":"Avaliar o que quebra hoje, o que quebrará com os navegadores futuros, e se existe uma alternativa livre mantida. Decidir entre fixar e assumir, ou substituir."},"y":{"fr":"Le lecteur est ce qui rend un fonds numérisé consultable sans téléchargement. S'il tombe, ce n'est pas un confort qui disparaît, c'est l'accès. Rien ne presse aujourd'hui — mais il vaut mieux savoir.","pt":"O leitor é o que torna um acervo digitalizado consultável sem download. Se cair, não é um conforto que desaparece, é o acesso. Nada urge hoje — mas é melhor saber."},"f":{"fr":["Un verdict écrit : conserver et épingler, ou remplacer par quoi.","Si conservation : un test qui vérifie l'ouverture d'un EPUB réel."],"pt":["Um veredicto escrito: conservar e fixar, ou substituir por quê.","Se conservação: um teste que verifica a abertura de um EPUB real."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["package.json","Relevé du 29/08/2026"]},{"id":"E1","d":"E","p":"P1","s":"ouvert","e":"M","sk":["aucune","front"],"t":{"fr":"Faire auditer l'accessibilité par quelqu'un qui n'a pas écrit le code","pt":"Fazer auditar a acessibilidade por alguém que não escreveu o código"},"v":{"fr":"Des fonctionnalités d'accessibilité sont implémentées : panneau de réglages sur toutes les pages depuis le 26/08, `html lang` qui suit la langue affichée (WCAG 3.1.1) avec son test, champs à 16 px minimum, cibles tactiles à 44 px, `viewport-fit=cover`. **Aucun audit d'accessibilité indépendant n'a jamais été mené.**","pt":"Funcionalidades de acessibilidade estão implementadas: painel de ajustes em todas as páginas desde 26/08, `html lang` que segue a língua exibida (WCAG 3.1.1) com seu teste, campos de 16 px no mínimo, alvos táteis de 44 px, `viewport-fit=cover`. **Nenhuma auditoria de acessibilidade independente foi jamais conduzida.**"},"w":{"fr":"Faire parcourir les parcours principaux — chercher, ouvrir une notice, réserver, s'inscrire — par une personne qui utilise un lecteur d'écran ou une navigation au clavier seul, et écrire ce qui bloque.","pt":"Fazer percorrer os percursos principais — buscar, abrir um registro, reservar, cadastrar-se — por uma pessoa que use um leitor de tela ou navegação só por teclado, e escrever o que trava."},"y":{"fr":"« Implémenté » et « audité » ne sont pas le même mot, et les confondre est la faute la plus facile à commettre dans une présentation publique. Dire les deux, toujours : des fonctionnalités existent, personne d'extérieur ne les a éprouvées.","pt":"«Implementado» e «auditado» não são a mesma palavra, e confundi-los é a falta mais fácil de cometer numa apresentação pública. Dizer os dois, sempre: funcionalidades existem, ninguém de fora as testou."},"f":{"fr":["Un parcours complet a été fait au lecteur d'écran, avec un compte rendu écrit.","Les blocages sont dans le backlog avec leur écran.","Le discours public dit désormais « implémenté et audité par X », ou continue de dire les deux séparément."],"pt":["Um percurso completo foi feito com leitor de tela, com relatório escrito.","Os travamentos estão no backlog com sua tela.","O discurso público passa a dizer «implementado e auditado por X», ou continua dizendo os dois separadamente."]},"dep":{"fr":"**Entrée sans compétence technique** pour la partie parcours.","pt":"**Entrada sem competência técnica** para a parte de percurso."},"r":["Mémoire de projet, 25/08/2026","Commits 69af3cf5, df472bed"]},{"id":"E2","d":"E","p":"P1","s":"ouvert","e":"M","sk":["langue"],"t":{"fr":"Trancher les conventions néerlandaise et grecque","pt":"Decidir as convenções neerlandesa e grega"},"v":{"fr":"Les dix locales sont à parité stricte de clés — 6 177 chacune, vérifiée en intégration continue depuis le 27/08. Mais les **conventions** de deux d'entre elles ne sont pas tranchées : le néerlandais est à l'état de brouillon, le grec reste à définir. Le test de parité ne voit pas ça : il compte les clés, pas leur justesse.","pt":"As dez locales estão em paridade estrita de chaves — 6 177 cada uma, verificada na integração contínua desde 27/08. Mas as **convenções** de duas delas não estão decididas: o neerlandês está em estado de rascunho, o grego resta a definir. O teste de paridade não vê isso: conta as chaves, não a justeza delas."},"w":{"fr":"Une locutrice ou un locuteur natif reprend la charte de langage inclusif, décide de la forme neutre pour sa langue, et relit les 6 177 chaînes en priorité sur les écrans les plus vus.","pt":"Uma falante ou um falante nativo retoma a carta de linguagem inclusiva, decide a forma neutra para sua língua, e revisa as 6 177 cadeias com prioridade nas telas mais vistas."},"y":{"fr":"Deux langues qui cessent d'être des traductions approximatives. C'est un des trois chantiers qui **ne demandent aucune compétence technique** — et le seul que personne d'autre ne peut faire à la place.","pt":"Duas línguas que deixam de ser traduções aproximativas. É um dos três canteiros que **não exigem nenhuma competência técnica** — e o único que ninguém mais pode fazer no lugar."},"f":{"fr":["Les conventions `nl` et `el` sont écrites dans `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","Les chaînes des écrans principaux sont relues.","La liste néerlandaise est déjà partie chez Ludwig — le suivi en fait partie."],"pt":["As convenções `nl` e `el` estão escritas em `docs/notes-audit/anarbib-charte-langage-inclusif-v2-*.md`.","As cadeias das telas principais estão revisadas.","A lista neerlandesa já foi enviada a Ludwig — o acompanhamento faz parte."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["docs/CHANTIERS_OUVERTS.md §5","docs/notes-audit/anarbib-charte-langage-inclusif-v2.md"]},{"id":"E3","d":"E","p":"P2","s":"decision","e":"M","sk":["langue","collectif"],"t":{"fr":"Uniformiser le registre d'adresse entre les dix locales","pt":"Uniformizar o registro de tratamento entre as dez locales"},"v":{"fr":"`DOC-ADDR-1` fixe le tutoiement comme registre de l'interface. En pratique, **`nl` et `el` tutoient, les huit autres vouvoient**. L'écart est documenté et assumé comme « un chantier à décider, pas à subir au détour d'un correctif ».","pt":"`DOC-ADDR-1` fixa o tratamento informal como registro da interface. Na prática, **`nl` e `el` tratam por «tu», as outras oito por «você» formal**. A divergência está documentada e assumida como «um canteiro a decidir, não a sofrer de passagem numa correção»."},"w":{"fr":"Décider une fois pour les dix, en tenant compte du fait que la valeur politique du tutoiement n'est pas la même dans chaque langue, puis passer les locales concernées en une seule opération.","pt":"Decidir uma vez para as dez, levando em conta que o valor político do tratamento informal não é o mesmo em cada língua, depois passar as locales envolvidas numa única operação."},"y":{"fr":"AnarBib propose à d'autres catalogues des conventions d'interopérabilité, dont l'une dit explicitement que le vocabulaire commun n'impose pas l'écriture inclusive de chacun. **La cohérence interne se règle avant de prêcher la convention.**","pt":"O AnarBib propõe a outros catálogos convenções de interoperabilidade, uma das quais diz explicitamente que o vocabulário comum não impõe a escrita inclusiva de cada um. **A coerência interna se resolve antes de pregar a convenção.**"},"f":{"fr":["Une décision au REGISTRE, avec la raison.","Les dix locales appliquent le même registre, ou l'écart est justifié langue par langue."],"pt":["Uma decisão no REGISTRO, com o motivo.","As dez locales aplicam o mesmo registro, ou a divergência é justificada língua por língua."]},"dep":{"fr":"À faire après **E2** (les conventions décident du registre).","pt":"A fazer depois de **E2** (as convenções decidem o registro)."},"r":["REGISTRE §0 DOC-ADDR-1","VERIF_confidentialite_tiers_2026-08-20"]},{"id":"E4","d":"E","p":"P2","s":"ouvert","e":"S","sk":["langue"],"t":{"fr":"Régler les paires irrégulières de l'italien","pt":"Resolver os pares irregulares do italiano"},"v":{"fr":"`it.json` n'est pas conforme à la convention de l'astérisque final : les paires irrégulières comme `lettore` / `lettrice` ne se réduisent pas à `lettor*`. Le test de charte vérifie une seule chose sur l'italien — que `camerata` et `camerati` n'y figurent jamais, terme fasciste, échec dur — et rien d'autre.","pt":"`it.json` não está conforme à convenção do asterisco final: os pares irregulares como `lettore` / `lettrice` não se reduzem a `lettor*`. O teste de carta verifica uma só coisa no italiano — que `camerata` e `camerati` nunca apareçam, termo fascista, falha dura — e nada mais."},"w":{"fr":"Décider du traitement des paires irrégulières avec un locuteur natif, puis l'appliquer aux chaînes concernées. C'est un travail de langue, pas de code.","pt":"Decidir o tratamento dos pares irregulares com um falante nativo, depois aplicá-lo às cadeias envolvidas. É um trabalho de língua, não de código."},"y":{"fr":"L'italien est la langue de la présentation de Bologne. Une interface qui applique sa convention à moitié se voit à l'écran partagé.","pt":"O italiano é a língua da apresentação de Bolonha. Uma interface que aplica sua convenção pela metade se vê na tela compartilhada."},"f":{"fr":["Le traitement des paires irrégulières est écrit dans la charte italienne.","Les chaînes concernées sont corrigées.","Les trois chaînes restées en français dans l'interface italienne sont traduites (716 chaînes vues, 3 fautives)."],"pt":["O tratamento dos pares irregulares está escrito na carta italiana.","As cadeias envolvidas estão corrigidas.","As três cadeias que ficaram em francês na interface italiana estão traduzidas (716 cadeias vistas, 3 defeituosas)."]},"dep":{"fr":"Avant le 08/09 si possible, sinon octobre.","pt":"Antes de 08/09 se possível, senão outubro."},"r":["CLAUDE.md, piège connu n°9","CALENDRIER_bologne_2026-08-27"]},{"id":"E5","d":"E","p":"P2","s":"ouvert","e":"S","sk":["front"],"t":{"fr":"Relayer les tuiles OpenStreetMap par le serveur","pt":"Retransmitir os ladrilhos OpenStreetMap pelo servidor"},"v":{"fr":"C'est la **seule exception anti-pistage restante** : les tuiles de `tile.openstreetmap.org` sont chargées par le navigateur de la visiteuse, qui livre donc son adresse IP à un tiers. L'intention de relayer est **déjà annoncée publiquement** dans la clé `privacy.s6.maptiles` des dix locales.","pt":"É a **única exceção antirrastreamento restante**: os ladrilhos de `tile.openstreetmap.org` são carregados pelo navegador da visitante, que entrega portanto seu endereço IP a um terceiro. A intenção de retransmitir já está **anunciada publicamente** na chave `privacy.s6.maptiles` das dez locales."},"w":{"fr":"Reprendre le modèle déjà en place pour Nominatim : un relais côté serveur, avec cache, et l'adresse du relais dans la configuration du front.","pt":"Retomar o modelo já em vigor para o Nominatim: um relé do lado servidor, com cache, e o endereço do relé na configuração do front."},"y":{"fr":"La règle de conformité du projet est écrite et générale : **toute dépendance qui reçoit une adresse IP de visiteuse doit être déclarée, y compris quand elle n'est pas un sous-traitant au sens du RGPD.** Le raisonnement inverse est précisément ce qui avait laissé Turnstile invisible pendant des mois. Ici la dépendance est déclarée — il reste à la supprimer, comme annoncé.","pt":"A regra de conformidade do projeto está escrita e é geral: **toda dependência que recebe um endereço IP de visitante deve ser declarada, mesmo quando não é um operador no sentido do RGPD.** O raciocínio inverso é precisamente o que deixara o Turnstile invisível durante meses. Aqui a dependência está declarada — falta suprimi-la, como anunciado."},"f":{"fr":["Aucune requête ne part du navigateur vers un domaine tiers sur les pages de carte.","La clé `privacy.s6.maptiles` est mise à jour dans les dix locales pour décrire le nouvel état."],"pt":["Nenhuma requisição sai do navegador para um domínio de terceiro nas páginas de mapa.","A chave `privacy.s6.maptiles` é atualizada nas dez locales para descrever o novo estado."]},"dep":{"fr":"Plus simple après **I2** (pile auto-hébergée), mais faisable avant.","pt":"Mais simples depois de **I2** (pilha auto-hospedada), mas viável antes."},"r":["VERIF_confidentialite_tiers_2026-08-20","PLAN_DE_MARCHE §8","scripts/nominatim/"]},{"id":"E6","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Découper les cinq écrans qui pèsent plus de cent kilooctets","pt":"Dividir as cinco telas que pesam mais de cem quilobytes"},"v":{"fr":"`BookDraftForm.jsx` fait **197 Ko**, `BibliotecaPage.jsx` 184 Ko, `AccountPage.jsx` 154 Ko, `PanelPage.jsx` 114 Ko, `ImportacoesPage.jsx` 109 Ko. 29 des 38 routes sont déjà en chargement paresseux, et `vite.config.js` déclare quatre lots de dépendances — le problème n'est pas le chargement initial, c'est la taille d'un fichier unique.","pt":"`BookDraftForm.jsx` tem **197 KB**, `BibliotecaPage.jsx` 184 KB, `AccountPage.jsx` 154 KB, `PanelPage.jsx` 114 KB, `ImportacoesPage.jsx` 109 KB. 29 das 38 rotas já estão em carregamento preguiçoso, e `vite.config.js` declara quatro lotes de dependências — o problema não é o carregamento inicial, é o tamanho de um arquivo único."},"w":{"fr":"Extraire les sous-formulaires et les onglets en composants séparés, sans changer le comportement. Commencer par `BookDraftForm`, le plus gros et le plus édité.","pt":"Extrair os subformulários e as abas em componentes separados, sem mudar o comportamento. Começar por `BookDraftForm`, o maior e o mais editado."},"y":{"fr":"Un fichier de 197 Ko n'est pas relisible par quelqu'un qui arrive, et deux personnes ne peuvent pas y travailler en même temps sans conflit. C'est un obstacle à la contribution avant d'être un problème de performance.","pt":"Um arquivo de 197 KB não é relegível por quem chega, e duas pessoas não podem trabalhar nele ao mesmo tempo sem conflito. É um obstáculo à contribuição antes de ser um problema de performance."},"f":{"fr":["Aucun fichier de `src/` ne dépasse 60 Ko.","Le comportement est inchangé, vérifié écran par écran.","Découpage par lots, un écran à la fois, jamais une refonte."],"pt":["Nenhum arquivo de `src/` passa de 60 KB.","O comportamento está inalterado, verificado tela por tela.","Divisão por lotes, uma tela por vez, nunca uma refundação."]},"dep":{"fr":"Reprend `#PERF-accountpage-split`, hérité du v32.","pt":"Retoma `#PERF-accountpage-split`, herdado do v32."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.5","Relevé du 29/08/2026"]},{"id":"E7","d":"E","p":"P2","s":"ouvert","e":"S","sk":["front"],"t":{"fr":"Corriger le titre de page qui ne suit pas la navigation","pt":"Corrigir o título de página que não segue a navegação"},"v":{"fr":"`document.title` ne se met pas à jour lors d'une navigation dans l'application ; il ne change qu'au rechargement complet de la page.","pt":"`document.title` não se atualiza durante uma navegação dentro do aplicativo; só muda no recarregamento completo da página."},"w":{"fr":"Poser le titre à chaque changement de route, à partir des clés i18n existantes.","pt":"Definir o título a cada mudança de rota, a partir das chaves i18n existentes."},"y":{"fr":"Le titre de page est ce que lisent les lecteurs d'écran à l'arrivée, ce qui s'inscrit dans l'historique du navigateur, et ce qui apparaît dans un onglet épinglé. Un titre figé rend les trois inutilisables.","pt":"O título de página é o que os leitores de tela leem na chegada, o que se inscreve no histórico do navegador, e o que aparece numa aba fixada. Um título congelado torna os três inutilizáveis."},"f":{"fr":["Le titre suit la route, dans les dix langues.","Un test le vérifie, sur le modèle de `documentLanguage.test.js`."],"pt":["O título segue a rota, nas dez línguas.","Um teste o verifica, no modelo de `documentLanguage.test.js`."]},"dep":{"fr":"Complément naturel de **E1**.","pt":"Complemento natural de **E1**."},"r":["Mémoire de projet, dette technique"]},{"id":"E8","d":"E","p":"P2","s":"ouvert","e":"S","sk":["front"],"t":{"fr":"Charger les deux polices sans bloquer l'affichage","pt":"Carregar as duas fontes sem bloquear a exibição"},"v":{"fr":"`titre.ttf` pèse 1 Mo et `accent.ttf` 484 Ko ; les deux sont chargées sans préchargement déclaré, sans `font-display: swap`, et sans `preconnect` vers Supabase.","pt":"`titre.ttf` pesa 1 MB e `accent.ttf` 484 KB; as duas são carregadas sem pré-carregamento declarado, sem `font-display: swap`, e sem `preconnect` para o Supabase."},"w":{"fr":"Ajouter `font-display: swap`, précharger la police de titre seule, sous-ensembler les fichiers aux caractères réellement utilisés — dix langues dont le grec, donc le sous-ensemble n'est pas trivial.","pt":"Adicionar `font-display: swap`, pré-carregar apenas a fonte de título, subconjuntar os arquivos aos caracteres realmente usados — dez línguas incluindo o grego, então o subconjunto não é trivial."},"y":{"fr":"1,5 Mo de polices sur une connexion de comptoir, c'est plusieurs secondes d'écran blanc. Le public d'AnarBib inclut des bibliothèques qui n'ont pas la fibre.","pt":"1,5 MB de fontes numa conexão de balcão são vários segundos de tela branca. O público do AnarBib inclui bibliotecas que não têm fibra."},"f":{"fr":["Le texte s'affiche avant les polices, avec une substitution acceptable.","Le poids total des polices chargées à la première visite est mesuré avant et après."],"pt":["O texto aparece antes das fontes, com uma substituição aceitável.","O peso total das fontes carregadas na primeira visita é medido antes e depois."]},"dep":{"fr":"Ne pas toucher à l'identité visuelle : `IDENT-1` à `IDENT-4` sont actés.","pt":"Não tocar na identidade visual: `IDENT-1` a `IDENT-4` estão registrados."},"r":["Mémoire de projet, dette technique","REGISTRE §39 IDENT"]},{"id":"E9","d":"E","p":"P2","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Finir la mise en page mobile : trois lots identifiés","pt":"Terminar o layout móvel: três lotes identificados"},"v":{"fr":"Les phases A, B et C sont livrées et la doctrine graduée est actée. Trois questions restent ouvertes au REGISTRE : `MOB-Q1` (24 grilles déclarées en ligne dans le JSX avec des pistes `fr` nues), `MOB-Q2` (20 requêtes de média héritées à rapatrier dans `src/styles/mobile.css`), `MOB-Q3` (les onglets Validações et Inventário à convertir en cartes).","pt":"As fases A, B e C estão entregues e a doutrina graduada está registrada. Três questões continuam abertas no REGISTRO: `MOB-Q1` (24 grades declaradas em linha no JSX com trilhas `fr` nuas), `MOB-Q2` (20 media queries herdadas a repatriar em `src/styles/mobile.css`), `MOB-Q3` (as abas Validações e Inventário a converter em cartões)."},"w":{"fr":"Trois passes mécaniques, dans cet ordre de valeur : les 24 grilles (`minmax(0, Nfr)` partout, c'est la règle `MOB-1`), les deux onglets en cartes selon le patron livré, puis le rapatriement des requêtes de média.","pt":"Três passagens mecânicas, nesta ordem de valor: as 24 grades (`minmax(0, Nfr)` em toda parte, é a regra `MOB-1`), as duas abas em cartões segundo o padrão entregue, depois o repatriamento das media queries."},"y":{"fr":"Une piste `fr` nue déborde dès que son contenu est plus large que la colonne, et un débordement **se constate par la mesure, jamais à l'œil** (`MOB-9`). Les 24 grilles sont autant de débordements en attente d'un titre long.","pt":"Uma trilha `fr` nua transborda assim que seu conteúdo é mais largo que a coluna, e um transbordamento **se constata pela medida, nunca a olho** (`MOB-9`). As 24 grades são outros tantos transbordamentos à espera de um título longo."},"f":{"fr":["Aucune grille du JSX ne porte de piste `fr` nue.","Les deux onglets sont en cartes sous 640 px.","Les requêtes de média héritées vivent dans `mobile.css`."],"pt":["Nenhuma grade do JSX traz trilha `fr` nua.","As duas abas estão em cartões abaixo de 640 px.","As media queries herdadas vivem em `mobile.css`."]},"dep":{"fr":"Aucune. Chantier découpable en trois.","pt":"Nenhuma. Canteiro divisível em três."},"r":["REGISTRE §36 MOB-Q1..Q3"]},{"id":"E10","d":"E","p":"P3","s":"ouvert","e":"M","sk":["front"],"t":{"fr":"Le reste du socle terrain : permanence mobile, notification poussée, planche de codes","pt":"O resto da base de campo: plantão móvel, notificação push, prancha de códigos"},"v":{"fr":"Le socle terrain est livré : application installable, lecture de codes QR et ISBN, récolement, mise en page adaptative. Trois éléments restent, hérités du v32 et non revérifiés depuis : la permanence mobile (P3), la notification poussée (P5), et la planche de codes QR au format A4.","pt":"A base de campo está entregue: aplicativo instalável, leitura de códigos QR e ISBN, inventário, layout adaptativo. Três elementos restam, herdados do v32 e não reverificados desde então: o plantão móvel (P3), a notificação push (P5), e a prancha de códigos QR em formato A4."},"w":{"fr":"Commencer par vérifier lequel des trois est encore un manque réel. La notification poussée pose une question de fond avant une question de code : elle suppose un service tiers, ce que la doctrine anti-pistage regarde de près.","pt":"Começar verificando qual dos três ainda é uma falta real. A notificação push levanta uma questão de fundo antes de uma questão de código: pressupõe um serviço de terceiro, o que a doutrina antirrastreamento examina de perto."},"y":{"fr":"La planche A4 est la plus simple et la plus utile au comptoir : elle permet d'étiqueter un fonds sans imprimante à étiquettes. Les deux autres méritent d'abord une conversation.","pt":"A prancha A4 é a mais simples e a mais útil no balcão: permite etiquetar um acervo sem impressora de etiquetas. As outras duas merecem primeiro uma conversa."},"f":{"fr":["La planche A4 existe et s'imprime correctement.","Pour la notification poussée, un verdict écrit : faisable sans tiers, ou renoncement assumé."],"pt":["A prancha A4 existe e imprime corretamente.","Para a notificação push, um veredicto escrito: viável sem terceiro, ou renúncia assumida."]},"dep":{"fr":"Hérité de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`.","pt":"Herdado de `#MOBILE P3`, `#MOBILE P5`, `#MOB-QR-A4`."},"r":["AnarBib-Backlog-2026-06-17-v33 §2.1"]},{"id":"E11","d":"E","p":"P3","s":"decision","e":"S","sk":["collectif","front"],"t":{"fr":"Les deux différés assumés de l'OPAC : tags contributifs et flux RSS","pt":"Os dois adiamentos assumidos do OPAC: tags contributivas e feed RSS"},"v":{"fr":"`#OPAC5` (folksonomie, tags posés par les lectrices) est bloqué sur une décision de communauté et de vie privée. `#OPAC11` (flux RSS de recherche) est différé pour raison anti-pistage. Les deux sont ouverts depuis mai et n'ont jamais été instruits.","pt":"`#OPAC5` (folksonomia, tags postas pelas leitoras) está bloqueado numa decisão de comunidade e de privacidade. `#OPAC11` (feed RSS de busca) está adiado por razão antirrastreamento. Os dois estão abertos desde maio e nunca foram instruídos."},"w":{"fr":"Les instruire une bonne fois : qu'est-ce qu'un tag public révèle de qui l'a posé, et qu'est-ce qu'un flux RSS révèle de qui le suit ? Puis trancher, ou fermer.","pt":"Instruí-los de uma vez: o que uma tag pública revela sobre quem a pôs, e o que um feed RSS revela sobre quem o segue? Depois decidir, ou fechar."},"y":{"fr":"Un item différé sans instruction reste à l'ordre du jour de chaque relecture et coûte de l'attention à chaque fois. Fermer un item est une décision aussi valable que le livrer.","pt":"Um item adiado sem instrução continua na pauta de cada releitura e custa atenção a cada vez. Fechar um item é uma decisão tão válida quanto entregá-lo."},"f":{"fr":["Les deux ont un verdict au REGISTRE : livré, ou fermé avec la raison.","`OPAC-RSS1` est mis à jour en conséquence."],"pt":["Os dois têm um veredicto no REGISTRO: entregue, ou fechado com o motivo.","`OPAC-RSS1` é atualizado em consequência."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["REGISTRE §18 OPAC-RSS1","AnarBib-Backlog-2026-06-17-v33 §2.4"]},{"id":"F1","d":"F","p":"P1","s":"ouvert","e":"M","sk":["deno","sql"],"t":{"fr":"Auditer la chaîne de courriel de bout en bout","pt":"Auditar a cadeia de e-mail de ponta a ponta"},"v":{"fr":"**14 fonctions `notify-*` déployées**, cinq files d'attente, six déclencheurs de dépêche. Trois files n'ont jamais reçu la moindre insertion : `authority_proposal_notification_outbox`, `membership_expiry_notifications`, `painel_internal_task_invitation_outbox`. Une quatrième, `painel_internal_task_notification_outbox`, est vide après 34 insertions dont la dernière date du 04/06. Personne n'a jamais audité l'ensemble.","pt":"**14 funções `notify-*` implantadas**, cinco filas, seis gatilhos de despacho. Três filas nunca receberam uma única inserção: `authority_proposal_notification_outbox`, `membership_expiry_notifications`, `painel_internal_task_invitation_outbox`. Uma quarta, `painel_internal_task_notification_outbox`, está vazia após 34 inserções cuja última é de 04/06. Ninguém jamais auditou o conjunto."},"w":{"fr":"Dresser la carte : pour chaque événement métier, quel déclencheur, quelle file, quelle fonction, quel gabarit, quelles dix langues. Puis marquer les branches mortes et les branches jamais empruntées.","pt":"Traçar o mapa: para cada evento de negócio, qual gatilho, qual fila, qual função, qual template, quais dez línguas. Depois marcar os ramos mortos e os ramos nunca percorridos."},"y":{"fr":"Une notification qui ne part pas ne fait aucun bruit. C'est le même angle mort que les sauvegardes, et il a déjà mordu deux fois : les mails `retirada_efetivada`, `retirada_reagendada`, `retirada_no_show` et `liberada_para_circulacao` ont été signalés comme ne partant pas, sans que le diagnostic soit mené à son terme.","pt":"Uma notificação que não sai não faz barulho nenhum. É o mesmo ponto cego dos backups, e já mordeu duas vezes: os e-mails `retirada_efetivada`, `retirada_reagendada`, `retirada_no_show` e `liberada_para_circulacao` foram apontados como não saindo, sem que o diagnóstico fosse levado a termo."},"f":{"fr":["Une carte écrite, événement par événement.","Les quatre mails signalés comme non partants ont un verdict : corrigés, ou expliqués.","Les branches mortes sont supprimées ou documentées comme dormantes."],"pt":["Um mapa escrito, evento por evento.","Os quatro e-mails apontados como não enviados têm um veredicto: corrigidos, ou explicados.","Os ramos mortos são suprimidos ou documentados como dormentes."]},"dep":{"fr":"Prérequis de **F2** et **F3**.","pt":"Pré-requisito de **F2** e **F3**."},"r":["Mémoire de projet, reliquats de la chaîne courriel","AUDITORIA_NOTIFY_FUNCTIONS_2026-05-06"]},{"id":"F2","d":"F","p":"P1","s":"ouvert","e":"S","sk":["deno"],"t":{"fr":"Corriger le gabarit des courriels d'alerte d'exploitation","pt":"Corrigir o template dos e-mails de alerta de operação"},"v":{"fr":"Les courriels d'alerte d'exploitation — sauvegarde en échec, incident de sonde — utilisent le gabarit destiné aux lectrices. Ils finissent donc par « contacte la bibliothèque » suivi d'un numéro de téléphone.","pt":"Os e-mails de alerta de operação — backup em falha, incidente de sonda — usam o template destinado às leitoras. Terminam portanto com «entre em contato com a biblioteca» seguido de um número de telefone."},"w":{"fr":"Un gabarit d'exploitation distinct : pas de pied de page destiné au public, la commande à lancer, et le lien vers la section du runbook.","pt":"Um template de operação distinto: sem rodapé destinado ao público, o comando a executar, e o link para a seção do runbook."},"y":{"fr":"**À corriger avant qu'un second administrateur réseau existe.** Aujourd'hui une seule personne reçoit ces alertes et sait les lire ; le jour où **A1** aboutit, elles partent à quelqu'un qui découvrira un courriel d'incident lui conseillant d'appeler la bibliothèque.","pt":"**A corrigir antes que um segundo administrador de rede exista.** Hoje uma só pessoa recebe esses alertas e sabe lê-los; no dia em que **A1** for concluído, eles chegarão a alguém que descobrirá um e-mail de incidente aconselhando a ligar para a biblioteca."},"f":{"fr":["Un gabarit d'exploitation existe, distinct du gabarit lectrice.","Une alerte de test a été reçue et relue par quelqu'un qui n'a pas écrit le code."],"pt":["Um template de operação existe, distinto do template de leitora.","Um alerta de teste foi recebido e relido por alguém que não escreveu o código."]},"dep":{"fr":"Doit précéder l'aboutissement de **A1**.","pt":"Deve preceder a conclusão de **A1**."},"r":["RUNBOOK_exploitation_v0.3 §7","PLAN_DE_MARCHE §8"]},{"id":"F3","d":"F","p":"P2","s":"ouvert","e":"M","sk":["deno"],"t":{"fr":"Consolider les fonctions de notification redondantes","pt":"Consolidar as funções de notificação redundantes"},"v":{"fr":"Quatre fonctions font des récapitulatifs : `notify-weekly-report`, `notify-network-weekly-report`, `notify-cross-library-digest`, `notify-rede-digest`. Trois fonctions servent des documents : `read-pdf`, `read-digital-asset`, `read-ill-shared-asset`. Deux exportent des lots : `export-catalog-lote`, `export-fonds-bundle`. Et `mail-i18n-test`, fonction de test, est déployée en production en version 1553.","pt":"Quatro funções fazem resumos: `notify-weekly-report`, `notify-network-weekly-report`, `notify-cross-library-digest`, `notify-rede-digest`. Três funções servem documentos: `read-pdf`, `read-digital-asset`, `read-ill-shared-asset`. Duas exportam lotes: `export-catalog-lote`, `export-fonds-bundle`. E `mail-i18n-test`, função de teste, está implantada em produção na versão 1553."},"w":{"fr":"Vérifier ce que chacune fait vraiment avant de conclure à la redondance — elles ont probablement des destinataires et des portées différentes. Puis fusionner ce qui doit l'être, et retirer `mail-i18n-test` de la production.","pt":"Verificar o que cada uma faz de fato antes de concluir pela redundância — provavelmente têm destinatários e alcances diferentes. Depois fundir o que deve sê-lo, e retirar `mail-i18n-test` da produção."},"y":{"fr":"48 fonctions déployées, c'est beaucoup à maintenir pour un projet à un mainteneur. Chacune porte son propre gabarit, ses propres dix langues, ses propres secrets. Ce n'est pas un problème de performance, c'est un problème de surface à relire.","pt":"48 funções implantadas é muito para manter num projeto com um mantenedor. Cada uma carrega seu próprio template, suas próprias dez línguas, seus próprios segredos. Não é um problema de performance, é um problema de superfície a revisar."},"f":{"fr":["Chaque groupe a un verdict : fusion, ou raison écrite de la séparation.","`mail-i18n-test` n'est plus déployée en production.","Le compte de fonctions déployées est à jour dans `CLAUDE.md` et dans `config.toml`."],"pt":["Cada grupo tem um veredicto: fusão, ou motivo escrito da separação.","`mail-i18n-test` não está mais implantada em produção.","A contagem de funções implantadas está atualizada em `CLAUDE.md` e em `config.toml`."]},"dep":{"fr":"Après **F1**. Attention : le déploiement de `notify-event` ne passe pas par MCP, son paquet est trop gros.","pt":"Depois de **F1**. Atenção: a implantação de `notify-event` não passa por MCP, seu pacote é grande demais."},"r":["PLAN_DE_MARCHE §8","Relevé du 29/08/2026"]},{"id":"F4","d":"F","p":"P2","s":"a-verifier","e":"S","sk":["sql"],"t":{"fr":"Vérifier les rappels d'échéance et les relances de retard","pt":"Verificar os lembretes de vencimento e as cobranças de atraso"},"v":{"fr":"`spec-flux-emprunts.md` §10.2 prévoit des rappels à J-5, J-3 et le jour même, puis des relances à J+1, J+7 et J+30. **Aucun job dédié n'est identifiable** parmi les 36 crons ; le seul voisin est `anarbib-notify-mid-loan-reading-daily`, qui fait autre chose. `membership_expiry_notifications` n'a jamais reçu la moindre ligne.","pt":"`spec-flux-emprunts.md` §10.2 prevê lembretes em D-5, D-3 e no próprio dia, depois cobranças em D+1, D+7 e D+30. **Nenhum job dedicado é identificável** entre os 36 crons; o único vizinho é `anarbib-notify-mid-loan-reading-daily`, que faz outra coisa."},"w":{"fr":"Vérifier en base si les rappels partent par un autre chemin, et sinon, décider : les implémenter, ou amender la spec. Un emprunt en retard qui ne déclenche rien est un emprunt que personne ne réclame.","pt":"Verificar no banco se os lembretes saem por outro caminho, e senão, decidir: implementá-los, ou emendar a spec. Um empréstimo atrasado que não dispara nada é um empréstimo que ninguém cobra."},"y":{"fr":"Le suivi de huit semaines de la formation BLMF prévoit qu'une consulta soit menée de bout en bout avec négociation réelle : c'est le moment où l'absence de rappel se verra. Autant le savoir avant.","pt":"O acompanhamento de oito semanas da formação BLMF prevê que uma consulta seja conduzida de ponta a ponta com negociação real: é o momento em que a ausência de lembrete aparecerá. Melhor saber antes."},"f":{"fr":["Un verdict écrit : les rappels existent par tel chemin, ou ils n'existent pas.","Si absents : soit implémentés, soit la spec amendée."],"pt":["Um veredicto escrito: os lembretes existem por tal caminho, ou não existem.","Se ausentes: ou implementados, ou a spec emendada."]},"dep":{"fr":"Se vérifie en même temps que **F1**.","pt":"Verifica-se ao mesmo tempo que **F1**."},"r":["spec-flux-emprunts.md §10.2","VERIF_etat_reel_gouvernance_et_crons_2026-08-26 §3","PLAN_formation_coordination_BLMF §5"]},{"id":"F5","d":"F","p":"P2","s":"a-verifier","e":"S","sk":["sql"],"t":{"fr":"Vérifier que le délai de négociation de 21 jours est bien appliqué","pt":"Verificar se o prazo de negociação de 21 dias está de fato aplicado"},"v":{"fr":"Le cron `anarbib-reservation-expire-negotiation` tourne toutes les heures (`25 * * * *`) — alors que la spec de réservation v2 donnait ce délai comme **non implémenté**. Le mécanisme existe donc ; ce qu'il fait exactement n'a pas été vérifié.","pt":"O cron `anarbib-reservation-expire-negotiation` roda a cada hora (`25 * * * *`) — enquanto a spec de reserva v2 dava esse prazo como **não implementado**. O mecanismo existe portanto; o que ele faz exatamente não foi verificado."},"w":{"fr":"Lire `fn_expire_negotiation_timeout()`, vérifier le délai qu'elle applique, et corriger la spec ou la fonction selon ce qu'on trouve.","pt":"Ler `fn_expire_negotiation_timeout()`, verificar o prazo que aplica, e corrigir a spec ou a função conforme o que se encontrar."},"y":{"fr":"Un écart du même type a déjà été trouvé : la spec et le support de formation annonçaient une expiration des réservations toutes les six heures, alors que le cron tourne **toutes les heures**. Le support a été corrigé, la spec pas forcément.","pt":"Um desvio do mesmo tipo já foi encontrado: a spec e o material de formação anunciavam uma expiração das reservas a cada seis horas, enquanto o cron roda **a cada hora**. O material foi corrigido, a spec não necessariamente."},"f":{"fr":["Le délai réel est écrit dans la spec.","Les fréquences annoncées dans les supports de formation correspondent aux crons réels."],"pt":["O prazo real está escrito na spec.","As frequências anunciadas nos materiais de formação correspondem aos crons reais."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["VERIF_etat_reel_gouvernance_et_crons_2026-08-26 §3","spec-workflow-reservation-v2-negotiation.md"]},{"id":"G1","d":"G","p":"P0","s":"ouvert","e":"L","sk":["collectif","aucune"],"t":{"fr":"Emprunter les circuits construits et jamais utilisés","pt":"Percorrer os circuitos construídos e jamais usados"},"v":{"fr":"Vérifié le 29/08 : **62 tables métier n'ont jamais reçu la moindre insertion.** Sept blocs entiers sont concernés — assemblées du réseau (3 tables), notes de lecture (2), propositions et objections d'autorité (3), référentiels de catalogage `catalog_ref_*` (8 sur 9), gouvernance des profils de bibliothèque (4, **alors que deux crons tournent dessus toutes les quinze minutes**), délibération sur les demandes d'adhésion (5, dont `library_request_votes` et `library_request_messages`).","pt":"Verificado em 29/08: **62 tabelas de negócio nunca receberam uma única inserção.** Sete blocos inteiros são atingidos — assembleias da rede (3 tabelas), notas de leitura (2), propostas e objeções de autoridade (3), referenciais de catalogação `catalog_ref_*` (8 de 9), governança dos perfis de biblioteca (4, **enquanto dois crons rodam sobre elas a cada quinze minutos**), deliberação sobre os pedidos de adesão (5, incluindo `library_request_votes` e `library_request_messages`)."},"w":{"fr":"Choisir un bloc et l'emprunter pour de vrai, du premier geste au dernier : tenir une assemblée du réseau, déposer une note de lecture, proposer une autorité et laisser quelqu'un objecter, faire délibérer une demande d'adhésion. Consigner ce qui manque, ce qui surprend, ce qui bloque.","pt":"Escolher um bloco e percorrê-lo de verdade, do primeiro ao último gesto: realizar uma assembleia da rede, depositar uma nota de leitura, propor uma autoridade e deixar alguém objetar, fazer deliberar um pedido de adesão. Registrar o que falta, o que surpreende, o que trava."},"y":{"fr":"C'est le principal enseignement du relevé du 29 août, et il ne figure dans aucun document du corpus. **Le projet ne souffre pas d'un manque de fonctionnalités : il souffre d'un manque d'usage.** Un circuit jamais emprunté n'est pas livré — il est seulement écrit. Et le jour où il devient le chemin critique, comme le circuit d'invitation vient de le devenir pour les promotions, il casse sur des choses qu'un seul passage aurait révélées.","pt":"É o principal ensinamento do levantamento de 29 de agosto, e não consta em nenhum documento do corpus. **O projeto não sofre de falta de funcionalidades: sofre de falta de uso.** Um circuito jamais percorrido não está entregue — está apenas escrito. E no dia em que se torna o caminho crítico, como o circuito de convite acaba de se tornar para as promoções, ele quebra em coisas que uma única passagem teria revelado."},"f":{"fr":["Au moins trois des sept blocs ont été empruntés de bout en bout, sur `blmf-teste` puis en réel.","Chaque passage a produit un compte rendu écrit de ce qui manque.","Les blocs dont l'usage n'est pas souhaité aujourd'hui sont marqués **dormants**, avec la raison — ce n'est pas un échec, c'est une information."],"pt":["Pelo menos três dos sete blocos foram percorridos de ponta a ponta, em `blmf-teste` e depois no real.","Cada passagem produziu um relatório escrito do que falta.","Os blocos cujo uso não é desejado hoje são marcados **dormentes**, com o motivo — não é um fracasso, é uma informação."]},"dep":{"fr":"Le bloc « assemblée » dépend de **A1**. Les autres non.","pt":"O bloco «assembleia» depende de **A1**. Os outros não."},"r":["Relevé du 29/08/2026","REGISTRE §32 AG, §28 ATE, §26 ONBO"]},{"id":"G2","d":"G","p":"P1","s":"decision","e":"S","sk":["collectif"],"t":{"fr":"Trancher politiquement l'écart entre P2 et P8 sur la promotion à coordenador·a","pt":"Decidir politicamente o desvio entre P2 e P8 sobre a promoção a coordenador·a"},"v":{"fr":"La migration `20260826120000` **est en production** et tranche dans le sens de P2 : collégialité obligatoire, ratification préalable, repli à une signature quand il n'y a qu'une seule personne coordinatrice, consentement explicite de la personne promue, exclusion de cette personne du décompte du quorum. **Mais la décision politique n'a jamais été prise.**","pt":"A migração `20260826120000` **está em produção** e decide no sentido de P2: colegialidade obrigatória, ratificação prévia, recuo a uma assinatura quando há uma só pessoa coordenadora, consentimento explícito da pessoa promovida, exclusão dessa pessoa da contagem do quórum. **Mas a decisão política nunca foi tomada.**"},"w":{"fr":"Porter la question au collectif. Trois options sont écrites : ne rien changer au code et corriger le texte de P2 ; étendre le chemin A comme le code l'a fait ; ou garder la promotion directe mais la rendre visible avec un délai d'objection.","pt":"Levar a questão ao coletivo. Três opções estão escritas: não mudar nada no código e corrigir o texto de P2; estender o caminho A como o código fez; ou manter a promoção direta mas torná-la visível com um prazo de objeção."},"y":{"fr":"Il y a aujourd'hui **du code en production qui anticipe une décision collective non prise**. Le rollback est écrit et testé, ce qui rend l'anticipation réversible — mais l'autre lecture, *le SIGB ne modélise pas l'assemblée générale*, reste entièrement défendable. **Ce n'est pas un arbitrage technique.**","pt":"Há hoje **código em produção que antecipa uma decisão coletiva não tomada**. O rollback está escrito e testado, o que torna a antecipação reversível — mas a outra leitura, *o SIGB não modela a assembleia geral*, continua inteiramente defensável. **Não é uma arbitragem técnica.**"},"f":{"fr":["Le collectif a tranché, et la décision est inscrite au REGISTRE.","Le code est aligné sur la décision, ou le texte de P2 est amendé.","Rappel : le fichier de rollback porte un tiret bas initial qui empêche la CLI de l'appliquer — **ne pas le renommer**."],"pt":["O coletivo decidiu, e a decisão está inscrita no REGISTRO.","O código está alinhado com a decisão, ou o texto de P2 é emendado.","Lembrete: o arquivo de rollback traz um sublinhado inicial que impede a CLI de aplicá-lo — **não renomeá-lo**."]},"dep":{"fr":"Question ouverte depuis le 26/08. Bloque **G3** si la réponse est « revenir en arrière ».","pt":"Questão aberta desde 26/08. Bloqueia **G3** se a resposta for «voltar atrás»."},"r":["ECART_cosignature_promotion_coordenador_2026-08-26 §5","REGISTRE §41 GOUV-1"]},{"id":"G3","d":"G","p":"P1","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Éprouver le circuit de promotion collégiale sur `blmf-teste`","pt":"Testar o circuito de promoção colegiada em `blmf-teste`"},"v":{"fr":"La migration est en production ; le runbook de déploiement en onze étapes est donc caduc. Ce qui reste est la **répétition en six pas sur `blmf-teste`**, jamais faite. Or `library_team_invitations` porte **zéro ligne** depuis sa création : le circuit que la migration rend obligatoire n'a jamais été emprunté une seule fois.","pt":"A migração está em produção; o runbook de implantação em onze etapas está portanto caduco. O que resta é o **ensaio em seis passos em `blmf-teste`**, nunca feito. Ora, `library_team_invitations` traz **zero linha** desde sua criação: o circuito que a migração torna obrigatório nunca foi percorrido uma única vez."},"w":{"fr":"Les six pas sur la bibliothèque d'essai `blmf-teste`, dont les courriels sont coupés (`email_delivery_mode = 'disabled'`). **Si un pas échoue, ne rien faire sur la BLMF.**","pt":"Os seis passos na biblioteca de teste `blmf-teste`, cujos e-mails estão cortados (`email_delivery_mode = 'disabled'`). **Se um passo falhar, não fazer nada na BLMF.**"},"y":{"fr":"Le réglage `team_admission_mode = 'cosignature'` de la BLMF **n'a jamais eu d'effet sur quoi que ce soit** : les treize promotions au rôle bibliothécaire et les cinq à la coordination sont toutes passées par la promotion directe. Le coût réel du choix retenu, écrit noir sur blanc, est que « le workflow d'invitation, jamais exercé, devient d'un coup le chemin critique ».","pt":"O ajuste `team_admission_mode = 'cosignature'` da BLMF **nunca teve efeito sobre nada**: as treze promoções ao papel de bibliotecário·a e as cinco à coordenação passaram todas pela promoção direta. O custo real da escolha adotada, escrito preto no branco, é que «o workflow de convite, jamais exercido, torna-se de repente o caminho crítico»."},"f":{"fr":["Les six pas sont passés sur `blmf-teste`, avec le résultat de chacun écrit.","Une promotion réelle a emprunté le circuit sur la BLMF.","Attention : `blmf-teste` **n'est pas une base séparée** — c'est une bibliothèque dans le même projet."],"pt":["Os seis passos foram feitos em `blmf-teste`, com o resultado de cada um escrito.","Uma promoção real percorreu o circuito na BLMF.","Atenção: `blmf-teste` **não é um banco separado** — é uma biblioteca no mesmo projeto."]},"dep":{"fr":"Dépend de **G2** si le collectif décide de revenir en arrière.","pt":"Depende de **G2** se o coletivo decidir voltar atrás."},"r":["RUNBOOK_deploiement_collegialite_coordenador_2026-08-26 étape 10","MIGRATION_collegialite_coordenador_2026-08-26"]},{"id":"G4","d":"G","p":"P1","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Exercer les quatre courriels d'équipe jamais envoyés","pt":"Exercer os quatro e-mails de equipe jamais enviados"},"v":{"fr":"Quatre courriels existent, sont câblés, et ne sont jamais passés en production : `team.self_demoted`, `team.suspended`, `team.removal_requested`, `team.inactive_warning_*`. Le mécanisme fonctionne — `team_notification_outbox` compte 21 envois et zéro échec — mais ces quatre-là n'ont jamais été déclenchés.","pt":"Quatro e-mails existem, estão ligados, e nunca passaram em produção: `team.self_demoted`, `team.suspended`, `team.removal_requested`, `team.inactive_warning_*`. O mecanismo funciona — `team_notification_outbox` conta 21 envios e zero falha — mas esses quatro nunca foram disparados."},"w":{"fr":"Provoquer chacun des quatre cas sur `blmf-teste`, lire le courriel reçu, vérifier qu'il dit ce qu'il doit dire dans les dix langues.","pt":"Provocar cada um dos quatro casos em `blmf-teste`, ler o e-mail recebido, verificar que diz o que deve dizer nas dez línguas."},"y":{"fr":"Ces courriels annoncent à quelqu'un qu'il perd un rôle, qu'il est suspendu, ou qu'on demande son retrait. Ce sont les messages les plus délicats du système, et personne ne les a jamais lus tels qu'ils arrivent. Les deux personnes en formation à la coordination BLMF seront les premières concernées.","pt":"Estes e-mails anunciam a alguém que perde um papel, que está suspenso, ou que se pede sua retirada. São as mensagens mais delicadas do sistema, e ninguém jamais as leu como chegam. As duas pessoas em formação para a coordenação BLMF serão as primeiras envolvidas."},"f":{"fr":["Les quatre courriels ont été reçus et relus.","Le ton et le contenu sont validés par quelqu'un qui n'a pas écrit les gabarits.","**D'abord sur `blmf-teste`, jamais directement sur la BLMF.**"],"pt":["Os quatro e-mails foram recebidos e relidos.","O tom e o conteúdo são validados por alguém que não escreveu os templates.","**Primeiro em `blmf-teste`, nunca diretamente na BLMF.**"]},"dep":{"fr":"Se fait avec **G3**, même bac à sable.","pt":"Faz-se com **G3**, mesmo ambiente de teste."},"r":["VERIF_etat_reel_gouvernance_et_crons_2026-08-26 §2"]},{"id":"G5","d":"G","p":"P2","s":"a-verifier","e":"S","sk":["collectif"],"t":{"fr":"Clarifier le statut de la Biblioteca Terra Livre","pt":"Esclarecer o estatuto da Biblioteca Terra Livre"},"v":{"fr":"La BTL porte `is_test_mode = true` et `email_delivery_mode = 'test_only'`, **alors qu'elle contient 2 187 exemplaires** — le plus gros fonds du réseau — et qu'elle est publiée sur le réseau. Posture voulue, ou reliquat de configuration ?","pt":"A BTL traz `is_test_mode = true` e `email_delivery_mode = 'test_only'`, **embora contenha 2 187 exemplares** — o maior acervo da rede — e esteja publicada na rede. Postura deliberada, ou resíduo de configuração?"},"w":{"fr":"Demander à la BTL ce qu'elle veut, puis aligner la configuration. Si le mode d'essai est voulu, l'écrire quelque part pour que personne ne le « corrige ».","pt":"Perguntar à BTL o que ela quer, depois alinhar a configuração. Se o modo de teste for deliberado, escrevê-lo em algum lugar para que ninguém o «corrija»."},"y":{"fr":"En mode d'essai, les courriels ne partent pas. Une bibliothèque avec 2 187 exemplaires publiés dont les lectrices ne reçoivent aucune notification, c'est soit un choix, soit une panne silencieuse depuis des mois. La BTL a rejoint le réseau avec un statut « expérimental » assumé — mais un statut politique et un réglage technique ne sont pas la même chose.","pt":"Em modo de teste, os e-mails não saem. Uma biblioteca com 2 187 exemplares publicados cujas leitoras não recebem nenhuma notificação é ou uma escolha, ou uma pane silenciosa há meses. A BTL entrou na rede com um estatuto «experimental» assumido — mas um estatuto político e um ajuste técnico não são a mesma coisa."},"f":{"fr":["La BTL a répondu, et la configuration correspond à sa réponse.","Le statut est écrit là où quelqu'un le cherchera."],"pt":["A BTL respondeu, e a configuração corresponde à sua resposta.","O estatuto está escrito onde alguém vai procurá-lo."]},"dep":{"fr":"Aucune. Une conversation.","pt":"Nenhuma. Uma conversa."},"r":["PLAN_formation_coordination_BLMF §8"]},{"id":"G6","d":"G","p":"P2","s":"ouvert","e":"M","sk":["front","biblio"],"t":{"fr":"Donner un écran au prêt entre bibliothèques","pt":"Dar uma tela ao empréstimo entre bibliotecas"},"v":{"fr":"Le cycle de vie du prêt entre bibliothèques est spécifié et implémenté en base : machine à états verrouillée, quatre triggers, cron `anarbib-peb-detect-overdue-daily` actif. **Aucun écran n'existe.** La base porte 2 prêts pour 20 insertions historiques.","pt":"O ciclo de vida do empréstimo entre bibliotecas está especificado e implementado no banco: máquina de estados travada, quatro triggers, cron `anarbib-peb-detect-overdue-daily` ativo. **Nenhuma tela existe.** O banco traz 2 empréstimos para 20 inserções históricas."},"w":{"fr":"Un écran de demande côté bibliothèque emprunteuse, un écran de traitement côté prêteuse, et l'affichage de l'état pour les deux. Les vues `interlibrary_loans_painel_ui` et `interlibrary_loan_items_ui` existent déjà.","pt":"Uma tela de pedido do lado da biblioteca solicitante, uma tela de tratamento do lado da emprestadora, e a exibição do estado para as duas. As views `interlibrary_loans_painel_ui` e `interlibrary_loan_items_ui` já existem."},"y":{"fr":"Le prêt entre bibliothèques est ce qui rend un réseau fédératif utile à ses lectrices, plutôt qu'une simple juxtaposition de catalogues. Aujourd'hui il a « une amorce en base, même sans écran » — ce qui veut dire que personne ne peut s'en servir.","pt":"O empréstimo entre bibliotecas é o que torna uma rede federativa útil às suas leitoras, em vez de uma simples justaposição de catálogos. Hoje ele tem «um início no banco, mesmo sem tela» — o que quer dizer que ninguém pode usá-lo."},"f":{"fr":["Un prêt complet a été fait entre deux bibliothèques du réseau, par l'interface.","Le flux « livre perdu ou abîmé » a un traitement écrit — **aucun flux ne le couvre aujourd'hui**, il se traite hors SIGB avec remontée en coordination."],"pt":["Um empréstimo completo foi feito entre duas bibliotecas da rede, pela interface.","O fluxo «livro perdido ou danificado» tem um tratamento escrito — **nenhum fluxo o cobre hoje**, trata-se fora do SIGB com escalada à coordenação."]},"dep":{"fr":"`EA-12 phase 2` (parité PEB, environ 45 fonctions) est gelée par `BIBLIO-9` — à ne pas confondre avec cet item.","pt":"`EA-12 fase 2` (paridade EEB, cerca de 45 funções) está congelada por `BIBLIO-9` — a não confundir com este item."},"r":["spec-cycle-vie-peb.md","PLAN_formation_coordination_BLMF §5","REGISTRE §14 PEB"]},{"id":"G7","d":"G","p":"P1","s":"bloque","e":"?","sk":["collectif"],"t":{"fr":"Décider de l'admission de la Bibliothèque SOLIDAIRES","pt":"Decidir a admissão da Biblioteca SOLIDAIRES"},"v":{"fr":"Décision fédérale **volontairement différée**, faute de pouvoir être prise à plusieurs. Échéance envisagée : octobre ou novembre, après Bologne.","pt":"Decisão federal **deliberadamente adiada**, por não poder ser tomada em conjunto. Prazo previsto: outubro ou novembro, depois de Bolonha."},"w":{"fr":"Une fois **A1** abouti, instruire la demande à plusieurs et trancher.","pt":"Uma vez concluído **A1**, instruir o pedido em conjunto e decidir."},"y":{"fr":"La contrainte est écrite noir sur blanc au collectif et elle est absolue : **ne pas créer de bibliothèque « SOLIDAIRES » en base**, ni membre, ni partenaire, ni cible. « Créer la fiche reviendrait à inscrire en base une décision qu'on dit ne pas prendre. » Le lot de notices vit en `book_drafts` avec un marqueur de provenance, et rien d'autre.","pt":"A restrição está escrita preto no branco ao coletivo e é absoluta: **não criar biblioteca «SOLIDAIRES» no banco**, nem membro, nem parceira, nem alvo. «Criar a ficha equivaleria a inscrever no banco uma decisão que se diz não tomar.» O lote de registros vive em `book_drafts` com um marcador de proveniência, e nada mais."},"f":{"fr":["La décision est prise à trois au moins, et tracée dans `network_administrator_audit`.","Quelle qu'elle soit, elle est communiquée au collectif SOLIDAIRES avec sa raison."],"pt":["A decisão é tomada por pelo menos três, e rastreada em `network_administrator_audit`.","Seja qual for, é comunicada ao coletivo SOLIDAIRES com seu motivo."]},"dep":{"fr":"**Bloqué par A1.** Même remarque pour la demande d'adhésion belge en cours d'évaluation.","pt":"**Bloqueado por A1.** Mesma observação para o pedido de adesão belga em avaliação."},"r":["REPRISE_claude_code_2026-08-27","CALENDRIER_bologne_2026-08-27"]},{"id":"G8","d":"G","p":"P2","s":"ouvert","e":"S","sk":["biblio","aucune"],"t":{"fr":"Compléter la cartographie avec les archives repérées ailleurs","pt":"Completar a cartografia com os arquivos identificados alhures"},"v":{"fr":"`cartography_entries` porte 187 fiches et le fichier `anarbib_bibliotheques_libertaires.geojson` en compte 121. Neuf archives repérées dans le réseau NORLA n'ont pas été confrontées à cette liste.","pt":"`cartography_entries` traz 187 fichas e o arquivo `anarbib_bibliotheques_libertaires.geojson` conta 121. Nove arquivos identificados na rede NORLA não foram confrontados com essa lista."},"w":{"fr":"Vérifier lesquelles des neuf figurent déjà, et faire entrer les manquantes avec `source = \"FICEDL\"` ou `\"NORLA\"` selon leur provenance.","pt":"Verificar quais das nove já constam, e fazer entrar as ausentes com `source = \"FICEDL\"` ou `\"NORLA\"` conforme sua proveniência."},"y":{"fr":"La carte n'a d'intérêt que si elle est plus complète que ce que chacun connaît déjà. Et la traçabilité de la source est ce qui permettra plus tard de dire d'où vient chaque fiche sans avoir à redemander.","pt":"O mapa só tem interesse se for mais completo do que aquilo que cada um já conhece. E a rastreabilidade da fonte é o que permitirá mais tarde dizer de onde vem cada ficha sem ter de perguntar de novo."},"f":{"fr":["Les neuf archives ont un verdict : déjà présente, ou ajoutée avec sa source.","Rappel : `statut_public` est à `FALSE` par défaut et **aucun import en masse** n'est autorisé (`MAP-E`)."],"pt":["Os nove arquivos têm um veredicto: já presente, ou acrescentado com sua fonte.","Lembrete: `statut_public` está em `FALSE` por omissão e **nenhuma importação em massa** é autorizada (`MAP-E`)."]},"dep":{"fr":"Aucune. **Entrée sans compétence technique.**","pt":"Nenhuma. **Entrada sem competência técnica.**"},"r":["VEILLE_leftovers_maydayrooms_2026-08-19 §3.4","REGISTRE §34 MAP-E"]},{"id":"G9","d":"G","p":"P3","s":"gele","e":"L","sk":["front"],"t":{"fr":"Implémenter la cartographie du réseau selon la spec v1.0","pt":"Implementar a cartografia da rede segundo a spec v1.0"},"v":{"fr":"Les arbitrages sont tranchés depuis le 18/06 : table dédiée, i18n hybride, carte publique comme route de l'application, moteur Leaflet, OpenStreetMap et Nominatim auto-hébergés, entrées non membres affichées avec un filtre clair. `MAP-I` (statut du prêt entre bibliothèques sur la carte interne) et `MAP-J` (auto-déclaration « ajouter ma bibliothèque » avec modération) restent différés. **L'implémentation est calendée post-Bologne, fin 2026 ou 2027.**","pt":"As arbitragens estão decididas desde 18/06: tabela dedicada, i18n híbrida, mapa público como rota do aplicativo, motor Leaflet, OpenStreetMap e Nominatim auto-hospedados, entradas não membros exibidas com um filtro claro. `MAP-I` (estatuto do empréstimo entre bibliotecas no mapa interno) e `MAP-J` (autodeclaração «adicionar minha biblioteca» com moderação) continuam adiados."},"w":{"fr":"Reprendre la spec v1.0 quand la fenêtre s'ouvre. Attention : le REGISTRE porte **deux sections `MAP`** — le §2 est un squelette où tout est ouvert, le §34 est la version tranchée. Le §2 n'a ni tampon de supersession ni renvoi vers le §34 : **c'est le §34 qui vaut**.","pt":"Retomar a spec v1.0 quando a janela se abrir. Atenção: o REGISTRO traz **duas seções `MAP`** — a §2 é um esqueleto onde tudo está aberto, a §34 é a versão decidida. A §2 não tem carimbo de supersessão nem remissão à §34: **é a §34 que vale**."},"y":{"fr":"La carte est le premier objet qu'une bibliothèque qui découvre le réseau va regarder. Elle mérite d'être faite quand il y aura du temps pour la faire bien, et pas dans la fenêtre d'avant Bologne.","pt":"O mapa é o primeiro objeto que uma biblioteca que descobre a rede vai olhar. Merece ser feito quando houver tempo para fazê-lo bem, e não na janela anterior a Bolonha."},"f":{"fr":["La carte publique est une route de l'application, servie sans requête vers un tiers (voir **E5**).","Le §2 du REGISTRE porte un renvoi vers le §34."],"pt":["O mapa público é uma rota do aplicativo, servido sem requisição a terceiro (ver **E5**).","A §2 do REGISTRO traz uma remissão à §34."]},"dep":{"fr":"Après Bologne. Lié à **E5** et **J5**.","pt":"Depois de Bolonha. Ligado a **E5** e **J5**."},"r":["spec-cartographie-reseau.md v1.0","REGISTRE §34 MAP"]},{"id":"G10","d":"G","p":"P2","s":"ouvert","e":"S","sk":["collectif"],"t":{"fr":"Solder les trois questions d'onboarding marquées « au plus vite »","pt":"Liquidar as três questões de onboarding marcadas «o mais rápido possível»"},"v":{"fr":"Trois points sont marqués 🔴 « à résoudre au plus vite » depuis juin et n'ont pas bougé : `#111` (évaluation collaborative d'un·e administrateur·rice réseau, dormante), `ONBO-Q13` (transfert technique du mandat de coordination), et la finition du volet 10 de l'atelier d'onboarding.","pt":"Três pontos estão marcados 🔴 «a resolver o mais rápido possível» desde junho e não se moveram: `#111` (avaliação colaborativa de uma pessoa administradora de rede, dormente), `ONBO-Q13` (transferência técnica do mandato de coordenação), e o acabamento do módulo 10 da oficina de onboarding."},"w":{"fr":"Les trois se traitent ensemble parce qu'ils portent la même question : que se passe-t-il quand quelqu'un arrive, et quand quelqu'un part ?","pt":"Os três se tratam juntos porque carregam a mesma questão: o que acontece quando alguém chega, e quando alguém sai?"},"y":{"fr":"`ONBO-Q13` est le cas de figure d'une coordination qui change de mains. Aujourd'hui, une bibliothèque dont la personne coordinatrice disparaît n'a pas de chemin écrit. C'est exactement le risque que **A1** décrit à l'échelle du réseau, à l'échelle d'une bibliothèque cette fois.","pt":"`ONBO-Q13` é o caso de uma coordenação que muda de mãos. Hoje, uma biblioteca cuja pessoa coordenadora desaparece não tem caminho escrito. É exatamente o risco que **A1** descreve na escala da rede, desta vez na escala de uma biblioteca."},"f":{"fr":["Le transfert de mandat a un chemin écrit et éprouvé sur `blmf-teste`.","`#111` a un verdict : réveillée, ou fermée.","Le volet 10 est fini."],"pt":["A transferência de mandato tem um caminho escrito e testado em `blmf-teste`.","`#111` tem um veredicto: reativada, ou fechada.","O módulo 10 está terminado."]},"dep":{"fr":"Éclairé par **G3** (le circuit d'invitation est le même).","pt":"Esclarecido por **G3** (o circuito de convite é o mesmo)."},"r":["REGISTRE §26 ONBO-Q13","spec-onboarding-biblioteca-v2.0"]},{"id":"H1","d":"H","p":"P1","s":"ouvert","e":"S","sk":["deno","biblio"],"t":{"fr":"Réparer l'aspiration des 158 descripteurs de dates du thésaurus","pt":"Reparar a coleta dos 158 descritores de datas do tesauro"},"v":{"fr":"`parseDescriptor` sort par retour précoce avant d'atteindre le titre de page quand une fiche n'a pas de bloc de traduction. Résultat : **158 descripteurs de la facette « dates », soit un quart du thésaurus, sont enregistrés comme identifiants nus, sans libellé, donc non alignables.** Leurs liens vers les catalogues se perdent de la même façon. Le correctif `ficedl_scrape_titre_dates.patch` existe, passe `node --check`, et **n'a jamais été éprouvé contre le site**.","pt":"`parseDescriptor` sai por retorno antecipado antes de alcançar o título de página quando uma ficha não tem bloco de tradução. Resultado: **158 descritores da faceta «datas», ou seja um quarto do tesauro, são registrados como identificadores nus, sem rótulo, portanto não alinháveis.** Seus vínculos com os catálogos se perdem da mesma forma. A correção `ficedl_scrape_titre_dates.patch` existe, passa `node --check`, e **nunca foi testada contra o site**."},"w":{"fr":"Appliquer le correctif, qui relève le titre de page avant les retours précoces et le range dans un champ `title_fr` **distinct de `labels`** — une date a un libellé canonique mais pas de traduction.","pt":"Aplicar a correção, que capta o título de página antes dos retornos antecipados e o guarda num campo `title_fr` **distinto de `labels`** — uma data tem um rótulo canônico mas não uma tradução."},"y":{"fr":"Un quart du thésaurus est aujourd'hui inutilisable. Et il faut le réparer **au moment d'une aspiration déjà prévue**, pas en lançant 620 requêtes spécialement : l'hébergeur du thésaurus a signalé une charge robots excessive.","pt":"Um quarto do tesauro está hoje inutilizável. E é preciso repará-lo **no momento de uma coleta já prevista**, não lançando 620 requisições especialmente: o provedor do tesauro sinalizou uma carga de robôs excessiva."},"f":{"fr":["Les 158 descripteurs de dates portent un libellé.","La vérification s'est faite lors d'une aspiration prévue.","Deux pièges du script de synchronisation à ne pas redécouvrir : **toujours passer `--json` explicitement** (un fichier sans date trie avant les fichiers datés) et **ne jamais utiliser `--prune`** (il supprimerait des descripteurs référencés par `subject_ficedl_links`)."],"pt":["Os 158 descritores de datas trazem um rótulo.","A verificação se fez durante uma coleta prevista.","Duas armadilhas do script de sincronização a não redescobrir: **sempre passar `--json` explicitamente** (um arquivo sem data ordena antes dos arquivos datados) e **nunca usar `--prune`** (suprimiria descritores referenciados por `subject_ficedl_links`)."]},"dep":{"fr":"Prévu semaine du 14/09. Abandonnable sans regret si le temps manque avant Bologne.","pt":"Previsto para a semana de 14/09. Abandonável sem arrependimento se faltar tempo antes de Bolonha."},"r":["REPRISE_claude_code_2026-08-27 chantier 3","NOTE_export_thesaurus_questions_ouvertes_2026-08-28"]},{"id":"H2","d":"H","p":"P1","s":"bloque","e":"S","sk":["collectif"],"t":{"fr":"Poser à la FICEDL les sept questions qui bloquent l'export du thésaurus","pt":"Colocar à FICEDL as sete questões que bloqueiam a exportação do tesauro"},"v":{"fr":"L'export complet des 620 descripteurs dans les deux formats est **à une soirée de travail** — dès que les sept questions ont une réponse. Elles sont écrites et personne ne les a encore posées.","pt":"A exportação completa dos 620 descritores nos dois formatos está a **uma noite de trabalho** — assim que as sete questões tiverem resposta. Estão escritas e ninguém ainda as colocou."},"w":{"fr":"Les sept : la forme des identifiants ; **la hiérarchie, qui est la vraie question** ; le statut de la facette « dates » ; le sort des 2 842 liens vers six catalogues ; le grec romanisé ; la licence ; et la manière dont le fichier se régénère.","pt":"As sete: a forma dos identificadores; **a hierarquia, que é a verdadeira questão**; o estatuto da faceta «datas»; o destino dos 2 842 vínculos para seis catálogos; o grego romanizado; a licença; e a maneira como o arquivo se regenera."},"y":{"fr":"Sur 148 descripteurs à libellé arborescent, **93 parents sont retrouvés et 55 sont introuvables** : « art », « économie », « guerres », « littérature », « presse », « syndicalisme » ne sont pas des descripteurs, ou portent un autre nom. Vu de l'extérieur, **la hiérarchie n'est pas une donnée, c'est une convention d'affichage dans une chaîne de caractères** — et on ne peut pas écrire `skos:broader` honnêtement là-dessus. Seule la FICEDL peut dire si le site tient une vraie relation parent-enfant.","pt":"De 148 descritores com rótulo arborescente, **93 pais são encontrados e 55 são inencontráveis**: «arte», «economia», «guerras», «literatura», «imprensa», «sindicalismo» não são descritores, ou têm outro nome. Visto de fora, **a hierarquia não é um dado, é uma convenção de exibição numa cadeia de caracteres** — e não se pode escrever `skos:broader` honestamente sobre isso. Só a FICEDL pode dizer se o site mantém uma verdadeira relação pai-filho."},"f":{"fr":["Les sept questions sont posées, avec l'audit de qualité produit à la première aspiration en pièce jointe — **les corrections appartiennent à la source, pas aux copies**.","Quatre anomalies vues en passant sont remontées : deux sites différents sous le même intitulé « catalogue du CCL » ; les archives du *Monde libertaire* apparaissant deux fois par terme sous deux formes d'adresse ; `mot228` (« populations autochtones ») présent dans deux facettes ; 29 libellés portugais portant astérisque, point d'interrogation ou espace finale.","La question 7 est la plus rentable : un squelette SPIP qui imprime les termes en CSV règle aussi la charge robots — **une requête au lieu de 620, par consommateur et par mise à jour**, pour une demi-journée de travail côté FICEDL."],"pt":["As sete questões estão colocadas, com a auditoria de qualidade produzida na primeira coleta em anexo — **as correções pertencem à fonte, não às cópias**.","Quatro anomalias vistas de passagem são reportadas: dois sites diferentes sob o mesmo rótulo «catálogo do CCL»; os arquivos do *Monde libertaire* aparecendo duas vezes por termo sob duas formas de endereço; `mot228` («populações autóctones») presente em duas facetas; 29 rótulos portugueses com asterisco, ponto de interrogação ou espaço final.","A questão 7 é a mais rentável: um esqueleto SPIP que imprime os termos em CSV resolve também a carga de robôs — **uma requisição em vez de 620, por consumidor e por atualização**, para meia jornada de trabalho do lado da FICEDL."]},"dep":{"fr":"Bloque **H3**. À poser à Bologne ou avant.","pt":"Bloqueia **H3**. A colocar em Bolonha ou antes."},"r":["NOTE_export_thesaurus_questions_ouvertes_2026-08-28"]},{"id":"H3","d":"H","p":"P1","s":"ouvert","e":"S","sk":["biblio","deno"],"t":{"fr":"Publier les correspondances vers le thésaurus FICEDL en SKOS","pt":"Publicar as correspondências para o tesauro FICEDL em SKOS"},"v":{"fr":"98 alignements existent en base entre les sujets locaux et les descripteurs FICEDL, en `exact` ou `close`. Le vocabulaire matière d'AnarBib est déjà exposé en SKOS. **Les correspondances vers la FICEDL ne le sont pas.**","pt":"98 alinhamentos existem no banco entre os assuntos locais e os descritores FICEDL, em `exact` ou `close`. O vocabulário de assunto do AnarBib já está exposto em SKOS. **As correspondências para a FICEDL não estão.**"},"w":{"fr":"Exposer `subject_ficedl_links` en `skos:exactMatch` et `skos:closeMatch`. **Un alignement partiel vaut mieux que pas d'alignement** — c'est la convention 2 du texte d'interopérabilité, et elle s'applique d'abord à nous.","pt":"Expor `subject_ficedl_links` em `skos:exactMatch` e `skos:closeMatch`. **Um alinhamento parcial vale mais que nenhum alinhamento** — é a convenção 2 do texto de interoperabilidade, e se aplica primeiro a nós."},"y":{"fr":"C'est ce qui permet qu'un fonds catalogué avec un vocabulaire local reste trouvable par qui ne connaît pas ce vocabulaire — et dans dix langues, puisque le thésaurus est déjà traduit. Quelques heures pour un premier flux.","pt":"É o que permite que um acervo catalogado com um vocabulário local continue encontrável por quem não conhece esse vocabulário — e em dez línguas, já que o tesauro já está traduzido. Algumas horas para um primeiro fluxo."},"f":{"fr":["Un fichier SKOS est servi par l'application, à une adresse stable.","Il distingue `exactMatch` de `closeMatch`.","Il n'affirme rien sur la hiérarchie tant que **H2** n'a pas répondu."],"pt":["Um arquivo SKOS é servido pelo aplicativo, num endereço estável.","Distingue `exactMatch` de `closeMatch`.","Não afirma nada sobre a hierarquia enquanto **H2** não tiver respondido."]},"dep":{"fr":"La partie hiérarchie dépend de **H2**. La partie correspondances, non.","pt":"A parte hierarquia depende de **H2**. A parte correspondências, não."},"r":["docs/CHANTIERS_OUVERTS.md §4","CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26 convention 2"]},{"id":"H4","d":"H","p":"P1","s":"ouvert","e":"S","sk":["deno"],"t":{"fr":"Exposer le catalogue en OPDS","pt":"Expor o catálogo em OPDS"},"v":{"fr":"Le point d'accès OAI-PMH est déployé. **OPDS n'existe pas.** Or « les flux OPDS existent de part et d'autre mais ne pointent nulle part », et c'est la convention 1 du texte proposé aux autres catalogues.","pt":"O ponto de acesso OAI-PMH está implantado. **OPDS não existe.** Ora, «os fluxos OPDS existem de um lado e de outro mas não apontam para lugar nenhum», e é a convenção 1 do texto proposto aos outros catálogos."},"w":{"fr":"Un flux OPDS 1.2 ou 2.0 sur le catalogue public, avec les facettes déjà disponibles. Quelques heures pour un premier flux.","pt":"Um fluxo OPDS 1.2 ou 2.0 sobre o catálogo público, com as facetas já disponíveis. Algumas horas para um primeiro fluxo."},"y":{"fr":"OPDS est ce que lisent les liseuses et les applications de lecture. C'est le format par lequel un fonds numérisé devient consultable sans passer par notre interface — et c'est la première des quatre conventions qu'AnarBib propose aux autres. **Il serait difficile de la proposer sans l'appliquer.**","pt":"OPDS é o que os leitores digitais e os aplicativos de leitura leem. É o formato pelo qual um acervo digitalizado se torna consultável sem passar pela nossa interface — e é a primeira das quatro convenções que o AnarBib propõe aos outros. **Seria difícil propô-la sem aplicá-la.**"},"f":{"fr":["Un flux OPDS est servi et lisible par au moins un client réel.","Il respecte la visibilité : rien qui ne soit déjà public ne sort."],"pt":["Um fluxo OPDS é servido e legível por pelo menos um cliente real.","Respeita a visibilidade: nada que já não seja público sai."]},"dep":{"fr":"Aucune.","pt":"Nenhuma."},"r":["docs/CHANTIERS_OUVERTS.md §4","CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26 convention 1"]},{"id":"H5","d":"H","p":"P2","s":"ouvert","e":"S","sk":["deno","sysadmin"],"t":{"fr":"Éprouver la moisson OAI-PMH dans les deux sens","pt":"Testar a coleta OAI-PMH nos dois sentidos"},"v":{"fr":"Le chemin est exécutable depuis le 28/08 : fonction `harvest-oai-pmh` déployée, cron `anarbib-oai-harvest-weekly` posé. **Le cron n'a jamais tourné** — première occurrence prévue mardi à 04h20. Et le point d'accès `oai-pmh-provider` **n'a jamais été moissonné depuis l'extérieur**.","pt":"O caminho está executável desde 28/08: função `harvest-oai-pmh` implantada, cron `anarbib-oai-harvest-weekly` posto. **O cron nunca rodou** — primeira ocorrência prevista para terça-feira às 04h20. E o ponto de acesso `oai-pmh-provider` **nunca foi coletado de fora**."},"w":{"fr":"Attendre le premier passage du cron et lire ce qu'il ramène. En parallèle, moissonner notre propre point d'accès depuis une machine tierce, avec un client OAI standard, et vérifier que les enregistrements sont conformes.","pt":"Esperar a primeira passagem do cron e ler o que ela traz. Em paralelo, coletar nosso próprio ponto de acesso a partir de uma máquina de terceiro, com um cliente OAI padrão, e verificar que os registros estão conformes."},"y":{"fr":"Un point d'accès jamais moissonné est un point d'accès dont on ignore s'il fonctionne. C'est le même schéma que le circuit d'invitation : construit, déclaré, jamais emprunté. Et la limitation de débit n'est pas en place — le greffon `caddy-ratelimit` n'est pas embarqué dans l'image `caddy:2`, ce qui laisse le point d'accès public non limité.","pt":"Um ponto de acesso nunca coletado é um ponto de acesso do qual se ignora se funciona. É o mesmo esquema do circuito de convite: construído, declarado, jamais percorrido. E a limitação de taxa não está em vigor — o plugin `caddy-ratelimit` não está embutido na imagem `caddy:2`, o que deixa o ponto de acesso público sem limite."},"f":{"fr":["Le cron a tourné au moins une fois et son résultat est lu.","Un moissonnage externe a réussi, avec le compte rendu écrit.","La limitation de débit a un verdict : rétablie le jour où le moissonnage gênera, ou assumée."],"pt":["O cron rodou pelo menos uma vez e seu resultado está lido.","Uma coleta externa foi bem-sucedida, com o relatório escrito.","A limitação de taxa tem um veredicto: restabelecida no dia em que a coleta incomodar, ou assumida."]},"dep":{"fr":"La limitation de débit est liée à **I2**.","pt":"A limitação de taxa está ligada a **I2**."},"r":["Relevé du 29/08/2026","REPRISE_bascule_autohebergee_2026-08-26","spec-oai-provider-gouvernance.md"]},{"id":"H6","d":"H","p":"P2","s":"ouvert","e":"M","sk":["biblio","collectif"],"t":{"fr":"Aligner les vocabulaires militants qui ne se connaissent pas","pt":"Alinhar os vocabulários militantes que não se conhecem"},"v":{"fr":"NORLA a bâti son vocabulaire — avec ses facettes *Tactics* et *Social Movement* — **sans lien avec le thésaurus FICEDL**. Deux vocabulaires militants, construits en parallèle, qui s'ignorent. Par ailleurs, les 11 catégories thématiques d'AnarcosyndicalismeBOOK ne sont alignées sur rien.","pt":"A NORLA construiu seu vocabulário — com suas facetas *Tactics* e *Social Movement* — **sem vínculo com o tesauro FICEDL**. Dois vocabulários militantes, construídos em paralelo, que se ignoram. Além disso, as 11 categorias temáticas do AnarcosyndicalismeBOOK não estão alinhadas a nada."},"w":{"fr":"Commencer par le plus petit et le plus faisable : les 11 catégories d'AnarcosyndicalismeBOOK, **un premier pas concret, borné, faisable en une soirée** — et comme le thésaurus est déjà en dix langues, l'alignement vaut simultanément pour les dix. Puis ouvrir la conversation avec NORLA.","pt":"Começar pelo menor e mais viável: as 11 categorias do AnarcosyndicalismeBOOK, **um primeiro passo concreto, delimitado, viável numa noite** — e como o tesauro já está em dez línguas, o alinhamento vale simultaneamente para as dez. Depois abrir a conversa com a NORLA."},"y":{"fr":"Chaque vocabulaire construit isolément est un fonds que les autres ne trouveront pas. Réserve à garder en tête : les vocabulaires d'éphémères sont **monolingues**, l'alignement y sera plus lourd que sur des sujets.","pt":"Cada vocabulário construído isoladamente é um acervo que os outros não encontrarão. Reserva a ter em mente: os vocabulários de efêmeros são **monolíngues**, o alinhamento será mais pesado neles do que em assuntos."},"f":{"fr":["Les 11 catégories d'AnarcosyndicalismeBOOK sont alignées.","Une conversation est ouverte avec NORLA sur l'alignement des facettes.","La réciprocité est demandée : **les catalogues partenaires ne pointent pas en retour** aujourd'hui."],"pt":["As 11 categorias do AnarcosyndicalismeBOOK estão alinhadas.","Uma conversa está aberta com a NORLA sobre o alinhamento das facetas.","A reciprocidade é pedida: **os catálogos parceiros não apontam de volta** hoje."]},"dep":{"fr":"Octobre-novembre, si Bastien s'y met. Lié à **D4**.","pt":"Outubro-novembro, se Bastien topar. Ligado a **D4**."},"r":["ORIENTATION_outils_bibliotheques_militantes_2026-08-26 §6","VEILLE_leftovers_maydayrooms_2026-08-19"]},{"id":"H7","d":"H","p":"P1","s":"decision","e":"S","sk":["collectif"],"t":{"fr":"Décider du sort du texte de conventions d'interopérabilité","pt":"Decidir o destino do texto de convenções de interoperabilidade"},"v":{"fr":"`CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26` est un **brouillon qui n'engage personne et n'a jamais été discuté avec aucune organisation**. Il propose quatre conventions et une demande unique à la FICEDL.","pt":"`CONVENTIONS_interoperabilite_catalogues_libertaires_2026-08-26` é um **rascunho que não compromete ninguém e nunca foi discutido com nenhuma organização**. Propõe quatro convenções e um pedido único à FICEDL."},"w":{"fr":"Retirer les notes de travail, porter le texte à Bologne, et le laisser être repris collectivement — ou rangé.","pt":"Retirar as notas de trabalho, levar o texto a Bolonha, e deixá-lo ser retomado coletivamente — ou arquivado."},"y":{"fr":"Deux choses sont écrites et méritent d'être tenues. D'une part, **un texte qui invite d'autres outils à s'appuyer sur le thésaurus demande une position de la fédération, pas un feu vert individuel** — c'est une question d'assemblée. D'autre part, **si le texte devient utile, il devra cesser d'être celui de qui l'a écrit**. Pas de liste de signataires : appliquer une convention se constate en regardant un catalogue, pas en consultant un registre.","pt":"Duas coisas estão escritas e merecem ser mantidas. Por um lado, **um texto que convida outras ferramentas a se apoiarem no tesauro exige uma posição da federação, não um sinal verde individual** — é uma questão de assembleia. Por outro, **se o texto se tornar útil, deverá deixar de ser o de quem o escreveu**. Sem lista
