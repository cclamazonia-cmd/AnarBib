uma única inserção histórica. O ajuste `team_admission_mode = 'cosignature'` da BLMF nunca teve efeito sobre nada. Ora, a migração de colegialidade faz desse circuito jamais exercido **o caminho crítico** de toda promoção."}},{"sens":"exerce","quoi":{"fr":"L'accessibilité","pt":"A acessibilidade"},"dit":{"fr":"panneau de réglages livré sur toutes les pages, `html lang` conforme WCAG 3.1.1","pt":"painel de ajustes entregue em todas as páginas, `html lang` conforme WCAG 3.1.1"},"reel":{"fr":"Des fonctionnalités d'accessibilité sont implémentées. **Aucun audit d'accessibilité indépendant n'a jamais été mené.** Dire l'un sans l'autre serait une faute (item **E1**).","pt":"Funcionalidades de acessibilidade estão implementadas. **Nenhuma auditoria de acessibilidade independente foi jamais conduzida.** Dizer um sem o outro seria uma falta (item **E1**)."}},{"sens":"exerce","quoi":{"fr":"La moisson OAI-PMH","pt":"A coleta OAI-PMH"},"dit":{"fr":"chemin exécutable, fonction `harvest-oai-pmh` déployée, cron hebdomadaire posé","pt":"caminho executável, função `harvest-oai-pmh` implantada, cron semanal posto"},"reel":{"fr":"Le cron `anarbib-oai-harvest-weekly` **n'a jamais tourné** (première occurrence : mardi 04h20). `oai_harvest_state` : 9 insertions, 0 ligne vivante. Le point d'accès OAI n'a jamais été moissonné de l'extérieur non plus.","pt":"O cron `anarbib-oai-harvest-weekly` **nunca rodou** (primeira ocorrência: terça-feira 04h20). `oai_harvest_state`: 9 inserções, 0 linha viva. O ponto de acesso OAI também nunca foi coletado de fora."}},{"sens":"chiffre","quoi":{"fr":"Les chiffres de `CLAUDE.md`","pt":"Os números de `CLAUDE.md`"},"dit":{"fr":"200 migrations · 48 fonctions Edge · 6 154 clés i18n · 36 déclarations `verify_jwt` dont 5 à `true` · `i18n.test.js` couvre 8 locales · 492 fonctions DEFINER","pt":"200 migrações · 48 funções Edge · 6 154 chaves i18n · 36 declarações `verify_jwt` das quais 5 em `true` · `i18n.test.js` cobre 8 locales · 492 funções DEFINER"},"reel":{"fr":"221 · 49 dossiers pour 48 déployées · 6 177 · **31 déclarations, toutes à `false`, aucune à `true`** · **10 locales** depuis le 27/08 · 664. Le plus grave est la ligne `verify_jwt` : elle décrit une protection qui n'existe pas.","pt":"221 · 49 pastas para 48 implantadas · 6 177 · **31 declarações, todas em `false`, nenhuma em `true`** · **10 locales** desde 27/08 · 664. O mais grave é a linha `verify_jwt`: descreve uma proteção que não existe."}},{"sens":"chiffre","quoi":{"fr":"Le nombre de migrations, à travers le corpus","pt":"O número de migrações, através do corpus"},"dit":{"fr":"309 (10/06) → 128 (20/08) → 146 (`ETAT-AVANCEMENT`) → 221 (28/08)","pt":"309 (10/06) → 128 (20/08) → 146 (`ETAT-AVANCEMENT`) → 221 (28/08)"},"reel":{"fr":"**221 appliquées, 224 fichiers.** La série documentaire n'est pas monotone : le chiffre du 10 juin est supérieur à ceux de deux relevés postérieurs. Ne jamais reprendre un compte de migrations depuis un document.","pt":"**221 aplicadas, 224 arquivos.** A série documental não é monótona: o número de 10 de junho é superior aos de dois levantamentos posteriores. Nunca retomar uma contagem de migrações a partir de um documento."}},{"sens":"chiffre","quoi":{"fr":"`deploy/README.md`","pt":"`deploy/README.md`"},"dit":{"fr":"« Ce document décrit un état à atteindre, pas un état atteint. **Rien de tout ceci n'a encore tourné.** »","pt":"«Este documento descreve um estado a atingir, não um estado atingido. **Nada disso ainda rodou.**»"},"reel":{"fr":"Trois commits du 26/08 décrivent des exécutions réelles de `bootstrap.sh`, avec huit défauts relevés et corrigés. Le README est en retard sur ses propres commits voisins (item **I8**).","pt":"Três commits de 26/08 descrevem execuções reais de `bootstrap.sh`, com oito defeitos levantados e corrigidos. O README está atrasado em relação aos seus próprios commits vizinhos (item **I8**)."}},{"sens":"chiffre","quoi":{"fr":"`spec-flux-consultations-v2.2` et `spec-gouvernance-roles` §14","pt":"`spec-flux-consultations-v2.2` e `spec-gouvernance-roles` §14"},"dit":{"fr":"l'une affirme trois profils de bibliothèque « vérifiés en prod » ; l'autre liste comme « à implémenter » l'audit, les colonnes de carence, les mails `team.*` et deux crons","pt":"uma afirma três perfis de biblioteca «verificados em prod»; a outra lista como «a implementar» a auditoria, as colunas de carência, os e-mails `team.*` e dois crons"},"reel":{"fr":"La première est **fausse** (`BLT-test` n'existe pas, la BTL est en `full_sigb`) ; la seconde **sous-estime** ce qui tourne. Deux dérives de sens inverse, relevées le même jour (items **J3** et **J4**).","pt":"A primeira é **falsa** (`BLT-test` não existe, a BTL está em `full_sigb`); a segunda **subestima** o que roda. Duas derivas de sentido inverso, levantadas no mesmo dia (itens **J3** e **J4**)."}},{"sens":"jamais","quoi":{"fr":"Le schéma `ingest` n'est pas protégé","pt":"O esquema `ingest` não está protegido"},"dit":{"fr":"rien — aucun document du corpus ne mentionne l'état RLS de `ingest`","pt":"nada — nenhum documento do corpus menciona o estado RLS de `ingest`"},"reel":{"fr":"**8 des 10 tables du schéma `ingest` n'ont pas RLS activé**, dont `partner_catalog_staging_rows` (2 172 lignes) et `partner_catalog_row_to_draft` (2 084). Le discours « 0 table sans RLS » est vrai pour `public` et ne l'a jamais été pour l'ensemble de la base. Item **B1**, priorité haute.","pt":"**8 das 10 tabelas do esquema `ingest` não têm RLS ativado**, entre elas `partner_catalog_staging_rows` (2 172 linhas) e `partner_catalog_row_to_draft` (2 084). O discurso «0 tabela sem RLS» é verdadeiro para `public` e nunca o foi para o conjunto do banco. Item **B1**, prioridade alta."}},{"sens":"jamais","quoi":{"fr":"Les 35 sujets Solidaires sont en base, leur migration ne l'est pas","pt":"Os 35 assuntos Solidaires estão no banco, a migração deles não"},"dit":{"fr":"« jouer `20260828_sujets_solidaires_ficedl.sql` et vérifier 35 sujets + 44 liens » — chantier annoncé à faire","pt":"«rodar `20260828_sujets_solidaires_ficedl.sql` e verificar 35 assuntos + 44 vínculos» — canteiro anunciado a fazer"},"reel":{"fr":"**35 sujets ont été créés en base le 27/08** et les alignements sont passés de 51 à 98. Mais le fichier vit toujours dans `docs/drafts/`, hors de `supabase/migrations/`. Une instance neuve n'aura donc pas ces sujets. Item **C1**.","pt":"**35 assuntos foram criados no banco em 27/08** e os alinhamentos passaram de 51 para 98. Mas o arquivo continua em `docs/drafts/`, fora de `supabase/migrations/`. Uma instância nova, portanto, não terá esses assuntos. Item **C1**."}},{"sens":"jamais","quoi":{"fr":"La table la plus volumineuse de la base est la table de supervision","pt":"A tabela mais volumosa do banco é a tabela de supervisão"},"dit":{"fr":"rien","pt":"nada"},"reel":{"fr":"`service_health_probes` : **13 932 lignes**, +288 par jour, sans aucun cron de purge — alors que sept autres purges existent. Item **I6**.","pt":"`service_health_probes`: **13 932 linhas**, +288 por dia, sem nenhum cron de purga — enquanto sete outras purgas existem. Item **I6**."}},{"sens":"jamais","quoi":{"fr":"Sept vues du schéma `api` sont en SECURITY DEFINER","pt":"Sete views do esquema `api` estão em SECURITY DEFINER"},"dit":{"fr":"le hook `pre-commit` interdit pourtant toute `CREATE VIEW` sans `security_invoker = true`","pt":"o hook `pre-commit` proíbe no entanto todo `CREATE VIEW` sem `security_invoker = true`"},"reel":{"fr":"Sept vues antérieures au hook y échappent : `collective_removal_proposals_current_v1`, `cooptation_proposals_current_v1`, `gazette_issues_public_v1`, `gazette_locales_public_v1`, `lettre_locales_public_v1`, `lettre_public_v1`, `library_email_identity`. Item **B3**.","pt":"Sete views anteriores ao hook escapam: `collective_removal_proposals_current_v1`, `cooptation_proposals_current_v1`, `gazette_issues_public_v1`, `gazette_locales_public_v1`, `lettre_locales_public_v1`, `lettre_public_v1`, `library_email_identity`. Item **B3**."}}],"sens_labels":{"livre":{"fr":"Déclaré ouvert, en réalité livré","pt":"Declarado aberto, na verdade entregue"},"exerce":{"fr":"Déclaré livré, jamais exercé","pt":"Declarado entregue, jamais exercido"},"chiffre":{"fr":"Chiffre ou affirmation faux","pt":"Número ou afirmação falsos"},"jamais":{"fr":"Jamais écrit nulle part","pt":"Nunca escrito em lugar nenhum"}}},"sections":{"intro":{"fr":"Ce document remplace le backlog v33 du 17 juin 2026. Entre les deux, **216 des 221 migrations appliquées en production** ont été écrites, ainsi que 655 commits. Le v33 portait un bandeau d'avertissement de fraîcheur ajouté le 28 août ; il ne suffisait plus.\n\nLe v34 n'est pas une mise à jour du v33 : c'est une **réécriture sur état vérifié**. Chaque affirmation d'état a été relue le 29 août 2026 contre deux sources primaires — la base de données de production interrogée en lecture seule, et le dépôt Codeberg au commit `1d00ed2c`. Aucun item n'a été reporté sur la foi d'un document.\n\nCe travail a produit un résultat qui commande la lecture de tout le reste : **la documentation se trompe dans les deux sens**. Elle déclare ouverts des chantiers livrés depuis des semaines, et elle déclare livrées des choses que personne n'a jamais exercées. La section « Écarts relevés » les nomme un par un.","pt":"Este documento substitui o backlog v33 de 17 de junho de 2026. Entre os dois, **216 das 221 migrações aplicadas em produção** foram escritas, além de 655 commits. O v33 trazia um aviso de frescor acrescentado em 28 de agosto; já não bastava.\n\nO v34 não é uma atualização do v33: é uma **reescrita sobre estado verificado**. Cada afirmação de estado foi relida em 29 de agosto de 2026 contra duas fontes primárias — o banco de dados de produção consultado em somente-leitura, e o repositório Codeberg no commit `1d00ed2c`. Nenhum item foi transportado com base na fé de um documento.\n\nEsse trabalho produziu um resultado que comanda a leitura de todo o resto: **a documentação erra nos dois sentidos**. Ela declara abertos canteiros entregues há semanas, e declara entregues coisas que ninguém jamais exerceu. A seção «Desvios levantados» nomeia cada um deles."},"howto":{"fr":"**Ce document n'arbitre rien.** La préséance documentaire du projet reste celle de `docs/INDEX.md` : le `REGISTRE_decisions.md` fait foi, puis la spec du domaine, puis ce backlog. Si une ligne d'ici contredit le REGISTRE, c'est le REGISTRE qui a raison et cette ligne est un défaut à signaler.\n\n**Pour commencer sans rien demander à personne**, lisez `docs/CHANTIERS_OUVERTS.md` : sept portes d'entrée qui ne demandent aucune coordination. Le présent backlog est ce qui vient après, quand on veut savoir ce qui reste et pourquoi.\n\n**Avant de prendre un item, ouvrez un ticket sur Codeberg.** Deux personnes qui écrivent le même correctif, c'est une soirée perdue pour l'une des deux. C'est la seule règle de coordination du projet, et elle tient en une ligne.\n\n**Chaque fiche dit six choses** : ce que c'est, l'état vérifié au 29/08, pourquoi ça compte, ce qui compte comme fini, ce que ça demande, et ce dont ça dépend. Si l'une manque, la fiche est incomplète — dites-le plutôt que de deviner.\n\n**Les identifiants ne sont jamais réutilisés.** Un item soldé garde son numéro et passe à la section des clôtures. Les renvois entre crochets pointent vers le REGISTRE, une spec ou un identifiant hérité d'un backlog antérieur : ils permettent de retrouver la trace, ils ne font pas autorité par eux-mêmes.","pt":"**Este documento não arbitra nada.** A precedência documental do projeto continua sendo a de `docs/INDEX.md`: o `REGISTRE_decisions.md` faz fé, depois a spec do domínio, depois este backlog. Se uma linha daqui contradiz o REGISTRO, é o REGISTRO que tem razão e essa linha é um defeito a sinalizar.\n\n**Para começar sem pedir nada a ninguém**, leia `docs/CHANTIERS_OUVERTS.md`: sete portas de entrada que não exigem nenhuma coordenação. O presente backlog é o que vem depois, quando se quer saber o que falta e por quê.\n\n**Antes de pegar um item, abra uma issue no Codeberg.** Duas pessoas escrevendo a mesma correção é uma noite perdida para uma das duas. É a única regra de coordenação do projeto, e cabe em uma linha.\n\n**Cada ficha diz seis coisas**: o que é, o estado verificado em 29/08, por que importa, o que conta como terminado, o que exige, e do que depende. Se uma faltar, a ficha está incompleta — diga isso em vez de adivinhar.\n\n**Os identificadores nunca são reutilizados.** Um item liquidado guarda seu número e passa para a seção dos encerramentos. As remissões entre colchetes apontam para o REGISTRO, uma spec ou um identificador herdado de um backlog anterior: permitem recuperar o rastro, não fazem autoridade por si mesmas."},"calendrier":{"fr":"Trois dates gouvernent la fenêtre en cours, et deux d'entre elles sont des gels. Elles ne sont pas négociables au coup par coup : elles ont été posées parce qu'une démonstration publique tourne sur la production.\n\n| Date | Ce qui s'applique |\n|---|---|\n| **jusqu'au 14/09/2026** | Gel de la chaîne de bascule auto-hébergée **sur la production**. Hors périmètre nommément : alignement de l'image GoTrue, première exécution de `bootstrap.sh`, découplage de la CI, proxy inverse et tunnel, toute modification de `deploy/compose.yml` et du `Caddyfile`. Le travail en environnement d'essai reste entièrement ouvert. |\n| **à partir du 08/09/2026** | Plus aucune modification du code en production. |\n| **11-13/09/2026** | FICEDL Bologne. Atelier AnarBib le 12 au matin, assemblée ouverte le 13. |\n| **à partir du 14/09/2026** | Dégel. Le domaine I redevient le chantier principal. |\n\nUn item marqué **gelé** n'est pas un item mort : c'est un item dont la date de reprise est écrite.","pt":"Três datas governam a janela atual, e duas delas são congelamentos. Não são negociáveis caso a caso: foram postas porque uma demonstração pública roda na produção.\n\n| Data | O que se aplica |\n|---|---|\n| **até 14/09/2026** | Congelamento da cadeia de migração auto-hospedada **na produção**. Fora do perímetro, nominalmente: alinhamento da imagem GoTrue, primeira execução de `bootstrap.sh`, desacoplamento da CI, proxy reverso e túnel, qualquer modificação de `deploy/compose.yml` e do `Caddyfile`. O trabalho em ambiente de teste continua inteiramente aberto. |\n| **a partir de 08/09/2026** | Nenhuma modificação de código em produção. |\n| **11-13/09/2026** | FICEDL Bolonha. Oficina AnarBib no dia 12 pela manhã, assembleia aberta no dia 13. |\n| **a partir de 14/09/2026** | Descongelamento. O domínio I volta a ser o canteiro principal. |\n\nUm item marcado **congelado** não é um item morto: é um item cuja data de retomada está escrita."},"regles":{"fr":"Ces règles ne sont pas des préférences. Chacune a été payée par un incident dont la trace existe dans `docs/journal/`.\n\n1. **Le seul chemin de déploiement est `git push` → intégration continue.** Jamais `apply_migration` par MCP, jamais l'éditeur SQL, jamais la CLI en direct. Une migration appliquée à la main casse la CI pour tout le monde : `supabase db push` refuse dès qu'il voit une version absente du dépôt. *(REGISTRE `DOC-DEPLOY-1` et `-3`)*\n2. **Ne jamais mélanger documentation et code dans un même push.** Le 26/08, un push mixte n'a déclenché aucun workflow et une migration n'a pas été appliquée, **sans aucun rouge**. Vérifier en base après tout push censé appliquer une migration. *(REGISTRE `GOUV-9`)*\n3. **Toute migration qui crée une table dans `public` casse la sauvegarde suivante** tant que la table n'est pas inscrite dans `deploy/bg2-known-tables.txt`. La migration et les fichiers d'exploitation bougent ensemble. L'échec est silencieux : `altcha_consumed_challenges` a fait échouer toutes les sauvegardes pendant 36 heures.\n4. **Livrer des correctifs complets éprouvés sur un clone propre, ou des fichiers entiers.** Jamais « remplacez la ligne 42 ».\n5. **Dix locales en une seule passe.** Une clé ajoutée dans une seule langue casse le build, et c'est voulu. *(REGISTRE `DOC-I18N-1`)*\n6. **Jamais de secret au dépôt.** `deploy/.env` et `deploy/functions.env` sont ignorés par git ; la `SERVICE_ROLE_KEY` n'a sa place ni au dépôt, ni au front, ni dans un message.\n7. **Le runner d'intégration continue vit sur la machine du mainteneur.** Machine éteinte, rien ne se déploie. Ce n'est pas une panne, c'est l'état du projet — et c'est l'item **A3**.\n8. **Avant toute séance, récupérer l'état du dépôt distant.** Le 28/08, un clone en retard de 26 commits a produit la conclusion fausse que onze migrations tournaient en production sans exister au dépôt.\n9. **Trois familles de tâches ne s'automatisent pas** : les trois tables de revue du schéma `conv_backup`, la revue des doubles patronymes hispaniques (14 % de faux positifs mesurés), et le tri des sous-titres et diacritiques. Toute proposition de les mécaniser est une régression documentaire.\n10. **Avant d'inscrire une lacune, chercher la source qui l'infirme.** Sur sept erreurs analysées dans `PLAN_DE_MARCHE`, quatre venaient d'une source non lue.","pt":"Estas regras não são preferências. Cada uma foi paga por um incidente cujo rastro existe em `docs/journal/`.\n\n1. **O único caminho de implantação é `git push` → integração contínua.** Nunca `apply_migration` por MCP, nunca o editor SQL, nunca a CLI direto. Uma migração aplicada à mão quebra a CI para todo mundo: `supabase db push` recusa assim que vê uma versão ausente do repositório. *(REGISTRO `DOC-DEPLOY-1` e `-3`)*\n2. **Nunca misturar documentação e código num mesmo push.** Em 26/08, um push misto não disparou nenhum workflow e uma migração não foi aplicada, **sem nenhum vermelho**. Verificar no banco depois de todo push que deveria aplicar uma migração. *(REGISTRO `GOUV-9`)*\n3. **Toda migração que cria uma tabela em `public` quebra o backup seguinte** enquanto a tabela não estiver inscrita em `deploy/bg2-known-tables.txt`. A migração e os arquivos de operação andam juntos. A falha é silenciosa: `altcha_consumed_challenges` fez todos os backups falharem durante 36 horas.\n4. **Entregar correções completas testadas num clone limpo, ou arquivos inteiros.** Nunca «substitua a linha 42».\n5. **Dez locales numa só passagem.** Uma chave acrescentada em uma só língua quebra o build, e isso é intencional. *(REGISTRO `DOC-I18N-1`)*\n6. **Nunca um segredo no repositório.** `deploy/.env` e `deploy/functions.env` são ignorados pelo git; a `SERVICE_ROLE_KEY` não tem lugar nem no repositório, nem no front, nem numa mensagem.\n7. **O runner de integração contínua vive na máquina do mantenedor.** Máquina desligada, nada se implanta. Não é uma pane, é o estado do projeto — e é o item **A3**.\n8. **Antes de toda sessão, buscar o estado do repositório remoto.** Em 28/08, um clone atrasado em 26 commits produziu a conclusão falsa de que onze migrações rodavam em produção sem existir no repositório.\n9. **Três famílias de tarefas não se automatizam**: as três tabelas de revisão do esquema `conv_backup`, a revisão dos duplos sobrenomes hispânicos (14 % de falsos positivos medidos), e a triagem dos subtítulos e diacríticos. Toda proposta de mecanizá-las é uma regressão documental.\n10. **Antes de inscrever uma lacuna, procurar a fonte que a desmente.** De sete erros analisados em `PLAN_DE_MARCHE`, quatro vinham de uma fonte não lida."},"nonouvert":{"fr":"Trois choses ne sont pas au backlog, et il faut le dire pour que personne ne les y remette.\n\n**Les décisions actées au REGISTRE ne se rouvrent pas au détour d'une tâche.** `text` + `CHECK` plutôt qu'un type énuméré PostgreSQL, la casse naturelle en base avec le rendu calculé à l'affichage, l'absence de captcha hébergé par un tiers, l'opt-in strict de la lettre, le refus du paiement en ligne self-service, l'absence de hiérarchie à la Library of Congress pour les collectivités — ce sont des positions, pas des choix par défaut. Elles se rouvrent par une décision inscrite au REGISTRE, jamais par un correctif.\n\n**Les tâches de revue humaine ne deviennent pas des scripts.** Le SQL d'application des trois tables `conv_backup` est en commentaire, derrière une garde anti-écrasement. Le décommenter, le compléter, ou écrire un script qui passe `valide = true` en masse : non. C'est le plan de travail de l'Atelier autorités, pas un reste à liquider.\n\n**Les chantiers collectifs n'ont pas de date fixée par une seule personne.** La révision portugaise complète du thésaurus, le vocabulaire des questions LGBTQI+, la gouvernance du commun, le rapprochement avec leftove.rs et NORLA : leur calendrier ne s'écrit pas ici. Prétendre le fixer seul serait exactement l'erreur que ce projet cherche à ne pas commettre.","pt":"Três coisas não estão no backlog, e é preciso dizê-lo para que ninguém as recoloque nele.\n\n**As decisões registradas no REGISTRO não se reabrem de passagem numa tarefa.** `text` + `CHECK` em vez de um tipo enumerado PostgreSQL, a caixa natural no banco com a renderização calculada na exibição, a ausência de captcha hospedado por terceiros, o opt-in estrito da carta, a recusa do pagamento on-line self-service, a ausência de hierarquia à moda da Library of Congress para as coletividades — são posições, não escolhas por omissão. Reabrem-se por uma decisão inscrita no REGISTRO, nunca por uma correção.\n\n**As tarefas de revisão humana não viram scripts.** O SQL de aplicação das três tabelas `conv_backup` está comentado, atrás de uma guarda anti-sobrescrita. Descomentá-lo, completá-lo, ou escrever um script que passe `valide = true` em massa: não. É o plano de trabalho da Oficina de autoridades, não um resto a liquidar.\n\n**Os canteiros coletivos não têm data fixada por uma só pessoa.** A revisão portuguesa completa do tesauro, o vocabulário das questões LGBTQI+, a governança do comum, a aproximação com leftove.rs e NORLA: o calendário deles não se escreve aqui. Pretender fixá-lo sozinho seria exatamente o erro que este projeto procura não cometer."},"maintenance":{"fr":"Le backlog se maintient comme les précédents, avec une addition.\n\n1. Déplacer la version courante dans `docs/backlogs/archive/` en conservant son nom d'origine.\n2. Placer la nouvelle version à la racine de `docs/backlogs/`.\n3. Mettre à jour `docs/backlogs/INDEX.md` : version courante et ligne d'historique. *(La ligne du v32 y manque encore — c'est l'item **J2**.)*\n4. Si l'incrément porte une décision normative, inscrire l'identifiant au `REGISTRE_decisions.md`. Le backlog porte le travail à faire ; le registre porte ce qui fait foi.\n5. **Nouveauté du v34** : les deux versions linguistiques et la page consultable sont **engendrées** depuis `docs/backlogs/backlog-v34.json` par `scripts/build-backlog.cjs`. Ne modifiez jamais les `.md` à la main : ils seront écrasés. Modifiez le JSON, relancez `node scripts/build-backlog.cjs`, commitez les trois fichiers ensemble.\n\nSi cette mécanique gêne plus qu'elle n'aide, elle se jette sans dommage : les `.md` engendrés sont autonomes et le JSON peut être supprimé. C'est un outil, pas une doctrine.","pt":"O backlog se mantém como os anteriores, com um acréscimo.\n\n1. Mover a versão corrente para `docs/backlogs/archive/` conservando seu nome de origem.\n2. Colocar a nova versão na raiz de `docs/backlogs/`.\n3. Atualizar `docs/backlogs/INDEX.md`: versão corrente e linha de histórico. *(A linha do v32 ainda falta lá — é o item **J2**.)*\n4. Se o incremento traz uma decisão normativa, inscrever o identificador no `REGISTRE_decisions.md`. O backlog carrega o trabalho a fazer; o registro carrega o que faz fé.\n5. **Novidade do v34**: as duas versões linguísticas e a página consultável são **geradas** a partir de `docs/backlogs/backlog-v34.json` por `scripts/build-backlog.cjs`. Nunca modifique os `.md` à mão: serão sobrescritos. Modifique o JSON, rode de novo `node scripts/build-backlog.cjs`, commite os três arquivos juntos.\n\nSe essa mecânica atrapalhar mais do que ajudar, joga-se fora sem dano: os `.md` gerados são autônomos e o JSON pode ser apagado. É uma ferramenta, não uma doutrina."}},"clotures":{"intro":{"fr":"Ces entrées figuraient dans le v33, dans `ETAT-AVANCEMENT-multisessions`, dans `ETAT-lancement-consolide` ou dans les notes d'août. Elles sont closes, vérifiées le 29/08. Elles sont listées pour que personne ne les rouvre en croyant avoir trouvé un oubli.","pt":"Estas entradas constavam no v33, em `ETAT-AVANCEMENT-multisessions`, em `ETAT-lancement-consolide` ou nas notas de agosto. Estão encerradas, verificadas em 29/08. São listadas para que ninguém as reabra achando ter encontrado um esquecimento."},"rows":[["#25 · #33",{"fr":"Cotisations : cron d'expiration et test de blocage","pt":"Mensalidades: cron de expiração e teste de bloqueio"},{"fr":"Livrés le 03/07. Le cron `anarbib-membership-expiry-daily` tourne à 6 h 40.","pt":"Entregues em 03/07. O cron `anarbib-membership-expiry-daily` roda às 6h40."}],["#4",{"fr":"Les cinq livrables de la session de juin","pt":"Os cinco entregáveis da sessão de junho"},{"fr":"Intégrés le 03/07 (commit `cd5c7d967`). Attention : l'identifiant `#4` désigne deux objets différents selon le document — celui-ci et un item sans intitulé du v32.","pt":"Integrados em 03/07 (commit `cd5c7d967`). Atenção: o identificador `#4` designa dois objetos diferentes conforme o documento — este e um item sem título do v32."}],["#5",{"fr":"Performance du rapprochement à l'import","pt":"Performance do casamento na importação"},{"fr":"Volets A, B et C confirmés le 03/07 ; la rustine `statement_timeout=0` a été remplacée par une borne de 120 s (migration `20260703182035`). La ligne « toujours ouvert » d'`ETAT-AVANCEMENT` est fausse et corrigée par le fichier lui-même.","pt":"Partes A, B e C confirmadas em 03/07; o remendo `statement_timeout=0` foi substituído por um limite de 120 s (migração `20260703182035`)."}],["AR-1 · AR-2",{"fr":"Plancher de durée sur la connexion, retrait de Turnstile","pt":"Piso de duração no login, retirada do Turnstile"},{"fr":"Faits le 20/08. Turnstile est retiré côté client et serveur, **sans substitut** : sa réapparition serait une régression.","pt":"Feitos em 20/08. O Turnstile foi retirado do cliente e do servidor, **sem substituto**: sua reaparição seria uma regressão."}],["AR-3 · AR-4",{"fr":"Altcha auto-hébergé et anti-rejeu","pt":"Altcha auto-hospedado e antirreexecução"},{"fr":"Fonction déployée le 19/08, migration `altcha_anti_rejeu` appliquée le 20/08. Les notes qui les donnent « à mettre en œuvre » sont périmées.","pt":"Função implantada em 19/08, migração `altcha_anti_rejeu` aplicada em 20/08."}],[{"fr":"Crons RGPD n°6 et n°7","pt":"Crons RGPD n°6 e n°7"},{"fr":"« Désactivés — à clarifier »","pt":"«Desativados — a esclarecer»"},{"fr":"**Faux.** Les 36 jobs sont actifs. Entrée caduque.","pt":"**Falso.** Os 36 jobs estão ativos. Entrada caduca."}],[{"fr":"Trois crons de gouvernance","pt":"Três crons de governança"},{"fr":"« Désactivation volontaire ou oubli ? À trancher par la coordination »","pt":"«Desativação deliberada ou esquecimento? A decidir pela coordenação»"},{"fr":"Réactivés par `20260821070000` et `20260827080000`. Aucune décision n'est due.","pt":"Reativados por `20260821070000` e `20260827080000`. Nenhuma decisão está pendente."}],["login-with-identifier",{"fr":"Doublon de fonction Edge à supprimer","pt":"Duplicata de função Edge a suprimir"},{"fr":"**La fonction n'existe pas.** Seule `login` est déployée.","pt":"**A função não existe.** Só `login` está implantada."}],["fn_v2_set_reserva_linhas_workflow",{"fr":"Coexistence des signatures à 5 et 7 arguments","pt":"Coexistência das assinaturas de 5 e 7 argumentos"},{"fr":"**Une seule signature existe.** Et il n'y a plus aucun doublon de signature dans les quatre schémas applicatifs.","pt":"**Existe uma única assinatura.** E não há mais nenhuma duplicata de assinatura nos quatro esquemas aplicativos."}],["_backup_*_20260408",{"fr":"Tables de rebut à nettoyer","pt":"Tabelas de refugo a limpar"},{"fr":"Aucune n'existe dans `public`. Reste `backup_2026_05_07`, qui est l'item **B9**.","pt":"Nenhuma existe em `public`. Resta `backup_2026_05_07`, que é o item **B9**."}],["api.resolve_reader_card",{"fr":"Résolution de carte de lecture absente","pt":"Resolução de carteirinha ausente"},{"fr":"Livrée. Migration `20260821020000_resolve_reader_card_motif_neutre` appliquée le 21/08.","pt":"Entregue. Migração `20260821020000_resolve_reader_card_motif_neutre` aplicada em 21/08."}],[{"fr":"Plafond des PDF","pt":"Teto dos PDF"},{"fr":"« Relever de 300 à 500 Mo — un chiffre dans une migration, cinq minutes »","pt":"«Elevar de 300 para 500 MB — um número numa migração, cinco minutos»"},{"fr":"Fait le 20/08 (`plafond_pdf_500mo_recueils_illustres`).","pt":"Feito em 20/08 (`plafond_pdf_500mo_recueils_illustres`)."}],[{"fr":"Lot « vocabulaire des droits »","pt":"Lote «vocabulário dos direitos»"},{"fr":"« Douze fichiers posés sur disque, à commiter »","pt":"«Doze arquivos no disco, a commitar»"},{"fr":"Commité et appliqué le 20/08 (`vocabulaire_rights_status`). Reste la collision de nom, item **C10**.","pt":"Commitado e aplicado em 20/08 (`vocabulaire_rights_status`). Resta a colisão de nome, item **C10**."}],[{"fr":"Six migrations de conventions","pt":"Seis migrações de convenções"},{"fr":"« Écrites, jamais appliquées »","pt":"«Escritas, nunca aplicadas»"},{"fr":"**Dix-neuf migrations `conventions_*` appliquées le 21/08.** Le chantier est allé bien au-delà. Reste la revue humaine, item **C3**.","pt":"**Dezenove migrações `conventions_*` aplicadas em 21/08.** O canteiro foi bem além. Resta a revisão humana, item **C3**."}],[{"fr":"Collégialité de la promotion","pt":"Colegialidade da promoção"},{"fr":"« Migration écrite, non appliquée » + runbook en 11 étapes","pt":"«Migração escrita, não aplicada» + runbook em 11 etapas"},{"fr":"Appliquée le 26/08. Le runbook est caduc ; restent la répétition (**G3**) et la décision politique (**G2**).","pt":"Aplicada em 26/08. O runbook está caduco; restam o ensaio (**G3**) e a decisão política (**G2**)."}],[{"fr":"Périodiques P1 à P9","pt":"Periódicos P1 a P9"},{"fr":"« Neuf paquets à livrer »","pt":"«Nove pacotes a entregar»"},{"fr":"**Les neuf livrés les 27-28/08.** Reste la révision de la spec, item **D1**.","pt":"**Os nove entregues em 27-28/08.** Resta a revisão da spec, item **D1**."}],["notify-cross-library-digest",{"fr":"Fonction signalée absente du dépôt","pt":"Função apontada como ausente do repositório"},{"fr":"Présente, déployée, confirmée trois fois. **Ne rien supprimer.**","pt":"Presente, implantada, confirmada três vezes. **Não suprimir nada.**"}],["#PUBLIB · #FED · #ASSEMBLEIAS · #THES · #GAZ · #MOBILE (socle)",{"fr":"Macro-chantiers du v33","pt":"Macrocanteiros do v33"},{"fr":"Livrés et en production. À nuancer d'un point : plusieurs de ces circuits **n'ont jamais été empruntés** — c'est l'item **G1**, qui n'est pas une réouverture mais un constat d'usage.","pt":"Entregues e em produção. A nuançar num ponto: vários desses circuitos **nunca foram percorridos** — é o item **G1**, que não é uma reabertura mas uma constatação de uso."}],["npm ci",{"fr":"Réparation des dépendances locales","pt":"Reparo das dependências locais"},{"fr":"Fait le 27/08. `@supabase/auth-js` a retrouvé son point d'entrée. **Ne pas le rejouer sans raison.**","pt":"Feito em 27/08. `@supabase/auth-js` recuperou seu ponto de entrada. **Não reexecutar sem motivo.**"}],[{"fr":"Encart de soutien financier","pt":"Encarte de apoio financeiro"},{"fr":"« À rédiger dans les dix locales »","pt":"«A redigir nas dez locales»"},{"fr":"Publié le 26/08 (`47d23fa`). Liberapay en ligne, premier don reçu le 27/08. Registre public en place depuis le 27/08.","pt":"Publicado em 26/08 (`47d23fa`). Liberapay no ar, primeira doação recebida em 27/08. Registro público em vigor desde 27/08."}],["A5",{"fr":"Configuration git à deux URL de poussée","pt":"Configuração git com dois URLs de push"},{"fr":"**Déjà corrigé.** Constaté le 29/08 dans `.git/config` : `origin` ne porte qu'une seule URL de poussée (Codeberg) et GitHub est un remote nommé à part. Le correctif prévu après les quatre incidents du 19/08 a été appliqué. Il n'y a plus d'alias `git publish-app` : on pousse sur les deux remotes explicitement.","pt":"**Já corrigido.** Constatado em 29/08 em `.git/config`: `origin` traz um único URL de push (Codeberg) e o GitHub é um remote nomeado à parte. A correção prevista após os quatro incidentes de 19/08 foi aplicada. Não há mais alias `git publish-app`: empurra-se explicitamente para os dois remotes."}]]},"T":{"fr":{"toc":"Sommaire","intro":"Pourquoi une réécriture","howto":"Mode d'emploi","photo":"L'état réel au 29 août 2026","ecarts":"Écarts relevés entre le réel et l'écrit","calendrier":"Le calendrier contraint","regles":"Dix règles payées par un incident","chantiers":"Les chantiers","clotures":"Clôtures et entrées caduques","nonouvert":"Ce qui n'est pas au backlog","maintenance":"Maintenance de ce document","etat":"État vérifié au 29/08","quoi":"Ce que c'est","pourquoi":"Pourquoi ça compte","fini":"Ce qui compte comme fini","demande":"Ce que ça demande","dep":"Dépendances","refs":"Renvois","prio":"Priorité","statut":"État","charge":"Charge","dit":"Ce que dit la documentation","reel":"Ce que dit la base ou le dépôt","total":"items","colophon":"Colophon","lang_other":"Versão em português : `AnarBib-Backlog-2026-08-29-v34.pt-BR.md`"},"pt":{"toc":"Sumário","intro":"Por que uma reescrita","howto":"Modo de usar","photo":"O estado real em 29 de agosto de 2026","ecarts":"Desvios levantados entre o real e o escrito","calendrier":"O calendário restrito","regles":"Dez regras pagas por um incidente","chantiers":"Os canteiros","clotures":"Encerramentos e entradas caducas","nonouvert":"O que não está no backlog","maintenance":"Manutenção deste documento","etat":"Estado verificado em 29/08","quoi":"O que é","pourquoi":"Por que importa","fini":"O que conta como terminado","demande":"O que exige","dep":"Dependências","refs":"Remissões","prio":"Prioridade","statut":"Estado","charge":"Carga","dit":"O que diz a documentação","reel":"O que diz o banco ou o repositório","total":"itens","colophon":"Colofão","lang_other":"Version française : `AnarBib-Backlog-2026-08-29-v34.md`"}}};
let K = 'fr';
const st = { dom:'all', prio:'all', q:'' };
const L=(o,k)=>o&&typeof o==='object'&&!Array.isArray(o)?(o[k]??o.fr??''):o;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
const lab=(l,key)=>{const e=D[l].find(x=>x.key===key);return e?L(e.label,K):key;};

function bar(){
  const t=D.T[K];
  let h='';
  ['fr','pt'].forEach(l=>{h+='<button type="button" data-k="'+l+'" aria-pressed="'+(K===l)+'">'+l.toUpperCase()+'</button>';});
  h+='<span class="sep"></span>';
  h+='<button type="button" data-d="all" aria-pressed="'+(st.dom==='all')+'">'+(K==='fr'?'Tous':'Todos')+'</button>';
  D.domains.forEach(d=>{h+='<button type="button" data-d="'+d.key+'" aria-pressed="'+(st.dom===d.key)+'" title="'+esc(L(d.label,K))+'">'+d.key+'</button>';});
  h+='<span class="sep"></span>';
  h+='<button type="button" data-p="all" aria-pressed="'+(st.prio==='all')+'">'+(K==='fr'?'Toutes':'Todas')+'</button>';
  D.priorities.forEach(p=>{h+='<button type="button" data-p="'+p.key+'" aria-pressed="'+(st.prio===p.key)+'" title="'+esc(L(p.label,K))+'">'+p.key+'</button>';});
  h+='<input type="search" id="q" aria-label="'+(K==='fr'?'Chercher dans les items':'Buscar nos itens')+'" placeholder="'+(K==='fr'?'chercher…':'buscar…')+'" value="'+esc(st.q)+'">';
  document.getElementById('bar').innerHTML=h;
}

// Delegation posee une seule fois : la barre est reconstruite a chaque rendu,
// des gestionnaires attaches par bouton se perdraient au premier clic.
document.getElementById('bar').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b)return;
  if(b.dataset.k){ if(b.dataset.k===K)return; K=b.dataset.k; }
  else if(b.dataset.d!==undefined){ st.dom=b.dataset.d; }
  else if(b.dataset.p!==undefined){ st.prio=b.dataset.p; }
  else return;
  render();
});
document.getElementById('bar').addEventListener('input',ev=>{
  if(ev.target.id!=='q')return;
  st.q=ev.target.value; render();
  const e=document.getElementById('q');
  if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}
});

function match(i){
  if(st.dom!=='all'&&i.d!==st.dom)return false;
  if(st.prio!=='all'&&i.p!==st.prio)return false;
  if(st.q){const s=(i.id+' '+L(i.t,K)+' '+L(i.w,K)+' '+L(i.v,K)+' '+L(i.y,K)+' '+i.r.join(' ')).toLowerCase();
    if(!s.includes(st.q.toLowerCase()))return false;}
  return true;
}

function card(i){
  const t=D.T[K];
  let h='<article class="card '+i.p+'"><h4><span class="id">'+i.id+'</span>'+md(L(i.t,K))+'</h4>';
  h+='<div class="chips"><span class="chip pr">'+i.p+' · '+lab('priorities',i.p)+'</span>';
  h+='<span class="chip">'+lab('states',i.s)+'</span>';
  h+='<span class="chip">'+lab('efforts',i.e)+'</span>';
  i.sk.forEach(s=>{h+='<span class="chip">'+lab('skills',s)+'</span>';});
  h+='</div><dl class="f">';
  h+='<dt>'+t.etat+'</dt><dd>'+md(L(i.v,K))+'</dd>';
  h+='<dt>'+t.quoi+'</dt><dd>'+md(L(i.w,K))+'</dd>';
  h+='<dt>'+t.pourquoi+'</dt><dd>'+md(L(i.y,K))+'</dd>';
  h+='<dt>'+t.fini+'</dt><dd><ul>'+(L(i.f,K)||[]).map(f=>'<li>'+md(f)+'</li>').join('')+'</ul></dd>';
  h+='<dt>'+t.dep+'</dt><dd>'+md(L(i.dep,K))+'</dd>';
  h+='</dl><p class="refs">'+t.refs+' : '+i.r.map(r=>'<code>'+esc(r)+'</code>').join(' · ')+'</p></article>';
  return h;
}

function render(){
  const t=D.T[K];
  document.documentElement.lang = K==='fr' ? 'fr' : 'pt-BR';
  document.getElementById('eyb').textContent = K==='fr'
    ? 'AnarBib · état vérifié le 29 août 2026'
    : 'AnarBib · estado verificado em 29 de agosto de 2026';
  document.getElementById('ttl').textContent=L(D.meta.title,K);
  document.getElementById('sub').textContent=L(D.meta.subtitle,K);
  document.getElementById('mta').textContent=D.meta.date+' · '+D.items.length+' '+t.total
    +' · '+(K==='fr'?'remplace ':'substitui ')+D.meta.previous;
  bar();
  const shown=D.items.filter(match);
  let h='';

  if(st.dom==='all'&&st.prio==='all'&&!st.q){
    h+='<h2>'+t.photo+'</h2><p class="note">'+md(L(D.etat.photo_intro,K))+'</p>';
    D.etat.photo.forEach(g=>{
      h+='<h3>'+L(g.g,K)+'</h3><div class="tbl"><table class="photo"><tbody>';
      g.rows.forEach(r=>{h+='<tr><td>'+md(L(r[0],K))+'</td><td>'+r[1]+'</td><td>'+md(L(r[2],K))+'</td></tr>';});
      h+='</tbody></table></div>';
    });
    h+='<h2>'+t.ecarts+'</h2><p class="note">'+md(L(D.etat.ecarts_intro,K))+'</p>';
    Object.keys(D.etat.sens_labels).forEach(sens=>{
      const rows=D.etat.ecarts.filter(e=>e.sens===sens);
      if(!rows.length)return;
      h+='<h3>'+L(D.etat.sens_labels[sens],K)+'</h3>';
      rows.forEach(e=>{h+='<div class="ecart"><b>'+md(L(e.quoi,K))+'</b><span>'+t.dit+' — '+md(L(e.dit,K))+'</span><span>'+t.reel+' — '+md(L(e.reel,K))+'</span></div>';});
    });
  }

  h+='<h2>'+t.chantiers+' <span class="count">'+shown.length+' / '+D.items.length+'</span></h2>';
  if(!shown.length){ h+='<p class="empty">'+(K==='fr'?'Aucun item ne correspond.':'Nenhum item corresponde.')+'</p>'; }
  D.domains.forEach(d=>{
    const list=shown.filter(i=>i.d===d.key);
    if(!list.length)return;
    h+='<h3>'+d.key+' — '+L(d.label,K)+' <span class="count">'+list.length+'</span></h3>';
    h+='<p class="note">'+md(L(d.note,K))+'</p>';
    list.forEach(i=>{h+=card(i);});
  });

  if(st.dom==='all'&&st.prio==='all'&&!st.q){
    h+='<h2>'+t.clotures+'</h2><p class="note">'+md(L(D.clotures.intro,K))+'</p><div class="tbl"><table class="clot"><tbody>';
    D.clotures.rows.forEach(r=>{h+='<tr><td>'+md(L(r[0],K))+'</td><td>'+md(L(r[1],K))+'</td><td>'+md(L(r[2],K))+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  document.getElementById('main').innerHTML=h;
}
render();
</script>
