<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b32025" />
  <meta name="description" content="AnarBib — rede de bibliotecas libertárias" />

  <!-- Open Graph (aperçus de lien : WhatsApp, Signal, Telegram, Mastodon, etc.) -->
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AnarBib" />
  <meta property="og:title" content="AnarBib" />
  <meta property="og:description" content="Catálogos, contas e circulação em rede de bibliotecas libertárias" />
  <meta property="og:url" content="https://app.anarbib.org/" />
  <meta property="og:image" content="https://app.anarbib.org/img/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AnarBib — rede de bibliotecas libertárias" />

  <!-- Twitter / X Card (réutilisé par certains aperçus) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AnarBib" />
  <meta name="twitter:description" content="Catálogos, contas e circulação em rede de bibliotecas libertárias" />
  <meta name="twitter:image" content="https://app.anarbib.org/img/og-image.png" />

  <title>AnarBib</title>

  <!-- Icônes : favicon multi-tailles + apple-touch-icon haute résolution (PNG, basés sur l'emblème) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/img/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />

  <!-- PWA — manifest + capacités iOS (socle mobile, MOBILE Paquet 0) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AnarBib" />

  <!-- Preconnect Supabase pour gagner ~200-500ms sur le 1er fetch (TCP + TLS handshake en parallèle du parse JS) -->
  <link rel="preconnect" href="https://uflwmikiyjfnikiphtcp.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://uflwmikiyjfnikiphtcp.supabase.co" />
  <!-- Polices auto-hébergées (cf. src/styles/fonts.css). Preload des 2 fichiers critiques utilisés au premier rendu. -->
  <link rel="preload" href="/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Bitter-Regular.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <!-- GitHub Pages SPA fix : reconversion du path encodé par 404.html -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
